# TOML formatting decisions. Without this file every one of these is taplo's
# default by accident rather than by choice, and the first person to disagree
# has nothing to point at.
[formatting]
# Keys stay in the order they were written: mise.toml groups tools and tasks by
# meaning, and alphabetising would scatter each group's comments away from what
# they explain.
reorder_keys = false
align_entries = false
# Wide enough for the long `aqua:` pins and their trailing comments.
column_width = 100
array_trailing_comma = true
array_auto_collapse = false
allowed_blank_lines = 1
indent_tables = false
trailing_newline = true

# Bind `batten.toml` to the schema Batten ships (CLOUD-33).
#
# A schema that only sits in the tree is a build artifact; one a validator can
# reach is published. This rule is the reachable half for the repository that
# holds it: `taplo lint` picks it up through auto-config, and so does any editor
# with the Even Better TOML / taplo LSP — so a mistyped key is caught **where
# the config is edited**, not first at `batten check` time.
#
# Batten is consumer #1 in practice, not just in principle: its own
# `batten.toml` is validated by the schema it ships, which is what keeps the
# published artifact honest.
#
# A consumer repository writes the same rule against the released URL:
#
#   [[rule]]
#   include = ["batten.toml"]
#   [rule.schema]
#   url = "https://github.com/button-inc/batten/releases/latest/download/batten.schema.json"
#
# `path` here rather than that URL because this repo *is* the source: pointing
# at a release would validate the working tree against the last tag, so a config
# key added in an unreleased commit would read as invalid.
[[rule]]
include = ["batten.toml", "batten.example.toml", "crates/batten/src/starter.toml"]
[rule.schema]
path = "schema/batten.schema.json"

# `batten.local.toml` is a DIFFERENT surface, and binding it to the authority's
# schema was a live defect (CLOUD-239): the validator green-lit `min_batten_version`,
# which the loader refuses outright, and said nothing about `protected`, which the
# loader silently dropped. Both halves misled — one loudly, one worse.
#
# The override layer is now its own Rust type (`config::OverrideConfig`), so this
# schema is derived rather than hand-narrowed, and `mise run schema-check` diffs
# it byte-for-byte like the authority's. A key this schema accepts is a key the
# loader honours; every other key is a parse error naming itself.
#
# It is published beside the authority's, so a consumer writes the matching rule
# for the file they actually hand-edit most:
#
#   [[rule]]
#   include = ["batten.local.toml"]
#   [rule.schema]
#   url = "https://github.com/button-inc/batten/releases/latest/download/batten.local.schema.json"
#
# `path` here for the reason the rule above gives: this repo is the source, so a
# released URL would validate the working tree against the last tag.
[[rule]]
include = ["batten.local.toml"]
[rule.schema]
path = "schema/batten.local.schema.json"
