[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/button-inc/batten"
homepage = "https://github.com/button-inc/batten"
authors = ["Button Inc."]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Byte-stable machine output and explicit error handling are product requirements.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true

# Faster incremental builds for the compile-heavy fmt -> lint -> test hook chain.
[profile.dev]
debug = 1

# The profile the distributed single binary is built with: maximal optimization
# and the smallest artifact. Distinct from `release` (used for local/dev release
# builds) so day-to-day `cargo build --release` stays fast.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = true
