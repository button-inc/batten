[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.141"
edition = "2024"
# A DERIVED COPY of `mise.toml [tools] rust`, not a compatibility promise
# (CLOUD-593). Batten ships compiled binaries and its source is public so the
# community can maintain those binaries; nobody consumes the crate as a library
# and nobody obtains it by compiling, so there is no consumer audience for a
# floor to protect. What the declaration still does is feed Cargo's MSRV-aware
# resolution, keeping the graph inside what we actually build with — self-
# protection, and the honest value for that is the compiler we actually use.
# `msrv-pin-agreement` holds it equal to the pin; raise the pin, not this.
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/button-inc/batten"
homepage = "https://github.com/button-inc/batten"
authors = ["Button Inc."]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# The other half of the spawn census (CLOUD-743), and it carries its own severity
# for the same reason `disallowed_types` below does.
#
# `#[expect]` is chosen over `#[allow]` precisely so a DELETED spawn with a stale
# annotation is red too — the census self-cleans in both directions, where a count
# table catches additions only. But this lint is warn-by-default, so that second
# direction rested entirely on `mise run lint:clippy`'s `-D warnings`. Measured on
# a scratch crate (`tests/spawn-census.bats`): at the default level, an `#[expect]`
# over code with no spawn left is a WARNING and the run exits 0. Half a gate.
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Byte-stable machine output and explicit error handling are product requirements.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
# The spawn census (CLOUD-743). `clippy.toml` says WHICH types; this says how
# hard. `deny` rather than `warn`, and that distinction is the whole gate: every
# other lint above is promoted to an error only by `mise run lint:clippy`'s
# `-D warnings`, so a lint left at `warn` here reports clean under
# `mise exec -- cargo clippy -p batten --all-targets` — the escape
# `no-bare-cargo`'s own refusal text recommends, measured by CLOUD-822 missing 10
# `expect_used` errors for exactly this reason. A gate whose verdict depends on
# which sanctioned invocation ran is not a gate, so this one carries its own
# severity. `crates/batten/tests/spawn_census.rs` asserts the level.
disallowed_types = "deny"
# The runtime-shape bound (CLOUD-747) and the delay inventory (CLOUD-1177),
# denied here for the same reason and configured in the same file.
#
# NO LONGER INERT, and the sentence that said so is retired rather than kept.
# It read "inert until an HTTP client puts tokio in the closure, which is exactly
# when it needs to already be written down" — true of the one row this table then
# carried, and false of the table as a whole the moment `std::thread::sleep`
# joined it. That row resolves in every build and refuses 13 live sites unless
# each carries its verdict, so this level is load-bearing today rather than
# written down against a future.
disallowed_methods = "deny"

[workspace.dependencies]
anyhow = "1"
# The HTTP client (CLOUD-745), and it is NOT `reqwest` -- which that row names,
# so the substitution is recorded there rather than made quietly here.
#
# MEASURED 2026-08-28, four configurations, activated edges on
# `aarch64-apple-darwin`. Every `reqwest` one hits one of the two chokepoints
# CLOUD-320 died at:
#
#   0.13, public rustls features   -> `security-framework` (link fail)
#   0.13, private `__rustls`       -> resolves, DOES NOT COMPILE: the source
#                                     references `rustls_platform_verifier`
#                                     unconditionally on that path
#   0.12, `rustls-tls-manual-roots`-> `ring` genuinely activated (link fail)
#   hyper + hyper-rustls           -> both clear
#
# `ring` arrives by rustls FEATURE UNIFICATION -- reqwest, hyper-rustls and
# tokio-rustls each enable `rustls/ring`, and 0.12.28 carries no no-provider
# variant -- so it cannot be switched off from here while reqwest is in the
# graph. Dropping below reqwest is what makes the verifier and the provider
# CALLER CHOICES instead of features, which is the whole of why this links.
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = [
  "client-legacy",
  "http1",
  "http2",
  "tokio",
] }
hyper-rustls = { version = "0.27", default-features = false, features = [
  "http1",
  "http2",
  "webpki-tokio",
  "tls12",
] }
http-body-util = "0.1"
# The connector trait `hyper-rustls` wraps. Already in the closure through
# `hyper-util`'s own client-legacy feature, so naming it directly adds no node --
# it is what lets `fetch.rs` supply a CONNECT-tunnelling connector rather than
# `HttpConnector` bare, which is how a proxied environment is reached at all.
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
# The certificate type, for reading the CA bundle an operator names in
# `SSL_CERT_FILE`. Already in the closure under `webpki-roots`; the `pem` feature
# is what makes a bundle readable without a second PEM parser.
rustls-pki-types = { version = "1", features = ["std"] }
# THE PROVIDER, and it is the half a link gate cannot ask about: with no provider
# in the graph the binary links clean and fails at the first handshake. Pure
# Rust, no `links` key -- the candidate CLOUD-745 named and its table never
# evaluated.
rustls-graviola = "0.4"
# Vendored roots, so the platform trust store never enters the graph. Also makes
# the fetch reproducible across hosts, which suits a checksum-pinned provisioner
# better than the platform store does.
webpki-roots = "1"
# CURRENT-THREAD ONLY, and `clippy.toml` already refuses the multi-thread builder
# (CLOUD-747): measured out of tree, current-thread costs +0.14ms over
# constructing none where multi-thread costs +1.68ms and grows a worker per core,
# for a workload that is one call's IO with nothing to steal.
tokio = { version = "1", default-features = false, features = [
  "rt",
  "net",
  "time",
  # The CONNECT handshake reads and writes the proxy's response by hand, one
  # byte at a time, because over-reading the header would swallow the first TLS
  # record. `io-util` is those two extension traits and nothing else -- notably
  # NOT `rt-multi-thread` or `signal`, which `spawn_census.rs` holds off.
  "io-util",
] }
# `env`: a flag whose env equivalent is applied by clap rather than layered by
# the §8 resolver (`--config-from`) needs Arg::env (CLOUD-31).
clap = { version = "4", features = ["derive", "env"] }
# Shell completions, derived from the same `clap::Command` tree the parser is
# built from (CLOUD-27) — so a committed script cannot describe a surface the
# binary does not have.
clap_complete = "4"
# Man pages, derived from the same `clap::Command` tree (CLOUD-69). The clap
# ecosystem's own roff renderer, adopted rather than rebuilt: roff is a format
# with real escaping rules, and a hand-rolled emitter would be a second place
# for the surface to be described. Same license family as clap itself
# (MIT OR Apache-2.0), so `deny.toml`'s allow-list already covers it.
clap_mangen = "0.3"
# Per-OS base directories: XDG on Linux/macOS (honours XDG_DATA_HOME), the
# roaming known folder on Windows — the CLOUD-23 state-path rule, one crate.
etcetera = "0.11"
# Secret-class identity inputs are HMAC-keyed (CLOUD-123): an unkeyed digest of a
# matched secret is an offline-guessing oracle, because secrets are often
# low-entropy and a journalled hash cannot be expunged.
#
# MOVES WITH `sha2` BELOW, ALWAYS. `hmac` and `sha2` each pull a `digest`, and the
# constructor `keyed_span` calls lives on a trait that moved between `digest`
# majors — so bumping one without the other splits our own two crates across two
# `digest` lines and the workspace stops compiling. `digest-major-agreement`
# decides this over the committed `Cargo.lock`; it is not a comment you have to
# remember.
#
# WHAT THIS PIN IS *NOT* DEFENDING, corrected 2026-08-20 (CLOUD-767). It used to
# say the older line kept "two majors of the same hashing substrate" out of the
# tree. That has been false since `gix` arrived: `gix-hash` pulls `sha2 0.11` and
# therefore `digest 0.11`, so both majors are already vendored whatever we pin. A
# lockfile grep is the whole proof, and the claim survived unchallenged only
# because it was prose — which is the argument for the gate above being a gate.
hmac = "0.13"
# The 32 bytes behind that HMAC key (CLOUD-59). A dependency rather than a
# `/dev/urandom` read because the workspace forbids `unsafe` and supports
# Windows, so the alternative is two hand-written platform paths for the one
# thing that must not be got subtly wrong — and because this crate is already in
# the tree transitively, so adopting it directly adds no vendored code at all.
# `getrandom::fill` is the OS CSPRNG (`getrandom(2)`, `arc4random_buf`,
# `ProcessPrng`) and never a userspace PRNG: a key derived from a seeded
# generator is a key an attacker can re-derive. `rand` was the alternative and is
# strictly more surface for the same 32 bytes — distributions, generators and a
# reseeding policy this needs none of.
getrandom = "0.4"
# The JSON Schema for `batten.toml`, derived from the config types themselves
# (CLOUD-33) — never hand-authored, so the schema cannot describe a config the
# binary does not accept.
schemars = "1"
# Test-only: validates the committed configs against the derived schema, so the
# published artifact is asserted to accept what the binary accepts.
# default-features = false drops resolve-http (reqwest + rustls + aws-lc-rs) —
# the schema is local, and a validator must never fetch over the network anyway.
# JSON5 — the fourth document format (CLOUD-772). Adopted rather than
# hand-rolled for the reason the issue is filed on: comments, trailing commas
# and unquoted keys are what every ad-hoc brace-depth state machine over such a
# file gets wrong, and a reader that mis-parses reports agreement. It parses
# straight into `serde_json::Value`, which is already vendored, so the document
# tree gains no second value type.
json5 = "1.0"
jsonschema = { version = "0.51", default-features = false }
# Snapshot testing (CLOUD-106). `default-features = false` drops insta's own
# colour and glob machinery: the suite compares bytes and reports through
# nextest, so a diff renderer is weight for a reader who never sees it.
insta = { version = "1", default-features = false }
# Inline fixtures for the snapshot cases, so a multi-line expectation reads as
# the block it is rather than as escaped `\n`s.
indoc = "2"
# The BPE tokenizer the verdict vocabulary is measured against (CLOUD-1284's arm
# 4). DEV-ONLY, and that placement is the whole of why it is affordable.
#
# `budget.rs` estimates bytes/4 on purpose -- "an exact count needs a tokenizer,
# a vocabulary and a network fetch, and a budget gate that fails because a
# download failed is worse than one 10% out" -- and `batten hook` runs on every
# mediated tool call under CLOUD-689's budget. A tokenizer in the SHIPPED binary
# would put an embedded merge table on the config-load path and contradict both.
# A tokenizer in the TEST binary contradicts neither: the vocabulary is a fixed
# table in `batten.toml`, so its token counts are a property of the commit, and
# the one place that property has to hold is a gate that reads the commit.
#
# So arm 4 is enforced where it is decidable and costs nothing at runtime. The
# pin it measures under is declared as data beside the vocabulary, never baked in
# here -- `bench/tokens/method.toml`'s discipline for its byte divisor.
tiktoken-rs = "0.12"
# `min_batten_version` comparison. Cargo's own flavour of SemVer, so the config
# key means what a Rust consumer already expects it to.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# In-process git (CLOUD-320's `git.rs` row, resolved to in-process). `gix` and
# not `git2`: `libgit2-sys` declares a `links` key, which `macos-link-check`
# rule 1 excludes outright — libgit2 on macOS needs CoreFoundation and Security,
# and zig can only cross-link a Darwin framework given a real SDK
# (ziglang/zig#1349, whose documented workaround is SDKROOT). That is an
# Apple-SDK decision priced by the private-repo runner multiplier, not a
# constraint of the code, and it is not one a `git.rs` change gets to make.
#
# `default-features = false` and three features is the minimum for what this
# module asks: resolve a revspec, peel it, walk a tree, read a blob. What is
# left off is the whole network half — `gix`'s default pulls transports and
# credential helpers, and a library that can fetch has no business inside a gate
# that must be offline and byte-stable.
#
# Both hash features are load-bearing rather than belt-and-braces. `gix-hash`
# gates each variant of its `Kind` enum on the matching feature, so with neither
# selected the enum has NO variants and the crate does not compile — measured
# here, 16 errors from `darwin-link` before they were added. `sha256` joins
# `sha1` because this module already contemplates both: `PatchId::parse` accepts
# a 64-hex id precisely so a SHA-256 repository is readable, and a git library
# that can only open half the repositories git can is not a replacement for
# shelling out.
#
# The zlib backend needs no pinning here, unlike `flate2` above: gix always uses
# zlib-rs now — its own `max-performance` is a bare alias for
# `max-performance-safe` — so there is no C backend to select away from and no
# `links` key to trip `macos-link-check` rule 1.
#
# `merge` is the rebase half (CLOUD-1274's successor campaign), and it is what
# makes `batten` able to replay a branch onto a moved base without spawning
# `git`. IT ACTIVATES `gix-diff/blob`, which the `gix-diff` line below spent four
# paragraphs declining, so that decision is amended in place there rather than
# left standing as a claim this line falsifies.
#
# `worktree-mutation` and `parallel` were BOTH tried and BOTH withdrawn, recorded
# here so the next author does not re-run the experiment. `worktree-mutation`
# buys `gix-worktree-state::checkout`, whose `Find` bound is `Send + Clone`
# unconditionally while this crate's `OwnShared` resolves to `Rc`; `parallel` is
# the feature that would make it `Arc`, and enabling it did not move the bound in
# this build. `gitwrite::update_worktree` writes the changed paths itself
# instead, through the filter pipeline `merge` already brings, so neither feature
# is carried for a call that cannot be made.
#
# Measured on this container against the feature set without it: **11 activated
# packages added** — `gix-merge`, `gix-imara-diff`, `gix-worktree`,
# `gix-attributes`, `gix-ignore`, `gix-pathspec`,
# `gix-submodule`, `gix-filter`, `dashmap`, `hashbrown`, `io-close`. No
# `FRAMEWORK_CRATES` name, no `AMBIENT_CRATES` name, and no new `links` crate;
# `macos-link-check` and `deny` both pass. `gix-command` was ALREADY activated
# here before this change, through `gix-transport` ← `gix-protocol`, so the
# spawn-capable crate is not new and `no_second_git_invoker_exists` claims
# exactly what it proves: that THIS crate's source names no `git` to spawn.
#
# What IS new is `gix-filter`, and it is worth naming because it can run a
# repository-configured clean/smudge driver. That is correct for the surface it
# is bought for — writing a rebased tree into a worktree, where honouring the
# repository's filters is what git itself does — and it is not on any gate's
# path: the patch identity still reads blobs from the odb and diffs them with
# `imara-diff` taken directly, exactly as the block below describes.
gix = { version = "0.87", default-features = false, features = [
  "revision",
  "sha1",
  "sha256",
  "merge",
] }
# The TREE half of the in-process patch identity (CLOUD-739): which paths a
# commit changed, and the blob ids on each side. Already resolved here at this
# exact version as a non-optional dependency of `gix` itself, so naming it
# directly adds nothing to the closure — it makes reachable what was already
# linked.
#
# `default-features = false` USED TO BE THE WHOLE POINT, and it no longer decides
# anything, which is stated rather than quietly dropped. Cargo unions features
# across every activation, so `gix/merge` above pulls `gix/blob-diff` and with it
# `gix-diff/blob` — the nine `dep:` entries this line spent its life declining.
# Setting `default-features = false` here still says what this crate ASKS for and
# is still the honest spelling, but it is no longer what keeps `blob` off: nothing
# does, since the rebase surface needs it.
#
# `pub mod tree` is ungated, so the tree half still costs nothing; what changed is
# that the blob half is no longer bought separately, because it is no longer
# avoidable.
gix-diff = { version = "0.67", default-features = false }
# The diff algorithm behind the in-process patch identity (CLOUD-739). Hunks in,
# nothing else: it takes two byte slices and returns the edit script. No
# filesystem, no process, no threads, no global state.
#
# TAKEN DIRECTLY RATHER THAN THROUGH `gix/blob-diff`, and that decision now
# survives on ONE of its two original reasons rather than both — recorded that
# way because a reason that has died is worse than no reason at all.
#
# The DEPENDENCY-COST half is gone. It read: `gix-diff`'s `blob` feature is
# monolithic — nine `dep:` entries, no sub-features — and eight of them exist to
# reproduce git's full diff pipeline (`gix-command` runs external diff drivers,
# `gix-filter` runs clean/smudge filters, `gix-worktree`/`gix-tempfile`/`gix-fs`
# materialise blobs to disk so those external programs can read them), so
# enabling it links the machinery whose purpose is to shell out and to touch the
# worktree. Every one of those crates is activated in this closure today, because
# `gix/merge` above needs the rebase to honour the repository's filters. Nothing
# is saved by declining it here any more.
#
# The CORRECTNESS half stands, and it is why this dependency is still named
# directly: what a gate reads must not be reconfigurable by the repository it
# reads. The implementation being replaced pins 20 `git config` keys for the sole
# purpose of stopping the host's configuration changing the answer; a diff layer
# that honours `diff.<driver>.command` would hand that back. An identity a
# repository can reconfigure is not an identity — and that is true whether or not
# the driver machinery happens to be linked, which is exactly why this half
# outlives the other. The rebase is the opposite case and takes the opposite
# answer: a worktree write SHOULD honour the repository's filters, because git's
# own does.
#
# Blob CONTENTS reach it through gix's object database — the access CLOUD-738
# landed — so this adds no filesystem path of its own.
#
# Closure measured in a scratch crate outside this tree, so measuring it did not
# vendor the thing being decided: `foldhash`, `hashbrown`, `memchr`, all three
# already resolved here. Apache-2.0, already in `deny.toml`'s allow-list.
imara-diff = { version = "0.2", default-features = false }
# Git's pkt-line framing, for the landing lease's compare-and-swap (CLOUD-1274).
#
# `blocking-io` IS THE WHOLE FEATURE SET, and what it does NOT pull is the point:
# the framing and nothing else — no HTTP client, no TLS backend, no credential
# helper. It is the same closure `gix-transport/blocking-client` resolves to,
# taken directly because the transport it would have supplied is not one this
# crate can use: the bytes go over `crate::fetch`, the hyper + rustls client
# CLOUD-745 already vendored and bounded, and the two protocol exchanges the
# lease needs are a POST each.
#
# TAKEN RATHER THAN HAND-ROLLED for the reason `.claude/rules/policy-modules.md`
# gives one domain over: a second parser is a second AUTHORITY, and the two can
# disagree about a quoting or truncation case neither author had in mind. The
# framing this repository reads is the framing gix reads.
#
# MEASURED, because every other route to a push is refused by a gate in this tree
# (`cargo metadata`, scratch crate outside this tree so measuring it vendored
# nothing):
#
#   * gix's own transports pull `reqwest` — barred by `AMBIENT_CRATES` — plus
#     `security-framework` and `core-foundation`, both `FRAMEWORK_CRATES` names,
#     and `ring`/`aws-lc-sys` `links` crates. 265 packages.
#   * `git2`/libgit2 cannot push without its `https` feature, and every config
#     that carries it resolves `openssl-sys`, a `FRAMEWORK_CRATES` name that
#     `macos-link-check` rule 2 refuses BY NAME with no vendored exemption.
#     `vendored-openssl` does not help. Adopting it would mean retiring
#     `macos-link-check` itself, which is `governed_at_head` and so cannot be
#     edited at all.
#   * gix cannot push: `gix-protocol` ships `fetch`, `handshake` and `ls_refs`,
#     and the only `push` symbols in gix are `push_url()` config setters.
#
# This combination resolves NO `FRAMEWORK_CRATES` name, NO `AMBIENT_CRATES` name
# and no new `links` crate — `defmt` is the only `links` entry and it is already
# in this lockfile today, unactivated.
gix-packetline = { version = "0.22", default-features = false, features = [
  "blocking-io",
] }
# The policy evaluator (CLOUD-647, CLOUD-689). A `policy` row hands a REGISTERED
# Rego module the resolved fact set and reads back denials; the module decides,
# the engine never acquires. That is what CLOUD-763 admitted to `MediatedCall`
# when it re-axed `scopes` on ambient authority rather than authorship: a
# `command` row spawns a process that can read any file and reach the network,
# while an evaluator over supplied `Facts` sees the fields the boundary resolved
# and nothing else. The fact set IS the bound, which is why it had to exist
# first.
#
# `default-features = false` is load-bearing, not tidiness. The default
# `full-opa` pulls `http` and `jsonschema`; consumer-authored policy with
# network reach anywhere near the mediated path is a hole, and the feature list
# is where it is closed. This set resolves a 41-package closure from the
# `regorus` node carrying none of `reqwest`, `jsonschema`, `hyper`, `rustls`,
# `openssl-sys`, `native-tls`, `ring`, `globset` or `glob` — so nothing in it
# declares a `links` key and `macos-link-check` rule 1 is cleared without an
# exception.
#
# THAT SENTENCE IS NO LONGER A PROMISE (CLOUD-831). `mise-tasks/evaluator-.sh
# closure-check` re-runs it on every gate invocation, and the `[[rule]]` row
# `evaluator-closure-io-free` in `batten.toml` is what makes a firing a refusal.
# The nine names live in the gate rather than being restated here a third time —
# `mise-tasks/rules-drift.sh`'s lesson is that a constant copied with nothing
# holding the copies in agreement drifts, and this comment's own package count
# was the proof: it read 45, measured 2026-08-20 by hand, against a graph that
# resolved otherwise the same week.
#
# THE COUNT IS THE GATE'S OUTPUT, and its method is part of the number. 41 is
# the ACTIVATED closure — optional dependencies nothing enabled are excluded,
# the correction `macos-link-check` already made after refusing a link over a
# dormant `defmt`. The whole resolve from the same node is 46 and `Cargo.lock`'s
# union is 56; all three are "the closure" under different readings, which is
# exactly why the method is stated. Re-read it with `mise run
# evaluator-closure-check`, never by hand.
#
# The count is REPORTED and never asserted. Which of the nine are absent is a
# property of this commit and is gated; how many packages upstream resolves to
# is a property of the world, and gating it would fire on every legitimate bump
# (`mise-tasks/lock-complete.sh`'s split, applied here).
#
# `coverage` is not optional either, and not for reporting. Regorus refuses a
# conflict or a recursion at EVALUATION, never at `add_policy` — five cases,
# measured — so a conflict on a path no query exercises is silently unreported.
# Whole-set analysis therefore has to prove its sweep reached every rule, and
# this feature is what makes that provable rather than asserted.
#
# `arc` because a resolved policy is shared across the rule loop rather than
# cloned per row.
#
# `ast` is CLOUD-835's, and it costs the closure NOTHING — the same measured
# argument recorded for `probe-evaluator-io`/`http` above, re-taken for this
# feature on 2026-08-21. Upstream declares `ast = []`: a bare feature naming no
# package, so `Cargo.lock` is byte-identical with it on or off and
# `evaluator-closure-check`'s walk reports the same closure. It gates one
# `#[cfg]` on `Engine::get_ast_as_json` plus the `serde::Serialize` derives on
# the AST types behind it, and nothing else.
#
# WHY IT IS LOAD-BEARING RATHER THAN CONVENIENT. `policy test` has to enumerate
# a module's `test_` rules BY NAME, and a rule name is the one thing the `data`
# document cannot supply: an unsatisfied Rego body evaluates to **undefined**,
# which is how a test ordinarily fails, so a suite read off what the package
# evaluates to is blind to exactly the tests that failed. The alternative route
# to the same three facts is `regorus::unstable`'s `get_modules()` — an AST walk
# through a module upstream marks `#[doc(hidden)]` and "likely to change". This
# is the stable spelling of the same read, for one bare feature.
#
# `regex` (CLOUD-864), and the closure argument re-taken a third time rather than
# assumed to carry. Upstream declares `regex = ["dep:regex"]` at `1.12.3`, and
# THIS WORKSPACE ALREADY DEPENDS ON `regex = "1"` DIRECTLY — so activation adds a
# dependency edge and no package: one crate, one version, nothing new to audit,
# and none of the names `evaluator-closure-check` refuses. Cargo.lock is not
# byte-identical the way `ast` is (regorus's entry gains the edge), which is the
# honest difference and the reason this is stated instead of folded into the
# sentence above. `regex` performs no I/O, so `no_evaluator_feature_admits_io`
# holds unchanged.
#
# WHY A POLICY MODULE NEEDS IT. `shell-hygiene`'s `sibling-resolves` decides over
# `input.tree.lines` — raw text, because the thing it judges is a path a shell
# ASSEMBLES at run time and no parser produces a node for it. Without the regex
# builtins the only way to extract a capture from a line is a character-index
# walk written in Rego, which is a parser hand-rolled in a policy language: more
# code, in the harder place to review, to avoid a feature that costs a lockfile
# edge. The first tree-scoped preset was written string-only and hit the wall on
# the second rule, which is when this was reconsidered.
#
# `semver` IS NOT HERE, AND THAT IS THIS ROW'S OWN RULE APPLIED TO ITSELF. It
# was added beside `regex` on the reasoning that version-comparison gates will
# want it — and no module in the tree calls it. A feature nothing calls is
# `input.tree.tracked` documented and never built (CLOUD-845): it reads as a
# capability, it is checked by nothing, and the first consumer discovers whether
# it actually works. So it lands with its first consumer rather than ahead of
# one. The measurement is recorded on CLOUD-885 either way — `semver` is
# `dep:semver` alone and cleared both gates — so re-adding it costs a line, not
# a re-derivation.
#
# `glob` IS REFUSED BY CONSTRUCTION, not by preference, and stating it here is
# what stops it being re-litigated as an oversight: `glob = ["dep:globset"]`, and
# `globset` is one of the nine names `evaluator-closure-check` decides on. The
# gate that defends the security claim already answers this. A module needing
# path matching takes it from the row's `sources` glob (CLOUD-850), resolved by
# the engine outside the module — which is the better shape anyway, since the
# engine bounds acquisition by declaration.
#
# `time` IS DEFERRED, AND THE BLOCKER IS UPSTREAM'S DECLARATION rather than this
# pin (CLOUD-885). `time = ["dep:chrono", "dep:chrono-tz"]` and regorus declares
# both with `default-features = true` — every published version carrying the
# feature does, checked against the index. chrono's default `clock` reaches
# `iana-time-zone`, which on Apple targets reaches `core-foundation-sys`, which
# `macos-link-check`'s `FRAMEWORK_CRATES` names; enabling it fails that gate at
# exit 1 on exactly that crate. Cargo's feature unification is ADDITIVE, so a
# direct `chrono = { default-features = false }` here would not subtract what
# regorus requested — this is not fixable from our manifest. CLOUD-885 carries
# the re-open predicate as a command.
#
# `semver` IS NOT HERE, on the same rule (CLOUD-885): no module calls it, and a
# feature nothing calls is `input.tree.tracked` documented and never built
# (CLOUD-845). It lands with its first consumer.
regorus = { version = "0.11", default-features = false, features = [
  "ast",
  "std",
  "arc",
  "coverage",
  "regex",
] }
# OS advisory locks (flock/fcntl/LockFileEx) for the findings store's shard-merge
# (CLOUD-78). A crate rather than the syscall directly because the workspace
# forbids `unsafe`; the `sync` default feature is the blocking/try-lock file API.
# Advisory locks are load-bearing over a bare lockfile: they auto-release when the
# process dies, and the ambient ~2-minute foreground kill would otherwise strand a
# lockfile and brick the store repo-wide.
#
# The blocking choice is the concurrency posture's, stated once in
# `.claude/rules/rust.md` (CLOUD-747); this note cites it rather than re-deriving
# it, which is what five independent derivations of one stance cost.
fs4 = "1.1"
# The two halves of owning a dispatched process tree (CLOUD-427), and they are
# two crates because no one crate offers both halves safely.
#
# `rustix` asks and tells: `getsid`/`getpid` decide whether Batten is the session
# leader, and `kill_process_group` is the teardown. Already in the tree
# transitively under `fs4` above, so the direct declaration vendors nothing new —
# it only stops the version being decided by a transitive edge. `process` is the
# one feature this needs; the default `std`/`use-libc-auxv` come with it.
rustix = { version = "1.1", features = ["process"] }
# `signal-hook` receives. Installing a disposition is `sigaction(2)`, which
# `unsafe_code = "forbid"` puts out of reach, and rustix's own spelling lives
# behind its private `runtime` feature — so a safe registry is not a convenience
# here, it is the only route. `iterator` is the blocking `Signals` stream a
# dedicated forwarding thread reads — blocking and a thread per the concurrency
# posture in `.claude/rules/rust.md`, not a separate decision (CLOUD-747), and
# `tokio::signal` is banned in `clippy.toml` so a second signal source cannot
# arrive alongside it; the default `channel` feature underneath it
# is what makes the delivery async-signal-safe, which a hand-written handler
# writing to a `Vec` would not be. mise's supervisor reaches for the same crate
# for the same reason, so the two ends of the pgroup protocol are implemented
# against one set of semantics (CLOUD-455 is the prior-art gate).
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
# The tree walk (CLOUD-214), adopted rather than rebuilt. ripgrep's own walker,
# so gitignore semantics are the ones every contributor already has in their
# head — and, measured on this repository after one `cargo build`, 8891 of the
# 9221 paths the hand-rolled walk yielded were ignored `target/` artifacts. A
# walk that reads 96% build output is not a policy input set.
# default-features = false drops the `walk` parallel iterator: the serial walk is
# what keeps `tree_files` byte-stable without a merge step. It **stays serial
# because nothing measured asks otherwise** — `batten check` over this repository's
# 654 tracked files is p50 8.67ms against a 5.08ms process-start floor, on a 100ms
# budget (CLOUD-747, measured 2026-08-21; the profile is in
# `.claude/rules/rust.md`, which is the one authority for this posture). Turning
# the walker on means owning a deterministic merge to buy §6 byte-stability back,
# and there is nothing here for it to buy that back with.
#
# UNCAPPED SINCE CLOUD-593. It carried `<0.4.30` because 0.4.30 uses `let` chains
# (Rust 1.88) while declaring NO `rust-version`, so MSRV-aware resolution took it
# happily and the build failed inside the vendored crate — a cap Cargo could not
# derive, so it had to be written. At a floor equal to a current pin nothing in
# the graph is excluded and the cap has nothing left to exclude. `cap-drift` is
# the ratchet that keeps this in step with `renovate.json5`'s `allowedVersions`
# if a cap ever comes back.
ignore = { version = ">=0.4.23", default-features = false }
# The glob matcher the same lineage ships (CLOUD-214), replacing a hand-rolled
# recursive matcher with exponential worst-case behaviour and no character
# classes, braces or negation. Compiled once per pattern rather than re-parsed
# per path, which is what makes the selection cost linear in the tree.
#
# Uncapped with `ignore` above (CLOUD-593). Its bound was belt-and-braces rather
# than load-bearing — this crate's 0.4.20 declares Rust 1.88 honestly, so MSRV
# resolution would have skipped it unaided — and the pair moved together because
# they are one lineage.
globset = { version = ">=0.4.15", default-features = false }
# `RuleKind::Forbid`'s `regex`/`exclude` columns (CLOUD-283), `RuleKind::Shape`'s
# `requires_key` (CLOUD-446), and deliberately nowhere else. `outputs.rs`
# recorded the standing deferral — "adding a regex engine is a decision about the
# whole rule vocabulary, not a detail of this predicate" — and this is that
# decision, taken narrowly: `[[exec_pattern]]` and `[[marker]]` stay literal,
# because a count that becomes a function of an expression is a ratchet a rename
# defeats (`markers.rs`). A regex engine arriving by accident in one more
# predicate is what the deferral guarded against, so the split is stated rather
# than left to whoever edits next.
#
# The third consumer earns it on the same terms as the first two: what a tracker
# key looks like is a property of a CONSUMER's tracker, and an enumeration of
# spellings in the crate would be non-negotiable rule 1's violation with extra
# steps. A literal cannot express "some letters, a dash, some digits" at all, so
# there is no `pattern` twin to prefer here the way there is for `forbid`.
regex = "1"
# `regex`'s own front end, taken DIRECTLY so that validating a declaration and
# using one are different costs (CLOUD-1100). `[[pattern]]` rows are validated on
# every config load — including the mediated call, the one path an agent waits
# on — while the compiled matcher is built only where a predicate actually
# matches. `Regex::new` does both at once, and the second half is the expensive
# one: measured on this container, ten `(?i)…[\s\S]*` rows cost 110 ms to
# COMPILE and are indistinguishable from noise to PARSE. This is not a new
# supply-chain surface — `regex` already resolves it, at the same version in the
# same lock — it is the same code reached at the layer that answers the question
# actually being asked.
regex-syntax = "0.8"
semver = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rust source parsed into a syntax tree, so a policy predicate can ask WHERE a
# token sits rather than only whether it appears (CLOUD-914). `full` for
# statement and expression syntax, `visit` for the read-only walk, `parsing` to
# turn source text into that tree; `printing` and `proc-macro` stay off, because
# nothing here emits Rust.
#
# ADOPTED RATHER THAN VENDORED ANEW: `syn` is already in `Cargo.lock` behind
# every derive in the workspace (serde, schemars, clap, thiserror), so this adds
# a direct edge and no new supply-chain surface. MIT OR Apache-2.0, already on
# `deny.toml`'s allow-list.
#
# WHY NOT THE STRUCTURAL-MATCHER ROUTE: CLOUD-310 measured that route against
# this tree and rejected it, on an upstream Rust API its own authors tier as
# unstable and on grammars compiled by build scripts through a Darwin path this
# repo has never exercised. Both defects it measured — extensionless files
# scanning to nothing, and a shell grammar silently part-parsing `.bats` — are
# properties of a shell corpus and do not reach `crates/**/*.rs`. A pure-Rust
# parser with no build-script grammar is the ground that rejection left
# standing, and `.claude/rules/scanning.md` names a CLASS for row two rather
# than a product precisely so this substitution is following the rule.
syn = { version = "3", default-features = false, features = [
  "full",
  "visit",
  "parsing",
  "clone-impls",
] }
# `span-locations` is what turns a span into a line number, and without it
# `Span::start()` reports line 0 — a pointer-only finding whose pointer is a
# constant. Already vendored beneath `syn`; this enables the feature and takes a
# direct edge. Same license family, same allow-list.
proc-macro2 = { version = "1", features = ["span-locations"] }
# Finding-identity fingerprints (CLOUD-123): SHA-256 preimages, and NFC
# canonicalization so macOS NFD checkouts fingerprint identically to Linux.
#
# The other half of the pair `hmac` above describes: these two resolve `digest`
# and must resolve the same major of it. Bump them together or not at all.
sha2 = "0.11"
toml = "1.1"
# A TRANSITIVE crate this workspace does not call, pinned EXACTLY because
# `cargo-semver-checks` re-resolves rather than reading `Cargo.lock` — so the lock
# pinning 1.12.0 constrains our builds and not the tool's. Measured 2026-09-03:
# 1.13.0 fails to compile under the feature set the tool synthesises for its
# rustdoc build (`cannot find macro `vec`` at tinyvec.rs:710, an `alloc` gate that
# does not hold under that combination), so the `semver` job graded nothing and
# refused — correctly, since a run that graded nothing has not answered — on every
# branch and not merely on the one that found it.
#
# A DIRECT EDGE IS THE ONLY THING THAT CONSTRAINS A RE-RESOLVE. `semver.rs`'s own
# lock fallback cannot reach this: it replaces the BASELINE side, and the failure
# is on the CURRENT side's rustdoc build. Nothing here calls tinyvec, and that is
# the point — the edge exists to bound a version, which is why it is `=` rather
# than a range a bot could widen back into the break.
#
# REMOVE IT when tinyvec ships the feature-gate fix; the pin is a workaround for
# somebody else's defect and should not outlive it.
tinyvec = "=1.12.0"
unicode-normalization = "0.1"
# YAML, for the `[[budget.<name>.embedded]]` entries that count a string carried
# INSIDE a host's config file rather than a file of its own (CLOUD-298). TOML and
# JSON are already vendored, so this is the one format the extension dispatch
# could not otherwise read — and an always-loaded surface the engine cannot parse
# must be a refusal, which needs a real parser rather than a line scan. yaml-rust2
# is the maintained successor to yaml-rust (the archived `serde_yaml` carries
# RUSTSEC-2024-0370); it is a parser only, so it adds no serde derive surface.
yaml-rust2 = "0.12"

[profile.release]
lto = "thin"
strip = true

# Faster incremental builds for the compile-heavy fmt -> lint -> test hook chain,
# and 118 test binaries' worth of bytes off `target/debug` (CLOUD-1211).
#
# `debug = 1` was already a REDUCTION — cargo's dev default is `debug = 2`, so
# line-tables-only was the saving this comment was originally written about, and
# it was correct as written. What it never accounted for is the POPULATION: one
# dial for two groups, the library under iteration and ~118 integration test
# targets nobody attaches a debugger to. Nothing counted the second group's bytes
# until CLOUD-766 hit a full disk.
#
# THREE ARMS MEASURED on this container, 2026-08-30, each a cold
# `mise run test:cargo` over a cleared `target/debug`. The census counts
# `target/debug/deps`' extension-less linked binaries — the population
# `crates/batten/src/prune.rs`'s `superseded_in` reads through `artifact_key`
# (named rather than cited by line, because the line span this used to give had
# already drifted onto an unrelated field):
#
#   arm                                  artifacts     bytes      mean   cold wall
#   debug = 1 (the baseline)                   125   15.53 GB  124.3 MB       231s
#   debug = 0 (the whole profile)              123    1.60 GB   13.0 MB       264s
#   debug = 1 + package."*" debug = 0          125    6.82 GB   54.5 MB       217s
#
# THE MIDDLE ARM IS NOT ADOPTED, AND REJECTING IT IS THE POINT OF THIS COMMENT.
# It takes 9.7x off the bytes, which is the largest number here and the reason it
# was briefly committed. It buys that by dropping debuginfo from the WHOLE dev
# profile — batten's own code included — so a panicking test reports a backtrace
# with no line numbers. That is the diagnostic a reader wants most at exactly the
# moment they need it, and no byte count is worth it.
#
# The adopted arm keeps line tables for workspace code and strips the dependency
# closure, which is where the bytes actually were: 124.3 MB -> 54.5 MB per binary
# while every `batten` frame keeps its file and line. Nobody steps into gix or
# regorus while debugging this crate.
#
# THE WALL-CLOCK COLUMN IS NOT A FINDING and must not be quoted as one. Three
# single cold runs at different contention, unpaired and with no null — the 264s
# in particular was taken while other work shared the box. They disagree in both
# directions, which is what unpaired readings look like. The byte column is the
# measured result; the time column is recorded only so nobody re-runs it
# expecting an answer. The paired warm arm that WOULD decide it could not be
# taken: at `debug = 1` the tree leaves 6.3 GB against `target-prune`'s 9970 MB
# floor, so the instrument cannot run in the condition it needs to measure —
# CLOUD-766's exhaustion arriving inside the experiment.
#
# THE CARGO CONSTRAINT, recorded because the row's §3 asked for something cargo
# cannot express: profiles are per-PACKAGE, not per-target-kind, so "debug off
# for test targets only" is not sayable. The split below is the nearest thing
# that preserves this profile's stated reasoning for the code it was written
# about.
#
# The linker claim this row was FILED on is withdrawn and stays recorded so it is
# not re-proposed: rust-lld has been the default on this host triple since Rust
# 1.90, this repository pins 1.97.1, and `readelf -p .comment` over a built
# artifact reports `Linker: LLD 22.1.6`. The build already links with lld.
#
# SPLIT-DEBUGINFO MEASURED 2026-09-01 (CLOUD-1289) — the one arm CLOUD-1211
# deferred with its acceptance clause reading "Outstanding". Paired A/B on this
# container: three cold builds back to back in ONE process, so machine noise is
# common-mode and divides out, with two identical baselines bracketing the
# candidate rather than sitting on one side of it.
#
#   arm         cold wall   artifacts   linked bytes      mean
#   base-1          223.4s         147      10.19 GB   69.3 MB
#   unpacked        208.9s         147       4.99 GB   34.0 MB
#   base-2          213.7s         147      10.19 GB   69.3 MB
#
# THE TIME COLUMN IS NOT A FINDING, and is recorded only so nobody re-runs it.
# The two IDENTICAL baselines differ by 9.7s on their own — a null spread of
# 0.957 — and the candidate's ratio against the baseline mean is 0.956, which is
# inside it. That is the EXPECTED result rather than a disappointment: the prior
# art CLOUD-1211 cites (14s->4s, 8.7s->3.0s, rust-lang/cargo#9112) is macOS
# `dsymutil`, and `unpacked` is already cargo's default on macOS and not on
# Linux, so the mechanism that paid there is not the one in play on this triple.
#
# THE BYTE COLUMN IS THE FINDING, and its null has ZERO width — the two
# baselines are byte-identical at 10193048624, not merely close. 2.04x off the
# linked binaries, adopted on that alone, which is what CLOUD-1289's acceptance
# asks for: an arm that halves artifacts is worth adopting even where its time
# delta sits inside the null, because bytes are the binding constraint here
# (CLOUD-766).
#
# AND THE BYTES LEAVE THE DISK rather than moving to a sibling file, which is
# the question a SPLIT format has to be asked and which the linked census alone
# cannot answer: `target/debug/deps` 10.97 GB -> 5.87 GB and `target/debug`
# 13.03 GB -> 7.76 GB, because the 5.20 GB that left the binaries is replaced by
# 111.8 MB of `.dwo`. Those `.dwo` files are a class `prune.rs`'s closed
# `RECLAIMED_KINDS` cannot see, so they accumulate per build hash where the
# binary they came out of was reclaimable — CLOUD-1293, filed rather than fixed
# here because the fix is in `prune.rs` and the trade is 5.20 GB against 111.8 MB.
#
# `debug = 1` is untouched, so this changes WHERE debuginfo is stored and never
# whether it exists: every `batten` frame still reports its file and line, and
# the middle arm above stays rejected.
[profile.dev]
debug = 1
split-debuginfo = "unpacked"

# The dependency closure carries no debuginfo and IS optimised. Workspace code
# above keeps its line tables and stays unoptimised, so rebuilds of the code under
# iteration are still fast and its backtraces still readable — the split is the
# whole point, and neither half is a compromise for the other.
#
# `opt-level` MEASURED 2026-08-31, and it is the largest single win in this
# campaign. `batten hook` against this repository's own config — the committed
# ruleset plus ~20 Rego modules — is dominated by dependency code compiling and
# evaluating Rego, and unoptimised that work is 6.8x what the shipped binary does:
#
#   batten hook, real config     debug 325ms     release 48ms
#   with deps at opt-level = 2   debug  70ms     (4.6x, near release)
#
#   mise run test:cargo, warm    100.189s -> 48.581s     3201 tests, all passing
#
# A 2.06x on the whole suite, against CLOUD-1208's measured 0.963-1.012 null. The
# tests drive the DEBUG binary (`CARGO_BIN_EXE_batten`), so every case that judges
# a real config paid that 6.8x tax — which is why the binaries the per-case census
# flags are exactly the policy-evaluating ones (`board_receipts`, `mediated_verbs`,
# `pipeline_shapes`, `connector_verbs`, and `cli`'s committed-config cases).
#
# THE COST, STATED: a cold dependency build goes 217s -> 366s. It is paid ONCE and
# then cached — dependencies recompile only when they change or this profile does,
# and CI already carries `Swatinem/rust-cache`. So it is +149s once against -51.6s
# on every suite run, and the warm edit-test loop a developer sits in pays none of
# it.
[profile.dev.package."*"]
debug = 0
opt-level = 2

# The profile the distributed single binary is built with: maximal optimization
# and the smallest artifact. Distinct from `release` (used for local/dev release
# builds) so day-to-day `cargo build --release` stays fast.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = true
