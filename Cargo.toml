[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.97"
edition = "2024"
# A DERIVED COPY of `mise.toml [tools] rust`, not a compatibility promise
# (CLOUD-593). Batten ships compiled binaries and its source is public so the
# community can maintain those binaries; nobody consumes the crate as a library
# and nobody obtains it by compiling, so there is no consumer audience for a
# floor to protect. What the declaration still does is feed Cargo's MSRV-aware
# resolution, keeping the graph inside what we actually build with — self-
# protection, and the honest value for that is the compiler we actually use.
# `msrv-pin-agreement` holds it equal to the pin; raise the pin, not this.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/button-inc/batten"
homepage = "https://github.com/button-inc/batten"
authors = ["Button Inc."]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# The other half of the spawn census (CLOUD-743), and it carries its own severity
# for the same reason `disallowed_types` below does.
#
# `#[expect]` is chosen over `#[allow]` precisely so a DELETED spawn with a stale
# annotation is red too — the census self-cleans in both directions, where a count
# table catches additions only. But this lint is warn-by-default, so that second
# direction rested entirely on `mise run lint:clippy`'s `-D warnings`. Measured on
# a scratch crate (`tests/spawn-census.bats`): at the default level, an `#[expect]`
# over code with no spawn left is a WARNING and the run exits 0. Half a gate.
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Byte-stable machine output and explicit error handling are product requirements.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
# The spawn census (CLOUD-743). `clippy.toml` says WHICH types; this says how
# hard. `deny` rather than `warn`, and that distinction is the whole gate: every
# other lint above is promoted to an error only by `mise run lint:clippy`'s
# `-D warnings`, so a lint left at `warn` here reports clean under
# `mise exec -- cargo clippy -p batten --all-targets` — the escape
# `no-bare-cargo`'s own refusal text recommends, measured by CLOUD-822 missing 10
# `expect_used` errors for exactly this reason. A gate whose verdict depends on
# which sanctioned invocation ran is not a gate, so this one carries its own
# severity. `crates/batten/tests/spawn_census.rs` asserts the level.
disallowed_types = "deny"
# The runtime-shape bound (CLOUD-747), denied here for the same reason and
# configured in the same file. Inert until an HTTP client puts tokio in the
# closure, which is exactly when it needs to already be written down.
disallowed_methods = "deny"

[workspace.dependencies]
anyhow = "1"
# `env`: a flag whose env equivalent is applied by clap rather than layered by
# the §8 resolver (`--config-from`) needs Arg::env (CLOUD-31).
clap = { version = "4", features = ["derive", "env"] }
# Shell completions, derived from the same `clap::Command` tree the parser is
# built from (CLOUD-27) — so a committed script cannot describe a surface the
# binary does not have.
clap_complete = "4"
# Man pages, derived from the same `clap::Command` tree (CLOUD-69). The clap
# ecosystem's own roff renderer, adopted rather than rebuilt: roff is a format
# with real escaping rules, and a hand-rolled emitter would be a second place
# for the surface to be described. Same license family as clap itself
# (MIT OR Apache-2.0), so `deny.toml`'s allow-list already covers it.
clap_mangen = "0.3"
# Per-OS base directories: XDG on Linux/macOS (honours XDG_DATA_HOME), the
# roaming known folder on Windows — the CLOUD-23 state-path rule, one crate.
etcetera = "0.11"
# Secret-class identity inputs are HMAC-keyed (CLOUD-123): an unkeyed digest of a
# matched secret is an offline-guessing oracle, because secrets are often
# low-entropy and a journalled hash cannot be expunged.
#
# MOVES WITH `sha2` BELOW, ALWAYS. `hmac` and `sha2` each pull a `digest`, and the
# constructor `keyed_span` calls lives on a trait that moved between `digest`
# majors — so bumping one without the other splits our own two crates across two
# `digest` lines and the workspace stops compiling. `digest-major-agreement`
# decides this over the committed `Cargo.lock`; it is not a comment you have to
# remember.
#
# WHAT THIS PIN IS *NOT* DEFENDING, corrected 2026-08-20 (CLOUD-767). It used to
# say the older line kept "two majors of the same hashing substrate" out of the
# tree. That has been false since `gix` arrived: `gix-hash` pulls `sha2 0.11` and
# therefore `digest 0.11`, so both majors are already vendored whatever we pin. A
# lockfile grep is the whole proof, and the claim survived unchallenged only
# because it was prose — which is the argument for the gate above being a gate.
hmac = "0.13"
# The 32 bytes behind that HMAC key (CLOUD-59). A dependency rather than a
# `/dev/urandom` read because the workspace forbids `unsafe` and supports
# Windows, so the alternative is two hand-written platform paths for the one
# thing that must not be got subtly wrong — and because this crate is already in
# the tree transitively, so adopting it directly adds no vendored code at all.
# `getrandom::fill` is the OS CSPRNG (`getrandom(2)`, `arc4random_buf`,
# `ProcessPrng`) and never a userspace PRNG: a key derived from a seeded
# generator is a key an attacker can re-derive. `rand` was the alternative and is
# strictly more surface for the same 32 bytes — distributions, generators and a
# reseeding policy this needs none of.
getrandom = "0.4"
# The JSON Schema for `batten.toml`, derived from the config types themselves
# (CLOUD-33) — never hand-authored, so the schema cannot describe a config the
# binary does not accept.
schemars = "1"
# Test-only: validates the committed configs against the derived schema, so the
# published artifact is asserted to accept what the binary accepts.
# default-features = false drops resolve-http (reqwest + rustls + aws-lc-rs) —
# the schema is local, and a validator must never fetch over the network anyway.
# JSON5 — the fourth document format (CLOUD-772). Adopted rather than
# hand-rolled for the reason the issue is filed on: comments, trailing commas
# and unquoted keys are what every ad-hoc brace-depth state machine over such a
# file gets wrong, and a reader that mis-parses reports agreement. It parses
# straight into `serde_json::Value`, which is already vendored, so the document
# tree gains no second value type.
json5 = "0.4"
jsonschema = { version = "0.49", default-features = false }
# `min_batten_version` comparison. Cargo's own flavour of SemVer, so the config
# key means what a Rust consumer already expects it to.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# In-process git (CLOUD-320's `git.rs` row, resolved to in-process). `gix` and
# not `git2`: `libgit2-sys` declares a `links` key, which `macos-link-check`
# rule 1 excludes outright — libgit2 on macOS needs CoreFoundation and Security,
# and zig can only cross-link a Darwin framework given a real SDK
# (ziglang/zig#1349, whose documented workaround is SDKROOT). That is an
# Apple-SDK decision priced by the private-repo runner multiplier, not a
# constraint of the code, and it is not one a `git.rs` change gets to make.
#
# `default-features = false` and three features is the minimum for what this
# module asks: resolve a revspec, peel it, walk a tree, read a blob. What is
# left off is the whole network half — `gix`'s default pulls transports and
# credential helpers, and a library that can fetch has no business inside a gate
# that must be offline and byte-stable.
#
# Both hash features are load-bearing rather than belt-and-braces. `gix-hash`
# gates each variant of its `Kind` enum on the matching feature, so with neither
# selected the enum has NO variants and the crate does not compile — measured
# here, 16 errors from `darwin-link` before they were added. `sha256` joins
# `sha1` because this module already contemplates both: `PatchId::parse` accepts
# a 64-hex id precisely so a SHA-256 repository is readable, and a git library
# that can only open half the repositories git can is not a replacement for
# shelling out.
#
# The zlib backend needs no pinning here, unlike `flate2` above: gix always uses
# zlib-rs now — its own `max-performance` is a bare alias for
# `max-performance-safe` — so there is no C backend to select away from and no
# `links` key to trip `macos-link-check` rule 1.
gix = { version = "0.86", default-features = false, features = [
  "revision",
  "sha1",
  "sha256",
] }
# The policy evaluator (CLOUD-647, CLOUD-689). A `policy` row hands a REGISTERED
# Rego module the resolved fact set and reads back denials; the module decides,
# the engine never acquires. That is what CLOUD-763 admitted to `MediatedCall`
# when it re-axed `scopes` on ambient authority rather than authorship: a
# `command` row spawns a process that can read any file and reach the network,
# while an evaluator over supplied `Facts` sees the fields the boundary resolved
# and nothing else. The fact set IS the bound, which is why it had to exist
# first.
#
# `default-features = false` is load-bearing, not tidiness. The default
# `full-opa` pulls `http` and `jsonschema`; consumer-authored policy with
# network reach anywhere near the mediated path is a hole, and the feature list
# is where it is closed. Measured 2026-08-20 against the pinned 1.97.1: this set
# resolves a 45-package closure carrying none of `reqwest`, `jsonschema`,
# `hyper`, `rustls`, `openssl-sys`, `native-tls`, `ring`, `globset` or `glob` —
# so nothing in it declares a `links` key and `macos-link-check` rule 1 is
# cleared without an exception.
#
# `coverage` is not optional either, and not for reporting. Regorus refuses a
# conflict or a recursion at EVALUATION, never at `add_policy` — five cases,
# measured — so a conflict on a path no query exercises is silently unreported.
# Whole-set analysis therefore has to prove its sweep reached every rule, and
# this feature is what makes that provable rather than asserted.
#
# `arc` because a resolved policy is shared across the rule loop rather than
# cloned per row.
regorus = { version = "0.11", default-features = false, features = [
  "std",
  "arc",
  "coverage",
] }
# OS advisory locks (flock/fcntl/LockFileEx) for the findings store's shard-merge
# (CLOUD-78). A crate rather than the syscall directly because the workspace
# forbids `unsafe`; the `sync` default feature is the blocking/try-lock file API.
# Advisory locks are load-bearing over a bare lockfile: they auto-release when the
# process dies, and the ambient ~2-minute foreground kill would otherwise strand a
# lockfile and brick the store repo-wide.
#
# The blocking choice is the concurrency posture's, stated once in
# `.claude/rules/rust.md` (CLOUD-747); this note cites it rather than re-deriving
# it, which is what five independent derivations of one stance cost.
fs4 = "1.1"
# The two halves of owning a dispatched process tree (CLOUD-427), and they are
# two crates because no one crate offers both halves safely.
#
# `rustix` asks and tells: `getsid`/`getpid` decide whether Batten is the session
# leader, and `kill_process_group` is the teardown. Already in the tree
# transitively under `fs4` above, so the direct declaration vendors nothing new —
# it only stops the version being decided by a transitive edge. `process` is the
# one feature this needs; the default `std`/`use-libc-auxv` come with it.
rustix = { version = "1.1", features = ["process"] }
# `signal-hook` receives. Installing a disposition is `sigaction(2)`, which
# `unsafe_code = "forbid"` puts out of reach, and rustix's own spelling lives
# behind its private `runtime` feature — so a safe registry is not a convenience
# here, it is the only route. `iterator` is the blocking `Signals` stream a
# dedicated forwarding thread reads — blocking and a thread per the concurrency
# posture in `.claude/rules/rust.md`, not a separate decision (CLOUD-747), and
# `tokio::signal` is banned in `clippy.toml` so a second signal source cannot
# arrive alongside it; the default `channel` feature underneath it
# is what makes the delivery async-signal-safe, which a hand-written handler
# writing to a `Vec` would not be. mise's supervisor reaches for the same crate
# for the same reason, so the two ends of the pgroup protocol are implemented
# against one set of semantics (CLOUD-455 is the prior-art gate).
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
# The tree walk (CLOUD-214), adopted rather than rebuilt. ripgrep's own walker,
# so gitignore semantics are the ones every contributor already has in their
# head — and, measured on this repository after one `cargo build`, 8891 of the
# 9221 paths the hand-rolled walk yielded were ignored `target/` artifacts. A
# walk that reads 96% build output is not a policy input set.
# default-features = false drops the `walk` parallel iterator: the serial walk is
# what keeps `tree_files` byte-stable without a merge step. It **stays serial
# because nothing measured asks otherwise** — `batten check` over this repository's
# 654 tracked files is p50 8.67ms against a 5.08ms process-start floor, on a 100ms
# budget (CLOUD-747, measured 2026-08-21; the profile is in
# `.claude/rules/rust.md`, which is the one authority for this posture). Turning
# the walker on means owning a deterministic merge to buy §6 byte-stability back,
# and there is nothing here for it to buy that back with.
#
# UNCAPPED SINCE CLOUD-593. It carried `<0.4.30` because 0.4.30 uses `let` chains
# (Rust 1.88) while declaring NO `rust-version`, so MSRV-aware resolution took it
# happily and the build failed inside the vendored crate — a cap Cargo could not
# derive, so it had to be written. At a floor equal to a current pin nothing in
# the graph is excluded and the cap has nothing left to exclude. `cap-drift` is
# the ratchet that keeps this in step with `renovate.json5`'s `allowedVersions`
# if a cap ever comes back.
ignore = { version = ">=0.4.23", default-features = false }
# The glob matcher the same lineage ships (CLOUD-214), replacing a hand-rolled
# recursive matcher with exponential worst-case behaviour and no character
# classes, braces or negation. Compiled once per pattern rather than re-parsed
# per path, which is what makes the selection cost linear in the tree.
#
# Uncapped with `ignore` above (CLOUD-593). Its bound was belt-and-braces rather
# than load-bearing — this crate's 0.4.20 declares Rust 1.88 honestly, so MSRV
# resolution would have skipped it unaided — and the pair moved together because
# they are one lineage.
globset = { version = ">=0.4.15", default-features = false }
# `RuleKind::Forbid`'s `regex`/`exclude` columns (CLOUD-283), `RuleKind::Shape`'s
# `requires_key` (CLOUD-446), and deliberately nowhere else. `outputs.rs`
# recorded the standing deferral — "adding a regex engine is a decision about the
# whole rule vocabulary, not a detail of this predicate" — and this is that
# decision, taken narrowly: `[[exec_pattern]]` and `[[marker]]` stay literal,
# because a count that becomes a function of an expression is a ratchet a rename
# defeats (`markers.rs`). A regex engine arriving by accident in one more
# predicate is what the deferral guarded against, so the split is stated rather
# than left to whoever edits next.
#
# The third consumer earns it on the same terms as the first two: what a tracker
# key looks like is a property of a CONSUMER's tracker, and an enumeration of
# spellings in the crate would be non-negotiable rule 1's violation with extra
# steps. A literal cannot express "some letters, a dash, some digits" at all, so
# there is no `pattern` twin to prefer here the way there is for `forbid`.
regex = "1"
semver = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Finding-identity fingerprints (CLOUD-123): SHA-256 preimages, and NFC
# canonicalization so macOS NFD checkouts fingerprint identically to Linux.
#
# The other half of the pair `hmac` above describes: these two resolve `digest`
# and must resolve the same major of it. Bump them together or not at all.
sha2 = "0.11"
toml = "1.1"
unicode-normalization = "0.1"
# YAML, for the `[[budget.<name>.embedded]]` entries that count a string carried
# INSIDE a host's config file rather than a file of its own (CLOUD-298). TOML and
# JSON are already vendored, so this is the one format the extension dispatch
# could not otherwise read — and an always-loaded surface the engine cannot parse
# must be a refusal, which needs a real parser rather than a line scan. yaml-rust2
# is the maintained successor to yaml-rust (the archived `serde_yaml` carries
# RUSTSEC-2024-0370); it is a parser only, so it adds no serde derive surface.
yaml-rust2 = "0.11"

[profile.release]
lto = "thin"
strip = true

# Faster incremental builds for the compile-heavy fmt -> lint -> test hook chain.
[profile.dev]
debug = 1

# The profile the distributed single binary is built with: maximal optimization
# and the smallest artifact. Distinct from `release` (used for local/dev release
# builds) so day-to-day `cargo build --release` stays fast.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = true
