# The spawn census, as a gate (CLOUD-743; the mechanism CLOUD-320 shipped
# without).
#
# WHY CLIPPY AND NOT A SOURCE SCAN. `surface.rs` imports `clap::Command` bare —
# `use clap::{Arg, ArgAction, Command};` — so the token `Command` names two
# different types in this crate. A text scan counts both, and so does a
# syntax-only matcher, since `Command::new` is the same call expression either
# way — neither resolves names. clippy runs after name resolution and matches
# the FULLY RESOLVED path, so `std::process::Command` is
# matched however it is spelled (bare, renamed, glob, nested) and `clap::Command`
# is never matched at all. The ambiguity that made a string scan the wrong tool
# does not exist at this layer.
#
# THE LEVEL LIVES IN `[workspace.lints.clippy]`, NOT HERE. This file configures
# WHICH types are disallowed; the lint's severity is set to `deny` in the
# workspace manifest so the verdict does not depend on which sanctioned
# invocation ran. CLOUD-822 measured the gap: `mise exec -- cargo clippy -p
# batten --all-targets` omits `-D warnings` and missed 10 `expect_used` errors.
# A gate that reports clean under one blessed command and red under another is
# not a gate.
# THE SECOND AND THIRD ENTRIES ARE STILL UNREACHABLE, ON A NEW REASON (CLOUD-747,
# then CLOUD-745). They were written while `tokio` was in no dependency table, so
# nothing could resolve `tokio::signal::*` — measured: clippy accepts an
# unresolvable path silently, neither erroring nor warning — and they were to go
# live the day an HTTP client arrived. It arrived. `tokio` IS in the shipped
# closure now, and what holds the line instead is the FEATURE SET: the entry takes
# `default-features = false` with only `rt`, `net` and `time`, so `signal` is not
# compiled into the graph and reaching for it is a compile error rather than a
# lint finding. Naming a value while it is still empty is the discipline
# `facts.rs`'s `Surface::Check` and `rules.rs`'s `Authority::Acquires` follow, and
# the rows stay for the day somebody widens that list to buy something else.
#
# The honest limit, stated because silence cuts both ways: a MISSPELLED path here
# is equally unreachable and equally quiet. `tests/spawn_census.rs` is the
# coupling — it reads the tokio feature list out of the workspace manifest and
# fails the moment either banned feature is enabled, pointing here as the row that
# must then lose its `allow-invalid` and be shown to fire.
disallowed-types = [
  { path = "std::process::Command", reason = "a spawn is an inventory row (CLOUD-320); annotate the site with #[expect(clippy::disallowed_types, reason = \"...\")] stating the verdict" },
  { path = "tokio::signal::unix::Signal", reason = "signals are signal-hook's, one registry: mise's supervisor uses the same crate, so both ends of the pgroup protocol are implemented against one set of semantics (CLOUD-427, CLOUD-747)", allow-invalid = true },
  { path = "tokio::signal::unix::SignalKind", reason = "the other half of the signal-hook ban above (CLOUD-747)", allow-invalid = true },
]

# The shape of the one runtime the mediated path may build (CLOUD-747), and inert
# on the same terms as the bans above.
#
# The posture retires the blanket "builds no runtime" because it collapsed two
# very different answers. Measured out of tree, against a floor arm that
# constructs nothing: a current-thread runtime costs +0.14ms at p50, a
# multi-thread one +1.68ms at p50 and +4.56ms at p95 — twelve times the overhead,
# worse again at the tail, and a worker per core for a workload that is one call's
# IO. So the
# bound is the SHAPE, not the abstinence, and the shape ships with a mechanism
# rather than as a sentence in a rules file (non-negotiable rule 2).
#
# `allow-invalid = true` ON THE TOKIO ROWS, AND IT IS NOT A SILENCING (CLOUD-745).
# Those rows were written to "go live the day an HTTP client arrives". The client
# arrived, and they still do not resolve — because the `tokio` entry takes
# `default-features = false` with only `rt`, `net` and `time`, so
# `new_multi_thread` (which needs `rt-multi-thread`) and `tokio::signal` (which
# needs `signal`) ARE NOT COMPILED INTO THE GRAPH AT ALL. Reaching for either is
# a compile error rather than a lint, which is strictly stronger than the ban and
# is the reason the ban reads as unreachable.
#
# So the flag records a stronger guarantee rather than waiving a weaker one, and
# the rows stay declared: the day somebody widens that feature list to buy
# something else, these resolve again and go back to being the live bound. The
# alternative — enabling `rt-multi-thread` and `signal` so the lint can see them —
# would add the surface in order to police it, which is backwards.
disallowed-methods = [
  { path = "tokio::runtime::Builder::new_multi_thread", reason = "the mediated path builds at most one runtime and it is current-thread; a worker per core buys nothing for one call's IO and costs twelve times the overhead at p50 (CLOUD-747, CLOUD-689's 100ms ceiling)", allow-invalid = true },
]
