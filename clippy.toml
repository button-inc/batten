# The spawn census, as a gate (CLOUD-743; the mechanism CLOUD-320 shipped
# without).
#
# WHY CLIPPY AND NOT A SOURCE SCAN. `surface.rs` imports `clap::Command` bare —
# `use clap::{Arg, ArgAction, Command};` — so the token `Command` names two
# different types in this crate. A text scan counts both, and so does a
# syntax-only matcher, since `Command::new` is the same call expression either
# way — neither resolves names. clippy runs after name resolution and matches
# the FULLY RESOLVED path, so `std::process::Command` is
# matched however it is spelled (bare, renamed, glob, nested) and `clap::Command`
# is never matched at all. The ambiguity that made a string scan the wrong tool
# does not exist at this layer.
#
# THE LEVEL LIVES IN `[workspace.lints.clippy]`, NOT HERE. This file configures
# WHICH types are disallowed; the lint's severity is set to `deny` in the
# workspace manifest so the verdict does not depend on which sanctioned
# invocation ran. CLOUD-822 measured the gap: `mise exec -- cargo clippy -p
# batten --all-targets` omits `-D warnings` and missed 10 `expect_used` errors.
# A gate that reports clean under one blessed command and red under another is
# not a gate.
# THE SECOND AND THIRD ENTRIES ARE STILL UNREACHABLE, ON A NEW REASON (CLOUD-747,
# then CLOUD-745). They were written while `tokio` was in no dependency table, so
# nothing could resolve `tokio::signal::*` — measured: clippy accepts an
# unresolvable path silently, neither erroring nor warning — and they were to go
# live the day an HTTP client arrived. It arrived. `tokio` IS in the shipped
# closure now, and what holds the line instead is the FEATURE SET: the entry takes
# `default-features = false` with only `rt`, `net` and `time`, so `signal` is not
# compiled into the graph and reaching for it is a compile error rather than a
# lint finding. Naming a value while it is still empty is the discipline
# `facts.rs`'s `Surface::Check` and `rules.rs`'s `Authority::Acquires` follow, and
# the rows stay for the day somebody widens that list to buy something else.
#
# The honest limit, stated because silence cuts both ways: a MISSPELLED path here
# is equally unreachable and equally quiet. `tests/spawn_census.rs` is the
# coupling — it reads the tokio feature list out of the workspace manifest and
# fails the moment either banned feature is enabled, pointing here as the row that
# must then lose its `allow-invalid` and be shown to fire.
disallowed-types = [
  { path = "std::process::Command", reason = "a spawn is an inventory row (CLOUD-320); annotate the site with #[expect(clippy::disallowed_types, reason = \"...\")] stating the verdict" },
  { path = "tokio::signal::unix::Signal", reason = "signals are signal-hook's, one registry: mise's supervisor uses the same crate, so both ends of the pgroup protocol are implemented against one set of semantics (CLOUD-427, CLOUD-747)", allow-invalid = true },
  { path = "tokio::signal::unix::SignalKind", reason = "the other half of the signal-hook ban above (CLOUD-747)", allow-invalid = true },
]

# The shape of the one runtime the mediated path may build (CLOUD-747), and inert
# on the same terms as the bans above.
#
# The posture retires the blanket "builds no runtime" because it collapsed two
# very different answers. Measured out of tree, against a floor arm that
# constructs nothing: a current-thread runtime costs +0.14ms at p50, a
# multi-thread one +1.68ms at p50 and +4.56ms at p95 — twelve times the overhead,
# worse again at the tail, and a worker per core for a workload that is one call's
# IO. So the
# bound is the SHAPE, not the abstinence, and the shape ships with a mechanism
# rather than as a sentence in a rules file (non-negotiable rule 2).
#
# `allow-invalid = true` ON THE TOKIO ROWS, AND IT IS NOT A SILENCING (CLOUD-745).
# Those rows were written to "go live the day an HTTP client arrives". The client
# arrived, and they still do not resolve — because the `tokio` entry takes
# `default-features = false` with only `rt`, `net` and `time`, so
# `new_multi_thread` (which needs `rt-multi-thread`) and `tokio::signal` (which
# needs `signal`) ARE NOT COMPILED INTO THE GRAPH AT ALL. Reaching for either is
# a compile error rather than a lint, which is strictly stronger than the ban and
# is the reason the ban reads as unreachable.
#
# So the flag records a stronger guarantee rather than waiving a weaker one, and
# the rows stay declared: the day somebody widens that feature list to buy
# something else, these resolve again and go back to being the live bound. The
# alternative — enabling `rt-multi-thread` and `signal` so the lint can see them —
# would add the surface in order to police it, which is backwards.
#
# THE DELAY INVENTORY (CLOUD-1177), and it is the same shape one concern over.
# `std::thread::sleep` is denied so that every delay in the crate is an
# ANNOTATED ROW rather than an unremarked arrival, exactly as a spawn is.
#
# WHAT IS REFUSED IS NOT "DELAY". A conditional poll against a real exit
# condition is legitimate work — it is how you observe a system you do not
# control. What the ban is aimed at is `sleep` as a SCHEDULING device: a
# wall-clock guess about when the world changes, standing in for the exit
# condition that belongs there. clippy cannot tell those apart, which is why the
# refusal is on the CALL and the sound cases carry an annotated exemption.
#
# So the reason string has one obligation, and it is the discriminator rather
# than a formality: it must name WHERE THE DELAY COMES FROM — the response
# header that set it, the terminal state it is bounded by, the condition the
# loop exits on. `crates/batten/tests/sleep_ban.rs` holds each reason to a bound
# whose name RESOLVES in the same file, because a timer has no bound to name and
# prose that names none is precisely what this row exists to catch.
#
# THE TOKIO ROW HERE IS LIVE, UNLIKE THE THREE ABOVE, AND THAT IS NOT AN
# OVERSIGHT. `tokio::time::sleep` needs the `time` feature; the workspace's
# `tokio` entry ENABLES `time` (it takes `rt`, `net` and `time`), so the path
# resolves and the ban bites today. `allow-invalid = true` would record a
# guarantee this row does not have, which is the inverse of what that flag means
# on the `signal` and `rt-multi-thread` rows — there it records a stronger bound
# (the feature is off, so reaching for the path is a compile error); here there
# is no such bound and the lint is the whole of it. `tests/sleep_ban.rs` asserts
# the asymmetry in both directions.
disallowed-methods = [
  # NO DAEMON (see `zombie_processes = "forbid"` in Cargo.toml): the primitives a
  # process detaches from the harness with. None is used; any use is the retired
  # `singleton detach` coming back, and long-running work is a harness task.
  { path = "libc::fork", reason = "no daemon: a detached process is invisible to the harness and the container is reaped (#1276); run long work as a harness background task", allow-invalid = true },
  { path = "libc::setsid", reason = "no daemon: a new session detaches from the harness (#1276); run long work as a harness background task", allow-invalid = true },
  { path = "libc::daemon", reason = "no daemon (#1276); run long work as a harness background task", allow-invalid = true },
  { path = "nix::unistd::fork", reason = "no daemon (#1276); run long work as a harness background task", allow-invalid = true },
  { path = "nix::unistd::setsid", reason = "no daemon (#1276); run long work as a harness background task", allow-invalid = true },
  { path = "nix::unistd::daemon", reason = "no daemon (#1276); run long work as a harness background task", allow-invalid = true },
  { path = "rustix::process::setsid", reason = "no daemon (#1276); run long work as a harness background task", allow-invalid = true },
  { path = "tokio::runtime::Builder::new_multi_thread", reason = "the mediated path builds at most one runtime and it is current-thread; a worker per core buys nothing for one call's IO and costs twelve times the overhead at p50 (CLOUD-747, CLOUD-689's 100ms ceiling)", allow-invalid = true },
  # ONE STREAM IMPLEMENTATION (#1276): a child's output is pumped chunk by
  # chunk with backpressure through `crate::stream`, never read to the end
  # behind `std`'s private loop. Migrated by the `stream-capture` recipe
  # (`crates/batten-codemods`), which left no call site.
  { path = "std::process::Command::output", reason = "every child stream goes through `batten::stream` (#1276): call `Streamed::streamed_output`, or pump the pipes yourself with `stream::spawn_pump`" },
  { path = "std::process::Child::wait_with_output", reason = "every child stream goes through `batten::stream` (#1276): call `StreamedChild::streamed_wait`" },
  { path = "std::io::copy", reason = "the one copy loop is `batten::stream::pump` (#1276): it flushes each chunk to every sink before the next read, which `io::copy` does not" },
  { path = "std::thread::sleep", reason = "a delay is an inventory row (CLOUD-1177): a poll bounded by a real terminal state is legitimate, a timer standing in for an exit condition is not. Annotate the site with #[expect(clippy::disallowed_methods, reason = \"...\")] naming the bound the delay comes from, in backticks" },
  { path = "tokio::time::sleep", reason = "the async half of the same inventory (CLOUD-1177); it RESOLVES today, because the workspace tokio entry enables `time`" },
  # compio's timers resolve since the disk watcher enabled its `time` feature
  # (CLOUD-2782); the one use is `pr_watch::clock`, the crate's one clock.
  { path = "compio::time::sleep", reason = "the compio half of the same inventory (CLOUD-1177, CLOUD-2782): wait on `pr_watch::clock`, the crate's one clock" },
  { path = "compio::time::sleep_until", reason = "the compio half of the same inventory (CLOUD-1177, CLOUD-2782): wait on `pr_watch::clock`, the crate's one clock" },
  { path = "compio::time::interval", reason = "the compio half of the same inventory (CLOUD-1177, CLOUD-2782): wait on `pr_watch::clock`, the crate's one clock" },
  { path = "compio::time::interval_at", reason = "the compio half of the same inventory (CLOUD-1177, CLOUD-2782): wait on `pr_watch::clock`, the crate's one clock" },
  # NO BLOCKING LOCK WITHOUT A STOP (CLOUD-2789). A blocking `flock` has no way
  # back: `step run` waited on a second handle to a tree its own process held,
  # printed its result and never exited. Every lock goes through
  # `batten::lock_wait`: `try_lock`, then a wait on the holder's release or a
  # stop event. The `std` rows, and each lock crate in the graph: `fs4`, and the
  # raw `flock` of `nix`, `rustix` and `libc`.
  { path = "std::fs::File::lock", reason = "take try_lock and wait on the holder's release or a stop event; a blocking lock with no stop is a hang (CLOUD-2789): call `lock_wait::acquire`" },
  { path = "std::fs::File::lock_shared", reason = "take try_lock and wait on the holder's release or a stop event; a blocking lock with no stop is a hang (CLOUD-2789): call `lock_wait::acquire`" },
  { path = "fs4::FileExt::lock", reason = "take try_lock and wait on the holder's release or a stop event; a blocking lock with no stop is a hang (CLOUD-2789): call `lock_wait::acquire`", allow-invalid = true },
  { path = "fs4::FileExt::lock_shared", reason = "take try_lock and wait on the holder's release or a stop event; a blocking lock with no stop is a hang (CLOUD-2789): call `lock_wait::acquire`", allow-invalid = true },
  { path = "fs4::fs_std::FileExt::lock", reason = "take try_lock and wait on the holder's release or a stop event; a blocking lock with no stop is a hang (CLOUD-2789): call `lock_wait::acquire`", allow-invalid = true },
  { path = "fs4::fs_std::FileExt::lock_shared", reason = "take try_lock and wait on the holder's release or a stop event; a blocking lock with no stop is a hang (CLOUD-2789): call `lock_wait::acquire`", allow-invalid = true },
  { path = "nix::fcntl::flock", reason = "take try_lock and wait on the holder's release or a stop event; a blocking lock with no stop is a hang (CLOUD-2789): call `lock_wait::acquire`", allow-invalid = true },
  { path = "nix::fcntl::Flock::lock", reason = "take try_lock and wait on the holder's release or a stop event; a blocking lock with no stop is a hang (CLOUD-2789): call `lock_wait::acquire`", allow-invalid = true },
  { path = "rustix::fs::flock", reason = "take try_lock and wait on the holder's release or a stop event; a blocking lock with no stop is a hang (CLOUD-2789): call `lock_wait::acquire`", allow-invalid = true },
  { path = "libc::flock", reason = "take try_lock and wait on the holder's release or a stop event; a blocking lock with no stop is a hang (CLOUD-2789): call `lock_wait::acquire`", allow-invalid = true },
  # TIMED WAITS (CLOUD-1177, CLOUD-2789). A sleep is the open-coded timer; a
  # TIMED WAIT is the same guess wearing an event's clothes: it waits for the
  # event, then gives up on a wall-clock budget, so a run that never signals
  # passes as one that signalled late. A test waits for the EVENT it is about
  # (a child's exit, a pipe's EOF, a channel or condvar the code under test
  # signals) and never on a clock: a mutant that suppresses the event hangs,
  # and the mutation judge's per-case cut files that honestly as a timeout.
  # Production keeps a timed wait only where the bound IS the design (the
  # judge's per-case cut, a hook's budget, a drain grace), annotated the way a
  # sleep is; `tests/sleep_ban.rs` holds test code to no annotation at all.
  #
  # The rows are every timed wait the dependency graph reaches. std is linked
  # by every crate; tokio (`time`), compio (`time`) and hyper-util are direct
  # dependencies with the feature on, so their rows RESOLVE and bite. The rest
  # take `allow-invalid = true` for the reason the daemon rows above do: the
  # crate or feature is out of reach (unix-only types on Windows, rustix's
  # `thread`, nix's `poll`/`time`, crossbeam, flume and parking_lot, which are
  # transitive only, and libc, which `unsafe_code = "forbid"` fences off), and
  # the row is the bound the day somebody widens that.
  #
  # NOT A ROW: `rustix::event::poll` and `rustix::event::epoll::wait`. Their
  # timeout is an ARGUMENT, and clippy matches the call, not the argument, so a
  # row would flag the untimed `poll(fds, None)` that IS the event wait.
  # `tests/sleep_ban.rs` holds those calls to a `None` timeout as source.
  #
  # NOT A ROW EITHER: `mpsc::Receiver::recv_timeout`, `tokio::time::timeout`,
  # `Runtime::shutdown_timeout` and hyper's `set_connect_timeout`. Each one's only
  # production calls are a bound that IS the design (the fetch's connect, total
  # and drain bounds; a pump's drain grace; the forge notice's fail-open budget),
  # and a row would buy each one a waiver the `waiver add refused` ratchet does
  # not have. `tests/sleep_ban.rs` pins every call of the four to the sites that
  # carry them today, and admits none in test code.
  { path = "std::sync::mpsc::Receiver::recv_deadline", reason = "a timed wait is an inventory row (CLOUD-1177, CLOUD-2789): wait for the event with `recv`", allow-invalid = true },
  { path = "std::sync::Condvar::wait_timeout", reason = "a timed wait is an inventory row (CLOUD-1177, CLOUD-2789): wait for the signal with `wait`" },
  { path = "std::sync::Condvar::wait_timeout_while", reason = "a timed wait is an inventory row (CLOUD-1177, CLOUD-2789): wait for the condition with `wait_while`" },
  { path = "std::sync::Condvar::wait_timeout_ms", reason = "a timed wait is an inventory row (CLOUD-1177, CLOUD-2789): wait for the signal with `wait`" },
  { path = "std::thread::park_timeout", reason = "a timed wait is an inventory row (CLOUD-1177, CLOUD-2789): `park` until the thread that owns the event unparks you" },
  { path = "std::thread::park_timeout_ms", reason = "a timed wait is an inventory row (CLOUD-1177, CLOUD-2789): `park` until the thread that owns the event unparks you" },
  { path = "std::thread::sleep_ms", reason = "the deprecated spelling of `std::thread::sleep` (CLOUD-1177)" },
  { path = "std::thread::sleep_until", reason = "a sleep to a deadline is a sleep (CLOUD-1177)", allow-invalid = true },
  { path = "std::net::TcpStream::connect_timeout", reason = "a timed wait is an inventory row (CLOUD-1177, CLOUD-2789): annotate the site naming the bound the budget comes from, in backticks" },
  { path = "std::net::TcpStream::set_read_timeout", reason = "a timed read is a timed wait (CLOUD-1177, CLOUD-2789): read to EOF, or annotate the site naming the bound" },
  { path = "std::net::TcpStream::set_write_timeout", reason = "a timed write is a timed wait (CLOUD-1177, CLOUD-2789): annotate the site naming the bound" },
