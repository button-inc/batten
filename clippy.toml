  { path = "std::os::unix::net::UnixStream::set_read_timeout", reason = "a timed read is a timed wait (CLOUD-1177, CLOUD-2789): read to EOF, or annotate the site naming the bound", allow-invalid = true },
  { path = "std::os::unix::net::UnixStream::set_write_timeout", reason = "a timed write is a timed wait (CLOUD-1177, CLOUD-2789): annotate the site naming the bound", allow-invalid = true },
