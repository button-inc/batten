# release-plz configuration (https://release-plz.dev).
# Batten is not published to crates.io, so releases are GitHub tags + releases
# only, driven by Conventional Commits. `publish = false` below is that decision;
# this comment must not also name the repository's visibility, which is neither
# this file's fact nor a reason for it -- a copy of a setting that lives
# elsewhere goes stale silently, and this line did.

[workspace]
publish = false # do not publish to any cargo registry
# NEITHER THE RELEASE NOR ITS TAG IS release-plz's ANY MORE (CLOUD-2033). The
# release is cut from the release PR's head before it lands — a draft created by
# `auto-release-land.yml`'s cut, built by `release-artifacts.yml`, published by
# its `land` job, which then moves `main` — so `main` never pins a release that is
# not published, immutable, complete and verified. A `v*` tag exists only for a
# release: on a draft at most, and deleted with it; on a published release,
# locked by immutability. release-plz only opens and refreshes the release PR.
git_release_enable = false
git_tag_enable = false
# THE BASELINE IS THE LATEST RELEASE TAG, read by release-plz itself (CLOUD-1991).
# With no registry to download the last release from, release-plz reports "next
# version is 0.0.0" forever; `[tasks.release-pr]` used to work around that in
# shell, checking the latest `v*` tag out into a scratch worktree and passing it
# as `--registry-manifest-path`. `git_only` is release-plz's own spelling of that
# same baseline — measured on v0.0.188: "Latest release of package batten: tag
# `v0.0.188`", then "next version is 0.0.189" — so the task is one argv again.
git_only = true
# CLOUD-346. The release PR is refreshed on every push to `main`, and a non-draft
# one turns each refresh into a full CI matrix over a version bump and a
# changelog entry — measured at 5 of 30 `ci.yml` runs in one 37-minute window,
# four of them discarded by the next refresh. Draft is what the existing
# `if: github.event.pull_request.draft == false` job guards already skip, so the
# debounce in `auto-release-land.yml` decides BEFORE the minutes are spent: it
# readies this PR only once a release is actually due. Gated by
# `mise run ci-local-parity`.
pr_draft = true
