[package]
name = "batten-facts"
description = "Batten's fact model, the parsed source it reads, and the durable records, identities and caches beneath them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# THE FIRST CUT PHASE 2 OF CLOUD-2789 MEASURED. `batten modules cycle` puts 128
# of `batten`'s modules in one strongly connected component and every other
# module strictly below it; these twelve are the largest cohesive union of the
# dependency-closed sets below it (`facts` and what reads source into it, the
# durable store, identities and the cache). No edge leads back into `batten`,
# so this compiles, lints and cross-checks without it. `batten` re-exports each
# module under its old name, so `crate::facts::…` resolves unchanged there.

[dependencies]
anyhow.workspace = true
hmac.workspace = true
json5.workspace = true
proc-macro2.workspace = true
# `source::rust_parse`, the one lossless Rust parse in the workspace (CLOUD-1008):
# every crate that reads Rust source parses through this crate, so the parser
# lives where the parse does.
ra_ap_syntax.workspace = true
batten-fsio = { path = "../batten-fsio", version = "=0.0.220" }
blake3.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
yaml-rust2.workspace = true

[features]
# A test's handle on the wall clock `cache` reads (`cache::clock::at`): `batten`
# enables it from its dev-dependencies only, so no shipped build carries it.
seam = []

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
