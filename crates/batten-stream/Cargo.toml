license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# A LEAF, AS `batten-fsio` IS (#1276): only `std` below it and no edge into
# `batten`, which re-exports it as `crate::stream`. Every module that spawns
# reaches it, so inside `batten` it would sit in every spawner's closure and
# push three plumbing modules past the boundary the split plan rests on.

[features]
# A test's handle on a pump in a state it sets (`Pumping::held`): `batten`
# enables it from its dev-dependencies only, so no shipped build carries it.
seam = []

