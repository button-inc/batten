[package]
name = "batten"
description = "Agent-era completion gate: repo-state conformance checks enforced at the agent's tool call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["agents", "conformance", "ci", "git"]

# How `cargo binstall` resolves a release asset (CLOUD-65). Metadata only — it
# adds no dependency and changes nothing about how the crate builds.
#
# The template restates the shape `mise-tasks/dist.sh` decides, which is the one
# place it is allowed to be restated: binstall reads a manifest, not a shell
# script. `mise run install-check` is what keeps the two in agreement, by
# resolving this template and `dist`'s `archive_stem` for every matrix target
# and comparing the results.
#
# `{ archive-suffix }` follows `pkg-fmt`: `.tar.gz` for tgz, `.zip` for the
# Windows override below — the same target-keyed split `dist` makes, so a
# consumer and the builder never disagree about the extension. `bin-dir` says
# the binary sits at the archive root rather than under a directory, which is
# what `dist` produces by archiving from the build directory.
#
# Note the ordering claim this does NOT make: `cargo binstall batten` by name
# needs the crate on a registry, and CLOUD-205 keeps it unpublished. What works
# today is `cargo binstall --git <repo> batten`, and the registry form starts
# working on the day that decision is revisited with no edit here.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-fmt = "zip"

[[bin]]
name = "batten"
path = "src/main.rs"

[lib]
name = "batten"
path = "src/lib.rs"

# The negative case for `no_evaluator_feature_admits_io`, and nothing else
# (CLOUD-831 §7). A gate that is never shown to fail ships as coverage
# (CLOUD-418): the IO-free test asserts a module cannot reach `http.send`, and
# without a build where it CAN that assertion discriminates nothing.
#
# OFF in every shipped and every default build. `tests/evaluator-io.bats` is the
# only caller, and it requires the test to FAIL here — a probe build that stays
# green is the finding, not a pass.
#
# IT COSTS THE CLOSURE NOTHING, which is why this is affordable at all and why
# the `evaluator-closure-check` gate is not weakened by its existence. Measured
# against regorus 0.11.0, 2026-08-21: `http = []` — a bare feature gating only
# the builtin's registration, pulling no package and leaving `Cargo.lock`
# byte-identical. And both gates that read the graph —
# `evaluator-closure-check` and `macos-link-check` — walk ACTIVATED edges from
# `cargo metadata`'s default-feature resolve, so an off-by-default feature is
# invisible to them by construction rather than by luck.
#
# WHY `regorus/jsonschema` IS NOT HERE, stated rather than left as an omission.
# It was measured on the same day and REJECTED: it names `dep:jsonschema` at
# `^0.47`, while this crate's dev-dependency resolves `0.49`, so enabling it
# admits a SECOND copy of the crate — 69 lines of lockfile churn and a duplicate
# `fancy-regex` behind it. A probe feature that changes the shipped lock is no
# longer free, and a duplicate version is a finding `cargo deny` is entitled to
# refuse. `no_evaluator_feature_admits_io` still asserts the jsonschema builtin
# is absent under the shipped set; what it does not get is a second
# feature-flipped negative case, and one discriminator is what CLOUD-418 asks
# for. Recorded on CLOUD-831 so the wider spelling is not reintroduced as a
# completeness fix.
[features]
probe-evaluator-io = ["regorus/http"]

[dependencies]
anyhow.workspace = true
# The HTTP client (CLOUD-745). Declared on the CRATE and not only on the
# workspace, because `macos-link-check` walks ACTIVATED edges from the workspace
# members: a dependency sitting in `[workspace.dependencies]` that no crate names
# is not in the built graph, so the gate passes over a client it never saw.
# Measured -- it reported clean with these lines absent.
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
rustls.workspace = true
rustls-graviola.workspace = true
rustls-pki-types.workspace = true
tokio.workspace = true
tower-service.workspace = true
webpki-roots.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
etcetera.workspace = true
fs4.workspace = true
getrandom.workspace = true
gix.workspace = true
gix-diff.workspace = true
gix-packetline.workspace = true
regorus.workspace = true
globset.workspace = true
hmac.workspace = true
ignore.workspace = true
imara-diff.workspace = true
json5.workspace = true
flate2.workspace = true
regex.workspace = true
regex-syntax.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
proc-macro2.workspace = true
syn.workspace = true
tar.workspace = true
toml.workspace = true
# Unused by this crate BY DESIGN — the edge exists only so the exact pin in
# `[workspace.dependencies]` reaches `cargo-semver-checks`' re-resolve, which
# ignores `Cargo.lock`. The rationale, the measurement and the removal condition
# live with the pin rather than here.
tinyvec.workspace = true
unicode-normalization.workspace = true
# Reading a trust bundle's certificate SUBJECTS, so a `[[provision.env]]` row can
# be conditioned on which CA the host trusts rather than on a refusal it has
# already suffered (CLOUD-1455). A parser rather than a substring search over the
# DER, deliberately: this predicate decides whether to route a tool's traffic
# around somebody's proxy, and non-negotiable rule 3 wants a field match, not a
# byte that happens to appear somewhere in a certificate.
#
# It reaches no ambient authority — no network, no runtime, no process — so it is
# outside `ambient_authority.rs`'s list by property rather than by omission.
x509-cert.workspace = true
yaml-rust2.workspace = true

# Process-group ownership for `batten exec` (CLOUD-427). Unix-only rather than
# in the table above because the whole mechanism is: `setpgid`, the four
# forwarded signals and `killpg` have no Windows analogue, and `exec.rs` gates
# every use of them on `cfg(unix)`. A Windows build therefore links neither
# crate, which is what keeps the topology there exactly what it is today.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true
signal-hook.workspace = true

[dev-dependencies]
# Only what the *tests* need and the crate itself does not. A normal dependency
# is already in scope for every test target, so re-listing one here declares
# nothing — `flate2`, `tar`, `serde_json` and `toml` all sat in both tables and
# every one of them was dead text (CLOUD-217 (42)). `jsonschema` is the one crate
# the shipped binary genuinely does not link.
jsonschema.workspace = true
# CLOUD-106. The snapshot corpus and the two golden manifests are DERIVED from
# the compiled binary's own output: `mise run snapshots` regenerates them and the
# suite diffs them byte-for-byte, so a machine-surface change lands only as a
# reviewed diff. Never hand-edit a `.snap`.
insta.workspace = true
indoc.workspace = true
# CLOUD-1284 arm 4: every `[verdict.vocabulary]` word is ONE token under the
# declared pin. The shipped binary must not link a tokenizer (the workspace
# manifest carries why), and this table is exactly the place a crate the binary
# does not link belongs.
tiktoken-rs.workspace = true

[lints]
workspace = true
