[package]
name = "batten"
description = "Repo-agnostic policy engine that keeps \"done\" aligned with landed-and-verified work."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["policy", "ci"]

[[bin]]
name = "batten"
path = "src/main.rs"

[lib]
name = "batten"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
etcetera.workspace = true
fs4.workspace = true
hmac.workspace = true
flate2.workspace = true
regex.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
yaml-rust2.workspace = true

[dev-dependencies]
# Only what the *tests* need and the crate itself does not. A normal dependency
# is already in scope for every test target, so re-listing one here declares
# nothing — `flate2`, `tar`, `serde_json` and `toml` all sat in both tables and
# every one of them was dead text (CLOUD-217 (42)). `jsonschema` is the one crate
# the shipped binary genuinely does not link.
jsonschema.workspace = true

[lints]
workspace = true
