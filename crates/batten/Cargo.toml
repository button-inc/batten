[package]
name = "batten"
description = "Agent-era completion gate: repo-state conformance checks enforced at the agent's tool call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["agents", "conformance", "ci", "git"]

# How `cargo binstall` resolves a release asset (CLOUD-65). Metadata only — it
# adds no dependency and changes nothing about how the crate builds.
#
# The template restates the shape `mise-tasks/dist` decides, which is the one
# place it is allowed to be restated: binstall reads a manifest, not a shell
# script. `mise run install-check` is what keeps the two in agreement, by
# resolving this template and `dist`'s `archive_stem` for every matrix target
# and comparing the results.
#
# `{ archive-suffix }` follows `pkg-fmt`: `.tar.gz` for tgz, `.zip` for the
# Windows override below — the same target-keyed split `dist` makes, so a
# consumer and the builder never disagree about the extension. `bin-dir` says
# the binary sits at the archive root rather than under a directory, which is
# what `dist` produces by archiving from the build directory.
#
# Note the ordering claim this does NOT make: `cargo binstall batten` by name
# needs the crate on a registry, and CLOUD-205 keeps it unpublished. What works
# today is `cargo binstall --git <repo> batten`, and the registry form starts
# working on the day that decision is revisited with no edit here.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-fmt = "zip"

[[bin]]
name = "batten"
path = "src/main.rs"

[lib]
name = "batten"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
etcetera.workspace = true
fs4.workspace = true
getrandom.workspace = true
gix.workspace = true
regorus.workspace = true
globset.workspace = true
hmac.workspace = true
ignore.workspace = true
json5.workspace = true
flate2.workspace = true
regex.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
yaml-rust2.workspace = true

# Process-group ownership for `batten exec` (CLOUD-427). Unix-only rather than
# in the table above because the whole mechanism is: `setpgid`, the four
# forwarded signals and `killpg` have no Windows analogue, and `exec.rs` gates
# every use of them on `cfg(unix)`. A Windows build therefore links neither
# crate, which is what keeps the topology there exactly what it is today.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true
signal-hook.workspace = true

[dev-dependencies]
# Only what the *tests* need and the crate itself does not. A normal dependency
# is already in scope for every test target, so re-listing one here declares
# nothing — `flate2`, `tar`, `serde_json` and `toml` all sat in both tables and
# every one of them was dead text (CLOUD-217 (42)). `jsonschema` is the one crate
# the shipped binary genuinely does not link.
jsonschema.workspace = true

[lints]
workspace = true
