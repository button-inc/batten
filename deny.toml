# cargo-deny configuration.
#
# Batten adopts cargo-deny's severity model and, as its own consumer #1, runs
# this policy against itself in CI. See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# No `skip-tree`, and the empty state is the point: the one exemption this file
# carried was for `windows-sys@0.59`, arriving via `home` under etcetera 0.10 —
# the newest release that still built under the old 1.85 floor. Since the floor
# tracks the toolchain pin (CLOUD-593) etcetera 0.11 resolves, which drops `home`
# and the old windows-sys outright, so the duplicate it was hiding no longer
# exists. An exemption whose cause is gone narrows the duplicate advisory for
# nothing, which is the state it was added to avoid.

[licenses]
version = 2
# Batten is licensed Apache-2.0; only permissive, Apache-2.0-compatible licenses
# are allowed in the dependency tree so the project stays open-sourceable. (MIT
# and the BSD/ISC family below cover dependencies, not Batten's own license.)
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # CDLA-Permissive-2.0 is `webpki-roots`, which is Mozilla's CA trust store
  # rather than code: the crate is a generated DATA set, and the Community Data
  # License Agreement is the licence that set is published under. It arrived with
  # the HTTP client (CLOUD-745) through `hyper-rustls`'s `webpki-tokio` feature,
  # which is the whole reason that feature was chosen — a vendored root store is
  # what makes the verifier a caller choice rather than a platform dependency.
  #
  # Permissive and Apache-2.0-compatible on the same terms as the rest of this
  # list: version 2 grants unconditional rights to use, share and modify the
  # data, imposes no copyleft on anything that includes it, and attaches no
  # notice requirement to a binary that embeds it.
  "CDLA-Permissive-2.0",
]
# The allow-list above is a deliberately broader, pre-approved set of permissive
# licenses than the current tree happens to pull in. Don't warn when an allowed
# license isn't currently encountered — a pre-approval that isn't exercised yet
# is the intended state, not a misconfiguration.
unused-allowed-license = "allow"
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
