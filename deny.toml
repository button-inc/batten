# cargo-deny configuration.
#
# Batten adopts cargo-deny's severity model and, as its own consumer #1, runs
# this policy against itself in CI. See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# etcetera 0.10 (the newest release that still supports our pinned rustc 1.85 —
# 0.11 requires 1.87) transitively pulls an older windows-sys (0.59, via `home`)
# than the 0.61 the rest of the tree resolves. windows-sys is the Windows FFI
# shim; its multi-versioning is benign and ubiquitous, so skip that subtree to
# keep the duplicate advisory meaningful. Drop this once the MSRV allows
# etcetera 0.11, which removes both `home` and the old windows-sys — the MSRV
# regression that a bump like that introduces is what CLOUD-103 (cargo-msrv)
# gates automatically.
skip-tree = [{ crate = "windows-sys@0.59" }]

[licenses]
version = 2
# Batten is licensed Apache-2.0; only permissive, Apache-2.0-compatible licenses
# are allowed in the dependency tree so the project stays open-sourceable. (MIT
# and the BSD/ISC family below cover dependencies, not Batten's own license.)
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
# The allow-list above is a deliberately broader, pre-approved set of permissive
# licenses than the current tree happens to pull in. Don't warn when an allowed
# license isn't currently encountered — a pre-approval that isn't exercised yet
# is the intended state, not a misconfiguration.
unused-allowed-license = "allow"
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
