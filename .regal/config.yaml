# Regal configuration (CLOUD-876).
#
# WHY REGAL IS HERE AT ALL, since it is a second Rego toolchain beside `opa` and
# regorus. `opa check -s` types a module against a schema; it has nothing to say
# about a module that declares no schema, which is precisely the module that goes
# unchecked. Measured: an unannotated module reading `input.tree.trackd` passes
# `opa check -s` at exit 0. Regal is what reads the corpus's own AST and refuses
# that, so the type check's coverage is a gate rather than a convention.
#
# EVERYTHING ELSE IS OFF. The builtin categories are a style opinion about Rego,
# and adopting a linter's whole opinion is not what this row bought — the one
# custom rule is. Turning the rest on later is a deliberate act with its own
# argument, not a default that arrives with the pin.
rules:
  default:
    level: ignore
  schemas:
    every-package-binds-input:
      # `error` rather than `warning`: `regal lint`'s default `--fail-level` is
      # `error`, and a warning here would report the defect and exit 0, which is
      # the silent-pass shape this rule exists to close.
      level: error
