# A WALL-CLOCK CASE MUST NOT SHARE THE BOX WITH THE SUITE (CLOUD-1444).
#
# `crates/batten/tests/it/shell_retirement_cost.rs` decides a step-change — is the
# retirement ledger indexed once, or scanned once per deleted path — by timing
# three arms and comparing their differences. Differences amplify noise, so the
# reading is only meaningful when nothing else is competing for the machine.
#
# Nothing declared that, so it ran under nextest's default parallelism against
# 2834 siblings. Measured on this container, two consecutive `mise run land` laps:
#
#   0.46s / 1.12s / 2.06s   second step 938ms against a first step of 663ms
#   0.41s / 1.01s / 1.61s   second step 603ms against a first step of 600ms
#
# and the same case, run alone on the same tree seconds later, PASSES. The module
# is unchanged between those readings; only the load differs. The healthy shape is
# 0.36s / 0.85s / 0.91s — a second step ~8x smaller than the first — so a loaded
# run lands between the healthy reading and the 2x the unflattened module produces,
# which is the one place the assertion cannot tell them apart.
#
# `threads-required = "num-test-threads"` gives the case the whole budget, so
# nextest runs it alone. THE THRESHOLDS ARE UNTOUCHED, deliberately: the file's own
# header records `RATIO` being raised 3 -> 8 because "a bound that a green tree
# fails on a slower box is measuring the box", and loosening the linearity term
# instead would have to sit between a loaded reading of 1.42 and the defect's 2.0 —
# tuned on two noisy samples, and 25% from the thing it exists to catch. Isolating
# the measurement removes the noise rather than widening the bound to admit it.
#
# `rules/rust.md` says to assert this class with a counter and a repeat-run
# comparison rather than a clock. That remains the durable fix and needs a counter
# over Rego evaluation the engine does not expose today: `RuleCost` carries
# `files_read` and `bytes_read`, which count acquisitions at the boundary and so
# cannot see an O(n*m) evaluation over a document already in hand.

# THE SLOW-TEST TERMINATOR, AND ITS RATCHET (CLOUD-1571 follow-on).
#
# `slow-timeout.period` is when nextest MARKS a case slow and prints it;
# `period x terminate-after` is when it KILLS it, reporting TIMEOUT — and a
# TIMEOUT is a FAILURE, because `on-timeout` defaults to "fail". So this pair is
# the ban on slow tests, enforced by the runner on every local run and in CI.
# Nothing in batten re-derives the measurement; `policy/nextest-slow.rego` only
# refuses weakening what is written here.
#
# WHY THE RUNNER RATHER THAN A GATE OF OUR OWN. A hand-rolled wall-clock
# assertion is the instrument this repository has already refused twice:
# `mise-tasks/suite-bench-check.sh` records that a duration gate "would be red on
# every second run and would be bypassed within a day", and CLOUD-1419 wrote an
# aggregate ratchet and withdrew it in the same branch because its first firing
# was on the change that improved the thing it guarded. nextest's own timeout has
# neither problem: it is per-case, it carries filtered per-case overrides, and it
# is maintained upstream.
#
# THE NUMBERS COME FROM A MEASURED FULL RUN, not from a target. 5,021 cases, all
# passing, summed 987.5s against 255.5s wall:
#
#   p50 42ms | p95 671ms | p99 2.53s | max 64.85s
#   over 10s: 11 cases | over 20s: 5 | over 30s: 2 | over 60s: 1
#
# `period = "10s"` names 11 cases here and 8 on Windows on every run — the
# VISIBILITY half, and the number a reader scans for. `terminate-after = 30` kills
# at 300s.
#
# THE DAY-ONE KILL IS A RUNAWAY GUARD RATHER THAN A PER-CASE SLOW BAN, and that
# is a measured retreat rather than a preference. Three calibration attempts were
# each refused by CI:
#
#   90s default   -> `agentic_record::a_replay_...` TIMEOUT at 90.022s under
#                    `verify` load, where it is 64.849s on a quiet box
#   240s override -> the same case TIMEOUT at 240.210s on the `windows` runner
#   90s default   -> the three `symbols` cases TIMEOUT at ~90.2s on `windows`
#
# The last one is the instructive one and it was already written down. CLOUD-1439
# records that those three share ONE cold `cargo clippy` build, so under
# parallelism one builds and two WAIT, and nextest bills all three the build —
# which is the same effect this file already names, at the scale of a build rather
# than a lock. On the Windows runner that build is far slower than on any box this
# repository can measure from.
#
# So a fourth guess at a number nobody here can observe would be the same mistake
# a fourth time. The kill starts above the whole known band — Windows shows 8
# cases over 10s and 3 over 90s — and tightening it toward the per-case target is
# what the ratchet is for, one reviewed step at a time, on cross-platform data
# nobody had when it was armed. `policy/nextest-slow.rego` gates the PRODUCT,
# `period x terminate-after`, so the bound cannot be weakened by raising either
# half alone.
[profile.default]
slow-timeout = { period = "10s", terminate-after = 30 }

[[profile.default.overrides]]
filter = 'test(deleting_six_governed_paths_costs_a_flat_multiple_of_the_floor)'
threads-required = "num-test-threads"

# THE ONE NAMED EXCEPTION TO THE SLOW-TEST BAN, and it is filed (CLOUD-1641).
#
# This case is the suite's slowest by a wide margin: 64.849s on a quiet box
# against 30.844s for the next slowest and a 42ms median. It is 2.1x the runner-up
# and 1,544x the median, and nothing else is within a factor of two of it.
#
# THE BAN CAUGHT IT, WHICH IS THE MECHANISM WORKING RATHER THAN A REASON TO WIDEN
# THE CEILING. Armed at a 90s kill, `verify` reported
# `TIMEOUT [ 90.022s]` for this case — it clears 90s alone and crosses it once the
# suite shares the machine with the rest of the gate set. That is the effect the
# block above already names: nextest bills a case for its whole time in flight
# including time spent BLOCKED (CLOUD-1439), so a quiet reading is a floor and not
# a number to plan against. The 90s default was set at ~1.4x the quiet reading and
# that headroom was too thin for this one case.
#
# SO THE EXCEPTION IS NAMED RATHER THAN THE BOUND RAISED. Widening the default
# would spend the ban for all 5,020 other cases to accommodate one; an override
# holds the ban everywhere else and puts this case's cost somewhere a reader can
# see it. CLOUD-1641 is the row that makes the case fast enough to delete this
# block — and until it lands, this case is the binding constraint on every step of
# the ratchet, because the ceiling cannot go below what the worst case needs.
#
# THIS IS AN EXEMPTION, NOT A CALIBRATED BOUND, and it says so out loud because
# two attempts to calibrate it were both refused. The first set 240s at ~3.7x the
# 64.849s Linux figure; the `windows` runner reported `TIMEOUT [ 240.210s]`
# anyway. It is under 65s here and over 240s there, and 240s is a floor rather
# than a measurement, because the case was killed at the threshold and nobody yet
# knows what it actually costs on the slowest runner.
#
# 1200s is therefore chosen to sit above any plausible runner rather than to
# describe this case. It survives even though the default kill is now 300s and
# would otherwise cover it: the point of keeping the row is that this case is
# KNOWN to exceed a bound the ratchet intends to walk down, so it is the first
# thing the next step trips over. Deleting it is CLOUD-1641's acceptance; widening
# it again is that row failing rather than progressing.
[[profile.default.overrides]]
filter = 'test(a_replay_over_the_committed_records_fires_on_every_required_key)'
slow-timeout = { period = "10s", terminate-after = 120 }
