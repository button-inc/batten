# THE SCRATCH PARENT IS COLLECTED ONCE PER RUN (CLOUD-1879).
#
# `common::scratch` wipes its OWN path before writing, always — `common/mod.rs`'s
# header is emphatic about it, and that is what keeps one case from inheriting
# another's leftovers. Nothing wiped the PARENT, so every run left its fixtures
# behind and the next run paid for them.
#
# MEASURED on this container, same commit, same profile, same binary, idle box.
# The only variable is how many stale directories `target/tmp` held at the start:
#
#   entries at start   wall      summed    agentic_record   shell_retirement
#   0                  194.5s    741.0s      8.7s             77.7s
#   ~1250              203.7s    777.8s     10.8s             74.6s
#   3750               220.9s    846.3s     93.5s             74.8s
#
# +13.5% wall clock, monotonic, and one run creates 3248 entries / ~300 MB.
# `shell_retirement` is flat across all three, so the effect is specific rather
# than ambient noise. `agentic_record` swings 10.7x on sibling count ALONE —
# uniformly across every case in the file, including
# `a_tree_with_no_records_at_all_is_silent`, a synthetic empty-tree fixture, at
# 0.20s -> 4.51s. A 22x slowdown on a case with nothing to read is not that
# case's work.
#
# WHY A SETUP SCRIPT AND NOT `scratch` COLLECTING SIBLINGS. nextest runs each case
# in its own process, concurrently; a fixture deleting a sibling's directory is
# exactly the "one case deleting another's `.git` mid-run" failure
# `common/mod.rs` records being repaired one file at a time. A setup script runs
# ONCE, before any test process exists, so it cannot race one.
#
# WHY NOT IN `[tasks."test:cargo"]`. That task is one door — `verify`, `ci` and
# `mise run test` all reach the suite through it — but `windows`, `macos` and
# `musl` call `mise exec -- cargo nextest run --workspace` directly and would be
# uncovered. Those run on fresh runners where nothing accumulates, so the gap is
# harmless today and would be silent the day it is not.
#
# WIPE AT START, NEVER AT END, which is `cargo-test-support`'s property and worth
# keeping: a failing case leaves its tree on disk to `cd` into. Collection here is
# the previous run's, never this one's.
#
# The guard is not decoration: this removes a directory tree, so it refuses any
# path that is not the scratch parent rather than trusting the expansion.
experimental = ["setup-scripts"]

[scripts.setup.clear-scratch]
# `tr -d` ON THE COUNT, AND IT IS A PORTABILITY BUG RATHER THAN TIDINESS.
# BSD `wc -l` (macOS) pads its output to a fixed width — `"       0"` — where GNU
# `wc -l` emits the bare digits. `$(...)` strips newlines and NOT leading spaces,
# so the published value parsed on the glibc and musl lanes and failed on macos
# alone. Measured: run 35539151175, `the_collector_ran_for_this_run` red with
# `got "       0"` while 5006 other cases passed. The contract this publishes is
# a COUNT, so it is normalised here rather than tolerated at every reader.
command = """sh -c 'd="${CARGO_TARGET_DIR:-target}/tmp"; case "$d" in */tmp) ;; *) echo "clear-scratch: refusing $d" >&2; exit 1 ;; esac; n=$(ls -1 "$d" 2>/dev/null | wc -l | tr -d "[:space:]"); rm -rf "$d" && mkdir -p "$d" && echo "BATTEN_SCRATCH_COLLECTED=$n" >> "$NEXTEST_ENV"'"""

[[profile.default.scripts]]
filter = "all()"
setup = "clear-scratch"

# A WALL-CLOCK CASE MUST NOT SHARE THE BOX WITH THE SUITE (CLOUD-1444).
#
# `crates/batten/tests/it/shell_retirement_cost.rs` decides a step-change — is the
# retirement ledger indexed once, or scanned once per deleted path — by timing
# three arms and comparing their differences. Differences amplify noise, so the
# reading is only meaningful when nothing else is competing for the machine.
#
# Nothing declared that, so it ran under nextest's default parallelism against
# 2834 siblings. Measured on this container, two consecutive `mise run land` laps:
#
#   0.46s / 1.12s / 2.06s   second step 938ms against a first step of 663ms
#   0.41s / 1.01s / 1.61s   second step 603ms against a first step of 600ms
#
# and the same case, run alone on the same tree seconds later, PASSES. The module
# is unchanged between those readings; only the load differs. The healthy shape is
# 0.36s / 0.85s / 0.91s — a second step ~8x smaller than the first — so a loaded
# run lands between the healthy reading and the 2x the unflattened module produces,
# which is the one place the assertion cannot tell them apart.
#
# `threads-required = "num-test-threads"` gives the case the whole budget, so
# nextest runs it alone. THE THRESHOLDS ARE UNTOUCHED, deliberately: the file's own
# header records `RATIO` being raised 3 -> 8 because "a bound that a green tree
# fails on a slower box is measuring the box", and loosening the linearity term
# instead would have to sit between a loaded reading of 1.42 and the defect's 2.0 —
# tuned on two noisy samples, and 25% from the thing it exists to catch. Isolating
# the measurement removes the noise rather than widening the bound to admit it.
#
# `rules/rust.md` says to assert this class with a counter and a repeat-run
# comparison rather than a clock. That remains the durable fix and needs a counter
# over Rego evaluation the engine does not expose today: `RuleCost` carries
# `files_read` and `bytes_read`, which count acquisitions at the boundary and so
# cannot see an O(n*m) evaluation over a document already in hand.

# THE HANG GUARD, AND THE RATCHET THAT WILL BECOME A SLOW-TEST BAN (CLOUD-1571).
#
# `slow-timeout.period` is when nextest MARKS a case slow and prints it;
# `period x terminate-after` is when it KILLS it, reporting TIMEOUT — a FAILURE,
# because `on-timeout` defaults to "fail". `policy/nextest-slow.rego` gates the
# PRODUCT, so neither half can be raised alone to weaken it.
#
# WHAT THIS BOUNDS TODAY IS A HANG, NOT A BUDGET, and that retreat is measured
# rather than preferred. Four calibrated kills were each refused by CI:
#
#   90s   -> `agentic_record::a_replay_...`  TIMEOUT 90.022s, under verify load
#   240s  -> the same case                   TIMEOUT 240.210s, windows runner
#   90s   -> the three `symbols` cases       TIMEOUT ~90.2s,   windows runner
#   300s  -> four `mutate` cases             TIMEOUT 300.0s,   2-vCPU linux ci
#
# The last is the clearest: those four are ~9s each on this container. A 30x
# spread between the box a threshold is chosen on and the runners it is enforced
# on means no locally-measured per-case number is safe, and every kill DESTROYS
# the measurement that would have set the right one — each line above is the
# threshold the case was stopped at, never what it costs. Five guesses would be
# the same mistake five times.
#
# SO THE NUMBER COMES FROM THE JOB BUDGET INSTEAD, which is a real bound rather
# than a guess. `ci.yml` declares `timeout-minutes: 87` for this job on this
# repository's own convention of measured p95 x3. A 1200s per-test kill sits far
# above every case observed on any runner, well inside that budget so it names
# the failing TEST rather than letting the job die anonymously, and still catches
# the class the ban exists for: a genuine hang. Measured on this branch —
# `land.bats`'s mid-wait race sat 40 MINUTES at 0% CPU holding the landing lease
# (CLOUD-1661), which is what an unbounded case actually costs.
#
# `period = "10s"` is unchanged and is the VISIBILITY half: 11 cases here, 8 on
# windows, 4 on the ci runner are named on every run. That list, gathered across
# platforms over time, is what a future step ratchets the kill down onto — with
# data nobody had when this was first armed.
#
# NO PER-CASE OVERRIDES REMAIN. The three that existed — `agentic_record` and the
# `symbols` trio — were each 1200s, so the default now covers them and a separate
# row would assert a bound it no longer sets. CLOUD-1641 still owns
# `agentic_record`'s real cost and is NOT closed by this: the override went away
# because the floor rose, not because the case got fast.
[profile.default]
slow-timeout = { period = "10s", terminate-after = 120 }

[[profile.default.overrides]]
filter = 'test(deleting_six_governed_paths_costs_a_flat_multiple_of_the_floor)'
threads-required = "num-test-threads"
