# THE SCRATCH PARENT IS COLLECTED ONCE PER RUN (CLOUD-1879).
#
# `common::scratch` wipes its OWN path before writing, always — `common/mod.rs`'s
# header is emphatic about it, and that is what keeps one case from inheriting
# another's leftovers. Nothing wiped the PARENT, so every run left its fixtures
# behind and the next run paid for them.
#
# MEASURED on this container, same commit, same profile, same binary, idle box.
# The only variable is how many stale directories `target/tmp` held at the start:
#
#   entries at start   wall      summed    agentic_record   shell_retirement
#   0                  194.5s    741.0s      8.7s             77.7s
#   ~1250              203.7s    777.8s     10.8s             74.6s
#   3750               220.9s    846.3s     93.5s             74.8s
#
# +13.5% wall clock, monotonic, and one run creates 3248 entries / ~300 MB.
# `shell_retirement` is flat across all three, so the effect is specific rather
# than ambient noise. `agentic_record` swings 10.7x on sibling count ALONE —
# uniformly across every case in the file, including
# `a_tree_with_no_records_at_all_is_silent`, a synthetic empty-tree fixture, at
# 0.20s -> 4.51s. A 22x slowdown on a case with nothing to read is not that
# case's work.
#
# THE SIBLINGS ARE COLLECTED BY THE CASES NOW, UNDER A LOCK (CLOUD-2789). This
# header once argued a setup script over `scratch` collecting siblings, because
# a case deleting a sibling's directory was the "one case deleting another's
# `.git` mid-run" failure. That holds for a sibling CASE's directory; a sibling
# RUN's is a different object, and "before any test process exists" held only
# within one invocation. So a run's directory is removed only by a process that
# holds its lock exclusively, which no live case of it allows; see
# `[scripts.setup.clear-scratch]` below for what the script still collects.
#
# WHY NOT IN `[tasks."test:cargo"]`. That task is one door — `verify`, `ci` and
# `mise run test` all reach the suite through it — but `windows`, `macos` and
# `musl` call `mise exec -- cargo nextest run --workspace` directly and would be
# uncovered. Those run on fresh runners where nothing accumulates, so the gap is
# harmless today and would be silent the day it is not.
#
# WIPE AT START, NEVER AT END, which is `cargo-test-support`'s property and worth
# keeping: a failing case leaves its tree on disk to `cd` into. Collection here is
# the previous run's, never this one's.

experimental = ["setup-scripts"]

[scripts.setup.clear-scratch]
# `tr -d` ON THE COUNT, AND IT IS A PORTABILITY BUG RATHER THAN TIDINESS.
# BSD `wc -l` (macOS) pads its output to a fixed width — `"       0"` — where GNU
# `wc -l` emits the bare digits. `$(...)` strips newlines and NOT leading spaces,
# so the published value parsed on the glibc and musl lanes and failed on macos
# alone. Measured: run 35539151175, `the_collector_ran_for_this_run` red with
# `got "       0"` while 5006 other cases passed. The contract this publishes is
# a COUNT, so it is normalised here rather than tolerated at every reader.
#
# `target/`'S SCRATCH IS NOT THIS SCRIPT'S ANY MORE (CLOUD-2789). Each run writes
# under `<CARGO_TARGET_TMPDIR>/run-<NEXTEST_RUN_ID>`, every case of it holding a
# shared lock on `run-<id>.lock` for its life, and the first case of the next
# run removes only entries whose lock it can take exclusively: a finished run's
# (`tests/it/common/mod.rs`, `target_tmp`). This script used to `rm -rf`
# `target/tmp` and every `target/*/tmp`, guarded by guessing which other
# `cargo-nextest` shared the directory (its cwd, its `CARGO_TARGET_DIR`), and
# each new layout escaped the guess: `batten test replay` builds under
# `target/replay` from a tree outside the checkout, so a suite started here
# wiped `target/replay/tmp` under the replay's live cases (CLOUD-1912, -1976,
# -2716 and #1276 were the earlier escapes). The lock is the owner itself, so
# no layout escapes it, and no glob here reaches another run's scratch.
#
# WHAT IS LEFT IS THE SHARED TEMP ROOT (CLOUD-2716). Unit cases scratch under
# `std::env::temp_dir()`, which nothing collected: 29,597 entries in `/tmp`
# filled the disk under a cargo-mutants baseline. Each run gets
# `${TMPDIR:-/tmp}/batten-suite`, wiped only when no other `cargo-nextest` is
# alive on the machine (its own parent, `$PPID`, excluded), since any of them
# may be writing there; a deferred run publishes 0. Where `pgrep` does not exist
# the runner is a fresh CI box running one nextest, and the collection proceeds.
# NOT under `target/`: a fixture whose subject is "not a repository" lives in
# the temp dir precisely because it is outside this checkout
# (`common::scratch_outside_tree`). `BATTEN_SCRATCH_ROOTS` names it, as a
# `pwd -P` path, so `scratch_hygiene.rs` can assert a case's temp dir is under it.
#
# `BATTEN_ENGINE=local` (CLOUD-2232) is Go's `GOTOOLCHAIN=local`: the suite tests
# the engine it built, so a branch's SOURCE pin is not enforced on it. The
# engine-pin cases unset it, since enforcement is what they test; a release pin
# is enforced either way.
command = """sh -c 'others=0; if command -v pgrep >/dev/null 2>&1; then for p in $(pgrep -x cargo-nextest); do [ "$p" = "$PPID" ] && continue; others=$((others + 1)); done; fi; n=0; suite="${TMPDIR:-/tmp}/batten-suite"; if [ "$others" -eq 0 ]; then n=$(ls -1 "$suite" 2>/dev/null | wc -l | tr -d "[:space:]"); rm -rf "$suite"; fi; mkdir -p "$suite" && suite=$(cd "$suite" && pwd -P) && echo "BATTEN_SCRATCH_COLLECTED=$n" >> "$NEXTEST_ENV" && echo "BATTEN_SCRATCH_ROOTS=$suite" >> "$NEXTEST_ENV" && echo "TMPDIR=$suite" >> "$NEXTEST_ENV" && echo "BATTEN_ENGINE=local" >> "$NEXTEST_ENV"'"""

[[profile.default.scripts]]
filter = "all()"
setup = "clear-scratch"

# THE HANG GUARD, AND THE RATCHET THAT WILL BECOME A SLOW-TEST BAN (CLOUD-1571).
#
# `slow-timeout.period` is when nextest MARKS a case slow and prints it;
# `period x terminate-after` is when it KILLS it, reporting TIMEOUT — a FAILURE,
# because `on-timeout` defaults to "fail". `policy/nextest-slow.rego` gates the
# PRODUCT, so neither half can be raised alone to weaken it.
#
# WHAT THIS BOUNDS TODAY IS A HANG, NOT A BUDGET, and that retreat is measured
# rather than preferred. Four calibrated kills were each refused by CI:
#
#   90s   -> `agentic_record::a_replay_...`  TIMEOUT 90.022s, under verify load
#   240s  -> the same case                   TIMEOUT 240.210s, windows runner
#   90s   -> the three `symbols` cases       TIMEOUT ~90.2s,   windows runner
#   300s  -> four `mutate` cases             TIMEOUT 300.0s,   2-vCPU linux ci
#
# The last is the clearest: those four are ~9s each on this container. A 30x
# spread between the box a threshold is chosen on and the runners it is enforced
# on means no locally-measured per-case number is safe, and every kill DESTROYS
# the measurement that would have set the right one — each line above is the
# threshold the case was stopped at, never what it costs. Five guesses would be
# the same mistake five times.
#
# SO THE NUMBER COMES FROM THE JOB BUDGET INSTEAD, which is a real bound rather
# than a guess. `ci.yml` declares `timeout-minutes: 87` for this job on this
# repository's own convention of measured p95 x3. A 1200s per-test kill sits far
# above every case observed on any runner, well inside that budget so it names
# the failing TEST rather than letting the job die anonymously, and still catches
# the class the ban exists for: a genuine hang. Measured on this branch —
# `land.bats`'s mid-wait race sat 40 MINUTES at 0% CPU holding the landing lease
# (CLOUD-1661), which is what an unbounded case actually costs.
#
# `period = "10s"` is unchanged and is the VISIBILITY half: 11 cases here, 8 on
# windows, 4 on the ci runner are named on every run. That list, gathered across
# platforms over time, is what a future step ratchets the kill down onto — with
# data nobody had when this was first armed.
#
# NO PER-CASE OVERRIDES REMAIN. The three that existed — `agentic_record` and the
# `symbols` trio — were each 1200s, so the default now covers them and a separate
# row would assert a bound it no longer sets. CLOUD-1641 still owns
# `agentic_record`'s real cost and is NOT closed by this: the override went away
# because the floor rose, not because the case got fast.
#MUTANT store-moved|s@^\[profile\.default\]$@[store]\ndir = "target/elsewhere"\n\n[profile.default]@|every_report_lands_where_record_suites_reads_it
[profile.default]
slow-timeout = { period = "10s", terminate-after = 120 }
# EVERY RUN REPORTS EVERY FAILURE. nextest's default fail-fast stops scheduling
# at the first failure, so a leg reports one defect per CI round: the macos job
# stopped at 2 failures with 1,814 cases never run, and the windows, macos and
# musl legs call `cargo nextest run --workspace` without `--no-fail-fast`. Set
# here, once, it covers every invocation that reads this file — including one
# added later that never heard of the flag.
fail-fast = false
# NO RETRIES, STATED RATHER THAN INHERITED (CLOUD-2789). nextest's default is
# 0 today; a retry turns a case whose result depends on load into a green that
# hides it, and this repository's gates are only as deterministic as their
# suite. `narrow` inherits it and `mutants` restates it;
# `scratch_hygiene::no_profile_retries_a_failure` holds every profile to 0.
retries = 0

# EVERY RUN LEAVES ITS PER-CASE TIMES BEHIND (CLOUD-2059). nextest writes this to
# `target/nextest/<profile>/junit.xml`, and `batten record suites` reads it into a
# per-module table. Before it, the only per-case figures were whatever scrolled
# past in a terminal, so "which module is slow" was answered by grepping logs that
# a container reclaim deletes. CI runs this same profile (CLOUD-2588), so a CI
# leg's report is the same file under the same name.
#MUTANT-SUITE crates/batten/tests/it/junit_wired.rs
#MUTANT junit-unwired|s@^path = "junit.xml"$@path = ""@|the_default_profile_writes_a_junit_report
[profile.default.junit]
path = "junit.xml"

# CHEAP CASES FIRST. A unit case decides in milliseconds; an `it` case spawns
# the binary and builds a fixture repository. Scheduling the unit cases first
# means the first failure, and the mutant it catches under `mutants`'
# fail-fast, arrives at unit speed whenever a unit case can see it (operator
# ruling, 2026-11-10: order the tests from cheap to expensive). Priority orders
# scheduling only; every case still runs under `default`'s no-fail-fast.
# Overrides on `default` apply to every profile, `mutants` and `narrow` included.
[[profile.default.overrides]]
filter = 'kind(lib)'
priority = 100

# NO `ci` PROFILE (CLOUD-2588). It set nothing of its own and inherited every
# key from `default`, so selecting it under `$CI` moved only the report
# directory, while making CI's environment one `verify` never ran under. CI runs
# `default`, `fail-fast = false` included: a red CI leg must still report every
# failure, or each fix buys another matrix to find the next one (review of #928).

# THE SUBSET GATES' PROFILE, so a filtered run never overwrites the full run's
# report (CLOUD-2059). The junit stanza above writes under the PROFILE's store
# directory, and `verify` runs seven one-module gates (`test:config-schema` and
# its siblings) beside the full suite. Measured: the full suite's 7,497-case
# report was replaced by a 12-case one from whichever subset finished last, so
# the reading `record suites` exists to keep was the one a verify lap destroyed.
# Those tasks select this profile through `NEXTEST_PROFILE`, and it inherits
# every key from `default`, so they report into `target/nextest/narrow/` instead.
#MUTANT narrow-profile-undeclared|s@^\[profile\.narrow\]$@[profile.narrow-gone]@|a_subset_gate_never_overwrites_the_full_suites_report
#MUTANT narrow-report-renamed|s@^\[profile\.narrow\]$@[profile.narrow]\njunit = { path = "narrow.xml" }@|every_report_lands_where_record_suites_reads_it
[profile.narrow]

# cargo-mutants' runs (CLOUD-2253), selected by `mutant:changed`'s
# `NEXTEST_PROFILE`. A mutant is decided by its first failing case, so the run
# stops there, and a retry would turn a caught mutant into a flake read as
# missed. Every other key, the setup script included, is `default`'s.
[profile.mutants]
fail-fast = true
retries = 0
