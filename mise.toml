MUTANT_TASKS = "mise.toml"

# --- GitHub reachability behind an egress proxy (Claude Code web sandbox etc.) ---
# mise resolves every tool's release through GitHub's *API* host, api.github.com.
# When an egress proxy fronts the network (HTTPS_PROXY set) and injects a
# repo-scoped token, that host answers 403 for third-party tool repos and a bare
# `mise install` fails ("GitHub access to this repository is not enabled"). The
# fix is not to give up — GitHub is reachable — it is to send just the API/asset
# hosts straight to GitHub, over the direct route (our tools are public repos, so
# unauthenticated resolution works there; GH_TOKEN below still carries our PAT):
#   * NO_PROXY gains api.github.com (+ the redirect/asset hosts) so those calls
#     bypass the proxy. github.com itself is deliberately left proxied, so git
#     keeps its proxy-provided auth to button-inc/batten. The guard appends once
#     and preserves the existing NO_PROXY (which carries pypi.org/crates so the
#     uv-backed Serena install keeps working). Off-sandbox there is no proxy, so
#     this is a no-op.
# See AGENTS.md, "GitHub is reachable — never report the toolchain as unrunnable".
# `gh` and zizmor read GH_TOKEN. In the sandbox the ambient GH_TOKEN is a proxy
# placeholder that 401s when sent direct (NO_PROXY, above), so set it to our PAT;
# in CI there is no PAT, so fall back to MISE_GITHUB_TOKEN, which mise-action sets
# to the job token. Both are valid, non-empty tokens (never the proxy
# placeholder), so a tool that rejects an *empty* GH_TOKEN — like zizmor — works
# in both.
#
# `BATTEN_GITHUB_TOKEN` sits between them because that is the name THIS container
# actually injects (CLOUD-1474). With only the two original names in the chain
# neither was set, GH_TOKEN resolved EMPTY, and the fence above then sent the
# ambient `proxy-` placeholder GITHUB_TOKEN straight to GitHub — which is the
# reported 401, and not a repository-scope verdict. Measure with `mise cache
# clear` before EACH arm: without it the first arm that succeeds makes every
# later arm pass from cache, which is how this was misread three times.
GH_TOKEN = "{{ get_env(name='GITHUB_PERSONAL_ACCESS_TOKEN', default=get_env(name='BATTEN_GITHUB_TOKEN', default=get_env(name='MISE_GITHUB_TOKEN', default=''))) }}"
# THE OTHER HALF OF THE SAME REPAIR, and its absence is why the paragraph above
# describes a 401 the paragraph above did not fix. `GH_TOKEN` is what `gh` and
# zizmor read; `GITHUB_TOKEN` is what MISE'S OWN backends read — aqua, the
# `github:` backend, every tool resolution in `[tools]`. Setting only the first
# left the second holding the ambient `proxy-` placeholder, so the moment
# `NO_PROXY` sends a call direct the placeholder goes with it and GitHub answers
# 401. Measured 2026-09-09 on a cold container: `mise install` resolved nine
# tools and 401'd on the four that needed a release listing, with the fix for
# exactly that failure sitting two lines above, applied to the wrong name.
#
# AN EXPLICIT AMBIENT VALUE OUTRANKS THE INTERNAL CHAIN, and the reverse
# precedence is what broke the release (CLOUD-1789). `MISE_GITHUB_TOKEN` is the
# last leg of `ours`, and in CI the mise setup action SETS it — to the default job
# token, not to whatever credential the job chose. So an `ours`-first rule reads
# mise-action's own token and overwrites the `GITHUB_TOKEN` the job deliberately
# exported, which for `release-plz.yml` is `RELEASE_PLZ_TOKEN`. Measured: tags
# v0.0.159 and v0.0.160 were authored by `github-actions[bot]` rather than the
# PAT, and a release published by the job token fires no `release` event, so
# `release-artifacts.yml` never ran and both releases went out incomplete.
#
# The placeholder discrimination is unchanged and is the only reason ambient is
# not simply taken: a `proxy-` value is a string that authenticates as nobody,
# and sending it is strictly worse than sending nothing (60 requests/hour
# unauthenticated beats a 401). So ambient wins WHEN IT IS REAL, and `ours` is
# the fallback for the sandbox, where ambient is the placeholder and the PAT
# variables carry the only usable credential.
GITHUB_TOKEN = "{% set ours = get_env(name='GITHUB_PERSONAL_ACCESS_TOKEN', default=get_env(name='BATTEN_GITHUB_TOKEN', default=get_env(name='MISE_GITHUB_TOKEN', default=''))) %}{% set ambient = get_env(name='GITHUB_TOKEN', default='') %}{% if ambient and ambient | truncate(length=6, end='') != 'proxy-' %}{{ ambient }}{% elif ours %}{{ ours }}{% endif %}"
NO_PROXY = "{% set cur = get_env(name='NO_PROXY', default='') %}{% if 'api.github.com' in cur %}{{ cur }}{% else %}api.github.com,objects.githubusercontent.com,codeload.github.com,uploads.github.com{% if cur %},{{ cur }}{% endif %}{% endif %}"
no_proxy = "{% set cur = get_env(name='no_proxy', default=get_env(name='NO_PROXY', default='')) %}{% if 'api.github.com' in cur %}{{ cur }}{% else %}api.github.com,objects.githubusercontent.com,codeload.github.com,uploads.github.com{% if cur %},{{ cur }}{% endif %}{% endif %}"

# THE BINARY AN ARGV TASK RUNS, spelled once. A retired bash gate chose its batten
# with `if [[ -n "${BATTEN_BIN:-}" ]]; then batten=("$BATTEN_BIN"); else batten=(cargo
# run --quiet -p batten --); fi`, and an argv `run = [...]` has no shell to say it
# in — so it is a var every argv entry opens with, and `BATTEN_BIN` still names the
# binary under test (the tiers set it; `test:bats` exports it). Without it a task
# composed from a fixture — `board-sweep`'s gates, under a `CARGO_TARGET_DIR` that
# puts the fixture beneath another checkout — builds whatever workspace cargo finds
# by walking up, which is not the engine being tested (CLOUD-843).
[vars]
batten = "{{ get_env(name='BATTEN_BIN', default='cargo run --quiet -p batten --') }}"
# The duplicate-close window, in characters of an ISO-8601 stamp: 19 is the
# second, and `DUPLICATE_CLOSE_WINDOW` widens it, as the retired body let it.
duplicate_close_window = "{{ get_env(name='DUPLICATE_CLOSE_WINDOW', default='19') }}"

[tasks.fmt]
description = "Run every fixer over the tree (rustfmt, shfmt, taplo, deno fmt) — hk owns the step list"
run = "hk fix --all"

[tasks.snapshots]
description = "Accept the snapshot corpus and the golden manifests — this repo's `insta accept` (CLOUD-106)"
# The fourth derivation, beside `completions`, `man` and `schema`. The compiled
# binary's own output is authoritative (§1); the committed `.snap` files and the
# two golden manifests are derived from it, and `mise run test:cargo` is what
# diffs them. So this is the ACCEPT half — run it when a machine-surface change
# is deliberate, and review the diff it leaves.
#
# NO `cargo-insta` PIN, and that is upstream's constraint rather than a
# preference — the cargo-fuzz and cargo-msrv shape recorded in `[tools]`.
# `aqua:mitsuhiko/insta` publishes no `linux-arm64` asset, so `mise lock` writes
# a version row and zero platform entries and `mise run lock-complete` refuses
# it, correctly: an arm64 sandbox could not provision it at all. The `cargo:`
# backend that would sidestep that is refused by `no-source-built-tool`.
#
# None is needed. `insta` is a dev-DEPENDENCY, so the library writes the corpus
# itself when `INSTA_UPDATE` says to; the binary only ever added a nicer review
# UI on top of that. So the accept half is the suite, run with the variable set.
#
# `--test it snapshots::`, AND THAT BOUND IS NOT COSMETIC. This runs `cargo test`,
# which runs a target's cases as THREADS IN ONE PROCESS, while this workspace's
# runner is nextest, which gives each case its own. At least one suite depends on
# that isolation: `document_read_count` asserts a per-process acquisition COUNT,
# so under `cargo test` it reads its siblings' reads and fails — measured at 10
# against an expected 1, on an unmodified tree. Running the whole workspace here
# would report a failure that says nothing about snapshots, every time.
#
# So this REGENERATES; `mise run test:cargo` remains the thing that JUDGES. Two
# bounds it accepts, both sensed rather than assumed: a snapshot added outside
# the `snapshots` target is not written here, and an unreferenced one is not
# pruned. `no_pending_snapshot_is_left_in_the_tree` is the sensor on the first,
# and `--unreferenced` is what a pinned binary would have bought for the second.
#
# TWO ARGV ENTRIES, NOT A SHELL LINE (CLOUD-843, CLOUD-1991). mise runs an array
# in order and stops at the first entry that fails, with that entry's exit code —
# so the accept still fails loudly if the clear does, which is all the `&&` of the
# one-liner this replaced was buying. `INSTA_UPDATE` is the task's `env` rather
# than a `VAR=` prefix, and the clear is `git clean` over a pathspec rather than
# `find -delete`: the same set (a `.snap.new` is never tracked, and `-x` reaches
# it whether or not it is ignored), and a missing directory is an empty clean
# rather than a failure that never reaches `cargo`.
#
# The clear comes FIRST. Under `INSTA_UPDATE=always` every snapshot a run reaches
# is written in place, so a `.snap.new` that survives is by definition stale — the
# residue of an earlier FAILED run, which insta does not clean up on its own. Left
# there it fails `no_pending_snapshot_is_left_in_the_tree` inside this very task,
# so accepting a changed snapshot could never succeed. Measured on the first
# machine-surface change after this task landed.
# REPOINTED BY THE TARGET CONSOLIDATION (CLOUD-1210), which this task did not
# follow and which left it unable to run at all: the corpus moved to
# `tests/it/snapshots` and `--test snapshots` names a target that no longer
# exists, so `find` failed on a missing directory and the accept half never
# reached `cargo`. Found by the first machine-surface change after that landed —
# the same way the note above it was found.
#
# THE FILTER IS WHAT KEEPS THE BOUND THE NOTE ABOVE ARGUES FOR. With one target,
# `--test it` would run the whole suite under `cargo test`'s threads-in-one-
# process model, which is exactly what `document_read_count` cannot survive. A
# module filter selects the same cases the old per-file target did.
env = { INSTA_UPDATE = "always" }
run = [
  "git clean -fqx -- 'crates/batten/tests/it/snapshots/*.snap.new'",
  "cargo test --test it snapshots::",
]

[tasks.fix]
description = "Everything `fmt` does, plus clippy's autofixes and the derived artifacts — the one command that empties a messy tree"
# The symmetric partner to `lint`: where `lint` reports every fixable thing,
# this fixes every one it can. `fmt` stays the formatters-only subset, because
# it is what CONTRIBUTING.md, rules/toolchain.md and .editorconfig point
# at, and because "reformat my tree" and "rewrite my code and regenerate
# artifacts" deserve different blast radii.
#
# A SEQUENTIAL BODY, deliberately not `depends`. mise runs a `depends` list in
# parallel, and these three stages contend twice over: on the cargo target-dir
# lock, and on the same file bytes — `clippy --fix` rewrites the sources that
# rustfmt then formats. Ordering is the whole point, so it is spelled out:
#
#   1. clippy --fix   rewrites sources
#   2. completions + man + schema + snapshots   regenerate from the (now
#      rewritten) surface and from the binary's own output
#   3. hk fix --all   formats everything the first two produced, last
#
# Step 2 is this repo's "snapshot accept", and since CLOUD-106 one of its stages
# literally is one: `crates/batten/tests/surface.rs` and `schema-check` diff their
# artifacts byte-for-byte against their generator, and `snapshots` does the same
# for the `.snap` corpus and the two golden manifests. All four are DERIVED —
# regenerated here, never hand-edited.
#
# --allow-dirty/--allow-staged because a tree with uncommitted work is the only
# state this task is ever run from; refusing there would make it useless.
#
# AN ARGV SEQUENCE, NOT A SHELL BODY (CLOUD-843, CLOUD-1991). The `set -eu` the
# body opted into is what mise does to an array anyway: the entries run in order
# and the first one that fails ends the task with its own exit code, so a
# half-applied fix still cannot report success.
run = [
  "cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features",
  "mise run completions",
  "mise run man",
  "mise run schema",
  "mise run snapshots",
  "mise run hk-contract",
  "hk fix --all",
]

[tasks.lint]
description = "Every linter over the whole tree — Rust, TOML, workflows, Markdown/JSON/YAML — fanned out"
# Was clippy alone, which made `mise run lint` a claim the repo could not keep:
# the tree is TOML-heavy and carries twelve workflows, and hk gated both while
# the task layer offered no way to run them. The subtasks below are the entry
# points; hk still drives its own file-scoped steps at commit time.
depends = ["lint:clippy", "lint:fmt", "lint:toml", "lint:actions", "lint:deno", "lint:rego"]

[tasks."lint:clippy"]
description = "Clippy with warnings denied"
# hk's `cargo-clippy` step overrides the builtin command with THIS task, so the
# flags live in one place. The workspace lints only mean anything if every
# target is checked and a warning fails.
# Receipt-gated (CLOUD-424): unchanged sources under an unchanged clippy are a
# verdict already held. `batten step run` is the whole bracket — a hit exits 0,
# a miss runs the command and records only on a zero exit — and its key is the
# `[[step]]` row `lint:clippy` in `batten.toml` plus this exact argv.
#
# THE CACHE'S OWN BUILD SHARES THE ORDINARY TARGET DIRECTORY, and `env` below is
# why. The isolation this task needs is CLIPPY's (the paragraph under the run
# line), so the variable rides the step's own argv rather than the task's `env`,
# where it would also send the engine's `cargo run` into `target/clippy` and pay
# a second full debug build of it there.
run = "cargo run --quiet -p batten -- step run lint:clippy -- env CARGO_TARGET_DIR=target/clippy cargo clippy --all-targets --all-features -- -D warnings"
# ITS OWN BUILD DIRECTORY, and the clippy argv above keeps its flags unchanged so
# no CI parity reading moves. `verify` runs this beside `test:cargo`, the narrow
# nextest lanes and the cross builds, all in `target/`, and clippy's
# `--all-targets --all-features` check build shares dependency units with them.
# Measured on four of five landing laps: clippy failed compiling a DEPENDENCY
# whose artifact had just been rewritten under it (`extern location for
# cpufeatures does not exist`, then `bstr`, `const_oid`, `sha1_checked`), and
# never once when run alone. The cost is one extra check-mode build of the
# dependency graph, paid once and then cached; the alternative was a gate that
# failed by timing. CLOUD-1913 records the investigation.

[tasks."lint:fmt"]
description = "rustfmt in check mode"
# Safe as the single definition: hk's `cargo-fmt` builtin already checks the
# whole workspace (`--manifest-path {{workspace_indicator}}`), not file by file,
# so routing it here costs no scoping.
# NOT receipt-gated any more (CLOUD-843), and the arithmetic is the reason.
# `cargo fmt --all --check` costs about a second; the retired receipt paid two
# mise parses (~0.75s each) around it, so the cache cost more than the step. And
# hk's `cargo-fmt` runs at COMMIT, outside the `slow` tier: a cache reached
# through `cargo run -p batten` would put an engine build on every commit, which
# CLOUD-1397 took off it.
run = "cargo fmt --all --check"

[tasks."lint:toml"]
description = "taplo: TOML syntax, duplicate keys, schema bindings, and formatting"
# TRACKED FILES ONLY, and this is not tidiness. A bare `taplo lint` walks the
# whole tree including `target/`, where the test suite writes deliberately
# corrupt fixtures — `target/tmp/trust-corrupt-config/batten.toml` is literally
# `this is not = = toml`, written on purpose to prove the loader rejects it. A
# gate that fails on its own test data is a gate someone switches off. hk feeds
# its steps `{{files}}` from git for exactly this reason; this is that same set.
#
# `-z` + `xargs -0`, and NOT a bash array: mise renders task bodies through
# Tera, which reads the `{#` in `${#files[@]}` as a comment-open and fails the
# task with "Closing comment tag `#}` not found" before a shell ever sees it.
# NUL-delimited is the more robust idiom anyway. `-r` so an empty set is a
# no-op rather than a bare `taplo lint` that would walk the tree after all.
# THE SELECTION IS `batten exec --tracked` SINCE CLOUD-1991, NOT A SHELL PIPE.
# `git ls-files -z <spec> | xargs -0 -r <tool>` was the whole reason this body
# was shell: the index is the selection (tracked files only, for the reason
# above), and `-r` ran nothing when nothing matched. `--tracked` is both, over
# the same index projection a policy row's `index` column reads, and `--tee`
# hands the tool's own output back unchanged. `cargo run` resolves the TREE's
# engine, because `--tracked` is newer than any release on PATH.
run = [
  "cargo run --quiet -p batten -- exec --tee --tracked '*.toml' -- taplo lint",
  "cargo run --quiet -p batten -- exec --tee --tracked '*.toml' -- taplo format --check --diff",
]

[tasks."lint:deno"]
description = "deno fmt: JSON/JSONC and non-workflow YAML parse and are formatted"
# MARKDOWN IS DELIBERATELY NOT HERE, and the reason is measured rather than
# stylistic. `deno fmt` over the tree's 41 Markdown files rewrites 5, and two of
# those rewrites are documentation corruption: it strips a trailing space INSIDE
# a code span (`mem:core` documents the deny reason as `batten: `, and the space
# is the point), and it restyles the deliberately-malformed emphasis examples in
# `mem:prior-art-and-issue-hygiene`, which exist to document that exact hazard.
# It also restyles `*x*` to `_x_` across README and the changelog. `prettier`
# keeps Markdown for that reason — the two formatters are non-overlapping by
# format, not competing over one (CLOUD-104).
# THE PATHSPEC IS THE ONE AUTHORITY on what this gate reads, and it is the same
# tracked-files-only argument `lint:toml` above makes, in three more formats.
# There is no `deno.json`: `deno fmt` would read one, and a second exclusion
# list is a second authority that drifts from this one.
#
# THE EXCLUSIONS ARE THREE CLASSES, none of them tidiness:
#   generator-owned — `schema/*.json` is diffed byte-for-byte by `schema-check`,
#     `contracts/*.json` by `hk-drift` (CLOUD-947), `CHANGELOG.md` by release-plz,
#     both `RESULTS.md` by their benches. Format them and every regeneration lands
#     unformatted, gets rewritten, and has to be regenerated again to stay
#     byte-stable — the fixer and the drift gate would be two authorities over one
#     file's bytes, which is the fight `completions/*` is excluded from shfmt for.
#   byte-significant fixtures — `cursor-bom.json` exists to carry a byte-order
#     mark and a fuzz corpus entry is an INPUT, not a document. Reformatting
#     either destroys the thing the test is testing.
#   workflows — actionlint and zizmor own those, and churning twelve files to
#     restyle them buys nothing.
#
# `--prose-wrap=preserve` IS PART OF THE PREDICATE, not a style preference.
# Measured 2026-08-25 on deno 2.9.5: the default (`always`, width 80) reflows
# AGENTS.md from 198 lines to 211, and `[budget.instructions]` caps it at 199 —
# so the default reds `policy-budget` on line count alone. `preserve` is a
# zero-line diff on that file. Structure is formatted; prose lines are left be.
#
# `-z` + `xargs -0`, and NOT a bash array, for `lint:toml`'s Tera reason above.
# THE SELECTION IS `batten exec --tracked` SINCE CLOUD-1991, NOT A SHELL PIPE.
# `git ls-files -z <spec> | xargs -0 -r <tool>` was the whole reason this body
# was shell: the index is the selection (tracked files only, for the reason
# above), and `-r` ran nothing when nothing matched. `--tracked` is both, over
# the same index projection a policy row's `index` column reads, and `--tee`
# hands the tool's own output back unchanged. `cargo run` resolves the TREE's
# engine, because `--tracked` is newer than any release on PATH.
run = "cargo run --quiet -p batten -- exec --tee --tracked '*.json' --tracked '*.jsonc' --tracked '*.yaml' --tracked '*.yml' --except '.github/workflows/*' --except 'schema/*.json' --except 'contracts/*.json' --except 'crates/batten/tests/fixtures/*' --except 'fuzz/corpus/*' --except 'tests/fixtures/*' -- deno fmt --check --prose-wrap=preserve"

[tasks."fmt:deno"]
description = "deno fmt: rewrite the tracked JSON/JSONC and non-workflow YAML in canonical form"
# The fixer half of `lint:deno`, and it is CLOUD-681's second half rather than a
# tidy-up. `fmt`'s own description has always named `deno fmt` among the fixers it
# runs, and the `deno-fmt` step carried only a `check` — so the one formatter that
# description promised was the one `mise run fmt` could not perform, while the
# 51 check-only steps it never promised all ran.
#
# `fmt:rego` is the shape, line for line: hk's `deno-fmt` step routes `mise run
# fmt` through this via `fix`, single-definition the way `cargo-fmt` overrides the
# builtin with `mise run lint:fmt`, so the hook and the task cannot disagree about
# what passes.
#
# THE PATHSPEC IS COPIED FROM `lint:deno`, NOT RE-DERIVED, and the copy is the
# careful choice rather than the lazy one: that task's comment states it is the
# one authority on what this formatter reads, and all five exclusions are measured
# — generator-owned artifacts diffed byte-for-byte by `schema-check` and
# release-plz, byte-significant fixtures (`cursor-bom.json` exists to carry a BOM,
# a fuzz corpus entry is an input), and the workflows actionlint owns. A FIXER
# whose reach exceeded its checker's would rewrite exactly those, and unlike a
# check it would not merely report it. `--prose-wrap=preserve` travels for the
# same reason: `lint:deno` records it as part of the predicate, since the default
# reflows AGENTS.md past `[budget.instructions]`'s line cap.
#
# `-z` + `xargs -0` rather than a bash array, for `lint:toml`'s Tera reason.
# THE SELECTION IS `batten exec --tracked` SINCE CLOUD-1991, NOT A SHELL PIPE.
# `git ls-files -z <spec> | xargs -0 -r <tool>` was the whole reason this body
# was shell: the index is the selection (tracked files only, for the reason
# above), and `-r` ran nothing when nothing matched. `--tracked` is both, over
# the same index projection a policy row's `index` column reads, and `--tee`
# hands the tool's own output back unchanged. `cargo run` resolves the TREE's
# engine, because `--tracked` is newer than any release on PATH.
run = "cargo run --quiet -p batten -- exec --tee --tracked '*.json' --tracked '*.jsonc' --tracked '*.yaml' --tracked '*.yml' --except '.github/workflows/*' --except 'schema/*.json' --except 'contracts/*.json' --except 'crates/batten/tests/fixtures/*' --except 'fuzz/corpus/*' --except 'tests/fixtures/*' -- deno fmt --prose-wrap=preserve"

[tasks."fix-selection-check"]
description = "hk's `fix` hook selects exactly the gate's fixer-bearing steps — no check-only step, no unrouted fixer"
# CLOUD-681's gate, and it exists because the obvious structural fix is not
# available: `hk fix` runs a step's CHECK when that step declares no fixer, so a
# `fix` hook handed the whole gate runs the whole gate — measured, 58 steps of
# which 7 were fixers, and `mise run fmt` took 931s. hk's embedded evaluator
# cannot derive the subset, so `hk.pkl` names it as a list and this asks `pkl`
# whether the list still equals the derivation, in both directions.
#
# THE PREDICATE IS `hk-fix-selection.pkl` SINCE CLOUD-1991, beside the config it
# evaluates. It was a `pkl eval -x` string inside a shell body; the module now
# `throw`s on drift, naming the `unrouted` and `not-a-fixer` steps (pointers,
# never bytes), and `pkl eval` exits non-zero on the throw. Replayed against the
# retired expression over the committed `hk.pkl`, a dropped fixer and an added
# check-only step: the same verdict and the same names on all three.
#
# `pkl` SHIPS ITS OWN ROOT BUNDLE AND IGNORES THE SYSTEM TRUST STORE, so in a
# TLS-intercepting sandbox it cannot resolve the `amends` package and fails as
# could-not-look. `mem:github-access` records that only `--ca-certificates`
# works, and the flag REPLACES pkl's roots — so it is passed only when a bundle
# is named: `BATTEN_CA_BUNDLE`, else `SSL_CERT_FILE`, which is how the sandbox
# names the interception bundle the body's `/root/.ccr` fallback probed for.
# EACH IS PASSED ONLY WHEN IT NAMES A FILE (tera's `is file`), the body's `-f`
# guard: a set-but-missing bundle handed to pkl fails the evaluation, and that
# non-zero would read as a drift refusal — the could-not-look-as-verdict this
# guard exists to prevent. With neither naming a file this stays the bare
# invocation.
run = "mise exec pkl -- pkl eval {% if env.BATTEN_CA_BUNDLE and env.BATTEN_CA_BUNDLE is file %}--ca-certificates {{env.BATTEN_CA_BUNDLE}} {% elif env.SSL_CERT_FILE and env.SSL_CERT_FILE is file %}--ca-certificates {{env.SSL_CERT_FILE}} {% endif %}hk-fix-selection.pkl"

[tasks."lint:actions"]
description = "actionlint: workflow mistakes (bad `on:` keys, undefined matrix refs, shellcheck over `run:` blocks)"
# Complements rather than duplicates `zizmor`, which audits workflow SECURITY.
# Bare invocation: actionlint defaults to .github/workflows, and unlike taplo it
# does not walk the tree, so there is nothing to scope away.
run = "actionlint"

[tasks."lint:rego"]
description = "opa fmt: Rego formatting over the tracked module corpus"
# CLOUD-930. Every other config format in this tree is formatted and validated in
# the shared gate — taplo for TOML, pkl for hk.pkl, prettier for Markdown,
# actionlint for workflows — and `.rego` had neither when that row was filed.
#
# THE LINT HALF LANDED IN BETWEEN, so this task is narrower than the row's body.
# CLOUD-876 added three `batten.toml` rows over the Rego corpus:
# `policy-modules-type-check` (`opa check -s schema/ policy/`),
# `policy-lint-rule-tests` (`regal test .regal/rules`) and the row over
# `.regal/config.yaml` (`regal lint policy/`). What was left with no mechanism is
# FORMATTING, which is what this is. The row's own open question — "whether a rego
# formatter, a rego linter, or both are pinnable" — is answered by that: both, and
# neither needs a new pin, because `opa` and `regal` are already `[tools]` keys and
# `opa fmt` ships in the same binary `opa check` does.
#
# `-l` rather than `-d`: it prints only the NAMES of files that would change,
# which is the pointer-only shape non-negotiable rule 4 asks for. A `-d` diff
# would put tracked file content on stdout to say the same thing.
#
# AND NOT `--fail`, which is the flag that looks right and hands over a partial
# answer. Measured while writing this: two files in the corpus were unformatted
# and `opa fmt -l --fail` named ONE, then exited — it short-circuits on the first
# diff. A gate reports the whole pointer set or the second offender is discovered
# one run later, so the verdict comes from whether `-l`'s output is empty instead.
#
# TRACKED FILES ONLY, for `lint:toml`'s reason rather than by analogy to it: a
# suite that writes a deliberately malformed module under `target/` to prove the
# loader rejects it would otherwise red this gate, and a gate that fails on its own
# test data is a gate someone switches off. The `-z` + `xargs -0` spelling is also
# `lint:toml`'s, and for the same hard reason — mise renders task bodies through
# Tera, which reads the `{#` in `${#files[@]}` as a comment-open and fails the task
# before a shell ever sees it.
# THE SELECTION IS `batten exec --tracked` SINCE CLOUD-1991, NOT A SHELL PIPE.
# `git ls-files -z <spec> | xargs -0 -r <tool>` was the whole reason this body
# was shell: the index is the selection (tracked files only, for the reason
# above), and `-r` ran nothing when nothing matched. `--tracked` is both, over
# the same index projection a policy row's `index` column reads, and `--tee`
# hands the tool's own output back unchanged. `cargo run` resolves the TREE's
# engine, because `--tracked` is newer than any release on PATH.
# `opa fmt -l --fail` SHORT-CIRCUITS on the first unformatted file, measured
# again on opa 1.2.0, so the verdict is the SECOND call and the whole pointer
# set is the FIRST: `-l` alone names every file that would change and exits 0,
# then the same selection under `--fail` refuses. A reader sees every offender on
# one run, and the gate still fails on any.
run = [
  "cargo run --quiet -p batten -- exec --tee --tracked '*.rego' -- mise exec -- opa fmt -l",
  "cargo run --quiet -p batten -- exec --tee --tracked '*.rego' -- mise exec -- opa fmt -l --fail",
  "mise exec -- opa check -s schema/ policy/",
]

[tasks."fmt:rego"]
description = "opa fmt -w: rewrite the tracked Rego corpus in canonical form"
# The fixer half of `lint:rego`. hk's `rego` step is what routes `mise run fmt`
# through it — single-definition, the way hk's `cargo-fmt`/`cargo-clippy` steps
# override the builtin command with `mise run lint:fmt`/`lint:clippy` so the hook
# and the task cannot disagree about what passes. Same tracked-file selection as
# the check: a fixer let loose on the tree would repair the corrupt fixture a suite
# wrote to be broken.
# THE SELECTION IS `batten exec --tracked` SINCE CLOUD-1991, NOT A SHELL PIPE.
# `git ls-files -z <spec> | xargs -0 -r <tool>` was the whole reason this body
# was shell: the index is the selection (tracked files only, for the reason
# above), and `-r` ran nothing when nothing matched. `--tracked` is both, over
# the same index projection a policy row's `index` column reads, and `--tee`
# hands the tool's own output back unchanged. `cargo run` resolves the TREE's
# engine, because `--tracked` is newer than any release on PATH.
run = "cargo run --quiet -p batten -- exec --tee --tracked '*.rego' -- mise exec -- opa fmt -w"

[tasks.coverage]
description = "Report: line/region coverage of the Rust suite. A REPORT, never a gate — deliberately not in `verify` and not a required check"
# WHY THIS IS NOT A GATE, and must not become one. A coverage-percentage
# threshold rewards line-touching over behaviour assertion: the cheapest way to
# move the number is a test that executes code and asserts nothing, which is
# strictly worse than no test because it also has to be maintained. The real
# quality bar here is the contract suite — byte-stable snapshots, negative exit
# codes, the derived-artifact diffs — and those already fail loudly. So this
# emits a number for a human to read and draws no conclusion from it.
#
# Consequences of that, all deliberate: absent from `[tasks.verify]`, absent
# from `final`'s `needs` in ci.yml, and its workflow runs on a schedule rather
# than on `pull_request` — which is also what keeps `ci-local-parity` honest,
# since that gate requires every task a PR workflow runs to be one `verify`
# runs. Wiring coverage into `verify` to satisfy it would be the gate this
# refuses to be.
#
# `llvm-tools-preview` is NOT added to the `rust` pin's `components` above: that
# would make every CI job download it for a tool only this task uses. Installed
# here, on demand, and only when missing — the same "don't mutate the toolchain
# on the common path" reasoning the retired `[tasks.msrv]` used (CLOUD-593).
#
# A report built from a half-run suite is a misleading number rather than a
# missing one, so the first failing step ends it — which an argv sequence does
# by construction (CLOUD-843, CLOUD-1991), where the body had to opt into
# `set -e`.
#
# `rustup component add` IS THE "ONLY WHEN MISSING" GUARD. On an installed
# component it answers "up to date" and exits 0 without touching the toolchain,
# so the list-then-grep probe in front of it — and the SIGPIPE hazard that probe
# carried (review of #928) — bought nothing the tool does not already do. A
# component that will not install fails the entry, and nothing is reported.
#
# Two artifacts from one instrumented run: lcov for tooling that consumes it,
# and a summary a human reads. `--workspace` matches what `test:cargo` runs.
# `COVERAGE_OUT_DIR` still moves both, through the template rather than a
# `${…:-}` expansion.
run = [
  "rustup component add llvm-tools-preview",
  "mkdir -p {% if env.COVERAGE_OUT_DIR %}{{env.COVERAGE_OUT_DIR}}{% else %}target/coverage{% endif %}",
  "cargo llvm-cov --workspace --lcov --output-path {% if env.COVERAGE_OUT_DIR %}{{env.COVERAGE_OUT_DIR}}{% else %}target/coverage{% endif %}/lcov.info",
  "cargo llvm-cov report --summary-only",
]

[tasks.scorecard]
description = "Report: OSSF scorecard over this repository. A REPORT, never a gate — deliberately not in `verify` and not a required check"
# WHY THIS IS NOT A GATE, and must not become one. Measured 2026-08-13 at
# aggregate 5.2/10, and three of the four zero-scores are scorecard disagreeing
# with decisions this repository made deliberately: `Code-Review: 0` counts
# "0/18 approved changesets", which is trunk-based review-after-merge working as
# specified; `Token-Permissions: 0` counts 18 grants of which 16 are
# load-bearing, 13 of them the landing lease's job-level `actions: write`; and
# `Maintained: 0` is repo age. Binding that exit code to landing would gate on a
# tool's opinion about our own design — the model-verdict shape non-negotiable
# rule 3 refuses, in a scanner's clothes.
#
# Consequences, all deliberate and all mirrored from `[tasks.coverage]`: absent
# from `[tasks.verify]`, absent from `final`'s `needs` in ci.yml, scheduled
# rather than `pull_request`. `mise run report-only-check` is the sensor on
# every one of those, so this comment is not the only thing holding the line.
#
# The token is the ONE input that is not the tree. scorecard reads its own
# `GITHUB_AUTH_TOKEN`; nothing here mints or stores one, and a missing token is
# scorecard's own error rather than a silent partial score.
#
# ONE ARGV, NO BODY (CLOUD-843, CLOUD-1991). The token fallback is the task's
# `env`, templated in the order the body's `:=` chain read it; a missing token
# is scorecard's own refusal, which is the "no silent partial score" the body's
# guard restated. The repository is never hardcoded — a consumer's coordinates
# are theirs — and it is named by the caller now rather than cut out of the
# origin URL: the `[repo]` argument, else `GH_REPO` (the forge client's own
# override), else `GITHUB_REPOSITORY`, which every Actions runner sets. The
# URL-trimming it replaces also misread a proxied remote, whose URL carries no
# `github.com` at all.
env = { GITHUB_AUTH_TOKEN = "{% if env.GITHUB_AUTH_TOKEN %}{{env.GITHUB_AUTH_TOKEN}}{% elif env.GH_TOKEN %}{{env.GH_TOKEN}}{% elif env.GITHUB_TOKEN %}{{env.GITHUB_TOKEN}}{% endif %}" }
usage = 'arg "[repo]" default="" help="owner/name on github.com; GH_REPO, then GITHUB_REPOSITORY, when omitted"'
run = "scorecard --repo=github.com/{% if usage.repo %}{{usage.repo}}{% elif env.GH_REPO %}{{env.GH_REPO}}{% else %}{{env.GITHUB_REPOSITORY}}{% endif %}"

[tasks.fuzz]
description = "Report: search the hook-envelope and config parsers for inputs that break a property (CLOUD-112)"
# A SEARCH, never a gate — the same split `lock-check` draws and `coverage`
# follows. A bounded fuzz run is a property of the WORLD: nondeterministic, and
# green proves only that this seed found nothing this time. So it is deliberately
# absent from `verify` and from `final`, and runs on a schedule
# (.github/workflows/fuzz.yml).
#
# The property of the COMMIT is the replay: `crates/batten/tests/fuzz_corpus.rs`
# feeds every checked-in corpus entry and every saved reproducer through the
# same assertions, deterministically, on stable, in milliseconds. That is what
# runs on the landing path, and it is why a crash found here becomes a
# regression test by being committed rather than by being rewritten.
#
# Nightly is not a preference: libFuzzer needs `-Z sanitizer`, which stable does
# not accept. Installed on demand and only when missing — the same "don't mutate
# the toolchain on the common path" reasoning as `[tasks.coverage]` and
# the retired `[tasks.msrv]` (CLOUD-593), which drove rustup directly for its own documented
# reasons.
#
# A search that half-ran is a misleading all-clear rather than a missing one, so
# the first failing entry ends it — an argv sequence's own semantics (CLOUD-843,
# CLOUD-1991), where the body had to opt into `set -e`.
#
# BOTH INSTALLS ARE IDEMPOTENT IN THE TOOL, which is what retired the probes in
# front of them. `rustup toolchain install nightly` on a present nightly checks
# it and exits 0; `cargo install` of the version already installed says so and
# exits 0. The list-then-grep probes, and the SIGPIPE hazard `coverage` records,
# bought nothing more. One thing moved: rustup REFRESHES a present nightly to the
# current one, where the probe left a stale one in place — the scheduled job
# always ran on a fresh runner, so it is the only cadence this search has had.
#
# Version-pinned. Built with +nightly deliberately: cargo-fuzz 0.13.2's
# dependencies require rustc 1.91, so the pinned stable cannot compile it — see
# the [tools] note on why this is not a `[tools]` entry.
#
# One target and one input reproduces a saved crash; no argument searches both,
# which is `fuzz:search`. `usage` binds the two by name, so the choice between
# the modes is the template's and not a `$#` test.
usage = '''
arg "[target]" default="" help="the fuzz target a saved reproducer belongs to; omit to search every target"
arg "[input]" default="" help="the reproducer file to replay against that target"
'''
depends = ["fuzz:tools"]
run = [
  "{% if usage.target %}cargo +nightly fuzz run {{usage.target}} {{usage.input}}{% else %}mise run fuzz:search{% endif %}",
]

[tasks."fuzz:tools"]
description = "Install the nightly toolchain and the pinned cargo-fuzz that `fuzz` and `fuzz:search` run under (CLOUD-112)"
# The installs the body ran before either mode, as a task both modes DEPEND on,
# so `mise run fuzz:search` on a fresh machine installs before it searches
# exactly as the single body did. Idempotent in the tool (see `[tasks.fuzz]`),
# which is also why `fuzz`'s no-argument arm reaching `fuzz:search` and running
# this a second time costs a check, not an install.
run = [
  "rustup toolchain install nightly --profile minimal",
  "cargo +nightly install cargo-fuzz --version {% if env.CARGO_FUZZ_VERSION %}{{env.CARGO_FUZZ_VERSION}}{% else %}0.13.2{% endif %} --locked",
]

[tasks."fuzz:search"]
description = "Report: the bounded libFuzzer search over both targets, `fuzz`'s no-argument half (CLOUD-112)"
# TWO corpus directories, and the order is the whole point. libFuzzer writes
# every coverage-expanding input into the FIRST directory and treats the rest as
# read-only seeds — so the machine's working set lands in git-ignored
# `fuzz/work/`, and the tracked `fuzz/corpus/` stays what a human curated. A
# single directory would mean a search appending a thousand opaque blobs to the
# tree on every run: unreviewable, and the replay gate's subject would stop being
# anything anyone chose. A crash still lands in `fuzz/artifacts/`, which IS
# tracked, because a reproducer is exactly the file worth reviewing.
#
# The two targets are written out rather than looped over: two entries, each
# stopping the search if it fails, is exactly what the `for` did. `FUZZ_SECONDS`
# bounds each, 60 when unset.
depends = ["fuzz:tools"]
run = [
  "mkdir -p fuzz/work/hook_decode fuzz/work/config_parse",
  "cargo +nightly fuzz run hook_decode fuzz/work/hook_decode fuzz/corpus/hook_decode -- -max_total_time={% if env.FUZZ_SECONDS %}{{env.FUZZ_SECONDS}}{% else %}60{% endif %}",
  "cargo +nightly fuzz run config_parse fuzz/work/config_parse fuzz/corpus/config_parse -- -max_total_time={% if env.FUZZ_SECONDS %}{{env.FUZZ_SECONDS}}{% else %}60{% endif %}",
]

[tasks.test]
description = "Run every test suite — Rust and shell"
depends = ["test:cargo", "test:bats"]

# A NAMED subset of the suite, for observing one case red under one mutation
# (CLOUD-418). `test:cargo` cannot serve this: its body takes no `"$@"`, so a
# filter passed to it is silently DROPPED and the whole suite runs — and because
# nextest fail-fast then cancels scheduling, a case that never ran reads exactly
# like a case that passed. Measured this session: a `-E 'test(differential)'`
# that matched nothing summarised green.
#
# Deliberately NOT receipt-routed and deliberately NOT part of `test` or
# `verify`. A receipt keyed on the step's inputs would be minted by a run of ONE
# case and then answer for the whole suite; and a subset is never the evidence
# that a suite passed. `--no-fail-fast` is fixed here rather than left to the
# caller, because the whole point is to see every named case's own verdict.
[tasks."test:filter"]
description = "Run named Rust tests (nextest filter expression) — never a substitute for test:cargo"
run = 'cargo nextest run --workspace --no-fail-fast "$@"'

[tasks."test:cargo"]
#MUTANT-SUITE crates/batten/tests/it/test_cargo_path.rs
#MUTANT installed-batten-visible|s@\[ "[$][{]f##[*]/[}]" = batten \] [[:punct:]][[:punct:]] @@|the_mask_hides_every_batten_and_keeps_the_rest
#MUTANT suite-tree-write-admitted|s@\[ "[$]tracked_before" != "[$]tracked_after" \]@false@|a_suite_that_rewrites_a_tracked_file_is_refused
description = "Run the Rust workspace test suite"
# Routed through the per-step receipt (CLOUD-424): same sources, same command,
# same toolchain ⇒ same verdict, so a hit answers from the receipt instead of
# rebuilding the workspace. Fail closed — a check that cannot answer runs the
# suite — and the record is an economy whose failure must never fail a suite
# that passed.
run = '''
if [ "$(cargo run --quiet -p batten -- step check test:cargo | cut -c1-3)" = hit ]; then exit 0; fi
# THE CARGO STATEMENT STAYS BARE, and property 16 of `ci-local-parity` is why
# (CLOUD-662): it reads this task's single cargo statement and requires a
# foreign CI leg's line to be `mise exec -- ` plus exactly that statement. A
# `--profile` flag here was refused by that property at
# `.github/workflows/rust.yml:900` and `:1057`, and rightly — two spellings is
# the drift it exists to catch. The fail-fast posture rides on
# `NEXTEST_PROFILE` in `[env]` instead, which nextest reads natively and which
# every leg through mise inherits, foreign ones included.
#
# NO `batten` IS RESOLVABLE BY NAME WHILE THE SUITE RUNS, AS ON CI (CLOUD-1951).
# `_.path` puts `target/release` first and `~/.local/bin` holds the installed
# release; CI's test job has neither. So a case or hook that spawns a bare
# `batten` passed here and failed there -- the retired `doctor` handler on #928
# cost a matrix that way. Every PATH directory holding a `batten` is swapped for
# a shadow carrying its other entries, because `mise` shares `~/.local/bin` with
# the installed binary and dropping the directory would hide it too. Cases reach
# the tree's own binary through `CARGO_BIN_EXE_batten`, which this leaves alone.
# `test_cargo_path.rs` runs the block between the markers, verbatim.
# >>> no-batten-path
shadow="${CARGO_TARGET_DIR:-target}/no-batten-path"
# ABSOLUTE, because cases run in scratch directories: a relative entry resolves
# against each case's cwd, and the linked `mise` vanishes with it.
case $shadow in /*) ;; *) shadow="$PWD/$shadow" ;; esac
rm -rf "$shadow" && mkdir -p "$shadow"
masked=""
old_ifs=$IFS; IFS=:
for d in $PATH; do
  if [ -n "$d" ] && [ -e "$d/batten" ]; then
    for f in "$d"/*; do
      [ "${f##*/}" = batten ] || ln -s "$f" "$shadow/" 2>/dev/null
    done
    d="$shadow"
  fi
  masked="${masked:+$masked:}$d"
done
IFS=$old_ifs
PATH="$masked"; export PATH
# <<< no-batten-path
#
# THE SUITE LEAVES THE REAL CHECKOUT AS IT FOUND IT (CLOUD-1953). On #928
# `bench_tokens` rewrote the committed `RESULTS.md` from a verb whose cwd was
# this checkout, and nothing noticed until a later lap's diff. A line predicate
# over test sources cannot see that -- the write is a verb's, at run time -- so
# the check is the tree itself: tracked state before and after, compared, and a
# difference is a refusal naming the paths. Untracked files are out of scope:
# `target/` and the scratch parent are expected to move.
# >>> tree-before
tracked_before=$(git status --porcelain --untracked-files=no)
# <<< tree-before
if ! cargo nextest run --workspace; then exit 1; fi
# >>> tree-after
tracked_after=$(git status --porcelain --untracked-files=no)
if [ "$tracked_before" != "$tracked_after" ]; then
  echo "::error:: test:cargo: the suite changed tracked files in this checkout -- a case wrote outside its scratch directory:" >&2
  printf '%s\n' "$tracked_after" | cut -c4- >&2
  exit 1
fi
# <<< tree-after
cargo run --quiet -p batten -- step record test:cargo || true
'''

# --- the four tiers `hk` reaches by name (CLOUD-1164) ---------------------------
#
# Each names ONE test binary, and each is a gate `hk` runs on its own glob — the
# per-glob trigger the retired `mise-tasks/*.sh` programs carried, kept rather
# than folded into `test:cargo`, so a change to `schema/*` still pays one target
# instead of the workspace.
#
# `--no-tests=fail` is load-bearing and not a flourish. A nextest filter that
# matches nothing summarises GREEN, so a renamed or deleted target would turn
# these into gates that check nothing and say so in the same words as a pass —
# the silent-empty-answer defect `rules/scanning.md` records for a matcher
# pointed at an extensionless directory, one layer over. Failing on an empty
# selection is what makes the name and the mechanism one object.
#
# NOT receipt-routed, for `test:filter`'s reason: a receipt keyed on a subset's
# inputs would be minted by a run of one target and then answer for the rest.
[tasks."test:reference-coverage"]
description = "Gate: the rendered CLI reference and the command spec name exactly the same flags, in both directions (CLOUD-171)"
run = "cargo nextest run -p batten --no-tests=fail -E 'binary(it) & test(/^reference_coverage::/)'"
env = { BATTEN_TEST_SCRATCH_LANE = "narrow" }

[tasks."test:skill-contract"]
description = "Gate: every shipped skill stays inside its line budget and describes only the surface the binary ships (CLOUD-213)"
run = "cargo nextest run -p batten --no-tests=fail -E 'binary(it) & test(/^skill_contract::/)'"
env = { BATTEN_TEST_SCRATCH_LANE = "narrow" }

[tasks."test:config-schema"]
description = "Gate: the committed JSON Schemas match the ones the binary derives from the config types (CLOUD-33)"
run = "cargo nextest run -p batten --no-tests=fail -E 'binary(it) & test(/^config_schema::/)'"
env = { BATTEN_TEST_SCRATCH_LANE = "narrow" }

[tasks."test:hook-profile"]
description = "Gate: the hook profile the wiring declares is the one the binary reports (CLOUD-509)"
run = "cargo nextest run -p batten --no-tests=fail -E 'binary(it) & test(/^hook_profile::/)'"
env = { BATTEN_TEST_SCRATCH_LANE = "narrow" }

[tasks."test:verdict-vocabulary"]
description = "Gate: every verdict vocabulary word is one token under the declared pin (CLOUD-1284 arm 4)"
run = "cargo nextest run -p batten --no-tests=fail -E 'binary(it) & test(/^verdict_vocabulary::/)'"
env = { BATTEN_TEST_SCRATCH_LANE = "narrow" }

[tasks."test:refusal-ceiling"]
description = "Gate: every emitted mediated refusal line is within the declared `[refusal]` ceiling (CLOUD-1286)"
run = "cargo nextest run -p batten --no-tests=fail -E 'binary(it) & test(/^refusal_ceiling::/)'"
env = { BATTEN_TEST_SCRATCH_LANE = "narrow" }

[tasks."test:config-deprecations"]
description = "Gate: no config key left the published schema without a deprecation window (CLOUD-360)"
run = "cargo nextest run -p batten --no-tests=fail -E 'binary(it) & test(/^config_deprecations::/)'"
env = { BATTEN_TEST_SCRATCH_LANE = "narrow" }

[tasks.prose-only-check]
description = "Gate: a branch whose whole diff is comment lines buys a CI matrix no required check can have an opinion about (reads the diff; pointer-only)"
# CLOUD-827's gate, ported off `mise-tasks/prose-only-check.sh` under CLOUD-1051.
#
# THE TASK NAME SURVIVES THE MIGRATION, DELIBERATELY. `verify` and
# `mise-tasks/land.sh` both invoke it by name, and `land.sh` is an authored shell
# rule `shell-retirement` refuses to see edited — so retiring the gate by editing
# its callers would have meant retiring the landing loop to move one predicate.
# `batten check --rule` is the narrowing that makes a migrated row invocable
# instead, and this row is its first consumer. Both callers stay byte-identical
# and out of this PR's changed-file set.
#
# The `[tasks.policy-test]` precedent below is the same shape for the same reason:
# an inline `cargo run -p batten` body where a shell file used to be.
#
# `--rule` naming no declared row is a usage error rather than a clean run, so a
# renamed row breaks this loudly instead of silently passing.
run = "cargo run --quiet -p batten -- check --rule 'diff ship early'"

[tasks."ci-drift"]
description = "Gate: the committed [ci] table still matches the host ruleset (CLOUD-54)"
# CLOUD-54's gate, ported off `mise-tasks/ci-drift.sh` under CLOUD-843.
#
# THE ADJUDICATION WAS ALREADY THE VERB'S. The program's last line was
# `config lint --host-rules -`, so the comparison has lived in `crates/batten/src/ci.rs`
# all along. What the shell still owned was a credentialed FETCH, which the engine
# may not do — house-style §5, and `evaluator-io-check` is the standing gate on it.
#
# SO THE FETCH MOVED OUT RATHER THAN IN, which is CLOUD-1277's own words for this
# family: "the polling stays outside; only the decision moves in". It now happens
# in `.github/workflows/ci-drift.yml`, one step earlier, where the job token
# already is — and a `gh api` that fails there reds the job before this runs, so
# could-not-look never reaches the gate as a green.
#
# `--host-rules` TAKES A PATH, and always has. The channel CLOUD-1277 sketches —
# a producer-written document under `$GIT_DIR` declared by `[[rule.external]]` —
# is what a tree-scoped MODULE would need; this is a verb reading an argument, so
# it needs none of it.
#
# A REQUIRED VARIABLE RATHER THAN A DEFAULT: an unset payload path is the caller's
# mistake, and defaulting it would make the gate read a file nobody fetched, which
# is the could-not-look-as-clean shape the deleted program's own `#MUTANT` row
# named. It was the shell's `:?` until CLOUD-1991; mise's template refuses to
# render a variable the environment does not carry, naming it, and the task fails
# before the engine starts — the same refusal with no shell line behind it.
run = 'cargo run --quiet -p batten -- config lint --host-rules "{{env.CI_DRIFT_RULES}}"'

[tasks."hooks-wiring-check"]
description = "Gate: batten is registered exactly once on every hook surface (doctor hooks), and every other registration names the issue retiring it (harness-wiring)"
# CLOUD-777's gate, ported off `mise-tasks/hooks-wiring-check.sh` under CLOUD-1160.
#
# THE TASK NAME SURVIVES THE MIGRATION, for `config-lint`'s reason below: `hk.pkl`
# names it, so keeping the name is what makes this retirement reach exactly the
# two paths it retires instead of dragging a gate-definition edit in behind it.
#
# TWO CALLS BECAUSE THERE WERE ALWAYS TWO QUESTIONS, and the deleted program was
# the seam between them. `doctor hooks` decides the DERIVATION half — batten
# registered exactly once on every event a harness emits, no matcher, no drift —
# and has decided it in-process since CLOUD-777; the shell only re-rendered its
# findings. `check --rule 'hook wire missing'` decides the CONSUMER half, which the
# engine structurally cannot: `doctor.rs` reports a sibling COUNT and never a
# NAME, because a command line carries a path (rule 4) and whether a hook beside
# batten's is legitimate is this repository's judgement (rule 1).
#
# AN ARGV PAIR RATHER THAN `&&` (CLOUD-1991): mise runs the array in order and
# stops at the first entry that fails, with its exit code, so the first call's
# verdict is never discarded — the property the `&&` was spelled for, without a
# shell line to carry it. There is no decision here to hide: both are the engine's.
run = [
  "cargo run --quiet -p batten -- doctor hooks",
  "cargo run --quiet -p batten -- check --rule 'hook wire missing'",
]

[tasks."config-lint"]
description = "Gate: batten.toml carries no policy smell, and no weakening the groom never saw (arm with CONFIG_LINT_BASE)"
# CLOUD-87's gate, ported off `mise-tasks/config-lint.sh` under CLOUD-1162.
#
# THE TASK NAME SURVIVES THE MIGRATION, for `semver`'s reason directly below and
# with the same force: `verify`'s own body, `.github/workflows/ci.yml` and
# `hk.pkl` all name it, and `ci-local-parity` holds the workflow and `verify` to
# running the same task. Keeping the name is what makes this retirement reach
# exactly one program instead of dragging a workflow edit in behind it.
#
# WHY IT WAS MIGRATED AT ALL. The program was a WRAPPER: it spawned
# `batten config lint`, which is the successor, and then adjudicated the answer
# against a claim receipt and a commit trailer. That adjudication had a defect
# nothing could reach past it (CLOUD-841) — a receipt naming no weakening read as
# no receipt, so a trailer minted inside the change that performs a weakening
# admitted it — and repairing that meant EDITING authored shell, which
# `shell edit refused` refuses with no override. So the fix and the retirement
# are one change, which is the campaign working as designed rather than a
# coincidence.
#
# ONE LINE, DELIBERATELY. `inline-task-bodies-not-growing` and its twin count the
# two TRIPLE-QUOTED spellings of a task body — multi-line, where a predicate can
# hide. A single-line dispatch carries no predicate at all: every decision is the
# verb's, and the `${VAR:+...}` is argv assembly rather than a judgement.
#
# THE SPELLINGS ARE DESCRIBED RATHER THAN QUOTED, and that is this comment's own
# measurement: writing the literal here incremented the ratchet by one, because it
# counts the substring anywhere in the file and strips no comments. A note
# explaining the rule tripped the rule.
#
# ARMED BY THE CALLER, NEVER HERE. `CONFIG_LINT_BASE` unset is a local run over
# the working config alone; `verify` and CI arm it, and CI arms it with the PR's
# OWN base ref rather than a hardcoded `main` — a gate that pinned the trunk here
# would be answering a question about the world, which is `lock-complete`'s split.
#
# THE ARGV IS ASSEMBLED BY mise's TEMPLATE, NOT BY A SHELL EXPANSION (CLOUD-1991).
# The `${VAR:+...}` was argv assembly and nothing else, and the template's `if`
# is the same assembly — an unset or empty `CONFIG_LINT_BASE` adds no flag — with
# no shell line left to carry it.
run = 'cargo run --quiet -p batten -- config lint {% if env.CONFIG_LINT_BASE %}--config-from "{{env.CONFIG_LINT_BASE}}"{% endif %}'

[tasks.semver]
description = "Gate: the API delta on this branch is compatible with the bump release-plz will infer, unless a commit declares the break"
# CLOUD-102's gate, ported off `mise-tasks/semver.sh` under CLOUD-1059.
#
# THE TASK NAME SURVIVES THE MIGRATION, for `prose-only-check`'s reason above,
# and here it also has to: `.github/workflows/rust.yml` runs `mise run semver` as
# a required check and `verify` calls it through `perf-gate`'s neighbour, so a
# renamed task would need a workflow edit to land a workflow edit.
#
# WHY IT WAS MIGRATED AT ALL, which is the campaign working on its author.
# `cargo-semver-checks` generates a scratch crate and runs `cargo update` in it,
# discarding `Cargo.lock` — so on 2026-08-26 a yank of `bisync` made every commit
# from v0.0.89 on unresolvable, seven minutes after this gate passed in CI. The
# repair was a fallback that builds the baseline from its committed lock, and
# adding it meant EDITING an authored shell rule, which `shell edit refused`
# refuses with no override route. Maintenance of a shell-tier rule is completed
# by migrating it; that is the whole claim, and this is the first time it was
# tested against a repair somebody actually needed.
#
# The defaults live in `crates/batten/src/lib.rs` beside the reasoning, not here:
# `origin/main`, `patch` (the honest claim below 0.1.0, where release-plz bumps
# the patch whatever the commit type says), and `batten`.
#
# A STEP RECEIPT, KEYED ON BOTH SIDES OF THE COMPARISON (CLOUD-1891). 215s of
# every `verify`, re-derived on each lap even when neither the branch's crates
# nor `origin/main`'s had moved. The key is everything the verdict reads: this
# tree's crates (the specs), the baseline's crate tree ids and the branch's
# commit messages (a commit may declare the break) as `--arg`s, and the tool
# versions. `step-receipt` answers "run" under CI, so CI still confirms.
#
# THE BASELINE HALF OF THE KEY IS THE STEP ROW'S NOW, NOT A SHELL LINE'S
# (CLOUD-1991). The retired body computed the three baseline tree ids and a digest
# of the branch's commit messages in shell and passed them as `--arg`s. They are
# answers to argvs — `git rev-parse -q --verify origin/main:<path>` for each of
# `crates`, `Cargo.toml` and `Cargo.lock`, and `git log --format=%B
# origin/main..HEAD` — which is exactly what a `[[step]]` row's `tools` column
# keys a receipt on, so they belong on the `semver` row beside the crates it
# already names as inputs. The task is the step and nothing else.
run = "cargo run --quiet -p batten -- step run semver -- cargo run --quiet -p batten -- semver check"

[tasks."claim-check"]
description = "Gate: the issue you are about to pull is actually unclaimed (reads get_issue payloads on stdin)"
# CLOUD-230's pull-time gate, ported off `mise-tasks/claim-check.sh` under
# CLOUD-1059 and CLOUD-1121.
#
# THE TASK NAME SURVIVES THE MIGRATION, for `semver`'s and `perf-pair`'s reason:
# `mise.toml`'s own `verify` body names it, and the
# refusal text every agent reads says `mise run claim-check`. Keeping the name is
# what makes this retirement reach exactly one program.
#
# WHY IT WAS MIGRATED AT ALL, which is the campaign working on its author a third
# time. CLOUD-1121 is a repair to the BASELINE COMPARISON: the shell hashed the
# body with `jq -r`, which appends a newline the engine's own `{digest:description}`
# does not, so the two could never agree for any body not already ending in one —
# the rule refused every claim in every clone, and the only way past it was the
# bypass it reserves for a human's visible decision. Making that repair meant
# EDITING an authored shell rule, which `shell edit refused` refuses with no
# override route; and the repair is also the thing the shell could not express
# safely, because reader and writer had two spellings of one hash. The port shares
# `git::blob_id` with the minting side, so a second spelling is unwritable rather
# than merely wrong.
#
# THE TWO ENVIRONMENT VARIABLES ARE GONE rather than ported, on CLOUD-1051's
# precedent: `BATTEN_CLAIM_TAKEOVER` and `BATTEN_CLAIM_CHECK_BYPASS` were knowable
# strings anyone could spend without articulating anything, and the flag half
# already carried the whole decision. They are `--takeover` and
# `--bypass-sequence`, which is also what a harness classifying `FOO=1 cmd` as a
# bypass leaves reachable.
run = "cargo run --quiet -p batten -- claim check"

[tasks."perf-pair"]
description = "Measure this branch and its merge base back to back on one machine, and print both arms as paired records"
# CLOUD-172's driver, ported off `mise-tasks/perf-pair.sh` under CLOUD-1059.
#
# THE TASK NAME SURVIVES THE MIGRATION, for `semver`'s reason above and with a
# sharper edge here: `mise-tasks/perf-gate.sh` and `mise-tasks/perf-compare.sh`
# both invoke `mise run perf-pair` by name, and both are themselves governed by
# the same campaign — so a renamed task would need an edit to two frozen files in
# order to land this one. Keeping the name is what makes this retirement reach
# exactly one program.
#
# WHY IT WAS MIGRATED AT ALL, which is the campaign working on its author a second
# time. CLOUD-875 is a repair to the SKIP: four of the five arms run in a pinned
# one-rule fixture, but `wired` adjudicates against the repository's own committed
# config, and the skip could see neither that config nor any path a `policy` row
# registers. Measured, a policy row alone moved `wired` 5.8ms -> 9.3ms while the
# gate reported "nothing measured". Making that repair meant EDITING an authored
# shell rule, which `shell edit refused` refuses with no override route — and the
# repair is also the thing a shell skip could not express, because the widened set
# is DERIVED from the loaded config rather than written down.
#
# The defaults live in `crates/batten/src/perf.rs` beside the reasoning, not here:
# `origin/main`, 100 runs, 10 warmups, and `target/perf`, each still overridable
# through the `BENCH_*` variables CI already exports.
run = "cargo run --quiet -p batten -- perf pair"

[tasks."perf-compare"]
description = "Gate: this branch has not made an invocation path measurably slower than its merge base (reads a paired measurement on stdin)"
# CLOUD-172's verdict, ported off `mise-tasks/perf-compare.sh` under CLOUD-1163
# unit 10.
#
# THE TASK NAME SURVIVES THE MIGRATION, for `perf-pair`'s reason above.
#
# STILL A PURE FUNCTION OF STDIN, which is the property worth keeping rather than
# an artefact of the shell. `perf pair` measures and this decides, so every
# verdict is exercisable in milliseconds with no build, no hyperfine and no merge
# base — which is what `crates/batten/tests/it/perf_compare.rs` does 20 times.
# Folding the comparison invisibly into `perf-gate` would have cost exactly that.
#
# THE THRESHOLD IS IN THE CRATE AND THE EXEMPTIONS ARE IN `batten.toml`, and the
# split is non-negotiable rule 1 rather than taste: 1.30 is a property of the
# EXPERIMENT (the measured null spread, 0.966-1.102) and names no consumer, while
# every accepted row this repository has written cites a tracker key, which may
# not appear anywhere in `crates/batten`.
run = "cargo run --quiet -p batten -- perf compare"

[tasks."perf-gate"]
description = "Gate: measure this branch against its merge base and refuse a regression — the one call `verify` and CI make"
# The composition, ported off `mise-tasks/perf-gate.sh` in the same delta.
#
# THE TASK NAME SURVIVES THE MIGRATION, and here it is load-bearing twice over:
# `verify`'s body runs `mise run perf-gate` and `.github/workflows/ci.yml`'s
# `perf` job runs it as a required check, so a renamed task would need a workflow
# edit to land this one. `ci-local-parity` also requires every task a
# `pull_request` workflow names to be one `verify` runs, and one name is what
# keeps that correspondence readable.
#
# THE REDIRECT-THROUGH-A-FILE IS GONE, AND THAT IS THE POINT OF THE PORT. The
# program it replaces could not pipe `perf-pair` into `perf-compare`: a pipeline
# hands on the LAST command's exit status, so a measurement that failed outright
# reached the gate as empty stdin and was reported as its could-not-look — the
# right code for the wrong reason, one step from a producer's failure vanishing.
# It answered with a temporary file, a `grep '^arm='` to tell a skip from a
# measurement, and an explicit passthrough of the producer's code. In process
# there is no pipeline: `perf::gate` holds the outcome as a value and matches on
# it, so a skip and a failed measurement are different variants rather than two
# readings of one byte stream.
run = "cargo run --quiet -p batten -- perf gate"

[tasks."perf-seed"]
description = "Effect: build the perf pair's arm profile, which perf.yml stages as every pull request's base-arm seed"
# A TASK RATHER THAN A WORKFLOW-SPELLED CARGO LINE (CLOUD-1891): `cargo spelling
# wrong` reads every workflow `mise exec -- cargo` line as a foreign runner's copy
# of `test:cargo`, and naming the build here keeps the profile the pair builds
# under in one place — `perf::PAIR_PROFILE`'s value, which `perf pair` passes.
run = "cargo build --profile perf-arm -p batten"

[tasks."mutant"]
description = "Gate: every declared gate has a mutation its own suite is PROVEN to catch (CLOUD-418)"
# CLOUD-418's mechanism, ported off `mise-tasks/mutant.sh` under CLOUD-1267.
#
# THE TASK NAME SURVIVES THE MIGRATION, for `perf-pair`'s reason above and with a
# sharper edge: `.github/workflows/mutant.yml` invokes `mise run mutant` and
# `hk.pkl` invokes `mise run mutant-census`, and both name the task rather than
# the file. Keeping the names is what holds this retirement to the two programs
# being retired — neither caller changes.
#
# WHY IT WAS MIGRATED AT ALL, and it is the campaign's own blind spot. The shell
# resolved a gate's SOURCE with a Rego fallback and its SUITE as
# `tests/$gate.bats` unconditionally, so a mutation applied to a `.rego` module
# had no suite that could turn red: 32 modules, 32 `#MUTANT-EXEMPT` rows, 29 of
# them citing that exact hole, and 141 compiled-binary tiers the runner could not
# see. Repairing it meant EDITING an authored shell rule, which
# `shell edit refused` refuses with one route and no override — so the coverage
# mechanism could only be retired.
#
# STILL OFF THE LANDING PATH. This is a proof about the SUITES, not a property of
# the commit, so it belongs neither in `verify` nor in the per-PR matrix — the
# same split `lock-complete` and `lock-currency` were separated along. The census
# is the half that runs in the gate.
run = "cargo run --quiet -p batten -- mutate sweep"

[tasks."mutant-census"]
description = "Gate: every gate in the tree is either mutation-enforced or carries a filed exemption (CLOUD-480)"
# The complement, ported off `mise-tasks/mutant-census.sh` in the same change.
#
# THE PAIR IS THE VERDICT, never either alone: a change that dropped a gate from
# `$MUTANT_GATES` and wrote no `#MUTANT-EXEMPT` would make the sweep greener and
# this red, and is indistinguishable from doing the work if only the sweep runs.
#
# WIDENED IN THE PORT (CLOUD-1267): a PRESET directory is a subject too. A preset
# ships to every consumer and cannot read a `[[pattern]]` row one wrote, so it is
# exactly where CLOUD-934's dead-predicate class lives — and a census blind to
# that directory is blind to the class.
run = "cargo run --quiet -p batten -- mutate census"

[tasks."target-prune"]
description = "Reclaim superseded build artifacts, and refuse below a measured disk floor — pointer-only, no build, no network"
# CLOUD-766's reclaim, ported off `mise-tasks/target-prune.sh` under CLOUD-1059,
# carrying CLOUD-1030's repair.
#
# THE TASK NAME SURVIVES THE MIGRATION, for `perf-pair`'s reason above and with
# the same edge: `verify`'s body and `mise-tasks/land.sh` both invoke
# `mise run target-prune` by name, and `land.sh` is an authored shell rule
# `shell edit refused` refuses to see edited. Keeping the name is what holds
# this retirement to the one program being retired.
#
# `-y` RATHER THAN A PROMPT, and it is house-style §5's binding on a destructive
# verb rather than a convenience: the primary caller is `verify`, which is
# non-interactive, and a gate that blocks on a Y/N is a dead gate. `capture prune`
# carries the identical pairing for the identical reason.
#
# The floors and the tree live in `batten.toml`'s `[prune]` table, not here and
# not in the crate: how many megabytes a rebuild of THIS workspace writes is a
# fact about this consumer, and non-negotiable rule 1 is what keeps it out of
# `crates/batten`. The predecessor carried it as a shell variable inside the
# program that enforced it, and parsed its own source at runtime to check the
# arithmetic; the engine validates that at config load instead.
#
# THE INSTALLED BINARY FIRST, AND THIS ONE IS NOT STYLE — it is the circularity
# the port created, raised on #734 and confirmed. Every other migrated task is a
# bare `cargo run`, which is right for them: they run when the tree is healthy.
# This one runs when the disk is SHORT, at the top of `verify` and every `land`
# lap, and `cargo run` has to write to `target/` before it can reclaim anything.
# So on the exact input this task exists for, a build-first entry point fails
# during the build — and fails having consumed more of the disk, reporting
# "pruning did not recover it" about a prune that never ran. The predecessor
# needed no build at all, so this is a capability the migration would otherwise
# have dropped silently.
#
# `session-start.sh` installs the binary (`mise run install:local`), so the first
# branch is the ordinary one. The fallback is for a clone that has not been
# provisioned, where the disk is not the problem. A stale installed binary is not
# a silent wrong answer: `Config` is `deny_unknown_fields`, so one predating
# `[prune]` refuses the table outright rather than pruning to a floor it invented.
#
# AND THAT LOUD REFUSAL MUST NOT BE THE LAST WORD, which is the half the paragraph
# above got wrong (CLOUD-1146). `deny_unknown_fields` makes the stale binary
# refuse rather than invent a floor — right — but `verify` treats this task's
# non-zero as a DISK verdict and reports "not enough disk … pruning did not
# recover it" over a run that was a config-parse error on 17 GB of free space.
# The wrong cause is the defect: a reader is sent to free space that is already
# free.
#
# `land`'s speculative linearization is what makes it routine rather than rare.
# It rebases this branch onto another branch's UNLANDED commits to keep lapping
# while the landing lease is held, so the tree carries that branch's `batten.toml`
# and this container's installed binary — which is built from THIS branch and
# cannot know a key the other one just added. Measured over one session:
# `protected_readers`, `[prune.cold.basis]` and a new `[[recorder]]` value variant
# each killed a lap this way, none of them a fault of the branch trying to land.
#
# So a failed first attempt falls through to the build, which is the only entry
# point where engine and config are the pair that ships — `batten-check` states
# that reason for choosing `cargo run` outright. The circularity argument above
# survives intact, because it is about which entry point goes FIRST: the install
# is still tried first and still needs no build, so the disk-short case this task
# exists for reaches the reclaim exactly as before. Only a first attempt that
# already failed pays for a build, and where that failure really was the disk the
# build fails too — the same refusal today gives, with the build's own cause
# rather than a borrowed one.
#
# AND AN ABSENT `batten` ASKS THE DISK QUESTION BEFORE IT BUILDS (CLOUD-1838). The
# paragraph above holds for a binary that is PRESENT and refuses. It does not hold
# when there is no binary at all — a fresh clone, a developer machine, provisioning
# that did not finish — because then there is no first attempt, and the fallback
# is the only arm: it compiled the engine and wrote to `target/` before anything
# looked at the disk, so on a short disk the reclaim died on cargo's `ENOSPC`
# without ever speaking. The one state this task exists for was the one state it
# could not answer.
#
# So the absent arm answers the narrower question that needs no engine: is there
# room to BUILD the engine that would answer? `[prune.cold] mb` is exactly that
# number — the measured cost of a cold build — so it is read, not re-derived, and
# the floor keeps one authority. Below it, refuse with exit 2, which is the code
# the engine gives its own below-floor refusal. At or above it, or where either
# number cannot be read, fall through to the build exactly as before: the new arm
# refuses only on evidence and never invents a verdict.
#
# `awk`, not `taplo`: an unprovisioned clone is where a mise-installed tool is
# likeliest missing, and depending on one would reopen the hole in the case that
# makes it. String comparison rather than a regex, so the program carries no
# escape a TOML basic string would have to survive.
#
# `sh -o errexit`, not bash-without-`set -e` — this task declares no `shell`, so
# `rules/toolchain.md`'s no-`set -e` note does not cover it. Every command that
# may fail therefore sits in an `if` or an `&&` list, where errexit does not fire.
#
# THE COST, stated: with no `batten` and free space between the warm and cold
# floors, this refuses where the engine might have passed a warm tree. That is
# the one manual step CLOUD-1838 accepts for this shape. It cannot produce a pass
# the engine would have refused.
#MUTANT-SUITE crates/batten/tests/it/target_prune.rs
#MUTANT prune-fallback-builds|s@^if command -v batten >/dev/null 2>&1; then$@if true; then@|an_absent_engine_on_a_short_disk_is_refused_without_a_build
run = """
if command -v batten >/dev/null 2>&1; then
  if batten target prune -y; then
    exit 0
  fi
else
  free="${TARGET_PRUNE_FREE_MB%%,*}"
  if [ -z "$free" ]; then
    free="$(df -Pm . | awk 'NR == 2 { print $4 }')"
  fi
  if cold="$(awk '$0 == "[prune.cold]" { inside = 1; next } substr($0, 1, 1) == "[" { inside = 0 } inside && $1 == "mb" && $2 == "=" { print $3; exit }' batten.toml)" && [ -n "$cold" ] && [ -n "$free" ] && [ "$free" -lt "$cold" ]; then
    echo "target-prune: no batten on PATH, and ${free}MB free is below the ${cold}MB a cold build needs — refusing rather than building the engine to ask" >&2
    exit 2
  fi
fi
cargo run --quiet -p batten -- target prune -y
"""

[tasks.filed-here-check]
description = "Gate: every row this branch put on the board was refined at creation and none names code this branch has open (reads the recorder's record; pointer-only)"
# CLOUD-514's gate, ported off `mise-tasks/filed-here-check.sh` under CLOUD-1051.
#
# THE TASK NAME SURVIVES THE MIGRATION, for `prose-only-check`'s reason above:
# `mise-tasks/land.sh` invokes it by name at the fourth stop, and `land.sh` is an
# authored shell rule `shell-retirement` refuses to see edited — so retiring the
# gate by editing its caller would have meant retiring the landing loop to move
# one predicate. That call site stays byte-identical and out of this PR's
# changed-file set.
#
# THE HEREDOC ON THAT CALL BECOMES INERT INPUT, and the channel it carried moved
# rather than closing. `land` piped the PR body in so the gate could exempt a row
# the PR CLOSES; `batten check` is declared `read` and has no stdin channel
# (house-style §5), so the body now reaches the predicate as a RECORD — the
# boundary captures what `gh pr view --jq .body` returned and the module reads
# `input.tree.records["pr-closes"]`. `land` re-fetches that body thirty lines
# above this call, so the record is fresh by construction.
#
# THE TWO NUDGE MODES DID NOT MOVE HERE. `--advisory` and `--checklist` were
# `stop-guard`'s callers, and `stop-guard` is retired in this same change: those
# questions are asked at `Stop` by the engine's own hook now, over the same
# module, so there is still exactly one implementation of the intersection.
run = "cargo run --quiet -p batten -- check --rule 'issue file other'"

[tasks.claim-race]
description = "Gate: no other OPEN pull request already claims a key this branch claims (asks the forge; pointer-only)"
# CLOUD-446's duplicate-claim half, ported off `mise-tasks/claim-race-check.sh`
# under CLOUD-1422.
#
# THROUGH THE TASK RUNNER RATHER THAN A BARE `batten`, and that is the defect
# this row was FIRST written with. `check = "batten claim race"` resolves the
# INSTALLED binary from PATH, so a checkout whose source has moved ahead of its
# last `install:local` is judged by an older program — measured here: the row
# reported a finding against `crates/batten/src/race.rs` because the installed
# batten had no `claim race` verb at all and exited on usage. A gate answered by
# a stale binary is a gate that decides about a tree nobody has.
#
# Every other `command` row in `batten.toml` names a `mise run` task for the same
# reason; this one being the exception was an oversight rather than a choice.
run = "cargo run --quiet -p batten -- claim race"

[tasks.policy-test]
description = "Gate: run every registered policy module's and enabled preset's own `test_` rules"
# CLOUD-931. `batten policy test` shipped with CLOUD-835 so the retirement
# campaign's bats corpus would have a destination, and then NOTHING INVOKED IT —
# no task, no hk step, no CI step. Its only automatic exercise was
# `policy_presets.rs::every_shipped_preset_passes_its_own_suite`, which covers
# vendored presets and no consumer module at all.
#
# What that cost, measured at v0.0.113: `policy/` holds seven modules and the
# whole load-time tier over all of them ran only when a human typed the verb.
# `privileged-lane` is a live `deny` row over this repository's own privileged CI
# lanes and its nine `test_` rules were, by the standard `tests/run-shape.bats`
# states in its own header, comments that happen to parse.
#
# AN INLINE TASK RATHER THAN A `mise-tasks/` PROGRAM, and that is forced rather
# than stylistic: `bash-surface-not-growing` (CLOUD-929) lands in this same PR and
# counts one `#MISE description=` per program under `mise-tasks/**`. A new script
# here would make the commit that introduces the census ratchet the commit that
# grows the census — and declaring a migration-support task `# stays-bash:` would
# be a lie in the one gate that exists to stop lies about the census. It is one
# command, which is what `rules/toolchain.md` reserves a file task FROM.
#
# THIS DELIVERS THE LOAD-TIME TIER ONLY. `tests/<gate>.bats` over the compiled
# binary is the tier that proves the ENGINE produces the shape a predicate reads,
# and a `with input as` cannot substitute for it (CLOUD-845). That is why this row
# also carries `tests/privileged-lane.bats` rather than stopping here.
#
# ONE ARGV (CLOUD-1991): the `set -eu` the body carried guarded a single command,
# whose exit code a one-command task already is.
run = "cargo run --quiet -p batten -- policy test"

# The repository SBOM (CLOUD-262) and the binary SBOM (CLOUD-263), retired onto
# `batten sbom` under CLOUD-843. The derivation — syft's scan, the identity
# normaliser, the cargo supplier/originator/licence/copyright pass and the pinned
# actions' licence table — is the verb's mechanism, and what it scans and names is
# `batten.toml`'s `[sbom]` table. The two names survive as argv glue because
# `release-artifacts.yml` runs them and appends their KEY=VALUE pointers to
# `$GITHUB_OUTPUT`: ONE definition of the invocation, so the bytes a gate judges are
# the bytes a release publishes.
#
#   mise run sbom              derive both documents, print `spdx=`/`cdx=`
#   batten sbom --names        the asset names, without scanning
[tasks.sbom]
description = "Effect: derive the SPDX and CycloneDX inventories of this tree, under the names the release assets carry"
run = "cargo run --quiet -p batten -- sbom"

# Produce, and — as its OWN task — the one rule. The binary's inventory is
# `batten sbom --binary`'s, its record the `supply-chain` preset's to decide
# (`commit grade unsafe`, the row enabling it; `cargo list other` is the module's own rule).
#
# TWO TASKS, BECAUSE THEY SPEAK ON TWO CHANNELS. The release workflow appends
# `sbom-binary`'s stdout to `$GITHUB_OUTPUT`, where only `sbom=`/`packages=` belong;
# a refusal's pointer line on that same stdout would land in the output file
# instead of the job log (and is not a KEY=VALUE line the runner accepts). The
# retired body routed it with `>&2`; argv glue has no redirect, so the finding
# gets a step of its own whose stdout IS the log. `sbom-binary-check` is the
# workflow's step between the inventory and the upload, so a refusal fails the
# job before the asset can be published.
[tasks.sbom-binary]
description = "Effect: inventory a built binary from its own bytes, printing the asset's `sbom=`/`packages=` pointers"
usage = """
arg "<binary>" help="the built binary"
arg "<target>" help="the target triple the binary was built for"
"""
run = "cargo run --quiet -p batten -- sbom --binary {{usage.binary}} --target {{usage.target}}"

[tasks.sbom-binary-check]
description = "Gate: refuse a binary inventory that catalogs nothing, or crates the lockfile does not hold — over `sbom-binary`'s record"
run = "cargo run --quiet -p batten -- check --rule 'commit grade unsafe'"

# CLOUD-266's measurement half: three declared forge reads, in order, because
# each fans out over the family the one before it recorded (CLOUD-843). The
# endpoints, windows and reductions are `[[forge.query]]` rows in `batten.toml`;
# the job durations are the producer's subtraction; the pooling, the p95 and the
# classification are the `ci-signal` preset's.
#
# A FORGE THAT WILL NOT ANSWER NOW FAILS THIS TASK, where the retired body exited
# 2 on the same condition: `record query` answers could-not-look with exit 3 and
# removes the family, so the scheduled `timeout-drift.yml` job reds and the
# preset, reading an absent record, says nothing.
[tasks.timeout-drift-record]
description = "Record each workflow's recent successful runs and their jobs' durations, for `bound grade other`"
run = [
  "cargo run --quiet -p batten -- record query drift-workflows",
  "cargo run --quiet -p batten -- record query drift-runs",
  "cargo run --quiet -p batten -- record query drift-jobs",
]

# CLOUD-831's producer, ported off `mise-tasks/evaluator-closure-check.sh` under
# CLOUD-1717. The two things that are not decisions: the `cargo metadata` spawn,
# and the graph walk.
#
# THE WALK IS NOT A BODY HERE, AND THAT IS WHAT KEEPS IT UNDER TEST. Four of the
# dying suite's eight cases are about the WALK — an unactivated optional
# dependency, the same one activated, a dev-dependency, and a crate the
# workspace reaches but the evaluator does not — and they are the
# security-critical half. Inlined here they would be assertable by nothing;
# in `crates/batten/src/cargo_graph.rs` they are
# `crates/batten/tests/it/evaluator_closure.rs`'s to drive.
#
# IT WAS A `.py` SIBLING FOR PART OF THIS BRANCH, and that detour is recorded
# rather than quietly dropped: `.py` is excluded from `under_mise_tasks`, so the
# ratchet counted the program gone while every line of its reading stayed in the
# tree one interpreter over. `shell-retirement.rego`'s arm F refuses that shape
# now, and the walk is Rust the engine tests.
#
# `--locked` because the question is about the COMMITTED resolution. A gate
# allowed to update the lockfile answers "what would upstream give me today",
# which is a property of the world rather than of this commit — the exact split
# `lock-complete` was carved out of `lock-check` to fix.
#
# A recorded graph on stdin (with no `resolve` input) is how the gate is shown
# able to FAIL (CLOUD-418): the live tree is clean by construction, which is the
# point of the gate, so a suite that could only run against it would assert a
# pass and never a refusal.
#
# NOTHING IS WRITTEN WHEN THE GRAPH WILL NOT RESOLVE. That is the record
# contract: an absent record is "the producer did not run", and the module reads
# it as silence rather than as a clean closure. A graph that DID resolve without
# an evaluator node is a different answer and the walk records it as `absent`.
# The macOS link gate's producer, ported off `mise-tasks/macos-link-check.sh`
# under CLOUD-1717. The two things that are not decisions: the `cargo metadata`
# spawn and the graph walk.
#
# `--filter-platform aarch64-apple-darwin` IS THE QUESTION, not an optimisation.
# A macOS-only transitive dep must be seen and a Linux-only one must not, so the
# graph is resolved FOR macOS. Apple Silicon because it is the platform a
# maintainer is most likely to run, and both Darwin triples share these deps.
# (`evaluator-closure-record` deliberately does NOT filter: its pin is a claim
# about every platform this crate ships to, so narrowing would let an IO crate
# arrive behind a `cfg` for a platform the gate does not run on.)
#
# A recorded graph on stdin, with no `resolve` input, is how the filter is
# shown able to FAIL: the live tree is clean by construction, which is the point
# of the gate.
#
# NOTHING IS WRITTEN WHEN THE GRAPH WILL NOT RESOLVE — the record contract, so an
# absent record reads as "the producer did not run" rather than as a clean graph.
# CLOUD-388/CLOUD-651's census, ported off `mise-tasks/transcript-corpus-check.sh`
# under CLOUD-1717. The one thing that is not a decision: walking a HOST
# filesystem, which §5 makes `check` structurally incapable of.
#
# `BATTEN_TRANSCRIPT_ROOT` is the host's own layout — a HOST fact rather than a
# consumer one, so it is fine in this layer and would not be fine in
# `crates/batten` (non-negotiable rule 1). It is also what makes the census
# testable at all: a live host produces exactly one count, its own session, so a
# suite that could not vary the root would ship as coverage while exercising a
# single row (CLOUD-418).
#
# The census WRITES NOTHING when the root does not exist — the question could not
# be asked — which the module reads as silence. A root that was walked and held
# no transcripts records `sessions 0`, which is an answer.
# CLOUD-418's obligation made runnable, ported off
# `mise-tasks/evaluator-io-check.sh` under CLOUD-1717. The one thing that is not
# a decision: building the test with `probe-evaluator-io` on and reading what the
# harness said.
#
# THE VERDICT IS THE HARNESS'S OWN LINE, NEVER THE EXIT CODE. `cargo test` exits
# non-zero for a compile error, an unresolved feature, an absent toolchain and a
# panic in another test — every one of which would read as "the probe falsified
# the assertion" and hand the gate a pass it did not earn. Worse, that pass gets
# MORE likely as the crate breaks, so the gate would be loudest exactly when it
# was lying.
#
# The `failures:` LISTING rather than the per-test line, because the per-test
# line is not stable across harness modes: plain prints `test <name> ... FAILED`
# and `--quiet` prints `<name> --- FAILED`. The listing is one indented name in
# both, and anchoring on it is what stops this going quietly could-not-look the
# day someone adds or drops `--quiet`.
#
# The body is retired (CLOUD-843): `batten record probe` runs the probe build
# after `--` and derives the reading from its exit status and output in process,
# so the task is one argv. The tier drives all three verdicts through that verb
# with a stub command rather than a two-minute rebuild per case.
#
# NOT RECEIPT-GATED ANY MORE. The step cache is `batten step run`'s, whose body is
# another package's (CLOUD-843); a cache hit there must still leave this record,
# which the retired body did by writing `probe failed` on a hit.
#
# POINTER-ONLY: one token. The probe log carries module bodies and paths, and no
# byte of it reaches the record.
# THE SIGNING GATE UNDER ONE NAME, and the name is what `commit-lint` depends on
# (CLOUD-669). A `depends` entry names ONE task, so the producer and the judge
# compose here rather than at every call site.
#
# ARGV, NO SHELL, since CLOUD-843. The producer body that ran `git config`,
# `git rev-list` and `git cat-file` retired: the engine reads the signer itself
# (`record derive signing-posture`), and the conflict between config scopes and
# the signed commits in range are git facts the `supply-chain` preset reads off
# `commit grade unsafe`'s declared columns. An array stops at its first failing
# entry, so a producer that could not write its record never falls through to a
# judge that would read the absence as silence — what the hand guard here did.
[tasks.signing-posture-check]
description = "Gate: this checkout's signer is verifiable and no commit in range carries a key nobody can check (CLOUD-669)"
run = [
  "cargo run --quiet -p batten -- record derive signing-posture",
  "cargo run --quiet -p batten -- check --rule 'commit grade unsafe'",
]

[tasks.evaluator-io-record]
description = "Effect: record whether the IO-free evaluator test goes red under `probe-evaluator-io`, for `test judge never`"
run = "cargo run --quiet -p batten -- record probe evaluator-io-probe --input test=no_evaluator_feature_admits_io -- cargo test --quiet -p batten --features probe-evaluator-io --test policy_modules no_evaluator_feature_admits_io -- --include-ignored"

[tasks.transcript-corpus-record]
description = "Effect: count this host's independent session transcripts against a threshold, for `corpus count thin`"
# THE WALK IS THIS TASK'S ROOT TO NAME — §5 keeps a host-filesystem walk
# outside `check` — and WHAT COUNTS as an independent session is
# `crates/batten/src/transcript.rs`, beside the parse that already owns
# this host format (CLOUD-1717).
#
# ABSENT AND PRESENT-BUT-EMPTY ARE DIFFERENT CLAIMS about the exclusion,
# which is why the flag is added rather than always passed: an unset
# `BATTEN_SESSION_ID` is a caller saying nothing, and `--input exclude=`
# would be a caller saying "exclude nothing". Passing the empty one
# always would launder the first into the second.
#
# ARGV ASSEMBLED BY THE TEMPLATE, NOT A SHELL (CLOUD-1991). The root's default,
# the threshold positional and the conditional exclusion were all argument
# assembly; `usage` binds the positional with its default and the template's
# `if` adds each flag only where the shell's test did. An EMPTY
# `BATTEN_SESSION_ID` is falsy there exactly as `-n` read it.
usage = 'arg "[threshold]" default="2" help="how many independent sessions make the corpus thick"'
run = 'cargo run --quiet -p batten -- record derive transcript-corpus --input "root={% if env.BATTEN_TRANSCRIPT_ROOT %}{{env.BATTEN_TRANSCRIPT_ROOT}}{% else %}{{env.HOME}}/.claude/projects{% endif %}" --input "threshold={{usage.threshold}}"{% if env.BATTEN_SESSION_ID %} --input "exclude={{env.BATTEN_SESSION_ID}}"{% endif %}'

[tasks.macos-link-record]
description = "Effect: record the built macOS graph's links-declaring and framework-linking crates, for `workspace carry unsafe`"
# ONE ARGV SINCE CLOUD-1991: the RESOLUTION moved into the verb, beside the
# walk it feeds. `resolve=aarch64-apple-darwin` is the `--filter-platform` the
# spawn carried — the question, not an optimisation — and the verb resolves
# `--locked`, so a stale lockfile is could-not-look (exit 3) rather than a graph
# nobody committed. COULD-NOT-LOOK IS NEVER 0 and records nothing, which the
# body's `exit 2` held and the verb's internal-error code now holds. The crate
# names the walk looks for stay `[[pattern]]` rows rather than constants in a
# repo-agnostic core (CLOUD-1717). The `BATTEN_LINK_CHECK_METADATA` fixture
# switch is gone: a recorded graph reaches the same walk on stdin, with no
# `resolve`, which is how `macos_link.rs` already drives it.
run = "cargo run --quiet -p batten -- record derive macos-link --input framework=sdk-framework-crate --input vendored=vendored-links-crate --input resolve=aarch64-apple-darwin"

# The macOS link gate as hk's `macos-link-check` step runs it (CLOUD-1991). The
# step's `check` was a `&&` pair — produce, then decide — which made it the one
# shell line in `hk.pkl`. `depends` is that ordering without a shell: the record
# is produced first, and a producer that fails stops the gate before the engine
# decides over a record it did not write. The step name and the rule id stay one
# object, as the step's own comment requires.
[tasks.macos-link-check]
description = "Gate: the macOS graph links no Apple SDK framework — record it, then decide `workspace carry unsafe`"
depends = ["macos-link-record"]
run = "cargo run --quiet -p batten -- check --rule 'workspace carry unsafe'"

[tasks.evaluator-closure-record]
description = "Effect: record the evaluator's activated sub-closure and any IO-bearing crate in it, for `layer reach unsafe`"
# ONE ARGV SINCE CLOUD-1991, `macos-link-record`'s shape: the verb resolves the
# graph itself, `--locked` as this body always did, and `resolve=any` because
# the pin is a claim about every platform this crate ships to. COULD-NOT-LOOK
# IS NEVER 0 and records nothing — the verb's exit 3 where the body's was 2. The
# `BATTEN_EVALUATOR_METADATA` switch is gone: a recorded graph reaches the same
# walk on stdin, which is how `evaluator_closure.rs` shows the gate able to FAIL.
run = "cargo run --quiet -p batten -- record derive evaluator-closure --input roots=evaluator-package --input bears=evaluator-io-crate --input resolve=any"

# CLOUD-349's reading half: three declared forge reads, in order, because the
# tips fan out over the heads the first one recorded (CLOUD-843). The age in days
# is the producer's clock; the trunk exclusion and the threshold are
# `policy/branch-age.rego`'s.
#
# A FORGE THAT WILL NOT ANSWER NOW FAILS THIS TASK, AND THAT IS A CHANGE. The
# retired body ended each read with `|| exit 0`, so an outage or a missing
# credential left the record absent and the scheduled `branch-hygiene.yml` job
# green. `record query` answers could-not-look with exit 3 and removes the
# family, so that job now reds instead: a weekly report that cannot read the
# forge says so rather than passing over nothing. The module still reads the
# absent record as could-not-look, so no branch is ever reported stale on a blip.
#
# TIP DATES COST ONE REQUEST PER DISTINCT TIP. The retired body took every
# branch's tip date in ONE GraphQL call, and its comment rejected a REST branch
# list plus a commit per branch as the shape `mem:github-rest-etiquette` warns
# about. `[[forge.query]]` walks REST only, so `branch-tips` is that shape, bounded
# by `branch-heads`' one page of 100: up to 100 requests a run, against the
# job token's 1000 an hour, once a week. Conditional requests do not save them in
# CI, whose checkout starts with an empty validator store. A GraphQL walk would
# bring it back to one; the forge-query row has no transport for it yet.
[tasks.branch-age-record]
description = "Effect: record every remote branch, each tip's age in days, and recently closed pull requests' heads (CLOUD-349)"
run = [
  "cargo run --quiet -p batten -- record query branch-heads",
  "cargo run --quiet -p batten -- record query branch-tips",
  "cargo run --quiet -p batten -- record query branch-merged",
]

[tasks."render:cli"]
description = "Effect: render the CLI reference from the command surface — the publish-time artifact, never committed (CLOUD-171)"
# CLOUD-171, retired off `mise-tasks/render/cli.sh` under CLOUD-1752. An effect
# with no decision a module could take: it renders, refuses to publish an empty or
# failed render, and names the asset. `batten generate markdown` walks the same
# SURFACE-built clap tree the parser does, so the reference is current by
# construction and NOTHING GENERATED IS COMMITTED — `surface.rs`'s
# `the_markdown_reference_is_not_committed` asserts the absence.
#
# Prints `reference=<path>` and nothing else: `release-artifacts.yml` appends it
# to `$GITHUB_OUTPUT` unchanged, so a second stdout line would be a second output.
# Exit 0 rendered / 1 could not render.
usage = '''
flag "--names" help="print the asset path and exit, with no build and no network"
'''
# THE RENDER, THE EMPTY-REFUSAL AND THE ATOMIC MOVE ARE THE ENGINE'S NOW
# (CLOUD-1991). `artifacts write --reference` renders the same markdown
# `generate markdown` emits, refuses an empty render, writes through `durable`
# (temp, fsync, rename) so a failed write leaves the previous artifact whole,
# and prints the one `reference=<path>` line `release-artifacts.yml` appends to
# `$GITHUB_OUTPUT`. What is left here is ARGV ASSEMBLY, which the template does:
# the path defaults `RENDER_CLI_OUT_DIR` to `reference` and names the asset from
# `[env]`, and `--names` selects an `echo` of that path rather than the render,
# so asking for the name still builds nothing.
run = '{% if usage.names %}echo reference={% if env.RENDER_CLI_OUT_DIR %}{{env.RENDER_CLI_OUT_DIR}}{% else %}reference{% endif %}/{{env.BATTEN_CLI_REFERENCE}}{% else %}cargo run --quiet -p batten -- artifacts write --reference {% if env.RENDER_CLI_OUT_DIR %}{{env.RENDER_CLI_OUT_DIR}}{% else %}reference{% endif %}/{{env.BATTEN_CLI_REFERENCE}}{% endif %}'

# CLOUD-278's manifest, moved off `mise-tasks/checksums.sh` under CLOUD-1717 and
# off this body onto `batten release sums` under CLOUD-843: download a release's
# own assets, hash them in byte order, write the manifest, never hashing itself.
# The release workflow calls it by this name with the tag appended (an empty tag
# is the latest release), and `--names` answers the path with no network. The
# manifest's name is `[env]`'s one declaration, rendered into the argv.
[tasks.checksums]
description = "Effect: derive the SHA256 manifest of a release's own assets, read back after upload"
run = "cargo run --quiet -p batten -- release sums --manifest {{env.BATTEN_CHECKSUM_MANIFEST}}"

# CLOUD-518's gate and CLOUD-790's actor, retired onto `batten pr unsubscribed`
# under CLOUD-843. The receipt store, the endpoint call and the reading are the
# engine's (`crates/batten/src/unsubscribe.rs`); `check`'s decision is
# `policy/pr-unsubscribed.rego`, run over the record it writes.
#
# EVERYTHING THE HOST IS, THIS FILE DECLARES (non-negotiable rule 1): the
# variable carrying the session id (the id `[[mcp.source]] claude-code-remote`
# spells its wiring file with), the variable carrying the credential file's
# path, the endpoint — the `/github/mcp` route and not the toolbox one, with
# `{session}` where the id goes — and the tool. `land` runs `pr-unsubscribed
# drop` and then `check` as entry gates (`LAND_ENTRY_GATES`), by this name, with
# the arm and the pull request appended to this argv.
[tasks.pr-unsubscribed]
description = "Gate: this session has dropped the PR's webhook subscription (records unsubscribe_pr_activity's answer, then decides) — CLOUD-518"
run = "cargo run --quiet -p batten -- pr unsubscribed --session-env CLAUDE_CODE_REMOTE_SESSION_ID --token-env CLAUDE_SESSION_INGRESS_TOKEN_FILE --endpoint https://api.anthropic.com/v2/ccr-sessions/{session}/github/mcp --tool unsubscribe_pr_activity --arguments '{\"owner\":\"{owner}\",\"repo\":\"{repo}\",\"pullNumber\":\"{pr}\"}' --family pr-unsubscribed --rule 'event watch other'"

# CLOUD-258/262/278's reading half, ported off `mise-tasks/release-assets-check.sh`
# under CLOUD-1717 and off this body onto `batten record release` under
# CLOUD-843. It records what the FORGE says — the tag, the assets, the manifest's
# entries and the entries whose bytes disagree — and nothing else: which assets
# the release must carry is derived by `policy/release-assets.rego` from the build
# workflow it declares as a document, and whether the manifest tells the truth is
# the `release-hygiene` preset's. The tag is appended; empty is the latest.
[tasks.release-assets-record]
description = "Effect: record a release's assets, its checksum manifest's entries, and the entries whose bytes disagree (CLOUD-258)"
run = "cargo run --quiet -p batten -- record release --manifest {{env.BATTEN_CHECKSUM_MANIFEST}}"

# The name `release-assets.yml` runs on its clock, kept, and the DECISION only:
# the record is written by `release-assets-record <tag>` first, because a task's
# appended argument reaches its LAST command and the tag belongs to the record.
[tasks.release-assets-check]
description = "Gate: a release carries one archive per target the dist matrix builds, every uploaded asset, and a covering checksum manifest (CLOUD-258)"
run = "cargo run --quiet -p batten -- check --rule 'release grade other' --rule 'release pin other'"

# The name `auto-release-land.yml` runs, kept: exit 0 due, 2 holding.
# `release-tracking-check`'s name, kept for `hk.pkl` and every hand that types it:
# the decision is `policy/release-tracking.rego` now (CLOUD-1717), read off the
# two release workflows' lines by `batten check`.
[tasks.release-tracking-check]
description = "Gate: a shipped tag reaches Linear — both release-tracking invocations present, pinned, and bound to the tag, on the release path and the backfill path alike"
run = "cargo run --quiet -p batten -- check --rule 'release wire other'"

# `ntia-check`'s name, kept for every hand that types it: record, then decide.
# THE RECEIPT IS NOT A VERDICT (CLOUD-631): it caches an answer already given, so
# a runner whose transcript is unreadable reports the miss and still exits 0.
[tasks.ntia-check]
description = "Gate: the SBOM this tree produces meets the NTIA minimum elements — the checker's exit code, never its report"
#
# AN ARGV SEQUENCE SINCE CLOUD-1991, AND THE PRODUCER IS THE VERB SINCE CLOUD-843.
# `batten sbom --conformance` derives the document and records the checker's
# verdict, retiring `[tasks.ntia-record]`'s body. mise stops an array at its first
# failing entry with that entry's code, so a refusal (`2`) ends the task before the
# receipt and a conforming document reaches it — `set -e`'s whole job. A receipt
# that cannot be WRITTEN fails the task with the write's own `1`, the
# `linear-check` shape, and never the `2` a nonconformance carries. An unreadable
# transcript is not such a failure: `receipt record` reports it and records anyway
# (CLOUD-819). `cargo run` resolves the tree's engine.
run = [
  "cargo run --quiet -p batten -- sbom --conformance",
  "cargo run --quiet -p batten -- check --rule 'manifest cover other'",
  "cargo run --quiet -p batten -- receipt record sbom-ntia",
]

# CLOUD-319's gate, whose reading half retired off `[tasks.release-due-record]`
# under CLOUD-843: two declared `[[forge.query]]` windows in `batten.toml`, each
# read and windowed by `record query`'s own clock, then the one rule over both.
# A window the forge would not answer is `record query`'s exit 3, which stops the
# chain before `check` could judge a stale record.
[tasks.release-due]
description = "Gate: may the release PR land now? Debounce — quiet minutes on main, or hours since the last release, whichever comes first"
run = [
  "cargo run --quiet -p batten -- record query release-due-activity",
  "cargo run --quiet -p batten -- record query release-due-latest",
  "cargo run --quiet -p batten -- check --rule 'release grade early'",
]

# CLOUD-618's sweep, ported off `mise-tasks/release-backfill.sh` under CLOUD-1717
# and off this body onto `batten release backfill` under CLOUD-843. NOT A GATE:
# an operator effect that dispatches `linear-release-backfill.yml` once per tag,
# oldest first by version, waiting on each RUN rather than on its dispatch and
# stopping at the first that does not succeed. The workflow's shape is
# `release wire other`'s business (`policy/release-tracking.rego`).
#
# The workflow, its branch and what a release tag looks like are this
# repository's facts, so they are arguments here and never literals in the
# engine. Name tags with `-- --tag <tag>` (repeatable), or none for every tag the
# pattern selects; `-- --dry-run` prints the plan.
[tasks.release-backfill]
description = "Effect: record historical tags in the Linear release pipeline: dispatch the backfill workflow once per tag, oldest first, stopping on the first failure"
run = "cargo run --quiet -p batten -- release backfill --workflow linear-release-backfill.yml --ref main --pattern 'v[0-9]*'"

# A turn that cites `path:line` evidence and gives it no OPEN row stranded a
# finding (CLOUD-252, CLOUD-475, CLOUD-775) — retired onto `batten record decide`
# under CLOUD-843, and reached as the `finding-sink` `[[hook.handler]] on = "stop"`
# row, the engine's end-of-turn ladder's second rung.
#
# THE READING IS THE ENGINE'S (`crates/batten/src/turn.rs`): the LAST turn, main
# thread only; whether its prose matches `[[pattern]] finding-citation`; and its
# tool calls, each with the row it names (a direct call's `id`/`issueId`, or the
# `finding-mediated-key` group of a mediated `batten mcp call`) and the column
# this clone's `issue-read` receipt recorded for that row at field 5. THE DECISION
# IS `policy/finding-sink.rego`: a home is a row that OPENS, an amendment to a row
# in an open column, or a memory/document write called DIRECTLY — a mediated
# `mcp call <server> <method>` write is not a home (`[[pattern]]
# finding-mediated-call`). Recorded is not scheduled (CLOUD-475, CLOUD-775).
#
# COULD-NOT-LOOK ABSTAINS at exit 0 with nothing on stdout, which the handler
# door reads as a pass: no transcript, a line that is not JSON, or a cwd outside
# a checkout. A firing is `check`'s exit 2 with its pointer, which the door reads
# as the rung's advice. POINTER, NEVER PAYLOAD: `turn:<n>`, never the prose.
[tasks.finding-sink-check]
description = "Gate: a turn that cites path:line evidence and makes no durable write stranded a finding (reads a Stop payload or transcript path on stdin; pointer-only)"
dir = "{{cwd}}"
run = "cargo run --quiet -p batten -- record decide turn-writes --input citation=finding-citation --input key=finding-mediated-key --input fields=id,issueId --input receipt=issue-read --input field=5 --rule 'turn file other'"

# An issue may become Done only if none of its own pull requests is still open
# (CLOUD-468). CLOUD-843 retired the bash body: the reading is `batten record
# derive done-pr` (`crates/batten/src/tracker_reading.rs`) and the decision is the
# `tracker-hygiene` preset's `done-has-no-open-pull` module, checked by the one
# `issue state other` row. Payloads on stdin carry `.pulls` ({number, state,
# draft}) beside each issue's attachments; an attached PR with no state is
# could-not-look and records nothing.
#
# Exit 0 licensed / 2 refused / 1 could not look — the engine's table.
[tasks.done-pr-check]
description = "Gate: an issue may become Done only if none of its own pull requests is still open (reads get_issue payloads on stdin)"
dir = "{{cwd}}"
run = [
  "{{vars.batten}} record derive done-pr",
  "{{vars.batten}} check --rule 'issue state other'",
]

# The pre-tool handler `connector-allow-guard` spawns this (CLOUD-191). Retired
# off `[tasks.connector-allow-resolve]` under CLOUD-843: the decision is the
# engine's `batten mcp grant` now, reading the toolbox address from
# `[mcp.source.endpoint_contains]` and the governed name from
# `[mcp] permission_aliases` in `batten.toml`. A task at all only for
# `doctor:mediator`'s reason: a CI runner builds `batten` rather than installing
# it, so a handler row naming it fails `doctor`'s `hook-handlers` check.
[tasks."mcp:guard"]
description = "The decision behind connector-allow-guard: apply the committed permissions to whichever server name the host exposed, resolved through the injected config's endpoint (CLOUD-191)"
run = "batten mcp grant --guard"

# The session-start handler `mcp-attach-check` spawns this. Retired off
# `[tasks.mcp-attach-check]` and `[tasks.mcp-allow-check] --session` under
# CLOUD-843: `batten mcp posture` reads which enabled servers attached (the
# host's connection log and the spawn ledger) and which committed grants the
# connector would still prompt for. The commit-scoped half of `mcp-allow-check`
# is the `claude-code-cloud` preset's `mcp-grants-are-honoured.rego`, which
# `batten check` runs. A task for `mcp:guard`'s reason directly above.
[tasks."mcp:posture"]
description = "Report an enabled MCP server this session did not attach, or a committed grant the connector would still prompt for"
run = "batten mcp posture"

# Probe the GitHub read endpoints this repository's tasks call, and declare the
# write claims they need. Retired off its bash body under CLOUD-843: the table is
# `[[forge.probe]]` rows in `batten.toml` and the walk is `batten doctor forge`
# on the engine's one REST client. The name stays, so the `session-credential`
# handler and every reader who types it are unchanged. Exit 0 every probed read
# answered / 1 a read claim is missing or no forge remote names the repository.
[tasks.gh-preflight]
alias = "ghp"
description = "Probe the GitHub read endpoints this repo's tasks call, and declare the write claims they need — run it before trusting any GitHub result in a fresh environment"
run = "batten doctor forge"

# Which CLOUD-* issues did a release tag ship (CLOUD-174), and which of them are
# still In Review — retired off `mise-tasks/released.sh` under CLOUD-1752. `Done`
# means RELEASED, and no tracker integration fires on "a tag now contains this
# commit", so this is the predicate half; the move stays with the caller.
#
# Source of truth is git, the tag's commit range: `describe` walks the graph for
# the predecessor (creation date sorts tags cut seconds apart arbitrarily). A
# second way in (CLOUD-260): a payload's `commit` contained in the range, for work
# that landed before every change carried its key.
#
# SHIPPING IS NECESSARY FOR Done, NOT SUFFICIENT. Two refusals, both reported
# before either exits: an issue carrying `HOLD_MARKER` is HELD (CLOUD-257), and
# one `graph-check` rejects is REFUSED (CLOUD-309) — the conjunction is composed
# by calling that gate, never by copying its predicate, so no `pull/` appears here.
# `dangling-blocker` is a property of the piped SET and is not a refusal.
#
# COULD NOT LOOK is exit 2, never a pass: no tag, stdin that is not a payload set,
# or an In Review payload missing a key the gate decides on (`attachments`,
# `description`, `relations` — CLOUD-783, since `graph-check` keys those absences
# to its `graph` pseudo-id, which the per-issue lookup never matches). PRESENCE,
# never truthiness: `[]` and `""` are data.
#
# `dir = "{{cwd}}"`: it judges the caller's clone, and `graph-check` resolves from
# the manifest's own `mise-tasks/`. Pointer-only and sorted, so byte-stable.
[tasks.released]
#MUTANT-SUITE crates/batten/tests/it/released.rs
#MUTANT description-absence-is-silent|s/^for key in description relations; do$/for key in relations; do/|an_in_review_payload_with_no_description_is_refused_and_named
#MUTANT relations-absence-is-silent|s/^for key in description relations; do$/for key in description; do/|an_in_review_payload_with_no_relations_is_refused_and_named
#MUTANT attachments-absence-is-silent|s@^if \[\[ -n "\$missing_attachments" \]\]; then$@if false; then@|an_in_review_payload_with_no_attachments_key_is_could_not_look
#MUTANT hold-ignored|s@^\tif \[\[ "\$status" = "In Review" \]\] .*HOLD_MARKER.*; then$@\tif false; then@|an_issue_holding_itself_open_is_held
#MUTANT gate-verdict-dropped|s@^\t\[\[ "\$status" != "In Review" \]\] @\ttrue @|an_in_review_issue_with_no_pr_is_refused_by_rule
#MUTANT commit-path-dropped|s@^\tby_commit="\$by_commit \$id"$@\t:@|a_commit_the_tag_contains_is_a_second_way_in
#MUTANT earlier-tag-reshipped|s@^\t\t! git merge-base --is-ancestor "\$sha" "\$prev" 2>/dev/null @\t\ttrue @|a_commit_an_earlier_tag_shipped_is_not_new
description = "Which CLOUD-* issues did a release tag ship? Resolves refs from the tag's commit range; cross-checks piped board payloads for the ones still In Review"
shell = "bash -c"
dir = "{{cwd}}"
usage = 'arg "[tag]" help="the release tag whose commit range is judged"'
run = '''
{% raw %}
set -euo pipefail
# The marker an issue puts in its own body to hold itself open, stated once here.
HOLD_MARKER='DO-NOT-CLOSE'
manifest="${MISE_CONFIG_FILE:-${MISE_PROJECT_ROOT:-$PWD}/mise.toml}"
gate="$(dirname -- "$manifest")/mise-tasks/graph-check.sh"
tag="${usage_tag:-${1:-}}"
if [[ -z "$tag" ]]; then
	echo "::error:: usage: mise run released <tag> [< get_issue payloads on stdin]" >&2
	exit 2
fi
if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1; then
	echo "::error:: no such tag: $tag. A tag that does not exist is a caller error, not an empty release." >&2
	exit 2
fi
prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
if [[ "$prev" = "$tag" ]] || [[ -z "$prev" ]]; then
	range="$tag"
else
	range="$prev..$tag"
fi
refs=$(git log --format='%B' "$range" 2>/dev/null | grep -oE 'CLOUD-[0-9]+' | sort -u || true)
# No stdin, or an empty one: report the refs. A pure-chore release ships no issue,
# which is clean — exiting non-zero would break the release path.
if [[ -t 0 ]] || ! payload=$(cat) || [[ -z "${payload//[[:space:]]/}" ]]; then
	if [[ -z "$refs" ]]; then
		echo "released: $tag ($range) references no CLOUD-* issue"
	else
		echo "released: $tag ($range) shipped:"
		# shellcheck disable=SC2086  # one id per line
		printf '  %s\n' $refs
	fi
	exit 0
fi
if ! issues=$(jq -sc 'if length == 1 and (.[0] | type == "array") then .[0] else . end' <<<"$payload" 2>/dev/null) ||
	! jq -e 'all(.[]; has("id") and has("status"))' <<<"$issues" >/dev/null 2>&1; then
	echo "::error:: stdin is not a set of get_issue payloads (need id and status per issue)" >&2
	exit 2
fi
missing_attachments=$(jq -r '[.[] | select(.status == "In Review") | select(has("attachments") | not) | .id] | join(" ")' <<<"$issues")
if [[ -n "$missing_attachments" ]]; then
	echo "::error:: no \`attachments\` on In Review issue(s): $missing_attachments. The board gate reads that key to decide \`in-review-no-pr\`, so a payload without it cannot answer whether anything landed — re-fetch with attachments included." >&2
	exit 2
fi
for key in description relations; do
	missing=$(jq -r --arg k "$key" '[.[] | select(.status == "In Review") | select(has($k) | not) | .id] | join(" ")' <<<"$issues")
	[[ -n "$missing" ]] || continue
	case "$key" in
	description)
		reads="the §8 status-claim scan and the Ready-block delegation"
		remedy="re-fetch with the description included"
		;;
	relations)
		reads="\`blockedby-cycle\` and \`dangling-blocker\`"
		remedy="re-fetch with \`includeRelations: true\`"
		;;
	esac
	echo "::error:: no \`$key\` on In Review issue(s): $missing. The board gate reads that key to decide $reads, so a payload without it cannot answer — $remedy." >&2
	exit 2
done
if [[ ! -x "$gate" ]]; then
	echo "::error:: cannot run $gate. A gate that cannot run is not a pass — the sweep needs it, so this is 'could not look'." >&2
	exit 2
fi
# A per-issue violation is the payload, not the status, so the exit is not fatal.
gate_report=$("$gate" <<<"$issues" 2>&1 >/dev/null) || true
refusal_for() {
	grep -oE "^$1 [a-z-]+" <<<"$gate_report" | awk '{print $2}' | grep -vx 'dangling-blocker' | head -n1 || true
}
# A malformed or unknown sha is supplementary evidence, ignored rather than fatal.
by_commit=""
while IFS= read -r pair; do
	[[ -n "$pair" ]] || continue
	id="${pair%% *}"
	sha="${pair#* }"
	git rev-parse -q --verify "${sha}^{commit}" >/dev/null 2>&1 || continue
	git merge-base --is-ancestor "$sha" "$tag" 2>/dev/null || continue
	if [[ -n "$prev" ]] && [[ "$prev" != "$tag" ]]; then
		! git merge-base --is-ancestor "$sha" "$prev" 2>/dev/null || continue
	fi
	by_commit="$by_commit $id"
done <<<"$(jq -r '.[] | select((.commit // "") != "") | "\(.id) \(.commit)"' <<<"$issues" 2>/dev/null || true)"
# shellcheck disable=SC2086  # one id per line
refs=$(printf '%s\n' $refs $by_commit | sort -u)
if [[ -z "${refs//[[:space:]]/}" ]]; then
	echo "released: $tag ($range) references no CLOUD-* issue"
	exit 0
fi
movable=0
skipped=0
held=0
refused=0
for ref in $refs; do
	status=$(jq -r --arg id "$ref" '.[] | select(.id == $id) | .status' <<<"$issues" | head -n1)
	# Shipped but not piped is not a finding: the caller chose the closure.
	[[ -n "$status" ]] || continue
	body=$(jq -r --arg id "$ref" '.[] | select(.id == $id) | .description // ""' <<<"$issues" | head -c 100000)
	rule=""
	[[ "$status" != "In Review" ]] || rule=$(refusal_for "$ref")
	if [[ "$status" = "In Review" ]] && [[ "${body#*"$HOLD_MARKER"}" != "$body" ]]; then
		echo "  $ref  HELD — the issue holds itself open"
		held=$((held + 1))
	elif [[ -n "$rule" ]]; then
		echo "  $ref  REFUSED ($rule) — the board gate rejects it"
		refused=$((refused + 1))
	elif [[ "$status" = "In Review" ]]; then
		echo "  $ref  In Review -> Done"
		movable=$((movable + 1))
	else
		echo "  $ref  $status (left alone)"
		skipped=$((skipped + 1))
	fi
done
tally="released: $tag ($range) — $movable to move, $skipped left alone"
[[ "$held" = 0 ]] || tally="$tally, $held HELD"
[[ "$refused" = 0 ]] || tally="$tally, $refused REFUSED"
echo "$tally"
if [[ "$held" != 0 ]]; then
	echo "::error:: $held issue(s) shipped in $tag but carry \`$HOLD_MARKER\`. Shipping a ref is necessary for Done, not sufficient — resolve the hold or strike the marker before moving them." >&2
fi
if [[ "$refused" != 0 ]]; then
	echo "::error:: $refused issue(s) shipped in $tag are rejected by graph-check. In Review -> Done is a conjunction: the tag must have shipped it AND the board must be labelling it honestly. Fix the board state named above — do not move them." >&2
fi
if [[ "$held" != 0 ]] || [[ "$refused" != 0 ]]; then
	exit 1
fi
{% endraw %}
'''

[tasks.duplicate-close-check]
#MUTANT-SUITE crates/batten/tests/it/tracker_hygiene.rs
#MUTANT window-dropped|s@ --input window={{vars.duplicate_close_window}}",$@",@|the_committed_duplicate_close_check_honours_the_window_override
#MUTANT batten-bin-ignored|s@^  "{{vars.batten}} record derive duplicate-close@  "cargo run --quiet -p batten -- record derive duplicate-close@|the_committed_gates_record_then_check_the_one_row
description = "Gate: a duplicate close decided in the same operation as its target's close (reads get_issue payloads on stdin) — CLOUD-829"
dir = "{{cwd}}"
run = [
  "{{vars.batten}} record derive duplicate-close --input window={{vars.duplicate_close_window}}",
  "{{vars.batten}} check --rule 'issue state other'",
]

# THE NAME STAYS CALLABLE: `AGENTS.md` and the release workflow's summary tell a
# reader to run `mise run done-check`, and it keeps meaning the same gate — read
# the piped board, then decide over what was read.
[tasks.done-check]
description = "Gate: no issue sits Done while no release tag contains its commits (reads get_issue payloads on stdin)"
# CLOUD-843: the reading is `batten record derive done`, over this repository's
# release tags, its trunk and its Done column; the decision is the
# `tracker-hygiene` preset's `done-is-released` module.
dir = "{{cwd}}"
run = [
  "{{vars.batten}} record derive done --input 'released=v[0-9]*' --input landed=origin/main --input done=Done",
  "{{vars.batten}} check --rule 'issue state other'",
]

# CLOUD-323's gate. CLOUD-843 retired the bash reading into `batten record derive
# deferral`: the paragraph split, the code-span neutralisation and the claimed
# keys are the engine's, the two measured shapes are `[[pattern]] deferral-shape`,
# and the decision is the `tracker-hygiene` preset's `deferral-has-an-owner`.
[tasks.deferral-check]
description = "Gate: a PR body that defers a decision without naming the issue that owns it (reads the body on stdin; pointer-only)"
dir = "{{cwd}}"
run = [
  "{{vars.batten}} record derive deferral --input shape=deferral-shape --input base=origin/main",
  "{{vars.batten}} check --rule 'issue state other'",
]

# CLOUD-192's and CLOUD-674's gate. CLOUD-843 retired the bash reading into
# `batten record derive closing-key`: what the body names and closes is the
# engine grammar's, what the branch served is `claim keys`' refs-first source
# since `origin/main`, the marker is `[[pattern]] closing-hold-marker`, and the
# decision is the `tracker-hygiene` preset's `closing-key-closes`. An empty body
# is could-not-look.
[tasks.closing-key-check]
description = "Gate: a PR body that names its issue but never in closing form, so the merge will not move the board (reads the body on stdin; pointer-only)"
dir = "{{cwd}}"
run = [
  "{{vars.batten}} record derive closing-key --input hold=closing-hold-marker --input base=origin/main",
  "{{vars.batten}} check --rule 'issue state other'",
]

[tasks.record-verdicts]
description = "Effect: run each declared validator and record its exit code, then record the forge's answered verdicts for HEAD (CLOUD-1265)"
# THE THREE ARMS ARE VERBS NOW (CLOUD-843). Each validator is a `[[rule.tools]]`
# row whose `run` argv `batten record validate` runs, recording the exit code
# under the row's key; `policy/validator-verdict-clean.rego` decides what a code
# means. The `hk-plan` arm is gone: `policy/hook-profile.rego` reads hk's two
# plans off `[[rule.plan]]` rows the boundary acquires, so nothing records them.
#
# THE FORGE ARM reads HEAD's check-runs in process, keeps the latest ANSWERED
# conclusion per name — the set `checks green` reads, so a cancelled or skipped
# fan-in is not a grading (CLOUD-1965) — and writes nothing until the fan-in has
# answered, which is what keeps `forge-verdict-required` from refusing local
# `verify` and CI's own run.
#
# THE STEP RECEIPT IS THE VERB'S NOW (CLOUD-1891). The hk `pkl` and
# `renovate-config-validator` steps run the same `record validate` at `verify`
# before this task does, so over unchanged bytes the two validator arms here
# answer from the clean record instead of running the tools a second time; a
# non-zero answer is never held and is always asked again.
#
# THE FORGE ARM NEEDS A DECLARED CREDENTIAL, which the retired arm did not. That
# arm called `gh api`, so `gh auth login` was enough and a failed read skipped the
# record silently. `record forge --fetch` presents only a `[forge]
# credential_names` token (`BATTEN_GITHUB_TOKEN`, `GITHUB_PERSONAL_ACCESS_TOKEN`),
# and a forge it cannot read is could-not-look: exit 3, so this task — and the
# `verify` that runs it — fails on a checkout whose only credential is gh's own
# keyring, where it used to pass. Export one of those names to run `verify`.
run = [
  "cargo run --quiet -p batten -- record validate config-validator",
  "cargo run --quiet -p batten -- record validate renovate-config",
  "cargo run --quiet -p batten -- record forge HEAD --fetch --answered '{{env.CI_ANSWERED_CONCLUSIONS}}' --fanin '{{env.CI_FANIN_CHECK}}'",
]

# The perf producer and the perf gate (CLOUD-207, ported off
# `mise-tasks/perf-assert.sh` under CLOUD-1321).
#
# THE SPLIT IS THE SAME ONE `record-verdicts` HAS, and for the same forced reason:
# house style §5 makes `check` `read` and structurally incapable of spawning, so
# hyperfine stays a command on PATH and only the ADJUDICATION moved inside the
# engine. This task is the seam that split makes necessary.
#
# AN INLINE TASK RATHER THAN A `mise-tasks/` PROGRAM, and it is forced:
# `governed_at_head` selects any `mise-tasks/` path carrying a shebang or a
# `#MISE description=`, so a new program there is `shell add refused` — refused at
# `deny`, in the same change that is retiring one of them.
#
# A REDUCTION, NEVER THE REPORT (non-negotiable rule 4). One number per path
# reaches the record; hyperfine's own output stays on the terminal.
# CLOUD-207's measurement, ported onto `perf measure` under CLOUD-1753.
#
# THE TASK SURVIVES THE PROGRAM. `.github/workflows/perf.yml` names
# `mise run perf`, and mise auto-discovered that name from the file; deleting the
# file alone would retire the program and the NAME together, breaking a workflow
# this campaign has no business editing.
#
# A ONE-LINE WRAPPER, `tree-clean`'s shape and its reason:
# `inline-task-bodies-not-growing` ratchets the multi-line form, and a wrapper
# that needs one line must not spend a real body's budget.
[tasks."perf"]
description = "Measure batten's invocation cost on every path and print one byte-stable record per path"
run = "cargo run --quiet -p batten -- perf measure"

# CLOUD-172's series, ported onto `perf record` under CLOUD-1753. Same reason the
# task above is declared: `perf.yml` names it.
#
# THE SERIES IS APPENDED IN PROCESS. The retired program shelled to
# `git notes append`; `git::append_note` writes the blob, the tree and the commit
# through gix, so a notes ref is not a reason for the engine to hold a child
# process it otherwise does not need.
[tasks."perf-record"]
description = "Append a measurement to the trunk's invocation-cost series in git notes (reads `perf` records on stdin; refuses to run off main)"
run = "cargo run --quiet -p batten -- perf record"

# CLOUD-119's benchmark, ported onto `bench tokens` under CLOUD-1753. Declared
# rather than auto-discovered, for the reason `perf` above records: the name is
# what other callers use, and deleting the file would retire the program and the
# NAME together.
#
# `taplo` AND `jq` HAVE LEFT THIS PATH. The method and the workloads are
# deserialised into types, so a malformed method is a parse error naming the file
# rather than an empty shell variable that silently prices everything at zero.
[tasks."token-bench"]
description = "Measure the token economics of the Batten-wrapped path against the raw tool, from committed fixtures (CLOUD-119)"
run = "cargo run --quiet -p batten -- bench tokens"

# The gate over the published table: it reproduces, and every figure states its
# method. Both halves are the verb's, because deciding the first requires running
# the benchmark and the second reads the same bytes it already opens.
[tasks."token-bench-check"]
description = "Gate: the committed benchmark table is what a fresh run produces, and no figure in it lacks a method (CLOUD-119)"
run = "cargo run --quiet -p batten -- bench tokens --check"

[tasks.record-perf]
description = "Effect: reduce `perf` records to a p95 per path and record them where `batten check` reads them (reads `perf` records on stdin)"
# THE REDUCTION IS THE WRITER'S SINCE CLOUD-1991. `--pick path=p95` keeps every
# stdin line opening with `path=` and records `<path> <p95>` from it — the
# `awk` program this body ran in front of `record tool`, whose field names are
# now the caller's argument rather than a script. AN EMPTY REDUCTION STILL FAILS
# RATHER THAN RECORDING SILENCE: an empty record is a PRESENT record carrying no
# path, which the module reads as "this run judged less than it claims" — a true
# finding whose cause is this task. The verb refuses it as could-not-look (exit
# 3, where the body used 2) and writes nothing. stdin reaches the verb as it
# reached the body: `perf.yml` redirects the measurement into `mise run`.
run = "cargo run --quiet -p batten -- record tool perf-p95 --pick path=p95"

# The gate the producer above feeds, and the same wrapper shape `lock-complete`
# takes: the task name and the rule id are one object, so the workflow step, this
# task and `batten.toml`'s row cannot drift apart.
#
# `--rule` SELECTS ONE ROW. A bare `batten check` under a name that promises the
# latency gate would report every other tree rule through it.
[tasks.perf-assert]
description = "Gate: every measured invocation path is inside its latency budget, and README publishes the budget this gate enforces"
run = "cargo run --quiet -p batten -- check --rule 'path measure wrong'"

# `[tasks.msrv]` IS RETIRED (CLOUD-593), replaced by
# `mise-tasks/msrv-pin-agreement.sh`.
#
# It compiled the whole workspace a second time, at a second toolchain, to
# answer "do the floor and the pin disagree?" — ~32-50s per PR plus a rustup
# fetch. That was the right shape while the two numbers were deliberately
# INDEPENDENT: a floor below the pin is a claim about a compiler nothing here
# runs, and only running it verifies such a claim.
#
# CLOUD-593 removed the independence. The floor is now a derived copy of the
# pin, so the predicate is a text equality and the second compile buys nothing
# it does not. Note what the old gate could never catch: it was green for the
# entire twelve releases the pin sat stale, because the two numbers agreed —
# agreeing on a stale number is exactly what it was built to confirm.

[tasks.deny]
description = "cargo-deny: licenses, advisories, sources"
# Receipt-gated (CLOUD-424) on the dependency set and cargo-deny's own version.
# The advisory DB is a property of the world, and worlds change on a clock, not
# on this branch: CI still runs the full check on every PR, which is the same
# split lock-currency already made.
run = "cargo run --quiet -p batten -- step run deny -- cargo deny check"

[tasks."build:release"]
description = "Build the release binary the hook registrations execute"
# THE DISK PRECONDITION EVERY OTHER BUILD ALREADY HAS (CLOUD-1329). Measured
# 2026-09-02: the session's first `install:local` died inside `cargo build
# --release` on `ENOSPC` with 0MB free, over a `target/debug` a previous session
# had left at ~24GB. `target-prune` exists for exactly that input — its own
# header says it "runs when the disk is SHORT" — and `verify` and every `land`
# lap call it. This entry point, which runs before any of them, did not. The
# failure surfaced as a cargo IO error naming neither the disk nor the floor.
#
# A `depends` RATHER THAN A GUARDED CALL IN THE BODY, and §5 is the reason: the
# refusal a reader should see is `target-prune`'s own pointer-only line, naming
# free space and the floor. A body guard would print a second message over the
# first — a second authority for a verdict the prune already rendered. `depends`
# runs it before the body and propagates its exit verbatim, which is the whole
# of what the row asks. `install:local` resolves it transitively, so it gains
# the precondition without naming it.
#
# NO CYCLE: `target-prune` declares no `depends` of its own, which
# `the_reclaim_itself_stays_dependency_free_and_the_surfaces_are_not_empty` in
# `crates/batten/tests/it/session_provisioning.rs` asserts rather than assumes.
#
# WHETHER IT NEEDS A BUILD depends on whether `batten` is installed, and this
# paragraph once said otherwise. It claimed the reclaim "needs no build in order
# to run" and called that checked; `target-prune`'s own header says the fallback
# is "for a clone that has not been provisioned", and that fallback was `cargo
# run` — a build. So on an unprovisioned clone with a short disk, the precondition
# this task depends on compiled the engine first and died on `ENOSPC`. CLOUD-1838
# closed that: with `batten` installed the reclaim runs build-free; with it absent,
# a disk below the cold-build floor is refused WITHOUT a build, and only a disk
# with room for one pays for it. The claim is now true because the code changed,
# not because the sentence did.
#
# IT DOES NOT REACH INSIDE `verify`'S LAP, which is the pairing that would break
# if it did: this task's callers are `install:local` and the two benches, while
# `verify`, `verify:gated` and `land` reach the engine through `cargo run -p
# batten` directly. So the two prune calls that bracket a lap keep their order.
#
# WHAT IT DOES COST, stated so a reviewer need not derive it. `prune::Phase` is
# DERIVED from the lap journal rather than declared — a run that finds an open
# lap closes it — so a build outside a `verify` toggles a boundary `verify`
# would otherwise have owned. It cannot corrupt the floor, which is a high-water
# mark and only ratchets up, so a short spurious lap records a smaller number
# and changes nothing. What it can produce is one `lap-close` whose consumption
# figure describes no real lap. CLOUD-1218 is the adjacent row on journal
# poisoning if that ever proves to matter.
depends = ["target-prune"]
# The one place the hook's binary is produced, so `install:local`,
# `session-start.sh` and `mise-tasks/perf.sh` name a task rather than three copies
# of a cargo line that could drift in their flags.
#
# Release, not debug, and not `cargo run`: this runs on EVERY mediated tool call.
# `cargo run` re-walks the build graph per invocation and contends for the
# target-dir lock `hk.pkl` deliberately serialises — fine for a gate that judges
# the working tree, disqualifying on the hottest path in the binary. The gates
# keep `cargo run` for exactly the reason stated at `batten-check` below.
run = "cargo build --quiet --release -p batten"

[tasks.acquisition-bench]
description = "Measure tree-surface acquisition cost as declared-document count scales, with its own null (CLOUD-935)"
# CLOUD-935. `rules/rust.md`'s concurrency table carries one row whose
# verdict is conditional and unmet — tree-surface fact ACQUISITION "stays serial
# until a number says otherwise" — and names the condition: bring a number about
# RESOLUTION rather than projection. This is the harness that brings it.
#
# THE MEASUREMENT IS `batten perf acquire`, AND IT USED TO BE PYTHON (CLOUD-1229).
# This comment used to argue that `bench/acquisition/sweep.py` was forced: an
# authored shell rule cannot be ADDED (`shell add refused`, one `document` route,
# no override, no `bypass_env`), so the measurement went to the one language the
# retirement campaign does not watch. That reading was wrong in a way this line
# then propagated — a second author read it, followed the precedent for the
# identical stated reason, and added a third helper (CLOUD-1208). The campaign's
# subject is authored SHELL because that is what it was built to retire; that is a
# statement about its reach, never a licence for what sits beside it.
#
# So the sweep moved into `crates/batten/src/perf.rs`, which is where the paired
# measurement already lives and is the module `policy/spawn-adapters.rego` already
# places for exactly this class — a harness whose whole subject is what an
# EXTERNAL process costs, so the spawns are the thing rather than an
# implementation of it. It also takes the unpinned interpreter with it: `python`
# was never in `[tools]`, so every helper ran under whatever the host happened to
# have while `lock-complete` held every declared tool to three platforms.
#
# AN EXAMPLE TARGET RATHER THAN A VERB, and that is a refusal honoured rather than
# a preference. It was written as `perf acquire` first;
# `crates/batten/tests/pointer_only.rs` sweeps EVERY leaf verb over a bare fixture
# corpus and refuses one that exits 3, because "it failed internally, so what it
# did not emit proves nothing" — and a sweep with no benchmark runner and no built
# binary to time has could-not-look as its only honest answer there. `perf pair`
# survives that sweep because it has a real SKIP predicate; there is no analogue
# here, and inventing one to satisfy a census is the false green these gates exist
# to catch. `crates/batten/examples/acquisition-bench.rs` is the entry point, it
# spawns nothing, and `--all-targets` holds it to the same clippy bar as the rest.
#
# THE TASK BODY STAYS INLINE AND STAYS ONE LINE, which is the half of the old
# argument that survives: `inline-task-bodies-not-growing` holds the count of
# multi-line task bodies non-increasing, so the alternative was never a bigger
# body here.
#
# AND THIS COMMENT DELIBERATELY DOES NOT SPELL THAT ROW'S PATTERN. An earlier
# revision quoted the literal opener the ratchet counts, and the ratchet counted
# the comment — 31 to 32, refused, over a change that added no body at all. It is
# a substring pass, so a token inside a comment is a hit, which is the class
# `rules/scanning.md` records from CLOUD-843's two disagreeing passes.
# Describe the row here; do not write its needle.
#
# BENCH_METRIC IS THE LOAD-BEARING LINE. `mise-tasks/perf-record.sh` reads it from
# the environment and stamps it into every series entry, defaulting to
# `wall-clock` — the invocation series. Acquisition is a different axis measured
# over a generated fixture family, so a shared stamp would let a later reader diff
# the two and read a step change that never happened. That is the hazard
# `rules/rust.md` records for a future instruction-count series, and
# `crates/batten/tests/acquisition_metric.rs` asserts this line rather than
# trusting it. It is the task's `env` table rather than a `VAR=` prefix on the
# command since CLOUD-1991: the prefix made the body a shell line, and a task's
# own `env` reaches the example's process exactly as the prefix did.
#
# OFF THE LANDING PATH, like `perf` itself: it builds a release binary and spends
# minutes in hyperfine, and it answers a question about a measurement rather than
# about a commit. Nothing in `verify` or the hk gate calls it.
# `build:release` stays a dependency even though `cargo run --example` builds the
# example itself: what the sweep TIMES is the release `batten` binary, and an
# example target does not build it. Dropping this line makes every arm answer
# could-not-look on a clean tree.
depends = ["build:release"]
env = { BENCH_METRIC = "acquisition-wall-clock" }
run = "cargo run --quiet --release -p batten --example acquisition-bench"

[tasks.address-transport-bench]
description = "Price inline versus addressed transport over a payload corpus, writing bench/address-transport/RESULTS.md (CLOUD-1367)"
# CLOUD-1367. Extends the shape `acquisition-bench` above already takes rather
# than standing up a parallel harness, which is that row's first acceptance
# clause: an example target, a one-line body, `build:release` as the dependency,
# and its own `BENCH_METRIC` stamp.
#
# AN EXAMPLE TARGET RATHER THAN A VERB, for the reason recorded at
# `acquisition-bench`: `crates/batten/tests/pointer_only.rs` sweeps every leaf
# verb over a bare fixture corpus and refuses one that exits 3, and a bench with
# no corpus to price has could-not-look as its only honest answer there.
#
# ITS OWN METRIC STAMP, for the reason `.claude/rules/rust.md` records for the
# acquisition series: this measures emitted CHARACTERS over a payload corpus,
# where `wall-clock` measures invocation latency and `acquisition-wall-clock`
# measures document reads. Three axes sharing a stamp would let a reader diff
# them and see a step change that never happened.
#
# A REPORT, NEVER A GATE, and off the landing path like `perf` itself. Nothing in
# `verify` or the hk gate calls it, because it answers a question about a
# measurement rather than about a commit — the split
# `.claude/rules/toolchain.md` draws between a gate and a schedule.
depends = ["build:release"]
env = { BENCH_METRIC = "address-transport-characters" }
run = "cargo run --quiet --release -p batten --example address-transport-bench"

[tasks.config-load-bench]
description = "Price `config::load` over the committed batten.toml, with its own null (CLOUD-1291)"
# CLOUD-1291. The harness re-reads and re-parses this repository's 354 KB
# `batten.toml` on every fixture command — 761 static call sites, none memoized —
# and nothing had priced it. The row's own first estimate was refuted: it took the
# cost through `batten config show`, which measures the same to within noise from a
# directory with no config at all, so a 29 ms verb cannot resolve a call that may
# be a millisecond. This times the function.
#
# NO `--release`, WHICH IS THE ONE DELIBERATE DEPARTURE from `acquisition-bench`
# above. That arm times the SHIPPED binary, so release is what it is about. This
# one is about what the TEST SUITE pays, and the suite runs under `dev` — where
# workspace code is unoptimised and the dependency closure is `opt-level = 2`
# (CLOUD-1211). Measuring release here would answer a question nobody asked and
# would flatter the number in the direction that argues for the change.
#
# No `build:release` dependency for the same reason, and a stronger one: this
# target spawns nothing and times no binary, so there is nothing for it to build.
#
# BENCH_METRIC IS THE LOAD-BEARING LINE, for the reason recorded at
# `acquisition-bench`: `perf-record` stamps the series from it and defaults to the
# INVOCATION series' `wall-clock`. This is a third axis — a per-call in-process
# figure — so it takes a third stamp, and `crates/batten/tests/acquisition_metric.rs`
# asserts every bench task carries one and that no two of them collide.
env = { BENCH_METRIC = "config-load-wall-clock" }
run = "cargo run --quiet -p batten --example config-load-bench"

[tasks.refusal-render-bench]
description = "Price refusal rendering by strategy and explicit residency, writing bench/refusal-render/RESULTS.md (CLOUD-1606)"
# CLOUD-1606. Extends the shape `address-transport-bench` above already takes —
# an example target, a one-line body, its own `BENCH_METRIC` stamp, a report
# never a gate — rather than standing up a parallel harness.
#
# NO `--release` AND NO `build:release`, which is `config-load-bench`'s departure
# above and for its stronger half of the reason: this target spawns nothing and
# times nothing. Its subject is `hook::deny_text`, one pure call in this process,
# and what it reports is which BYTES come out — a figure optimisation cannot
# move. A release build here would buy a slower task and an identical table.
#
# ITS OWN METRIC STAMP, and the axis is genuinely new: `wall-clock`,
# `acquisition-wall-clock` and `config-load-wall-clock` all measure TIME, and
# `address-transport-characters` measures emitted characters over a payload
# corpus. This measures emitted characters over a REFUSAL corpus. Sharing a stamp
# with any of them would let a reader diff two axes and see a step change that
# never happened.
#
# A REPORT, NEVER A GATE, and off the landing path like `perf` itself. The drift
# check is the tier's rather than this task's: `crates/batten/tests/it/refusal_render_bench.rs`
# re-renders the six records in-process and diffs them against the committed
# file, so the report cannot go stale without `test:cargo` reddening.
env = { BENCH_METRIC = "refusal-render-characters" }
run = "cargo run --quiet -p batten --example refusal-render-bench"

[tasks."doctor:mediator"]
description = "Report whether the engine adjudicating this tree was built from it"
# CLOUD-1650's handler spawns this rather than the verb directly. `doctor`'s own
# `hook-handlers` check resolves every declared handler program, and `batten` is
# absent from a CI runner's `PATH` — it is built there, not installed — so a row
# naming it made `batten doctor` exit 1 on every such checkout. `mise` is present
# wherever the gates run, and what the task spawns is its own business.
#
# The body is the engine verb and nothing else: a `mise-tasks/*.sh` program would
# grow the bash surface two gates are shrinking.
run = "batten doctor mediator"

[tasks."doctor:egress"]
description = "Report whether this container can reach what the work needs, before the session starts on it"
# `session-container-preflight` spawns this rather than the verb, for
# `doctor:mediator`'s reason directly above: `batten` is absent from a CI
# runner's `PATH`, so a handler naming it failed `doctor`'s `hook-handlers`
# check on every runner. The body is the engine verb and nothing else.
run = "batten doctor egress"

[tasks."install:local"]
description = "Put the built binary where the hook registrations resolve it — `install.sh`'s own destination"
depends = ["build:release"]
# CLOUD-824. This is the half of `.claude/hooks/batten-hook.sh` that was never a
# hook concern: the launcher carried a four-candidate search (`BATTEN_BIN`,
# `target/release`, `target/debug`, PATH) because "there is no `batten` on PATH
# here and nothing puts `target/release` on it." That is an INSTALL concern
# wearing a hook's clothes, and the other four harnesses never had it — they
# invoke `batten hook --harness <h>` directly and always did.
#
# So the launcher's search is replaced by putting the binary where a search would
# have ended. The destination is `install.sh:224`'s, character for character, so
# a developer clone and a released install resolve the same name from the same
# place rather than through two different rules.
#
# THE NO-BINARY CASE STILL REACHES A HUMAN, and through a louder channel than the
# one it replaces. The launcher failed open with a stderr line and a
# once-per-session `$TMPDIR` marker, which is the quietest report this repository
# produces; this step runs inside `session-start.sh`'s `step`, which emits
# `::error::`, a log pointer, and a non-zero exit. At hook time, a `batten` that
# is not there is a command the host cannot run, which every supported host
# reports through its own channel.
# AN ARGV SEQUENCE, NOT A SHELL BODY (CLOUD-1991). The `set -eu` the body opted
# into is what mise does to an array — the install does not run when the
# directory could not be made — and the destination's fallback chain, which was
# `${BATTEN_INSTALL_DIR:-${XDG_BIN_HOME:-$HOME/.local/bin}}`, is the template's
# `if`/`elif`, where an empty variable is as unset as it was to `:-`.
run = [
  "mkdir -p {% if env.BATTEN_INSTALL_DIR %}{{env.BATTEN_INSTALL_DIR}}{% elif env.XDG_BIN_HOME %}{{env.XDG_BIN_HOME}}{% else %}{{env.HOME}}/.local/bin{% endif %}",
  "install -m 0755 target/release/batten {% if env.BATTEN_INSTALL_DIR %}{{env.BATTEN_INSTALL_DIR}}{% elif env.XDG_BIN_HOME %}{{env.XDG_BIN_HOME}}{% else %}{{env.HOME}}/.local/bin{% endif %}/batten",
]

# The provisioning seam the environment's setup script ALREADY CALLS, and which
# this repository never defined (CLOUD-1085).
#
# THE CALL SITE IS NOT OURS AND IT IS NOT NEW. The container's setup script runs
# `mise run deps-install` on every provision, before any session starts, and
# soft-fails with a stderr line when the task is absent — which is what it did for
# the whole life of this defect. So the bootstrap seam was never missing; it was a
# DANGLING CALL, and defining the task is the entire fix. Nothing outside this
# repository changes, which is exactly what §1 asks for: the change is in the
# environment configuration that provisions a container, and that configuration
# already makes the call.
#
# `install.sh`, NEVER `install:local`, and the distinction is this row's own.
# The local task builds the WORKING TREE's binary — "a dev-clone convenience that
# supersedes a release build, not a provisioning path". A provisioning path cannot
# assume a Rust toolchain, a 141-second compile (measured, CLOUD-1085), or that the
# checkout builds at all. One install interface (§1); this is the caller it lacked.
#
# WHY ROUTING THROUGH `mise run` IS LOAD-BEARING rather than incidental. The agent
# proxy answers 403 for third-party release repos, so `mise` needs the GitHub API
# and asset hosts prepended to NO_PROXY and MISE_GITHUB_TOKEN set from the session
# PAT — in its OWN process, which `[env]` below cannot reach. A task body inherits
# that environment, so the release API is reachable here and would NOT be from a
# bare `./install.sh` in the setup script. The seam and the proxy fix are the same
# mechanism.
#
# WHAT SUPPLIES IT CHANGED, AND THIS COMMENT NAMED THE DEAD ONE (CLOUD-1455). It
# used to read "the setup script shadows `mise` with a wrapper", which was true of
# the ~120-line provisioning script and false the moment that became a one-line
# `curl … install.sh | sh && batten startup --repair`. Nothing replaced the
# wrapper, so every third-party pinned tool 403'd in a fresh container while this
# comment still explained why they would not. The `[[provision.env]]` rows on
# `batten.toml`'s mise entry are what supplies it now, through a launcher
# `provision apply` writes onto PATH.
#
# LOUD ON FAILURE, because the defect this closes is a SILENT absence: an absent
# reference monitor and a passing one are indistinguishable from outside, and every
# mediated call in a session without a binary fails open with nothing said. The
# caller appends its own line; this supplies the `::error::` and the non-zero exit
# that make it a report rather than a shrug — CLOUD-824's posture of moving the
# missing-binary report to provisioning time, where it can still be fixed.
#
# `2` STAYS DISTINCT FROM `1` (house style §7). `install.sh` answers 1 for a refusal
# it decided — a bad digest, an unwritable destination — and 2 for could-not-look:
# no curl, or an unreachable release API. Collapsing them sends a reader with a
# network problem hunting a corrupted asset.
#
# A ONE-LINE SHIM, NOT AN INLINE BODY, and the ratchet is what corrected the first
# draft rather than merely refusing it. `inline-task-bodies-not-growing` counts
# triple-quoted `run` bodies in this file and is `non_increasing`; the first
# version of this task was a nine-line body and took the count 31 -> 33.
#
# THIS COMMENT MAY NOT QUOTE THE PATTERN IT DESCRIBES. The row matches a literal
# substring with no anchoring and no `regex` column (CLOUD-1058), so it reads
# prose as readily as code -- spelling the pattern out here incremented the count
# by one all over again, with no task added. Name the shape in words instead.
#
# The right reading of that refusal is not "waive it". `install.sh` already emits
# the diagnosis — it names the destination, whether the digest verified, and why it
# refused — and it already answers `0/1/2` on the house-style table. The body that
# was here caught that status only to re-word it, which is a verdict REPLACED
# rather than propagated (CLOUD-1090's shape, one file over). Deleting it keeps
# `install.sh`'s own words and its own exit code, and the ratchet's block records
# that a one-line `run = "…"` shim is the campaign succeeding rather than a hole.
#
# The consequence the deleted body narrated belongs here, where it costs nothing:
# when this task fails, `batten` does not resolve by name, and until one does every
# mediated call fails open in silence. The caller already appends its own line, and
# mise prints the non-zero exit.
[tasks."deps-install"]
description = "Provision the host dependencies mise does not: the released `batten`, before any hook fires (CLOUD-1085), and reclaim the wiring the launcher rewrote"
# THE REAP BELONGS HERE AND NOWHERE EARLIER, which is CLOUD-1079's open half.
#
# `[[hook.handler]] session-wiring-reclaim` already runs this verb at session
# start, and it loses a race it cannot win from there: the launcher rewrites
# `~/.claude/launcher-settings.json` and its two scripts on container BOOT, and a
# boot does not reliably fire `SessionStart`. Measured 2026-09-05 -- the settings
# file and both scripts stamped 21:16:24, `~/.claude` itself 21:17:23, and
# `wiring reclaim --check` reporting two live sibling registrations in a session
# whose start handler had already run. That is the second recorded recurrence;
# the first was a session that ran the verb by hand, watched the launcher
# provision over it, and concluded permanent impossibility.
#
# This task is the seam that beats it, on a property rather than a hope: the
# container's setup script calls `mise run deps-install` on every provision,
# BEFORE Claude launches. So it is upstream of the rewrite and upstream of the
# harness snapshot, where every hook-event surface is downstream of both.
#
# AND IT IS NOT WHAT `batten.toml` FORBIDS. That refusal -- "NEVER add `batten
# wiring reclaim` to this handler" -- is scoped to the session-start handler, and
# its reason does not carry: `batten hook` expires the at-load record on that
# same event, so a reclaim dispatched from there puts the write and the clear in
# one unordered batch. Nothing dispatches a hook event during provisioning, so
# there is no record to race.
#
# NOT IN `install.sh`, which is the repo-agnostic install interface a consumer
# with no launcher also runs (non-negotiable rule 1). The reap is this
# consumer's, so it lives in this consumer's task.
#
# `-y` because a provisioning script has no terminal; after `install.sh` because
# the verb is the binary that script installs.
#
# AN ARGV PAIR, NOT A SHELL LINE (CLOUD-1991): the reap must not run when the
# install failed, which is the whole of what `set -e` and then `&&` bought here —
# and what mise does to an array: the entries run in order and the first failure
# ends the task with its own exit code, so `install.sh`'s `1`/`2` still reach the
# caller unreworded.
run = ["./install.sh", "batten wiring reclaim -y"]

# The report half of the same seam, and the setup script calls this one too.
#
# A REPORT, NOT A GATE: the caller discards the status (`mise run deps || true`),
# so this exists to put the answer in the provisioning log where a human reads it,
# rather than leaving the absence to surface as an unrelated failure at first use.
# Same reason the setup script ends with `mise ls --current`.
#
# `command -v` FIRST, because it is the whole question. "A batten exists" and "the
# batten the hook registrations resolve" are different claims —
# `.claude/settings.json` registers `batten hook` by BARE NAME on every event — so
# the path PATH actually finds is the answer, and printing it is the report. It
# also supplies the failure for free: `command -v` exits non-zero when the name
# does not resolve, and an argv sequence stops there without a branch to write —
# the `&&` it was until CLOUD-1991, with no shell line to carry it.
[tasks.deps]
description = "Report the host dependencies `deps-install` provisions, so an absent one is visible in the setup log and not at first use"
run = ["command -v batten", "batten --version"]

# The memory graph's edges, retired onto the policy engine (CLOUD-1163).
#
# A WRAPPER SO THE CALLER NEVER MOVED. `hk.pkl`'s `check` hook runs
# `mise run memories-check` and still does; what changed is what this name
# resolves to. The hook keeps its glob and its step, which is the repoint the
# retirement campaign gets for free -- `hk.pkl` and `mise.toml` are ungoverned.
#
# `--rule` SELECTS ONE ROW, which is what makes this a faithful replacement
# rather than a wider gate: the predecessor decided the memory graph and nothing
# else, and a bare `batten check` here would report every other tree rule through
# a name that promises one.
[tasks.memories-check]
description = "Gate: every mem: reference in tracked markdown resolves to a real memory, and every memory is addressable by its name (CLOUD-183)"
# `cargo run` RATHER THAN THE INSTALLED BINARY, on `batten-check`'s precedent
# and `policy-budget`'s (also a fast-tier step): the gate must judge the tree it
# is committing, not whatever binary happens to be on PATH. Measured while
# landing CLOUD-1150 -- a rebase brought `main`'s new `[[mcp.source]]` section
# under the branch, the installed binary predated it, and BOTH wrappers refused
# with a config parse error that named a section neither gate reads. Nothing in
# CI installs `batten` either, so the bare form had never been CI-verified.
run = "cargo run --quiet -p batten -- check --rule 'memory point missing'"

# CLOUD-843 / CLOUD-1150, and the same wrapper shape one member over: `hk.pkl`'s
# `rules-drift` step runs `mise run rules-drift` and still does, so the caller
# never moved and the retirement's only edit to a sibling is the one
# `only_drops_a_retired_reference` admits.
#
# `--rule` SELECTS ONE ROW, for the reason above it: the predecessor decided
# restated values and nothing else, and a bare `batten check` under a name that
# promises one gate would report every other tree rule through it.
#
# THE STEP NAME AND THE RULE ID ARE NOW ONE OBJECT, which is what retires the
# predecessor suite's own wiring assertion (`grep -c 'mise run rules-drift'` over
# `hk.pkl`) rather than dropping it: that case held a task name and a gate
# together across two files, and there is one name here.
[tasks.rules-drift]
description = "Gate: a value `.claude/rules/*.md` restates still agrees with the mechanism that owns it (CLOUD-506)"
run = "cargo run --quiet -p batten -- check --rule 'rule watch other'"
# ---------------------------------------------------------------------------
# The session-start provisioning steps, one task each (CLOUD-312 row 10).
#
# THESE ARE THE BODY OF `.claude/hooks/session-start.sh`, WHICH THIS CHANGE
# DELETES. That script was 295 lines of bash registered by path on SessionStart,
# and it did three separable things: it ORDERED a list of steps, it BOUNDED
# nothing, and it wrapped each step in a `step` helper that logged to a file and
# tailed five lines to stderr on failure. Two of those three now belong to
# `[[hook.handler]]` — the order is the declaration order of the rows in
# `batten.toml`, and the bound is `timeout_ms`, imposed by the parent. What the
# door does NOT provide is the third, so it is what stayed, once per step.
#
# WHY A TASK PER STEP RATHER THAN ONE TASK RUNNING THEM ALL. One task would be
# the same bash one layer down, invisible to the committed authority: a reader of
# `batten.toml` would see one row and could not tell what runs, in what order, or
# what happens when the fourth thing fails. It would also share one bound across
# steps whose costs differ by two orders of magnitude. The row-per-step shape is
# what makes `batten doctor hooks` and `batten config show` able to answer
# "what does this repository do at session start" from the committed file.
#
# WHY THE REDIRECT IS HERE AND NOT IN THE HANDLER ROW. `handler.rs`'s contract
# reads stdout on a passing exit as ADVISORY TEXT that joins the reply the host
# sees. Several of these steps print on success — `install:local` echoes its
# destination — so registered raw they would put a line in every session's
# advisory saying nothing went wrong, which is exactly the announcement CLOUD-891
# removed from this hook. `step` solved that by sending both streams to a log,
# and these tasks solve it the same way: silence on the normal path, and on
# failure the `::error::` line, the log pointer and the last five lines on
# STDERR, which is where the door's contract puts a reason.
#
# The `|| { …; exit 1; }` is not belt-and-braces: a body declaring no `shell =`
# runs under `sh -e`, so a bare failing call would abort the task before its own
# report could run. That is measured — it cost a debugging cycle in #798 — and
# the three corrected comments in `[tasks."test:bats"]` are the same fact said
# where the next author reads it.

[tasks."session:install"]
description = "Session start: provision the mise toolchain, purely — the step whose absence was CLOUD-196"
# The load-bearing one. `.mcp.json` launches Serena with `mise exec --`, and
# `mise exec` INSTALLS a missing tool on demand: on a cold container that install
# ran inside the MCP client's startup window, measured 24s for `pipx:serena-agent`,
# the handshake did not complete, and MCP servers are not retried mid-session.
# This is what makes that `exec` a pure exec.
#
# `MISE_LOCKFILE=false` makes it a PURE install (CLOUD-223). A cold install of
# `ubi:rust-cross/cargo-zigbuild` otherwise appends a platform key `mise lock`
# cannot produce, which `lock-complete` rejects by name — so every session opened
# with a dirty tree and a red gate no branch had caused. `[settings] lockfile =
# false` is the authority; this is the belt to that suspenders, and it keeps the
# install pure even under an ambient `MISE_LOCKFILE`.
#
# THE `||` ARM CANNOT FIRE ON A ZERO, WHICH IS WHAT THE INSTALLER RETURNS WHEN IT
# FAILS (CLOUD-1683). Measured three times in one container: the install wrote
# `mise ERROR` as its last line and exited **0**, twice on a credential failure
# the fetch could not recover from. Provisioning reported success, the toolchain
# was absent, and `mise run verify` then returned 0 without running a gate — a
# branch with no claim receipt reported green.
#
# So the guard below is no longer the only one. It is KEPT rather than replaced —
# it is still the right answer for a genuine non-zero — and `toolchain-check`
# follows it to decide the question the exit status could not: is every tool the
# manifest declares actually installed. That catches the lying zero AND the
# install that fails silently, writing no error at all, because it reads the
# outcome rather than the report.
# QUIET BY DECLARATION, NOT BY A LOG REDIRECT (CLOUD-1991). The shell wrapper
# sent both streams to a `/tmp` log, and on failure printed an `::error::` line
# and the log's last five lines. `silent = "stdout"` is the half the handler
# contract needs — a passing step's stdout would become session advice, which
# CLOUD-891 removed — and `quiet` drops mise's own command echo. On a failure the
# step's stderr IS the reason the door forwards, and its exit code is the step's
# own rather than a flattened `1`.
quiet = true
silent = "stdout"
env = { MISE_LOCKFILE = "false" }
run = ["mise install", "mise run toolchain-check"]

[tasks."toolchain-check"]
description = "Gate: every tool [tools] declares is actually installed — the question doctor.sh structurally cannot ask"
# `mise-tasks/doctor.sh` looks for broken bin SYMLINKS under the installs dir,
# which is a question about RESIDUE. A tool declared and never fetched leaves no
# symlink at all and passes it — which is exactly the state a failed install
# leaves, and the state that made CLOUD-1683's false green possible. This asks
# the complementary question, over the DECLARATION.
#
# THE RUNNER ANSWERS IT ITSELF SINCE CLOUD-1991, and that retired the pipe.
# `mise install --dry-run-code` resolves every tool the configuration declares,
# installs nothing, and exits 1 when any of them would still need installing —
# the question `batten doctor toolchain` answered over `mise ls --json` piped in.
# The pipe was the whole of the shell: a read verb may not spawn the runner
# (CLOUD-170), so the caller fetched and handed the probe over, and the body
# carried an installed-binary-first fallback so a session step never compiled
# the engine (`no_session_start_step_compiles_the_engine`). Asking the runner
# directly needs neither, so both callers — `session:install` and `verify` — get
# the same answer with no engine on the path at all.
#
# WHAT CHANGED, stated rather than implied: the runner's question covers every
# configuration file in scope, where the verb read this manifest's `[tools]`
# table alone, so a tool declared elsewhere and not installed now refuses too.
# Nothing the verb refused passes. Replayed on this tree (both answer "all
# installed") and on a manifest declaring an uninstalled pin (both refuse at 1).
# `batten doctor toolchain` stays a verb for any consumer that holds a probe.
run = "mise install --dry-run-code"

[tasks."session:submodules"]
description = "Session start: check out the vendored submodules — bats lives in tests/bats"
# QUIET BY DECLARATION, NOT BY A LOG REDIRECT (CLOUD-1991). The shell wrapper
# sent both streams to a `/tmp` log, and on failure printed an `::error::` line
# and the log's last five lines. `silent = "stdout"` is the half the handler
# contract needs — a passing step's stdout would become session advice, which
# CLOUD-891 removed — and `quiet` drops mise's own command echo. On a failure the
# step's stderr IS the reason the door forwards, and its exit code is the step's
# own rather than a flattened `1`.
quiet = true
silent = "stdout"
run = "git submodule update --init --recursive"

[tasks."session:doctor"]
description = "Session start: provision what mise does not own — the rustup cross targets above all (CLOUD-218)"
# AFTER `session:install` AND BEFORE THE PREFLIGHT, and both halves of that
# ordering are load-bearing. Doctor's rustup half needs the mise-provisioned
# toolchain, so it cannot go first; and left outside the provisioning window it
# runs for the first time inside the first `mise run verify`, concurrently with
# whatever else the sandbox is still laying down. Measured on a cold container
# 2026-08-07: that first verify died in doctor with `detected conflict` on
# `rust-std-aarch64-apple-darwin`, and a second doctor, nothing changed but time,
# exited 0. The message names cross-compilation, so it costs the reader a
# debugging session on a machine where nothing is broken.
#
# This is not a retry: it does not make the race survivable, it empties the
# window the race needs.
# QUIET BY DECLARATION, NOT BY A LOG REDIRECT (CLOUD-1991). The shell wrapper
# sent both streams to a `/tmp` log, and on failure printed an `::error::` line
# and the log's last five lines. `silent = "stdout"` is the half the handler
# contract needs — a passing step's stdout would become session advice, which
# CLOUD-891 removed — and `quiet` drops mise's own command echo. On a failure the
# step's stderr IS the reason the door forwards, and its exit code is the step's
# own rather than a flattened `1`.
quiet = true
silent = "stdout"
run = "mise run provision:startup"

[tasks."session:batten"]
description = "Session start: install the latest RELEASE over whatever `deps-install` provisioned — a verified download, never a compile"
# THE RELEASED BINARY IS ALREADY ON PATH BY THE TIME THIS RUNS, and that is what
# makes this row possible at all. `deps-install` puts it there at provisioning
# (CLOUD-1085, #798) — before Claude launches, so before any hook fires — which
# is what dispatches the handler this task is registered as.
#
# THIS STEP USED TO SPELL `install:local`, AND THAT WAS A COMPILE ON THE ONE PATH
# THAT MAY NOT HAVE ONE (CLOUD-1620). The premise was that consumer #1 must judge
# the engine it ships rather than the last release, which is true and is not a
# reason to build HERE. Measured 2026-09-08 on a container already warm for
# tools: this step took 224.87s, and the binary it produced was 0.0.151 — byte
# for byte the release `deps-install` had already fetched. A session paid a
# four-minute compile to arrive where it started.
#
# THE INVERSION IS THE ROW'S OWN, and this file already argued it two thousand
# lines up. `deps-install`'s comment reads "`install.sh`, NEVER `install:local` …
# A provisioning path cannot assume a Rust toolchain, a 141-second compile, or
# that the checkout builds at all" — and `install-does-one-thing` in batten.toml
# ENFORCES it, banning `cargo` from `install.sh` outright. This task was the one
# caller routing around a rule the repository had already committed to.
#
# SKEW IS NOW DETECTED, NOT PRE-EMPTED. The risk the compile hedged against is
# real — CLOUD-1326 measured an installed batten older than a config key
# disarming every mediated gate in silence — but an unconditional build is the
# wrong instrument for it, because it spends four minutes on every session to
# insure against a skew most sessions do not have. `batten doctor mediator`
# (CLOUD-1630) is the detector, and it answers `mediator-build-behind-source` on
# exactly the branches that need a build.
#
# SO COMPILING IS OPT-IN, AND THE BAR IS STATED: you are changing
# `crates/batten/**` and need the tree's engine to mediate your own calls.
# `mise run install:local` is that route, and `verify` and `batten-check` already
# build on that path anyway — so the case needs no session-start step to serve it.
#
# `./install.sh` AND NOT `mise run deps-install`, WHICH IS THE OBVIOUS SPELLING
# AND IS WRONG HERE. That task is `./install.sh && batten wiring reclaim -y`, and
# the reclaim half is ALREADY a session-start handler: `session-wiring`, row 9,
# placed after this one precisely so it observes repaired wiring rather than the
# launcher's. Routing through it would fire the reclaim twice in one batch, and
# `batten hook` expires the at-load record on this same event — so a second
# reclaim here is the unordered write-and-clear that row warns about, for work
# row 9 has already done.
#
# The proxy seam survives the narrowing, which is the thing worth checking before
# calling the installer by path: `deps-install`'s own header records that a bare
# `./install.sh` is unreachable FROM THE SETUP SCRIPT, because the release API
# needs `NO_PROXY` and `MISE_GITHUB_TOKEN` in mise's own process — and that "a
# task body inherits that environment". This is a task body.
#
# The ordering consequence, unchanged: a session whose `deps-install` did not run
# has no binary to dispatch handlers with, so nothing here runs and the advisory
# `contract::unmediated_session` reports it.
# QUIET BY DECLARATION, NOT BY A LOG REDIRECT (CLOUD-1991). The shell wrapper
# sent both streams to a `/tmp` log, and on failure printed an `::error::` line
# and the log's last five lines. `silent = "stdout"` is the half the handler
# contract needs — a passing step's stdout would become session advice, which
# CLOUD-891 removed — and `quiet` drops mise's own command echo. On a failure the
# step's stderr IS the reason the door forwards, and its exit code is the step's
# own rather than a flattened `1`.
quiet = true
silent = "stdout"
run = "./install.sh"

[tasks."session:git-hooks"]
description = "Session start: install the repo-owned git hooks, the per-clone step nothing performed for 24 commits (CLOUD-476)"
# NOT `hk install`. The hook it generates is `exec hk run pre-commit`, calling
# `hk` BARE, which resolves only where mise's shims are on PATH — in this
# environment they are not, so that hook makes every `git commit` fail with
# `hk: not found`. Measured, on the very commit that added the step. The body
# installed here resolves `hk` through `mise exec --`, which is the form that
# works, and refuses to re-enter a gate already running.
#
# A SYMLINK, NEVER A COPY: a copy is a second authority that goes stale silently
# the moment the checked-in body changes, and `doctor` would keep passing over
# it. `-f` so a clone carrying hk's generated hook is repaired rather than
# skipped, which is the state every existing clone is in. Both hooks `hk.pkl`
# defines, through one body that dispatches on the name it is invoked as —
# commit-msg carries the Conventional Commits check release-plz's semver depends
# on, so leaving it out would gate the expensive half and not the deciding one.
#
# THE LINKS ARE THE ENGINE'S SINCE CLOUD-1991. `batten wiring gate` resolves the
# hooks directory the way `doctor gate` diagnoses it — `core.hooksPath`, else the
# common directory's `hooks/`, which is what `git rev-parse --git-path hooks`
# answered — creates it, and replaces both hooks with symlinks to the body named
# here, refusing a body the repository does not carry rather than writing a
# dangling link. Bare `batten`, the session steps' rule: nothing here compiles.
#
# THE VERB IS NEWER THAN EVERY RELEASE UNTIL CLOUD-1991 SHIPS, and that moves a
# dependency this step never had. Bare `batten` resolves `_.path`'s
# `target/release` first — built from this tree by `session:batten`, the
# session-start handler declared before this one — and falls through to the
# installed release only when that build did not happen. The fallthrough answers
# `unrecognized subcommand`, so in a session whose release build failed the hooks
# are NOT linked. It is not a silent bypass: `session:batten` has already said
# `::error::` out loud, this step exits non-zero, and `[[startup]]
# commit-gate-installed` reports `batten doctor gate`'s verdict and the failed
# repair. The retired body had no such dependency; the gap closes when a release
# carrying `wiring gate` is what `~/.local/bin` holds.
run = "batten wiring gate .claude/hooks/git-hook.sh"

[tasks."session:identity"]
description = "Session start: set this clone's repo-local git identity, quietly — the `step`-wrapped call from the retired hook"
# WRAPPED RATHER THAN REGISTERED DIRECTLY, and the reason is measured. The retired
# script ran `step attribution-identity mise run attribution-identity`, and `step`
# sent both streams to a log — so the fixer's own line never reached a session.
# Registering the bare task as a handler puts its stdout in the advisory instead,
# which is the CLOUD-891 announcement this hook had already removed. This keeps
# the old behaviour exactly: silent when it has nothing to repair, loud when it
# fails.
# QUIET BY DECLARATION, NOT BY A LOG REDIRECT (CLOUD-1991). The shell wrapper
# sent both streams to a `/tmp` log, and on failure printed an `::error::` line
# and the log's last five lines. `silent = "stdout"` is the half the handler
# contract needs — a passing step's stdout would become session advice, which
# CLOUD-891 removed — and `quiet` drops mise's own command echo. On a failure the
# step's stderr IS the reason the door forwards, and its exit code is the step's
# own rather than a flattened `1`.
quiet = true
silent = "stdout"
run = "mise run attribution-identity"

[tasks."session:signing"]
description = "Session start: put the not-signing posture into force, quietly — the `step`-wrapped call from the retired hook"
# The same wrapper for the same measured reason, and this is the one that caught
# it: registered bare, `mise run signing-posture --repair` put
# `signing-posture: signing disabled in this checkout …` into every session's
# advisory. Measured 2026-09-01 by dispatching the real rows. The retired script
# `step`-wrapped this call, so that line was never a session's to read.
# QUIET BY DECLARATION, NOT BY A LOG REDIRECT (CLOUD-1991). The shell wrapper
# sent both streams to a `/tmp` log, and on failure printed an `::error::` line
# and the log's last five lines. `silent = "stdout"` is the half the handler
# contract needs — a passing step's stdout would become session advice, which
# CLOUD-891 removed — and `quiet` drops mise's own command echo. On a failure the
# step's stderr IS the reason the door forwards, and its exit code is the step's
# own rather than a flattened `1`.
quiet = true
silent = "stdout"
run = "mise run batten -- attribution signing"

[tasks."session:wiring"]
description = "Session start: reclaim the hook surface from launcher-provisioned siblings — the third repair of the class `session:identity` and `session:signing` already close (CLOUD-1079)"
# THE THIRD ROW OF A FAMILY, NOT A NEW MECHANISM, and saying so is the whole
# correction. `session:signing` exists because "the launcher writes
# `commit.gpgsign true` --global every session, and local beats global only if
# something writes local" — a session-start handler beating a per-session
# launcher rewrite. `session:identity` is the same shape. This is that argument
# applied to the launcher's HOOK REGISTRATIONS, which six rows recorded as
# unreachable from here.
#
# WHAT IT REPAIRS. `~/.claude/launcher-settings.json` registers
# `session-start-git-identity.sh` on `SessionStart` and `stop-hook-git-check.sh`
# on `Stop`. The second instructs the exact commit identity `[attribution]
# identity_deny` refuses, so its remedy produces a commit `commit-attribution`
# denies (CLOUD-605, non-negotiable rule 8) — two policies, one of which has to
# not run.
#
# THE CLAIM THAT KEPT THIS UNBUILT WAS FALSE, and it is retracted rather than
# quietly dropped (CLOUD-1356). CLOUD-605 concluded "the only place it can
# actually be turned off is the environment configuration that generates
# `launcher-settings.json` — outside this repository, an owner action", and five
# more rows inherited it by quotation. What CLOUD-605 measured is that a ONE-OFF
# repair loses to a rewrite that runs every session. True, and it does not
# generalise: a repair that also runs every session does not lose, which is the
# whole reason the two siblings above exist.
#
# REGISTRATIONS, NEVER FILES, and the distinction is load-bearing rather than
# stylistic. `session-start-git-identity.sh` also sets `core.hooksPath` for the
# whole container, so deleting the file has a blast radius this repository has no
# business taking. `batten wiring reclaim` removes the registration and leaves
# the file, which is why it is the instrument and a blind `rm` is not.
#
# WHY THE DEFECT WAS INVISIBLE. Measured 2026-09-02: the installed binary was
# 0.0.121, built Aug 28, against a source tree at 0.0.137. `wiring reclaim` was
# absent from it, so an agent checking reachability concluded the repair did not
# exist; and CLOUD-1314's `test_the_retired_launcher_hooks_are_refused_if_they_return`
# was not in it either, so `batten doctor hooks -J` answered `siblings: 0,
# ok: true` while `merged: 2` showed it looking straight at both registrations.
# On 0.0.137 the same host answers `merged_siblings: 2, ok: false`. The green was
# the stale binary's, not the host's. CLOUD-1326 owns that class.
#
# AFTER `session-batten` FOR EXACTLY THAT REASON: the repair is a verb of the
# binary that step installs, so a stale or absent one turns this into a no-op
# that reports success — the same silent-absence failure the step above exists to
# stop. Its failure is loud for the same reason every sibling's is.
#
# WHAT THIS DOES NOT CLAIM. Measured the same day, both scripts carry mtime
# 16:59 — REWRITTEN MID-SESSION, not only at session start, which is stronger
# than CLOUD-1079 recorded. So this closes the session-start window and does not
# hold against a mid-session re-provision. The residue is real and is recorded
# rather than handed to an owner; what would close it is the provisioning seam
# `deps-install` above already describes, which the container's setup script
# calls before any session begins — upstream of both the rewrite and the harness
# snapshot.
# QUIET BY DECLARATION, NOT BY A LOG REDIRECT (CLOUD-1991). The shell wrapper
# sent both streams to a `/tmp` log, and on failure printed an `::error::` line
# and the log's last five lines. `silent = "stdout"` is the half the handler
# contract needs — a passing step's stdout would become session advice, which
# CLOUD-891 removed — and `quiet` drops mise's own command echo. On a failure the
# step's stderr IS the reason the door forwards, and its exit code is the step's
# own rather than a flattened `1`.
quiet = true
silent = "stdout"
run = "batten wiring reclaim -y"

# CLOUD-843. The successor to `mise-tasks/lock-complete.sh`, and the same wrapper
# shape `rules-drift` above takes: the step name and the rule id are one object,
# so hk's step, this task and `batten.toml`'s row cannot drift apart.
#
# `--rule` SELECTS ONE ROW. A bare `batten check` under a name that promises the
# lockfile gate would report every other tree rule through it, which is the
# predecessor's own scope stated as a flag.
[tasks.lock-complete]
description = "Gate: mise.lock has no partial or bogus platform entry — a pure function of the committed lockfile, no network, no write"
run = "cargo run --quiet -p batten -- check --rule 'lock cover partial'"

# CLOUD-1833. The engine, with the arguments the caller gives — the half of
# `batten-check` that is not the consumer-#1 gate.
#
# IT EXISTS BECAUSE THREE COMMITTED WORKFLOWS ALREADY CALL IT AND IT HAS NEVER
# EXISTED. `branch-hygiene.yml`, `land-divergence.yml` and `nonverdict-rate.yml`
# each run `mise run batten -- check --rule …`; the spelling was invented once,
# copied twice, and read back by the next author as a precedent. All three die at
# the step, and all three fire only on `schedule` or `workflow_run`, so no pull
# request has ever seen it. `workflow run unknown` is the clause that found them
# and is what keeps the fourth from being written.
#
# A PASSTHROUGH RATHER THAN A TASK PER RULE, and `lock-complete`'s comment above
# is the reason to say why. Its drift argument is about a TRIPLE — an hk step
# name, a task, and a rule id, which hk selects between by name and which can
# therefore disagree. A workflow step names the task directly, so there is no
# second selector to drift against, and four near-identical wrapper rows would be
# the duplication rather than the guard.
#
# `cargo run` for `batten-check`'s reason: the gate judges the working tree's
# engine and config together, the pair that ships.
[tasks.batten]
description = "Run the working tree's engine with the given arguments, so a workflow step can select one rule"
run = "cargo run --quiet -p batten --"

[tasks.batten-check]
description = "Consumer #1: evaluate the committed batten.toml with batten's own engine against this repository"
# `cargo run` rather than an installed binary, so the gate always judges the
# working tree's engine and config together — the pair that ships.
#
# `enforce`, not `check`, since CLOUD-229: the committed no-conflict-markers rule
# delegates to hk, and a `command` rule spawns a process. `check` is the
# read-effect verb, so it refuses the whole ruleset with a usage error naming
# this verb rather than running it — the CLOUD-170 split working, not a problem
# to route around. The task keeps its name: it is the consumer-#1 gate, not the
# verb it happens to call.
#
# No longer receipt-gated (CLOUD-843): see the paragraph over `run` below.
# `provision apply` first, since CLOUD-59: the `no-secrets` row runs a pinned
# scanner the engine resolves from the provision cache, and an absent binary is
# exit 1 naming this very verb rather than a silent pass. A warm cache is
# `AlreadyFresh` — no fetch, no write, and no output — so the ordinary run pays a
# checksum read and nothing else. Guarded by hand because a task body does not
# run under `set -e`, and a gate that could not install its own scanner must not
# go on to report on a tree it never scanned.
#
# THE ENGINE'S VERDICT IS PROPAGATED, NEVER REPLACED (CLOUD-1090). This line was
# `if ! cargo run … enforce; then exit 1; fi`, which collapsed every non-zero code
# the engine can emit into `1` — so a policy denial (`2`), a config error (`1`) and
# an internal error (`3`) left this task indistinguishable. `2` is the code the
# whole contract is numbered around (house style §7, "the policy verdict wherever
# it appears"), and this is consumer #1's own gate: the one place the contract
# should be observable is the one place that erased it.
#
# CAPTURED AND RE-EXITED, NOT `exec`-ED, and the receipt is why. `enforce` cannot be
# the terminating command because the receipt below must be written only on a clean
# run — an `exec` handoff would strand it permanently. Capturing `$?` and exiting
# with that same value is PROPAGATION, not the verdict reconstruction a runner is
# forbidden: nothing here reads a finding or re-derives an answer, and the only
# value this body can exit with on that path is the one the engine chose.
#
# `provision apply` keeps its own `exit 1` deliberately. A scanner that could not be
# installed is a fault of the environment, not a verdict about the tree, and `1` is
# already what the engine emits for "a `command` rule whose binary cannot run".
#
# NO RECEIPT ANY MORE, AND SO NO CAPTURE (CLOUD-843). The capture-and-re-exit
# above existed so a receipt could be written after a zero exit. The receipt is
# gone because it was never sound: `enforce` reads state no pathspec names — the
# record stores under the git directory (`input.tree.records`), captures, the
# forge's recorded answers — so a record flipping to a deny value with no
# tracked change hit a tree-keyed receipt and skipped the gate. A `[[step]]` row
# keys index entries, tool answers and arguments only, so this step has no row.
# `enforce` is the chain's LAST entry, so its code is the task's with nothing
# after it to replace one; `provision apply` runs first, and an array entry
# that fails stops the task.
run = [
  "cargo run --quiet -p batten -- provision apply",
  "cargo run --quiet -p batten -- enforce",
]

[tasks.policy-budget]
description = "Gate: the always-loaded context (AGENTS.md + anything else declared always-load) fits its token budget"
# The successor to `mise-tasks/context-budget.sh`, deleted with CLOUD-50. The whole
# predicate — which files are counted, what is stripped before counting, and both
# thresholds — is now `[budget.instructions]` in batten.toml, so the gate is
# config a reviewer can read rather than arithmetic buried in a shell script.
# `cargo run` for the same reason `batten-check` uses it: the gate judges the
# working tree's engine and config together, the pair that ships.
run = "cargo run --quiet -p batten -- policy budget"

[tasks.hook-cost]
description = "Gate: this session's hook output fits its per-session budget, and no hook repeats itself (CLOUD-417)"
# The aggregate half of the gate above, and the reason it is a separate task
# rather than a `depends` of it: `policy-budget` judges files this repository
# COMMITS and answers the same way in every checkout, while this judges a
# TRANSCRIPT a host wrote and therefore answers differently per session. Folding
# them into one name would make a red unattributable to either subject.
#
# NOT IN `verify` AND NOT IN THE hk GATE, deliberately. A session's transcript is
# not a property of the commit — it is a property of the world, which is the
# split `lock-complete` and `lock-currency` record one gate over: a property of
# the commit belongs in the gate, a property of the world belongs on a clock or
# in a hand run. Wiring it into `verify` would red a branch for a session it did
# not cause, and would pass vacuously in CI where no transcript exists at all.
#
# WHAT IT IS FOR is the row's own acceptance clause: "the measurement is
# re-runnable against any transcript, so the 20% figure can be checked rather
# than believed". So this ships as a command instead of a number in an issue
# body — point `[transcript] path` at any captured session and read the line.
#
# `cargo run` for `policy-budget`'s reason: the gate judges the working tree's
# engine and config as the pair that ships.
run = "cargo run --quiet -p batten -- policy hooks"

[tasks.completions]
description = "Regenerate the committed shell completions from the command surface"
# The binary emits on stdout only, so `generate` stays a read-effect verb (§5)
# and the redirect that refreshes the committed artifact is here, in the caller.
# `cargo run` rather than an installed binary, so the artifact always tracks the
# working tree's surface — the pair `crates/batten/tests/surface.rs` then diffs.
# THE REDIRECT IS THE ENGINE'S NOW (CLOUD-1991): `artifacts write` writes the
# bytes `generate completions` emits, into the directory named here, and the
# loop over three shells that was this body is the verb's.
run = "cargo run --quiet -p batten -- artifacts write --completions completions"

[tasks.hk-contract]
description = "Regenerate the committed plan projection from the pinned gate runner (CLOUD-947)"
# A WRITE VERB, so there is no redirect here and none is possible: the generator
# runs the pinned runner once per surface and replaces one committed file. That
# is the row's own specification and the one place this pair departs from the
# `generate` family above, where the artifact IS the stream and the caller owns
# the redirect. A stream could not tell a partial acquisition from a complete
# one, and a partial contract commits clean for the surface it lost.
run = "cargo run --quiet -p batten -- hk contract"

[tasks.hk-drift]
description = "Gate: the committed plan projection still matches the pinned gate runner (CLOUD-947)"
# `cargo run` rather than an installed binary, for `completions`' reason: the
# artifact must track the WORKING TREE's projection, or the gate answers about a
# canonicaliser nobody is landing.
run = "cargo run --quiet -p batten -- hk drift"

[tasks.man]
description = "Regenerate the committed man pages from the command surface"
# Same shape as `completions`: the binary emits on stdout only, so `generate`
# stays a read-effect verb (§5) and the redirect lives here, in the caller.
#
# THE PAGE LIST IS DERIVED HERE, from `batten spec --format json`, which is the
# one authority for which pages exist and what each is called (CLOUD-1145). It
# used to come from `mise-tasks/man-pages.sh`, and that script's own header
# claimed the authority; it never had it. The script WAS this `jq` program over
# this same spec, so retiring it moved no decision — it removed a hop that read
# as a second authority and cost a `cargo run` per invocation.
#
# The filename rule is the man convention and is `render::page_name`'s: the root
# page is `man/batten.1` and every other command path is hyphen-joined under the
# program name. `crates/batten/tests/surface.rs` spells the same rule to decide
# whether the committed set matches the declared one, which is the assertion that
# catches a page this loop failed to write.
#
# The directory is CLEARED first, deliberately. `completions` writes a fixed set
# of three, but this set shrinks when a verb is removed, and an overwrite-only
# refresh would leave the removed verb's page on disk — installable, and
# documenting a command that no longer parses. That is the orphan half of
# `the_committed_artifacts_are_exactly_the_ones_the_surface_declares`; clearing
# is what makes the documented refresh its remedy.
# THE PAGE LIST, THE CLEAR AND THE REDIRECTS ARE THE ENGINE'S NOW (CLOUD-1991).
# `artifacts write --man` derives the pages from the same spec this body read
# with `jq`, clears the directory's `*.1` first for the reason above, and writes
# each page `generate man` emits under `render::page_name`'s spelling.
run = "cargo run --quiet -p batten -- artifacts write --man man"

[tasks.schema]
description = "Regenerate every committed JSON Schema — both config surfaces and both policy-input surfaces — from the types that define them"
# Same shape as `completions`: the binary emits on stdout only, so `generate`
# stays a read-effect verb (§5) and the redirect lives here, in the caller.
#
# FOUR surfaces, four artifacts, regenerated together so none can be refreshed
# alone and drift while the others look current.
#
# Two config surfaces (CLOUD-239): `batten.toml` is the committed authority,
# `batten.local.toml` the raise-only override that accepts a strict subset.
#
# Two policy-input surfaces (CLOUD-879), derived from `Fact::ALL` rather than the
# config types: the document a tree-scoped Rego module reads as `input`, and the
# one a `mediated_call` module reads. They were hand-written and checked in, with
# a test asserting the key set matched the fact model — a drift gate can only
# report a disagreement, never prevent one, and CLOUD-845 is what a disagreement
# there costs. `opa check -s` types the corpus against these, so a stale one is a
# build-time check answering about a document the engine no longer emits.
# The four redirects are `artifacts write --schema`'s since CLOUD-1991: the same
# four surfaces, written together into the directory named here.
run = "cargo run --quiet -p batten -- artifacts write --schema schema"

[tasks.zizmor]
description = "Static-analyse the GitHub Actions workflows (dangerous triggers, unpinned actions, injection sinks)"
# Same tool + severity CI enforces. This is the one command CI's zizmor job also
# runs, so they cannot drift.
#
# `action.yml` is named alongside `.github/` because the shipped Action (CLOUD-68)
# is a workflow surface with the same injection and unpinned-uses hazards, and
# zizmor's directory walk does not reach a repository-root action definition.
# NOT receipt-gated any more (CLOUD-843): the cache is an engine verb, and the
# CI job this task runs in compiles nothing (`zizmor.yml`), so gating it would
# put a full engine build in front of a seconds-long offline analysis.
#
# `--offline` is load-bearing, and it is the lock-check split applied here
# (CLOUD-410). GH_TOKEN in [env] used to enable zizmor's ONLINE audits, which
# means `known-vulnerable-actions` reached api.github.com — so this gate's
# verdict depended on that API being up. Measured: two laps of one `land` run,
# same tree, `No findings to report` then `403 Forbidden` on
# `/advisories?affects=actions%2Fcheckout%40v7.0.1`, failing `verify` and
# stopping the landing with "reproduce and fix locally" over a commit that had
# nothing wrong with it. A gate on the landing path answers a question about
# THIS COMMIT; whether a pinned action has an advisory today is a question about
# the world, it changes with no diff, and it belongs on a clock — which is
# `.github/workflows/zizmor-advisories.yml`, beside lock-currency and ci-drift.
run = "zizmor --offline --min-severity high .github/ action.yml"

[tasks.zizmor-advisories]
description = "Currency only: is any pinned action the subject of a published advisory? Runs on a schedule, never on the landing path — it needs the network"
# The other half of CLOUD-410's split. Same tool, same severity, same targets —
# the ONLY difference is that this one is allowed to reach the network, so its
# failure means "an action you pin has an advisory" rather than "your commit is
# bad". Never added to `verify`; `ci-local-parity` would (correctly) then demand
# CI run it too, which is exactly the coupling this split removes.
run = "zizmor --min-severity high .github/ action.yml"

[tasks.lock-check]
description = "Currency only: would regenerating mise.lock change it? Runs on a schedule, never on the landing path — it fetches and it writes"
# What this actually answers is "has upstream changed since this commit", which
# is a property of the world, not of the branch. It costs a remote round trip
# per tool and REWRITES the tracked lockfile, so it belongs on a schedule
# (.github/workflows/lock-currency.yml), not in `verify`.
#
# It does NOT answer completeness, though it used to claim to. Regenerate-and-
# diff detects drift only: `mise lock` never removes or repairs an existing
# entry, so a lockfile that is stably wrong passes forever. One did — a
# cargo-zigbuild platform key carrying a checksum and no url, exactly the
# partial entry this comment used to cite as the motivation. `mise run
# lock-complete` asks that question of the committed bytes instead.
#
# The old comment also asserted "CI installs with `mise install --locked`".
# It does not, and never did — no workflow passes --locked.
#
# Fails closed, and the array is what does it (CLOUD-843, CLOUD-1991): mise
# stops at the first entry that fails, so a `mise lock` that could not
# regenerate the file never reaches the diff and cannot report a lockfile it
# never rewrote as current — the silent false green the guarded body held off.
# `git diff --stat --exit-code` is the whole second half in one argv: the stat
# names what moved, and the code is 1 when anything did. Review and commit the
# regenerated file; CI installs with `--locked` and needs complete per-platform
# URLs.
#
# `MISE_LOCKFILE = "true"` is the task's `env` rather than a `VAR=` prefix. The
# single sanctioned lockfile writer, so it says so. Measured on mise 2026.8.2:
# `mise lock` writes regardless of `[settings] lockfile`, so this assignment is
# not what makes the regeneration work — it is the declaration that this task,
# alone in the repo, is allowed to write the file that `[settings] lockfile =
# false` denies to everything else (CLOUD-223). It also holds the currency job
# upright if a later mise gates `lock` on the setting.
env = { MISE_LOCKFILE = "true" }
run = [
  "mise lock",
  "git --no-pager diff --stat --exit-code -- mise.lock",
]

# ONE TURN'S CROSS-TRIPLE TYPE-CHECK, DETACHED (CLOUD-1731).
#
# `cross-check` runs in exactly one place — inside `verify` — so "this does not
# compile on Windows" is learned at the cadence of the whole gate, which in
# practice means after the author has moved on. `rules/rust.md` states the cost
# in its own words ("the next edit to the other one is discovered by CI") and
# CLOUD-1148 is the recorded instance: the `windows` job reddening alone, and the
# first fix making it worse.
#
# AFFORDABLE BECAUSE OF THE RECEIPT, measured 2026-09-09 rather than assumed:
# a re-run whose inputs, command and toolchain are unchanged answers from
# its step receipt in **1.0s**; a run that must re-derive takes 54s cold. So the
# per-turn cost is a second on every turn that changed no Rust, and 54s on the
# turns that changed some — which are the turns that need it.
#
# DETACHED, BECAUSE A HANDLER THAT WAITS IS A HANDLER THAT TAXES EVERY TURN. The
# verdict is not needed before the turn proceeds; it is needed before the author
# stops thinking about the change, which is a much weaker deadline. `verify`
# remains the blocking authority and this never substitutes for it.
#
# THE FAILURE IS REPORTED ON THE NEXT TURN AND SUCCESS IS SILENT. A log nobody
# reads is sensor-only (non-negotiable rule 2), so the marker file is what turns
# this from a log into a mechanism: the next invocation prints it and clears it.
# Success says nothing, because a line on every turn is noise that trains the
# reader to skip the one turn it matters.
#
# THE PATTERN TOLERATES COLOUR RATHER THAN SUPPRESSING IT, and that is the third
# draft of this line. `[env]` sets `CARGO_TERM_COLOR = "always"` repo-wide, so a
# machine-read log carries escapes between `: ` and `error`: the first draft
# scraped `-->` and got nothing, the second matched `: error` and got nothing,
# and the third set `CARGO_TERM_COLOR=never` on the invocation — which ALSO got
# nothing, because a task's own environment beats a value inherited from the
# caller. Three silent failures, each announcing a break with no pointer.
#
# So the pattern anchors on the SHAPE `--message-format=short` guarantees —
# `path:line:col: ` — and lets `.*` span whatever decoration sits after it. It
# needs no escape literal, survives either colour setting, and excludes the
# trailing `error: could not compile` summaries, which carry no location and
# would have spent the cap on nothing.
#
# BOUNDED AT FIVE LINES, AND BOUNDED IS NOT THE SAME AS USEFUL. The first draft
# emitted one fixed sentence, which is cheap and costs the reader a whole turn
# re-running the check to learn what broke — bounded and useless is its own
# waste. What it emits instead is the first THREE `path:line` pointers and a
# path to the rest: actionable enough to fix without a second run, and
# pointer-only per non-negotiable rule 4, since a compiler's full output is the
# payload and these are the pointer. The window cost of a failing turn is five
# lines; of a passing turn, zero.
#
# `[hook_output] max_repeats = 1` IS SATISFIED BY THE CLEAR, not by luck: the
# marker is removed once printed, so one failure is announced once rather than
# on every turn until it is fixed — which is what would otherwise trip that
# ceiling and, worse, train the reader to skip the line.
#
# ON STDOUT, AND THAT IS THE WHOLE DIFFERENCE BETWEEN AN ALARM AND A LOG.
# `handler.rs` states the contract: "Exit `0` with stdout: advisory text, to be
# merged into Batten's own" — so stdout is what reaches the AGENT and stderr is
# what reaches a log nobody opens. The first draft of this line wrote the marker
# to stderr, which would have printed the failure, cleared it, and shown it to
# no one: a sensor wearing an alarm's clothes, one layer inside the rule against
# exactly that. Caught in review before it landed.
#
# ONE LINE JOINED BY `;` RATHER THAN A `"""` BODY, for `deps-install`'s reason:
# `inline-task-bodies-not-growing-basic` is `non_increasing` against
# `origin/main` with no `admits_with`, so a new block body is refused and the
# only routes are extraction or a waiver. Neither is worth spending here.
#
# `batten singleton` RATHER THAN A PROCESS PROBE: the lock is the declared
# mechanism for "may a second copy start in this clone", and polling the process
# table for one is the shape `polls-a-local-process` refuses.
# The provisioning `mise-tasks/doctor.sh` owned, as the declared table that
# replaces it (CLOUD-1753). `--repair` because that is what the program did: it
# checked and then FIXED what it could, and a session that only reported would
# leave the container it diagnosed exactly as broken as it found it.
# `ci-slow-needed`'s task name, kept for `ci.yml`'s two callers (CLOUD-1716). What
# it wraps is `batten ci slow-needed`, and since CLOUD-1991 it wraps nothing else.
#
# THE TWO THINGS THE SHELL BODY STILL DID MOVED TO THEIR HOMES. The head assertion
# — a `pull_request` job checks out GitHub's merge commit, so the head a caller
# names is refused unless it carries the checkout's tree — is the verb's own
# `--head` now, beside the diff it guards. The exit FOLD onto the workflow's
# boolean (`0` needed, `1` not) is gone: the task answers on the verb's table
# (`0` needed, `2` not needed, `1`/`3` could not ask), and `ci.yml` reads `2` as
# "not needed" where it read `1`.
#
# `usage` BINDS THE TWO POSITIONALS, which is what the function-called-last shape
# existed to do: mise used to append them to the run string, and a body ending
# in `esac` put them after it.
[tasks."ci-slow-needed"]
description = "Decide whether a diff can move the hk slow tier, so a diff that cannot does not pay for it"
usage = '''
arg "<base>" help="the revision the checkout is diffed against"
arg "[head]" help="the revision whose tree the checkout must carry"
'''
run = 'cargo run --quiet -p batten -- ci slow-needed --base "{{usage.base}}"{% if usage.head %} --head "{{usage.head}}"{% endif %}'

# THE INSTALLED BINARY, NEVER A COMPILE (CLOUD-1753, CLOUD-1991). Session start
# is the one path that may not assume a toolchain, and a bare `cargo run` there
# compiles the engine to ask a question the installed release can already
# answer. `a_cargo_fallback_in_a_session_task_is_guarded` refuses an unguarded
# spelling; this one carries no `cargo` at all since the guarded fallback retired
# with its shell line.
#
# STALENESS IS NOT WAVED THROUGH by preferring the release. A release older than
# the tree's config is `batten doctor mediator`'s to detect, and
# `mediator-matches-the-tree` is a declared `[[startup]]` row this very task
# evaluates — so the skew is reported by the run rather than pre-empted by
# compiling on every session start.
[tasks."provision:startup"]
description = "Check every declared [[startup]] row and repair what it can — the provisioning mise does not own"
# THE FALLBACK IS RETIRED WITH THE SHELL LINE (CLOUD-1991): this runs from a
# session-start handler, which `batten hook` dispatches, so `batten` resolves
# there by construction; the `cargo` arm could only fire where nothing could
# have dispatched it.
run = "batten startup --repair"

# The Darwin link (CLOUD-1753), ported off `mise-tasks/darwin-link.sh`. `cargo
# check` stops at codegen-to-metadata and never links, so it structurally cannot
# see a dependency pulling in a macOS framework; the release build would be the
# first thing to notice, after a tag was cut. This links the thing, which is the
# only reading with no false negatives.
#
# A FUNCTION BODY, BECAUSE mise APPENDS ARGUMENTS TO THE `run` STRING (CLOUD-1916).
# As a bare script `${1:-…}` was always empty, so `mise run darwin-link
# x86_64-apple-darwin` linked — and receipted — aarch64, and the x86_64 required
# check never linked its own target. Appended to `darwin_link`, the triple is its
# `$1`: the `ci-slow-needed` shape.
#
# ONE LINE JOINED BY `;`, on the `cross-turn` precedent below:
# `inline-task-bodies-not-growing` is `non_increasing` with no `admits_with`, so
# a new ''' body is refused outright.
#
# THE TRIPLE GUARD SURVIVES AS A STEP, and that is a deliberate exception to this
# delta's rule. Everything else here is a step and went where steps live, but
# this one is a decision — and it has no engine home: `doctor target` installs
# any triple legitimately, so the constraint is this task's own precondition
# rather than a property of the toolchain. It exits `2`, not the shell's `1`:
# CLOUD-1718 folds the corpus's inverted table onto the engine's, where a
# refused argument is a usage error.
# THE TOOLCHAIN LOCK'S ONE CALL SITE (CLOUD-1753), ported off
# `mise-tasks/target-ensure.sh`. Three callers name it — `cross-check`,
# `darwin-link` and `test:musl` — and they name a TASK rather than the verb for
# two separate reasons that happen to point the same way.
#
# THE PATH-VS-TREE RULE IS THE FIRST. `doctor target` is a verb this branch ADDS,
# and a caller spelling bare `batten` resolves whatever release is on PATH, which
# answers `unrecognized subcommand 'target'` until the release that ships it. Both
# `cross-check` and `darwin-link` spelled the bare name and `verify` caught it.
# This body spells `cargo run -p batten --`, which resolves the TREE and may name
# a new verb — the same distinction `[tasks."install-check"]` and the four beside
# it already carry.
#
# THE NAME SURVIVING ITS PROGRAM IS THE SECOND. Deleting `mise-tasks/<name>.sh`
# retires the auto-discovered TASK as well as the program, and `test:musl` still
# says `mise run target-ensure`. Without this declaration that call fails with
# "no task target-ensure found" — which is exactly how `hk.pkl`'s
# `mcp-timeout-budget` step broke in this same campaign. A retired program whose
# name has other callers owes an explicit wrapper.
#
# The lock itself moved with the port: serialising here is what makes `rustup
# target add` behave like the idempotent operation it documents, because rustup
# has no cross-process lock and two concurrent adds each see the other's
# half-written component tree and both roll back (CLOUD-220).
# THE FIVE WAVE-1 GATE NAMES THAT SURVIVE THEIR PROGRAMS (CLOUD-1753).
#
# Deleting `mise-tasks/<name>.sh` retires the auto-discovered TASK along with the
# program, and CI still calls every one of these by name: `ci-tools-check` from
# six workflows, `rust-paths-check` from `rust.yml`, `report-only-check` from
# `scorecard.yml` and from `verify` here, `timeout-check` from
# `timeout-drift.yml`, and `awk-regex-check` from `mise-tasks/nonverdict-assert.sh`.
# Without these rows each of those is "no task found" — which is how `hk.pkl`'s
# `mcp-timeout-budget` step and `test:musl`'s `target-ensure` call broke in this
# same campaign, and it is the fourth and fifth instance of one defect.
#
# EACH RUNS THE ENGINE OVER ITS SUCCESSOR RULE rather than re-spelling a
# predicate: the module is the authority and `batten check --rule` is how a
# caller asks it. `cargo run -p batten --` and not the bare name, because these
# rule ids are this branch's and a PATH-resolved release does not carry them.
[tasks."ci-tools-check"]
description = "Gate: every tool a workflow reaches for is pinned where this repository pins tools"
run = "cargo run --quiet -p batten -- check --rule 'tool pin wrong'"

[tasks."rust-paths-check"]
description = "Gate: the rust workflow's path filters name every path its jobs actually judge"
run = "cargo run --quiet -p batten -- check --rule 'path list partial'"

[tasks."report-only-check"]
description = "Gate: a reporting workflow does not silently stand in for a gate that must decide"
run = "cargo run --quiet -p batten -- check --rule 'gate report silent'"

[tasks."timeout-check"]
description = "Gate: every job declares a timeout, and every declared timeout binds to a job"
run = "cargo run --quiet -p batten -- check --rule 'job bind missing'"

[tasks."awk-regex-check"]
description = "Gate: an awk program carries no pattern that is unsafe under the shell that invokes it"
run = "cargo run --quiet -p batten -- check --rule 'pattern carry unsafe'"
[tasks."target-ensure"]
description = "Effect: ensure one rustup target is installed, behind the per-toolchain lock so concurrent callers queue instead of colliding"
# NO `"$1"`: mise appends a task's positional arguments to its `run` string, so
# naming one here passes the triple TWICE and the verb refuses the second as an
# unexpected argument. Measured on the first invocation of this task.
run = "cargo run --quiet -p batten -- doctor target"

[tasks."darwin-link"]
description = "Gate: the macOS targets actually LINK from Linux, which is what proves no dependency needs an Apple SDK"
# AN ARGV SEQUENCE AND A `usage` SPEC, NOT A FUNCTION BODY (CLOUD-1991). The
# function-called-last shape existed so mise's appended triple became `$1`; the
# spec binds it by name instead, with the default the body spelled. The triple
# guard is the spec's `choices`: mise refuses any other value before the body
# runs, which is stricter than the `*-apple-darwin` glob it replaces — it admits
# the two Darwin triples `release-artifacts.yml` ships and nothing else.
#
# The receipt is `batten step run`'s, keyed on the triple as an `--arg`, so a
# receipt for one triple never answers for the other (CLOUD-1916). A hit now
# skips the link and not the target install, which `target-ensure` makes
# idempotent behind its lock.
usage = '''
arg "[target]" default="aarch64-apple-darwin" help="the Darwin triple to link" {
  choices "aarch64-apple-darwin" "x86_64-apple-darwin"
}
'''
run = [
  "mise run target-ensure {{usage.target}}",
  "cargo run --quiet -p batten -- step run darwin-link --arg {{usage.target}} -- cargo zigbuild --workspace --profile darwin-link --target {{usage.target}}",
]

[tasks."cross-turn"]
description = "One turn's cross-triple type-check, detached — reports the previous run's failure and never blocks the turn"
# ONE ARGV SINCE CLOUD-1991: `batten singleton detach` is the whole shape the
# one-liner spelled with `&`, `grep`, `head` and `sed`. It announces the previous
# run's failure on STDOUT (the handler's advisory channel) and clears it, so one
# failure is said once; it starts an attached copy and returns, so the turn never
# waits on cargo; the copy takes the `cross-turn` lock for its OWN pid — a second
# copy is refused by the lock, never by a process probe — runs `cross-check` with
# the whole output in the log, and on a failure leaves at most three pointer
# lines plus the log's path. Which lines are pointers is the
# `compiler-error-pointer` `[[pattern]]` row, which tolerates the colour escapes
# `CARGO_TERM_COLOR = "always"` puts between `: ` and `error`. Bare `batten`,
# the handler's own rule: nothing on a turn compiles. `singleton detach` is newer
# than every release until CLOUD-1991 ships, so it resolves only through
# `_.path`'s `target/release`, which `session:batten` builds at session start;
# where that build failed, this handler fails every turn — loudly, never as a
# pass — until it succeeds or a release carries the verb (`session:git-hooks`
# records the same dependency).
run = "batten singleton detach cross-turn --marker target/cross-turn.fail --log target/cross-turn.log --pattern compiler-error-pointer -- mise run cross-check"

[tasks.cross-check]
description = "Type-check for other targets from Linux (no macOS runner needed)"
# The `rustup target add` below is not idempotent against a half-installed
# component; `batten doctor target` in the loop is what makes it one, and it
# carries the toolchain lock with it (CLOUD-1753). The `doctor` dependency is
# gone with the program: this task needed only its target half, and asking for
# the whole of it is what put a full doctor on this task's critical path.
# The Darwin triples are NOT here: they get a stronger check — a real link — in
# `darwin-link`, which runs as its own parallel CI job. Checking them here too
# would be duplicate work on the critical path.
#
# EVERY OTHER SHIPPED TRIPLE IS, AND THAT IS THE WHOLE LIST'S JOB. `release-artifacts.yml`
# builds seven targets and every one of them is cross-compiled on a Linux runner,
# so nothing CI executes is ever the artifact a consumer downloads. Until this
# loop carried them, four of those seven had NO verification of any kind — not a
# type-check, not a link, not a run — and one of the four is
# `x86_64-unknown-linux-musl`, which is what `install.sh` resolves for every Linux
# consumer: 113 downloads of it against 4 of the glibc build on v0.0.159. The
# binary almost everyone runs was covered by nothing but the fact that it
# compiled.
#
# THE TWO aarch64 TRIPLES ARE A DECLARED GAP, NOT AN OVERSIGHT, and the reason is
# measured rather than assumed. `cargo check` needs no target LINKER — that is why
# this gate works at all — but it does run build scripts, and `blake3` shells out
# to `cc` to compile its NEON path for any aarch64 target:
#
#   error occurred in cc-rs: failed to find tool "aarch64-linux-gnu-gcc"
#   error occurred in cc-rs: failed to find tool "aarch64-linux-musl-gcc"
#
# Both triples fail identically, so the constraint is the ARCHITECTURE and not the
# libc; `x86_64-unknown-linux-musl` checks clean here because the host compiler
# already serves that arch. Covering the pair needs an aarch64 cross C toolchain
# this repository pins nowhere — `release-artifacts.yml` builds them under
# `build-tool: cross`, which supplies one inside a container, so the release path
# solved this and the verification path never inherited the solution. Pinning one
# is its own change (CLOUD-364); what must not happen is this list quietly
# claiming a coverage it does not have.
# AN ARGV SEQUENCE, NOT A LOOP (CLOUD-1991). The loop's two properties survive as
# its shape: each triple's install runs first and a failed one stops the task
# before any check (mise stops an array at its first failing entry), and both
# triples are type-checked by ONE `cargo check` naming both `--target`s, which
# cargo supports and which fails if either does. `RUSTFLAGS` rides `env(1)` on
# the checked command alone, so the engine build the step runs through is not
# rebuilt under `-D warnings`. The receipt is `batten step run`'s; a hit skips
# the check, and the installs stay idempotent behind `target-ensure`'s lock.
#
# THROUGH `mise run batten`, never a bare `batten` and never `cargo run` spelled
# here, for the reason the comment above records: this gate asserts about its own
# body that it names no `cargo build|test|run`.
#
# THE FLAGS, whose reasons lived inside the retired body and move here with it:
#   * `check` does codegen-to-metadata without linking, so it needs no target
#     linker or SDK — cross-platform compile coverage at Linux-runner cost.
#   * `--all-targets`, because the default set is lib and bins only, so the ~440
#     integration tests — the half most likely to reach for a Unix-only API —
#     were never type-checked against a foreign triple (CLOUD-395).
#   * `-D warnings` is the sweep for the class invisible on Linux by
#     construction, such as a helper whose every caller is `#[cfg(unix)]`
#     (CLOUD-397). Registry dependencies build with `--cap-lints allow`, so only
#     workspace code is held to it.
#   * `--message-format=short` is one `path:line:col: error: …` per diagnostic,
#     which is the shape `cross-turn` reads pointers from (CLOUD-1731).
run = [
  "mise run target-ensure x86_64-pc-windows-gnu",
  "mise run target-ensure x86_64-unknown-linux-musl",
  "mise run -q batten -- step run cross-check -- env 'RUSTFLAGS=-D warnings' cargo check --workspace --all-targets --target x86_64-pc-windows-gnu --target x86_64-unknown-linux-musl --message-format=short",
]

[tasks."test:musl"]
description = "Run the workspace suite against x86_64-unknown-linux-musl — the triple install.sh resolves for every Linux consumer (CLOUD-1821)"
# NO `doctor` DEPENDENCY, for `cross-check`'s reason one row up: the program is
# retired and so is its task name, and this task only ever needed the target
# half, which `target-ensure` below already routes through `batten doctor
# target`. Merged from `main` after the retirement, the stale `depends` made
# every CI `musl` job exit on `task not found: doctor` before a test ran.
# THE RUNG ABOVE `cross-check`, FOR THE ONE TARGET THAT REACHES IT FOR FREE.
# `cross-check` type-checks this triple and `darwin-link` links two more, but a
# type-check cannot see a linker problem and a link cannot see a behavioural one.
# EXECUTION closes both, and a statically linked musl binary runs on a glibc
# host — so this triple reaches the top rung on the runner and the laptop already
# paid for, with no container, no emulator and no foreign runner.
#
# IT IS ALSO THE TRIPLE THAT MATTERS MOST. `install.sh` resolves
# `x86_64-unknown-linux-musl` for every Linux consumer: 113 downloads of it
# against 4 of the glibc build on v0.0.159. Until this task existed, the binary
# almost everyone runs was covered by the fact that it compiled, and the one
# almost nobody runs was the only one whose suite had ever executed.
#
# WHY NOT A `--target` ON `test:cargo`. That task's single cargo statement is read
# by `ci-local-parity` property 16, which requires a foreign leg to spell
# `mise exec -- ` plus exactly it — so a target added there would make `windows`
# and `macos` run the LINUX musl suite. Two separable questions, two tasks: does
# the suite pass on this OS, and does it pass against this libc.
#
# NOT receipt-routed, unlike `test:cargo`, and the distinction is the KEY rather
# than the cost: a receipt keyed on the same sources, command and toolchain would
# be minted by whichever suite ran first and then answer for the other. Same
# reason `test:filter` and the four `hk` tiers above decline one.
run = '''
# Guarded by hand because a task body does not run under `set -e`
# (rules/toolchain.md). Routed through target-ensure so a concurrent toolchain
# mutator queues on the lock instead of colliding inside rustup (CLOUD-220).
if ! mise run target-ensure x86_64-unknown-linux-musl; then
  echo "::error:: test:musl: could not install the musl target, so its suite did not run." >&2
  exit 1
fi
if ! cargo nextest run --workspace --target x86_64-unknown-linux-musl; then
  echo "::error:: test:musl: the suite fails against x86_64-unknown-linux-musl — the triple install.sh resolves for every Linux consumer." >&2
  exit 1
fi
'''

[tasks.hk-version]
description = "Gate: hk's version is pinned identically in mise.toml and hk.pkl (amends URL). A bump to one without the other is the moment to revisit the hook config."
# THE DECISION IS `policy/hk-pin-agreement.rego` SINCE CLOUD-1991, over facts the engine
# reads itself; this name survives for `hk.pkl`'s step and for hands that type
# it, and selects the one row so it reports nothing else.
run = "cargo run --quiet -p batten -- check --rule 'tool pin other'"

[tasks.no-docs-tree]
description = "Gate: no committed docs/ tree. Research deliverables and evidence notes attach to the Linear issue, not a repo docs/ folder (see AGENTS.md)."
# THE DECISION IS `policy/docs-tree-absent.rego` SINCE CLOUD-1991, over facts the engine
# reads itself; this name survives for `hk.pkl`'s step and for hands that type
# it, and selects the one row so it reports nothing else.
run = "cargo run --quiet -p batten -- check --rule 'prose place refused'"

[tasks.no-armed-ripcord]
description = "Gate: the break-glass sentinel is never committed. An armed ripcord in the index hands every clone the bypass (CLOUD-1847)."
# THE AUDIT IS WHAT KEEPS THE RIPCORD FROM BEING A PASSWORD, and this is half of
# it. `.batten-ripcord` opens the repair floor over a config that loads and
# denies — which is the right answer for a container that would otherwise be
# abandoned, and the wrong thing entirely to hand to every clone of the
# repository. A sentinel is a thing one operator arms in one tree, for as long as
# it takes to remove the rule that forced it.
#
# GLOB-LESS, on `no-docs-tree`'s reason (CLOUD-224): the input genuinely is the
# whole index. It fails on a tracked sentinel whatever commit introduced it,
# where a glob would let one persist unreported for every commit that did not
# touch it. `.gitignore` carries the same name, so reaching this gate takes a
# deliberate `git add -f` — which is exactly the case a gate is for.
# THE DECISION IS `policy/ripcord-untracked.rego` SINCE CLOUD-1991, over facts the engine
# reads itself; this name survives for `hk.pkl`'s step and for hands that type
# it, and selects the one row so it reports nothing else.
run = "cargo run --quiet -p batten -- check --rule 'path ship refused'"

[tasks.bats-submodule]
description = "Check out the vendored bats runner if it is missing — `bats-submodule-checked-out`'s check and repair, for `test:bats`"
# THE REPAIR ALONE, AND UNCONDITIONALLY (CLOUD-1991). The `test -f … ||` guard
# only skipped a command that is already idempotent: `git submodule update
# --init` over a checked-out submodule at its recorded commit writes nothing and
# fetches nothing. Dropping the guard drops the shell line and changes no state.
run = "git submodule update --init --recursive tests/bats"

[tasks."test:bats"]
description = "Run the shell test suite (tests/*.bats) — cargo test for the mise-tasks/ programs"
# bats comes from a submodule, not [tools], so a fresh clone has no bats and this
# task reports "bats: not found" — which reads as a missing TOOL and sends the
# reader to mise. `doctor` checks out the submodule instead. Only the submodule
# half: this dependency re-runs doctor in whatever process invokes test:bats,
# and when that is hk's test:bats step it is a CHILD mise process — task-node
# dedup is per-process, so a full doctor here raced the outer DAG's doctor
# inside `rustup target add` and both rolled back (CLOUD-220). The targets are
# owned by the tasks that need them (cross-check, darwin-link), each routed
# through the target-ensure lock.
# ONLY THE SUBMODULE, NOT THE STARTUP TABLE (CLOUD-1753). This depended on
# `provision:startup` — every `[[startup]]` row — on the reading that the table
# had no half to exclude. CI refuted it: three rows cannot run on a runner
# (`check-unrunnable`), so every `bats` job failed before a case ran, and the
# `mediator-matches-the-tree` row rebuilt the release binary first (184 s), the
# same reach into `build:release` that pruned mid-gate under `verify`. What this
# suite needs is `bats-submodule-checked-out`'s check and repair, and that is
# what `bats-submodule` runs.
depends = ["bats-submodule"]
# `batten startup --repair` rather than `doctor --no-targets` (CLOUD-1753): the
# submodule half this dependency wanted is now the `bats-submodule-checked-out`
# row, and the flag existed only to keep a full doctor — and its `rustup target
# add` — off this path. A declared table has no such half to exclude, because the
# rows that touch the toolchain are separate rows.
# A FIXTURE RUN NEVER READS THE HOST'S MCP LOGS. `mcp-timeout-budget.bats`'s
# "the committed budget passes" runs the real gate over the real settings, and
# with this unset the gate also reads whatever session logs this machine holds —
# so the case went red on a container whose client started serena at 30000ms
# (CLOUD-730), a host fact no diff can move. Pointed at a root that does not
# exist, the gate checks the declaration alone, which is what the case asserts;
# the live-log check stays the hk `mcp-timeout-budget` step's job.
env = { MCP_TIMEOUT_LOGS = "target/mcp-logs-for-fixtures-never-created" }
# Parallel across files, never within one (CLOUD-386). Serial, this suite was
# the pole of the `ci` job — 247.01s of 298.87s, with the cargo chain beside it
# finishing at 166s — and `verify` pays it again on every `land` lap, so it sat
# in the exponent of the lap economics twice.
#
# `$(nproc)` rather than a literal: the number that is right for today's
# ubuntu-latest is wrong the moment a runner changes size, and a stale literal
# reads as deliberate.
#
# IT IS ALSO THE MEASURED OPTIMUM, AND EACH TABLE BELOW NAMES THE MACHINE IT WAS
# TAKEN ON. That is not bookkeeping: the first table was read for a year as a live
# instruction — "4 is the MEASURED optimum", "do not budget this number down" —
# while the CI runner reports 2, so both sentences were true about hardware CI
# does not have (CLOUD-386's third measurement).
#
# # sweep: measured=2026-08-11 cores=4 cases=1039 host=developer-box
#
#   workers      2       4      6      8     12
#   test:bats  210.7s  100.3s 104.1s 106.0s 105.9s
#   whole gate 224.9s  111.1s 117.5s 118.0s 120.5s
#
# # sweep: measured=2026-08-28 cores=2 cases=2793 host=4-core box under `taskset -c 0,1`
#
#   point                       bats workers  hk slots  nextest  gate     test:bats
#   A (today)                    $(nproc)=2    default  default   998s     829s
#   B                            1             default  default   —        unmeasurable
#   C                            4             default  default  1171s     669s
#   D                            2             1        default  1500s     623s
#   E                            2             default  1        1194s     860s
#
# THE MASK IS THE EMULATION and `nproc` respects it, so both consumers follow: hk's
# slot count and the worker count this body derives. A 2-core mask on a fast box is
# not an `ubuntu-latest` runner, and cargo was warm; what carries across is the
# ORDERING, not the absolute numbers.
#
# B IS NOT A MISSING MEASUREMENT, it is an unavailable one: bats refuses `--jobs 1`
# alongside `--no-parallelize-within-files`, so the count cannot be budgeted below
# 2 at all while that safety flag stands.
#
# EVERY DIRECTION IS WORSE, AND THE THREE THAT REMOVE OVERSUBSCRIPTION MOST OF ALL.
# C hands the step more workers than cores and buys 160s on the step while costing
# 173s on the gate, because the cargo chain starves. D gives bats the box to itself
# (one hk slot) for the fastest step measured and the slowest gate: +50%. E caps
# nextest's own pool, CLOUD-439's third claimant, and costs 20%. The suites are
# fork-bound rather than CPU-bound, so contention is cheaper than idle workers —
# which is why "budget this number down" stays the wrong instinct, now for a
# measured reason on the runner's own width rather than on a laptop's.
#
# CLOUD-439 also retired the premise that sent it looking. The suite was read as
# running 2.65x slower in-gate than alone (72.73s vs 192.59s), attributed to
# three steps each claiming `nproc` — hk's own `--jobs`, `cargo test`'s pool and
# clippy's `-j`, ~12 workers on 4 cores. Those two numbers came from DIFFERENT
# MACHINES: 72.73s local, 192.59s on `ubuntu-latest` (run 31535645426, job
# 93926035222). Measured on one box, same commit, same suite, in-gate vs alone
# is 90.26s -> 100.3s: contention costs ~10s, about 1.11x. Capping hk to one
# slot per chain was measured too and cost ~19s, because the ~23 sub-second
# gates stop overlapping the two long chains. The gap CLOUD-398 is sizing is a
# slower runner, not this repo oversubscribing it.
#
# Across-files is already enough — the largest file is 146 of 2790 cases (5.2%,
# re-counted 2026-08-28; it was 54 of 1039 when this clause was written), ~10% of
# a worker's share at two workers, so the schedule is not tail-bound — and it is
# the half that is safe by construction: within-file parallelism would interleave
# a file's own setup/teardown with its cases, which is exactly what the suites
# that model lock and race behaviour must not have done to them.
#
# THE COUNT IS ASSERTED, NOT THE EXIT CODE. The failure mode every change in
# this series risks is "faster because it ran fewer", and a green exit is blind
# to it — a narrowed glob, a stray filter, or a worker that died mid-file all
# pass. No total is written down: the tracked `@test` declarations are counted
# and compared against bats' own TAP report, so adding a case needs no edit
# here. Output stays a pointer (rule 4) — two counts and the worker count, never
# a case name.
#
# This body runs under `/bin/sh` WITH `-e`, so a bare failing command aborts the
# task where it stands. Every step is guarded explicitly anyway, which is
# belt-and-braces rather than load-bearing — and the guards are what let a step
# CHOOSE its exit code instead of inheriting the abort.
#
# CORRECTED 2026-09-01, measured. These three comments said "with no `set -e`" and
# were wrong. The discriminator is a DECLARED SHELL, not the file: a task that
# declares `shell = "bash -c"` really does run every line regardless — that is the
# case `rules/toolchain.md` documents and `tests/task-fail-closed.bats`
# gates, over `verify` and `verify:gated`, both of which declare it. This task
# declares none, so it gets the default and `-e` with it. Observed while landing
# CLOUD-1085: a bare call in a default body aborted the task before the branch
# reporting which failure it was could run.
#
# The error direction was benign, which is why nothing broke: believing "no
# `set -e`" makes an author ADD guards. An author who believed the opposite would
# omit them, and that is the direction this correction exists to prevent.
# Receipt-gated (CLOUD-424). Its `[[step]]` row in `batten.toml` declares `.`:
# these suites read mise.toml, hk.pkl, workflows and fixture trees all over the
# repo, so the honest input set is the whole tracked tree — a rebase that
# changed no bytes still skips, and any content change anywhere re-runs.
run = '''
if [ "$(cargo run --quiet -p batten -- step check test:bats | cut -c1-3)" = hit ]; then exit 0; fi
# BUILD ONCE, THEN FEED THE SEAM THE PROGRAMS ALREADY DECLARE (CLOUD-1198).
#
# This task's only build dependency was `doctor --no-targets` — the submodule
# checkout — so it NEVER built the binary. Every gate it drives that needs
# `batten` paid `cargo run` process startup per case, and worse, whichever
# artifact happened to be lying in `target/` decided what the suite tested.
# `tests/helpers.bash` asserted the opposite in a comment for its whole life:
# "test:bats builds the DEBUG binary", true only transitively via whatever ran
# before. That is CLOUD-592's and CLOUD-699's stale-binary class, and closing it
# is this change's case — the ~23s of avoided startup is the bonus, not the
# argument. `hooks-wiring-check.sh:212-214` insists the gate judge "the WORKING
# TREE's engine and config together, which is the pair that ships", so a freshly
# built binary is the CORRECTNESS precondition for the injection below rather
# than an optimisation detail.
#
# INLINE RATHER THAN A `depends`, for two measured reasons. A `depends` here
# re-runs in whatever process invokes this task, and when that is hk's step it is
# a CHILD mise process — the race CLOUD-220 records for `doctor` one clause up.
# And a build in the DAG would contend with the cargo chain for the target-dir
# lock `hk.pkl` deliberately serialises. `build:release` is the wrong task
# besides: it produces the RELEASE binary for the mediated-call hot path, while
# `helpers.bash:119-134` and `common/mod.rs:154` both resolve a debug one.
#
# Guarded explicitly so the failure is NAMED: under the default `-e` an unguarded
# build would abort the task with mise's own line and nothing about stale
# artifacts, and the pointer is the whole value of this clause.
if ! cargo build --quiet -p batten; then
  echo "::error:: test:bats: the debug binary did not build, so the suite would run against a stale artifact or none. That is CLOUD-592/699's class and the reason this step builds at all." >&2
  exit 1
fi
# BOTH SPELLINGS OF THE ONE SEAM. `$BATTEN_BIN` is honoured by seven
# `mise-tasks/` programs and by the Rust tier; `hooks-wiring-check.sh:219`
# declares the same seam under its own name for its `doctor hooks -J` call and
# only 2 of its 36 cases ever set it. Exported here so every already-honouring
# program is reached with ZERO governed-file edits — `shell edit refused`
# refuses touching any of them, which is the whole reason this change lives in
# the ungoverned task and nowhere else.
BATTEN_BIN="$PWD/target/debug/batten"
if [ ! -x "$BATTEN_BIN" ]; then
  echo "::error:: test:bats: $BATTEN_BIN is missing or not executable after a successful build — the seam would silently fall back to the stale-artifact resolution this change exists to close." >&2
  exit 1
fi
export BATTEN_BIN
# AND ON `PATH`, because the seam above only reaches a program that READS it
# (CLOUD-425). The suites drive `mise-tasks/` programs as subprocesses, and those
# call the engine the way a session does — bare `batten` — so exporting the
# variable alone leaves every such call resolving against whatever the developer
# happened to install, and against NOTHING on a CI runner. Measured: with the
# variable exported and the binary absent from `PATH`, `land-lock`'s heartbeat
# read exit 127 from `batten task read`, took it for "no verdict" per its own
# contract, and never fired the stall bail — six `tests/land-lock.bats` cases red
# in CI and green on any machine with an installed binary. That is the
# stale-artifact class one step over: not the WRONG binary, but no binary at all,
# reported as a policy answer.
PATH="$(dirname "$BATTEN_BIN"):$PATH"
export PATH
HOOKS_WIRING_DIAGNOSIS="$BATTEN_BIN doctor hooks -J"
export HOOKS_WIRING_DIAGNOSIS
# WHICH SUITES, before how many cases (CLOUD-886). The glob that selects this
# step is `mise-tasks/**`, so any byte under there ran all 151 suites — measured,
# correcting one sentence in `land`'s lap-cap message bought a full matrix.
# `batten ci suites` answers "which suites can this diff move" from the declared
# `# subject:` headers, and widens to everything on anything it cannot prove
# inert. Its reason goes to stderr as a pointer.
#
# FAIL OPEN TOWARD COST: a selector that cannot answer at all falls back to every
# suite. The asymmetry is the whole design — a run that is too wide shows up in
# the bill, and one that is too narrow has no symptom at all.
# CLEARED ON A NONZERO SELECTOR (CLOUD-480, found on review of #660). The guard is
# required whichever way the shell is set, which is why it is written as a status
# read rather than an emptiness test: under the default `-e` a bare assignment from
# a failed substitution aborts the task, and without it the substitution leaves its
# PARTIAL output behind. CLOUD-480 measured the second — a selector that died partway
# left partial output in `suites`,
# the emptiness check below then saw a non-empty value, and the fallback never
# fired. A narrow run has no symptom, which is the asymmetry the fallback exists
# to respect, so the guard has to read the status rather than the output.
suites=$(cargo run --quiet -p batten -- ci suites --base "${BASE_SHA:-origin/main}") || suites=""
if [ -z "$suites" ]; then
  echo "::error:: test:bats: the suite selector produced nothing, so falling back to every suite rather than narrowing on an answer it could not give." >&2
  suites=$(git ls-files --cached --others --exclude-standard -- 'tests/*.bats')
fi
# COMPUTED FROM THE SELECTED SET, BY THE SAME LIST THAT CHOSE IT (CLOUD-886 §2).
# `ran == expected` exists to catch "a suite that got faster by running fewer
# tests" (CLOUD-386), which is exactly what selection does on purpose — so an
# `expected` derived from a second list would be the defect wearing the fix's
# clothes.
#
# `awk` over the working tree rather than `git grep` over the index, and that is
# a fix rather than a rewrite: git grep counts TRACKED files only, so a suite
# added but not yet committed ran without being counted and failed the assertion
# below with `ran` one too many. Measured at `2704 of 2696`. Taken before bats
# runs, so bats' own preprocessing of a suite file cannot move it either.
expected=$(awk '/^@test /{n++} END{print n+0}' $suites)
if [ "$expected" -lt 1 ]; then
  echo "::error:: test:bats: counted $expected @test declarations across the selected suites — the count this run is judged against could not be computed, so the run cannot be trusted to have covered the suite." >&2
  exit 1
fi
workers=$(nproc)
# JUNIT RATHER THAN TAP, and the report is KEPT rather than deleted (CLOUD-352).
# Both halves are one change with one reason: TAP names a case but not the file
# it came from, so a per-suite cost figure cannot be recovered from it, and the
# `mktemp -d` + `trap rm` threw away the only per-case timings this repository
# ever produces. `batten record suites` reads what this leaves behind, so the
# corpus costs no second execution of a 2,500-case suite.
#
# `ran` counts `<testcase` elements, which is the same population TAP's
# `^(ok|not ok) ` matched — verified equal at 2558 on one tree before the swap.
# The anti-vacuity assertion below is unchanged in meaning: a suite that got
# faster by running fewer cases still fails it (CLOUD-386).
#
# Under `target/`, which is gitignored, so a run cannot dirty the tree and
# `tree-clean` stays green.
report=./target/bats-report
rm -rf "$report" || exit 1
mkdir -p "$report" || exit 1
started=$(date +%s)
if ! bats --print-output-on-failure --parallel-binary-name rush --jobs "$workers" --no-parallelize-within-files --report-formatter junit --output "$report" $suites; then exit 1; fi
elapsed=$(($(date +%s) - started))
ran=$(grep -o '<testcase' "$report/report.xml" | wc -l | tr -d ' ')
if [ "$ran" != "$expected" ]; then
  echo "::error:: test:bats: $ran of $expected cases reported by the runner. A suite that got faster by running fewer tests is the failure this asserts against." >&2
  exit 1
fi
# WHAT THIS RUN COST, AGAINST WHAT THE CORPUS RECORDS (CLOUD-386, third
# measurement). The count assertion above catches a run that got faster by running
# fewer; this reports the opposite and equally silent failure — workers that make
# the run SLOWER than running the same suites one at a time.
#
# A REPORT, NOT A REFUSAL, and the reason is measured rather than cautious.
# CLOUD-386 read CI's 1435.7s at 2 workers against a 1249.1s recorded serial total
# and called parallelism net-negative. But `RESULTS.md` is regenerated LOCALLY, so
# that comparison sets a slow runner's parallel wall against a fast box's serial
# cost, and part of what it measures is the runner. On one machine it inverts: the
# 2026-08-28 sweep above ran this step in 829s at 2 workers against the same
# corpus's 1367s. `policy/suite-cost-corpus.rego` states the general form — a
# gate demanding a duration "would be red on every second run and would be
# bypassed within a day" — and this one would have been red on every CI run with
# no setting able to clear it, since that sweep found every de-oversubscription
# slower.
#
# So the number is REPORTED and the mechanism is gated one level up: the
# `bats-invocation` row refuses a body that stops measuring, which is a property of
# the commit rather than of the machine it ran on.
#
# THE COMPARISON IS OVER THE SELECTED SUITES, not the corpus total, for the reason
# the `expected` count is (CLOUD-886 §2): selection narrows on purpose, so a whole-
# corpus total would make every narrowed run read as comfortable.
#
# `bench/suites/RESULTS.md` is the recorded side. It is a CORPUS, regenerated
# deliberately by `batten record suites --write`, never by this run — so this
# compares against a number a person can see change in a diff, rather than against
# itself.
#
# A SELECTED SUITE THE CORPUS DOES NOT RECORD IS COULD-NOT-LOOK, and says so:
# `suite-cost-corpus` owns membership, and a new suite's first run must not be read
# against a total that does not include it.
recorded=$(printf '%s\n' $suites | awk '
  FNR == NR { want[$1] = 1; next }
  /^\| *[0-9]/ { gsub(/[`|]/, " "); if ($3 in want) { total += $1; seen[$3] = 1 } }
  END { for (s in want) if (!(s in seen)) { print "-"; exit } printf "%.0f\n", total }
' - bench/suites/RESULTS.md)
if [ -z "$recorded" ] || [ "$recorded" = "-" ]; then
  echo "::error:: test:bats: bench/suites/RESULTS.md does not record every selected suite, so ${elapsed}s has nothing to be judged against. Regenerate it with \`batten record suites --write\`." >&2
elif [ "$elapsed" -ge "$recorded" ]; then
  echo "::error:: test:bats: ${elapsed}s wall at $workers workers against ${recorded}s recorded serial for the same suites — the workers cost more than they bought on this machine. Reported, not refused: the corpus and this run may not come from comparable hardware (CLOUD-386)." >&2
fi
echo "test:bats: $ran/$expected cases, $(printf '%s\n' $suites | wc -l | tr -d ' ') suite(s), $workers workers, ${elapsed}s wall vs ${recorded}s recorded serial"
cargo run --quiet -p batten -- step record test:bats || true
'''

[tasks.hooks]
description = "Run the git-hook gate (fmt, lint, test) through hk — the same hk.pkl the pre-commit hook uses, in check-only mode"
run = "hk check --all"

# The green verdict and the poll around it, both decided by the engine now
# (CLOUD-1143). These two tasks are ADAPTERS and say so.
#
# `batten checks green` and `batten pr watch` answer in the binary's own exit
# table — `exit.rs` is total with no per-verb exception — where green is 0, a
# head that is red (or, for `checks green`, not yet answered) is 2, an unusable
# roster is 1 and an unreadable reading is 3. The shell readers still hold the
# PREDECESSORS' contract: 0 green, 1 red, 2 could not look, 3 not yet. Three of
# the four numbers moved, so a bare call would invert `land`'s own branches — its
# `case "$rc" in 1 | 3` means "needs a fresh run", and under the new codes that
# set is a config error and an unreadable reading, exactly the two it must NOT
# redraft on.
#
# So the translation lives here, in one ungoverned place, rather than in the
# governed programs `shell-retirement` will only accept a path substitution in.
# It is temporary by construction: each reader that retires onto the engine stops
# needing it, and when the last one goes these tasks go with them.
#
# THE FETCH LIVES HERE TOO, and that is the design rather than a leftover. The
# verbs decide over a reading; WHERE the reading comes from is the consumer's, so
# the endpoint, the credential and the roster's own home stay in this file and
# the crate holds no name belonging to anybody's CI (non-negotiable rule 1).
# `ci wait` is the exception that proves it: it polls, so it takes its own
# readings — through a client it names and a repository this file supplies.
#
# FAIL SAFE IN BOTH DIRECTIONS. An engine code neither adapter recognises maps to
# "could not look", which every reader treats as "do not strand the head" rather
# than as a verdict — so a future code cannot be read as green, and cannot be
# read as red either.
# CLOUD-1148's first retirement, and the shim is the whole of why the task name
# survives. `mise-tasks/verified.sh` is gone; `batten receipt verified` composes
# the same three reads — a `verify` receipt for this exact HEAD, a
# `linear-check` receipt, and the `origin/main` it was taken against still being
# current — through `receipt::validity`, which is the one implementation of that
# predicate rather than a second reader of the same files.
#
# THE EXIT CODES ARE TRANSLATED, AND THAT IS NOT A WORKAROUND. The engine has one
# table with no per-verb exception (non-negotiable rule 5): `2` is the policy
# verdict everywhere, and `1`/`3` are the only codes a Batten failure produces.
# The predecessor spelled an unverified head `1` and an unusable checkout `2` —
# the table inverted. Callers read the old numbers, so this maps them back, which
# is the shim shape CLOUD-1170 established and the reason `land.sh` and
# `tests/tree-clean.bats` need no edit to keep working.
# CLOUD-193's precondition, ported off `mise-tasks/tree-clean.sh` under
# CLOUD-1753.
#
# THE TASK NAME SURVIVES THE MIGRATION, for `perf-pair`'s reason and with a
# sharper edge here: `verify:gated` names it in BOTH `depends` and its body, and
# two governed suites — `tests/verify.bats` and `tests/task-fail-closed.bats` —
# assert the literal string in each place, the second including that the body's
# call PRECEDES the `receipt record` it guards. A renamed task would need those
# suites edited, which a retirement may not do.
#
# A ONE-LINE WRAPPER, and the whole predicate is the engine's. `receipt clean`
# and the guard inside `receipt record` both call one `receipt::tree_state`, so
# this is a call site rather than a second authority — which is what the retired
# program could never quite be, since its own header had to argue the point in
# prose instead of resting on a shared function.
#
# `run = "…"` rather than a `'''` block, deliberately:
# `inline-task-bodies-not-growing` ratchets the multi-line form, and a wrapper
# that needs one line must not spend the budget a real body would.
# CLOUD-65's install contract, ported onto `release install` under CLOUD-1716.
#
# THE TASK SURVIVES THE PROGRAM, deliberately. `hk.pkl`'s gate, two release
# workflows and `README.md` all name `mise run install-check`, and mise
# auto-discovered that name from the file. Deleting the file without declaring
# the task would retire the program and the NAME together, breaking four callers
# that are not this campaign's to touch.
#
# A ONE-LINE WRAPPER, and the whole predicate is the engine's — `tree-clean`'s
# shape and its reason: `inline-task-bodies-not-growing` ratchets the multi-line
# form, and a wrapper that needs one line must not spend a real body's budget.
[tasks."install-check"]
description = "Gate: the install path resolves the assets the release actually publishes, and no binary is committed"
run = "cargo run --quiet -p batten -- release install"

# The release build and archive (CLOUD-843), ported off `mise-tasks/dist.sh` onto
# `batten dist`. THE TASK SURVIVES THE PROGRAM for `install-check`'s reason:
# `release-artifacts.yml` runs `mise run dist <target>` per matrix leg, and mise
# auto-discovered that name from the file. `cargo run --locked` because the
# release job has no installed engine and builds the tagged tree it ships; the
# host build and the target build share nothing, so the leg pays both.
[tasks.dist]
description = "Effect: build the release binary for a target and stage its archive in dist/, printing archive= and binary= pointers"
run = "cargo run --quiet --locked -p batten -- dist"

[tasks."tree-clean"]
description = "Gate: the working tree is the bytes at HEAD, so a receipt keyed to HEAD names what was actually validated"
run = "cargo run --quiet -p batten -- receipt clean"

[tasks."verified"]
description = "Gate: is HEAD verified? Answers from the receipts, so no shell idiom can mask the verdict"
# THE ENGINE'S OWN TABLE, WITH NO TRANSLATING SHIM (CLOUD-1991). The body this
# replaced inverted `receipt verified`'s `2`/`1`/`3` back to the retired
# program's `1`/`2` and printed a remedy naming `mise run verify`. Nothing reads
# the old numbers any more: `land` is `batten land lap`, which asks the receipts
# in-process, and no workflow, task or `batten.toml` row runs this name. A shim
# kept for callers that no longer exist is a second exit table with no reader, so
# the name now answers on the one table every other verb answers on: `0`
# verified, `2` not verified, `1`/`3` the question could not be asked.
run = "cargo run --quiet -p batten -- receipt verified"

# ─── `mise run land`, the name every caller still uses (CLOUD-1148) ──────────
#
# `mise-tasks/land.sh` was a FILE task, so deleting the program deletes the task
# name with it — and `mise run land` is invoked by NAME from AGENTS.md,
# `.claude/rules/commits.md`, `.claude/settings.json` and several `batten.toml`
# remedies. A shim keeps every one of those call sites byte-identical, which is
# the same reason `[tasks."verified"]` and `[tasks."task-registry"]` exist and
# why those retirements touched no caller.
#
# NO EXIT TRANSLATION, unlike `verified`'s shim. That one inverts a table because
# its predecessor answered `1` unverified and `2` could-not-look; this verb was
# always the engine's own table — `0` landed, `2` a decision the caller must make
# (a conflict or a refused gate), `3` the laps ran out with no answer — so the
# codes pass straight through and a wrapper case statement would be a second
# authority over them.
#
# THE BASE IS A POSITIONAL WITH A DEFAULT, because `batten land lap` requires one
# and the predecessor read `origin/main` throughout. The default is spelled here
# rather than compiled in: which ref is trunk is this repository's own fact, and
# `crates/batten` refusing to guess it is non-negotiable rule 1 (see
# `run_land_fast_forward`'s `$LAND_WORKFLOW` refusal for the same shape).
#
# DECLARED IN `usage`, NOT CALLED AS A TEMPLATE FUNCTION (CLOUD-1991): the inline
# `arg(...)` call made the body read as shell, and the usage spec declares the
# same optional positional with the same default, which mise then binds.
[tasks.land]
description = "Land this branch's PR: rebase, verify, push, wait for CI, /fast-forward — lapping until it merges or a rebase conflicts"
usage = 'arg "[reference]" default="main" help="the trunk to land onto"'
run = 'cargo run --quiet -p batten -- land lap "{{usage.reference}}"'

# Is HEAD linear on the CURRENT origin/main, so the PR can fast-forward-land?
# Retired off `mise-tasks/linear-check.sh` under CLOUD-1717; the name and the
# `linear-check` receipt it mints are unchanged, because `verify`'s receipts,
# `[ready] checks`, `verified_by` and the ready guard all name it.
#
# THE FETCH FAILS CLOSED, and that was the whole reason this was once a file with
# `set -e`: a failed fetch that fell through compared a stale main to itself,
# passed, and minted a receipt the ready guard then accepted. The verb below
# holds that property in-process (CLOUD-1991); `crates/batten/tests/it/
# linear_check.rs` pins it over the compiled binary.
[tasks."linear-check"]
description = "Gate: HEAD is linear on the current origin/main, so the PR can fast-forward-land"
# THE QUESTION IS `batten land linear` SINCE CLOUD-1991; the receipt stays here.
# The fetch, the fail-closed arms and the merge-base comparison the body spelled
# in shell are the verb's, through the fetch a landing lap already makes — so
# "the trunk as the loop sees it" has one reading. The verb answers `0` linear,
# `2` behind (the verdict `verify` laps on, as the body's `exit 2` was), and `3`
# where it could not look: a fetch that did not complete, or a SHALLOW clone,
# which it refuses and names the remedy for rather than deepening in place.
#
# THE RECEIPT IS AN ARGV STEP, NOT A VERB FLAG: which receipt names this
# question is this repository's vocabulary (`[ready] checks`, `verify`'s
# receipts). mise runs it only after the verb answered `0`, and a receipt that
# will not write fails the task — the two properties the body's `set -uo
# pipefail` and `|| { …; exit 1; }` were carrying.
run = [
  "cargo run --quiet -p batten -- land linear main",
  "cargo run --quiet -p batten -- receipt record linear-check",
]

# The external analyzer's verdict on one SHA (CLOUD-441), retired off
# `mise-tasks/sonar-gate.sh` under CLOUD-1717. The DECISION was always
# `checks-green`'s — latest run per name (CLOUD-436), `cancelled` and `skipped`
# not an answer (CLOUD-363), the least conclusive of an unorderable pair — and
# the program restated it in awk. It is now `batten checks green` over a roster
# of one name that may be absent: an analyzer that declines to grade produces no
# run, and failing on that would wedge every PR it has no opinion about.
#
# What stays here is the fetch and its one distinction: a SHA the remote has
# never seen (404 unauthenticated, 422 "No commit found" authenticated) is "no
# answer yet", because `land` mints a commit every lap; any other failed read is
# could-not-look. Nothing in the landing path reads this since CLOUD-897; it is
# the reading `mem:workflow/sonar-scope` runs by hand.
#
# Answers in the predecessor's table like its sibling adapters: 0 green, 1 red,
# 2 could not look, 3 no answer yet. `SONAR_GATE_RUNS` injects a reading and
# `SONAR_GATE_GH` the client, which is how the tier runs offline.
[tasks."sonar-gate"]
#MUTANT-SUITE crates/batten/tests/it/sonar_gate.rs
#MUTANT red-analysis-passes|s@^\t\techo "::error:: \$check is red on@\t\texit 0; echo "@|a_failed_or_timed_out_analysis_is_red_and_names_only_a_pointer
#MUTANT unpushed-read-as-unreadable|s@if grep -qiE 'HTTP 404@if false \&\& grep -qiE 'HTTP 404@|an_unpushed_sha_is_no_answer_yet_at_404_and_at_an_authenticated_422
#MUTANT absent-unread|s@END { exit !found }@END { exit found }@|absent_is_not_a_veto_and_an_empty_reading_takes_no_network
#MUTANT red-filter-dropped|s@\&\& \$2 !~ /^(success@\&\& $2 ~ /^(success@|an_unorderable_pair_fails_closed_and_points_at_the_red_one
description = "Gate: the external analyzer's verdict on this SHA (0 pass / 1 red / 2 could not look / 3 no answer yet)"
shell = "bash -c"
run = '''
{% raw %}
set -uo pipefail
if [[ -n "${BATTEN_BIN:-}" ]]; then batten=("$BATTEN_BIN"); else batten=(cargo run --quiet -p batten --); fi
check="${SONAR_CHECK_NAME:-SonarCloud Code Analysis}"
sha="${SHA:-$(git rev-parse HEAD 2>/dev/null || true)}"
could_not_look() { echo "::error:: sonar-gate: $*" >&2; exit 2; }
# `${VAR+set}`: an explicitly empty reading is a SHA carrying no run yet.
if [[ -n "${SONAR_GATE_RUNS+set}" ]]; then
	runs="$SONAR_GATE_RUNS"
else
	[[ -n "$sha" ]] || could_not_look "no SHA to judge: neither \$SHA nor a git HEAD."
	repo="${REPO:-}"
	[[ -n "$repo" ]] || repo='{owner}/{repo}'
	err=$(mktemp)
	trap 'rm -f "$err"' EXIT
	if ! runs=$("${SONAR_GATE_GH:-gh}" api "repos/$repo/commits/$sha/check-runs?per_page=100" \
		--jq '.check_runs[]? | "\(.status)\t\(.conclusion // "-")\t\(.name)\t\(.started_at // "")\t\(.id // 0)"' 2>"$err"); then
		# The message beside the code: a bare 422 is any validation refusal.
		if grep -qiE 'HTTP 404|not found|no commit found for sha' "$err"; then
			echo "sonar-gate: $sha carries no check-runs at all — not pushed yet, or the remote has never seen it."
			exit 3
		fi
		could_not_look "could not read the check-runs for $sha. A reading this gate cannot take is not a pass."
	fi
fi
# Absent is decided before the engine is asked, only to say so in words: the
# roster below would call it green either way.
if ! awk -F'\t' -v want="$check" '$3 == want { found = 1 } END { exit !found }' <<<"$runs"; then
	echo "sonar-gate: no $check run on $sha — absent is not a verdict, and not a veto."
	exit 0
fi
answer=$(printf '%s\n' "$runs" | "${batten[@]}" checks green \
	--required "$check" --absent-ok "$check" \
	--answered "${CI_ANSWERED_CONCLUSIONS:?the answering conclusions are declared in [env]}" 2>&1)
rc=$?
case "$rc" in
0)
	echo "sonar-gate: $check is green on $sha"
	exit 0
	;;
2)
	if [[ "$answer" == *"checks green: red"* ]]; then
		# Pointer-only: the conclusion and the name, never the analysis.
		# A conclusion that IS red, never merely the last line: an unorderable
		# success/failure pair is red, and must not print `success` beside exit 1.
		conclusion=$(awk -F'\t' -v want="$check" '
			$3 == want && $1 == "completed" && $2 !~ /^(success|neutral|skipped|cancelled)$/ { print $2; exit }
		' <<<"$runs")
		printf '%s\t%s\n' "$conclusion" "$check"
		echo "::error:: $check is red on $sha. Read the analysis on the check-run's details page and fix it locally." >&2
		exit 1
	fi
	echo "sonar-gate: not an answer yet on $sha — $check has no verdict (pending, skipped or cancelled)"
	exit 3
	;;
3)
	# A dead-end — skipped or cancelled — is terminal, but still no verdict.
	echo "sonar-gate: not an answer yet on $sha — $check has no verdict (pending, skipped or cancelled)"
	exit 3
	;;
*) could_not_look "the engine could not judge the reading for $sha" ;;
esac
{% endraw %}
'''

[tasks."checks-green"]
description = "Is this SHA green over the required check set? (0 green / 1 red / 2 could not look / 3 no answer yet)"
shell = "bash -c"
run = '''
set -uo pipefail
sha="${SHA:-$(git rev-parse HEAD 2>/dev/null || true)}"
# `${VAR+set}` rather than emptiness: an explicitly empty reading is a real state
# — a SHA with no check runs yet — and must answer "no answer yet" rather than
# fall through to the network.
if [[ -n "${CHECKS_GREEN_RUNS+set}" ]]; then
  runs="$CHECKS_GREEN_RUNS"
else
  if [[ -z "$sha" ]]; then
    echo "::error:: checks-green: no SHA to judge: neither \$SHA nor a git HEAD." >&2
    exit 2
  fi
  repo="${REPO:-}"
  [[ -n "$repo" ]] || repo='{owner}/{repo}'
  runs=$(gh api "repos/$repo/commits/$sha/check-runs?per_page=100" \
    --jq '.check_runs[]? | "\(.status)\t\(.conclusion // "-")\t\(.name)\t\(.started_at // "")\t\(.id // 0)"' 2>/dev/null) || {
    echo "::error:: checks-green: could not read the check runs for $sha. A reading this gate cannot take is not a pass." >&2
    exit 2
  }
fi
answer=$(printf '%s\n' "$runs" | batten checks green \
  --required "${CI_REQUIRED_CHECKS:-}" \
  --absent-ok "${CI_ABSENT_OK_CHECKS:-}" \
  --answered "${CI_ANSWERED_CONCLUSIONS:-}" \
  --fanin "${CI_FANIN_CHECK:-}" 2>&1)
rc=$?
printf '%s\n' "$answer"
# THE DISCRIMINATION COMES OFF STDOUT, which is where the engine puts it on
# purpose: red and not-yet share an exit code because they differ only in whether
# to ask again, never in whether the head may land, so a caller that reads only
# the code holds either way. This adapter is the caller that does read it, and it
# is the only one that needs to.
case "$rc" in
0) exit 0 ;;
2)
  case "$answer" in
  *"checks green: red"*) exit 1 ;;
  *) exit 3 ;;
  esac
  ;;
# A DEAD END AND A COULD-NOT-LOOK SHARE EXIT 3 FROM THE ENGINE (CLOUD-497), and
# they want opposite things from this adapter's caller: one is worth another
# look, the other never will be. So this arm reads the word off stdout, exactly
# as the arm above reads red from not-yet, and keeps the shell's own four-code
# table intact — a masked terminal set is "no answer yet" in that vocabulary,
# which is 3, while anything else at this code is still "could not look".
3)
  case "$answer" in
  *"checks green: dead-end"*) exit 3 ;;
  *) exit 2 ;;
  esac
  ;;
*) exit 2 ;;
esac
'''

[tasks."ci-wait"]
description = "Block until every required check on this SHA reaches a verdict (0 green / 1 red / 2 could not look / 3 no verdict is coming)"
shell = "bash -c"
run = '''
set -uo pipefail
sha="${SHA:-$(git rev-parse HEAD 2>/dev/null || true)}"
if [[ -z "$sha" ]]; then
  echo "::error:: ci-wait: no SHA to judge: neither \$SHA nor a git HEAD." >&2
  exit 2
fi
args=(--sha "$sha"
  --interval "${CI_WAIT_INTERVAL:-1}"
  --required "${CI_REQUIRED_CHECKS:-}"
  --absent-ok "${CI_ABSENT_OK_CHECKS:-}"
  --answered "${CI_ANSWERED_CONCLUSIONS:-}"
  --fanin "${CI_FANIN_CHECK:-}")
[[ -z "${REPO:-}" ]] || args+=(--repo "$REPO")
# The two progress signals are the poll's (CLOUD-499); which program writes them
# down is this repository's, which is why the engine takes it as a flag. Silent
# when $BATTEN_TASK_PID is unset, which is every caller but `land`.
[[ -z "${BATTEN_TASK_PID:-}" ]] || args+=(--progress "batten task" --progress-id "$BATTEN_TASK_PID")
batten pr watch "${args[@]}"
rc=$?
# NO "NOT YET" ARM, AND NOW ONE "NOT EVER" ARM (CLOUD-497). The claim that the
# poll does not return until the answer is in was true of every state but one: a
# required set that is fully terminal with a masked name mints nothing further,
# so the poll would have returned only by being killed — measured at 48 minutes
# on PR #378 over a head whose CI was green, holding the landing lease against a
# queue the whole time. The engine now ends that wait at `Internal`, and this
# passes it through as 3 rather than flattening it onto could-not-look, because
# `land` must tell a closed question from an unread one: the first stops and
# releases the lease, the second laps.
case "$rc" in
0) exit 0 ;;
2) exit 1 ;;
3) exit 3 ;;
*) exit 2 ;;
esac
'''

[tasks."task-registry"]
description = "Record what a long-running task is doing, so its liveness and phase can be read without a log"
# CLOUD-425's writer half, ported off `mise-tasks/task-registry.sh` under
# CLOUD-843 and retired onto the `task` noun.
#
# THE TASK NAME SURVIVES THE MIGRATION, for `claim-check`'s reason: `land.sh`
# calls `mise run task-registry <verb> ...` and may not be edited, so keeping the
# name is what makes this retirement reach the program it claims. The other
# caller this paragraph once named, `step-receipt`, retired onto `batten step`
# (CLOUD-843), which announces its phase through the `task` noun in-process
# rather than through this task.
#
# THE TRANSLATION RETIRED (CLOUD-1991). `land-lock.sh` and `step-receipt` were
# the callers written against the retiring program's codes. `land-lock.sh` is
# gone. `[tasks.step-receipt]` is NOT gone on this branch — it retires onto
# `batten step`, which writes the registry in-process, in CLOUD-843's P4 — and
# until then its `phase` call reaches the engine's table instead of the
# translated one. It reads no code: the call is `>/dev/null 2>&1 || true`, so
# either table leaves it unchanged. So this name is the verb itself, on the one
# contract's table, and mise appends the caller's arguments to it.
run = "batten task"

[tasks.singleton]
description = "Refuse to start a task that is already running in this clone, naming the process that holds it"
# CLOUD-428, ported off `mise-tasks/singleton.sh` under CLOUD-843 and retired
# onto the `singleton` noun.
#
# THE TASK NAME SURVIVES THE MIGRATION, and here that is the whole of the
# retirement's reach: `land.sh` calls `mise run singleton acquire|release` by
# NAME, never by path, so keeping the name means `land.sh` and `tests/land.bats`
# are not touched at all.
#
# THE TRANSLATION RETIRED WITH ITS LAST CALLER (CLOUD-1991): `land.sh` was the
# only program reading the old `1`/`2`, and `land` is `batten land lap` now. The
# name is the verb on the one contract's table, with the caller's arguments
# appended by mise.
run = "batten singleton"

[tasks.alive]
description = "What batten tasks are running right now, and what phase each is in — one call, no log reading"
# CLOUD-425's reader half, ported off `mise-tasks/alive.sh` under CLOUD-843.
#
# `--program-root` is the CONSUMER'S fact and lives here for that reason
# (non-negotiable rule 1): corroborating that a live pid is still the task that
# registered it means matching the task's name inside the process's own cmdline,
# and where this repository keeps its programs is not something `crates/batten`
# may know. The engine REQUIRES the flag rather than defaulting it, because a
# wrong root fails silently — an unmatched corroboration reads as alive, so the
# registry would simply never report a crash.
#
# A one-line shim rather than a multiline body, and the distinction is the
# `inline-task-bodies-not-growing` ratchet's own: that row exists to count net-new
# inline SHELL, and its comment records why a one-line delegation is excluded —
# "retiring a shell task into the engine leaves a one-line shim, which raises that
# count while lowering real bash. A row that denies its own campaign's wins is
# worse than the hole it closes."
#
# THE PROSE MAY NOT SPELL THE PATTERN. That ratchet matches a literal substring,
# so a comment quoting the opener IS an occurrence — measured here, this block
# raised the count from 31 to 32 while the task below it is a one-liner. Describe
# the shape, never write it. (`batten.toml`'s own `no-new-ignores` row records
# the same defect one file over, where an unanchored `#[ignore]` counted five in
# a tree containing zero disabled tests.)
#
# The exit code moves with the port: could-not-look is 3 here where the retiring
# program spelled it 2, which the ledger records as a deliberate change rather
# than translating back in a wrapper nobody reads.
run = "batten task alive --program-root mise-tasks"

[tasks."ci:quick"]
description = "The hk gate minus the slow tier — what a diff that cannot move the slow tier pays for (CLOUD-398)"
# `--profile '!slow'` is the SAME selection `.claude/hooks/git-hook` already uses
# per commit, so this adds no new mechanism: hk profiles are additive, an untagged
# step always runs, and the six steps tagged `slow` are the expensive ones. The
# tier is not a second authority — `hk.pkl` defines it and `hook-profile-check`
# holds `check` to still running it, which is why `[tasks.hooks]` below is
# deliberately left as the full `hk check --all`.
#
# NOT CARGO-FREE, and the comment says so because the measurement is misleading
# otherwise: 49 steps in 14s against a warm `target/`, but `policy-budget` shells
# `cargo run -p batten`, and `cargo-fmt`, `schema-check` and `config-lint` reach
# the binary too. On a cold runner this pays a `batten` debug build first.
run = "hk check --all --profile '!slow'"

[tasks.ci]
description = "Everything CI runs"
# fmt-check + lint + test come from the SAME hk.pkl the pre-commit hook runs
# (via `hooks`), so CI exercises the hook config itself; `deny` rounds it out.
depends = ["hooks", "deny"]

[tasks.verify]
description = "Full local pre-flight — run this before marking any draft PR ready"
shell = "bash -c"
# NO `depends`, and that absence is the whole of CLOUD-407. mise runs a
# dependency BEFORE the body and propagates its exit code VERBATIM, so every
# code a `depends` task can mint escaped this task unmapped — including the one
# code that means something else here. `batten check` exits 2 for a policy
# violation (house-style §6-§7, non-negotiable rule 5) and reaches `verify`
# through `hooks` -> `ci`; `tree-clean` and `semver` each exit 2 for "could not
# look". `land` reads a 2 from `verify` as "main moved under the run, lap", so a
# real refusal of the tree read as the harmless rebase race and lapped to the
# backstop — measured on PR #322, eight laps and ~13 minutes, with three named
# `path:line` pointers nobody surfaced.
#
# So this task is now a MAPPER and nothing else. It owns exactly one decision:
# which failures mean "lap" and which mean "stop". Everything that can fail for a
# content reason lives in `verify:gated` and reaches here through one guarded
# call, which flattens whatever code it carried to 1.
#
# The ordering changed with the split, deliberately: `linear-check` now runs
# BEFORE the expensive gate set rather than after it. That is the cheap staleness
# question preceding the costly one, which is the landing loop's own economy —
# a branch that is behind is going to lap regardless, and paying for `ci` and
# `cross-check` first buys nothing. `tree-clean`'s fail-fast is unaffected: it is
# still in `verify:gated`'s `depends`, which mise runs in parallel.
run = '''
# A HEAD THIS GATE ALREADY PROVED IS NOT PROVED TWICE (CLOUD-1891). The receipt
# the last line of `verify:gated` writes is valid only for THIS head, taken in
# THIS checkout, against the `origin/main` that resolves now — so fetch first,
# as `linear-check` would, and a trunk that moved invalidates it. A clean tree
# too, because the receipt attests HEAD's bytes and a dirty tree is not them.
# Anything short of all three falls through to the full gate below.
if git fetch -q origin main 2>/dev/null && mise run tree-clean >/dev/null 2>&1 \
  && cargo run --quiet -p batten -- receipt status verify >/dev/null 2>&1; then
  echo "verify: fast-forward-green — a valid receipt already covers this HEAD against current origin/main"
  exit 0
fi
# A task body does not run under `set -e` (see rules/toolchain.md), so
# every step whose failure changes the verdict is guarded by hand. Unguarded,
# a failed linear-check let this body run commit-lint against a stale
# origin/main, write the receipt below, and print "fast-forward-green" — a
# silent false green in the one gate that decides whether CI minutes get spent.
# The code is PROPAGATED, not flattened (CLOUD-318). `linear-check` answers 2
# for "measured, and this branch is behind" and 1 for the two environment
# refusals — a fetch that failed, an origin/main that does not resolve. A caller
# driving a loop laps on the first and stops on the second, and it can only do
# that if the distinction survives this guard.
#
# This is the ONLY `exit 2` in the task, and that is now a checkable property
# rather than an intention (tests/verify.bats). Everything else is a stop.
#
# THE CLAIM RECEIPT, FIRST (CLOUD-431), because it decides whether this branch
# should exist at all — a cheaper question than any below it, and a different
# kind of question from all of them.
#
# `batten hook`'s `claim-needs-receipt` row is the fast feedback for this and it
# is a HOOK, which means it can be unloaded. So the load-bearing half sits here,
# in the one task every landing path runs. `claim-check` mints the receipt on its
# pullable path only, so its presence attests that some issue was checked for a
# competitor AND for refinement that predates this session.
#
# Detached HEAD is exempt, the same carve-out the engine makes deliberately:
# a rebase detaches, and refusing there would fail every lap of `land` for a
# state that is not a defect.
#
# ANY OF THE THREE SATISFIES THIS, AND THEY ARE THREE BECAUSE THEY ATTEST THREE THINGS
# (CLOUD-693). `claim.<branch>` says a human or agent read a refined issue and
# checked it for a competitor. Nothing on a BOT branch can say that honestly —
# there was no session and the row was derived rather than refined — so
# `batten claim bot` mints `bot.<branch>`, which attests what is
# actually true there: an allowlisted bot opened the head, its diff touches only
# manifests the lane owns, and its body names the row derived from that diff.
# A THIRD kind joins them for the same reason (CLOUD-1295): a licence-carry
# branch has no session and no bot, and `batten claim carry` attests that its
# diff only carries rows the base table already maps.
# Widening the agent receipt to cover bots would have made it mean less
# everywhere, which is the trust path CLOUD-431 exists to prevent.
# RECLAIM BEFORE ANYTHING IS SPENT (CLOUD-766). `target/deps` grows ~1.5-2 GB per
# lap — a rebase mints a new SHA, which changes every artifact's metadata hash,
# and cargo never reclaims the superseded copy — so a session that lands more
# than a couple of issues runs the volume out. Measured twice in one session.
#
# It is FIRST, ahead of even the claim receipt, because it is the only guard here
# whose failure the others cannot survive: with no disk, every question below
# answers "failed" for a reason that has nothing to do with the tree. Exhaustion
# otherwise arrives as a rustc IO error inside a test run, under a `land` line
# telling the author to fix their own diff.
#
# Exit 1 is "still short with nothing left to reclaim", which is a stop, not a
# lap: `land` reads 2 as "main moved, try again" and nothing about a full volume
# improves by rebasing.
# THE SLOW-TIER DECISION, PROVED LOCALLY RATHER THAN IN CI. The `ci` job asks
# `ci-slow-needed` whether a diff can move the hk slow tier and pays for it only
# when the answer is yes, so a wrong answer is a verdict silently not taken. The
# retired program carried a `--probe` mode as its own gate; the list is
# `[ci] slow_inert` now and the probes are `path list loose`
# (`policy/ci-slow-inert.rego`), so `batten check` runs them with every other row
# and NO separate invocation belongs here — one added below was answered by this
# task's own `cargo` stub in `tests/verify.bats` and would have passed vacuously.
# (`ci-local-parity` property 3 is satisfied by the name appearing in this block.)

# THIS IS THE LAP-OPEN BOUNDARY. Its twin at the end of `verify:gated` closes
# the lap this admits, which is what makes the floor an invariant rather than a
# precondition (CLOUD-861).
#
# THE ONE-WAY GUARD STAYS, and that is a finding about CLOUD-1153 rather than a
# preference. That row wants three messages here, because this line reports ANY
# non-zero as "not enough disk" — so a `batten` refusing for a config reason is
# reported as a full volume, which is the misattribution the row is about, one
# layer out. It cannot be written HERE: `tests/verify.bats`'s "a volume that
# cannot be recovered is a STOP, not a lap" pins exit 1 to that exact phrase, and
# `shell edit refused` refuses an edit to a bats suite with no override route
# and no `bypass_env`. So CLOUD-1153 is a row whose §1 is written in the wrong
# shape — it needs the classification where a gate can already see it, not a
# fourth authority in this body — and it is left on the board rather than
# smuggled through a governed file.
if ! mise run target-prune; then
  echo "::error:: verify: not enough disk to run the gate, and pruning did not recover it — the refusal above names free space and the floor. No receipt written." >&2
  exit 1
fi
# THE LAP IS OPEN, AND ONLY ITS OWN CLOSE MAY PRUNE IT (CLOUD-1913). Everything
# the gate spawns inherits this, so a `build:release` reached from inside —
# `test:bats`'s startup repair — no longer escalates mid-gate over the suite's
# fixtures and clippy's tree. The value names this tree, so a fixture elsewhere
# prunes as before. `verify:gated`'s close clears it for its own call.
export BATTEN_PRUNE_LAP_OPEN="$PWD"
# THE TOOLCHAIN, BEFORE ANYTHING IS DECIDED OR WRITTEN (CLOUD-1683). Measured:
# `mise install` wrote `mise ERROR` and exited 0 on a credential failure,
# provisioning reported success, and this task then returned 0 without running a
# single gate — a branch carrying no claim receipt at all reported green, which
# is rule 5 defeated at the one place it cannot be observed.
#
# Fixing the install alone is not enough and that is the load-bearing half: ANY
# absent dependency reproduces it, so the invariant is asserted HERE, over the
# declaration, rather than trusted from upstream of it.
#
# AFTER the reclaim and BEFORE the receipt. After, because a run needs disk
# before it needs tools, and the reclaim's precedence over the receipt is pinned
# textually in `tests/verify.bats`. Before, because the receipt question is
# `cargo run -p batten -- …`: on an unprovisioned tree that fails for the wrong
# reason and gets reported as "no VALID claim receipt", which is the
# misattribution one layer up from the one this row closes.
#
# `mise run`, never `batten doctor toolchain` directly. `tests/verify.bats` stubs
# the task runner and nothing else, answering 0 for any task it was not told
# about; a direct invocation has no stub, would escape to the real PATH inside
# that sandbox, and would redden a suite `shell edit refused` forbids editing —
# retire it whole or leave it alone, and there is no third shape.
#
# Exit 1, never 2: `linear-check`'s behind-verdict is the only 2 this mapper
# mints, `land` reads 2 as "main moved, lap", and nothing about an unprovisioned
# container improves by rebasing.
if ! mise run toolchain-check; then
  echo "::error:: verify: this checkout's toolchain is not provisioned — the refusal above names every declared tool that is not installed, so the gates below would not run at all rather than run and pass. Run \`mise run session:install\`, then verify again. No receipt written." >&2
  exit 1
fi
claim_branch="$(git symbolic-ref --quiet --short HEAD 2>/dev/null || true)"
if [ -n "$claim_branch" ]; then
  # ONE PREDICATE, NOT A SECOND ONE WRITTEN IN SHELL (CLOUD-741).
  #
  # This was `[ -f "$claim_receipt" ]` — a presence test, and therefore strictly
  # weaker than the engine's reader, which also applies CLOUD-516's staleness
  # rule. So a branch restarted with `git checkout -B <name> origin/main` after
  # its PR merged was void to the hook and PASSED here: the exact incident
  # CLOUD-516 was filed for, where a receipt naming CLOUD-230 authorised edits
  # behind four unrelated stories. The backstop was the weaker of the two, which
  # inverts the reason a backstop exists — `claim-needs-receipt` is a HOOK and a
  # hook can be unloaded (CLOUD-187), so when it is, nothing was left that could
  # see staleness at all.
  #
  # It could not simply be taught the rule: writing that comparison a second
  # time, in a second language, with nothing holding the two in agreement, is how
  # this pair drifted in the first place. `receipt status --key branch` exposes
  # `receipt::branch_validity` to the tree surface instead — which a `receipt`
  # RULE structurally cannot reach, since `RuleKind::scopes` pins the kind to the
  # mediated call and `batten check` can never evaluate one.
  #
  # `cargo run` for `batten-check`'s reason: the gate must judge the working
  # tree's engine, not whatever binary was built last.
  claim_line="$(cargo run --quiet -p batten -- receipt status claim --key branch 2>/dev/null)"
  claim_rc=$?
  if [ "$claim_rc" != 0 ]; then
    # A bot branch attests something different and is keyed separately
    # (CLOUD-693), but it is the same predicate over the same receipt shape —
    # `batten claim bot` records a `base` line too, so it gets CLOUD-516's
    # staleness rule here for free rather than needing its own.
    #
    # The remedy names the live verb and only the live verb. It briefly did not:
    # `tests/verify.bats` pins this message's prose, a `.bats` under `tests/` is
    # governed by `shell-retirement`, and the repointing arm could only admit a
    # span that named its callee by PATH — so retiring `bot-issue` left the dead
    # task name alive here with nowhere to put the fix. CLOUD-1299's arm 5 admits
    # a task-name span, so the suite and this line were repointed together and
    # the workaround is gone rather than documented.
    bot_line="$(cargo run --quiet -p batten -- receipt status bot --key branch 2>/dev/null)"
    bot_rc=$?
    if [ "$bot_rc" != 0 ]; then
      # THE THIRD KIND, AND IT IS THIRD FOR THE SAME REASON THE SECOND IS
      # (CLOUD-1295). A licence-carry branch has no session and no bot either:
      # `sbom-actions-currency` opens it, and neither receipt above fits. So
      # `batten claim carry` attests what IS true there — the diff only carries
      # rows whose repo the base table already maps, changing the sha alone, and
      # touches nothing else. Same receipt shape, so CLOUD-516's staleness rule
      # applies here for free rather than needing its own.
      carry_line="$(cargo run --quiet -p batten -- receipt status carry --key branch 2>/dev/null)"
      carry_rc=$?
      if [ "$carry_rc" != 0 ]; then
        # The verdict is printed rather than swallowed: `missing` and `stale-main`
        # carry different remedies, and the pointer line is what tells them apart.
        echo "  $claim_line" >&2
        echo "  $bot_line" >&2
        echo "  $carry_line" >&2
        echo "::error:: verify: this branch carries no VALID claim receipt, so nothing attests that the work on it was pulled from a refined issue. \`missing\` means mint one: run \`mise run claim-check\` with the issue's get_issue payload on stdin, on a bot branch \`batten claim bot\`, or on a licence-carry branch \`batten claim carry\`. \`stale-main\` means a receipt EXISTS but the branch was restarted out from under it (CLOUD-516), so it must be re-claimed rather than trusted. No receipt written." >&2
        exit 1
      fi
    fi
  fi
fi
linear_rc=0
mise run linear-check || linear_rc=$?
if [ "$linear_rc" = 2 ]; then
  echo "::error:: verify: main moved under this branch — rebase and verify again, there is nothing here to fix. No receipt written." >&2
  exit 2
fi
if [ "$linear_rc" != 0 ]; then
  echo "::error:: verify: linear-check could not establish linearity at all — see its message. No receipt written." >&2
  exit 1
fi
# The one call that flattens. Whatever `verify:gated` exited — a `depends` task's
# code, a body step's, a policy verdict's 2 — a content failure is a stop, and it
# leaves here as 1 so no caller can mistake it for the rebase race above.
if ! mise run verify:gated; then
  echo "::error:: verify: a gate refused this tree — read the step's own path:line pointers above, this is not a rebase. No receipt written." >&2
  exit 1
fi
'''

# `ci-task-parity` RETIRED WHOLE (CLOUD-1991), and both of its halves already had
# a home that decides them without a shell loop. "Every task a workflow runs
# resolves with its whole dependency graph" is `policy/task-callable.rego`'s
# `task call missing`: it resolves every workflow step's `mise run <task>`, every
# manifest `depends` entry and every hk step against the tasks this manifest
# defines, as a deny row `batten-check` runs — so a dependency that does not
# resolve is refused wherever it is spelled, which is the graph `mise tasks deps`
# walked one workflow task at a time. "`ci-slow-needed` answers its workflow's
# call shape" is now the task's `usage` spec, which mise validates before the
# body runs, and `crates/batten/tests/it/ci_slow_needed.rs`'s `--head` cases,
# which drive the verb the way `ci.yml` calls it.

[tasks."verify:gated"]
description = "Every gate verify runs, and the receipt — invoked only through `verify`, which maps its exit code"
shell = "bash -c"
# Split out of `[tasks.verify]` for CLOUD-407. Everything here can fail for a
# CONTENT reason, so nothing here needs to preserve a distinct exit code: the
# caller flattens the lot to 1. That is what lets `depends` stay a `depends`.
#
# lock-check is deliberately NOT here. It runs `mise lock` — a remote round
# trip that rewrites the tracked lockfile — so its verdict is "did upstream
# change since this commit", a property of the world rather than of the branch.
# On the landing path that fails a change for drift it did not cause, and
# leaves the mutation in the tree for the next `git add -A` to sweep up. The
# completeness question it was named for is now `lock-complete`, a pure gate in
# hk.pkl; currency runs on a schedule (.github/workflows/lock-currency.yml).
#
# `test:musl` IS NOT HERE, AND THE SENTENCE THAT PUT IT HERE WAS UNMEASURED
# (CLOUD-1840). It read: "It costs no wall clock that `ci` does not already cost,
# since `depends` runs its entries in parallel." That is an assertion about a cost,
# in a repository whose non-negotiable rule 3 says a gate decides and never
# estimates, and it is false.
#
# Measured 2026-09-19, quiet 4-core container, each suite ALONE with nothing else
# running, same commit, 5570 cases and 5570 passes on both arms:
#
#   test:cargo   256.4s wall    980.8s summed   3.83x parallel efficiency
#   test:musl   2261.6s wall   8750.5s summed   3.87x parallel efficiency
#
# 8.8x. Neither arm was contended and the two efficiencies agree, so the cost is
# the TARGET and not the box — which is the attribution CLOUD-1840's step 4 asked
# for and CLOUD-1839's first diagnosis got wrong. On a container where the triple
# is not installed it is also a `rustup target add` and a full second workspace
# compile before any of that is spent.
#
# `depends` running in parallel is exactly why this was the wrong place for it: a
# lane nine times heavier than the one beside it does not disappear into the fan,
# it BECOMES the fan, inside the gate a branch must clear before it may ask for
# the landing lease — and roughly 45% of laps discard that gate when trunk moves.
#
# THE COVERAGE IS UNCHANGED, which is the half worth stating twice. `musl` stays
# in `CI_REQUIRED_CHECKS` and `CI_ABSENT_OK_CHECKS`, its job stays on
# `pull_request` on `ubuntu-latest`, and `test:musl` stays declared and runnable
# by name. What moved is WHERE the suite executes, not whether. We cannot run
# macOS or Windows locally either; `cross-check` and `darwin-link` approximate
# them and CI runs the real suite. musl now takes the same shape, and
# `approximated_lane` in `policy/ci-parity.rego` is the declared, checked claim
# that says so — `cross-check` type-checks the same triple, and property 3
# re-arms on `test:musl` the moment it stops.
#
# `tree-clean` is here AND in the body, and the duplication is the design
# (CLOUD-277). Here it fails a dirty tree in seconds rather than after the ~170s
# the rest of this list costs. In the body it is load-bearing: `depends` runs
# before the tree can be dirtied MID-RUN, which is exactly the measured
# incident — a backgrounded `land` verifying while the session edited the next
# ticket in the same worktree. One authority, asserted at both ends of the
# window, the same shape `linear-check` already has in `verify` and
# `ready-guard`. It is deliberately NOT an hk step: `pre-commit` runs over a
# tree that is dirty by definition.
depends = ["tree-clean", "ci", "cross-check", "darwin-link", "zizmor", "semver"]
run = '''
# A task body does not run under `set -e` (see rules/toolchain.md), so
# every step whose failure changes the verdict is guarded by hand.
#
# First, because it decides whether anything below is ABOUT the commit it names.
# Every gate above read the working tree; the receipt at the bottom is keyed to
# HEAD. A dirty tree that FAILS is loud and self-correcting; one that PASSES
# writes a receipt `verified` matches and `ready-guard` accepts, so CI runs a
# commit that was never the thing that passed (CLOUD-277).
if ! mise run tree-clean; then
  echo "::error:: verify: the working tree is not the bytes at HEAD, so a receipt naming HEAD would attest a run of something else. No receipt written." >&2
  exit 1
fi
# `test:bats` BY NAME, and in the body rather than in the `depends` above
# (CLOUD-1140). The `ci` job hands hk `HK_SKIP_STEPS: test:bats` so the suite runs
# on its own runner, and `ci-local-parity` property 3 then requires the suite to
# be a task `verify` runs by name — otherwise CI is where a shell-suite failure is
# DISCOVERED, and discovery costs a runner. Naming it in a comment would satisfy
# that gate's grep and nothing else, which is the shape its own header condemns.
#
# THE BODY, BECAUSE `depends` RUNS IN PARALLEL AND THIS MUST NOT. The `ci` leg
# above still runs the suite through hk, so a `depends` entry would start a second
# full run concurrently with it rather than answering from its receipt. Here the
# gate set has already finished, so `batten step` hits and this costs ~0.3s —
# which is also what makes it an assertion about coverage rather than a second
# execution. A taplo reflow of that array would have broken three suites that read
# `depends` as a single line, which is the other reason it does not go there.
if ! mise run test:bats; then
  echo "::error:: verify: the shell suite failed. No receipt written." >&2
  exit 1
fi
# THE SAME BOUND, AND THIS HALF IS ALREADY IN THE COST RECORD (CLOUD-1702).
# CLOUD-1775's body tabulates a lap lost to `commit-lint` reporting "28 commits
# claim no CLOUD-<n> issue" — those 28 were the lease holder's, charged here
# because `BASE_SHA` named trunk while the tree sat on the holder's base. See the
# `config-lint` paragraph below for why the borrowed base is the honest one.
if ! BASE_SHA="$(git rev-parse "${BATTEN_SPEC_BASE:-origin/main}")" HEAD_SHA="$(git rev-parse HEAD)" mise run commit-lint; then
  echo "::error:: verify: commit-lint failed. No receipt written." >&2
  exit 1
fi
# The config trust mechanism, armed (CLOUD-236). `--config-from` reads the
# committed authority out of a trusted ref rather than out of the branch under
# review, so a change cannot lower the bar it is judged by (house style §8).
#
# HERE AND IN CI, which is `ci-local-parity` property 3 satisfied rather than
# dodged: the `ci.yml` step runs this same task against the PR's real base, so
# CI confirms what this proved. The first arming ran in CI alone and a
# ref-namespace mistake was unreachable by any local run — it cost a matrix.
#
# `origin/main` IS THE RIGHT BASE ONLY WHEN THE LAP DID NOT SPECULATE, and the
# paragraph below used to say it unconditionally (CLOUD-1702). Its reasoning —
# `verify` has already refused this branch unless it is rebased on current
# `origin/main`, so this task is a function of (commit, current trunk) — holds
# for an ordinary run and is FALSE on a speculative lap: `land` replays the
# branch onto the lease holder's UNLANDED commits, "the main that is about to
# exist", so the tree is a function of (commit, the holder's base) instead.
#
# Judging that tree against trunk charges the holder's weakenings to the
# BORROWER. `lint::groom` keys the claim receipt on the branch name, and a
# borrower has one of its own, minted for its own row and naming no weakening —
# `Groom::Read({})`, which refuses by design (CLOUD-841: evidence of absence, not
# absence of evidence). The holder's `Weakens:` trailer cannot admit it, because
# the borrower's groom has already answered. Measured 2026-09-25/26: five laps
# over four different borrowed tips, every one refusing
# `recorder[board-issue-created] recorder-changed` and its sibling, while
# `mise run test:cargo` over the identical integrated commit was 6057/6057 green.
#
# `BATTEN_SPEC_BASE` is what `land` already publishes for exactly this question
# (`speculation::PUBLISHED_AS`, CLOUD-748), and `land.rs`'s own
# `a_body_gate_is_told_which_base_the_lap_borrowed` asserts it arrives. Using it
# is the same bound CLOUD-1711 put on `race::authored_log`, which read the whole
# branch history where the shell read only the commits the branch authored.
#
# NOTHING ESCAPES JUDGEMENT, which is the property that makes this a fix rather
# than a relaxation: every commit is still judged once, on its own branch,
# against the base it actually sits on. The holder's weakenings are adjudicated
# on the holder's own lap, against trunk, under the holder's groom.
#
# A no-op wherever no bet is live — an ordinary local lap and CI both leave the
# variable unset, so the expansion is `origin/main` and the class is unchanged.
# The
# pre-commit step stays single-tree, where that reasoning does not hold.
#
# THE PRE-COMMIT STEP IS NO LONGER UNARMED, and the objection above still holds
# (CLOUD-1896). It was left single-tree because the only base it could name was
# `origin/main`, a property of the world. The engine now arms a CLAIMED branch at
# its FORK POINT when no base is passed — a property of the branch, and exactly
# what the line above compares against once `verify` has proved the rebase — and
# asks the one question a commit with no message yet can answer: did the board
# groom this weakening? That is what moves the refusal from the end of a lap to
# the edit. An unclaimed checkout is unaffected and runs single-tree as before.
# The third-party validators' verdicts, recorded where the engine reads them
# (CLOUD-1265). BEFORE the gates below, because `validator-verdict-clean` is a
# `severity = "deny"` row that adjudicates what it finds here — and until this
# task existed it found nothing, on every checkout, silently.
#
# Guarded by hand like every other step: a producer that could not run leaves the
# previous record in place, and a record keyed to bytes that have since moved is
# ABSENT rather than wrong, so the failure mode is a silent gate — which is
# exactly what this row exists to end. It must be loud here instead.
if ! mise run record-verdicts; then
  echo "::error:: verify: the validator verdicts could not be recorded, so the rows that read them would decide over a record nothing wrote. No receipt written." >&2
  exit 1
fi
if ! CONFIG_LINT_BASE="${BATTEN_SPEC_BASE:-origin/main}" mise run config-lint; then
  echo "::error:: verify: config-lint refused this tree — either batten.toml carries a policy smell, or this branch weakens policy against origin/main. No receipt written." >&2
  exit 1
fi
# The external analyzer's verdict on this exact HEAD, which `final` asserts in
# CI (CLOUD-441). Here for the reason every other gate is: what CI runs, verify
# runs, so the failure is discovered locally and for free rather than costing a
# runner and a round trip.
#
# Exit 3 is a PASS here and a failure in CI, and the asymmetry is the point: 3
# means "no answer yet", and locally the ordinary reason is that HEAD has not
# been pushed, so no analyzer has seen it. Refusing there would fail every
# pre-push verify on a state that is not a defect. In CI the head is pushed by
# construction, every leg has already finished, and a missing verdict is a real
# gap. Only 1 (a red analysis) and 2 (a reading we could not take) stop this.
# NOT READ HERE EITHER (CLOUD-897), and that keeps `ci-local-parity` true: this
# ran because `final` ran it, and `final` no longer does. The task still exists;
# nothing in the landing path reads it until CLOUD-897 restores the gate
# alongside CLOUD-528.
# The IO-free evaluator test, shown able to FAIL (CLOUD-831, CLOUD-418). The
# closure half of that pin is a `batten.toml` rule row and rides `batten-check`
# above; this half cannot, because its subject is a BUILD with a different
# feature set and no rule kind can ask for one.
#
# Cheap on the common change: receipt-gated on the Rust specs, so it costs a
# checksum read unless the crate, its manifests or the lockfile moved. When it
# does run it pays one feature-toggled compile — which is the commit worth
# paying for, since that is exactly when the test could have stopped
# discriminating.
#
# NOT a CI job, and that is `ci-local-parity` satisfied rather than dodged: the
# constraint is that every task CI runs is one `verify` runs, not the reverse.
# `ready-guard` refuses `gh pr ready` without a verify receipt for this HEAD, so
# a test that has quietly stopped discriminating blocks the PR before it can
# spend a runner.
# THE SPLIT THE PORT FORCED (CLOUD-1717), and this caller is what the retirement
# left dangling — `mise run evaluator-io-check` named a program this branch had
# already deleted, so `verify` exited 1 before reaching anything below it and the
# branch could not verify itself. `evaluator-io-check` was one program making the
# probe build AND adjudicating its log; §5 makes `check` `read` and incapable of
# spawning, so the build is `evaluator-io-record`'s and the verdict is the
# engine's.
#
# BOTH HALVES GUARDED BY HAND, because this body declares `shell = "bash -c"` and
# so does not run under `set -e`. A producer that could not run must not fall
# through to a judge that would then read its absence as silence and pass.
if ! mise run evaluator-io-record; then
  echo "::error:: verify: evaluator-io-record could not run the probe build, so there is no reading to judge. No receipt written." >&2
  exit 1
fi
if ! mise run batten -- check --rule 'test cover never'; then
  echo "::error:: verify: 'test cover never' refused — the IO-free evaluator test no longer discriminates. No receipt written." >&2
  exit 1
fi
# The latency regression gate (CLOUD-172). `perf-assert` holds the published
# number to an absolute ceiling; this asks whether THIS branch made an
# invocation path slower than its own merge base.
#
# IN THE BODY, AFTER `depends`, AND THAT WAS MEASURED (CLOUD-1891). Run in
# `depends` beside hk, its two builds competed with the test builds: 7m40s and
# 6m23s against 3m46s alone, and the gate got slower. Its skip is narrow — only
# a diff touching no crate source, manifest or lockfile is exempt — so its cost
# is the two builds, which is what to make cheaper.
#
# Here and never CI-only: CI confirms, it never discovers. `ready-guard`
# refuses to ready a PR without a verify receipt for this HEAD, so a regression
# blocks the PR before it can spend a runner at all.
if ! mise run perf-gate; then
  echo "::error:: verify: perf-gate failed — this branch made an invocation path measurably slower than its merge base, or the measurement could not run. No receipt written." >&2
  exit 1
fi
# The COST gate (CLOUD-827), and it is deliberately last of the content gates:
# every question above is "is this branch correct", and this one is "is the matrix
# it is about to buy able to have an opinion about it". Asking that before the
# correctness gates would refuse a branch before telling the author whether it
# even works.
#
# In `verify` AND in `land`'s pre-ready set, for the reason `perf-gate` is here:
# `ready-guard` refuses `gh pr ready` without a verify receipt for this exact
# HEAD, so a prose-only branch is stopped before it can spend a runner at all.
# That is strictly earlier and cheaper than a check that reds after the matrix has
# been paid for — and this gate exists precisely because nothing in the pre-ready
# set asked what the diff was WORTH.
#
# NOT a CI job, and that is `ci-local-parity` satisfied rather than dodged: the
# constraint is that every task CI runs is one `verify` runs, not the reverse. It
# also could not be one honestly — by the time CI runs, the matrix this gate
# exists to avoid has already been bought.
#
# Every could-not-look path inside it exits 0, so this stops a run only on a
# positive verdict.
#
# THIS CALLER STATES NO REMEDY, and the omission is the fix rather than an
# oversight (CLOUD-1050 defect B). It used to restate the gate's routes, and the
# copy had drifted: it dropped the fold-it-in route entirely and turned the
# override's PRECONDITION — "if the prose is the deliverable and cannot wait", a
# claim you must defend — into "to record the exception", which is bookkeeping.
# What survived was a binary whose only concrete arm was the bypass, and that
# manufactured an override request for a change that needed none (CLOUD-680).
# Deleting the copy is the only fix that cannot drift again; `linear-check`'s
# "see its message" is the idiom this adopts. `remedy-has-one-author` is the gate.
if ! mise run prose-only-check; then
  echo "::error:: verify: prose-only-check refused this branch — see its message above for what is wrong and every route out. No receipt written." >&2
  exit 1
fi
# The receipt write is the binary's job (CLOUD-203): `batten receipt record`
# keys the claim to the exact commit verified — an amend or a rebase produces a
# new HEAD and therefore no receipt, which is the point (see ready-guard) — and
# maintains the grandfathered $GIT_DIR/batten-receipts/ compatibility layout
# those readers consume. Guarded like every step above: a receipt that cannot
# be recorded must fail verify and leave no receipt.
# THE CLOSING READING, and it is the whole of CLOUD-861 (folding CLOUD-1153's
# classification above). The floor used to be read ONCE, at the head of
# `verify`, answering "is there room to begin" — and nothing re-read during the
# phase that actually consumes the disk. Measured three times in one session: the
# prune passed at 6242MB free, the `cargo test` link step inside the same lap took
# all of it, and the exhaustion arrived as a rustc IO error inside a test run,
# under a `land` line telling the author to fix their own diff.
#
# So the same verb runs at both boundaries. This call closes the lap the head call
# opened, records what it actually consumed, ratchets the observed floor, and
# admits the next lap. It also reclaims what this run's own build just superseded,
# which is why the second walk is not waste.
#
# LAST OF THE CONTENT STEPS AND BEFORE THE RECEIPT, deliberately: a lap that ended
# below its floor must leave no receipt, exactly like any other refusal here.
lap_rc=0
BATTEN_PRUNE_LAP_OPEN= mise run target-prune || lap_rc=$?
if [ "$lap_rc" = 2 ]; then
  echo "::error:: verify: this lap ended below the disk floor it was ADMITTED under — the refusal above names what it consumed. That is the environment rather than this branch: there is nothing in the diff to reproduce. No receipt written." >&2
  exit 1
fi
if [ "$lap_rc" != 0 ]; then
  echo "::error:: verify: target-prune could not close this lap — see its message for whether nothing was examined or the invocation itself was refused. No receipt written." >&2
  exit 1
fi
if ! cargo run --quiet -p batten -- receipt record verify; then
  echo "::error:: verify: could not record the receipt. No receipt written." >&2
  exit 1
fi
echo "verify: fast-forward-green — rebased on latest main, ci + cross + commit-lint all pass"
'''

[tasks.commit-msg]
description = "Gate: one pending commit message's subject follows the convention (policy: [commit] in batten.toml)"
# THE BINARY ON PATH FIRST, AND `cargo run` ONLY WHERE THERE IS NONE — CLOUD-1620's
# shape, applied to the path that pays it most (CLOUD-1397).
#
# A GIT HOOK IS A BATTEN HOOK, and is held to the same published ceiling. README's
# `wired` row is 8.0ms p50 against a ≤100ms budget, and `perf-assert` enforces it
# on the mediated surface; nothing argues the commit-msg surface is exempt just
# because git is the harness rather than Claude Code.
#
# MEASURED 2026-09-09 on this container, same message, warm, three runs: this
# task as the hook fired it, 582ms; `cargo run --quiet` with NOTHING to rebuild
# 291ms; `target/debug/batten` 176ms; the release binary 125ms; and 8687ms on the
# first commit after touching one `crates/batten/src` file.
#
# A FIRST PASS AT THESE NUMBERS READ 12ms FOR THE RELEASE BINARY AND IT WAS A
# MEASUREMENT OF A FAILURE. `target/release/batten` was 0.0.155 against a tree at
# 0.0.158 and REFUSED `batten.toml` outright — "vocabulary `action`: `fix` is
# declared and no class or route name spends it" — so the 12ms was a config load
# aborting, not a gate reaching a verdict. Rebuilt, the same call is 125ms. A
# timing taken over a non-zero exit is not a timing of the work, and a stale
# binary is exactly the shape that produces one (CLOUD-1688).
#
# A HOOK MUST NEVER COMPILE, and this is not a preference. Rebuilding that stale
# release binary took ~4 minutes on this container (15:48 -> 15:52, `lto = "thin"`
# in `[profile.release]`), so a hook that rebuilds when it finds a stale binary
# would spend four minutes at the moment an author saves. The 8687ms debug case is
# the same defect an order of magnitude cheaper: a hook running the compiler is
# not a slow gate, it is a different program. The build belongs at provisioning,
# where `session:batten` already puts it. The
# `_.path` entry above already resolves a bare `batten` to THIS checkout's
# `target/release`, built by `session:batten` -> `install:local` at session start
# with an `::error::` when it cannot be — so the fast branch is the tree's own
# engine, not a stale installed one, and the property the previous comment claimed
# for `cargo run` ("judge the working tree's engine and config as the pair that
# ships") is kept rather than traded.
#
# THE CONDITION TESTS PRESENCE AND NOTHING ELSE, which is where `attribution
# identity`'s spelling must not be copied. That one reads
# `if command -v batten && batten <verb>; then :; else cargo run …` and its own
# comment claims `if`/`else` avoids the fallthrough that `a && b || c` has — but
# those two are the same program: a binary that EXISTS and legitimately REFUSES
# takes the else branch either way, so the shape it warns about is the shape it
# ships. Harmless for a write that wants a retry; wrong for a gate, which would
# then pay the build precisely when it refuses and run the whole judgement twice
# to reach the same verdict. A gate that is slowest exactly when it says no is a
# gate authors learn to stop running.
#
# So the verdict is not in the condition. Resolve, then run once, and let the
# exit code be the gate's own.
#
# The fallback is what keeps a runner green: CI has no installed binary and
# `bash: line 25: batten: command not found` is a measured failure there
# (`auto-bot-land.yml:305-310`), so the branch that builds stays for the host that
# needs it and never runs where a human is waiting.
#
# The pattern itself is `batten.toml`'s, not this file's — a rule about what a
# commit may BE is the engine's, and `mise.toml` configures how tools run
# (CLOUD-701).
#
# RESOLVED BY PATH, WITH NO COMPILING FALLBACK (CLOUD-1991). `_.path` above puts
# this checkout's `target/release` ahead of the installed release, and the
# `cargo run` arm this body carried was the four-minute compile the note above
# says a hook must never run; it only ever fired in a clone provisioning had not
# reached, where a commit now fails loudly naming the missing binary instead of
# compiling. The argument is `usage`'s, not the deprecated inline `arg()` call.
usage = 'arg "<file>" help="the pending commit message"'
run = 'batten commit check --message "{{usage.file}}"'

[tasks.commit-attribution]
description = "Gate: no vendor authorship, branding or session links in BASE_SHA..HEAD_SHA (policy: [attribution] in batten.toml)"
# `cargo run` for the same reason `batten-check` and `policy-budget` use it: the
# gate must judge the working tree's engine and config as the pair that ships.
# The range is assembled by mise's template rather than a shell `:?` expansion
# (CLOUD-1991): a template variable the environment does not carry refuses to
# render, naming it, so an unarmed caller still fails before the engine starts.
run = "cargo run --quiet -p batten -- attribution check {{env.BASE_SHA}}..{{env.HEAD_SHA}}"

[tasks."commit:precheck"]
description = "Run both commit-msg gates over a drafted message file BEFORE `git commit`, so a subject or attribution refusal never costs the pre-commit suite"
# Cheap first, at the commit too: git runs `pre-commit` (the whole gate) and only
# then `commit-msg`, so a message refusal used to arrive after every compile.
# Same two tasks the hook runs, so the answer cannot differ.
usage = 'arg "<file>" help="The drafted commit message"'
run = [
  "mise run commit-msg {{usage.file}}",
  "mise run commit-attribution-msg {{usage.file}}",
]

[tasks.commit-attribution-msg]
description = "Gate: no vendor authorship, branding or session links in one pending commit message, before the commit exists"
# The commit-msg-hook half. Same policy and same engine as `commit-attribution`;
# only the object differs — a message on disk plus the identity `git var` says
# git is about to stamp, rather than commits that already exist.
#
# Resolve-then-run, for `commit-msg`'s reasons above and its measurements: these
# two are the pair that fires on EVERY commit, so the 582ms each was paying was
# the whole per-commit tax, and the 8687ms first-commit-after-an-edit case was a
# git hook running the compiler twice over.
# Resolved by path with no compiling fallback, for `commit-msg`'s reason
# directly above (CLOUD-1991).
usage = 'arg "<file>" help="the pending commit message"'
run = 'batten attribution check --message "{{usage.file}}"'

[tasks.attribution-identity]
description = "Write: set this clone's repo-local git identity when it is unset or carries a denied vendor identity"
# NEVER `cargo run` ON THIS PATH (CLOUD-1620). This task runs as
# `session:identity`, a session-start handler, and spelling `cargo run` there cost
# ~215s measured 2026-09-08 — a second full compile of the crate to perform a
# `git config` write the installed binary answers in milliseconds.
#
# WHAT RETIRING THE GUARDED FALLBACK COSTS, stated rather than absorbed. The
# one-liner this replaced tried the binary on PATH and fell back to a build when
# that binary could not read this tree — the release predating a `batten.toml`
# key (CLOUD-1326, measured on 0.0.151 refusing `[lease]`). That rescue is gone:
# such a release now fails this step, and the step reports it at session start.
#
# THE FALLBACK IS RETIRED WITH THE SHELL LINE (CLOUD-1991). Its one caller is the
# `session-attribution-identity` handler, which `batten hook` dispatches — so a
# `batten` resolves on that path by construction, and `_.path` puts this
# checkout's `target/release` ahead of the installed release. A release that
# cannot read this tree now fails the step loudly at session start, which
# `doctor mediator` already names, instead of compiling the engine there.
run = "batten attribution identity"

[tasks.commit-check]
description = "Gate: every commit subject in BASE_SHA..HEAD_SHA follows the convention (policy: [commit] in batten.toml)"
# The range half of the subject convention, split out of `commit-lint`'s body so
# the pattern can live in `batten.toml` where policy belongs rather than as a
# `mise.toml [env]` variable (CLOUD-701). It rides `commit-lint`'s env contract
# for the same reason `commit-attribution` does: both callers
# already export BASE_SHA/HEAD_SHA, so a dependency lights up the local pre-flight
# and the CI backstop at once with no second task name in a workflow — which is
# what keeps `ci-local-parity` satisfied without editing `verify`.
# The range is assembled by mise's template rather than a shell `:?` expansion
# (CLOUD-1991): a template variable the environment does not carry refuses to
# render, naming it, so an unarmed caller still fails before the engine starts.
run = "cargo run --quiet -p batten -- commit check {{env.BASE_SHA}}..{{env.HEAD_SHA}}"

[tasks.commit-lint]
description = "Validate every commit in BASE_SHA..HEAD_SHA is Conventional Commits and names the issue it serves"
# The attribution gate rides this task's env contract rather than getting its own
# call site in a workflow, and that is deliberate. `ci-local-parity` requires
# every `mise run <task>` a workflow invokes to be one `verify` invokes; a second
# name in commit-lint.yml would mean editing `verify` too. Both callers already
# export BASE_SHA/HEAD_SHA — the exact range the gate needs — so a dependency
# lights up the local pre-flight and the CI backstop at once, with no second
# definition of which commits are in scope. It also fails closed for free: mise
# stops before this body runs, so the no-`set -e` trap does not apply (CLOUD-274).
# `signing-posture-check` rides the same DEPENDENCY for the same reason, and it
# is the signature half of what `commit-attribution` does for the identity half
# (CLOUD-669), so it needs no second call site and `ci-local-parity` stays
# satisfied without editing a workflow. It does NOT ride the BASE_SHA/HEAD_SHA
# env contract since CLOUD-843: its range is the static `commits` column on the
# `commit grade unsafe` row in batten.toml, so that row, not this env, says
# which commits it judges. It is spelled `-check` since CLOUD-1717 split the
# gathering from the judging; the entry named the retired program for as long
# as nothing asked whether a `depends` target still resolves.
depends = ["commit-attribution", "signing-posture-check", "commit-check"]
shell = "bash -c"                                                         # uses ${sha:0:8}; mise defaults tasks to /bin/sh (dash)
# The SERVER-SIDE half of CLOUD-431. The claim receipt lives in `.git/` and never
# leaves the clone, so no reviewer and no workflow can see it; what a server CAN
# see is whether each commit names the issue it serves. `verify` holds the
# receipt half, this holds the half that survives a fresh checkout.
#
# `claimed-keys` answers "which issue does this CLAIM", and it is asked here
# rather than re-deriving `CLOUD-[0-9]+` inline — that second-authority mistake is
# the whole reason that file exists (CLOUD-338/CLOUD-378). Claiming is stricter
# than mentioning, which is the property wanted: a commit citing an issue as
# evidence has not thereby become work on it.
#
# TWO EXEMPTIONS, and both are properties of the COMMIT rather than of the
# subject line.
#
# The first: release-plz authors `chore: release vX.Y.Z` touching exactly the
# version and changelog files, and it has no issue to name because it is not work
# on one; measured on this repo's history, every release commit is keyless and
# every other commit in the last 200 revs carries a key. Keying the exemption to
# the file set rather than the wording means it cannot be claimed by a
# hand-written commit that merely borrows the subject, and it does not encode a
# message format release-plz is free to change.
#
# THE SECOND IS THE UPDATE BOT'S, AND IT CLOSES A LOOP THAT COULD NOT TERMINATE
# (CLOUD-1207). A Renovate bump carries no `Refs:` trailer and structurally
# cannot: CLOUD-693's `batten pr ensure` mints the row FROM the pull request, so
# the key does not exist when the commit is authored, and the lane deliberately
# never checks the bot's head out under a write token to amend one in. The row is
# real and the merge still moves it — through `Closes CLOUD-<n>` in the PR BODY,
# which this gate does not read and should not, since a body is rewritten on
# every rebase (CLOUD-768) and a commit message is not.
#
# So the gate refused, forever, a class of commit it was never aimed at. Measured
# on #676: seven days Ready and red, one full matrix per `main` advance, 372
# workflow runs, none of which could ever land.
#
# TWO CONJUNCTS, because the diff alone is too wide here where it was sufficient
# for release-plz. A workflow-only diff is ordinary human work in this repository,
# so exempting it by paths would drop the server-side claim (CLOUD-431) for a
# whole class of real changes. The author test is what narrows it: an address of
# the form `…[bot]@users.noreply.github.com` is minted by GitHub for an App, and
# is not a login allowlist — `[bot_lane]`'s `bots` list answers a
# different question over a different object (which bot's pull request this lane
# will adopt), so this is not a second spelling of it. A contributor forging that
# address is refused one gate over, by `commit-attribution`'s identity table.
#
# The paths are the manifests `renovate.json5`'s `enabledManagers` can move, and
# no others: a bot commit reaching anything else is not a bump and is not exempt.
run = '''
fail=0

for sha in $(git rev-list --no-merges "${BASE_SHA:?}..${HEAD_SHA:?}"); do
  subject=$(git show -s --format=%s "$sha")
  # The subject-convention half is NOT here: it is `commit-check`, above in
  # `depends`, reading `[commit].subject_pattern` from batten.toml (CLOUD-701).
  # What remains in this body is the claim half, which is about the message's
  # trailers rather than its shape.
  touched=$(git show --name-only --format='' "$sha" | grep -v '^$' || true)
  if [ -z "$(printf '%s\n' "$touched" | grep -vE '^(Cargo\.(toml|lock)|.*CHANGELOG\.md)$' || true)" ]; then
    echo "REL   ${sha:0:8}  version/changelog only — no issue to name"
    continue
  fi
  # The bot exemption's two conjuncts, in the order that costs least: the author
  # is one string, the diff is a walk. `%ae` is the AUTHOR's address rather than
  # the committer's, because GitHub commits the bot's work as `noreply@github.com`
  # and only the author half names which App wrote it.
  case "$(git show -s --format='%ae' "$sha")" in
    *'[bot]@users.noreply.github.com')
      if [ -z "$(printf '%s\n' "$touched" | grep -vE '^(\.github/workflows/[^/]+\.ya?ml|mise\.(toml|lock)|Cargo\.(toml|lock))$' || true)" ]; then
        echo "BOT   ${sha:0:8}  bot-authored manifest bump — its row is minted from the PR, after the commit"
        continue
      fi
      ;;
  esac
  # `</dev/null` is load-bearing, not tidiness: `claimed-keys` reads optional
  # extra evidence from stdin whenever stdin is not a tty, so under a task runner
  # — where it never is — a call with nothing piped BLOCKS FOREVER. Measured here
  # as a two-minute harness kill. Same shape as CLOUD-511's bare `cat`.
  # `batten claim keys`, not the retired `claimed-keys.sh` (CLOUD-1711). The
  # binding this replaces pointed at a deleted path, so the command emitted
  # nothing and every commit read as claiming no issue — including ones carrying
  # a `Refs:` trailer, which is the tell: a missing program's empty output is
  # byte-identical to a message that names no row.
  #
  # `cargo run`, NEVER A BARE `batten`, and the first repair got this wrong in a
  # way only CI could show: a bare name resolves wherever the binary happens to be
  # installed, so the gate passed locally and failed on the runner — accusing four
  # commits that carry `Refs: CLOUD-1688`. That is the SAME false negative one
  # environment over, which is why the form matters rather than being a style
  # choice: 52 other call sites in this file spell it this way and none of them
  # depends on what is on PATH.
  if [ -z "$(cargo run --quiet -p batten -- claim keys --branch "" --title "" --log "$(git show -s --format='%B' "$sha")" </dev/null 2>/dev/null)" ]; then
    echo "::error::Commit ${sha:0:8} claims no CLOUD-<n> issue: '$subject' — add a 'Refs: CLOUD-<n>' trailer naming the work it serves"
    fail=1
  fi
done
exit $fail
'''

[tasks.release-pr]
description = "Open/update the release PR (version bump + changelog)"
# release-plz derives the next version by diffing each crate against its last
# release. This workspace is `publish = false` and never reaches a registry, so
# the registry download fails ("Package batten not found") and release-plz can
# never bump past the initial version — every run reports "next version is
# 0.0.0". THE BASELINE IS `release-plz.toml`'s `git_only = true` since CLOUD-1991:
# release-plz reads the latest release tag itself, which is exactly the baseline
# this body used to build in shell (the latest `v*` tag, checked out into a
# scratch worktree and passed as `--registry-manifest-path`).
#
# THE TOKEN TRAVELS IN THE ENVIRONMENT, never on the command line: release-plz
# reads `GIT_TOKEN`, and mise prints a task's command before running it, so an
# argv token would be printed into the job log. `{{env.GITHUB_TOKEN}}` refuses to
# render when the variable is absent, which is the `:?` the shell spelling had.
env = { GIT_TOKEN = "{{env.GITHUB_TOKEN}}" }
run = "release-plz release-pr"

[tasks.release]
description = "Tag and publish a GitHub release when the version changed"
# The token rides the environment for `release-pr`'s reason directly above.
env = { GIT_TOKEN = "{{env.GITHUB_TOKEN}}" }
run = "release-plz release"

[settings]
# OFF, so that installing is never a write (CLOUD-223). With it on, any cold
# `mise install` appends install residue to the tracked lockfile — a
# `platforms.<platform>-<exe>` key carrying a checksum and no url, which `mise
# lock` can neither produce nor repair and `mise run lock-complete` rejects by
# name. The session-start hook was taught to install with MISE_LOCKFILE=false,
# and that fixed exactly one caller: the sandbox's own provisioning runs before
# the hook, so a session still opened on a dirty tree. A per-caller opt-out
# cannot cover callers this repo does not own.
#
# Measured, cold data/cache/state dirs, this tool alone: with the setting true a
# `mise install` grew the lockfile by 163 bytes and produced exactly one
# `linux-x64-cargo-zigbuild` key; with it false the file was byte-identical
# afterwards and the key was absent.
#
# Inverting it does: the default is now "no writer", and the one writer that
# should touch the lockfile opts in — `[tasks.lock-check]` sets MISE_LOCKFILE=true
# for its `mise lock`, on the schedule that owns currency
# (.github/workflows/lock-currency.yml), against a disposable checkout. Nothing
# on the landing path writes at all. Gated by `mise run lock-complete`, which
# fails if this is ever set back to true.
lockfile = false
# EVERY TASK REPORTS ITS OWN WALL CLOCK (CLOUD-1891). A 38-minute `verify` had no
# per-step record anywhere — hk logs none — so where the time went was inferred
# from CI job durations on different hardware. A lap that loses to `main`
# moving is lost in proportion to how long the gate runs, so the gate's cost has
# to be read off every run rather than guessed. `task.timings`, not the
# `task_timings` spelling mise deprecated (removed in mise 2027.2.0).
task.timings = true
