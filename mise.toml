# The single source of truth for this repo's dev environment: every tool, env
# var, and task lives here, so CI, git hooks, and local shells all run the exact
# same thing. Provisioned by mise (https://mise.jdx.dev).
#
#   mise install       # get every tool below at its pinned version
#   mise tasks         # list the tasks
#   mise run ci        # everything CI runs, locally

[tools]
rust = { version = "1.85.0", components = "rustfmt,clippy" }
hk = "1.54.0"                 # git-hook runner (see hk.pkl)
"aqua:cli/cli" = "2.97"       # gh — reads CI checks (repo scope bundles checks-read) and drives PRs; `gh pr checks --watch`
"aqua:EmbarkStudios/cargo-deny" = "0.20"  # dependency license/advisory policy (deny.toml)
"aqua:release-plz/release-plz" = "0.3"    # conventional-commit-driven semver + changelog
zizmor = "1.29.0"             # GitHub Actions static analysis; run via `mise run zizmor` (in `verify` and CI)
uv = "0.8"                    # fast Rust installer the pipx: backend uses to fetch Serena
# Serena's LSP-backed semantic code tools (see .mcp.json). Pinned here — not in
# .mcp.json — so its version lives with every other tool and lands in mise.lock.
# The pipx backend installs it with `uv` (present above), keeping the fast resolver.
"pipx:serena-agent" = "1.6.1"

[env]
CARGO_TERM_COLOR = "always"
# Conventional Commits subject pattern, shared by the commit-msg hook and the CI
# commit linter so there is exactly one definition of "valid commit".
CONVENTIONAL_RE = '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)([(][a-z0-9._-]+[)])?!?: .+'

# --- GitHub reachability behind an egress proxy (Claude Code web sandbox etc.) ---
# mise resolves every tool's release through GitHub's *API* host, api.github.com.
# When an egress proxy fronts the network (HTTPS_PROXY set) and injects a
# repo-scoped token, that host answers 403 for third-party tool repos and a bare
# `mise install` fails ("GitHub access to this repository is not enabled"). The
# fix is not to give up — GitHub is reachable — it is to send just the API/asset
# hosts straight to GitHub, over the direct route (our tools are public repos, so
# unauthenticated resolution works there; GH_TOKEN below still carries our PAT):
#   * NO_PROXY gains api.github.com (+ the redirect/asset hosts) so those calls
#     bypass the proxy. github.com itself is deliberately left proxied, so git
#     keeps its proxy-provided auth to button-inc/batten. The guard appends once
#     and preserves the existing NO_PROXY (which carries pypi.org/crates so the
#     uv-backed Serena install keeps working). Off-sandbox there is no proxy, so
#     this is a no-op.
# See AGENTS.md, "GitHub is reachable — never report the toolchain as unrunnable".
# `gh` and zizmor read GH_TOKEN. In the sandbox the ambient GH_TOKEN is a proxy
# placeholder that 401s when sent direct (NO_PROXY, above), so set it to our PAT;
# in CI there is no PAT, so fall back to MISE_GITHUB_TOKEN, which mise-action sets
# to the job token. Both are valid, non-empty tokens (never the proxy
# placeholder), so a tool that rejects an *empty* GH_TOKEN — like zizmor — works
# in both. Only these two tokens, per project policy.
GH_TOKEN = "{{ get_env(name='GITHUB_PERSONAL_ACCESS_TOKEN', default=get_env(name='MISE_GITHUB_TOKEN', default='')) }}"
NO_PROXY = "{% set cur = get_env(name='NO_PROXY', default='') %}{% if 'api.github.com' in cur %}{{ cur }}{% else %}api.github.com,objects.githubusercontent.com,codeload.github.com,uploads.github.com{% if cur %},{{ cur }}{% endif %}{% endif %}"
no_proxy = "{% set cur = get_env(name='no_proxy', default=get_env(name='NO_PROXY', default='')) %}{% if 'api.github.com' in cur %}{{ cur }}{% else %}api.github.com,objects.githubusercontent.com,codeload.github.com,uploads.github.com{% if cur %},{{ cur }}{% endif %}{% endif %}"

[tasks.fmt]
description = "Format all code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy with warnings denied"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run the workspace test suite"
run = "cargo test --workspace"

[tasks.deny]
description = "cargo-deny: licenses, advisories, sources"
run = "cargo deny check"

[tasks.zizmor]
description = "Static-analyse the GitHub Actions workflows (dangerous triggers, unpinned actions, injection sinks)"
# Same tool + severity CI enforces. GH_TOKEN (set in [env]) enables the online
# audits. This is the one command CI's zizmor job also runs, so they cannot drift.
run = "zizmor --min-severity high .github/"

[tasks.lock-check]
description = "Assert mise.lock is complete and current — what CI installs with `mise install --locked`"
shell = "bash -c"
# CI installs tools with `mise install --locked`, which fails if the lockfile is
# missing a URL for a tool on the runner's platform. `mise install` writes only a
# partial entry, so a tool bump can pass locally yet break CI. Regenerate the lock
# and fail if it changed: a clean diff means every tool has full per-platform
# URLs, so the locked install cannot surprise CI.
run = '''
mise lock
if ! git diff --quiet -- mise.lock; then
  echo "::error:: mise.lock was stale/incomplete — regenerated it. Review and commit the change; CI installs with --locked and needs complete per-platform URLs." >&2
  git --no-pager diff --stat -- mise.lock >&2
  exit 1
fi
echo "lock-check: mise.lock is complete and current"
'''

[tasks.cross-check]
description = "Type-check for other targets from Linux (no macOS runner needed)"
run = '''
for t in x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-gnu; do
  rustup target add "$t"
  # `check` does codegen-to-metadata without linking, so it needs no target
  # linker or SDK — cross-platform compile coverage at Linux-runner cost.
  cargo check --workspace --target "$t"
done
'''

[tasks.hk-version]
description = "Gate: hk's version is pinned identically in mise.toml and hk.pkl (amends URL). A bump to one without the other is the moment to revisit the hook config."
shell = "bash -c"   # uses grep -oE + cut; keep off /bin/sh for consistency
run = '''
mise_v=$(grep -E '^hk = ' mise.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
pkl_v=$(grep -oE 'hk@[0-9]+\.[0-9]+\.[0-9]+' hk.pkl | head -n1 | cut -d@ -f2)
if [ "${mise_v:?}" != "${pkl_v:?}" ]; then
  echo "::error:: hk version drift: mise.toml pins $mise_v but hk.pkl amends $pkl_v." >&2
  echo "Sync both, then revisit hk.pkl for new features worth adopting (see AGENTS.md)." >&2
  exit 1
fi
echo "hk-version: mise.toml and hk.pkl agree on hk $mise_v"
'''

[tasks.no-docs-tree]
description = "Gate: no committed docs/ tree. Research deliverables and evidence notes attach to the Linear issue, not a repo docs/ folder (see AGENTS.md)."
shell = "bash -c"
run = '''
tracked=$(git ls-files 'docs/*' 'docs/**' | head -n1)
if [ -n "$tracked" ]; then
  echo "::error:: committed docs/ tree found (e.g. $tracked). Research evidence belongs on the Linear issue, not in a repo docs/ folder (see AGENTS.md)." >&2
  exit 1
fi
echo "no-docs-tree: no committed docs/ tree"
'''

[tasks.hooks]
description = "Run the git-hook gate (fmt, lint, test) through hk — the same hk.pkl the pre-commit hook uses, in check-only mode"
run = "hk check --all"

[tasks.ci]
description = "Everything CI runs"
# fmt-check + lint + test come from the SAME hk.pkl the pre-commit hook runs
# (via `hooks`), so CI exercises the hook config itself; `deny` rounds it out.
depends = ["hooks", "deny"]

[tasks.linear-check]
description = "Gate: HEAD is linear on the current origin/main, so the PR can fast-forward-land"
shell = "bash -c"
# Re-asserted twice — inside `verify`, and again immediately before `gh pr ready`,
# because `main` moves constantly and a verify green a minute ago may be stale
# (AGENTS.md, workflow step 5). One definition, called from both places, instead
# of the fetch/merge-base snippet retyped per session.
run = '''
git fetch -q origin main
main=$(git rev-parse origin/main)
if [ "$(git merge-base origin/main HEAD)" != "$main" ]; then
  echo "::error:: not rebased on latest main ($main). Run: git rebase origin/main" >&2
  exit 1
fi
echo "linear-check: HEAD is linear on origin/main ($main)"
'''

[tasks.verify]
description = "Full local pre-flight — run this before marking any draft PR ready"
shell = "bash -c"
depends = ["ci", "cross-check", "zizmor", "lock-check"]
run = '''
mise run linear-check
BASE_SHA="$(git rev-parse origin/main)" HEAD_SHA="$(git rev-parse HEAD)" mise run commit-lint
echo "verify: fast-forward-green — rebased on latest main, ci + cross + commit-lint all pass"
'''

[tasks.ci-wait]
description = "Block until every check-run on HEAD reaches a terminal state, then report conclusions (exit 1 if any check did not succeed)"
shell = "bash -c"
# Workflow-contract step 4 (AGENTS.md): after `gh pr ready`, CI is confirmed by a
# *continuous background poll*, never by waiting on a webhook — webhooks drop
# successes, so silence is never green. Run this backgrounded; it re-invokes the
# caller on exit. Deliberately unbounded: the exit condition is "checks reached
# terminal", which always happens, and a wall-clock timeout would only
# reintroduce the gap it was meant to close. Interval is tunable for tests.
run = '''
sha="${SHA:-$(git rev-parse HEAD)}"
interval="${CI_WAIT_INTERVAL:-20}"
echo "ci-wait: polling check-runs for $sha every ${interval}s"
while :; do
  runs=$(gh api "repos/{owner}/{repo}/commits/$sha/check-runs" --paginate \
           --jq '.check_runs[] | "\(.status)\t\(.conclusion // "-")\t\(.name)"') || runs=""
  if [ -n "$runs" ] && ! printf '%s\n' "$runs" | awk -F'\t' '$1!="completed"{found=1} END{exit !found}'; then
    printf '%s\n' "$runs" | awk -F'\t' '{print $2"\t"$3}' | sort -u
    if printf '%s\n' "$runs" | awk -F'\t' '$2!="success"&&$2!="neutral"&&$2!="skipped"{found=1} END{exit !found}'; then
      echo "::error:: CI is not green on $sha — reproduce and fix locally (see AGENTS.md)." >&2
      exit 1
    fi
    echo "ci-wait: all checks terminal and green on $sha"
    exit 0
  fi
  sleep "$interval"
done
'''

[tasks.land]
description = "Land this branch's PR by commenting /fast-forward, then block until it is merged (or the fast-forward bot refuses)"
shell = "bash -c"
# The merge button is blocked on purpose (AGENTS.md, Commits and pull requests):
# `main` only advances to a SHA that already passed CI. Commenting is the whole
# landing action, but the *result* is asynchronous, so the naive form is a
# comment plus a guessed `sleep` — which either reports too early or wastes time.
# Poll instead, with two exit conditions so it can never hang: the PR reaches a
# terminal state, or the fast-forward bot's own check-run comes back failed.
# Run it backgrounded like ci-wait.
run = '''
pr="${PR:-$(gh pr view --json number --jq .number)}"
sha="$(git rev-parse HEAD)"
interval="${LAND_INTERVAL:-10}"
gh pr comment "$pr" --body "/fast-forward"
echo "land: commented /fast-forward on #$pr ($sha); waiting for the merge"
while :; do
  state=$(gh pr view "$pr" --json state --jq .state)
  if [ "$state" != "OPEN" ]; then
    git fetch -q origin main
    echo "land: PR #$pr is $state; origin/main is now $(git rev-parse --short origin/main)"
    [ "$state" = "MERGED" ] || exit 1
    exit 0
  fi
  refused=$(gh api "repos/{owner}/{repo}/commits/$sha/check-runs" \
              --jq '.check_runs[] | select(.name=="fast-forward" and .status=="completed" and .conclusion!="success" and .conclusion!="skipped") | .conclusion' | head -n1)
  if [ -n "$refused" ]; then
    echo "::error:: the fast-forward bot refused ($refused) — the branch is probably no longer linear on main. Rebase, re-verify, retry." >&2
    exit 1
  fi
  sleep "$interval"
done
'''

[tasks.commit-msg]
description = "Validate one commit-message file is Conventional Commits"
run = '''
head -n1 "{{arg(name="file")}}" | grep -Eq "$CONVENTIONAL_RE" \
  || { echo 'commit-msg: subject must follow Conventional Commits, e.g. "feat(cli): add check subcommand"'; exit 1; }
'''

[tasks.commit-lint]
description = "Validate every commit in BASE_SHA..HEAD_SHA is Conventional Commits"
shell = "bash -c"   # uses ${sha:0:8}; mise defaults tasks to /bin/sh (dash)
run = '''
fail=0
for sha in $(git rev-list --no-merges "${BASE_SHA:?}..${HEAD_SHA:?}"); do
  subject=$(git show -s --format=%s "$sha")
  if printf '%s' "$subject" | grep -Eq "$CONVENTIONAL_RE"; then
    echo "OK    ${sha:0:8}  $subject"
  else
    echo "::error::Non-conventional commit ${sha:0:8}: '$subject'"
    fail=1
  fi
done
exit $fail
'''

[tasks.release-pr]
description = "Open/update the release PR (version bump + changelog)"
# release-plz derives the next version by diffing each crate against its last
# *published* release, downloaded from a cargo registry. This workspace is
# `publish = false` and never reaches a registry, so that download fails
# ("Package batten not found") and release-plz can never bump past the initial
# version — every run reports "next version is 0.0.0". The documented fix for
# unpublished crates is to supply the baseline as a checkout of the latest
# release tag via --registry-manifest-path. With no tag yet (first release),
# pass nothing and let release-plz treat it as the initial version.
run = '''
set -eu
base_args=""
tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)"
if [ -n "$tag" ]; then
  worktree="$(mktemp -d)"
  git worktree add -q --detach "$worktree" "$tag"
  trap 'git worktree remove --force "$worktree" >/dev/null 2>&1 || true' EXIT
  base_args="--registry-manifest-path $worktree/Cargo.toml"
fi
release-plz release-pr --git-token "${GITHUB_TOKEN:?}" $base_args
'''

[tasks.release]
description = "Tag and publish a GitHub release when the version changed"
run = "release-plz release --git-token ${GITHUB_TOKEN:?}"

[settings]
lockfile = true
