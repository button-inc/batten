# The single source of truth for this repo's dev environment: every tool, env
# var, and task lives here, so CI, git hooks, and local shells all run the exact
# same thing. Provisioned by mise (https://mise.jdx.dev).
#
#   mise install       # get every tool below at its pinned version
#   mise tasks         # list the tasks
#   mise run ci        # everything CI runs, locally

[tools]
# The compiler this repo builds with, and — since CLOUD-593 — the authority
# `Cargo.toml`'s `rust-version` is a derived copy of. `msrv-pin-agreement`
# holds the two together; moving this number is what moves the floor, so raise
# it here and run that gate rather than editing the manifest.
#
# It sat at 1.85.0 for twelve releases, not by decision but because nothing
# watched it: Dependabot has no `package-ecosystem` that can read this file
# (CLOUD-655), so `[tools]` was the one dependency surface with no update lane
# at all. The floor was pinned to it, so the stale pin froze two crates and
# rejected a third.
rust = { version = "1.98.0", components = "rustfmt,clippy" }
hk = "1.56.1"                                                # git-hook runner (see hk.pkl)
"aqua:cli/cli" = "2.98.0"                                    # gh — reads CI checks (repo scope bundles checks-read) and drives PRs; `gh pr checks --watch`
"aqua:EmbarkStudios/cargo-deny" = "0.20"                     # dependency license/advisory policy (deny.toml)
"aqua:anchore/syft" = "1.51.1"                               # SBOM of the tagged source: cargo-deny judges that tree, this inventories it ([tasks.sbom])
"aqua:release-plz/release-plz" = "0.3"                       # conventional-commit-driven semver + changelog
"aqua:jqlang/jq" = "1.7"                                     # JSON for shell tasks — the board gates parse `get_issue` payloads with it
# The measurement instrument for `mise run perf` (CLOUD-207). Batten runs as a
# PreToolUse hook, so its startup cost is paid on every mediated tool call, and
# that number is only defensible if the thing producing it is fixed: a change in
# how the sampler warms, discards outliers, or computes a quantile enters the
# series as a step change indistinguishable from a real regression. Pinned here
# with every other tool, so `mise.lock` carries its per-platform checksums.
#
# `aqua:`, never `cargo:` — batten.toml's `no-source-built-tool` rule refuses a
# tool compiled here, and hyperfine ships prebuilt linux-arm64/x64 and macOS
# assets, so `mise run lock-complete` can hold every platform this repo installs
# on. Deliberately NOT in ci.yml's install lists: nothing on the landing path
# measures (see .github/workflows/perf.yml for why measurement is scheduled).
"aqua:sharkdp/hyperfine" = "1.20.0"
# NOTE: no cargo-msrv pin, and since CLOUD-593 no MSRV gate needs one. It was
# already unpinnable — upstream ships no aarch64-unknown-linux binary in ANY
# release, so a release-asset backend locks no `linux-arm64` entry and `mise run
# lock-complete` rejects it, correctly, since an arm64 sandbox could then not
# provision at all; its `cargo:` backend sidesteps that rule but source-builds a
# large tree (it pulls the AWS SDK), measured 318s here, uncached, per run. The
# retired `msrv` task read the floor from `cargo metadata` and drove rustup
# directly to avoid all of that. Its replacement compares two strings.
# Coverage as a REPORT, never a gate (CLOUD-111): `mise run coverage`, surfaced
# by a scheduled workflow, deliberately absent from `verify` and from `final`.
# Unlike cargo-msrv above, this one ships aarch64-unknown-linux-gnu, so a
# release-asset backend locks every platform `lock-complete` requires.
"aqua:taiki-e/cargo-llvm-cov" = "0.9.0"
# Repo-practice scoring as a REPORT, never a gate (CLOUD-582), on the same terms
# coverage holds above. Measured 2026-08-13: this repository scores 5.2/10, and
# three of the four zero-scores are scorecard disagreeing with choices made
# deliberately — `Code-Review: 0` is trunk-based review-after-merge, and
# `Token-Permissions: 0` counts the landing lease's `actions: write` grants as
# excessive. Binding that exit code to landing would gate on a tool's opinion
# about our own design, which is the model-verdict shape non-negotiable rule 3
# refuses, wearing a scanner's clothes. So: scheduled workflow, absent from
# `verify` and from `final`, and `report-only-check` reds if that ever changes.
#
# aqua, and mise verifies its SLSA provenance on install — measured, "✓ SLSA
# provenance verified" — so `lock-complete` can hold every required platform.
"aqua:ossf/scorecard" = "5.5.0"
# NOTE: the fuzz driver (`mise run fuzz`, CLOUD-112) deliberately pins NO tool
# here, for the same shape of reason cargo-msrv does not — and it is upstream's
# constraint twice over, not a preference. cargo-fuzz 0.13.2 publishes x86_64
# assets ONLY (darwin-x64, linux-musl-x64, windows-x64), so a release-asset
# backend locks neither `linux-arm64` nor `macos-arm64` and `mise run
# lock-complete` rejects it. The `cargo:` backend that would sidestep that is
# refused by `no-source-built-tool` AND does not work regardless: mise builds a
# `cargo:` tool with the pinned stable toolchain, and cargo-fuzz 0.13.2's own
# dependencies once required a newer rustc than the pin (measured at the 1.85
# floor — `cargo-platform@0.3.3 requires rustc 1.91`). Since CLOUD-593 the floor
# tracks the pin, so that second reason no longer holds and the FIRST one carries
# the verdict alone: `no-source-built-tool` denies the backend outright. So there
# is no `[tools]` entry that can express this tool, and the
# task provisions it under the nightly libFuzzer needs anyway, pinned and only
# when missing — off the landing path entirely, like `[tasks.coverage]`'s
# component and, until CLOUD-593 retired it, `[tasks.msrv]`'s toolchain.
# The semver verifier (`mise run semver`, CLOUD-102): does the API delta match the
# bump release-plz will infer? `github:`, not `ubi:` — same upstream assets, but
# the github backend locks a url and a per-platform checksum and verifies GitHub
# artifact attestations and SLSA provenance, which is the CLOUD-281 lesson. Every
# platform `lock-complete` requires is published (aarch64-apple-darwin,
# aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu), so unlike cargo-msrv and
# cargo-fuzz above this one CAN be pinned as an attested binary.
#
# The task runs it under a rustup-fetched toolchain rather than the pin above:
# 0.50.0 refuses under 1.85.0 (needs >=1.93), and the 1.85-era release cannot
# resolve this crate's dependencies. That is a property of the TOOL, not of the
# crate, not of the floor — and since CLOUD-593 the floor tracks the pin above,
# so this tool's own requirement is the only number in play. Reasoning in
# `mise-tasks/semver.sh`.
"github:obi1kenobi/cargo-semver-checks" = "0.50.0"
# The Rego type checker, and the ONLY thing that refuses a rule reading a field
# the engine never emits (CLOUD-876). regorus evaluates at runtime and has no
# static undefined-field check; `opa check -s` has one, so the corpus is type
# checked here at build time and evaluated by regorus at runtime. Dev-only: it
# runs in the gate and in CI and reaches no consumer, which is what keeps a Go
# binary off the shipped surface entirely.
#
# The version is NOT free to choose — it must name the OPA release regorus
# declares compliance with, or a rule type checks under one implementation and
# evaluates under another. The `opa-tracks-regorus-compliance` policy row is that
# gate, over `REGORUS_OPA_COMPLIANCE` below.
#
# The native alternative was measured and refused (CLOUD-876): regorus's
# `Target`/`Schema` surface is behind upstream's `azure_policy` feature, which
# adds 28 packages including `jsonschema` (`evaluator-closure-check`'s IO_CRATES)
# and `core-foundation-sys` via chrono (`macos-link-check`'s FRAMEWORK_CRATES).
# Feature unification is additive, so it is not fixable from this manifest.
"aqua:open-policy-agent/opa" = "1.2.0"
# The Rego linter, and the half that makes the type check honest rather than
# theatre: with a schema DIRECTORY, `input` gets no global schema and any rule
# lacking a `# METADATA schemas:` block is silently unchecked, typing as `Any`.
# A Regal aggregate rule in `.regal/rules/` requires every rule in the corpus to
# carry one, so an unannotated rule is a refusal rather than a quiet pass.
"aqua:open-policy-agent/regal" = "0.42.0"
# mise-tasks/ holds real bash programs, so they get the same lint+format
# treatment Rust gets: shellcheck is their clippy, shfmt their rustfmt.
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.13.1"            # shfmt
# The parallel backend for `test:bats`. The shell suite was 83% of the `ci`
# job's hk gate and ran strictly serially: 247.01s of 298.87s on run
# 31531728503, against a 166s cargo chain beside it (CLOUD-386).
#
# bats' `--jobs` needs GNU parallel or this, and GNU parallel is not choosable
# here: it ships as a source tarball with no aqua/ubi/github-release
# coordinate, so it cannot be a [tools] key at all — and an `apt-get install`
# in ci.yml is the drift `ci-tools-check` exists to refuse. rush is a prebuilt
# Go binary with per-platform release assets, so `lock-complete` can hold every
# platform this repo installs on.
"aqua:shenwei356/rush" = "0.9.0"
"aqua:rhysd/actionlint" = "1.7.12" # workflow mistakes (zizmor covers workflow security)
"aqua:tamasfe/taplo" = "0.10.0"    # TOML lint + format — mise.toml is edited constantly
pkl = "0.32.1"                     # evaluates hk.pkl as a check, not only when hk runs it
# `deno fmt` is the formatter for every hand-authored format except TOML:
# Markdown, JSON/JSONC, and the YAML no other tool owns. One statically-linked
# binary that VENDORS the engines rather than fetching them — dprint's markdown
# plugin and `pretty_yaml` are compiled in (`cli/tools/fmt.rs`), so there is no
# plugin host, no format-time download, and no hash-optional Wasm. That is why
# it is here and dprint-as-a-host is not (CLOUD-104).
deno = "2.9.6"
# prettier formats the Markdown (AGENTS.md, CONTRIBUTING.md). It is the one
# npm tool here, so node comes with it and nothing else depends on either.
node = "24.20.0"
"npm:prettier" = "3.9.6"
# The validator for `renovate.json5` (CLOUD-655), run by `mise run record-verdicts`
# and adjudicated by `policy/validator-verdict-clean.rego` off the
# `renovate-config` row (CLOUD-1199, CLOUD-1262). It ships inside the `renovate`
# package itself — there is no smaller distribution of it — which is why the one
# npm tool above is now two.
#
# KEEP THIS PIN AND THAT ROW'S `version` EQUAL. They are two spellings of one
# decision, and the row puts the pin IN THE RECORD'S KEY, so a verdict taken at
# the old pin stops answering the moment this moves rather than answering wrongly.
#
# THREE TRUST EXEMPTIONS, AND THEY ARE NARROW BY VERSION RATHER THAN BY NAME.
# mise's `no-downgrade` trust policy refuses this graph: `@yarnpkg/core` 4.4.0 and
# `@yarnpkg/libzip` 3.2.0 carry SLSA provenance from the `yarnbot` publisher, and
# 4.4.4 / 3.2.2 carry none. Reviewed against npmjs.org on 2026-08-18 before
# excluding, as the refusal instructs: both were published manually by `arcanis`,
# Yarn's lead maintainer, and both report the SAME `gitHead`
# (`2eb9830716136d3b92c8db25065575a4d34378a3`) — one manual publish batch out of
# the Berry monorepo, which is the benign case the policy names ("a maintainer
# manually publishes"). A bare package name would exempt every future version;
# these pin the releases actually reviewed, so the next one is refused again
# until someone looks. `npm.shell_out=true` would have switched the whole check
# off and is not used.
#
# `fastq@1.20.2` is the third, reviewed 2026-08-29 (CLOUD-1136) on the same terms,
# and it is the one that turned every PR in the repository red at once. What
# distinguishes the two publishes is HOW rather than WHO: 1.20.1 went out through
# `mcollina/fastq`'s GitHub Actions OIDC flow, which is what minted its SLSA
# provenance, and 1.20.2 was published by hand by `matteo.collina` — the package's
# sole listed maintainer and the owner of every prior release — from npm 11.19.0,
# which mints none. Same repository, same npm signing key
# (`SHA256:DhQ8wR5APBvFHLF/+Tc+AYvPOdTpcIDqOhxsBHRwC7U`), and the packument's
# `gitHead` `4cdcc374ad2f2a606686ab9c8c5cf9ebec05ec03` is byte-identical to what
# the repository's own `v1.20.2` tag points at. Manual publish, real tag, unchanged
# origin: the benign case again.
#
# A VERSION-SCOPED EXEMPTION IS THE DOCUMENTED REMEDY, not a fallback from one.
# mise's npm backend documents the procedure for exactly this refusal under
# "Investigating trust downgrades": inspect the release, source tag/commit,
# publisher identity and tarball against npmjs.org; determine whether the
# maintainer published manually or outside the trusted workflow; report
# inconsistent evidence upstream; and "prefer version-scoped exceptions after
# review". That is the four steps above, in order, and this row is their result.
#
# A release-age cooldown would defend the class rather than this one package, and
# it is not available here: mise's npm backend exposes exactly seven tool options
# — `allow_builds`, `trust_policy_excludes`, `allow_low_downloads`, and the four
# `*_args` — and none is a quarantine. `aube_args` is documented as applying only
# when `npm.package_manager = "aube_cli"`, so it cannot carry one without also
# changing which package manager resolves this tree, and `MISE_MINIMUM_RELEASE_AGE`
# is a different control: it governs which TOOL VERSION is selected, never aube's
# transitive npm resolution. Whether `aube_cli` could carry a cooldown is untested
# and deliberately left open rather than guessed at.
#
# THE SEAM THAT BLOCKED THE BUMP IS GONE, and this is the note that used to say
# why it could not be (CLOUD-1262). Renovate 44 reads the `RENOVATE_CONFIG`
# environment variable as INLINE JSON5 config, and the retired
# `mise-tasks/renovate-config-validator.sh:32` used that same name for the path
# seam its suite set — so the validator was handed `/tmp/.../renovate.json5` as
# CONTENT and died at `invalid character 't' at 1:2`. Repairing it meant editing
# authored shell frozen by `shell edit refused`, whose sole route is
# `rule read first`, which is why the bump owed a retirement rather than a
# rename. That retirement has now landed: the path is an argument in
# `[tasks.record-verdicts]` and the input is `batten.toml`'s `renovate-config`
# row, so there is no environment variable left to collide.
#
# `fastq@1.20.2`'s trust refusal — the OTHER half, and the one that turned every
# PR red at once — is cleared by the version-scoped exemption above (CLOUD-1136).
# Both blockers the two reverted attempts hit are therefore answered.
#
# SO THE PIN MOVED, AND IT MOVED ON MEASUREMENTS RATHER THAN ON THE TWO ABOVE
# BEING ANSWERED — which is the difference between this lap and the two reverted
# ones, both of which bumped first and discovered the seam under `verify`. Taken
# on this container before the edit: `mise install npm:renovate@44.52.1` resolved
# and linked 611 packages with the three trust exemptions above and no refusal;
# the 44 validator exits 0 over this repository's `renovate.json5`; and it exits 1
# over a config carrying `notARealOption`, which is the discriminating half — a
# validator that only ever passes is the dead gate this whole change is about.
#
# ONE BEHAVIOUR DIFFERENCE, NAMED RATHER THAN LEFT TO BE FOUND: 44 reports
# `Validating renovate.json5 as global config` where 41 reported
# `Validating renovate.json5`. The refusal above was taken at 44, so the option
# check still discriminates; whether the global-vs-repo classification changes
# which options are legal is not something this repository's own config can
# answer, and `record-verdicts` records what the validator says either way.
#
# THE STANDING DEFECT THIS EXPOSES, recorded because the next occurrence is a
# matter of time rather than of luck: `mise.lock` records this tool as a version,
# a backend and these options — no url, no checksum, no dependency tree, unlike
# `node` and `rust` which carry a per-platform checksum and url. So every
# transitive package re-resolves from the registry on every install (611 of them
# at this pin, measured above), and any upstream publish can turn CI red on a
# commit that did not move. That is `lock-complete` versus `lock-currency`'s own
# distinction arriving from the npm side, and it is CLOUD-1136's second finding.
"npm:renovate" = { version = "44.52.1", trust_policy_excludes = [
  "@yarnpkg/core@4.4.4",
  "@yarnpkg/libzip@3.2.2",
  "fastq@1.20.2",
] }
zig = "0.16" # the linker for the macOS release build and the darwin-link gate: zig carries Darwin linker support, so Linux emits a Mach-O with no Apple SDK
# github:, not ubi: — same upstream release assets, but the github backend locks
# a url and a per-platform checksum where ubi locked a bare version and nothing
# else, which made this the one tool installed from an unverified download
# (CLOUD-281). Prebuilt either way, so its own MSRV never constrains this repo's
# pin — the property is that nothing here builds it from source, which held at
# the old 1.85 floor and holds unchanged at the pin the floor now tracks.
"github:rust-cross/cargo-zigbuild" = "0.23.2"
# The workspace test runner (CLOUD-813). `github:`, not `ubi:`, for the reason
# stated three lines above — ubi locks a bare version and no checksum, which is
# how the one unverified download got in (CLOUD-281). The tag is the whole
# `cargo-nextest-<v>` string because this repository publishes several crates
# from one repo and the release assets hang off the per-crate tag.
#
# Measured 2026-08-21 on this workspace, warm build excluded, 4 cores:
# `cargo test --workspace --lib --bins --tests` 55s against
# `cargo nextest run --workspace` 43s, both reporting 1913 passed. The counts
# being equal is the load-bearing half — a runner that got faster by running
# fewer is the failure this swap could hide, and it is asserted rather than
# eyeballed.
"github:nextest-rs/nextest" = "cargo-nextest-0.9.104"
# The binary-level SBOM's producer (CLOUD-263). `batten sbom` inventories the
# repository at the tag; syft against a plain Rust binary recovers ZERO
# rust-crate packages, because a Rust binary carries no dependency metadata unless
# something puts it there. `cargo auditable` puts it there — a `dep-v0` linker
# section syft's `cargo-auditable-binary-cataloger` reads back out of the shipped
# bytes — which is what turns the per-archive claim from "the manifest said" into
# "these bytes contain".
#
# `github:`, not `aqua:` (not in the registry, checked) and not `cargo:`
# (`no-source-built-tool` forbids building a third-party tool here). The github
# backend locks a url and a per-platform checksum, the CLOUD-281 distinction
# already applied to cargo-zigbuild above.
#
# Measured 2026-08-14, `--profile dist` with `strip = true` left on: the audit
# section SURVIVES the strip (85 rust-crate packages recovered from the stripped
# host binary against 0 from the baseline), and the host binary grew 187,616 bytes
# (+3.5%). `cargo auditable zigbuild` composes; the `cross` legs are NOT wrapped,
# because Docker was unavailable in the probe container and an unproven build
# wrapper does not go into the matrix that shipped six empty releases.
"github:rust-secure-code/cargo-auditable" = "0.7.5"
zizmor = "1.30.0"                                   # GitHub Actions static analysis; run via `mise run zizmor` (in `verify` and CI)
uv = "0.12.5"                                       # fast Rust installer the pipx: backend uses to fetch Serena
# Serena's LSP-backed semantic code tools (see .mcp.json). Pinned here — not in
# .mcp.json — so its version lives with every other tool and lands in mise.lock.
# The pipx backend installs it with `uv` (present above), keeping the fast resolver.
"pipx:serena-agent" = "1.7.0"
# The SBOM conformance checker the `sbom-ntia-*` rows in batten.toml run
# (CLOUD-580, adopted by CLOUD-279 verdict 1). It answers the question
# `mise run sbom-check` cannot: that gate asks whether the inventory describes
# this tree, this one asks whether the inventory meets the NTIA/CISA minimum
# elements a procurement review checks for. Two different claims, and CLOUD-279's
# M1 measured that v0.0.52's published SPDX satisfies the first and fails the
# second under both standards.
#
# `pipx:`, and NOT by choice — upstream v5.0.3 publishes ZERO release assets, so
# `[[provision]]` (url + sha256 -> one binary) has nothing to point at and
# neither `aqua:` nor `github:` can express this tool at all. A `cargo:`-style
# source build is not the fallback either: it is a Python package, and
# `no-source-built-tool` refuses that shape regardless of language.
#
# EXEMPT FROM URL LOCKING IS NOT EXEMPT FROM THE LOCKFILE, and the difference
# costs a whole CI run to learn: `mise lock pipx:ntia-conformance-checker` writes
# "0 platform entries (7 skipped)" and still adds a version row to `mise.lock`,
# which is what CI's `mise install --locked` demands. Without that row EVERY job
# using mise-action dies on `pipx:ntia-conformance-checker@5.0.3 is not in the
# lockfile` — not just the job that installs it — because the check is over the
# whole file. `lock-complete` CATCHES IT NOW (CLOUD-611): its presence clause
# stopped inheriting the url question's backend exemption, so a `[tools]` key
# with no `mise.lock` row is a finding on every backend. This comment used to end
# "passes either way, so nothing local catches it", which was true and was the
# blind spot.
#
# WHAT THAT COSTS, stated because it is strictly weaker than every other pin
# here: `mise-tasks/lock-complete.sh` exempts the `pipx:` backend by design (those
# backends "resolve through their own package manager and lock no URLs at all"),
# so this pin binds a VERSION but not BYTES. `uv`'s `--require-hashes`
# resolution is the reachable mitigation if a version-only pin is ever judged
# insufficient; it is not adopted here because it needs a hash-pinned
# requirements file this repo does not yet carry (CLOUD-580 records it).
"pipx:ntia-conformance-checker" = "5.0.3"

[env]
CARGO_TERM_COLOR = "always"
# WHICH NEXTEST PROFILE APPLIES, and therefore whether the suite stops at the
# first failure (review of #928). `.config/nextest.toml` states both halves and
# why they differ; this decides which one is in force, once, for every leg that
# goes through mise — `mise run test:cargo` and the two `mise exec -- cargo
# nextest` lines the foreign runners use.
#
# HERE RATHER THAN IN THE TASK BODY, because the task's cargo statement is read
# byte-for-byte by `ci-local-parity`'s property 16 and a `--profile` flag breaks
# it; and HERE RATHER THAN IN EACH WORKFLOW, because a new job would have to
# remember it and a forgotten one silently runs the wrong posture on metered
# minutes.
#
# `$CI` is the discriminator every forge runner sets and no local shell does.
NEXTEST_PROFILE = "{% if env.CI %}ci{% else %}default{% endif %}"
# THE CHECKSUM MANIFEST'S ONE NAME (CLOUD-278). `checksums` writes it and
# `release-assets-record` looks for it on the release; both read it from here, so
# the two cannot drift. It replaced asking `checksums.sh --names` by path when
# that program moved inline under CLOUD-1717.
BATTEN_CHECKSUM_MANIFEST = "SHA256SUMS"
# THE CLI REFERENCE'S ONE NAME (CLOUD-171), for the same reason: `render:cli`
# writes it and `release-assets-record` looks for it, and it replaced asking
# `render/cli.sh --names` by path when that program moved inline (CLOUD-1752).
BATTEN_CLI_REFERENCE = "batten-cli-reference.md"
# bats comes from the tests/bats submodule, not a mise tool, and this is what
# puts it on PATH. A tool pin would be the obvious choice and is the wrong one:
# the published package is a GitHub *source archive*, and those are not
# byte-stable, so `mise lock` records a checksum a later download legitimately
# fails (CI hit exactly that: "Checksum mismatch ...
# bats-core/archive/refs/tags/v1.14.0.tar.gz"). A submodule pins the commit
# itself, so there is nothing to re-download or re-hash. The rule generalises:
# lock a binary artifact, vendor a source tree. Run `git submodule update
# --init` once per clone.
#
# `target/release` IS THE SECOND ENTRY, AND IT IS THIS CHECKOUT'S BINARY WINNING
# OVER AN INSTALLED ONE. Four task bodies invoke `batten` as a bare word —
# `checks green`, `pr watch`, `task`, `task alive` — and nothing put a build
# directory on PATH, so they resolved whatever `install:local` last copied to
# `~/.local/bin`. That is a DIFFERENT binary from the tree the task is running
# against the moment anybody edits `crates/`, and it answers confidently.
#
# Measured while landing CLOUD-1338: three consecutive `batten override request`
# calls refused a `batten.toml` the working tree had just grown a key for —
# `unknown field fast_forward_branches`, then `unknown field receipt` — because
# the installed binary predated the config it was judging. A gate reading a
# config its own schema does not know is the loudest form of this; the quiet form
# is a task that agrees with a stale answer.
#
# A path entry rather than `cargo run --quiet -p batten --` in each body, which
# was the other candidate: `alive` exists to answer WHILE something else is
# building, and `cargo run` would block on the target-dir lock exactly then.
#
# WHAT THIS DOES NOT DO, and the previous wording claimed the opposite. It said a
# clean checkout with no build "still fails loudly — `batten: command not found`
# is an honest report". That is FALSE: `_.path` PREPENDS, so an absent
# `target/release/batten` falls through to whatever `~/.local/bin` holds — the
# stale binary this entry exists to stop being reached. A false assurance is
# worse than a stated gap, which is this repository's own recurring lesson.
#
# The compensating control is provisioning rather than resolution:
# `[tasks."session:batten"]` runs `install:local`, which BUILDS the release
# binary at session start and reports an `::error::` with a log pointer when it
# cannot. So the ordinary session has the tree's own binary before any task runs,
# and a session that does not has already said so out loud. Making the fallback
# itself refuse needs a mechanism `_.path` has no spelling for. Found in review.
_.path = ["tests/bats/bin", "target/release"]
# The checks that carry a verdict about THIS repository, named exactly as GitHub
# names their check-runs (the matrix leg's suffix included). Shared by `ci-wait`
# ("is this SHA green?") and `land`'s `graded_runs` ("does this SHA carry an
# answer yet?") for the same reason `[commit].subject_pattern` is single: a copy that
# drifted would put `land` back to waiting on runs that will never be graded.
#
# It exists because "any graded run" is not the question. `SonarCloud Code
# Analysis` and `release-plz` are not draft-gated, so they grade on the draft
# push and satisfied the old predicate by themselves — waving through a set in
# which every check that builds this repository was `skipped`. That landed #261
# on a SHA no CI run of ours ever judged (CLOUD-327).
#
# Hand-maintained, and NOT on the honour system: `mise run ci-local-parity` fails
# if a name here matches no job, or if a `pull_request` job is missing from here.
#
# This is NOT superseded by `batten.toml`'s `[ci].required_checks`, which an
# earlier revision of this comment named as its eventual replacement. CLOUD-54
# landed that table and it answers a different question: `ci::derive` reads the
# host rules API and records what BRANCH PROTECTION requires, which is `final`
# alone — the fan-in. This roster is what `ci-wait` WAITS ON before landing, and
# waiting only on `final` would strand every landing on a check that fans in from
# eighteen. Two sets, two purposes; neither derives the other.
CI_REQUIRED_CHECKS = "ci,batten-check,bats,cross,musl,commit-lint,zizmor,darwin-link (aarch64-apple-darwin),darwin-link (x86_64-apple-darwin),semver,perf,windows,macos,final,action (ubuntu-latest),action (macos-latest),action (windows-latest),action-violation,action-deny,action-usage,action-internal (ubuntu-latest),action-internal (macos-latest),action-final"

# ─── THE LAP'S READY PHASE (CLOUD-1148) ───────────────────────────────────────
#
# `batten land lap`'s ready step reads the pull request's BODY and asks the gates
# that judge it. Both halves are declared here rather than compiled in, and that
# is non-negotiable rule 1 rather than taste: a task name — or a forge client's
# argv — inside `crates/batten` is that rule's plainest violation, and the engine
# refuses to default either.
#
# THE ENGINE TREATS THESE TWO ASYMMETRICALLY, on purpose. An UNDECLARED gate list
# is a legitimate configuration and passes; a DECLARED gate that cannot run is a
# refusal, because a gate whose verdict is unknown has not said clean. So a typo
# in a task name here stops a lap rather than quietly retiring the gate — which
# is the failure this whole campaign is about.
#
# `|`-separated argvs, space-separated words. A comma would give one argv per
# word.
#
# WHY THESE TWO AND NOT `filed-here-check`: that gate is already the engine's
# (CLOUD-1051) and the lap reaches it through `batten check`, so listing it here
# would run it twice. These two are still bash and still have `land.sh` as their
# only caller — which is what slice 7's deletion would orphan.
LAND_BODY_SOURCE = "gh pr view --json body --jq .body"
LAND_BODY_GATES = "mise run deferral-check|mise run closing-key-check"
# THE ENTRY GATES, ASKED ONCE BEFORE THE FIRST LAP (CLOUD-1471). Same grammar and
# same asymmetry as `LAND_BODY_GATES`, and one difference that matters: the engine
# appends THE PULL REQUEST NUMBER to each argv, because which task drops a
# subscription is this consumer's vocabulary and which pull request is being
# landed is a fact the engine already resolved. A gate reading the number from its
# own environment would be a second authority over it.
#
# WHY THIS PAIR. AGENTS.md bans PR-webhook babysitting and the harness arms a
# subscription on every pull request this repo opens anyway, with no tool call
# behind it on two of the three measured (CLOUD-518) — so a deny rule on the tool
# closes only the path nobody used. `drop` FAILS OPEN and `check` does not, which
# is what keeps the pair safe on the critical path: off harness, no token or any
# non-200 mints nothing, `check` refuses exactly as before, and the manual
# `record` is still the way through (CLOUD-790).
#
# `land.sh` ran these two as its first act and nothing in the engine carried them,
# so retiring the lander would have dropped a live gate on the floor. Declared
# here, they survive the deletion with their caller intact.
# The `?` marks the drop ADVISORY, which is the pair's own asymmetry rather than
# a softening: the bash ran `drop … || true` and only `check` as an `if !`. Drop
# it and a `drop` that answers 1 (not dropped) or 2 (could not look) would stop
# the landing where the predecessor carried on to `check` — whose refusal is the
# one that names `record` as the way through.
LAND_ENTRY_GATES = "?mise run pr-unsubscribed drop|mise run pr-unsubscribed check"
# THE THREE THE LAP CANNOT RUN WITHOUT, AND NOTHING DECLARED THEM (review of
# #848). Every one of these is a consumer fact `crates/batten` refuses to guess —
# which is non-negotiable rule 1 working — but refusing to guess only reaches a
# working lander if the consumer then DECLARES them, and this file did not. Only
# the suites injected them, so `mise run land` could not complete: the entry
# gates resolved the repo to `pr_watch::REPO_PLACEHOLDER` and exited 3, and past
# that the empty `LAND_VERIFY` returned `Usage`, which `land::progress` maps to
# `Stop`. A gate that refuses to guess and a manifest that never answers are the
# same silence from the caller's side.
#
# `LAND_VERIFY` is the gate a lap re-proves the tree with, spelled as the argv it
# runs. It is `verify` rather than `verify:gated` deliberately: the lap owns the
# rebase, so the outer task's own linear-check is the one that must re-run per
# lap. The predecessor ran `mise run verify` directly, and this is that call site
# moved into config rather than a new decision.
LAND_VERIFY = "mise run verify"
# The receipt `verify` records for HEAD on a pass (`receipt record verify`, the
# last line of `verify:gated`). A lap whose HEAD already carries a valid one
# answers from it instead of re-running the whole gate (CLOUD-1891).
LAND_VERIFY_RECEIPT = "verify"
# The workflow whose runs carry the fast-forward bot's answer, as the BARE FILE
# NAME the endpoint takes. `fast_forward::answer_request` interpolates it as ONE
# path segment of `actions/workflows/{workflow}/runs`, so a value carrying
# slashes makes a route that does not exist: 404, no `workflow_runs` key,
# `Answer::Unknown("unreadable")`, and a landing that laps forever without ever
# reading its own answer.
#
# THE FIRST SPELLING HERE WAS `.github/workflows/fast-forward.yml` AND ITS
# COMMENT WAS WRONG TWICE (review of #848): it justified the path form by saying
# `fast_forward::Ask` matches a run's own `path`, which is `land::FanIn`'s
# question and `CI_FANIN_WORKFLOW`'s value, not this one. The predecessor used
# the bare name in exactly this position and so does every test in the tree.
LAND_WORKFLOW = "fast-forward.yml"
# THE WORKFLOW WHOSE RUNS A LANDING BUYS (CLOUD-843): `batten record divergence`
# grades the matrix a landing paid for from this file's runs and the landing
# bot's answers from `LAND_WORKFLOW`'s. The engine names neither (rule 1), so the
# retired task's literal `ci.yml` moved here, beside its sibling, as a bare name
# for `LAND_WORKFLOW`'s reason: it is a path segment of `actions/workflows/…`.
LAND_CI_WORKFLOW = "ci.yml"
# HOW MANY TIMES THE FAST-FORWARD POLL ASKS before reporting no answer. Its OWN
# row rather than `LAND_ANSWER_MAX_UNKNOWNS`, which bounds the CI wait: one name
# over two loops with two different defaults is a setting that cannot be tuned
# for either, and in the predecessor that name meant a third thing again (the
# count of unreadable bot answers, default 3) — so a consumer carrying it forward
# would have truncated the CI wait to about three seconds (review of #848).
LAND_ANSWER_ASKS = "120"
# THE RECLAIM CENSUS'S STOP NOTE (CLOUD-451), declared here because the program
# is this consumer's and a census name inside `crates/batten` is non-negotiable
# rule 1's plainest violation. The engine spawns it wherever a holder CHOSE to
# stop — `land lap` where the landing RETURNS (never where a lap hands its lease
# back and laps, which is a landing still running), `lease hold` on its stall
# bail, and `batten lease release` — and never on an exit path (CLOUD-491): an
# exit path runs on the container kill too, and a note from one would erase the
# only distinction the census draws.
#
# Both are ARGV for the engine's own `record census note` (CLOUD-843, retiring
# `[tasks.reclaim-census]`), decoded as `LAND_BODY_GATES` is and never a shell.
# The beat is the half that never existed, so the census's positive reading was
# unreachable. It runs ONCE, when `land lap` starts, before any lap or lease: the
# stop follows only where the landing returns, and the census reads only the kind
# of the last record, so no later beat inside that window could change a verdict.
# `lease hold`, unreached today, also writes it per renewal it applied.
LEASE_STOP_NOTE = "batten record census note x land-stopped"
LEASE_BEAT_NOTE = "batten record census note h"
# The subset of that roster for which ABSENCE — no check-run at all, as opposed
# to one that graded `skipped` — is a legitimate reading rather than a name that
# has not registered yet. Exactly two WORKFLOWS earn it, and each earns it twice
# over, on two independent grounds:
#
#   1. Their workflow is PATHS-FILTERED. `zizmor.yml` fires on
#      `.github/workflows/**` + `action.yml`; `test.yml` on `action.yml`, its own
#      file, and the fixture corpus. A PR touching none of
#      those paths creates no run for them, ever, on any event.
#   2. Neither declares `types:`, so both take the default
#      [opened, synchronize, reopened] — which omits `ready_for_review`,
#      precisely the event `land`'s `--undo` re-fire emits. Every other required
#      workflow names that type explicitly (see ci.yml, commit-lint.yml), so a
#      lap that re-readies a PR mints runs for all of them and none for these
#      two. Either ground alone would be enough; both hold.
#
# Two workflows, but TEN NAMES, because both grounds are properties of the
# WORKFLOW and `test.yml` now carries nine jobs (CLOUD-110). The matching here is
# by exact check-run name — `checks-green` splits this on `,` and compares against
# the run's `name`, matrix suffix included — so listing `action` alone would leave
# the other eight strict, and a lap that re-readies would then wait forever for
# runs that event cannot mint. Every job in a workflow named here belongs here.
#
# UNSET OR EMPTY IS THE STRICT DIRECTION — every roster name must be PRESENT —
# and that is the safe default because the two failures are not symmetric. A
# name this gate waits for that never arrives is a STALL: it is visible in the
# poll, it names itself, and adding it here clears it. A name it forgives that
# had merely not registered yet is a FALSE GREEN, and #280 measured where that
# ends — `commit-lint` grades in seconds on a fresh SHA while `ci`, `cross`,
# `msrv`, `semver`, `darwin-link` and `final` have not started, the old gate read
# that one success as the whole roster, and `land` posted /fast-forward into a
# branch protection still listing the other six as expected. The bot was
# rejected. A stall is recoverable; a false green is not (CLOUD-337).
CI_ABSENT_OK_CHECKS = "zizmor,cross,musl,darwin-link (aarch64-apple-darwin),darwin-link (x86_64-apple-darwin),semver,windows,macos,action (ubuntu-latest),action (macos-latest),action (windows-latest),action-violation,action-deny,action-usage,action-internal (ubuntu-latest),action-internal (macos-latest),action-final"
# The conclusions that CONSTITUTE AN ANSWER about a required check, written once
# and read by `checks-green` and by `land`'s `graded_runs` — for exactly the
# reason CI_REQUIRED_CHECKS is written once (CLOUD-327), and against exactly the
# defect that motivated it (CLOUD-376).
#
# CLOUD-363 was two awk programs disagreeing about one word. `land` counted
# `cancelled` as an answer; `checks-green` read it as red; the two composed into a
# branch wedge with no exit, and escaping it took a hand-minted SHA. What kept
# them in agreement afterwards was a paragraph of comment in each file explaining
# that the other existed — precisely the guarantee that had already failed:
# `neutral` was missing from `land`'s list until #302 added it, and nothing
# detected the gap. A human reading both files found it.
#
# `cancelled` and `skipped` are ABSENT from this set, and their absence is now one
# visible fact rather than an inference across two files. They are not bad
# conclusions — they are the absence of an answer, and reading either as red
# wedges a branch with no exit.
#
# THERE IS A THIRD READER, AND IT RECURRED EXACTLY AS THIS COMMENT PREDICTED
# (CLOUD-1831). `policy/forge-verdict-required.rego` is a `severity = "deny"` row
# that read `final skipped` as red — the same one word, the same wedge, measured
# on #973 and again on #974 where it cost four laps. It now carries the
# complement of this set as `non_answers`, and the two are COMPLEMENTS RATHER
# THAN COPIES for a reason stated there: the module cannot spell this as the
# answered set without reintroducing CLOUD-900's false pass, because a record
# that omits the fan-in entirely fails an is-an-answer test too and would stop
# being refused. So a change to either list owes a look at the other, and the
# module's own comment points back here.
#
# THE CATCH-ALL IS GONE, which is the half that makes the next unknown conclusion
# FAIL SAFE. `checks-green` used to define red by negation, so a conclusion nobody
# had seen would be reported red on a head that had not been judged. Not in this
# set now means "no answer": the poll continues, which is recoverable, instead of
# a false red, which costs a re-draft and a lap.
#
# Unset is fatal in both readers, exactly as an unset CI_REQUIRED_CHECKS already
# is: an empty set makes every conclusion an answer, which is the false green in a
# new spelling.
CI_ANSWERED_CONCLUSIONS = "success,neutral,failure,timed_out,action_required"
# THE FAN-IN: the one required check that judges the others rather than the tree,
# and the workflow file it lives in. Two readers, one declaration (CLOUD-900).
#
# `checks-green` needs the NAME to answer a question CLOUD-363 left open. That
# row established that "no answer" must outrank red, on a measured set of
# `final failure` plus five `cancelled` — and the reasoning was specifically that
# `final` fans in over the others, so its failure was a CONSEQUENCE of the
# cancellations rather than a verdict on the tree. That reasoning is exactly
# right and it is exactly this narrow: a cancelled sibling can manufacture a
# FAN-IN failure and can manufacture nothing else. `ci` failing, or `windows`,
# judges the tree directly and cannot be produced by cancelling anything.
#
# Without the distinction, `abandon-matrix` would wedge every branch it saved
# money on: after the abandon a head carries one real `failure` beside several
# `cancelled`, the not-an-answer bucket outranks the red, and `ci-wait` polls a
# head whose verdict is already in. Naming the fan-in is what lets the ordering
# stay CLOUD-363's for the set CLOUD-363 measured, and become the failure for a
# set it never saw.
#
# `abandon-matrix` needs the WORKFLOW to know which run it must never cancel: an
# ungraded `final` is the one context branch protection requires, so stopping its
# run trades a saved matrix for a branch that cannot land at all.
#
# Both are checked against the tree by `ci-local-parity` property 17 rather than
# trusted — a fan-in named here that no workflow declares would silently disable
# the exclusion, which is the failure mode that costs the most.
CI_FANIN_CHECK = "final"
CI_FANIN_WORKFLOW = ".github/workflows/ci.yml"
# HOW A REQUIRED JOB RENDERS A VERDICT HERE (CLOUD-484, CLOUD-113), for `batten
# record nonverdict`: a failed job reached a verdict iff one of its failed steps
# starts with one of these prefixes, comma-separated. Each keeps its trailing
# space, which is what makes it a prefix of a step and not of a longer word.
# `Run mise exec -- ` is the second spelling, added after the `windows` job ran
# `mise exec -- cargo test` to keep the MSYS shell out of the toolchain's PATH
# and seven red tests read as a provisioning transient that `land` re-ran four
# times. ONE spelling for every caller — the scheduled job, the `[[record]]`
# writer, a route — because a spelling added to one copy and missed in another
# classifies verdicts as non-verdicts without a word. `CI_FANIN_CHECK` above is
# the job the same verb excludes.
CI_VERDICT_STEPS = "Run mise run ,Run mise exec -- "

# The gates `mise run mutant` ENFORCES (CLOUD-418). A gate named here with no
# `#MUTANT` declaration in its own file fails the sweep — that is the anti-vacuity
# term, and without it the task reports success over a set it never touched.
#
# A gate NOT named here is a FILED ROW, never a silent exemption: the remaining
# names are carried on CLOUD-480, `relatedTo` CLOUD-418. The property this buys is
# "coverage cannot be silently zero", which a visible list with filed gaps has and
# which forty hastily-written declarations would not — while adding branch age,
# the thing that multiplies laps and CI runs, to the change that reduces them.
#
# Seeded with the gates this bundle touches, so every "mutation-checked per
# CLOUD-418" obligation in it is cashed rather than cited.
# Upstream regorus's declared OPA compliance level, and the regorus line it was
# read against (CLOUD-876). Both are read by the `opa-tracks-regorus-compliance`
# policy row, which holds the `[tools]` opa pin to the first and the `Cargo.toml`
# regorus pin to the second.
#
# THE SECOND KEY IS WHAT STOPS THE FIRST ROTTING. A recorded compliance level on
# its own is a constant nobody re-reads. Tying it to the regorus line it was taken
# from means a regorus bump reddens — sending a human back to upstream's README
# exactly when upstream is the thing that moved, and never otherwise. Reading the
# README from a gate instead would answer "what does upstream claim right now",
# which is a property of the world and belongs on a clock (`lock-complete`).
# THE SHELL SUITE'S SLOW-TEST BAN, mirroring the nextest one (CLOUD-1571).
#
# `.config/nextest.toml` bans a slow RUST case with `slow-timeout`. bats had no
# equivalent, so a hung shell case had nothing to stop it — measured on this
# branch: `land.bats`'s "main moving mid-wait starts the next lap" sat at 0% CPU
# for 40 MINUTES inside `verify`, holding the landing lease, with no output and
# no diagnostic. The case is a stubbed race between `ci-wait` and `main-watch`,
# and under a loaded box the race did not resolve.
#
# A hang is the worst shape a test failure takes: it produces no verdict, spends
# unbounded wall clock, and on the landing path it holds a singleton the whole
# time. 300s matches the nextest kill, so both suites answer "too slow" with one
# number, and it is far above the whole suite's per-case cost — bats finishes all
# of its cases in ~228s together.
BATS_TEST_TIMEOUT = "300"
REGORUS_OPA_COMPLIANCE = "1.2.0"
REGORUS_OPA_COMPLIANCE_FOR = "0.11"
MUTANT_GATES = "agentic-experiment-record,answer-the-operator,claude-code-cloud,engine-disk-watch,engine-prune,awk-regex,bats-invocation,cap-drift,cfg-gated-test,ci-cache-declared,ci-hygiene,ci-parity,ci-slow-inert,ci-suite-lane,ci-tools,claim-before-code,claim-order-is-stated,coderabbit-config,commit-hygiene,dead-capability,denials-outlive-the-turn,digest-major-agreement,egress-fencing,engine-checks-green,engine-config,engine-doctor,engine-exec,engine-handler,engine-hook,engine-land,engine-landed,engine-lease,engine-lib,engine-mcp,engine-perf,engine-pinned,engine-pipeline,engine-policy,engine-ready,engine-speculation,engine-surface,engine-verdict,engine-wiring,filed-here,could-not-look-laundered,fixture-forks,forge-verdict-required,glob-containment,graph-check,harness-grant,harness-wiring,hk-fix-selection,hk-plan-required,hook-pin-check,hook-skip-local,landing-loop,landing-roster-guarded,leased-push,license-table,lock-complete,mcp-timeout-budget,mise,mise-action-floor,mise-pin-agreement,module-map,msrv-pin-agreement,mutation-declared-case,nextest-slow,no-doctests,obligations-bound,perf-assert,pinned-toolchain,pipefail-grep,plan-complete,pr-partition-restated,pr-unsubscribed,privileged-lane,prose-only,publish-credential,ready-cites-check,ready-lint,release-due,release-provision-parity,release-tag-shape,remedy-authorship,repetition-without-progress,report-only,review-answered,review-dispatched,rules-paths-trigger,run-shape,rust-paths-check,sbom-inventory,shell-hygiene,shell-retirement,shell-write-advisory,skill-frontmatter-complete,spawn-widening,spec-ref-check,stop-posture,suite-cost-corpus,suite-subject-retirable,task-substitution,test-targets,timeout-budget,trunk-based,validator-verdict-clean,verdict-routes-resolve,weakens-declared,worktree-registration,engine-mutate,task-target-prune,engine-task,run-arg-shape,engine-cargo-graph,branch-age,task-released,evaluator-closure,evaluator-io-probe,agent-spawn,macos-link,ntia,task-test:cargo,release-tracking,sbom-actions,t