# The single source of truth for this repo's dev environment: every tool, env
# var, and task lives here, so CI, git hooks, and local shells all run the exact
# same thing. Provisioned by mise (https://mise.jdx.dev).
#
#   mise install       # get every tool below at its pinned version
#   mise tasks         # list the tasks
#   mise run ci        # everything CI runs, locally

[tools]
rust = { version = "1.85.0", components = "rustfmt,clippy" }
hk = "1.54.0"                 # git-hook runner (see hk.pkl)
"aqua:cli/cli" = "2.97"       # gh — reads CI checks (repo scope bundles checks-read) and drives PRs; `gh pr checks --watch`
"aqua:EmbarkStudios/cargo-deny" = "0.20"  # dependency license/advisory policy (deny.toml)
"aqua:release-plz/release-plz" = "0.3"    # conventional-commit-driven semver + changelog
uv = "0.8"                    # fast Rust installer the pipx: backend uses to fetch Serena
# Serena's LSP-backed semantic code tools (see .mcp.json). Pinned here — not in
# .mcp.json — so its version lives with every other tool and lands in mise.lock.
# The pipx backend installs it with `uv` (present above), keeping the fast resolver.
"pipx:serena-agent" = "1.6.1"

[env]
CARGO_TERM_COLOR = "always"
# Conventional Commits subject pattern, shared by the commit-msg hook and the CI
# commit linter so there is exactly one definition of "valid commit".
CONVENTIONAL_RE = '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)([(][a-z0-9._-]+[)])?!?: .+'

# --- GitHub reachability behind an egress proxy (Claude Code web sandbox etc.) ---
# mise resolves every tool's release through GitHub's *API* host, api.github.com.
# When an egress proxy fronts the network (HTTPS_PROXY set) and injects a
# repo-scoped token, that host answers 403 for third-party tool repos and a bare
# `mise install` fails ("GitHub access to this repository is not enabled"). The
# fix is not to give up — GitHub is reachable — it is to send just the API/asset
# hosts straight to GitHub and let mise authenticate with the session PAT:
#   * MISE_GITHUB_TOKEN uses GITHUB_PERSONAL_ACCESS_TOKEN when present. It is
#     mise-only, so the proxy's own GITHUB_TOKEN (which authenticates git to
#     private repos) is left untouched. Empty when there is no PAT.
#   * NO_PROXY gains api.github.com (+ the redirect/asset hosts) so those calls
#     bypass the proxy. github.com itself is deliberately left proxied, so git
#     keeps its proxy-provided auth to button-inc/batten. The guard appends once
#     and preserves the existing NO_PROXY (which carries pypi.org/crates so the
#     uv-backed Serena install keeps working). Off-sandbox there is no proxy, so
#     this is a no-op.
# See AGENTS.md, "GitHub is reachable — never report the toolchain as unrunnable".
MISE_GITHUB_TOKEN = "{{ get_env(name='GITHUB_PERSONAL_ACCESS_TOKEN', default='') }}"
# `gh` reads GH_TOKEN, not MISE_GITHUB_TOKEN, so mirror the PAT into it too. In the
# sandbox the ambient GH_TOKEN is a proxy placeholder that 401s when sent direct
# (NO_PROXY, above); overriding it with our PAT is what makes `mise exec -- gh …`
# work. Empty off-sandbox / in CI, where gh uses its own auth or the job's token.
GH_TOKEN = "{{ get_env(name='GITHUB_PERSONAL_ACCESS_TOKEN', default='') }}"
NO_PROXY = "{% set cur = get_env(name='NO_PROXY', default='') %}{% if 'api.github.com' in cur %}{{ cur }}{% else %}api.github.com,objects.githubusercontent.com,codeload.github.com,uploads.github.com{% if cur %},{{ cur }}{% endif %}{% endif %}"
no_proxy = "{% set cur = get_env(name='no_proxy', default=get_env(name='NO_PROXY', default='')) %}{% if 'api.github.com' in cur %}{{ cur }}{% else %}api.github.com,objects.githubusercontent.com,codeload.github.com,uploads.github.com{% if cur %},{{ cur }}{% endif %}{% endif %}"

[tasks.fmt]
description = "Format all code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy with warnings denied"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run the workspace test suite"
run = "cargo test --workspace"

[tasks.deny]
description = "cargo-deny: licenses, advisories, sources"
run = "cargo deny check"

[tasks.cross-check]
description = "Type-check for other targets from Linux (no macOS runner needed)"
run = '''
for t in x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-gnu; do
  rustup target add "$t"
  # `check` does codegen-to-metadata without linking, so it needs no target
  # linker or SDK — cross-platform compile coverage at Linux-runner cost.
  cargo check --workspace --target "$t"
done
'''

[tasks.hk-version]
description = "Gate: hk's version is pinned identically in mise.toml and hk.pkl (amends URL). A bump to one without the other is the moment to revisit the hook config."
shell = "bash -c"   # uses grep -oE + cut; keep off /bin/sh for consistency
run = '''
mise_v=$(grep -E '^hk = ' mise.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
pkl_v=$(grep -oE 'hk@[0-9]+\.[0-9]+\.[0-9]+' hk.pkl | head -n1 | cut -d@ -f2)
if [ "${mise_v:?}" != "${pkl_v:?}" ]; then
  echo "::error:: hk version drift: mise.toml pins $mise_v but hk.pkl amends $pkl_v." >&2
  echo "Sync both, then revisit hk.pkl for new features worth adopting (see AGENTS.md)." >&2
  exit 1
fi
echo "hk-version: mise.toml and hk.pkl agree on hk $mise_v"
'''

[tasks.hooks]
description = "Run the git-hook gate (fmt, lint, test) through hk — the same hk.pkl the pre-commit hook uses, in check-only mode"
run = "hk check --all"

[tasks.ci]
description = "Everything CI runs"
# fmt-check + lint + test come from the SAME hk.pkl the pre-commit hook runs
# (via `hooks`), so CI exercises the hook config itself; `deny` rounds it out.
depends = ["hooks", "deny"]

[tasks.verify]
description = "Full local pre-flight — run this before marking any draft PR ready"
shell = "bash -c"
depends = ["ci", "cross-check"]
run = '''
git fetch -q origin main
main=$(git rev-parse origin/main)
if [ "$(git merge-base origin/main HEAD)" != "$main" ]; then
  echo "::error:: not rebased on latest main ($main). Run: git rebase origin/main" >&2
  exit 1
fi
BASE_SHA="$main" HEAD_SHA="$(git rev-parse HEAD)" mise run commit-lint
echo "verify: fast-forward-green — rebased on latest main, ci + cross + commit-lint all pass"
'''

[tasks.commit-msg]
description = "Validate one commit-message file is Conventional Commits"
run = '''
head -n1 "{{arg(name="file")}}" | grep -Eq "$CONVENTIONAL_RE" \
  || { echo 'commit-msg: subject must follow Conventional Commits, e.g. "feat(cli): add check subcommand"'; exit 1; }
'''

[tasks.commit-lint]
description = "Validate every commit in BASE_SHA..HEAD_SHA is Conventional Commits"
shell = "bash -c"   # uses ${sha:0:8}; mise defaults tasks to /bin/sh (dash)
run = '''
fail=0
for sha in $(git rev-list --no-merges "${BASE_SHA:?}..${HEAD_SHA:?}"); do
  subject=$(git show -s --format=%s "$sha")
  if printf '%s' "$subject" | grep -Eq "$CONVENTIONAL_RE"; then
    echo "OK    ${sha:0:8}  $subject"
  else
    echo "::error::Non-conventional commit ${sha:0:8}: '$subject'"
    fail=1
  fi
done
exit $fail
'''

[tasks.release-pr]
description = "Open/update the release PR (version bump + changelog)"
# release-plz derives the next version by diffing each crate against its last
# *published* release, downloaded from a cargo registry. This workspace is
# `publish = false` and never reaches a registry, so that download fails
# ("Package batten not found") and release-plz can never bump past the initial
# version — every run reports "next version is 0.0.0". The documented fix for
# unpublished crates is to supply the baseline as a checkout of the latest
# release tag via --registry-manifest-path. With no tag yet (first release),
# pass nothing and let release-plz treat it as the initial version.
run = '''
set -eu
base_args=""
tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)"
if [ -n "$tag" ]; then
  worktree="$(mktemp -d)"
  git worktree add -q --detach "$worktree" "$tag"
  trap 'git worktree remove --force "$worktree" >/dev/null 2>&1 || true' EXIT
  base_args="--registry-manifest-path $worktree/Cargo.toml"
fi
release-plz release-pr --git-token "${GITHUB_TOKEN:?}" $base_args
'''

[tasks.release]
description = "Tag and publish a GitHub release when the version changed"
run = "release-plz release --git-token ${GITHUB_TOKEN:?}"

[settings]
lockfile = true
