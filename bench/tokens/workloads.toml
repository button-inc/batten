# The benchmark's workloads, as data (CLOUD-119).
#
# One table per capability. A workload names the QUESTION an agent is trying to
# answer, the step sequence a typical agent runs to answer it without Batten, and
# the step sequence it runs with Batten. `mise-tasks/token-bench.sh` executes both arms
# against the committed fixture and counts the bytes each puts into a context
# window; it invents no step and no assumption of its own.
#
# WHY THE BASELINE IS A SEQUENCE. "Cost per completed task" is the headline unit
# (Cost-of-Pass, arXiv:2504.13359), and a task an agent answers in two commands
# costs two commands' worth of context. Writing the baseline as steps makes the
# re-run visible and countable instead of a coefficient somebody chose: the run
# count in the results table IS the length of this list.
#
# EVERY ARM IS RUN `runs` TIMES AND ITS OUTPUT COMPARED BYTE-FOR-BYTE. An arm
# that is not byte-stable is reported as such and never averaged — averaging is
# how a non-deterministic tool acquires a number it cannot support, and
# byte-stability is precisely the property the cache claim rests on.
#
# `$BATTEN` is substituted with the binary under test, so the harness always
# judges the working tree's engine rather than whatever is on PATH.

version = 1

# --- scan → pointer -----------------------------------------------------------

[[workload]]
id = "scan-pointer"
capability = "pointer-only check output"
fixture = "scan-pointer"
question = "Which files and lines carry the banned pattern?"
runs = 3

baseline = ["grep -rnF '.unwrap()' src"]
baseline_model = """
The full matched output: one whole source line per hit, every hit. This is what a \
tree scan puts into an agent's context today, and it carries the matched bytes \
themselves — the payload rather than a pointer to it, which is what makes the \
same shape unusable over content nobody wants echoed."""

batten = ["$BATTEN check"]
batten_model = """
`path:line rule-id` per finding and nothing else (non-negotiable rule 4). Same \
question, same file set, same number of findings — only the answer's shape \
differs."""

# --- long build output → the warning line --------------------------------------

[[workload]]
id = "build-warning"
capability = "exec output predicate"
fixture = "build-warning"
question = "Does this build's own output say it is not actually done, and where?"
runs = 3

baseline = ["tail -n 200 build.log", "cat build.log"]
baseline_model = """
The named pain, modelled as the two commands it actually costs: the agent pipes \
to `tail`, the warning is above the window, so it re-runs and takes the whole \
dump. Two steps, both billed. The fixture places the warning outside a 200-line \
tail on purpose — that is the case worth measuring, and a fixture that put it \
inside would be measuring the lucky guess."""

batten = ["$BATTEN exec -- cat build.log"]
batten_model = """
One step, and the reduction is exactly the discarded `tail` window — nothing \
more. `exec` TEES (CLOUD-162): the child's bytes reach the caller unchanged by \
design, so the agent still ingests the whole log, plus Batten's pointer to the \
line. What it stops paying for is the guess that missed. Whether the log itself \
becomes cheaper is CLOUD-121's question, not this one's, and the number here is \
reported at whatever it actually is rather than at what the story would like."""

# --- a large log → a handle ----------------------------------------------------

[[workload]]
id = "log-handle"
capability = "capture-once handles"
fixture = "build-warning"
question = "What is in this log around the line that matters, without re-running the command?"
runs = 3

# This row read "not measured — the capability is not shipped" until CLOUD-121
# shipped it. The harness measured rather than asserted, and this is the diff
# where that pays: the number below was produced by the same command a reader can
# run, not written by whoever wanted it to be good.
baseline = ["tail -n 200 build.log", "cat build.log"]
baseline_model = """
The same two commands `build-warning`'s baseline costs, because it is the same \
pain: guess a window, miss the line, re-run to widen. Repeated deliberately \
rather than cross-referenced — a workload whose baseline lives in another row is \
a figure a reader has to assemble."""

batten = [
  "$BATTEN exec --capture-only -- cat build.log",
  "$BATTEN capture show \"$($BATTEN capture list --stream stdout | cut -d' ' -f1)\" --grep 'warning[duplicate]'",
  "$BATTEN capture show \"$($BATTEN capture list --stream stdout | cut -d' ' -f1)\" --lines 125:130",
]
batten_model = """
Three steps and no second run of the command. `--capture-only` returns handles \
instead of the log, then the agent greps the frozen capture and widens around the \
line the grep named. The command substitution is the agent reading a handle out \
of step one's own pointer output — it costs nothing here because it costs nothing \
there either, the handle having already been printed. What this measures against \
the baseline is precisely the re-run the acceptance criterion says handles \
delete, plus the dump the agent never has to hold."""

# --- a board gate's input payload → the fields it decides on --------------------

[[workload]]
id = "board-gate-payload"
capability = "declared field sets on tracker-payload gates"
fixture = "board-gate-payload"
question = "How old was this clone's read of the issue it is about to update?"
runs = 3

baseline = ["cat issue.json"]
baseline_model = """
The whole `get_issue` payload, which is what `issue-read-check` demanded before \
CLOUD-526 — it hashed `.description` and read nothing else from it. THE BYTES ARE \
PAID ON THE MODEL'S OUTPUT SIDE, and that is the direction that makes this \
workload worth measuring at all. No tracker credential exists in a task, so the \
payload cannot be piped from disk: the model reads the row through the connector, \
carries it in context, and RE-TYPES it into the gate's stdin. The harness counts \
an arm's stdout, so the number below is the same bytes travelling the other way — \
metered generation, not ingestion. A table that reported this as context cost \
would be claiming something it did not measure. The fixture body sits at the small \
end of real ones (this repository's own issues run two to three times longer), so \
the ratio is a floor."""

batten = ["jq -c '{id, updatedAt}' issue.json"]
batten_model = """
The declared field set, and nothing else: which row was read, and at which \
revision. `description` is not in it, because after CLOUD-526 the baseline is an \
optional arm rather than the contract — and the same projection is what stops the \
honest receipt costing more than a forged one, which is the mechanism-design half \
of that issue rather than a saving. Narrowing is never a skip: a payload missing \
one of these two fields is refused by name, so sending less cannot buy a cleaner \
verdict."""
