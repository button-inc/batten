# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CLOUD-847. The point of this file is NOT more review prose — it is a VERDICT
# on the head, in the free draft phase, that a batten gate can decide over.
#
# Measured on #623, 2026-08-21, in three arms. Two of the three defaults fail,
# and the third failure is one this file cannot fix from a branch:
#
#   1. `drafts: false` — the draft phase is the free phase (every job in ci.yml
#      is `if: draft == false`), and it was the one phase nothing reviewed.
#      Arm A: `@coderabbitai review` reviews a draft in 193s, no matrix bought.
#   2. `request_changes_workflow: false` — the bot COMMENTS. A comment is not a
#      verdict: GitHub`s `reviewDecision` stays null, so nothing on the PR says
#      "findings outstanding" in a form a gate can read.
#   3. The commit status is NOT that verdict, and this file used to claim it
#      was. Arm C: with `fail_commit_status: true` in force at head c2778af,
#      a review posting "Actionable comments posted: 1" still set
#      `CodeRabbit = success — Review completed`. The reference says why —
#      `fail_commit_status` fails "on review errors", and `commit_status` only
#      mirrors review PROGRESS. Green with findings is the documented behaviour,
#      not a misconfiguration.
reviews:
  # THE VERDICT. With this on, findings arrive as CHANGES_REQUESTED rather than
  # a comment, so `reviewDecision` answers "is this head reviewed and clear" in
  # one GitHub-native field — the same field branch protection requires.
  request_changes_workflow: true

  auto_review:
    # Review the free phase. MEASURED CAVEAT: setting this on a feature branch
    # is not enough. At head c2778af `@coderabbitai configuration` reported
    # `drafts: true` sourced from this file, and the synchronize STILL posted
    # "Review skipped: draft pull request" — twice, 10s and 11s after the push.
    # The review honours the branch file; the auto-review skip did not. Landing
    # this on `main` is the prediction that distinguishes event-time config
    # resolution from a default-branch requirement.
    drafts: true
    # Iterating on a draft is the intended workflow, so a pause that assumes a
    # reviewed PR is finished works against it — and the DEFAULT of five reviewed
    # commits is about a morning's iteration here, which is why this is raised
    # rather than left alone.
    auto_pause_after_reviewed_commits: 50

  # `commit_status` is deliberately ABSENT. The reference says it "is only used
  # when review_progress is disabled", and `review_progress` defaults to true —
  # so setting it here changes nothing, and #623's own review said so. The
  # verdict is `reviewDecision`; a second, inert status surface beside it is the
  # thing a reader would mistake for the answer.

  # --- noise removal, not review policy -------------------------------------
  #
  # A review that narrates the diff competes with the verdict for the reader`s
  # attention, and the reader here is usually an agent that needs an answer.
  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  poem: false

  tools:
    # These already run as our own gates — `mise run ci` and the hk `gate` own
    # them, and CI`s verdict is the one `land` waits on. A second opinion posted
    # as a PR comment adds a finding surface with no gate behind it, which is
    # the shape non-negotiable rule 2 rejects.
    clippy:
      enabled: false
    shellcheck:
      enabled: false
    actionlint:
      enabled: false
    zizmor:
      enabled: false
    yamllint:
      enabled: false
    markdownlint:
      enabled: false
    regal:
      enabled: false
    gitleaks:
      enabled: false
