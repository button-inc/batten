gloss = "the run cannot say how many cases it executed, so a narrower run reads as a pass"
class = """
A suite that got faster by running fewer tests is the failure every change to \
this invocation risks, and a green exit is blind to it: a narrowed glob, a stray \
filter, or a worker that died mid-file all exit 0. The body counts the `@test` \
declarations across the suites it SELECTED and compares that against the runner's \
own report, both over one list — an `expected` derived from a second list is the \
defect wearing the fix's clothes. The junit report it leaves behind is the only \
per-case timing this repository produces, so discarding it takes the cost corpus \
with it.
"""

[[verdict.route]]
id = "R-COUNT-WHAT-RAN"
kind = "document"
target = "mise.toml"

[[verdict]]
id = "V-BATS-COST-UNMEASURED"
gloss = "nothing measures what the pole cost, or says which machine the measurement came from"
class = """
The pole of the gate is 85.9% of the job that is the CI critical path, and its \
cost grew 5.8x while every sensor stayed green. Three things keep that visible \
and each is in this class: the run measures its own wall clock against the \
recorded serial cost of the suites it selected; the worker sweep recorded beside \
the invocation names the hardware and date it was taken on, so one machine's \
optimum cannot read as a live instruction on another; and a measured `# budget:` \
in the workflow that runs the pole is re-measured whenever the pole moves, rather \
than sitting stale behind it. What is gated is that the measurement is TAKEN — \
never the duration, which is a property of the machine and is reported.
"""

