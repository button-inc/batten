# CLOUD-859's gate, migrated to the typed ABI when CLOUD-1050 landed. The class
# carries what the free string used to, and the count is the only subject the
# fact channel can honestly produce.
#
# THE CLASS NARROWED WITH THE FACT (CLOUD-690). It read "an unresolved review
# thread, or no review from anyone but the author", which was true of the `--jq`
# projection that folded both into one count. The row is tool-sourced now and
# counts one collection plus a page guard, so the second condition is
# `review read absent`'s below. Leaving it named here would send a reader looking for
# threads on a head whose only problem is that nobody looked.
# CLOUD-472. A declared review that never ran over these bytes.
#
# THE SUBJECT IS `prompt`, NOT `review`, and the distinction is load-bearing
# rather than fussy: `review answer missing` and `review read absent` below are
# about the FORGE's review of a pull request, and a reader meeting a third
# `review …` class would have to look up which kind it meant. This one is about a
# vendored prompt this repository dispatches itself.
[[verdict]]
id = "prompt run never"
gloss = "a review this branch declared it would run has not run over these bytes"
class = """
Refuses ABSENCE and nothing else. A declared id missing from the review store \
means the vendored prompt has not been shown to run over this subject, which is \
a comparison of two digests — a record keyed to another prompt, or to bytes that \
have since changed, lives under a different name and does not answer. What the \
agent CONCLUDED is never read: refusing on that would be a model verdict wearing \
an exit code, which non-negotiable rule 3 forbids, and the fact is shaped so it \
cannot be written. A review that ran and pointed at something is as clean as one \
that pointed at nothing, deliberately — pricing findings is how you buy an agent \
that reports none. This is the opposite arm from `forge check red`, which reads \
absence as could-not-look because the forge may legitimately not have judged \
yet; a review this branch was supposed to dispatch and did not is the branch's \
own conduct.
"""

[[verdict.route]]
id = "task run first"
kind = "command"
target = "mise run verify"

[[verdict.route]]
id = "task run other"
kind = "command"
target = "check the declared runner is installed and on PATH — a dispatch that cannot spawn leaves no record, exactly as one that never ran"

[[verdict.route]]
id = "path admit first"
kind = "override"
precondition = "the review cannot be dispatched in this environment at all — no runner exists here — rather than not having been dispatched in one where it could"

[[verdict]]
id = "review answer missing"
gloss = "readying would buy a CI matrix on a head carrying unresolved review threads"
class = """
Readying is the event that starts CI, and nothing in `land`'s pre-ready sequence \
asks about review. The count is the review threads still unresolved, plus one if \
the page the read asked for was capped — an unresolved thread beyond that page \
would otherwise read as zero, which is a false green in the one direction this \
gate exists to prevent. Replayed over the last 100 merges this fires on 89, so \
the common case is that there is something here to read. The thread ids are \
deliberately absent: the fact channel stores a COUNT and no byte of the buffer \
(non-negotiable rule 4), so the read that produced this number is also the only \
thing that can name them.
"""

[[verdict.route]]
id = "task run first"
kind = "command"
target = "resolve each thread, then read them again with pull_request_read and retry"

[[verdict.route]]
id = "task run other"
kind = "command"
target = "@coderabbitai full review"

# The condition the projection carried and a count over one array cannot
# (CLOUD-690). Its own class rather than a second reading of the one above,
# because the comparison is INVERTED — every other predicate here refuses on a
# count being non-zero and this refuses on zero — and because the remedies do not
# overlap: there is nothing to answer on a head nobody has looked at.
[[verdict]]
id = "review read absent"
gloss = "readying would buy a CI matrix on a head nobody has reviewed"
class = """
The read found no review at all, which the thread count cannot say: a head with \
zero threads is indistinguishable from a clean review and from an unread one, and \
passing it is the vacuity #618 measured. Force a review, answer what it says, and \
read again. What this does not catch is an author reviewing their own PR — \
deliberate forgery rather than the honest error this threat model names, and the \
comparison it would need is between two fields, which the selection cannot \
express (CLOUD-859 owns that half).
"""

[[verdict.route]]
id = "task run first"
kind = "command"
target = "@coderabbitai full review"

[[verdict.route]]
id = "task run other"
kind = "command"
target = "pull_request_read, method get_reviews, then retry"

# CLOUD-931's three refusals, migrated with the module. Three tokens rather than
# one, because a reader meeting an unplaced spawn and a reader meeting an absent
