# WHY `run-shape-guard` IS NOT A HANDLER ROW HERE, AND WHY THAT IS THE RATCHET
# WORKING (CLOUD-312 row 4, deferred).
#
# Going behind the door is not a config move: a dispatched handler's stdout is
# INTERPRETED, so `handler::impersonates_host` reads this guard's
# `hookSpecificOutput` deny document and drops it before the exit code is read.
# The guard would have to deny as exit 2 with the reason on stderr — an EDIT to a
# governed file, which `shell-retirement` refuses unless the file is retired
# instead.
#
# And it cannot be retired yet. Three of its four families now live in
# `policy/run-shape.rego`; the fourth reads `mise.toml`'s task bodies, which no
# `mediated_call` row may do — `call_document` projects `Fact::Document` as
# `None`, and `sources` on a mediated row is refused at load. CLOUD-856 owns that.
#
# So the guard stays natively registered in `.claude/settings.json`, byte-identical,
# and moves behind the door in the change that retires it. Editing it to qualify
# for the door would be exactly the shrink-instead-of-retire the ratchet exists to
# refuse.

# THE LAST NATIVE REGISTRATION (CLOUD-312 row 10). Ten existed when this campaign
# started and the gate passed over all ten; this is the tenth, and the one that
# looked impossible for the longest — the program behind it is what INSTALLS the
# binary that would dispatch it, so retiring it read as a bootstrap paradox.
#
# WHAT BROKE THE PARADOX WAS A SECOND SOURCE, NOT A DECOMPOSITION. #711 hardened
# `install.sh` into a one-liner that takes the script from `main` and the binary
# from the latest release, so a container puts `batten` on PATH before any hook
# fires and this handler is dispatched by a binary that already exists. Nothing
# moved out of the program: `install:local` stays because on a dev clone the
# working tree's build must supersede the released binary, and it is the recovery
# path when the setup step never ran. An earlier plan proposed hoisting
# provisioning into the environment's setup script and was wrong — it would have
# cost both of those for nothing.
#
# FOUR FACTS MAKE THE MOVE BEHAVIOUR-PRESERVING, each read rather than assumed:
#
#   1. stdout carries 79 bytes on the all-clear path — `container-preflight`
#      announces its own success there — which behind the door is an advisory
#      delivered every session whose whole content is "nothing is wrong". Moving
#      that line to stderr is an edit to a governed file, so it belongs to that
#      file's retirement rather than to this move. Stated as a precondition of the
#      move rather than as something already done: an earlier draft of this comment
#      claimed the line "now goes to stderr", and it does not.
#   2. A failure is exit 1 with `::error::` lines on stderr, which `interpret`
#      reads as `Outcome::Reported` — and that joins `Dispatched::advice()`, which
#      `AdvisoryReach` delivers on `SessionStart` for this host. So the failure
#      detail gains reach: today it lands in a hook log, behind the door it is
#      context the agent reads.
#   3. The one other stdout writer is `reclaim-census report`, exit 0 with text →
#      `Advise`, delivered on the same channel. Unchanged.
#   4. A timeout is `Outcome::Broke(TimedOut)`, which ALLOWS — the same fail-open
#      a native SessionStart registration already has.
#
# THE BOUND IS MEASURED, and the margin is stop-guard's lesson two rows up rather
# than a preference. Warm, this container, three runs: 4 s, 4 s, 5 s. So
# `DEFAULT_TIMEOUT`'s 5 s would be a coin toss on the ordinary path — the exact
# shape that lost stop-guard all five of its rules. 180000 is 36x the measured
# warm maximum, and it is also well past Claude Code's own 60 s hook timeout, so
# the door is not tighter than the registration it replaces. A genuinely cold
# clone's release build can still exceed it; that fails open, as it does today,
# and #711's second source is why the cold case is no longer the bootstrap.
#
# TWO CONSTRAINTS FOR WHOEVER EDITS THE PROGRAM NEXT:
#
#   * The session stamp must stay first. `claim-check`'s `refined-this-session`
#     compares the tracker's `updatedAt` against that file's mtime, so a stamp
#     written after the work dates the session to whenever the agent got round to
#     claiming. It is already the first thing the script does, before `step` is
#     even defined; the door changes nothing here, and this is why it must not be
#     reordered.
#   * NEVER add `batten wiring reclaim` to this handler. That verb writes the
#     at-load record and `batten hook` expires it on this same event, so a reclaim
#     dispatched from here would put the write and the clear inside one unordered
#     batch — a coin toss between the honest red and the false green the record
#     exists to refuse. `crates/batten/src/wiring.rs`'s header is the long form.
# DEFERRED WITH ITS SIBLING, and for one reason only: moving it obliges
# `[hook] exclusive`, which is global, which obliges `run-shape-guard` behind the
# door too — and that one cannot go. Everything above is the read that will make
# the move behaviour-preserving when its sibling is ready; nothing in it is
# invalidated by waiting. `.claude/hooks/session-start.sh` is not a governed path,
# so this row costs nothing to defer and nothing to restore.

# CLOUD-843 / CLOUD-1150. The successor to `mise-tasks/rules-drift.sh`.
#
# `line_sources` for both prose surfaces AND both authorities that are read as
# TEXT rather than as a parsed node: `${VAR:-N}` lives inside a shell string, and
# `policy.rs`'s constants are Rust. `documents` for the three that are real
# documents, which is what lets predicate 3 do `jq`'s recursive descent as
# `walk` rather than as a line scan over JSON.
[[rule]]
id = "rules-drift"
kind = "policy"
scope = "tree"
module = "policy/rules-drift.rego"
severity = "deny"
line_sources = [
  ".claude/rules/*.md",
  ".serena/memories/*.md",
  ".serena/memories/**/*.md",
  "AGENTS.md",
  "mise-tasks/*.sh",
  "crates/batten/src/policy.rs",
  # CLOUD-1150 §2's authority. An arm count restated in prose is held to the
  # HEADS the modules themselves carry, never to a table here — a hand-written
  # count of the arms would be the third authority this whole gate refuses.
  "policy/*.rego",
]
# `sources` RATHER THAN `documents`, AND THE DIFFERENCE IS THE COULD-NOT-LOOK
# ARM ITSELF. Measured over the compiled binary while landing this row: a
# `documents` path the engine cannot read does not reach `input.tree.missing` —
# it silently stops the WHOLE RULE from evaluating, including predicates that
# never read it, so an unconditional arm went quiet and the run exited 0. The
# glob form keeps the rule alive when the file is absent, which is what lets
# `drift-authority-unreadable` below see the gap and refuse it. See
# `crates/batten/tests/rules_drift.rs` for the three-way measurement.
sources = [
  ".claude/settings.json",
  "schema/policy-input.schema.json",
  "schema/policy-call.schema.json",
]

# The five patterns `rules-drift.rego` reads. Rows rather than inline literals
# because an inline regex is refused at load — one concept, one spelling.
[[pattern]]
id = "restated-default"
regex = '`[A-Z][A-Z0-9_]+` \([0-9]+\)'

[[pattern]]
id = "shell-default"
regex = '\$\{[A-Z][A-Z0-9_]*:-[^}]*\}'

[[pattern]]
id = "policy-input-key"
regex = '`input\.(tree|call)\.[a-z][a-z0-9_-]*'

[[pattern]]
id = "fixed-rule-ref"
regex = '`data\.batten\.[a-z_]+`'

[[pattern]]
id = "policy-rule-const"
regex = '^const [A-Z_]+_RULE: &str = "[a-z_]+";'

# CLOUD-1150 §2. The unit word is load-bearing: a rules file writes plenty of
# `` `identifier` (3) `` spans that count nothing, so the claim declares itself
# rather than being inferred from the parenthesis.
[[pattern]]
id = "restated-arm-count"
regex = '`[a-z][a-z0-9_]+` \([0-9]+ arms\)'

# A rule head is an identifier at COLUMN ZERO. Rego bodies in this corpus are
# tab-indented, so the anchor is what tells a definition from a reference inside
# somebody's body — and no arm count can be inflated by a mention.
[[pattern]]
id = "rego-rule-head"
regex = '^[a-z][a-z0-9_]*[(\[ ]'

# CLOUD-1206. Eight of the engine's keys carry a hyphen, which is not a legal Rego
# selector, so they are only ever written subscripted — and `policy-input-key`'s
# `\.` cannot match a `[`.
[[pattern]]
id = "policy-input-key-subscripted"
regex = '`input\.(tree|call)\["[a-z][a-z0-9-]+"\]'

# The sentence `.claude/rules/policy-modules.md` closes its key lists with. The
# predicate is scoped to the file that MAKES this claim: a file promising the
# lists are held in both directions is wrong when a key is missing, and a file
# promising nothing is an ordinary consumer.
[[pattern]]
id = "schema-authority-claim"
regex = 'holds the lists above to those two files'

# CLOUD-843/CLOUD-593. A pin that is not a plain dotted version — a range, a
# channel name — is skipped rather than guessed at: refusing a spelling the gate
# does not understand is the larger of the two errors, and there is no such pin in
# this table today.
[[pattern]]
id = "plain-dotted-version"
regex = '^[0-9]+(\.[0-9]+)*$'

[[verdict]]
id = "default state other"
gloss = "a rules file restates an env default the mechanism does not have"
class = """
A stale parenthetical in a rules file is not a typo: these files are read by an agent that then acts without re-deriving, so it is a false premise delivered with the authority of the rule. The mechanism's own `${VAR:-N}` is the authority. Correct the prose, or drop the value and let the reader read it there — dropping it is always allowed, because this class never demands that a value be restated.
"""

[[verdict.route]]
id = "rule read first"
kind = "document"
target = ".claude/rules/toolchain.md"

[[verdict]]
id = "event wire missing"
gloss = "a sentence says a task runs on a hook event nothing wires it to"
class = """
Scoped to a sentence carrying "runs on", so prose stays free to record an accepted gap beside the wiring it qualifies. What cannot stand is the assertion that a task RUNS on an event `.claude/settings.json` does not wire. Either wire it, or say it is absent.
"""

[[verdict.route]]
id = "config read first"
kind = "document"
target = ".claude/settings.json"

[[verdict]]
id = "input key dead"
gloss = "a rules file names a policy input key the generated schema does not carry"
class = """
CLOUD-845's defect in prose. A module copying the key reads an undefined path, Rego reads undefined as does not hold, and the deny set is empty — a dead gate and a clean tree are byte-identical. The generated schemas are the authority; correct the key or drop it.
"""

[[verdict.route]]
id = "config read first"
kind = "document"
target = "schema/policy-input.schema.json"

[[verdict]]
id = "rule ask missing"
gloss = "a rules file names a fixed rule the evaluator does not query"
class = """
The three rule names are the query root, so a module publishing the named spelling contributes nothing to the deny set and fails nothing. `crates/batten/src/policy.rs`'s constants are the authority. Correct the name, or subscript it if the pattern table was meant.
"""

[[verdict.route]]
id = "source read first"
kind = "document"
target = "crates/batten/src/policy.rs"

[[verdict]]
id = "rule count other"
gloss = "a rules file states how many arms a rule has and the module has a different number"
class = """
Predicate 1 one shape up: a restated VALUE against a restated CLOSED COUNT. CLOUD-1150 measured what one costs — `.claude/rules/toolchain.md` said one sibling-edit admission was allowed where `shell-retirement.rego` carried three, and a grooming session wrote that premise into two dispatched agent prompts and five issue bodies before anyone read the module. The module's own heads are the authority. Correct the number, or drop the `(N arms)` and let the reader read it there — dropping it is always allowed, because this class never demands that a count be restated.
"""

[[verdict.route]]
id = "task run first"
kind = "command"
target = "mise run rules-drift"

[[verdict]]
id = "input name missing"
gloss = "a file claiming to enumerate the policy input keys does not name one the engine emits"
class = """
Predicate 3 run backwards, and it fails in the opposite direction: a named key the engine cannot emit is a dead gate, and an emittable key the enumerating file omits is an author re-deriving a fact the engine already builds, or filing a fact-family row for something that ships. Measured 2026-08-30 — `base-delta` and `symbols` were declared by the generated schema and named nowhere in the file whose own closing sentence said the lists were held to it. Scoped to the file that makes that claim; a file promising nothing is untouched.
"""

[[verdict.route]]
id = "task run first"
kind = "document"
target = ".claude/rules/policy-modules.md"

[[verdict]]
id = "drift read unread"
gloss = "an authority some prose claims against could not be read"
class = """
The could-not-look arm, and it is conditioned on there being a claim to judge rather than fired at startup: an unreadable authority matters exactly where prose depends on it. Without the condition this row would speak in every fixture repository that inherits this config, which is the scoping defect CLOUD-1164 records for `tree-clean`.
"""

[[verdict.route]]
id = "task run first"
kind = "command"
target = "mise run rules-drift"
