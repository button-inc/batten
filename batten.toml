gloss = "a CI job carves a gate step out and no job runs it"
class = """
A workflow job may hand hk a step to skip, so the gate can be split across \
runners instead of serialising on one. The pairing has two halves and only one \
of them is visible when it breaks: a name that matches no step runs the step \
twice and shows up in the bill, while a name no other job answers runs the step \
nowhere and has no symptom at all — nothing red, nothing slower, the gate simply \
gone. `hook-profile-check` cannot reach this: it reads the hk plan, and the plan \
does not know what a caller passes. This class covers the second direction.
"""

