# CLOUD-827's class, and CLOUD-1051's ONLY overridable one in this tree.
#
# THE OVERRIDE ROUTE IS WHAT MAKES THE GATE OVERRIDABLE AT ALL. No class the
# binary ships declares one, so nothing Batten itself refuses can be overridden;
# whether a repository's own gate has a legitimate break-glass is a question about
# that repository, which is where house style §8 puts it. This row is that
# decision, taken deliberately: the prose sometimes IS the deliverable — release
# notes, an issue's own evidence — and no next change to those files is coming.
#
# The precondition is what `batten override request` generates its first question
# from, and it is FALSIFIABLE, which is the property that makes the ritual worth
# anything. "The prose is the deliverable and cannot wait" is answerable with a
# fact or not at all — measured 2026-08-25, the instance that motivated CLOUD-1051
# would have had to answer it with a diff that was executable data and that then
# waited an hour before riding another branch. Both halves false.
# THE END-OF-TURN NUDGE, and it is a nudge rather than a refusal by construction:
# `Stop` carries no verdict, so the engine demotes this to advice. CLOUD-97 and
# CLOUD-219 each ruled a deny out at this moment independently — pausing mid-task
# is legitimate and blocking "done" punishes correct behaviour — and the demotion
# is what makes that structural instead of careful.
[[verdict]]
id = "V-HEDGED-FLAG-FRAMING"
gloss = "a finding was written as editorial rather than to a durable home"
class = """
Chat stores nothing, so a finding flagged in passing has no reader after the \
turn ends. The tell is the hedge — an opener plus a communication verb — and it \
is self-indicting every time: a real finding belongs in an issue or a memory, \
and one that is not a finding does not need the hedge. Measured at 3/3 \
precision, which is why this rule leads the end-of-turn set.
"""

[[verdict.route]]
id = "R-FILE-THE-FINDING"
kind = "issue"
target = "put it in the row that already owns it, or file one"

[[verdict.route]]
id = "R-DROP-THE-HEDGE"
kind = "command"
target = "say it plainly, or say nothing"

[[verdict]]
id = "V-PROSE-ONLY-DIFF"
gloss = "every changed line is a comment and no test moved, so a CI matrix would confirm nothing"
class = """
A full required matrix costs real minutes against a trunk landing every few \
minutes, and on a diff CI cannot have an opinion about it confirms nothing that \
could differ. This is not "comments are free": a comment here can change a \
verdict, and every gate that reads one runs locally, for free, before a runner \
is spent. What is priced is spending the matrix on a change that should ride \
the next one these files carry.
"""

[[verdict.route]]
id = "R-BATCH-IT"
kind = "command"
target = "let the next change to these files carry the prose"

[[verdict.route]]
id = "R-OVERRIDE-PROSE-ONLY"
kind = "override"
precondition = "the prose IS the deliverable and cannot wait for the next change to these files"

[[verdict]]
id = "V-FILED-UNREFINED"
gloss = "a row this branch created was never groomed to Ready, so filing cost nothing"
class = """
Filing is the third sink and the most expensive one on purpose: a new row costs \
a complete Ready block. That price is what stops a defect in this branch's own \
diff from being cheaper to spin off than to fix. The verdict is the tracker's \
own response to the create, never a payload the caller assembled — that was \
measured green three times over text in a local file, once under an id no row \
carried.
"""

[[verdict.route]]
id = "R-FIX-IT-HERE"
kind = "command"
target = "close the row you filed and fix it in this diff"

[[verdict.route]]
id = "R-COMMENT-ON-THE-OWNER"
kind = "issue"
target = "put it in the row that already owns it — comments are recorded and never gated"

[[verdict.route]]
