# Batten's own policy configuration.
#
# Consumer #1 is Batten itself: this checked-in file is what `batten check` runs
# against this repository. It is intentionally minimal at the scaffold stage and
# grows as the rule and check engine lands.
#
# Configuration is one committed authority (this file) plus raise-only overrides
# (env vars, flags, and a git-ignored batten.local.toml that may only tighten
# policy). There is no upward directory walk and no conf.d merge surface. See the
# Batten house style, §8.

# The config schema version. This build supports version 1.
version = 1

# Minimum Batten version permitted to read this file (semver). Enforced: a binary
# older than this refuses to run rather than reporting green over rules it does
# not understand (exit 1 — a statement about the invocation, not a policy
# verdict). Equal or newer runs.
#
# Raised off 0.0.0 when this file started declaring `[epoch]` (CLOUD-32): a new
# key must be REFUSED by an older binary, never ignored. `deny_unknown_fields`
# is what actually forces that — an older build fails on the unknown key — and
# this floor states the intent so the refusal names the version rather than the
# key.
#
# Raised again for `[ci]` (CLOUD-54), to the version that introduces it. Not the
# version that will *release* it: release-plz bumps on landing, so naming the
# next tag would make this file refuse the very build that has to lint it. The
# floor is documentation-grade either way — `deny_unknown_fields` is what
# actually refuses an older binary.
#
# And again for `[attribution]` (CLOUD-274), on the same reasoning: a binary that
# predates the table cannot enforce the attribution policy, and silently ignoring
# the key would report green over a gate that does not exist in it.
#
# And again for `[commit]` (CLOUD-701): a binary that predates the table cannot
# enforce the subject convention, and silently ignoring the key would report
# green over a gate that does not exist in it.
#
# And again for `[exec]` (CLOUD-429), which is the first table whose absence
# changes what a caller SEES rather than what a gate decides: a binary that
# predates it would tee the child's whole output to a caller that declared it
# wanted a record, and the caller would pay for bytes it asked not to be sent.
min_batten_version = "0.0.82"

# The ref work must land on (CLOUD-51) — the target `batten worktree status`
# judges uncommitted, unpushed, and unlanded work against.
#
# Consumer-specific by nature, which is why it lives here and never in the crate
# (non-negotiable rule 1): which ref is the trunk is a property of the repository
# being gated. The core ships no default, so an absent key means the gate has no
# target — exit 1, never a guessed one and never a vacuous pass.
#
# `origin/main` rather than `main`: this repo is trunk-based and lands by
# fast-forward, so the question is whether work reached the remote trunk. A local
# `main` can be behind, and judging against it would call work landed that only
# this checkout has seen. Read as it is on disk — the gate fetches nothing
# (agents fetch, gates decide).
#
# Merged-ness here is decided by patch identity, never ancestry, which is what
# makes the key usable at all: landing by rebase gives every landed commit a new
# SHA, so a landed branch is never an ancestor of the trunk and `git branch
# --merged` would report this repository's own finished work as outstanding
# forever.
#
# NOT to be confused with `unlanded` below it in the schema: that is a
# path-membership set the rule engine evaluates over tree content. VCS state and
# path membership are orthogonal, and one key meaning both is the conflation
# CLOUD-37 kept `scope`/`protected`/`unlanded` apart to avoid.
must_land_on = "origin/main"

# ---------------------------------------------------------------------------
# The protected-path gate (CLOUD-96): {mutating verb} × {protected path}.
#
# This is not a `[[rule]]` row and deliberately so. The gate is the INTERSECTION
# of the two tables below, and expressing an intersection as rules would need one
# row per verb × path pair — the config restating what a set operation already
# says. `batten hook` crosses them per mediated call.
#
# The incident: an agent retracting its own managed state reached for `rm`
# instead of the surface that owns the file. Managed state has a defined mutation
# path and a raw destructive verb bypasses its bookkeeping.

# Which paths are guarded. Consumer-specific by nature, which is why they live
# here and never in the crate (non-negotiable rule 1) — the engine holds the
# matcher, this file holds the answer.
protected = [
  # Agent memory: written through the Serena tools, never by hand.
  ".serena/memories/**",
  # The policy authority itself. Deleting it is the maximal weakening — it
  # disarms every gate at once, including this one.
  "batten.toml",
  # CI's definition of green.
  ".github/workflows/**",
]

# Programs that only READ their operands, so naming a protected path above is not
# a mutation (CLOUD-1141).
#
# THIS LIST EXISTS TO INVERT A FAILURE DIRECTION, not to be complete. `[[verb]]`
# enumerates MUTATIONS, so a program missing from it wrote a protected file
# unrefused: measured over the shipped binary, `echo x >> batten.toml`,
# `sed -i … batten.toml` and `tee batten.toml` were denied while
# `python3 -c "open('batten.toml','w')"` and `perl -pi -e … batten.toml` were
# ALLOWED. An allowlist-by-omission whose omissions are holes — and the gate
# `memory-guard` was retired into, so its write shapes were covered only for the
# programs somebody had named.
#
# Extending `[[verb]]` with those two interpreters was the obvious fix and the
# wrong one: it closes two instances, leaves the shape, and makes the table imply
# a completeness it does not have. So an operand that is a protected path now
# refuses unless the program is KNOWN — present in `[[verb]]` at all, or listed
# here. Forgetting an entry below is a false refusal somebody fixes in a minute;
# forgetting a writer is no longer a silent hole.
#
# A PROGRAM IN `[[verb]]` IS ALREADY KNOWN and must not be repeated here: that
# table encodes its argv grammar, so `git add batten.toml` is allowed because
# `git`'s mutating rows did not match rather than because `git` appears below.
#
# The set is the read tools this repository actually points at these three path
# classes — its own gates read `batten.toml` constantly. An interpreter is
# deliberately absent: `python`, `perl`, `ruby` and `node` take a program on the
# command line, so what they do to an operand is not decidable from the argv, and
# that undecidability is exactly what must refuse rather than pass.
protected_readers = [
  "cat",
  "head",
  "tail",
  "wc",
  "diff",
  "cmp",
  "file",
  "stat",
  "realpath",
  "dirname",
  "basename",
  "grep",
  "rg",
  "jq",
  "taplo",
  "prettier",
  "actionlint",
  "shellcheck",
  "shfmt",
  "regal",
  "opa",
  "hk",
  "mise",
  "batten",
]

# ---------------------------------------------------------------------------
# What to run instead, per protected path class (CLOUD-280).
#
# The refusal contract (CLOUD-122) is that every deny names the fix. CLOUD-96
# put that text on the `[[verb]]` row, which is right when the VERB knows the
# remedy and wrong when the PATH does: `rm` says "restore it with `git checkout
# --`", which is true of most files and actively misleading for a workflow,
# where the point is not recovering the bytes but that CI's definition of green
# changes under review.
#
# Consulted BEFORE the verb's own `redirect`; a class named here answers for
# every verb that reaches it. Declaration order decides, first match wins.
#
# WHY `.serena/memories/**` IS DELIBERATELY ABSENT, which is the interesting
# boundary of this table rather than an omission. Its remedy is not a property
# of the path alone: a write wants `write_memory`, an in-place edit wants
# `edit_memory`, a move wants `rename_memory` (the only route that rewrites
# `mem:` referrers), a delete wants `delete_memory`. The verb rows below already
# name the right tool per action, and a row here would OVERRIDE all four with
# one weaker sentence — the opposite of what this table is for. Per-path beats
# per-verb only where the path fact dominates; where the verb fact does, the
# fallback tier is the correct answer and not a leftover.
[[redirect]]
glob = ".github/workflows/**"
mutation = "change it in a pull request — these files are CI's definition of green, so the change has to be reviewed rather than restored"

[[redirect]]
glob = "batten.toml"
mutation = "change it in a pull request — this file is the policy authority every gate reads, and `mise run config-lint` is what checks the edit before it lands"

# ---------------------------------------------------------------------------
# The transcript substrate (CLOUD-95), and what it finally switches on: CLOUD-97's
# `completion.unlanded` — declared done with work not landed, the predicate this
# whole engine's thesis names. It had never evaluated once in this repository.
#
# WHY A SYMLINK, WHICH LOOKS LIKE A WORKAROUND AND IS NOT. This key is
# committed-authority-only and deliberately unlayerable (`resolve.rs`: "a local
# file redirecting it would be choosing the evidence"), and it is resolved as
# `root.join(path)` — one file, repo-relative. The host's transcript is neither:
# it lives at `~/.claude/projects/<slug>/<session>.jsonl`, a per-session absolute
# path no committed value can name. A layered override would let a branch point
# the detector at evidence of its choosing, which is the weakening `trust.rs`
# compares committed bytes for. So the committed value stays fixed and the
# INDIRECTION moves out of the config: `mise-tasks/stop-guard.sh` refreshes this
# path from the Stop payload's own `transcript_path` at each turn end. The
# authority names one file forever; which session it is, is the host's fact.
#
# Gitignored, and that is the point rather than housekeeping — a committed
# transcript would be a session's whole prose in the tree, the exact payload
# non-negotiable 4 keeps out of every report this engine writes.
#
# ABSENT IS THE ORDINARY STATE AND IS HONEST. No symlink — a fresh checkout, a
# non-Claude host, a `state record` run by hand — resolves to
# `Capability::Absent`, which reports `transcript::ABSENT_NOTICE` and changes no
# verdict. It is NOT read as clean: an open `completion.unlanded` finding HOLDS
# through an absent transcript, because a scan that could not look has not
# observed zero.
#
# `memory_root` is omitted, so `selfwrite::DEFAULT_MEMORY_ROOT` applies.
[transcript]
path = ".claude/.transcript.jsonl"

# ---------------------------------------------------------------------------
# Pinned tools (CLOUD-90), fetched and cached out of tree.
#
# ripsecrets is the scanner the `secrets` rule kind runs (CLOUD-59). Adopted
# rather than rebuilt — a credential is the banned shape nobody can enumerate, so
# detection is prior art and only CONTAINMENT is ours. Its license row is in
# CONTRIBUTING.md's table, resolved before the pin landed.
#
# THE CHECKSUMS WERE MEASURED, NEVER COPIED: each artifact was downloaded and
# digested locally rather than read off a release page. A copied checksum attests
# to what a page said, which is the one thing a pin is not for.
#
# The per-platform table exists because a compiled tool ships one artifact per
# target, and an entry carries exactly one of this or a bare `url`/`sha256`. Keys
# are `<os>-<arch>` off `std::env::consts`, so they name what a running binary
# knows about itself. CI is `ubuntu-latest` everywhere, so `linux-x86_64` is the
# only one CI exercises; the darwin rows are for contributors, and there is no
# `linux-aarch64` row because upstream publishes no such artifact — a machine
# that needs one gets exit 1 naming the key, never a silent skip.
[[provision]]
name = "ripsecrets"
version = "0.1.11"
unpack = "tar_gz"
binary = "ripsecrets"

[provision.platforms.linux-x86_64]
url = "https://github.com/sirwart/ripsecrets/releases/download/v0.1.11/ripsecrets-0.1.11-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "9daf017dfdea242a58f672450a2526f0406211afe9e872c740adc49b42feccf5"

[provision.platforms.macos-x86_64]
url = "https://github.com/sirwart/ripsecrets/releases/download/v0.1.11/ripsecrets-0.1.11-x86_64-apple-darwin.tar.gz"
sha256 = "21253f4d25be2626779c579c12e30aef1c67d7224cbed50eb7515a8cd45db56d"

[provision.platforms.macos-aarch64]
url = "https://github.com/sirwart/ripsecrets/releases/download/v0.1.11/ripsecrets-0.1.11-aarch64-apple-darwin.tar.gz"
sha256 = "b2c822742e8cbf355ba0cb4cc690c3cd8fdc9ec1916c8148f27bd9098cb7aee4"

# Batten gates this repository with its own engine — consumer #1 in practice,
# not just in principle. Rules below whose `scope` is "tree" run under `batten
# check`; rules whose `scope` is "mediated_call" are adjudicated by `batten hook`
# against one command at a time and are never evaluated by `check` (CLOUD-48).

# ---------------------------------------------------------------------------
# The `gh` lifecycle, as config rather than Rust (CLOUD-48).
#
# These four rows were a hardcoded `match` inside `crates/batten/src/hook.rs`.
# Moving them here is the point of the change twice over: the engine stops
# carrying one consumer's task names (non-negotiable rule 1 — `git grep -Fn
# "mise run land" crates/` now finds nothing outside a test fixture), and a
# reviewer can read exactly what will be refused without reading Rust (§9).
#
# `pattern` for a shape rule is the banned command line as you would say it: the
# first word is the effective program — matched AFTER wrapper look-through, so
# `mise exec -- gh pr merge` and `env GH_PAGER= gh pr merge` both match — and the
# rest are the adjacent non-flag words that must follow it.
#
# `reason` is required on a shape rule, unlike on a file rule: a mediated deny
# reaches a model as the entire explanation, so a refusal that named only its id
# would be un-actionable (CLOUD-122). The crate appends the bypass hatch.
# THESE FOUR WOULD DECLARE `bypass_env = "BATTEN_GH_GUARD_BYPASS"` AND DO NOT YET
# (CLOUD-437, deferred to CLOUD-1027). They are the ported `gh-guard`, so that
# name is TRUE of them where it was a fossil everywhere else, and declaring it
# here is behaviour-PRESERVING: the same variable already suppressed these rows
# back when it was the engine's global hatch.
#
# `config-lint` cannot see that argument. It compares `batten.toml` against
# `origin/main` and reads a new `bypass_env` on a rule as `rule-predicate-changed`
# — correctly, in its own terms, since the key makes a row suppressible. The
# admissible route is a groomed `Weakens:` clause in the Ready block plus a
# matching commit trailer, and CLOUD-437's block was groomed on 2026-08-14 without
# one. Asserting it in the change that performs it is the exact shape §8 refuses.
#
# So until that row is groomed, these four take the general `BATTEN_HOOK_BYPASS`
# like every other row. The column, the per-row lookup and the suppression all
# ship; what waits is this repository's own use of them.
[[rule]]
id = "gh-pr-merge"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr merge"
reason = """
`gh pr merge` (like the merge button) rewrites commits under new SHAs, \
discarding the exact objects CI tested. Use `mise run land`, which comments \
/fast-forward so main advances to this branch's already-passed commits."""

# The one row with a second condition. Only a comment carrying the landing
# directive is the lifecycle; an ordinary `gh pr comment` is not. The directive
# lives inside a quoted `--body`, so it is not one of the words `pattern`
# matches — `contains` looks at the segment as written, which is the only reason
# this key exists.
[[rule]]
id = "gh-pr-comment-fast-forward"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr comment"
contains = "fast-forward"
reason = """
Commenting /fast-forward by hand only STARTS the merge — it does not wait for \
it, and the usual pairing with a guessed `sleep` reports before the merge \
lands. Use `mise run land` (backgrounded): it comments, then blocks until the \
PR is MERGED or the fast-forward bot refuses."""

[[rule]]
id = "gh-pr-checks"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr checks"
reason = """
Hand-watching CI is the ad-hoc shape `mise run ci-wait` replaces. It polls \
check-runs for HEAD until every one is terminal, prints their conclusions, and \
exits non-zero unless all are green — with no timeout to reintroduce the \
VM-reap gap. Background it. (`gh pr view`/`list`/`create`, `gh pr ready`, `gh \
api`, `gh run view` are NOT blocked.)"""

[[rule]]
id = "gh-run-watch"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "gh run watch"
reason = """
Hand-watching CI is the ad-hoc shape `mise run ci-wait` replaces. Background \
it rather than holding a foreground poll open."""

# The toolchain pin, given a mechanism (CLOUD-271). AGENTS.md has said "never a
# bare `cargo`" since long before anything enforced it, which non-negotiable
# rule 2 calls half a change.
#
# NOT A BAN on `cargo`, and `require_via` is what says so: the row selects the
# program and then refuses only the calls that reached it without the pin.
# `mise exec -- cargo test` and `mise run test:cargo` are the sanctioned routes
# and stay open; a bare `cargo` does not, and neither does a wrapper hiding one
# (`env RUSTFLAGS=-Awarnings cargo build`), because the mediator is read from
# the segment as written.
#
# It cannot be spelled as a program comparison. `effective_program` looks
# THROUGH `mise exec` by design — that is what makes the four `gh` rows above
# survive the sandbox's wrapper form — so `program == "cargo"` denies the
# sanctioned route too. The objection here is to the toolchain SELECTION rather
# than to the program, which is a different question and needed its own key.
#
# `cargo --version` is denied along with everything else, decided rather than
# omitted: the row's subject is the program being reached, an argument-less
# reach is still a reach, and the redirect costs one `mise exec --`. A carve-out
# for read-only queries would be a hole that looks intentional.
#
# Why it matters TODAY, when a bare `cargo` fails loudly on its own: that is a
# version inequality, not a gate. The pin (1.97) currently sits above the
# ambient toolchain (1.94), so Cargo's own `rust-version` check refuses. When
# ambient passes 1.97 the inequality reverses and the bare call goes back to
# compiling silently against the wrong compiler — measured 2026-08-09, three
# gates disagreeing with a green local run.
[[rule]]
id = "no-bare-cargo"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "cargo"
require_via = "mise"
reason = """
A bare `cargo` resolves to whatever toolchain is ambient, not the pin in \
mise.toml, so a green local run can mean nothing. Use `mise run <task>` (\
`test:cargo`, `lint`, `verify`), or `mise exec -- cargo ...` for a one-off."""

# `issue-guard`'s naming half, as config (CLOUD-446).
#
# NOT A BAN, and the `requires_key` column is what says so: the row selects on
# the command shape exactly as the four above it do, and then refuses only the
# case where the work names no tracker key. `gh pr create` on keyed work is
# allowed and always was — which is why this is a modifier on a shape row rather
# than a kind, and why its refusal reads differently from theirs.
#
# THE VOCABULARY IS THIS REPOSITORY'S, and it has to be. `CLOUD-<n>` is Button's
# tracker, not Batten's, so the crate carries no part of this expression
# (non-negotiable rule 1) — the column takes any regex, and a consumer adopting
# this row edits a pattern rather than a match arm.
#
# Named exactly rather than generically, and that is the safer direction: a
# shape like `[A-Z]{2,}-[0-9]+` also matches `UTF-8`, `SHA-256` and `RFC-3339`,
# so a commit that merely mentioned an encoding would satisfy the gate. What a
# key looks like here is known, so it is written down.
#
# `(?i)` is load-bearing, not tidiness: the tracker's own `gitBranchName`
# produces `wenzowski/cloud-446-...` in lower case, so a case-sensitive
# expression would leave the branch-name source dead for every branch anyone
# actually has. `issue-guard` matched case-insensitively (`grep -oiE`) for the
# same reason, and the port keeps it.
#
# Three evidence sources, and each one is a way real work legitimately carries
# its key: the command itself (`--body "Closes CLOUD-1"`), the branch name, and
# the commit subjects on `base..HEAD`. Any one of the three allows. `base` names
# the range rather than the crate hardcoding a trunk, for the same reason as the
# expression — and it is what keeps the trunk's own history from answering, since
# `origin/main` is full of other people's keys.
#
# WHAT THIS DROPS from the bash guard, stated rather than absorbed: `issue-guard`
# also read the existing PR's title and body over the network (`gh pr view`),
# which matters for `gh pr ready` because it carries no body of its own. A
# mediated call cannot make a network round trip against the <=100ms budget, so
# the ported half reads the checkout only. The lost case is a PR whose key
# appears ONLY in a body typed by hand — and `land` is the only readier here, on
# a branch the tracker named.
#
# The guard's OTHER half — refusing a key already claimed by a different open PR
# — is not here and cannot be: it needs `gh pr list` plus a `gh pr view` per
# competitor, and `RuleKind::scopes` pairs every spawning kind with
# `RuleScope::Tree` alone. It lands as a `tree`-scoped `command` rule under
# `batten enforce`, which is why `mise-tasks/issue-guard.sh` still exists.
[[rule]]
id = "pr-names-an-issue"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr create"
requires_key = '(?i)\bCLOUD-[0-9]+\b'
base = "origin/main"
reason = """
Search the board first (`mise run graph-check` prints the ready frontier), then \
name the issue: in the branch, in a commit on it, or in the PR body as `Closes \
CLOUD-<n>`. A PR that names no issue cannot move the board when it merges, so \
the work lands with nothing recording that it did."""

# The same predicate at the other publishing moment. Two rows rather than one
# because a shape row's `pattern` is one command line, and `create` and `ready`
# are two — the alternative would be a `patterns` list whose only user is this
# pair.
[[rule]]
id = "ready-names-an-issue"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr ready"
requires_key = '(?i)\bCLOUD-[0-9]+\b'
base = "origin/main"
reason = """
Readying publishes the work and starts CI. Name the issue in the branch or in a \
commit on it before readying — or use `mise run land`, which readies after its \
own push. A PR that names no issue cannot move the board when it merges."""

# `ready-guard`, as config (CLOUD-312, over CLOUD-203's receipt store).
#
# A `receipt` row is not a ban. It refuses a call whose PRECONDITION has not
# been proved, and the same call is allowed the moment the receipt exists —
# which is why it is a distinct kind rather than a shape row with a condition.
#
# Readying is the single event that starts CI, so it is the one precondition
# whose cost is paid in CI minutes when it is skipped. Both receipts are named
# in one row because the predicate is genuinely a conjunction: the branch must
# have verified AND still be linear on the trunk. Two rows would let one be
# deleted while the gate still looked whole.
#
# `key = "head"` is the default and is stated anyway, because it is the whole
# expiry contract: the receipt attests to THESE BYTES, so an amend, a rebase, or
# a moved `origin/main` must invalidate it rather than silently keep counting.
# The engine renders a distinct cause per verdict — missing, stale-head,
# stale-main — so the three refusals `ready-guard` wrote by hand survive the
# move without this file restating them.
[[rule]]
id = "ready-needs-receipts"
kind = "receipt"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr ready"
checks = ["verify", "linear-check"]
key = "head"
reason = """
Run `mise run verify` (background it), then `mise run linear-check`, then \
retry — or just `mise run land`, which drives the whole loop. A red run on a \
freshly-readied PR means that step was skipped, and the CI minutes are already \
spent by then."""

# CLOUD-859. The read-the-review gate, and this repository's FIRST `[[fact]]`
# row — the agent-sourced channel has had no consumer since CLOUD-776 landed it.
#
# THE COMMAND IS THE PREDICATE'S SELECTION, not merely its source. `Sourced`
# stores `{command, seen_at, rows}` and no byte of the buffer (non-negotiable
# rule 4), so a module can ask how many rows came back and nothing else. The
# `--jq` projection therefore emits ONE ELEMENT PER BLOCKING CONDITION — each
# unresolved review thread's id, plus the PR author's login when nothing but the
# author has reviewed — which is what makes `rows == 0` mean "reviewed and
# addressed" rather than "nobody looked".
#
# WHY IT PROJECTS TO AN ARRAY, on grounds that outlived the parsing reason.
# CLOUD-992 taught `rows_in` to read a text buffer, so a bare object no longer
# fails to parse — it normalises to `Is(1)`, always one row whatever the query
# found. The `[...]` is semantic now: without it the count means nothing. Do not
# "simplify" it away on the grounds that the parse exists.
#
# WHY `node(id:)` RATHER THAN `repository(owner:,name:)`. `Declared.command` is
# compared byte-for-byte against what the agent ran — that byte-equality IS the
# forgery control — so the string is a CONSTANT and cannot be parameterised per
# pull request. `gh pr view --json id` derives the PR's node id from the current
# branch, so the whole query is constant and still per-PR. It also keeps the
# owner and repository name out of the string, which `repository(owner:...)`
# would have hard-coded.
#
# WHY NOT `gh pr view` ALONE: checked against `gh` 2.97.0, its field list carries
# `reviews`, `latestReviews` and `reviewDecision` and has NO `reviewThreads`.
# Threads are the half this decides on, so `gh pr view` cannot answer it.
#
# WHY NOT A `mise run` PRODUCER, which is shorter and would have been nicer:
# measured, and it is unusable. `capture::decode_response` concatenates `stdout`
# then `stderr`, so mise's `[task] $ …` prefix lands in the buffer either way,
# the text stops parsing as JSON, and the count is one opaque row forever — a
# gate refusing every `gh pr ready` in the repository and unsatisfiable by the
# command its own deny prints. Probed side by side: the bare command recorded
# `rows 3` where `mise run envelope-probe` over the identical body recorded
# `rows 1`. The residue is broader than mise and is CLOUD-993's inventory: any
# declared command routed through something that annotates its own output is
# disqualified by the same mechanism.
#
# `returns = "json-array"` is what keeps that from being silent (CLOUD-993). A
# command that stops emitting an array — an auth error, a changed default format,
# a wrapper that annotates — records NOTHING and denies, instead of recording a
# plausible `rows 1` that no `rows == 0` predicate can ever clear.
#
# AN UNREAD PAGE IS A BLOCKING CONDITION, NOT A ZERO. GitHub caps a connection
# page at 100, so a PR with more than 100 review threads would have the surplus
# fall outside the query — and an unresolved thread out there would leave
# `rows == 0`, which is a FALSE GREEN in the one direction this gate exists to
# prevent. Both connections therefore carry `pageInfo{hasNextPage}` and the
# projection emits an extra element when either is true, so "I could not see all
# of it" refuses instead of passing.
#
# Chosen over paginating, deliberately: `Declared.command` is byte-compared, so
# it is one string with no loop in it, and `--paginate` emits one JSON document
# per page — which stops being a single array and lands back in the
# could-not-look arm. Counting a truncation as blocking gets the safe verdict
# with no iteration at all. `true` rather than a quoted marker keeps the whole
# command free of double quotes, which is what lets it be a plain TOML string
# with no escaping — one fewer way to retype a CLOUD-990-shaped remedy wrong.
#
# THIS ROW IS STILL COMMAND-SOURCED, and the two tool-sourced rows below are
# ADDED beside it rather than a replacement for it (CLOUD-690). Read the tool
# columns — `tool`, `when`, `counts`, `where`, `blocking` — at those rows and not
# here; nothing in this row reads any of them. What that leaves standing is a
# residue rather than a gap: this container's egress proxy answers the command
# above 403, so on a hand-typed `gh pr ready` the receipt row naming it still
# denies with a remedy nobody here can perform. That is the state on `main` today
# — retiring the row trips `FactRemoved` and `RuleRemoved`, which is CLOUD-859's
# to groom — and the added rows are the two checks that ARE satisfiable here.
#
# WHAT THIS FACT BINDS, and it is the head rather than the branch. The record is
# filed under the subject `key = "head"` names below, so a commit pushed after a
# clear answer leaves the record under the previous head and the next `gh pr
# ready` is refused. That was NOT true when this row landed — `sourced_path` keyed
# on the fact's name alone, so the column was accepted and unread and the gate
# bound once per branch — and the limitation comment that stood here is deleted in
# the change that removed it (CLOUD-859).
[[fact]]
name = "review-answered"
returns = "json-array"
command = "gh api graphql -F id=$(gh pr view --json id --jq .id) -f query='query($id:ID!){node(id:$id){... on PullRequest{author{login} reviews(first:100){pageInfo{hasNextPage} nodes{author{login}}} reviewThreads(first:100){pageInfo{hasNextPage} nodes{id isResolved}}}}}' --jq '.data.node as $p | [($p.reviewThreads.nodes[] | select(.isResolved == false) | .id), (if ([$p.reviews.nodes[] | select(.author.login != $p.author.login)] | length) == 0 then $p.author.login else empty end), (if $p.reviewThreads.pageInfo.hasNextPage then true else empty end), (if $p.reviews.pageInfo.hasNextPage then true else empty end)]'"

# The DID-YOU-LOOK half. A `receipt` row is also what makes the fact reach Rego
# at all: `required_checks_for` reads the receipt rows, and `agent_records`
# populates `input.facts["agent-sourced"]` only for the checks they name — so
# without this row the policy module below reads `null` on every call and decides
# nothing. That coupling is not obvious and is why the two rows ship together.
#
# It carries the never-ran and command-mismatch refusals, and only it can: the
# boundary hands it the declaration, so its deny is built from the declared
# command rather than from prose. The module decides the COUNT and stays silent
# about absence, so one call never draws two refusals.
#
# `key = "head"` and it DECIDES (CLOUD-859): an agent-sourced record is resolved
# from its own file rather than from the receipt store, and that file is named for
# the subject this column resolves to. `head` is the honest answer for a fact
# about a specific head — a review is of one set of bytes — and `branch` is what a
# fact about the WORK takes, which is why `claim-needs-receipt` below takes it.

# THE TOOL-SOURCED SIBLING, and it is an ADDED row rather than an edit to the one
# above (CLOUD-690). The distinction is `trust.rs`'s and it is the whole reason
# this is shaped as two rows: changing what answers an existing fact is
# `fact-command-changed`, and changing how it counts is `fact-counting-changed` —
# both byte comparisons that report in either direction because neither is
# rankable. Adding a fact raises nothing, because `WeakeningKind` has
# `FactRemoved` and no `FactAdded`: a fact can only ever be the object of a
# refusal, so declaring one more cannot lower a bar. `MintAdded` is the lone
# addition-shaped kind and exists for the opposite reason — a mint SATISFIES a
# gate, so its presence does lower one.
#
# So the gate gains a check rather than trading one, and `config-lint` is silent
# over a change that weakens nothing.
#
# WHAT IT COUNTS, and why the tool rather than the command. The row above
# declares `gh api graphql`, which this container's egress proxy answers 403 — no
# record could ever be minted, the check read `Missing` on every call, and the
# deny printed a command that could not clear it. The same review threads reach an
# MCP tool on the same host, so this row reads the RESULT of the call an agent
# already makes to read the review: the threads whose `is_resolved` is `false`,
# plus one if the page the read asked for was capped.
#
# `blocking` IS NOT A CONVENIENCE. A page cap is a scalar sitting BESIDE the
# counted array, so `counts`/`where` structurally cannot reach it. Nor can a
# second `[[fact]]` — a `counts` path resolving to a bool is could-not-look, so
# such a row would deny forever instead of passing on a complete page — and nor
# can a Rego module, because `input.call` carries a tool's NAME and never its
# arguments. Without it an unresolved thread beyond the page reads as zero, which
# is a false green in the one direction this gate exists to prevent.
#
# THE FORGERY CONTROL CHANGES SHAPE RATHER THAN DISAPPEARING. A `command` row is
# protected by byte-equality against what the agent ran; this one is protected by
# the selector, because the agent does not choose which name a host reports a
# result under. It is `[[mint]]`'s control through the same `selects_tool_name`,
# so there is no second matcher to drift, and a shell call naming the same string
# does not satisfy it.
#
# `when` NAMES THE METHOD, and the two selectors are not the same question: `tool`
# decides which tool answers the row, `when` decides which of its INVOCATIONS.
# `pull_request_read` serves nine methods and the method is an argument, so the
# name alone cannot tell one method's result from another's. The engine can ask,
# where a Rego module cannot — `Envelope::input` carries the whole input object at
# the post-tool event, while `input.call` carries a tool's NAME and never its
# arguments — so this is asked here, at the only place it is answerable. It only
# ever narrows: fewer calls mint a record, so a check naming this row denies at
# least as often.
#
# `returns = "json"` is the honest shape and the column is READ rather than
# decorative: a `counts` path is a claim that the buffer is a JSON document,
# `opaque` beside `counts` is refused at load, and `json-array` would require the
# buffer itself to be the array. The MCP result is an object.
[[fact]]
name = "review-threads-clear"
returns = "json"
tool = "pull_request_read"
when = { method = "get_review_comments" }
counts = "review_threads"
where = { is_resolved = false }
blocking = { "pageInfo.hasNextPage" = true }

# THE VACUITY TWIN, and the second condition the projection carried: a PR nobody
# but its author has reviewed. #618 is the measured instance — no threads and no
# review — and a threads-only predicate reads that as zero and passes it as "all
# addressed", which is the worst available reading because it is the unreviewed
# case.
#
# ITS OWN ROW, because it is a different question over a different collection. The
# `get_reviews` method answers with a BARE TOP-LEVEL ARRAY of reviews, so
# `returns = "json-array"` is honest here where the threads row needs `json`, and
# `counts = "."` names the payload itself — the spelling that exists because the
# empty string is refused at load and `[]` iterates into N values rather than
# selecting one array.
#
# NO `where`, which is the genuine reading rather than a missing predicate: *how
# many reviews are there*. The module below denies on ZERO, inverting the
# threads row's `> 0`, so the pair reads "somebody looked, and what they said is
# answered".
#
# WHAT THIS DOES NOT CATCH, stated because the projection it restores caught it:
# the original compared each review's author to the PR's, so a PR reviewed only by
# its own author still counted as unreviewed. That is a field-to-field comparison,
# which `where` refuses by design (CLOUD-690 §2 — every operator added there is a
# step toward the `conf.d` merge house style §8 keeps out), and it is CLOUD-859's
# to close. What is left uncovered is an author reviewing their own PR to clear
# the gate — deliberate forgery, not the honest error Batten's threat model names,
# and the same boundary the fact channel's own forgery control rests on.
#
# THE TWO ROWS SHARE A SELECTOR AND DISCRIMINATE BY THE METHOD, which is a
# column rather than an inference — and the inference is what shipped first and
# was wrong. The argument was that shape discriminates: a `get_reviews` result
# carries no `review_threads` member, and a `get_review_comments` result is an
# object rather than an array, so neither row records from the other's call. Both
# halves are true and the conclusion does not follow, because `pull_request_read`
# serves nine methods and the pair is not the only pair. MEASURED on this branch:
# one `get_files` call minted `review-happened` with `rows 3`, because a FILE
# listing is also a bare top-level array — clearing the check that asks whether a
# review exists, which is a false green in the one direction this gate exists to
# prevent. Shape is a proxy for the method; `when` is the method.
[[fact]]
name = "review-happened"
returns = "json-array"
tool = "pull_request_read"
when = { method = "get_reviews" }
counts = "."

# The DID-YOU-LOOK half. A `receipt` row is also what makes the fact reach Rego
# at all: `required_checks_for` reads the receipt rows, and `agent_records`
# populates `input.facts["agent-sourced"]` only for the checks they name — so
# without this row the policy module below reads `null` on every call and decides
# nothing. That coupling is not obvious and is why the two rows ship together.
#
# It carries the never-ran and selector-mismatch refusals, and only it can: the
# boundary hands it the declaration, so its deny is built from the declaration
# rather than from prose. The module decides the COUNT and stays silent about
# absence, so one call never draws two refusals.
#
# Its remedy is PROSE for this row and that is forced, not lazy: `Fix::Run` is
# built from a declared `command`, and a `tool` row has none to print. A remedy
# naming a shell command would be worse than prose — it would name a route that
# cannot mint the record the check reads.
#
# `key = "head"` and it DECIDES (CLOUD-859): an agent-sourced record is resolved
# from its own file rather than from the receipt store, and that file is named for
# the subject this column resolves to. `head` is the honest answer for a fact
# about a specific head — a review is of one set of bytes — and `branch` is what a
# fact about the WORK takes, which is why `claim-needs-receipt` below takes it.
[[rule]]
id = "ready-needs-an-answered-review"
kind = "receipt"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr ready"
checks = ["review-answered"]
key = "head"
reason = """
Read the review before buying a matrix. Run the declared command above — it \
prints one line per blocking condition and nothing when the head is clear — \
then retry. If no review exists yet, force one with `@coderabbitai full review` \
(~3 minutes measured, and free: the draft phase runs no CI), answer what it \
says, and run the command again. Replayed over the last 100 merges this fires \
on 89, so the usual outcome is that there is something to read."""

# ITS TOOL-SOURCED SIBLING, added rather than folded into the row above for the
# reason the `[[fact]]` pair carries: widening an existing row's `checks` is
# `rule-predicate-changed` — a byte comparison with no ranking — and a NEW
# `receipt` row raises nothing, because it can only ever add a refusal. Measured
# on this branch: splitting a second check out of `checks` dropped the base-ref
# smell count by one with no new finding.
#
# So `gh pr ready` now answers to THREE checks where `main` had one, and the two
# added ones are satisfiable in an environment whose proxy refuses the command
# above.
[[rule]]
id = "ready-needs-the-threads-answered"
kind = "receipt"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr ready"
checks = ["review-threads-clear"]
key = "head"
reason = """
Read the review threads before buying a matrix. `pull_request_read`, method \
`get_review_comments`, `perPage` 100 — the record is minted from that result, \
and the count it stores is the threads still unresolved plus one if the page was \
capped. Answer them, resolve them, read again, then retry. The record is filed \
against the head that was checked out when you read, so a push after a clear \
answer needs another read."""

# ITS OWN ROW RATHER THAN A SECOND ENTRY IN THE `checks` LIST ABOVE, and the
# reason is `trust.rs`'s rather than aesthetic. Widening an existing row's
# `checks` is a `rule-predicate-changed` weakening — a byte comparison with no
# ranking, exactly like `fact-command-changed` — so it would have to be groomed
# and admitted. A NEW `receipt` row is deny-only by construction: it can add
# refusals and never remove one, so no weakening kind covers it and `config-lint`
# is silent. Measured, this row dropped the smell count from three to two.
#
# The split is also honest on its own terms: the two records answer different
# questions from different methods, and a refusal that names one check should
# name the read that satisfies THAT check. A shared remedy had to describe both
# reads and could not tell a reader which one was missing.
[[rule]]
id = "ready-needs-a-review-to-exist"
kind = "receipt"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr ready"
checks = ["review-happened"]
key = "head"
reason = """
Nobody has read the reviews on this head. `pull_request_read`, method \
`get_reviews` — the record is minted from that result and stores how many \
reviews came back. If none has, force one with `@coderabbitai full review` (~3 \
minutes measured, and free: the draft phase runs no CI). Filed against the head \
that was checked out when you read, so a push needs another read."""

# The DID-YOU-ANSWER-IT half. The module's own header carries the measurement,
# the count reformulation, and why the thread ids cannot be in the message.
[[rule]]
id = "review-answered"
kind = "policy"
scope = "mediated_call"
module = "policy/review-answered.rego"
severity = "deny"

# `claim-guard`, as config (CLOUD-444) — the other half of the pair
# `ready-needs-receipts` starts, and the one the receipt kind could not express
# until this change.
#
# TWO COLUMNS DO THE WORK, and neither is a tuning knob:
#
#   trigger = "write"  The precondition is due before the work is TOUCHED, not at
#                      some recognisable command. `issue-guard` fires at `gh pr
#                      create`, which is the END of the work; the edit this
#                      catches is the first one, whatever tool makes it. No
#                      command shape can express that, which is why every write
#                      went unjudged by anything but the protected-path gate.
#   key = "branch"     A claim attests to a decision about an ISSUE, and every
#                      commit on the branch continues to serve it. A HEAD-keyed
#                      claim would expire on every commit and amend — the
#                      false-positive rate that gets a guard bypassed, so the
#                      wrong keying here would not merely annoy, it would end
#                      enforcement.
#
# What is NOT here, deliberately: the exclusion set. Git-ignored paths, paths
# outside the repository and `.git/*` are never judged, and those are questions
# about a checkout rather than policy — so they live at the boundary
# (`receipt::judgeable`) and this file does not restate them. A detached HEAD has
# no branch to key a claim on and therefore allows, which is what keeps a rebase
# conflict resolution — the one moment the contract says a human decides —
# editable.
#
# The receipt is minted by `mise run claim-check` on its pullable path, and that
# task's write side is untouched by this row: the engine reads the file it already
# writes.
[[rule]]
id = "claim-needs-receipt"
kind = "receipt"
scope = "mediated_call"
severity = "deny"
trigger = "write"
checks = ["claim"]
key = "branch"
reason = """
Pull the issue first: search the board (`mise run graph-check` prints the ready \
frontier), then pipe the issue's `get_issue` payload to `mise run claim-check`. \
It exits non-zero if someone is already on it, and mints the receipt if not. \
Then move it Todo -> In Progress and assign yourself — the tracker automation \
will not, since it fires on the PR event. Scratch work is not gated: anything \
git-ignored, anything outside the repository, and anything under `.git` is never \
judged.

Where the payload comes from (CLOUD-990, CLOUD-1121). One command, on any \
host, keyed on the id you already hold:

    batten capture find CLOUD-N --tool get_issue --raw | mise run claim-check

That replaces the three-step handle hunt this remedy used to name — list the \
captures, grep them for the id to find a handle, then \
`batten capture show <handle> --raw` — because finding a handle is itself a \
read, and a remedy for "this payload should not have to be in context" should \
not begin by putting a listing there. Those commands still work and are still \
how you browse. On a host with a transcript, `mise run board-payloads <id>` \
works too.

If the row has never been read here, nothing is stored yet: read it \
(`get_issue <key>`) and the capture mints itself. Every route hands over \
bytes the tracker returned, never a re-typed copy; do NOT re-type one by hand."""

# The two read-shaped receipts, minted from the result that earned them
# (CLOUD-1024). Both rows below DEMAND one of these; these two rows are what
# writes them, and they sit here so the writer and the reader are read together.
#
# WHY THIS TABLE CARRIES THE TRACKER'S VOCABULARY. `get_issue`, `list_issues`,
# `id`, `updatedAt`, `description`, `status` name a tracker, its tools and its
# schema — every one of them a consumer fact, so a grep of `crates/batten` for
# any of them returns nothing (non-negotiable rule 1). The engine knows a mint has
# a name, a tool, a key, a required projection and a body.
#
# `requires` IS THE SUCCESS PREDICATE, not a convenience. A mint that fired on an
# errored or empty response would forge a read receipt for a read that never
# happened, which is worse than the hand-piped path it replaces. For these two the
# projection each receipt needs already is that predicate — no MCP error object,
# no empty result and no `save_issue` response carries either required set — so
# the general typed notion of a succeeded call (CLOUD-953) is not needed here and
# is not waited for. What that issue still owes is the widening for receipts whose
# projection is NOT self-validating.
#
# `tool` MATCHES THE SUFFIX, and identification is by TOOL rather than by field
# shape. A `save_issue` response and a `get_issue` payload are shape-identical
# across `id` and `status`, so duck-typing would let the later, poorer payload
# mint the receipt; and one connector was measured exposed under three names
# across registration episodes, so a row naming one whole name matches none of the
# others and the miss is silent (CLOUD-178).
#
# The hand-run tasks are UNCHANGED and stay the remedy each row's `reason` names:
# a host with no post-tool event must still be able to comply, and the receipt
# bytes below are byte-identical to what those tasks write, so `claim-check`
# (field 4) and `finding-sink-check` (field 5) read what they read now.

# `issue-read.<KEY>`, replacing rather than appending: this record answers "how
# old is the newest read", so the freshest must overwrite the stalest. An append
# would leave the reader parsing whichever line came first.
#
# The five fields are `issue-read-check.sh`'s, in its order. `{now}` is the
# boundary's clock and is the whole point of the change: the hand-run path stamped
# when the MINT happened, so a payload 33 minutes old was measured minting a valid
# 300-second window. Taken from the result, the read and the stamp are one instant.
#
# `{authority:ready}` IS THE SIXTH FIELD AND IT IS APPENDED, never inserted
# (CLOUD-1100). Every reader of this receipt is positional — `claim-check` takes
# field 4 and `finding-sink-check` field 5 — so a field added at the end moves
# none of them, and `mise run issue-read-check`, which still writes five, keeps
# minting a receipt every consumer can read. It renders the Ready-block verdict
# from the COMPILED authority (`crates/batten/src/ready.rs`) rather than by
# spawning a program, which is what makes it free here: the boundary already
# holds the payload, so the verdict costs a library call on a read the agent was
# making anyway. `-` where the authority could not judge, and the row below reads
# that as could-not-look and allows.
#
# `{digest:description}` and `{slug:status}` are the two OPTIONAL arms, and both
# record `-` when absent. That direction is load-bearing: `-` reads downstream as
# "could not look", so sending less makes a later gate LOUDER, never quieter. The
# alternative shipped once — an absent body fell through to the empty string,
# whose hash was a real-looking digest two bodyless payloads then matched on
# (CLOUD-691).
[[mint]]
name = "issue-read"
tool = "get_issue"
key = "named"
key_from = "id"
requires = ["id", "updatedAt"]
mode = "replace"
body = "{id} {updatedAt} {now} {digest:description} {slug:status} {authority:ready}"

# `issue-search.<branch>`, appending: a search receipt accumulates what the author
# has seen, which is what `issue-search-check.sh` writes and why its mode differs
# from the row above.
#
# `hasNextPage` IS THE DISCRIMINATOR, and it is required rather than rendered. It
# is the key every list response carries and a single-issue payload does not, so
# requiring it is what stops a read minting a search receipt. The measured shape
# is `{issues: [...], hasNextPage: bool, cursor: ...}`.
#
# `issues[].id` requires every element to carry an id, and an EMPTY array passes
# vacuously — deliberately. A search returning nothing is the commonest honest
# outcome of looking before filing something genuinely new, and refusing it would
# make the gate punish exactly the behaviour it exists to produce.
#
# THE BASE LINE IS NOT OPTIONAL. `receipt::branch_validity` voids a branch-keyed
# receipt that cannot say what `origin/main` it was taken against (CLOUD-516) — a
# branch name outlives the branch it described, so a receipt keyed on the name
# alone lets a previous occupant's search authorise this occupant's filing.
# Without this line the row below would be silently un-passable rather than merely
# weak.
[[mint]]
name = "issue-search"
tool = "list_issues"
key = "branch"
requires = ["hasNextPage", "issues[].id"]
mode = "append"
body = "{join:issues[].id}\nbase {git:origin/main}"

# ─── THE BOARD-WRITE RECORD (CLOUD-1051), replacing `board-write-record.sh` ───
#
# The sensor half of CLOUD-514: every row this branch put on the board, with the
# tracker's own verdict on whether a new row was refined. `filed-here-check` reads
# it; this writes it.
#
# WHY THE VERDICT IS A PROGRAM AND NOT A TEMPLATE. `ready-lint` reads a payload
# the caller assembles, and during CLOUD-514's own refinement it was run three
# times against text in a local file — once under an id no row carried — green
# every time. A toll payable in text nobody filed is not a toll. A recorder does
# not have that problem: it fires on the tool RESULT, so the body being judged is
# the one the tracker STORED. That is why the `description` every column below
# reads is `result`, never `input`.
#
# THE READY GRAMMAR IS NO LONGER SPAWNED (CLOUD-1100). The paragraph that stood
# here said both programs stayed shell "deliberately", because a second
# implementation of the Ready-block grammar would be the drift this migration
# exists to remove. That reason was sound and it has been met the other way
# round: the grammar was PORTED WHOLE to `crates/batten/src/ready.rs` — one
# authority, not two — so the columns below ask the compiled authority
# (`authority = { ask = "ready" }`) where they used to run a program. The `read`
# tables are unchanged, because `ready::adjudicate` answers in the SHELL
# program's `0`/`1`/`2` contract rather than in batten's inverted one; that
# inversion is CLOUD-909's trap and the function's own header is where it is
# written down.
#
# `mise-tasks/ready-lint.sh` IS RETIRED (CLOUD-1221), and what this paragraph
# used to say about it was wrong in a way worth recording rather than
# overwriting. It said the program "is dormant behind the compiled authority,
# which is the honest state rather than a shim." It was never a shim and never
# dormant: it was 729 lines carrying a SECOND copy of the grammar, and
# `mise-tasks/graph-check.sh` ran it twice per Todo row. So CLOUD-1092's split of
# the `bump` token landed in `crates/batten/src/ready.rs` and its one consumer
# never executed it — measured over one payload declaring `test` -> no bump, the
# program emitted `bump none` where the verb emits `bump no-release`, and
# `graph-check` keys `declares-no-commit-with-pr` on the literal `none`.
#
# The blocker named here was real, and two changes cleared it. The path half:
# `only_drops_a_retired_reference` admitted only a removed line or a truncation,
# so repointing a caller at a verb had no spelling — CLOUD-1149 and CLOUD-1219
# added `repoints_at_the_declared_invocation` and the `runs:` ledger field. The
# contract half: `[tasks."ready-lint"]` in `mise.toml` translates this crate's
# `2`/`1` back to the shell `1`/`2` that `graph-check` branches on, in one
# ungoverned place. `mise run ready-lint` still resolves, so `R-GROOM-TO-READY`
# below is unchanged.
#
# `mise-tasks/pipefail-grep-check.sh` was named here as a second by-path caller
# and is not one — its only mention is a comment citing this program as a
# measured example. `crates/batten/tests/ready.rs` carries its 82 cases and both
# `// carried:` ledger arms.
#
# `board-diff-overlap.sh` is a different question and is untouched: it owns
# basename resolution and the tracked-only bound, neither of which the crate
# carries.
[program.named-paths]
path = "mise-tasks/board-diff-overlap.sh"
args = ["--named"]

# THE CLOSING KEYS A PR BODY NAMES (CLOUD-1051, phase B0). `--list` prints them
# and decides nothing, which is the mode CLOUD-774 added to this file for exactly
# this caller: `$CLOSING_VERBS` has one home, and a second copy of that regex
# would be one value in two files with no gate holding them equal.
[program.closing-keys]
path = "mise-tasks/closing-key-check.sh"
args = ["--list"]

# ─── THE OUTPUT-POSTURE SCRUB AND ITS TELL (CLOUD-97, ported under CLOUD-1051) ─
#
# Four scrubbers and one predicate, declared here because an inline regex is
# refused at load and because one concept must have one spelling.
#
# ORDER MATTERS AND THE MODULE APPLIES THEM IN IT: a fence contains backticks, so
# stripping code spans first would leave the fence's own delimiters to pair with
# prose either side of it.
# The shape `release-plz` mints, and the one `released`'s successor orders on.
# A `[[pattern]]` row rather than an inline regex because a module's inline regex
# is refused at load — one concept, one spelling.
[[pattern]]
id = "release-tag"
regex = '^v[0-9]+\.[0-9]+\.[0-9]+$'

[[pattern]]
id = "md-fenced-block"
regex = '```[^`]*```'

[[pattern]]
id = "md-code-span"
regex = '`[^`]*`'

[[pattern]]
id = "md-quoted-span"
regex = '"[^"]*"'

# `(?m)` so `^` reaches a block quote wherever it sits in a whole-input string
# rather than only at the very start of it.
[[pattern]]
id = "md-block-quote"
regex = '(?m)^[[:space:]]*>[^\n]*'

# THE TELL. AGENTS.md's own two examples plus their direct inflections, and the
# width is measured rather than chosen — see `policy/stop-posture.rego`'s header
# for the witnessed miss (`worth naming`) and for why `calling out` stays out.
#
# `(?i)` because a sentence is a sentence however it is capitalised. Both the
# contracted and the expanded auxiliary, and both apostrophes: a straight one and
# a typographic one are the same word to a reader.
[[pattern]]
id = "hedged-flag-framing"
regex = "(?i)worth (noting|flagging|mentioning|naming)|one thing (I would|I['’]?d) (flag|note)|I['’]?d (flag|note) (that|one)|I would (flag|note) that|I should (note|flag)|(it|that)['’]?s worth (noting|flagging|mentioning|naming)|bears (noting|flagging|mentioning|naming)"

# The §1 span, narrowed before the paths are read (CLOUD-854).
#
# The fifth column holds every path the BODY names, and a path-name intersection
# cannot tell a row CLAIMING work on a file from one CITING it as evidence — so
# the refusal fired hardest on the rows that documented their provenance best. §1
# names the source of truth by construction, so intersecting the two is what tells
# them apart.
#
# The grammar is `ready-lint`'s own CLAUSE_LABEL: a bolded label or a heading
# carrying the tag. Declared here rather than inline because an inline regex is
# refused at load, and because a Ready block has exactly one definition of where a
# clause begins.
# CLOUD-316's reference triple, as `mise exec` spells one: a backend, a tool and a
# version. The bash this replaces carried the identical expression inside a `jq`
# `test(...)`, and the registry is what keeps one concept to one spelling
# (CLOUD-1050) now that a second reader — the module — exists.
[[pattern]]
id = "mise-tool-reference"
regex = '^[a-z0-9]+:.+@.+$'

[[pattern]]
id = "clause-label"
regex = '^[[:space:]]*([*-][[:space:]]*)?\*\*[^*]*\((§|clause )[0-9]+\)|^#{2,6}[[:space:]]+[^#]*\((§|clause )[0-9]+\)'

[[pattern]]
id = "clause-one"
regex = '\((§|clause )1\)'

# --- the Ready-block grammar (CLOUD-1100) ------------------------------------
#
# THE WHOLE GRAMMAR IS THE CONSUMER'S, AND THAT IS WHY IT LIVES HERE. Every token
# below is this repository's own dialect — which headings open a Ready block, how
# a clause is labelled, what a commit type looks like, what an issue key looks
# like. Non-negotiable rule 1 keeps that out of `crates/batten`, and the crate
# says so about itself: `rules.rs` records that "a tracker's vocabulary inside
# this crate is non-negotiable rule 1's violation".
#
# MEASURED, BECAUSE IT LANDED WRONG FIRST. CLOUD-1121 ported the grammar out of
# `mise-tasks/ready-lint.sh` into `crates/batten/src/ready.rs` and carried these
# 18 tokens in with it, including `CLOUD-[0-9]+` as a `const`. It passed every
# gate: the agnosticism rows are four `forbid` literals — an account number, an
# entity path, a repo name, an org — and none of them is a tracker key. So rule 1
# had a mechanism for four strings and none for the class. `no-tracker-key-in-core`
# below is that mechanism; these rows are where the vocabulary went instead.
#
# `clause-label` above is NOT repeated here, and its absence is the point: the §1
# span already reads it, so a second spelling would be the drift this registry
# exists to remove. One concept, one row, however many readers.

[[pattern]]
id = "ready-opener"
regex = '(?i)^\*\*Refinement|^#{2,3} +Refinement|^#{2,3} +Ready|^\*\*Definition of [Rr]eady'

# The parent dialect, needed twice: to locate a block, and to exempt it from the
# clause floor. Matching only the leaf form reported `no-ready-block` on every
# correctly-refined epic on the board — the worst kind of false negative, since it
# would have pushed authors to rename a heading the gate document prescribes
# purely to satisfy a lint. Measured on CLOUD-7.
[[pattern]]
id = "ready-parent-opener"
regex = '(?i)^#{2,3} +Refinement gate'

# Recognised only to be REPORTED (CLOUD-299) — the dialect four rows actually use.
# Leaving it unrecognised made the anchor wrong in both directions at once.
[[pattern]]
id = "ready-legacy-opener"
regex = '(?i)^\*\*Definition of [Rr]eady'

# The questions-are-artifacts protocol: a real ambiguity is written onto the row
# and the row stays OUT of the ready queue. That only holds if the marker is a
# gate — otherwise a question can be written and the row promoted anyway.
[[pattern]]
id = "ready-open-questions"
regex = '(?i)open questions? blocking ready|\(incomplete —'

# The retired `(clause N)` notation, recognised only to converge the corpus.
# Accepting both dialects silently is what lets drift accumulate.
[[pattern]]
id = "ready-legacy-clause-notation"
regex = '(?i)\(clause [0-9]+\)'

# The §6 label. Anchored on the LABEL + tag pair, never a bare `(§6)`: the §N
# namespace is overloaded, and a Ready block legitimately cites house-style §6 in
# prose, where it means the output contract rather than this clause.
[[pattern]]
id = "ready-bump-label"
regex = '(?i)Commit / bump \((§|clause )6\)'

# THE COMMIT TYPE AS A WHOLE CODE SPAN, NEVER A PREFIX (CLOUD-290). The closing
# backtick used to be optional, so the pattern matched a prefix of any longer span
# and any backticked token beginning with a type word was read as the declared
# type. Measured on two lines differing only in the bump text: an honest
# "`ci-local-parity`; `feat` -> patch until 0.1.0" was refused as "ci implies no
# bump", while a line whose type really was `ci` passed while reading it as
# `test`. Loud exactly when the author was right, silent exactly when it did no
# damage — which is why it survived, and why it is discoverable only by
# experiment. The optional `(scope)` arm is not decoration: `fix(gate)` is a
# legitimate declaration, and without it the tightened anchor turns a verdict this
# gate reaches today into `commit-type-missing`.
[[pattern]]
id = "ready-commit-type"
regex = '(?i)`(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)([(][a-z0-9._-]+[)])?!?`!?'

# THE CORPUS'S WAYS OF DENYING A BREAK, and the `!` is read off the TYPE TOKEN
# rather than off the line (CLOUD-852). This was a count of `!|BREAKING CHANGE`
# over the whole clause, which has no polarity: the corpus's own denial is "Not
# `!`", and that spelling made the gate read `expected = major`. Five rows use it.
# It went unnoticed because below 0.1.0 a false `major` collapses to `patch`,
# exactly where `feat` and `fix` already collapse — so for every releasable type
# the wrong reason produced the right answer.
[[pattern]]
id = "ready-break-denial"
regex = '(?i)not[[:space:]]+`?!`?|not[[:space:]]+breaking|non-?breaking|no[[:space:]]+break[a-z]*'

# THE DENIAL, QUALIFIED BY THE SURFACE IT DENIES ABOUT (CLOUD-842). `batten` is
# both a binary and a library, so "breaking" names two objects and §6 has one word
# for them. Five rows declared "not `!`" reasoning correctly about the consumer
# surface and never checking the library one; the change landed as `feat(policy)!`.
#
# THE QUALIFIER MUST ATTACH TO THE DENIAL, not merely share the line. CLOUD-832's
# clause reads "Not `!`: the string `deny` path is preserved, so no consumer shape
# breaks" — `consumer` is forty characters downstream, part of the reasoning
# rather than the scope of the denial, and a bare "does `consumer` appear
# anywhere" test passes the one row this clause exists to refuse.
#
# The connective set is an alternation rather than a bracket expression: an em
# dash is multibyte, and a bracket expression would match one of its own bytes.
[[pattern]]
id = "ready-break-qualified"
regex = '(?i)(not[[:space:]]+`?!`?|not[[:space:]]+breaking|non-?breaking|no[[:space:]]+break[a-z]*)[[:space:]]*(-|—|,|:)?[[:space:]]*(for|to|on|in|of)?[[:space:]]*(the[[:space:]]+)?(consumer|library)'

# A block that INTRODUCES a gate. The extension is OPTIONAL and both spellings
# must match — a gate is written up as `mise-tasks/x-check` and the file is
# `mise-tasks/x-check.sh` (CLOUD-865), so anchoring on `-check` at the closing
# backtick silently stopped recognising a gate introduction the day the tree grew
# extensions.
[[pattern]]
id = "ready-gate-intro"
regex = '(?s)```[^`]*\[\[rule\]\]|`mise-tasks/[a-z0-9][a-z0-9._-]*-check(\.sh|\.bash)?`'

# The same anchor, narrowed to something that matches WITHIN one line. The fenced
# alternative above spans lines by design, so a pointer computed from it would
# fall back to the block's first line and name the wrong place.
[[pattern]]
id = "ready-gate-intro-line"
regex = '\[\[rule\]\]|`mise-tasks/[a-z0-9][a-z0-9._-]*-check(\.sh|\.bash)?`'

# A severity ASSIGNMENT or a bolded declaration, never the bare word: the rule
# this serves is `deny-without-replay`, so a bare-word predicate self-trips on the
# block that introduces it.
[[pattern]]
id = "ready-deny-severity"
regex = '(?i)severity[[:space:]]*=[[:space:]]*.?deny|\*\*deny\*\*'

# What counts as a replay: a line naming one, plus a firing count somewhere in the
# block. Block-wide rather than one-line, because a replay is reported as a fenced
# measurement whose prose header names it and whose body carries the numbers —
# measured on CLOUD-752 and CLOUD-753, neither of which puts both halves on one
# line.
[[pattern]]
id = "ready-replay-named"
regex = '(?i)replay'

[[pattern]]
id = "ready-replay-count"
regex = '(?i)[0-9][^.]{0,40}fir(e|ed|ing)|fir(e|ed|ing)[^.]{0,40}[0-9]|would-fire'

# The §8 label.
[[pattern]]
id = "ready-blockers-label"
regex = '(?i)Blockers \((§|clause )8\)'

# A HAND-OFF VERB, for the deferral scan — claims, not mentions. "The same failure
# shape as CLOUD-195" is a comparison, "split out of CLOUD-177" is provenance,
# "see CLOUD-33" is a cross-reference; none hands anything off, and flagging them
# would punish the cross-referencing that makes rows readable. So a claim is a verb
# immediately followed by a key, nothing looser.
[[pattern]]
id = "ready-defer-verb"
regex = '(?i)(deferred?|deferring|defers) (it |that |this )?to|owned by|belongs to|left to|handed off to|handled by|tracked (separately )?(in|by|under)|moved? to|is now|remains'

# THE TRACKER KEY. The one token whose presence in the crate `no-tracker-key-in-core`
# now refuses, and the reason that row exists: it is the consumer's vocabulary in
# the most literal sense available.
[[pattern]]
id = "ready-issue-key"
regex = 'CLOUD-[0-9]+'

# The tracker serialises a mention as `<issue …>KEY</issue>`, so the markup is
# stripped and the stored and rendered forms become one case. A pattern written
# against the rendered form never matches the stored one, and an exemption tested
# only on plain-text fixtures is dead code in production.
[[pattern]]
id = "ready-issue-mention-markup"
regex = '</?issue[^>]*>'

# The bump vocabulary. `none` is a valid explicit answer beside `no bump` — a
# tracker-only or repo-config change lands no commit at all, and demanding a type
# there would force a lie.
[[pattern]]
id = "ready-bump-token"
regex = '(?i)major|minor|patch|no bump|none'

# THE §8 CLAIM SPAN, and the three rows are one predicate: a claim STARTS at a
# blocked-by token and ENDS at either of the other two relation names. A
# well-formed §8 bullet cross-references the other directions — "`relatedTo`
# CLOUD-37, the two share a representation but neither strictly blocks the other"
# is correct prose whose board relation is `relatedTo` — and flagging it would
# punish precision.
#
# THE OPENER CARRIES BOTH SPELLINGS (CLOUD-1113). `blocked[[:space:]]*by` matches
# the tracker's `blockedBy` and the English "blocked by" alike, because a body
# that says "blocked by CLOUD-N" states exactly the dependency the cross-check
# exists to find, and anchoring on the camel-case token alone made that sentence
# invisible. Widening WHICH spellings open a claim leaves every span rule below
# untouched, which is what keeps a §8 bullet that cross-references a sibling from
# becoming a claim.
#
# THE TAIL IS `(?s).*`, NEVER `[\s\S]*`, and that is a MEASURED requirement
# rather than a preference. The two denote the same set, but the explicit union
# under `(?i)` builds a case-folded Unicode class the engine then stars — and
# every row here compiles on every config LOAD, so the cost lands on the
# mediated call, the one path an agent waits on. Measured on this container,
# ten copies of one row against a 35.4 ms floor: `[\s\S]*` costs **11 ms per row
# to compile** where `(?s).*` costs **0.34 ms**. Spelled the first way, these
# three rows put `wired` at 78.7 ms against a 35.4 ms merge base and
# `perf-compare` refused the branch at 2.223x on a 1.30x threshold.
[[pattern]]
id = "ready-blockedby-claim"
regex = '(?is)blocked[[:space:]]*by.*'

[[pattern]]
id = "ready-blocks-tail"
regex = '(?is)`?blocks`?[^A-Za-z].*'

[[pattern]]
id = "ready-relatedto-tail"
regex = '(?is)`?relatedTo`?.*'

# TWO EXPRESSIONS ARE DELIBERATELY NOT ROWS, and the split is stated rather than
# left to be rediscovered. `BREAKING CHANGE:` is the Conventional Commits footer
# and `[(][^)]*[)]` strips a scope from a type token — neither is a consumer
# IDENTIFIER, which is what rule 1 is about, and neither would mean anything
# different in another repository. They stay inline in the predicate that reads
# them. What moved here is every token that names something only this repository
# has: its headings, its clause notation, its relation names, its issue keys.

# A CREATE is what carries a refinement obligation, so an `id` in the INPUT
# refuses this row: that is an update to a row that already exists, which is not a
# board write this branch is answerable for.
[[recorder]]
name = "board-issue-created"
record = "board-writes"
tool = "save_issue"
key = "branch"
requires = ["id"]
refused-when-input = ["id"]

[[recorder.columns]]
name = "kind"
value = { literal = "issue" }

[[recorder.columns]]
name = "id"
value = { result = "id" }

[[recorder.columns]]
name = "updated"
value = { result = "updatedAt" }

# ALL THREE RELATION DIRECTIONS, and only on the create path. `ready-lint`'s
# deferral rule accepts any direction, and demanding `blockedBy` specifically
# would push authors to declare false dependencies to pass a lint — measured, a
# row that honestly recorded a hand-off as `relatedTo` linted unready through four
# grooms. The create call's argument IS the whole relation set exactly once in a
# row's life, because there is nothing prior to append to.
[[recorder.columns]]
name = "verdict"
value = { authority = { ask = "ready", read = { status = { "0" = "ready", "1" = "unready" } }, stdin = { object = { id = { result = "id" }, description = { result = "description" }, relations = { object = { blockedBy = { wrap = { from = "blockedBy[]", key = "id" } }, blocks = { wrap = { from = "blocks[]", key = "id" } }, relatedTo = { wrap = { from = "relatedTo[]", key = "id" } } } } } } } }

[[recorder.columns]]
name = "overlap"
value = { program = { run = "named-paths", read = "stdout", stdin = { result = "description" } } }
zero-is-a-count = true

# THE ROWS PROSE WILL LINK, which is a PREDICTION and is stated as one. The tracker
# auto-links every key a body mentions into a symmetric edge, so writing a body
# modifies rows the caller passed as no parameter and is told about in no response.
# A cited row that was already related is counted here and adds no edge, so this
# over-counts and never under-counts — conservative in the direction that matters,
# since the failure mode is the record being quieter than the truth.
[[recorder.columns]]
name = "cites"
value = { authority = { ask = "ready", read = { stdout-line = "cites-body " }, stdin = { object = { id = { result = "id" }, description = { result = "description" } } } } }
minus = { inputs = ["relatedTo[]", "blockedBy[]", "blocks[]"] }
without = { result = "id" }
counted-with = ":"
zero-is-a-count = true

[[recorder.columns]]
name = "sec1"
value = { program = { run = "named-paths", read = "stdout", stdin = { section = { from = { result = "description" }, label = "clause-label", select = "clause-one" } } } }

# A GROOM OF A ROW THIS BRANCH FILED, and without it `filed-here-check`'s third
# remedy is unreachable. That gate tells a branch which filed an unrefined row to
# groom it and re-run `land` — but a groom is a `save_issue` WITH an id, so the
# create row above refuses it, the record keeps its creation-time verdict, and the
# gate refuses forever. Measured on PR #525: the row was groomed until `ready-lint`
# exited 0 over the tracker's own response, and the refusal did not move.
#
# Narrow on purpose: `requires-recorded` admits it only when this record already
# carries a line for that id in column 1. That is the row this branch filed and is
# answerable for, so re-linting grants nothing a fresh create would not have, and
# the verdict still comes from the tracker's RESPONSE. A groom of somebody else's
# row is skipped exactly as before.
#
# NO RELATIONS ON THIS PATH (CLOUD-781). `save_issue` relations are append-only, so
# on an update the argument is a patch — a groom touching only the body passes no
# `blockedBy` at all, and synthesising `[]` from that asserts THIS ROW HAS NO
# BLOCKERS, a claim nothing here checked. Omitting the key fires
# `unjudgeable-relations`, `ready-lint` exits 2, no status maps it, and the column
# records could-not-look. That is the honest answer for relations nothing can see.
[[recorder]]
name = "board-issue-groomed"
record = "board-writes"
tool = "save_issue"
key = "branch"
requires = ["id"]
requires-recorded = { matches = { 0 = { literal = "issue" }, 1 = { result = "id" } } }

[[recorder.columns]]
name = "kind"
value = { literal = "issue" }

[[recorder.columns]]
name = "id"
value = { result = "id" }

[[recorder.columns]]
name = "updated"
value = { result = "updatedAt" }

[[recorder.columns]]
name = "verdict"
value = { authority = { ask = "ready", read = { status = { "0" = "ready", "1" = "unready" } }, stdin = { object = { id = { result = "id" }, description = { result = "description" } } } } }

[[recorder.columns]]
name = "overlap"
value = { program = { run = "named-paths", read = "stdout", stdin = { result = "description" } } }
zero-is-a-count = true

[[recorder.columns]]
name = "cites"
value = { authority = { ask = "ready", read = { stdout-line = "cites-body " }, stdin = { object = { id = { result = "id" }, description = { result = "description" } } } } }
without = { result = "id" }
counted-with = ":"
zero-is-a-count = true

[[recorder.columns]]
name = "sec1"
value = { program = { run = "named-paths", read = "stdout", stdin = { section = { from = { result = "description" }, label = "clause-label", select = "clause-one" } } } }

# A COMMENT IS RECORDED AND NEVER GATED. It is the honest common case — a comment
# on the row that already owns a finding — and pricing it would push the pressure
# toward silence, which is the failure `finding-sink-check` exists to catch. So the
# verdict column is a literal could-not-look rather than a lint.
#
# THE ID COMES FROM THE INPUT, and this is the one column on the whole table that
# must. A `save_comment` response is the COMMENT object: its `id` is the comment's
# own uuid and it carries no reference to the row the comment landed on. Measured
# on the shell recorder's first five live rows, which came out carrying uuids in an
# issue-key column — a wrong answer wearing a right answer's shape, which reads as
# data rather than as a gap and is strictly worse than the gap.
[[recorder]]
name = "board-comment"
record = "board-writes"
tool = "save_comment"
key = "branch"
requires = ["id"]

[[recorder.columns]]
name = "kind"
value = { literal = "comment" }

[[recorder.columns]]
name = "id"
value = { input = "issueId" }

[[recorder.columns]]
name = "updated"
value = { result = "updatedAt" }

[[recorder.columns]]
name = "verdict"
value = { literal = "-" }

[[recorder.columns]]
name = "overlap"
value = { literal = "-" }

[[recorder.columns]]
name = "cites"
value = { literal = "-" }

[[recorder.columns]]
name = "sec1"
value = { literal = "-" }

# ─── THE PR BODY REACHES THE PREDICATE BY HOOK (CLOUD-1051, phase B0) ───
#
# `filed-here-check` exempts a row the PR CLOSES, because recomputing the overlap
# against the landing diff otherwise fires on every row the branch filed AND THEN
# FIXED — its paths are in the diff by construction, so every honest
# file-then-fix would need the override, and a routinely-overridden gate is
# bypassed rather than satisfied.
#
# The shell read that body on stdin. `batten check` is declared `read` and has no
# stdin channel (house-style §5), and widening it would make a read-effect verb
# take an argument that changes its verdict. So the body arrives the way every
# other agent-sourced fact does: the boundary records what a command the AGENT
# ran returned, and the tree rule reads the record.
#
# THE FETCH, NOT THE CREATE, and the distinction is load-bearing. `land` already
# re-fetches the body before it calls the gate — a body can be edited on the
# forge, and a resumed session lands a PR created before a container reclaim — so
# only the fetched bytes are authoritative. A `gh pr create --body` argument is
# what the caller asked for; this is what the forge has.
#
# `requires-input-matching` IS THE SELECTOR A TOOL NAME CANNOT BE. Every shell
# call arrives as one tool with one result shape, so `tool` alone selects the
# whole session. The pattern narrows it to the one command whose stdout is a raw
# PR body — `--jq .body`, never `--json body` alone, whose stdout is a JSON
# object and would be handed to the key reader as prose.
# A COUNT THAT FOUND SOMETHING, which is the one reading of the overlap column's
# leading field that carries paths worth intersecting. `0` is a measurement that
# found nothing and `-` is could-not-look; both pass, and neither reaches here.
[[pattern]]
id = "positive-count"
regex = '^[1-9][0-9]*$'

[[pattern]]
id = "gh-pr-body-fetch"
regex = 'gh[[:space:]]+pr[[:space:]]+view\b[^|;&]*--jq[[:space:]]+\.body\b'

# A shell program resolves a sibling at RUN TIME, so the repo-relative path a
# retirement deletes never appears in the caller's text and both of
# `shell-retirement`'s admission clauses read a conforming cleanup as an
# unrelated rewrite (CLOUD-1149). This is the DIRECTORY half of such a reference
# — the whole expression, with the `/<name>` after it removed by the module.
#
# ANCHORED AT BOTH ENDS, and that is the whole of what keeps the repointing
# clause from admitting an arbitrary span: `regex.match` is a SEARCH, so an
# unanchored row would hold for any longer text that merely contains one of
# these, and the clause would then accept a prefix nobody intended.
#
# THE PARENT FORM IS EXCLUDED BY CONSTRUCTION rather than by a negative clause:
# `$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)` puts `/..` between the
# inner `)` and the closing quote, where this admits none. A parent is not a
# sibling, and `ready-lint` and `payload-field` both resolve the repository root
# that way.
#
# The spellings are measured rather than imagined — all three are in this tree —
# and `crates/batten/src/policy/presets/shell-hygiene/sibling-resolves.rego`
# names the same set from the other side, looking for a reference that stopped
# resolving.
[[pattern]]
id = "shell-script-directory"
regex = '^\$\(dirname([[:space:]]+--)?[[:space:]]+"[^"]*"\)$|^\$\(cd([[:space:]]+--)?[[:space:]]+"\$\(dirname([[:space:]]+--)?[[:space:]]+"[^"]*"\)"[[:space:]]*&&[[:space:]]*pwd\)$|^\$\{(BASH_SOURCE\[0\]|0)%/\*\}$'

# The MARKER, which is a different question from the expression above and is why
# there are two rows rather than one. `sibling-resolves` states the reason on its
# own `script_dir_line`: "the spelling varies more than a single regex should try
# to hold." The expression row decides a SPAN — is this exact text a script
# directory; this decides whether a whole LINE resolves THIS script's directory
# at all, which is the removal clause's looser question.
#
# The module conjoins it with the retired file's basename, and that pairing is
# load-bearing: `dirname` alone also matches `dirname "$file"`, which is somebody
# else's directory.
[[pattern]]
id = "shell-script-directory-marker"
regex = '\$\{?BASH_SOURCE|\$0'

# The name of a shell variable, for reading the left-hand side of an assignment
# without a submatch. A capture would need a format string, and a format string
# inside a `regex.*` argument is an inline regex under another spelling —
# `collect_inline_regex` recurses into every argument and refuses it at load.
[[pattern]]
id = "shell-identifier"
regex = '^[A-Za-z_][A-Za-z0-9_]*$'

# A retirement arm's INVOCATION field (CLOUD-1219). A ledger row declares its
# successors as PATHS, which is the wrong shape for a caller of a program that
# retired onto a verb: substituting one yields
# `lint="$(dirname "$0")/crates/batten/src/ready.rs"` — byte-checkable, and
# nonsense.
#
# MARKED RATHER THAN POSITIONAL, for the reason the `changed` rows already give:
# nothing positional separates the fields, because the subject field is optional.
# VALIDATED rather than merely prefix-tested, so a malformed field is not a
# silently-empty command the repointing clause would then substitute in.
#
# ONE WHITESPACE-FREE TOKEN, forced by `arms_for` splitting a row on " ": an
# invocation written as three bare words would arrive as three successors, and
# each would become a target the PATH clause could substitute for a path. `+`
# decodes to a space and appears in no verb path, no `[tasks."…"]` key and no
# tracked path in this tree, so the decode is total and reversible.
[[pattern]]
id = "retirement-invocation-field"
regex = '^runs:[A-Za-z0-9][A-Za-z0-9._+-]*$'

[[recorder]]
name = "pr-body-closes"
record = "pr-closes"
tool = "Bash"
key = "branch"
requires = ["stdout"]
requires-input-matching = { command = "gh-pr-body-fetch" }

[[recorder.columns]]
name = "kind"
value = { literal = "closes" }

# `zero-is-a-count` is what keeps the three-valued read alive here. A body that
# closes nothing renders `0` — a measurement — while a fetch whose key reader
# could not run renders `-`, and the gate downstream must treat those
# differently: the first exempts no row, the second is could-not-look.
[[recorder.columns]]
name = "keys"
value = { program = { run = "closing-keys", read = "stdout", stdin = { result = "stdout" } } }
counted-with = ":"
zero-is-a-count = true

# `issue-search-guard`'s decision, as config (CLOUD-312 row 1, CLOUD-505).
#
# A row is not filed until somebody has looked for the one that already exists.
# The cost of that gap was measured: 45 minutes re-deriving a cause that was
# already on the board, two wrong diagnoses reported to a human, and then a
# duplicate opened anyway.
#
# ONLY CREATES ARE GATED, and `when_absent` is what makes that expressible
# (CLOUD-987). A `save_issue` naming no `id` opens a row; one naming an `id`
# annotates a row that already exists. The retired script's own header prices the
# alternative — gating updates "would demand a search before every edit to an
# issue, which is absurd and would get the guard switched off within a day" — so a
# rule table that could not tell them apart had to leave this in bash.
#
# `tool` MATCHES THE SUFFIX, which is the other half the script hand-rolled and
# the reason it could not trust its own wiring: CLOUD-178 measured one connector
# exposed as `mcp__Linear__save_issue`, `mcp__<uuid>__save_issue` and
# `mcp__claude_ai_Linear__save_issue` across registration episodes, so a rule
# naming one matches none of the others and the miss is silent. `selects_tool`
# matches exactly or the whole final `__`-delimited segment, so every episode is
# covered and `save_comment` still is not.
#
# `key = "branch"` because a search is evidence about the WORK, not about a
# commit: a SHA-keyed receipt would demand a fresh search per commit, which is the
# false-positive rate that gets a guard bypassed rather than satisfied.
#
# The receipt is minted by `mise run issue-search-check`, whose write side this
# row does not touch — the engine reads the file that task already writes.
[[rule]]
id = "filing-needs-a-search"
kind = "receipt"
scope = "mediated_call"
severity = "deny"
tool = "save_issue"
when_absent = "input-id"
checks = ["issue-search"]
key = "branch"
reason = """
Search the board before filing. That is the whole remedy: run whichever \
issue-listing tool this session carries — search for the `list_issues` suffix \
rather than a remembered prefix, since the connector is exposed under more than \
one name over its lifetime (CLOUD-178) — with a query drawn from the finding. \
The receipt mints itself from that result; there is no second call and no \
payload to pipe anywhere. A search returning nothing still mints it — zero hits \
is the honest outcome for a genuinely new finding and is not refused. This \
judges nothing about whether your row IS a duplicate, which it cannot know; it \
refuses only to let the question go unasked. Updating an existing issue is never \
gated."""

# CLOUD-312 row 3: `board-move-guard` retires here. THE THIRD ARM OVER ONE TOOL,
# and the one that needed a value rather than a presence: rows 1 and 2 split on
# whether the call names an `id`, and this one splits on WHICH COLUMN it moves to.
#
# IT SITS BEFORE ROW 2 DELIBERATELY, and the order is the reader's, not a tie-break.
# A move to In Review is also an edit, so both rows select it and both would refuse
# a call carrying neither receipt; the engine reports the first, so whichever comes
# first decides which remedy the author is handed. The MORE SPECIFIC row belongs
# there: "adjudicate this closure" is actionable about the move being attempted,
# where "re-read the row" is true but generic, and a reader sent to the generic one
# does the read, retries, and only then learns what the call actually owed. The two
# guards this replaces had the same composition and the same first-deny-wins
# behaviour, so nothing about what is enforced changes — only which of two true
# refusals is spoken.
#
# `when_value` is what makes it expressible at all, and the retiring guard prices
# the alternative in row 1's own terms: gating every column "would demand a
# graph-check before every edit, which is how a guard gets switched off within a
# day (CLOUD-199)." A row that could only ask whether a `state` was PRESENT would
# fire on every edit that named any. In Progress is `claim-check`'s question, the
# drain into In Review is CLOUD-469's, Todo promotion is CLOUD-375's — three other
# owners, and this row must not answer for them.
#
# The comparison is normalised by the engine (case folded, spaces/underscores/
# hyphens dropped), because the tracker's `state` parameter takes a type, a name or
# an id and those are one move. The VALUE is here rather than in the crate because
# a column's name is a consumer fact (non-negotiable rule 1).
#
# IT ADDS A TRIGGER, NEVER A SECOND PREDICATE. `graph-check`'s `in-review-no-pr`
# already decides whether a closure is real, and a re-derivation here would be two
# authorities for one fact with only the newer one deciding (CLOUD-351). No hook
# has a tracker credential, so this cannot look an issue up and does not try: it
# asks whether the closure was adjudicated, which is a file.
#
# `key = "named"` keyed on the issue is the whole design, and the receipt shape
# moved to match: `graph-check` now writes one `board-move.<KEY>` per id it judged,
# where it used to append `<epoch> <id> <id> …` to a single file. A bare
# "graph-check ran" receipt is satisfied by judging one clean issue and then
# sweeping fifteen — which is exactly the sweep CLOUD-512 measured, fifteen issues
# moved after #375 with CLOUD-480 among them and nothing of it landed, wrong for
# 4.5 hours because a `Refs:` trailer naming it as the still-open gap read as a
# landing.
#
# `max_age = 900` is the guard's `BATTEN_BOARD_MOVE_MAX_AGE:-900`, and it is a
# recency bound rather than a freshness proof for the same reason row 2's is: the
# board can change after the read and `save_issue` offers no if-match precondition.
# Unbounded, one adjudication would authorise every later sweep in the clone.
[[rule]]
id = "a-move-to-in-review-owes-an-adjudication"
kind = "receipt"
scope = "mediated_call"
severity = "deny"
tool = "save_issue"
when_present = "input-state"
when_value = "In Review"
checks = ["board-move"]
key = "named"
key_from = "input-id"
key_shape = "^[A-Z][A-Z0-9]*-[0-9]+$"
max_age = 900
reason = """
In Review means the code is on `main`. `graph-check` decides that from the row's \
PR attachments and it is the only thing that does — reading `git log --grep` does \
not, because a commit can CITE a row without implementing it. Adjudicate the \
closure, then move it: `get_issue` for each row with `includeRelations: true`, \
KEEPING attachments, then pipe that array to `mise run graph-check`. Exit 0 \
records which ids it judged and that is what authorises the move; exit 1 means the \
board is signalling falsely, so fix that first; exit 2 means it could not look, so \
re-fetch with attachments. The payload comes from `mise run board-payloads <key>` \
on a host with a transcript, or from the capture store on any host (CLOUD-990): \
`batten capture list`, then `batten capture show <handle> --grep '"id":"<key>"'` \
to find it, then `batten capture show <handle> --raw | mise run graph-check`. A \
CCR container writes no transcript, so there the capture store is the only route — \
and it hands over bytes the tracker returned, so it is as valid as a recovered \
payload. Do not re-type a payload by hand. Measured 2026-08-13: a bulk sweep moved \
fifteen rows to In Review, CLOUD-480 among them with nothing of it landed, and it \
sat wrong for 4.5 hours — `graph-check` refused it in one invocation the moment it \
was finally asked (CLOUD-512). Every other column is a different question with a \
different owner and is not gated here."""

# CLOUD-375's slot, filled (CLOUD-1100). THE FOURTH ARM OVER ONE TOOL, and the
# one the row above's own comment reserves by name: "In Progress is
# `claim-check`'s question, the drain into In Review is CLOUD-469's, Todo
# promotion is CLOUD-375's — three other owners, and this row must not answer for
# them." This is that owner.
#
# Todo is the READY QUEUE, so promoting a row into it is a claim that its Ready
# block satisfies the refinement gate. Nothing checked that at the moment of the
# claim: `graph-check`'s `todo-not-ready` catches it later, over a payload
# somebody remembered to pipe, and `filed-here-check` prices only a row this
# branch CREATED. A bulk promotion put two unready rows in the queue and neither
# gate saw it until a sweep.
#
# THE VERDICT IS ALREADY IN HAND, WHICH IS WHY THIS COSTS NOTHING. The row above
# already forces a `get_issue` within 300 seconds of any write, `[[mint]]
# issue-read` already mints a receipt from that read's RESULT with no agent
# action, and since CLOUD-1100 that receipt's sixth field carries the compiled
# Ready authority's verdict over the body the TRACKER RETURNED. So this row asks
# a question that was answered, for free, on a read the agent was making anyway
# — no extra call, no payload piped anywhere, and nothing re-typed. That last
# part is the whole point: `batten.toml` already records that `ready-lint` "was
# run three times against text in a local file — once under an id no row carried
# — green every time. A toll payable in text nobody filed is not a toll."
#
# IT SITS BEFORE THE ROW BELOW DELIBERATELY, for the reason the In Review row
# sits where it does. A promotion is also an edit, so both rows select it and the
# engine reports the first; the MORE SPECIFIC remedy belongs first. "Groom the
# row until it lints ready" is actionable about the move being attempted, where
# "re-read the row" is true, generic, and sends the reader to do a read, retry,
# and only then learn what the call actually owed.
#
# `requires_field` IS THE COLUMN THIS ROW NEEDED AND THE FILE DID NOT HAVE. Every
# other receipt column is a statement about the READ — does one exist, how old is
# it — and `checks = ["issue-read"]` alone would be satisfied by a read that found
# the row unready, which is the promotion this exists to refuse. It is
# three-valued and it fails OPEN: `ready` satisfies, `unready` denies, and an
# ABSENT sixth field — a receipt minted by the hand-run `mise run
# issue-read-check`, or one whose authority could not judge and wrote `-` —
# satisfies, because a verdict about the environment must not be spoken as a
# verdict about the row. That direction is also what let the column be declared
# over a receipt family already on disk without invalidating one receipt.
#
# `max_age = 300` matches the row below's, and for its reason rather than by
# copying: `save_issue` takes no if-match precondition, so nothing can make the
# write conditional, and this bounds how old the verdict is rather than proving
# the row is unchanged.
#
# `key_shape` IS THE UUID CARVE-OUT AND IT ALLOWS, exactly as the row below's
# does: the `id` parameter accepts a UUID as well as an issue key, resolving one
# to the other needs a tracker credential no hook has, and denying on a spelling
# the agent is entitled to use is the false-positive rate that gets a guard
# bypassed rather than satisfied.
[[rule]]
id = "a-todo-promotion-owes-a-ready-verdict"
kind = "receipt"
scope = "mediated_call"
severity = "deny"
tool = "save_issue"
when_present = "input-state"
when_value = "Todo"
checks = ["issue-read"]
key = "named"
key_from = "input-id"
key_shape = "^[A-Z][A-Z0-9]*-[0-9]+$"
max_age = 300
requires_field = { at = 6, is = "ready" }
reason = """
Todo is the ready queue, so this move claims the row's Ready block satisfies the \
refinement gate — and the last read of it says otherwise. Groom the row, then \
re-read it: `batten ready lint --issue <key>` prints exactly what fails, pointer \
by pointer, off the payload already in the capture store and with no board call \
at all. Fix those clauses with `save_issue`, then `get_issue <key>` with \
`includeRelations: true` — the receipt re-mints itself from that result, \
carrying the new verdict, and there is no second call and no payload to pipe \
anywhere. Reading the row again WITHOUT changing it does not help and is not \
meant to: the verdict comes from the body the tracker stored, so only a groom \
moves it. If the block genuinely has open questions, the honest move is Backlog \
rather than the queue — the Definition of Ready is explicit that a row with open \
questions leaves the queue rather than acquiring a block that papers over them. \
Every other column is a different question with a different owner and is not \
gated here."""

# CLOUD-312 row 2: `issue-read-guard` retires here. THE COMPLEMENT OF THE ROW
# ABOVE, not a duplicate of it — same tool, opposite arm. That row says outright
# that "updating an existing issue is never gated", which was true and is the hole
# this closes: `when_present` where that one has `when_absent`.
#
# `key = "named"` is the whole reason `ReceiptKey::Named` exists, and its own doc
# quotes the retiring script for why the branch will not do: a branch legitimately
# updates several issues, so a branch key would let a fresh read of one issue
# authorise a stale write to another. The subject is one row of somebody's board,
# not one checkout.
#
# `key_shape` IS THE UUID CARVE-OUT, AND IT ALLOWS RATHER THAN DENIES. The `id`
# parameter accepts a UUID as well as an issue key, the receipt namespace is keyed
# by KEY, and resolving one to the other needs a tracker credential no hook has. So
# a value this expression does not match resolves to could-not-look and the call is
# ALLOWED — the retiring script's own posture (`case "$key" in [A-Z]*-[0-9]*)`,
# everything else `exit 0`). Denying there would refuse a legitimate update over a
# spelling the agent is entitled to use, which is the false-positive rate that gets
# a guard bypassed and then enforces nothing. The expression is the consumer's
# because a tracker's identifier shape is a consumer fact (non-negotiable rule 1).
#
# `max_age = 300` matches the script's `BATTEN_ISSUE_READ_MAX_AGE:-300`. It is a
# RECENCY BOUND, not a freshness proof, and that is the design rather than a
# caveat: `save_issue` takes no if-match precondition, so nothing can make the
# write conditional. Existence alone was the gate that let CLOUD-504 through.
#
# The receipt is minted by `mise run issue-read-check`, whose write side this row
# does not touch — the engine reads the file that task already writes.
[[rule]]
id = "an-update-owes-a-recent-read"
kind = "receipt"
scope = "mediated_call"
severity = "deny"
tool = "save_issue"
when_present = "input-id"
checks = ["issue-read"]
key = "named"
key_from = "input-id"
key_shape = "^[A-Z][A-Z0-9]*-[0-9]+$"
max_age = 300
reason = """
Re-read the row. That is the whole remedy: `get_issue <key>` with \
`includeRelations: true`, and the receipt mints itself from that result — there \
is no second call and no payload to pipe anywhere. Then make the write from what \
you just read, not from the plan you built earlier: if the row changed, that is \
the point, so decide again. This bounds how old the read was; it cannot prove the \
row is unchanged, because the tracker offers no precondition on write. Measured \
2026-08-13: a session read a row, planned against it for ~51 minutes, and wrote a \
Ready block moving it into the ready queue — another session had marked it a \
duplicate in between, and the write landed anyway (CLOUD-508). Creating an issue \
is never gated by this row (that is `filing-needs-a-search`)."""

# CLOUD-312 row 4: `connector-verb-guard` retires here. THREE ROWS, one per verb,
# and every one is an existing AGENTS.md rule rather than a new one this config
# invents: "No heartbeats (`send_later`/Routines/timers) to babysit a PR … the ban
# is on timers."
#
# WHY A PERMISSION RULE CANNOT DO THIS (CLOUD-178). A `.claude/settings.json` rule
# must name its server as a LITERAL, and a claude.ai connector's exposed name is
# chosen per registration episode by the HOST: readable at session start, a UUID
# after a reconnect. The literal that would match the second is an account-specific
# identifier, which non-negotiable rule 1 keeps out of committed config. Measured
# 2026-08-19: the committed file allowed two connectors by name while the host
# exposed both under UUIDs, so two calls answered "requires approval" from inside
# an allow list that reads as covering them.
#
# A DENY THAT UNDER-MATCHES IS THE WORSE DIRECTION, which is why these are rows and
# not left to the permission file: an allow that under-matches fails into a prompt
# a human sees, where a deny that under-matches reads as a prohibition and enforces
# NOTHING.
#
# THE SUBSTRING HAZARD IS STRUCTURAL HERE, NOT DEFENDED. `unsubscribe_pr_activity`
# ends with `subscribe_pr_activity`, and the guard needed a hand-rolled left bound
# on `__` to keep an unbounded suffix test from denying a verb it has no verdict on.
# `Rule::selects_tool` matches the whole name or the whole final `__`-delimited
# segment, so `strip_suffix` leaves `un`, which does not end in `__`, and the row
# cannot reach the wrong verb at all. The bare-name arm the guard carried for a host
# exposing a verb with no prefix is that function's `raw_tool == selector` branch.
#
# THE ALLOW ARM IS NOT PORTED, AND ITS ABSENCE IS THE FINDING (CLOUD-790). The guard
# once pre-approved `unsubscribe_pr_activity`, on sound reasoning that did not work:
# a claude.ai connector's per-tool control set to `ask` prompts in every permission
# mode, and a `PreToolUse` hook returning `allow` does not skip that prompt. So the
# arm asserted an authority it did not hold while a human paid one approval click per
# landing. What replaced it is an actor rather than a louder claim — `pr-unsubscribed
# drop` makes the call from a task, where no permission control applies.
[[rule]]
id = "no-pr-activity-subscription"
kind = "shape"
scope = "mediated_call"
severity = "deny"
tool = "subscribe_pr_activity"
reason = """
No heartbeats to babysit a PR (AGENTS.md). Landing is driven by `mise run land`, \
which laps fetch -> rebase -> verify -> push -> ci-wait -> fast-forward by itself \
and stops for three things only: a rebase conflict, a failed `verify`, or red CI. \
A webhook's silence is not success. Fetching CI on demand is fine; the ban is on \
the timer."""

[[rule]]
id = "no-scheduled-self-wakeup"
kind = "shape"
scope = "mediated_call"
severity = "deny"
tool = "send_later"
reason = """
No heartbeats (`send_later`/Routines/timers) to babysit a PR (AGENTS.md). A \
backgrounded task re-invokes this session when it exits, so the turn in between is \
the designed state rather than one to fill — measured 490 self-wakeups in one \
session against 2 that changed a decision (CLOUD-821). Background the long command \
and act on its exit."""

[[rule]]
id = "no-scheduled-trigger"
kind = "shape"
scope = "mediated_call"
severity = "deny"
tool = "create_trigger"
reason = """
No Routines or timers to babysit a PR (AGENTS.md). `mise run land` drives the whole \
landing loop with no timeout and no cap, and a Routine firing beside it is a second \
clock nothing reads. Background the task and act on its exit."""

# CLOUD-312 row 6: `fanout-guard` retires here. TWO ROWS OVER ONE SELECTOR,
# because `max` is single-valued and the guard's two conjuncts cap different
# SUBJECTS of the same bytes — how many artifacts the prompt names, and how big the
# prompt is. A single row would have had to pick one.
#
# WHY THE `Task` CALL IS GATED AT ALL (CLOUD-287). It was the only unmediated call
# in the wiring: `.claude/settings.json` mediated Bash, the edit tools, the board
# verbs and three connector verbs, and no matcher named `Task` — so the one call
# that commits a whole fresh context window to a fresh agent passed through
# nothing, while the workflow contract had just been taught to price a spawn
# "above all" with no mechanism behind it (non-negotiable rule 2).
#
# MEASURED: eight sibling agents launched with prompts each naming the same eight
# artifacts as required reading. The fixed per-agent cost was paid eight times
# before any agent wrote a line, and the one that finished anything spent 63,848
# tokens to fetch one issue and run one lint.
#
# WIDTH IS THE MULTIPLIER AND THE MANIFEST IS THE MULTIPLICAND — three agents
# reading twenty artifacts each costs more than twenty agents reading one. It is
# also the only term a hook can see: `PreToolUse` fires once per call and carries
# the prompt, where counting siblings would mean inventing per-session state, which
# `stop-guard` declined for the same reason.
#
# THE BLINDNESS, STATED RATHER THAN IMPLIED: this sees what a prompt INSTRUCTS,
# never what the agent then reads on its own initiative. A spawn told to read one
# file that goes on to read forty passes here and always will. Capping what is
# written into the prompt is not a claim about what the agent does with it.
[[rule]]
id = "a-spawn-names-few-artifacts"
kind = "shape"
scope = "mediated_call"
severity = "deny"
tool = "Task"
measures = "prompt"
counts = "tracked_artifacts"
max = 3
# The `mem:` half of the manifest, and it is the consumer's because a shorthand a
# repository writes in its own prompts to name its own files is a property of that
# repository (non-negotiable rule 1). The charset is `memories-check`'s.
resolves = [{ reference = "mem:([A-Za-z0-9_/-]+)", path = ".serena/memories/$1.md" }]
reason = """
The fixed cost of reading these is paid once PER AGENT, before any of them writes \
a line — the manifest is the multiplicand and it dominates the fleet width. \
Measured (CLOUD-287): eight siblings each naming the same eight artifacts, and the \
one that finished anything spent 63,848 tokens to fetch one issue and run one \
lint. Cheaper shapes: compute one digest ONCE and pass that, or name only the \
artifacts this agent must read to do its own step. A path this repository does not \
track counts for nothing here, so a URL or a branch name is already free — the \
count is what the spawn can actually be made to read."""

# The second conjunct. `tokens` is `budget.rs`'s own estimator rather than a rival
# one (CLOUD-925 §1): one authority for what a ceiling is, so a per-call cap does
# not arrive with its own arithmetic.
[[rule]]
id = "a-spawn-prompt-stays-in-budget"
kind = "shape"
scope = "mediated_call"
severity = "deny"
tool = "Task"
measures = "prompt"
counts = "tokens"
max = 1500
reason = """
Every token here is spent before the agent begins, and again for each sibling. Put \
the standing context where it is read once — a memory, a rule file, the \
always-loaded surface — and let the prompt name the step it is for."""

# `run-shape-guard`'s three verdict shapes, as config (CLOUD-443).
#
# Every shape below FAILS GREEN — exit 0 with plausible output — which is why
# noticing them repeatedly did not stop them. The measured record: two confident
# "green" reports over a failed `verify`, a `git push` that had returned `stale
# info` at exit 1 re-run alone and reported as compliance, and a `cargo clippy`
# whose ANSI-coloured output no `^error` anchor could ever match.
#
# WHY THIS IS ITS OWN KIND rather than a `shape` row. A shape row matches a
# program and its adjacent words; these three are about the STRUCTURE the command
# sits in — what its status is handed to, what replaces it, whether it was
# detached. The engine's parser used to split on exactly those operators and throw
# them away, so no amount of word matching could see them.
#
# `&&` IS NOT DENIED, deliberately. It short-circuits, so a failure still
# propagates and there is no false green to stop; denying it would be a pure false
# positive, and a guard with false positives gets bypassed.
#
# The two tables are the consumer's, and they hang off the rule rather than the
# config root because they are what this rule is DEFINED OVER — a global table
# would be a second authority with no other reader.
# A shell program says so in its name (CLOUD-864/CLOUD-865). Measured on this
# tree at v0.0.106: 143 tracked files begin with a shell shebang and end in
# neither `.sh` nor `.bash`, 136 of them under `mise-tasks/`. The rev is part of
# the measurement rather than decoration — an undated count reads as a claim
# about the tree in front of you, and the `mise-tasks/` half of this one moves
# every week (CLOUD-929). What that half is today is `bash-surface-not-growing`'s
# to answer, not this comment's.
#
# THE COST IS PAID PER TOOL, WHICH IS WHY IT IS A RULE AND NOT A PREFERENCE. hk's
# shellcheck reaches them, because its builtin selector does shebang detection —
# `hk check --all --step shellcheck -v` batches 146 files. A syntax matcher
# pointed at the directory scans nothing and exits `0` — CLOUD-310 measured that
# against this tree and owns the per-component disposition. Serena's bash LSP
# matches none of them either: `FilenameMatcher(".sh", ".bash")` is
# extension-only, and `add_extensions` is wired for two other languages alone.
# Two of three silently blind,
# independently — and hk.pkl documents the dependency as a JUSTIFICATION for the
# naming rather than as the risk it is.
#
# A PRESET RATHER THAN A LOCAL MODULE because nothing in the predicate is this
# repository's: any tree with extensionless shell pays the same toll with every
# instrument it adopts. The consumer's contribution is the glob and the excludes.
#
# `line_sources` rather than `lines`: the rule decides over every program under
# those roots, and a row naming them one by one is a list that goes stale the
# next time somebody adds a task — silently, green, which is the failure the
# declaration bound exists to prevent. The count itself is deliberately not
# restated here: `bash-surface-not-growing` is the row that carries it, and a
# number in prose beside it is exactly the drift that row exists to end
# (CLOUD-929 — this sentence used to say "137 programs", which was wrong by
# eleven within two days of being written).
[[rule]]
id = "shell-hygiene"
kind = "policy"
scope = "tree"
preset = "shell-hygiene"
severity = "deny"
#
# THE DECLARATION IS THE EXCLUSION, and nothing else is needed. Six of the 143
# extensionless shell files in this tree are FIXTURES — probes for this exact
# class, which a gate must still handle and which a rename would delete as test
# data. They sit under `tests/fixtures/` and `crates/**/fixtures/`, and no glob
# below selects them: `Selector` sets `literal_separator(true)`, so `*.sh` does
# not cross a `/` and neither of the two directory globs reaches a fixture tree.
# A row reads the paths it names and no others, which is the bound doing the work
# an exclusion list would otherwise do badly.
#
# `.bats` is deliberately absent: those carry `#!/usr/bin/env bats`, which is not
# a shell interpreter, so selecting 145 more files would buy 145 reads and zero
# findings. Whether shellcheck should read them is CLOUD-382's question, not this
# row's.
line_sources = ["mise-tasks/**", ".claude/hooks/**", "*.sh"]
#
# ONE ROW, TWO RULES, and the finding says which — `attribute()` reads the
# violation's own `rule` and falls back to this id only when a module raises none.
# The pair is not a bundle of convenience: the second rule is the FIRST one's
# aftermath. Renaming 138 programs broke 16 constructed sibling paths that no
# textual pass could see, every one of them guarded by `[ -x "$p" ]` and an
# `exit 0`, so six gates in the Stop hook ran over nothing and still reported
# clean. They were recovered by executing suites one failure at a time. A
# consumer adopting the extension rule inherits exactly that hazard, so it must
# inherit the gate for it in the same preset.
reason = """
Two properties of a shell program's NAME. It says its language — `.sh` or \
`.bash` — because a shebang is a content selector only tools that read the \
first line honour, and one that does not covers the file silently and exits 0. \
And a sibling it builds at run time (`"$(dirname -- "${BASH_SOURCE[0]}")/x"`) \
names a file the tree carries, because every caller of that shape guards it and \
exits 0, so a stale reference goes quiet rather than failing."""

# The substitution family of the same kind (CLOUD-864). Measured over one
# session's transcript: 34 of 38 Bash calls had a first-class tool that does the
# job, and `Read`/`Grep`/`Glob` were used ZERO times — 15 `head -N`, 13 `grep`,
# 12 `ls`, 5 `cat`, 5 `sed -n`, 2 `find -name`.
#
# THE ROW IS ON THIS KIND BECAUSE OF WHAT DISTINGUISHES THE TWO CASES, and there
# is no other kind that can hold it. `grep pat crates/` answers a question `Grep`
# answers better; `git ls-files | grep crates/batten` is a filter over another
# command's output that no tool replaces. Same program, same operand, opposite
# verdicts — only the POSITION separates them. A `shape` row cannot see it:
# `matching_shape_rows` iterates every segment with no index in scope, so it
# would refuse the filter too. This kind is already defined over what surrounds a
# command, which is exactly the fact in question.
#
# The list is the consumer's, like `filters` above. Another repository's `awk` may
# have no better answer available; here every one of these has one.
#
# WHAT IT DELIBERATELY DOES NOT CATCH, so nobody reads silence as coverage: a
# path reached through a shell variable (`grep "$p" "$d"` names no path the
# parser can see, and guessing would refuse work over an unnameable target); the
# native `Grep`/`Read` tools, which arrive as structured input rather than a
# command line; and anything outside the repository, which keeps the
# `>/tmp/x.log` form the row above MANDATES allowed.
[[rule]]
id = "no-tool-substitution"
kind = "pipeline"
scope = "mediated_call"
severity = "deny"
#
# `sed:-n` is QUALIFIED and the rest are not, on a distinction the corpus makes
# and a bare name cannot. `sed -n '1,40p' f` prints a range — `Read(offset,
# limit)`, and the single most-measured shape here. `sed 's/a/b/' f` transforms
# the stream, which no first-class tool does, so refusing it would tell the
# caller "a tool answers this directly" when none does. The other eight read a
# file or list paths in every mode they have, so they need no qualifier.
#
# `wc` stays unqualified deliberately: `wc -l f` has no range-read equivalent,
# but a count over a pattern answers the question that reaches for it, and the
# reason text names that capability.
substitutes = ["cat", "head", "tail", "sed:-n", "grep", "rg", "find", "ls", "wc"]
#
# THE REASON NAMES CAPABILITIES, NEVER PRODUCTS (CLOUD-998). It used to name
# `Read(offset, limit)`, `Grep`, `Glob` and Serena's symbol tools as literals.
# That is wrong wherever a session does not carry them — the structured surface
# is not guaranteed present, and a remedy naming an absent tool is unactionable
# in exactly the session that most needs one. The four questions below are what
# is invariant; which instrument answers them is whatever the session has.
reason = """
Reach for the structured surface this session offers rather than a text utility \
over a path this repository tracks: a range of one file's contents, a pattern \
across the tree, paths by glob, or what a NAME resolves to. \
`.claude/rules/scanning.md` picks between those question classes. Downstream of \
a pipe these same utilities are filters over another command's output and are \
not refused."""

[[rule]]
id = "verdict-not-discarded"
kind = "pipeline"
scope = "mediated_call"
severity = "deny"
# Pagers and filters alike: each substitutes output for status. `jq` is
# deliberately absent — it is composition rather than a verdict substitute, and
# widening to every pipe would deny ordinary work.
filters = [
  "tail",
  "head",
  "less",
  "more",
  "grep",
  "rg",
  "egrep",
  "fgrep",
  "awk",
  "sed",
  "wc",
]
reason = """
The compliant form is the command alone in the call, redirected to a file:

  mise run <task> >/tmp/<task>.log 2>&1

The tool result IS the verdict — read the log in a SEPARATE call. Pass \
run_in_background on the tool call itself for anything that can exceed ~2 \
minutes. A pager over a FILE is fine; a pager over a live task is not."""

# A task runner: `run` names a task and its exit status is that task's verdict.
# `mise exec`/`mise x` are not here — they run another program, and the engine's
# wrapper lookthrough judges the wrapped one instead.
[[rule.verdict]]
program = "mise"
subcommands = ["run"]

# The mutating VCS verbs. The read-only ones (`log`, `show`, `diff`, `status`)
# carry no verdict and compose freely, which is why this is an allow-list.
[[rule.verdict]]
program = "git"
subcommands = ["push", "fetch", "rebase"]

# A build tool has far more verdict subcommands than query ones, so this is the
# inverse reading: everything except the queries. A bare `cargo` names no action
# and is therefore not a verdict either.
[[rule.verdict]]
program = "cargo"
except = [
  "metadata",
  "tree",
  "locate-project",
  "pkgid",
  "search",
  "login",
  "logout",
  "version",
]

# The forge CLI dispatches twice, so the verdict is in the second word: `gh pr
# view` is a query, `gh pr merge` is not.
[[rule.verdict]]
program = "gh"
subcommands = ["pr"]
nested = [
  "create",
  "ready",
  "ready-for-review",
  "merge",
  "edit",
  "close",
  "reopen",
  "comment",
]

# A test runner (CLOUD-473). The argument is what makes the run a verdict: bare
# `bats`, `bats --version` and `bats --help` print usage and answer nothing.
# Added after this issue was written, and omitting it would retire a predicate:
# one suite was guarded through `mise run test:bats` and open through both
# `mise exec -- bats …` and a path-invoked runner, and a run piped to `tail`
# reported green over three failures, one of them a hang.
[[rule.verdict]]
program = "bats"
any_argument = true

# A conflict marker reaching a source file means a botched merge landed — and
# this row DELEGATES that check rather than re-implementing it (CLOUD-229).
#
# It used to be `kind = "forbid"`, `pattern = "<<<<<<< "`, which is a strictly
# worse copy of a checker hk already ships and this repo already runs. Measured
# against the pinned hk: a marker at the start of a line fails both, while the
# same seven characters inside a string literal fail only the substring match.
# That false positive is why `crates/batten/tests/cli.rs` had to assemble the
# marker at runtime — the test file would otherwise trip the gate it is testing.
# A workaround that exists to dodge your own rule is the rule telling you it is
# wrong, and AGENTS.md's scope reminder says the same thing in advance: adopt
# prior art, do not rebuild it.
#
# What the delegation states is the division of labour the config should have
# been stating all along. Batten owns **which paths are asked about, and what a
# non-zero exit means downstream** — the severity, the waiver surface, the
# receipt, the ready gate. The tool that already owns the check keeps owning it.
# Conflict markers are the right vehicle for showing that precisely because the
# check is trivial and owned elsewhere; a rule worth writing here is one no
# existing tool answers.
#
# The predicate is the EXIT CODE ALONE (CLOUD-93). hk's stdout is discarded, so
# what a finding reports is this rule's own pointer — the glob it selected, with
# no line number, since a command condemns a batch rather than a span.
#
# `{{files}}` expands in place to the matched paths, batched under the argv
# bound. THE GLOB IS A GATE BEFORE IT IS AN ARGV SOURCE: no match means no
# process is spawned at all, which is what keeps a delegating rule cheap on the
# commits it does not concern.
#
# WHY `crates/**` AND NOT `**`: the widening is deliberate and so is its bound.
# `crates/**/*.rs` was narrow because a substring grep over Rust mostly overlaps
# with what the compiler already catches — a justification that stops holding the
# moment the rule is neither a substring match nor Rust-only. `crates/**` reaches
# the files a botched merge corrupts and no compiler reads: the manifest, the
# changelog, and every fixture under tests/, including the `.toml.in` configs and
# the expected-stdout files whose bytes are the assertions. Going all the way to
# `**` is what the engine cannot honestly do yet: the walk skips only `.git`, so
# it has no gitignore, and a rule's `glob` is one pattern with no exclude form.
# Counted in this checkout, `**` selects 15326 files, 14665 of them build output
# under target/ — a delegate invoked over the compiler's own scratch space.
# Closing that is CLOUD-214 (`ignore` + `globset` behind the walk), not a wider
# glob here.
#
# `severity` (what a match does: "deny" fails the run, "warn" reports without
# failing, "allow" switches the rule off) is required on every rule — the
# default is stated here, never assumed. `scope` (where the rule looks) is a
# separate key with its own vocabulary; "tree" is the whole working tree.
# A credential in the tree (CLOUD-59). The kind runs the pinned scanner above and
# turns each match into a pointer; the engine never holds a matched byte where it
# could reach output, so this row cannot leak what it finds.
#
# `glob = "**"` because a secret can be in any file, and narrowing it would be
# choosing which files are allowed to carry one. The tree walk already excludes
# gitignored paths, so `target/` costs nothing.
#
# `enforce`, never `check`: the kind spawns, so the read-effect verb refuses the
# whole ruleset naming `batten enforce`. `mise run batten-check` already calls
# `enforce` for the same reason `no-conflict-markers` made it necessary.
[[rule]]
id = "no-secrets"
kind = "secrets"
glob = "**"
severity = "deny"
scope = "tree"
no_fix_reason = "rotate the credential and purge it from history; removing the line leaves it in every clone and every reflog, so no command can make this right"

[[rule]]
id = "no-conflict-markers"
kind = "command"
glob = "crates/**"
check = "hk util check-merge-conflict --assume-in-merge {{files}}"
severity = "deny"
scope = "tree"
no_fix_reason = "resolve the conflict by hand: choosing a side is a judgement no command can make"

# Appeal-to-authority attribution, retired from `mise-tasks/attribution-check`
# into the engine (CLOUD-881). The rule lives in
# mem:prior-art-and-issue-hygiene: once a practice is adopted it is ours, and a
# comment states the rule and the evidence rather than naming a third party.
# "As <project> does" is unevaluable by a reader and survives neither that
# project changing its mind nor being wrong.
#
# THE BASH THIS REPLACES WAS 93 LINES AND ITS SUITE 212, and the reason it is
# gone is DoR §2 rather than tidiness: extending it for a cargo manifest took
# four review rounds of regex narrowing and still could not answer the question
# (CLOUD-873, canceled). A `forbid` row expresses the prose half exactly, and
# the manifest half is the `policy` row below, which reads a parsed document.
#
# `glob = "**"` is the whole tree, which the task reached with `git ls-files`.
# Its three `:!:` path exclusions are GONE rather than translated, and each for
# a measured reason: `.serena/memories/prior-art-and-issue-hygiene.md` has zero
# uncoordinated hits (every mention in it carries a coordinate), and the other
# two were the task and its suite, which this change deletes.
#
# The lockfile arm went the same way. `^[^:]*\.lock:` matched grep's `path:line:`
# PREFIX, which a `forbid` row has no analogue for — `exclude` sees the line, not
# the path. Measured before dropping it: `Cargo.lock`, `fuzz/Cargo.lock` and
# `mise.lock` carry zero uncoordinated hits, so the arm exempted nothing.
#
# POINTER-ONLY IMPROVES HERE. The task printed grep's whole `path:line:content`
# hit, carrying the offending line into the finding; a `forbid` finding is
# `path:line` and a rule id (non-negotiable rule 4).
[[rule]]
id = "no-appeal-to-authority"
kind = "forbid"
glob = "**"
regex = "jdx|semgrep|opengrep|ast-grep"
exclude = "https?://|package://|aqua:|ubi:|npm:|pipx:|github\\.com|\\.dev|submodule|amends|uses:|@[0-9a-f]{40}|^(regex|exclude) = "
severity = "deny"
scope = "tree"
no_fix_reason = "state the rule and the evidence in this repo's terms; naming who else does it is not evaluable by a reader (mem:prior-art-and-issue-hygiene)"

# Non-negotiable rule 1 as a standing gate, not prose (CLOUD-7). "The core stays
# repo-agnostic … a grep for a specific consumer's names must return zero hits"
# was discharged once, by hand, when the crate landed (CLOUD-26) — which leaves a
# standing property carried as a comment, half a change by non-negotiable rule 2.
# These two rows re-run that grep on every gate invocation.
#
# WHY THE GLOB IS `crates/**` AND NOT `crates/**/*.rs`: rule 1 says *anywhere* in
# crates/batten. `git ls-files crates/ | grep -v '\.rs$'` names the tracked files
# a `*.rs` glob would skip — the crate manifest, the changelog, and every fixture
# under tests/. `**` spans path segments (pinned by `glob_double_star_spans_
# segments` in crates/batten/src/rules.rs), and the match is anchored at the
# first segment, so `crates/**` selects all of crates/ and nothing outside it.
#
# WHICH OF THE FOUR LITERALS CLOUD-26's ACCEPTANCE LISTED ARE ROWS, and why —
# the boundary CLOUD-73 exists to record. Membership turns on one question: does
# the literal name a CONSUMER, or is it a word this repo uses in its own right?
#
# That question used to be pre-empted by a capability limit, and the limit is
# gone. This comment said `forbid` was a case-sensitive literal substring check,
# so a literal with an English reading was "wrong in both directions at once" —
# firing on ordinary prose while missing the capitalised form — and dropped two
# of the four on that ground. CLOUD-283 gave `forbid` a `regex` alternative to
# `pattern` (plus an `exclude` column), so both directions are now expressible
# and the two exclusions are re-decided on the merits:
#
#   etaxbc      IN — an account identifier, no English reading.
#   entities/   IN — an entity path, no English reading.
#   complian…   IN, since CLOUD-73 — the predecessor consumer's repo name, which
#               is squarely what rule 1 forbids. `(?i)` catches the capitalised
#               form the old literal would have missed. It costs nothing to
#               adopt: zero lines under crates/ carry it, and this engine's
#               vocabulary is policy / gate / predicate / verdict, never this
#               word. The Apache boilerplate's "in compliance with the License"
#               is in LICENSE-APACHE, outside the glob.
#   button      OUT — a DECISION, not a gap, and the difference matters now that
#               a mechanism exists. It names the vendor rather than a consumer:
#               github.com/button-inc/batten is Batten's own home, so
#               src/store.rs's URL-canonicalization test and the changelog's
#               release links carry it legitimately. Its consumer-facing half —
#               a fixture quietly depending on THIS repository — is already
#               gated, by `no-origin-literal-in-fixtures` below.
#
# The domain modules CLOUD-73's other criterion names (entity grep, pdfium, CA
# privacy detectors, evidence and provenance semantics, the ICM design protocol)
# get no rows: none has ever been in this repository, which was scaffolded fresh
# rather than split out of the consumer's tree, so a row for `pdfium` or `icm`
# could never fire and configuration stays narrow (non-negotiable rule 6). The
# standing mechanism against one arriving is rule 1's grep over `crates/**` —
# these rows.
#
# The rule IDs deliberately do not embed the literals they ban. A finding prints
# `<path>:<line> <rule-id>`, so the id reaches the fixture test's expected-stdout
# string, which lives under crates/batten/tests/ — inside this glob. An id naming
# its own literal would make the gate fire on the test that proves it works.
#
# Naming the literals here is where they belong rather than a leak: rule 1 scopes
# its grep to crates/batten, this file sits outside the crate, and it already
# carries this repo's consumer-specific policy for exactly this reason (see the
# [epoch] comment below). House style §9 wants a rule a reviewer can read, so an
# obfuscated or hashed pattern would be the worse artifact even if the engine
# could match one. The glob excludes this file, so neither rule matches its own
# definition.
[[rule]]
id = "no-consumer-account-literal"
kind = "forbid"
glob = "crates/**"
pattern = "etaxbc"
severity = "deny"
scope = "tree"
no_fix_reason = "delete the literal; a consumer fact belongs in that consumer's own batten.toml, never in the core"

[[rule]]
id = "no-consumer-entity-path"
kind = "forbid"
glob = "crates/**"
pattern = "entities/"
severity = "deny"
scope = "tree"
no_fix_reason = "delete the literal; a consumer fact belongs in that consumer's own batten.toml, never in the core"

# `regex` rather than `pattern`, which is the whole reason this row can exist:
# the shape is the stem, so one expression covers every ending the name takes,
# and `(?i)` covers the capitalised form a literal would have to enumerate.
# THE CLASS THE OTHER THREE ROWS DO NOT COVER (CLOUD-1100), and it is here
# because rule 1 was violated in a way none of them could see.
#
# Measured: CLOUD-1121 ported the Ready-block grammar into `crates/batten/src/
# ready.rs` and carried eighteen of this repository's own tokens in with it —
# including the tracker key, as a `const`. It landed green, because the rows above
# ban four LITERALS (an account number, an entity path, a repo name, an org) and a
# tracker key is none of them. Rule 1 had a mechanism for four strings and none for
# the class, which is the "rules ship with their mechanism" gap in its own right.
#
# THE DISCRIMINATOR IS THE CHARACTER CLASS, and it is what makes this row
# affordable at all. A grammar constant is a REGEX — a key prefix followed by a
# digit class — where a provenance citation is a literal key, and the crate is full
# of the latter: every rationale comment in it cites the row it came from. Banning
# the prefix would fire on all of them; banning the prefix-plus-class fires on the
# vocabulary alone.
#
# IT NAMES THIS CONSUMER'S PREFIX, NOT A KEY SHAPE, and the first draft got that
# wrong in a way worth recording. `[A-Z]{2,}-\[0-9\]` reads as the more principled
# row and is the wrong claim: it fires on ANY key-shaped expression, including the
# deliberately NEUTRAL `TEAM-[0-9]+` the eleven sites below were rewritten to — so
# the generalisation refused the fix for the defect it was written to catch.
# Measured, on this row's own first run. Rule 1 is a statement about a specific
# consumer's names, which is why the three rows around it ban literals too, and
# why this file can carry them: it sits outside the glob.
#
# `regex` rather than `pattern` because the digit class has to be matched as a
# class rather than as the literal text of one.
#
# Measured on the tree at the moment this row landed: eleven sites, every one of
# them a fixture, a doc example or a test — and every one rewritten to a neutral
# prefix rather than exempted, because a crate fixture naming the gated
# repository's tracker is the same defect one layer down. That is what
# `no-origin-literal-in-fixtures` below already decided for the org literal.
#
# WHERE THE VOCABULARY GOES INSTEAD is `[[pattern]]`, which exists for exactly
# this and whose own module doc says so: a tracker key "is a *consumer*
# identifier … written here it is where consumer facts belong".
[[rule]]
id = "no-tracker-key-in-core"
kind = "forbid"
glob = "crates/**"
regex = 'CLOUD-\[0-9\]'
severity = "deny"
scope = "tree"
no_fix_reason = "declare it as a `[[pattern]]` row and read it by id; a tracker's vocabulary in the core is rule 1's violation, and moving it is the fix rather than rewording it"

[[rule]]
id = "no-consumer-repo-name"
kind = "forbid"
glob = "crates/**"
regex = "(?i)complian"
severity = "deny"
scope = "tree"

# The fixture corpus must stay repo-agnostic (CLOUD-63). The corpus exists so
# coverage stops implicitly depending on *this* repository, which a fixture
# naming this repository's origin would quietly undo.
#
# The org literal rather than `batten`: `min_batten_version` and `batten.toml`
# legitimately carry the crate name, while nothing a fixture needs names where
# this repository is hosted. It lands green — the literal occurs in the
# workspace manifest, the toolchain config, a release workflow and the
# generated changelog, but nowhere under crates/batten/tests/.
[[rule]]
id = "no-origin-literal-in-fixtures"
kind = "forbid"
glob = "crates/batten/tests/**"
pattern = "button-inc"
severity = "deny"
scope = "tree"
no_fix_reason = "rewrite the fixture so it does not name where this repository is hosted"

# Never compile a third-party tool from source in this repository (CLOUD-86).
#
# A tool built here is a tool nobody attested: the build happens on whatever
# toolchain the runner had, produces a binary no checksum covers, and takes as
# long as the crate takes. Every tool this repo uses is pinned in `mise.toml` as
# a prebuilt artifact with a locked url and a per-platform checksum — that is the
# sanctioned path, and CLOUD-281 is the instance where the one tool NOT pinned
# that way was the one installed from an unverified download.
#
# TWO SHAPES, one per file that can express it, because a `forbid` pattern is a
# literal substring and the two files spell the same mistake differently:
#
#   mise.toml   a `cargo:` backend, which builds the crate on install. The
#               pattern carries the opening quote because TOML bare keys cannot
#               contain `:`, so a backend key is always quoted — and the quote is
#               what keeps the row off prose that merely says "cargo".
#   workflows   `cargo install`, the same thing spelled by hand in a step.
#
# NOT gated here, deliberately: whether a *prebuilt* artifact is attested. That is
# the `[[provision]]` manifest's question (CLOUD-90), and a row here that fired on
# `ubi:` or on an install-action step would be answering a different one. This
# rule is about compiling, and `mise.toml`'s `github:` vs `ubi:` distinction is
# CLOUD-281's.
#
# The exemption path is a `[[waiver]]` carrying a reason and an expiry
# (CLOUD-208), never `severity = "allow"`: switching the rule off records nothing
# and lapses never, which is the undesigned hatch the waiver surface replaced.
[[rule]]
id = "no-source-built-tool"
kind = "forbid"
glob = "mise.toml"
pattern = "\"cargo:"
severity = "deny"
scope = "tree"
no_fix_reason = "pin an attested binary in mise.toml instead; what to pin is a supply-chain decision, not a rewrite"

[[rule]]
id = "no-cargo-install-in-ci"
kind = "forbid"
glob = ".github/workflows/*.yml"
pattern = "cargo install"
severity = "deny"
scope = "tree"
no_fix_reason = "pin the tool in mise.toml so CI installs exactly what the lockfile names"

# Portability: the shell layer must run on a machine that is not the CI runner
# (CLOUD-282).
#
# `mise run verify` is the authorization the whole workflow contract rests on —
# "verify exhaustively before CI", "the gates ARE your authorization". On macOS
# it could not pass, for reasons no branch caused: two gates used sed's
# NUL-separated mode (GNU only, BSD exits `illegal option -- z`), two used
# `mapfile` (bash 4; macOS ships 3.2), one used xargs' short
# `--no-run-if-empty`, and three fixture repos force-created a branch that git
# refuses to force while it is checked out. An agent there either stopped on a
# red `verify` it did not break, or landed on CI's word alone — the exact
# failure the contract exists to prevent. CI runs ubuntu, so CI is
# STRUCTURALLY BLIND to every one of these: the same "verdict is a property of
# the machine" shape as CLOUD-227.
#
# These are `forbid` rows and not a 50th `mise-tasks/*-check` program, per the
# 2026-08-07 engine-first amendment: `batten check` already runs in the shared hk
# gate with no glob, so the whole construct set is config a reviewer can read
# (§9) rather than a second copy inside a shell script. That amendment exists
# because the older wording made a bash task the cheapest satisfying artifact,
# and CLOUD-202 is in flight moving the existing guards OUT of that layer.
#
# WHY THE GLOBS ARE `mise-tasks/**` AND `tests/**/*.bats`:
#
#   * two or more segments, so neither can match the root `batten.toml` and make
#     the rule fire on its own definition — the walk is `fs::read_dir` and skips
#     only `.git`.
#   * recursive, matching `no-bash4-wait-n` and `bats-tests-not-deleted` rather
#     than inventing a third depth convention. Both were narrowed to one segment
#     once, only to dodge the vendored `tests/bats` submodule the walker used to
#     descend into; since CLOUD-328 the walk stops at a nested repository, so
#     depth is free again and hk.pkl's `batten-check` glob spans it too. That
#     coupling is not cosmetic: `batten-glob-check` subsumes a required glob only
#     by verbatim match or a `P/**` prefix, so `tests/*.bats` would be uncovered
#     by hk's `tests/**/*.bats` and the step would stop running for exactly the
#     commits this rule judges.
#
# WHAT IS DELIBERATELY NOT HERE, and why it is a gap rather than an oversight:
# the `tests/**/*.bats` half of the sed and flock rows. `tests/target-ensure.bats`
# names the util-linux lock in a test title, and a `forbid` pattern is a literal
# substring with no `exclude` column, so that row cannot be written today without
# firing on the test that proves the guard works. That is exactly CLOUD-283. The
# `mise-tasks/**` half — the layer that actually could not run — lands now.
#
# The in-place spelling used to be blocked here too, by `tests/memory-guard.bats`
# carrying it five times as fixture strings. That suite retired with its guard
# (CLOUD-442) and the fixtures moved to `crates/**`, which these rows do not
# glob — so the sed half of this exclusion is now about `flock` alone.
#
# The rationale comments in the guarded files deliberately do NOT spell the
# literals they explain, for the same reason the agnosticism rules above do not
# embed theirs: a substring rule over a directory fires on its own explanation.
[[rule]]
id = "no-gnu-sed-z"
kind = "forbid"
glob = "mise-tasks/**"
pattern = "sed -zE"
severity = "deny"
scope = "tree"

# The trailing space is load-bearing: it is what distinguishes the GNU-only
# no-suffix spelling from `sed -i.bak`, which BSD accepts and which
# `tests/helpers.bash` uses.
[[rule]]
id = "no-gnu-sed-in-place"
kind = "forbid"
glob = "mise-tasks/**"
pattern = "sed -i "
severity = "deny"
scope = "tree"

[[rule]]
id = "no-bash4-mapfile"
kind = "forbid"
glob = "mise-tasks/**"
pattern = "mapfile "
severity = "deny"
scope = "tree"

[[rule]]
id = "no-gnu-xargs-r"
kind = "forbid"
glob = "mise-tasks/**"
pattern = "xargs -r"
severity = "deny"
scope = "tree"

# CLOUD-286 replaced flock(1) with a `mkdir` mutex and named this row as its own
# standing half: the refusal that fired before every other gate on a Mac was
# correct behaviour over a Linux-only primitive.
[[rule]]
id = "no-util-linux-flock"
kind = "forbid"
glob = "mise-tasks/**"
pattern = "flock "
severity = "deny"
scope = "tree"

# git refuses `branch -f` on the branch that is currently checked out. Three
# fixture setups did it anyway, and passed only because the runner's git still
# defaults to `master`, which made `main` a different branch — an accident of the
# runner's configuration, not a property of the test. It is a `setup()` failure,
# so every case in the suite errors, not one.
#
# The replacement is `git init -b <name>` plus a plain `git branch main`, NOT
# `branch -M main`: `-M` renames the current branch, and these fixtures want a
# SECOND branch marking the trunk while HEAD stays on the feature branch. That
# distinction is measured, not assumed — rewriting them to `-M` first made
# `tests/verified.bats`'s moved-main case fail, because it checks that other
# branch out.
[[rule]]
id = "no-branch-f-main"
kind = "forbid"
glob = "tests/**/*.bats"
pattern = "branch -f main"
severity = "deny"
scope = "tree"

# No tracked instruction prescribes the commit identity `identity_deny` refuses
# (CLOUD-605).
#
# A user-level stop hook outside this repository asks a session to reconfigure
# `user.email` to a vendor no-reply address and amend. `[attribution]`'s
# `identity_deny` already refuses the resulting COMMIT, and it has never failed
# to. What nothing gated is the instruction: a session that copies that remedy
# into a rules file, a task or a memory turns a one-session argument into a
# standing one, and the next reader finds the repository apparently telling them
# to do the thing the repository denies.
#
# THIS IS NOT A SECOND COPY OF `identity_deny`. That judges what a commit
# CARRIES, over commit metadata; this judges what a tracked file PRESCRIBES, over
# tree content. Different object, different pattern, one authority each — the
# prose that names the precedence still cites `identity_deny` and never restates
# its patterns.
#
# The glob is the instruction surfaces, and the bound is stated rather than
# implied: Markdown is where a remedy gets pasted, and it is also the only glob
# under which this row's own fixture can be written. A task or a workflow
# spelling the same prescription is NOT caught here — it is caught at the commit,
# by the gate this row exists to stop anyone arguing with.
[[rule]]
id = "no-denied-identity-prescribed"
kind = "forbid"
glob = "**/*.md"
pattern = "user.email noreply@anthropic.com"
severity = "deny"
scope = "tree"
no_fix_reason = "state the precedence instead of the command: `[attribution] identity_deny` is the authority, and a remedy that reproduces the denied identity cannot be corrected by rewording it"

# Which programs change the world, in the one §5 effect vocabulary, each with the
# sanctioned mutation to point at when it is refused.
#
# `>` and `>>` are not programs — a truncating redirect has no mutating program
# to classify, since in `cat x > p` the program is `cat`. The engine surfaces the
# operator as a pseudo-program (`hook::REDIRECT_VERBS`) so a consumer that wants
# truncation gated declares it here like any other verb. That token is a
# crate↔config contract: `verb = "redirect"` would get silence.
[[verb]]
verb = "rm"
effect = "destructive"
redirect = "restore it with `git checkout --`, or change it through the surface that owns it"

[[verb]]
verb = "mv"
effect = "destructive"
redirect = "copy instead of moving, or change the file in place"

[[verb]]
verb = ">"
effect = "destructive"
redirect = "append, or write through the surface that owns the file"

[[verb]]
verb = ">>"
effect = "write"
redirect = "write through the surface that owns the file"

# The write TOOLS, classified through the same table as the shell programs
# (CLOUD-312). A `Write` aimed at a protected path and an `echo x >` aimed at it
# are one predicate — {mutating verb} × {protected path} — so they are declared
# once, here, rather than as a second "which tools write" list the engine would
# have to keep in agreement with this one.
#
# Which of a host's tools are writers is the ADAPTER's fact and is not declared
# here (`hook::Harness::write_tools`); what a write MEANS for this repository is,
# and that is the redirect. Until these rows existed the whole
# `Write|Edit|MultiEdit|NotebookEdit` matcher was adjudicated by nothing: a write
# carries no command, and every path in `adjudicate` returned Allow for it.
#
# The redirect started as the one `memory-guard-check` rendered, kept verbatim so
# the refusal survived the move out of bash unchanged — which is what CLOUD-312's
# differential suite asserted. With that guard retired (CLOUD-442) this text is no
# longer a copy of anything: it is the authority, and
# `crates/batten/tests/mediated_verbs.rs` is what holds it to the corpus the guard
# used to prove. It is per-verb rather than per-path, exactly as `rm`'s is, so it
# names the general remedy and leaves the specific one to the path in the message.
# The write-shaped programs whose EVERY operand is a target, ported from
# `memory-guard-check`'s table (CLOUD-312). Its own comments were the authority
# for which those are: "every operand is a destination" for tee/sponge, and
# rm/shred/truncate grouped together.
#
# The five that could not be expressed then are declared below with CLOUD-442's
# qualifier columns, and the guard is deleted rather than left beside the engine
# as a second authority. Each column NARROWS — an absent one leaves a row meaning
# what it always meant — so the every-operand reading above is untouched and
# stays the default, because it is the one that fails toward refusing.
[[verb]]
verb = "tee"
effect = "write"
redirect = "write through the surface that owns the file — for a memory that is the Serena tool `write_memory`"

[[verb]]
verb = "sponge"
effect = "write"
redirect = "write through the surface that owns the file — for a memory that is the Serena tool `write_memory`"

[[verb]]
verb = "truncate"
effect = "destructive"
redirect = "change the file through the surface that owns it, rather than emptying it in place"

[[verb]]
verb = "shred"
effect = "destructive"
redirect = "restore it with `git checkout --`, or remove it through the surface that owns it"

# Destination-only: `operands = "last"`. The bash table's own words — "only the
# destination is a write; copying a memory OUT is a read" — are what the column
# now says, and the ALLOW is the load-bearing half: with the default every-operand
# reading, a row here would refuse `cp batten.toml /tmp/backup.toml`, and a guard
# that refuses reads is one people switch off.
#
# The stated limit, inherited from the guard this replaces rather than introduced:
# a target-directory flag (`-t <dir>`) puts the destination somewhere other than
# last, so the row does not see it. That under-denies, which is the sanctioned
# direction (house style §5).
[[verb]]
verb = "cp"
effect = "write"
operands = "last"
redirect = "write through the surface that owns the file — for a memory that is the Serena tool `write_memory`"

[[verb]]
verb = "install"
effect = "write"
operands = "last"
redirect = "write through the surface that owns the file — for a memory that is the Serena tool `write_memory`"

# Flag-qualified: the stream editor writes only in place. Every other invocation
# of it is a read, so a row without `requires_flag` would refuse every read-only
# stream edit in the repository — which is why this one waited for the column.
# The suffix form is the same switch carrying a backup suffix; the engine matches
# a declared flag's `.suffix` and `=value` forms for that reason.
[[verb]]
verb = "sed"
effect = "write"
requires_flag = ["-i", "--in-place"]
redirect = "change the file through the surface that owns it — for a memory that is the Serena tool `edit_memory`"

# Subcommand-qualified: two rows for one front-end, because they are two actions
# with two remedies. The effective program is the same word whether it mutates or
# reads, so a row keyed on the program alone would refuse `git log`.
#
# The rename is the shape worth the most, and the reason this pair is not
# cosmetic: `rename_memory` is the only thing that rewrites `mem:` referrers, so
# moving a memory with version control orphans every reference to it in one
# silent step. `memories-check` catches the damage at commit time; this catches
# it at the moment of action.
[[verb]]
verb = "git"
subcommand = "mv"
effect = "destructive"
redirect = "copy instead of moving, or change the file in place — for a memory that is the Serena tool `rename_memory`, which rewrites every `mem:` referrer a raw move orphans"

[[verb]]
verb = "git"
subcommand = "rm"
effect = "destructive"
redirect = "restore it with `git checkout --`, or remove it through the surface that owns it — for a memory that is the Serena tool `delete_memory`"

[[verb]]
verb = "Write"
effect = "write"
redirect = "change the file through the surface that owns it — for a memory that is the Serena tool `write_memory`, which enforces the size ceiling and the `mem:` reference rewrite a direct write skips"

[[verb]]
verb = "Edit"
effect = "write"
redirect = "change the file through the surface that owns it — for a memory that is the Serena tool `edit_memory`"

[[verb]]
verb = "MultiEdit"
effect = "write"
redirect = "change the file through the surface that owns it — for a memory that is the Serena tool `edit_memory`"

[[verb]]
verb = "NotebookEdit"
effect = "write"
redirect = "change the file through the surface that owns it"

# The governing config surface, hashed into `batten config epoch` (CLOUD-32).
#
# This list is consumer-specific ON PURPOSE, and it lives here rather than in
# crates/batten: which files govern a repository is that repository's business,
# and these four govern *this* one. The core ships only the default — batten.toml
# itself — so a grep of the engine for any consumer's identifiers returns
# nothing (non-negotiable rule 1). Batten is consumer #1 in practice: this is
# the worked example of the feature, in the config the feature reads.
#
# Every path must be readable. An unreadable one is exit 1 — this list is config,
# so a tracked path that cannot be read is unreadable config, which §7 routes to
# 1 and not to 3. It is never a silent skip: skipping would compute a stable
# epoch over a surface that changed, which is precisely the failure the value
# exists to prevent.
# What the always-loaded instruction set may cost (CLOUD-50).
#
# Every agent pays AGENTS.md on every turn whether or not a word of it applies,
# so its size is a per-turn tax rather than a style question. This table is the
# successor to `mise-tasks/context-budget.sh`, deleted in the same change — never
# two gates counting the same surface by different rules.
#
# `files` is consumer-specific by nature: which files are always loaded is a
# property of this repository, not of Batten (non-negotiable rule 1). It lists
# `AGENTS.md` alone. The shell task also globbed `.serena/memories/always/*.md`,
# a directory that has never existed — a dead entry contributing nothing while
# the rest counted, which is exactly the defect CLOUD-298 measured and which the
# engine now refuses outright (exit 1, per entry). Declaring a memory always-load
# means creating that directory AND adding the glob here in the same change: it
# then costs exactly what an AGENTS.md section costs, which is the point.
#
# Both thresholds carry forward the shell gate's bar unchanged. `max_lines = 199`
# is the documented 200-line CLAUDE.md target restated for a `<=` boundary — the
# shell gate failed AT 200, so 199 is the same bar, not a loosening. Raising
# either number is a visible diff in this file, pinned by a test in
# `crates/batten/tests/cli.rs`.
# How `batten exec` presents what it dispatched (CLOUD-429), on two axes adopted
# from tools this repo already pins: hk's `format` and mise's `style`. Both are
# set here rather than left implicit, because "the default" is a decision this
# repository is making about its own callers and a reader should not have to open
# the crate to learn what it was.
#
# `tee` is deliberately absent, which reads as `false`: the bytes are captured
# and addressable, so an agent asking for `mise run test` gets a record and a
# handle instead of a test log it did not budget for. `--tee` is how a human asks
# for the log, and it restores the old behaviour verbatim.
#
# `manage_process_group` is absent for the opposite reason (CLOUD-427): every
# `exec` in this repository runs UNDER `mise run`, so the marker is already set
# and Batten would decline regardless. Declaring `true` here would state an
# intent that never fires, which is worse than stating nothing.
# `jobs` and `continue_on_error` are mise's own names for a `:::` bundle's width
# and its failure policy (CLOUD-430). Both are stated at their conservative
# values rather than left implicit, for the reason above: a reader should not
# have to open the crate to learn that this repository runs a bundle one command
# at a time and stops at the first failure.
[exec]
format = "human"
style = "interleave"
jobs = 1
continue_on_error = false

[budget.instructions]
files = ["AGENTS.md"]
max_tokens = 3500
max_lines = 199

# The other half of what loads on every session, and the half `files` cannot
# reach: Serena's project file documents `initial_prompt` as content that "will
# always be given to the LLM upon activating the project (contrary to the
# memories, which are loaded on demand)". The cost is a string inside a document,
# not a document, so it is declared as an embedded entry rather than a glob
# (CLOUD-298).
#
# It is empty today, and that is the reason to gate it rather than fix it in
# passing: an empty value contributes nothing and prints no row, so this costs
# nothing now — and the first person to put text there pays for it against the
# same budget as an AGENTS.md section instead of getting it free past a green
# gate. A file the engine cannot parse is exit 1, never a silent zero.
[[budget.instructions.embedded]]
path = ".serena/project.yml"
key = "initial_prompt"

# The test suite is half of this repository's definition of green, and was the
# unguarded half (CLOUD-55). It cannot be a `protected` path — tests are edited
# every day, so a protected glob would block writing them — so the computable
# property is DIRECTION of change, the same shape `trust.rs` encodes for config.
#
# The token is consumer config, not an engine fact: `#[test]` is this
# repository's test marker, and another language's marker works with no engine
# change (non-negotiable rule 1).
#
# `base = "origin/main"`: the trunk this branch will land on, so the comparison
# is against what is already released rather than against this branch's own
# history. A legitimate reduction goes through a `[[waiver]]` with a reason and
# an expiry — never `severity = "allow"`, which switches the row off forever and
# tells nobody.
[[rule]]
id = "tests-not-deleted"
kind = "ratchet"
glob = "crates/**/*.rs"
pattern = "#[test]"
direction = "non_decreasing"
base = "origin/main"
severity = "deny"
scope = "tree"
no_fix_reason = "restore the tests, or waive the reduction deliberately; which of the two is the whole question"

# `tests/**/*.bats`, recursive — and the recursion is safe now rather than by
# this glob's care. `tests/bats` is a vendored submodule carrying 227 of its own
# `.bats` files, and the two sides of a ratchet used to disagree about
# submodules: `git ls-tree -r` at the base saw one gitlink while the
# working-tree walk saw every file inside it. Measured with this glob before the
# fix: base 637, working 1404 — a permanent +767 skew that no realistic deletion
# could pull back under, i.e. a gate that could not fail. The row was narrowed to
# `tests/*.bats` as a workaround; CLOUD-328 fixed the engine instead, so both
# halves now stop at a nested repository and select the same files. Widened back
# because the narrow glob was only correct while every bats suite sat directly in
# `tests/` — this one covers a nested one the day it is written.
[[rule]]
id = "bats-tests-not-deleted"
kind = "ratchet"
glob = "tests/**/*.bats"
pattern = "@test \""
direction = "non_decreasing"
base = "origin/main"
# CLOUD-807. Retirement is the steady-state behaviour of a repo folding its bash
# into its own engine (CLOUD-312), not an exception — so it belongs in the rule,
# not in a `[[waiver]]` that expires. The waiver this replaces was BLANKET: it
# carried only `rule` and `reason`, so every deletion of every `@test` under
# this glob passed, and a suite quietly gutted was indistinguishable from a
# retirement. Net effect of the swap is a STRONGER ratchet, not a weaker one.
#
# The subject is DECLARED, never inferred from the filename. Measured: 19 of the
# 142 suites have no same-named `mise-tasks/` program and every one is
# legitimate — `verify.bats` and `cross-check.bats` cover `mise.toml` tasks,
# `git-hook.bats` covers a hook body, and the rest are aspect suites over a
# subject the filename only hints at. A filename heuristic would block those
# retirements and admit real deletions elsewhere: `gh-guard.bats` drives
# `gh-guard-check` too, and retiring only half of that pair must not buy the
# suite's deletion.
retires_with = "# subject:"
severity = "deny"
scope = "tree"
no_fix_reason = "restore the tests, or waive the reduction deliberately; which of the two is the whole question"

# CLOUD-908. The column above conserves FILES: it asks whether the subject died
# and never whether the cases moved, so a migration can delete a 259-line suite
# and land green with nothing asserting what replaced it. Measured on the one
# retirement the campaign has completed — 22 named cases deleted, six of them
# with no successor anything in the tree could name, and one whose behaviour was
# deliberately inverted with nothing marking it.
#
# So every case inside a decrease owes exactly one arm, and the arms live in
# `crates/batten/tests/*.rs` — one block per retired suite, on its primary
# successor, which is what lets another session (or another account) read
# migration progress off the tree instead of off a chat transcript. A suite with
# no block is untouched; a block with unmapped cases is half-done.
#
# `declared_in` is this repo's Rust test tree because that is where the ledger
# for a retired bash suite belongs today: a migrated gate's evidence is a Rust
# test or a `policy test` case, and both are reachable from there. A wave that
# needs a ledger somewhere else widens this glob deliberately rather than
# scattering arms — the walk is bounded by declaration on purpose.
#
# CLOUD-1080 adds the fourth arm, and the reason is a measured dead end rather
# than a wish. The three above all name a SUCCESSOR, because they were written for
# a suite migrating into the engine. A WITHDRAWAL has none: `.claude/container-
# setup.sh` was added and removed inside one session, and six of its eight cases
# described the wrapper's own existence — which script to prefer, what to fetch,
# what to verify about the fetched bytes — so nothing replaced them because
# nothing should have a subject to replace. The two that did have successors are
# `subsumed` and `changed` in that ledger.
#
# With three arms the only routes past that were a false `subsumed` — a ledger
# entry that lies in order to pass — or a `[[waiver]]`, which `config-lint`
# refuses as `waiver-added` unless the weakening was groomed onto the issue before
# the work started. Neither is honest, so the gate had no honest path, which makes
# it a defect rather than a verdict.
#
# It is admissible ONLY where the dying file's declared subject is absent at head,
# which is what keeps it strictly NARROWER than the waiver it replaces: a waiver
# admits every deletion under its path, and this admits one case at a time and
# only once the subject went with it. It owes a reason and names no target.
[rule.conserves]
case = "@test \""
close = "\""
carried = "// carried:"
subsumed = "// subsumed:"
changed = "// changed:"
withdrawn = "// withdrawn:"
declared_in = "crates/batten/tests/*.rs"

# The mirror direction: a disabled test is a deleted test that still counts, so
# the guard is on the token RISING.
#
# The pattern is newline-anchored, and that is load-bearing rather than tidy. A
# bare `#[ignore]` is a literal substring, so it also matches every prose mention
# of the attribute — including the sentence you are reading and the fixtures in
# `crates/batten/tests/ratchet.rs` that exercise this very row. Measured: the
# unanchored form counts 5 in a tree containing zero disabled tests, so the row
# would have failed on its own documentation. An attribute always begins a line;
# a mention does not. (`budget.rs` anchors its HTML-comment scan for the same
# reason.)
[[rule]]
id = "no-new-ignores"
kind = "ratchet"
glob = "crates/**/*.rs"
pattern = "\n#[ignore]"
direction = "non_increasing"
base = "origin/main"
severity = "deny"
scope = "tree"
no_fix_reason = "delete the new ignore, or waive it deliberately; an ignore is a decision, not a defect to rewrite"

# CLOUD-929. THE CAMPAIGN'S OWN PROGRESS PREDICATE, which until now was four
# shell one-liners in an issue body that nothing ran. CLOUD-843 measured the
# consequence on itself: one bash file retired (65 lines) against +791 added in a
# single day — "the campaign to delete bash added bash, and nothing on the board
# was positioned to notice, because no row carries the number." Measured again
# 2026-08-25 across the 80 commits from v0.0.106 to v0.0.113: 141 -> 148
# programs. Twice now, in the same direction, while the campaign ran. By
# non-negotiable rule 2 a rule without a runnable gate is half a change, and the
# progress claim was the prose half.
#
# The unit is the PROGRAM, not the line. `#MISE description=` appears exactly
# once per task file, so the count is the census CLOUD-843's buckets are
# denominated in. A second row over raw lines would count volume instead, and was
# deliberately not written: a volume ratchet fires on ordinary editing, so its
# first firing would be a false positive — and "a gate whose first firing is a
# false positive gets an exception written for it, and the exception is what
# rots."
#
# THE ADMISSION IS A DECLARATION, NOT A PROOF, and the difference is stated here
# because the sibling column above reads the other way. `retires_with` reads the
# BASE tree, so a change cannot rewrite its own permission. A new file is absent
# from base, so `admits_with` can only read the WORKING tree, and a change
# therefore CAN write its own permission. What it buys is a silent increase
# becoming a visible, attributed one — worth having, and not the same guarantee.
#
# Two of CLOUD-843's buckets (build/bench, forge) may legitimately stay bash, so
# a bare `non_increasing` row would refuse correctly-authored work. The permit
# lives in the rule rather than in a `[[waiver]]` that expires, for the reason
# CLOUD-807 gave for the sibling: retirement is the steady state of a repo
# folding its bash into its own engine, not an exception.
[[rule]]
id = "bash-surface-not-growing"
kind = "ratchet"
glob = "mise-tasks/**"
pattern = "#MISE description="
direction = "non_increasing"
base = "origin/main"
admits_with = "# stays-bash:"
severity = "deny"
scope = "tree"
no_fix_reason = "migrate the predicate onto a rule kind, or declare `# stays-bash: <issue> <why>` in the new program and own the increase; which of the two is the whole question"

# CLOUD-1137. THE ROW ABOVE GLOBS ONE DIRECTORY, and `V-SHELL-RULE-ADDED`
# (CLOUD-1059) covers `mise-tasks/**` and `tests/**/*.bats`. Those globs were the
# whole enforced perimeter against new bash, and two surfaces sit outside it: a
# `run = '''…'''` body in `mise.toml` is bash, and `.claude/hooks/session-start.sh`
# is bash. Both are gates and effects doing what `mise-tasks/*.sh` does, and
# neither is a file under `mise-tasks/` — so the census could report an honest
# decrease while the repository's total shell rose.
#
# NOT the laundering path, which was already closed: `policy/shell-retirement.rego`
# requires a deletion's ledger arm to name a policy surface AND a compiled-binary
# test, and an inline body is neither, so retiring a described task by inlining it
# already raises `V-SUCCESSOR-NO-SURFACE`. What these rows add is the case with no
# sensor at all — shell authored straight into `mise.toml` or `.claude/**`, which
# was never counted as bash in the first place.
#
# THE DRIFT IS MEASURED RATHER THAN ASSERTED, and it is why these rows exist
# rather than a prose census: between v0.0.122 and v0.0.127 the inline-body count
# rose by two (`fmt:deno` and `fix-selection-check`, in `6cd5134`) and the
# `.claude/**` shebang count fell by one (`container-setup.sh`, in `65757c8`).
# Five releases, both surfaces moved, and CLOUD-1137's own body — written four
# days earlier — carried the stale integers. No count is restated here for the
# same reason `shell-hygiene` refuses to: the rows compute it.
#
# TWO SURFACES ARE DELIBERATELY EXEMPT, and the reasons differ, so a later reader
# finds a decision rather than a gap:
#
#   .github/workflows/**  bash is allowed. A workflow step is the one place a
#                         shell line is the native spelling, and there is no
#                         engine surface it could migrate onto.
#   install.sh            it cannot be a policy module by construction: it is how
#                         the binary reaches a host that does not have it yet, so
#                         it runs before the engine exists.
#
# NO `admits_with` ON EITHER `mise.toml` ROW, and this is the resolution of the
# capability question CLOUD-1137 §2 left open rather than a silent omission. The
# column DOES admit an increase inside an already-tracked file — `undeclared_growth`
# compares `now > was` per path and a new file is only the `was == 0` case — so the
# mechanism works. What does not work is the CARDINALITY: the declaration is a
# per-FILE boolean, one matching line admits any amount of growth in that file, and
# these rows glob exactly one file. The first author to spend the permit would
# switch the row off permanently. So the hatch is a `[[waiver]]` carrying a reason
# and an expiry, which is what `tests-not-deleted` prescribes and what bounds the
# admission in time. Row (b) globs a directory, where the per-file semantics are
# the ones the column was designed for, so it carries the permit.
#
# TWO LITERALS FOR ONE CONCEPT, because TOML spells a multiline body two ways and
# a ratchet `pattern` is a literal substring with no `regex` column (CLOUD-1058).
# `install:local` is spelled `"""` today, so a single `'''` row would leave a live
# false negative — net-new shell in the very spelling the row does not read. Retire
# the second row into the first when CLOUD-1058 lands the column.
#
# THE FIRING RATE, replayed before the severity was chosen (DoR §7). Over all
# 1,479 commits on `origin/main` (2026-08-05 to 2026-08-28), asking of each commit
# whether the count rose against its parent: `'''` fired 24 times, `"""` once, and
# the `.claude/**` row 4 times. FALSE POSITIVES: ZERO. Every firing adds a real
# inline body or a real shell program to a surface nothing counted — which is the
# class, not a near miss. The distribution is front-loaded (18 of the 24 fall in
# the first ten days, while the task layer was being built out); the trailing rate
# over the last fortnight is 4, 0 and 1. `deny` is chosen on that, against a
# repository that rejected one candidate predicate at 99.5% false positives
# (CLOUD-514) and a `TODO|FIXME` ratchet at 100% (CLOUD-751).
#
# AND NOT THE WIDER LITERAL, which is the tempting unification and was rejected on
# a measurement rather than on taste. `pattern = "run = "` is exact in this file
# (anchored and unanchored agree) and would subsume all three spellings — but
# replayed over 49 commits it fires four times, and two of those firings are the
# campaign SUCCEEDING: retiring a shell task into the engine leaves a one-line
# `run = "cargo run -p batten -- …"` shim, which raises that count while lowering
# real bash (`8b234af`, `fba3f78`). A row that denies its own campaign's wins is
# worse than the hole it closes.
[[rule]]
id = "inline-task-bodies-not-growing"
kind = "ratchet"
glob = "mise.toml"
pattern = "run = '''"
direction = "non_increasing"
base = "origin/main"
severity = "deny"
scope = "tree"
no_fix_reason = "migrate the predicate onto a rule kind, or waive the increase deliberately with a reason and an expiry; which of the two is the whole question"

# The other spelling of the same concept — see the block above for why it is a
# second row rather than a second pattern on the first.
[[rule]]
id = "inline-task-bodies-not-growing-basic"
kind = "ratchet"
glob = "mise.toml"
pattern = 'run = """'
direction = "non_increasing"
base = "origin/main"
severity = "deny"
scope = "tree"
no_fix_reason = "migrate the predicate onto a rule kind, or waive the increase deliberately with a reason and an expiry; which of the two is the whole question"

# The `.claude/**` half. `#!` rather than a shebang's text, because the programs
# there do not share a spelling — `#!/usr/bin/env bash` twice today, and the file
# this row's baseline lost spelled it `#!/bin/sh` — so a text literal would count
# some of them and read as a decrease when one was replaced.
#
# THE GLOB IS THE DIRECTORY, NOT `.claude/**/*.sh`, and the narrower form was
# considered and rejected: the `mise-tasks/` programs carry no extension at all,
# so an extension-anchored glob is exactly how this class reappears one directory
# over. The cost is a known false positive — a `#!` inside a fenced code block in
# `.claude/rules/*.md` would count as a program. Zero today; if one lands, the
# answer is CLOUD-1058's line-anchored `regex`, not a per-file exception.
[[rule]]
id = "claude-shell-not-growing"
kind = "ratchet"
glob = ".claude/**"
pattern = "#!"
direction = "non_increasing"
base = "origin/main"
admits_with = "# stays-bash:"
severity = "deny"
scope = "tree"
no_fix_reason = "migrate the predicate onto a rule kind, or declare `# stays-bash: <issue> <why>` in the new program and own the increase; which of the two is the whole question"

# Advisory rather than blocking: assertions thinning out while the `#[test]`
# count holds is the gutting shape, and it is worth saying without blocking —
# a refactor legitimately merges assertions. `--fail-on-warning` and
# `--strictness strict` promote it when a run wants the stricter reading.
[[rule]]
id = "assertions-not-gutted"
kind = "ratchet"
glob = "crates/batten/tests/**/*.rs"
pattern = "assert"
direction = "non_decreasing"
base = "origin/main"
severity = "warn"
scope = "tree"
no_fix_reason = "restore the assertions, or waive the reduction deliberately"

# The merge contract, DERIVED from this repository's GitHub ruleset (CLOUD-54).
#
# The host is the authority; this is a projection a gate polices. `mise run
# ci-drift` pipes `gh api repos/{owner}/{repo}/rules/branches/main` into
# `batten config lint --host-rules -`, so an edit on either side that the other
# does not follow fails the build rather than drifting quietly.
#
# `required_checks` is `final` alone: the ruleset requires that one check-run,
# and `final` is the aggregating job every other CI job reports through. There
# is no `allowed_merge_methods` key because the ruleset carries no
# `pull_request` rule — the host constrains no merge method, which is a
# different claim from constraining none of them, and writing an empty list here
# would assert the second.
#
# Landing is by `/fast-forward` regardless (see AGENTS.md): the merge button is
# blocked so `main` only ever advances to a SHA that already passed CI. That is
# repository discipline, not a host constraint, and it is deliberately not
# encoded here — this table records what the HOST enforces, and recording a
# convention as a host rule would be the second authority the whole issue exists
# to prevent.
# `wait -n` IS BASH 4.3, AND ITS PID-LIST FORM IS 5.1 (CLOUD-383). macOS ships
# bash 3.2 as `/bin/bash` and `mise registry` carries no bash, so one executable
# `wait -n` under `mise-tasks/` makes that task unrunnable on a platform
# `darwin-link` treats as a required check. `land` raced two unbounded pollers
# with it and waits on a FIFO rendezvous now; this is the standing half, so the
# next race cannot reintroduce it — the shape the portability rows above already
# use.
#
# Anchored to a line start so the ban is on RUNNING it, not on naming it: the
# rendezvous is documented in comments that say what it replaced, and a rule that
# forbade the words would delete the explanation along with the construct.
[[rule]]
id = "no-bash4-wait-n"
kind = "forbid"
glob = "mise-tasks/**"
regex = "^[ \\t]*wait -n"
severity = "deny"
scope = "tree"

# SBOM conformance as an adopted verdict rather than a clause list (CLOUD-580,
# settling CLOUD-279 verdict 1). `mise run sbom-check` already asks whether the
# published inventory DESCRIBES this tree; these two ask whether it is USABLE by
# whoever receives it — the NTIA 2021 minimum elements and CISA's 2024 FSCT
# minimum expectation, which is what a procurement review actually checks.
# `mise-tasks/ntia-check.sh` carries the reasoning and the measurements; what belongs
# here is why this is TWO rows at two severities.
#
# The clause set is the tool's, named by its own `--comply` flag: no clause list
# in the engine and no crosswalk table (CLOUD-279 verdict 2). `policy_url` would
# be the natural home for the standard's URL and a `command` row does not permit
# one (`RuleKind::permits` — it is a shape-row column), so the standard travels in
# the check itself, which is also the only place that could keep it honest.
#
# ROW 1 IS THE MECHANISM, and it is `deny` because it is the half that can stop
# working silently: an unresolvable checker or an underivable document would
# otherwise make row 2 pass by never asking anything (non-negotiable rule 2, and
# `sbom-empty`'s lesson one layer up).
[[rule]]
id = "sbom-ntia-precondition"
kind = "command"
glob = "Cargo.lock"
check = "mise run ntia-check --precondition"
severity = "deny"
scope = "tree"
no_fix_reason = "install the pinned checker (`mise install pipx:ntia-conformance-checker`) or fix why `mise run sbom` cannot derive a document; neither is a change to this tree's content"

# ROW 2 IS THE VERDICT, and it is `deny` as of CLOUD-631 — promoted in the change
# that makes it pass, which is that row's own acceptance clause rather than a
# preference about when to tighten.
#
# It was `warn` by measurement, and the measurement was right at the time: on
# 2026-08-14 this tree produced 243 components with no supplier on 190 and no
# concluded license or copyright text on 243/243, because `Cargo.lock` carries no
# license and no supplier field and that is the only input syft's cargo cataloger
# reads. `deny` then would have failed `batten enforce` -> `verify` and stopped
# every landing in the repo until a change that did not exist yet — a gate
# answering a question nobody had asked it.
#
# What changed is that the document now conforms, from five sources each of which
# reads data this tree already states and invents nothing:
#
#   supplier          the lockfile's own resolution — one distinct `source`, so
#                     the distributor is stated rather than inferred (CLOUD-630)
#   licenseConcluded  `cargo metadata`, which `cargo-deny` already gates on
#                     (CLOUD-628), plus the pinned-action table (CLOUD-667)
#   copyrightText     the checksum-pinned registry cache, with `NONE` where the
#                     pinned bytes carry no holder (CLOUD-629), plus CLOUD-667
#
# and from two corrections without which none of the above would have been
# legible: the component census counted 340 entries for 290 distinct things
# (CLOUD-664), and `fsct3-min` was in the standards set while being unsatisfiable
# for every document syft can emit, so the gate was guaranteed non-zero whatever
# the SBOM said (CLOUD-666).
#
# Measured on this tree at promotion time: `mise run ntia-check` exits 0 —
# `batten.spdx.json conforms to ntia` — over 290 components, every one carrying a
# supplier and a license, 162 with a copyright holder and 119 determined to have
# none.
#
# THE FIRING RATE IS ZERO BEFORE THE `deny` BINDS, which is what makes this safe
# where a heuristic promotion would not be. The predicate has no commit series to
# replay: it is the checker's exit code on the document a tree produces, so its
# history is per-SHA. It fired on every SHA to date, and none of those firings was
# a false positive — the checker DECIDES conformance against the minimum elements
# rather than estimating it, so a false positive would be a checker defect and not
# a tuning question. Taking the rate to zero is what this change does; the `deny`
# is what keeps it there.
[[rule]]
id = "sbom-ntia-conformance"
kind = "command"
glob = "Cargo.lock"
check = "mise run ntia-check"
severity = "deny"
scope = "tree"
no_fix_reason = "the missing fields do not exist in a cargo lockfile, so no command over this tree can add them: the SBOM has to be enriched from `cargo metadata` first"

# Release provenance, adopted as `gh attestation verify` (CLOUD-583, CLOUD-279
# verdict 1 — `slsa-verifier` is redundant against the same absent provenance and
# `cosign` has no signing identity here). `mise-tasks/attestation-check.sh` carries
# the design; what belongs here is why this is ONE row and which half it runs.
#
# THE OFFLINE HALF, and that is the whole of the wiring decision. Whether a
# published release is attested changes with no diff, so it is a property of the
# WORLD and belongs on a clock — it runs weekly in `release-assets.yml`, beside
# the sibling question about the archives themselves. Putting it here instead
# would make every `batten enforce` reach api.github.com, which is precisely the
# coupling CLOUD-410 removed from `zizmor`. So the row runs `--precondition`: the
# verifier resolves and carries a credential, decided from local facts, with a
# bats case asserting it makes no API call at all.
#
# `deny` is safe BECAUSE of that split. The precondition holds today (measured
# 2026-08-14) while the platform gap is wide open — this repository's attestations
# endpoint answers 404, which is the feature being absent rather than an artifact
# being unattested, and the task reports that gap at exit 0 without calling
# anything unverified. `blockedBy CLOUD-585` was removed from the issue on that
# measurement: a public repository is what makes the verdict INTERESTING, never
# what makes this gate runnable.
# THE GLOB IS THIS ROW'S OWN MECHANISM, and both constraints that produced it were
# measured rather than reasoned. It must be a path `batten-glob-check` can prove
# covered — that gate accepts a verbatim match or a `P/**` prefix against hk.pkl's
# `batten-check` list, and `mise-tasks/**` is in it, so any path under
# `mise-tasks/` is provable while a lone `.github/workflows/release-artifacts.yml`
# is not. And it must not match inside a FIXTURE tree: a `check` spelled `mise run`
# resolves only where a mise.toml is findable, so a row matching a fixture reports
# the launcher rather than the tree. Two suites caught the two wider spellings —
# `tests/prebuilt-lint.bats` copies `mise.toml` and the workflows into its fixture,
# and `cli.rs`'s portability case writes a `mise-tasks/seed.sh` — and neither failure
# had anything to do with attestation. CLOUD-614 carries the general defect; naming
# the file the row exists to run is what makes the trigger and the mechanism the
# same object rather than a coincidence.
[[rule]]
id = "release-attestation-precondition"
kind = "command"
glob = "mise-tasks/attestation-check.sh"
check = "mise run attestation-check --precondition"
severity = "deny"
scope = "tree"
no_fix_reason = "install the pinned `gh` (`mise install aqua:cli/cli`) or supply GH_TOKEN; neither is a change to this tree's content"

# CLOUD-618. `release-plz.yml` publishes a tag; this row is what keeps the tag
# reaching Linear's `batten` pipeline rather than only the run summary.
#
# `command` AND NOT `forbid`, which is the whole reason this is a row plus a
# script rather than a declarative rule. Every other shape gate here asserts an
# ABSENCE — a token that must not appear, a path that must not be tracked — and
# absence is what a pattern over a file can express. This asserts PRESENCE: two
# action invocations, pinned, bound to one resolved tag output, over a checkout
# that is not shallow. No rule kind can address a node in a document, so there is
# nothing declarative to write. That gap is `relatedTo` CLOUD-452, and it does
# not block: `command` is the sanctioned form until a kind exists that closes it,
# at which point this row collapses into that kind and the script goes away.
#
# THE GLOB IS THE ROW'S OWN MECHANISM, the discipline
# `release-attestation-precondition` above establishes, and both halves of it
# bind here too. It must be a path `batten-glob-check` can prove covered — that
# gate accepts a verbatim match or a `P/**` prefix against hk.pkl's
# `batten-check` list, and `mise-tasks/**` is in it, while a lone
# `.github/workflows/release-plz.yml` is not provable. And it must not match
# inside a FIXTURE tree: a `check` spelled `mise run` resolves only where a
# mise.toml is findable, so a row matching a fixture reports the launcher rather
# than the tree — `tests/prebuilt-lint.bats` copies the workflows into its
# fixture, which is exactly the wider spelling that would have caught this one.
# Naming the file the row exists to run keeps the trigger and the mechanism the
# same object. The workflow it JUDGES is globbed on the hk step instead, where a
# glob is a re-run trigger rather than a rule's subject.
#
# `deny` is safe because the check is offline and local: it reads one tracked
# file, makes no network call, and needs no credential — so it cannot block on
# ambient environment the way an earlier `attestation-check` did inside fixture
# repositories. The only way it reds is the workflow actually losing its wiring.
[[rule]]
id = "release-tracking-check"
kind = "command"
glob = "mise-tasks/release-tracking-check.sh"
check = "mise run release-tracking-check"
severity = "deny"
scope = "tree"
no_fix_reason = "the missing node is in the workflow, not in this file; add the invocation, the pin, or the fetch-depth the finding names"
# `issue-guard`'s duplicate-claim half, and the change that retires that file
# (CLOUD-446). The naming half is the engine's, two rows above as
# `pr-names-an-issue`/`ready-names-an-issue`; this is what could not follow it.
#
# WHY IT IS A `tree` ROW rather than a mediated one, which is the issue's whole
# decision: the predicate needs `gh pr list` plus a `gh pr view` per competitor,
# and `RuleKind::scopes` pairs every spawning kind with `RuleScope::Tree` alone —
# pinned by `rules::tests::no_mediated_call_kind_spawns_a_process`, an invariant
# worth more than this predicate. A network round trip on every mediated tool
# call is also disqualifying against the published <=100ms budget. So it runs
# where spawning is already legal, under `verify`, which sits on every path to a
# published PR because `land` is the only readier.
#
# The cost, stated rather than absorbed: this catches the race at `verify` where
# `issue-guard` caught it at `gh pr create`. Both are later than pull time, which
# is what CLOUD-230 wanted and which no candidate restores.
#
# `glob` NAMES THE CHECK'S OWN FILE, for the reason
# `release-attestation-precondition` spells out above:
# a `mise run` check resolves only where a mise.toml is findable, so a row
# matching inside a fixture reports the launcher rather than the tree
# (CLOUD-614). Naming the program the row exists to run makes the trigger and the
# mechanism the same object, and keeps this out of every fixture that does not
# carry it.
# CONSUMER #1 EATS THE SAME FOOD (CLOUD-836). Batten ships vendored preset
# bundles compiled into the binary, and this repository enables one like any
# other consumer would — which is the only way the surface gets exercised by
# something other than its own tests.
#
# `trunk-based` rather than `commit-hygiene`, and the choice is on the merits:
# AGENTS.md's landing contract is trunk-based development, `main` is the one
# long-lived branch, and a force push there is exactly the shape the practice
# refuses. `--force-with-lease` stays admitted, which is what the preset's own
# comment argues for — banning both would push toward the bypass rather than
# toward the safer flag.
#
# `commit-hygiene` is deliberately NOT enabled here, and that is a decision
# rather than an oversight: its `no-empty-commit` predicate overlaps AGENTS.md's
# own "never push an empty commit to kick CI", which the landing loop already
# enforces where it can act on it. Enabling a second gate over the same practice
# would double a refusal without doubling the coverage, and the row that fired
# would be a question of which one a reader happened to read first.
#
# Mediated-call scoped, because the preset's predicate is over a command line.
# A tree-scoped row would hand it a document it has no predicate for and read as
# a configured gate that never fires.
[[rule]]
id = "trunk-based-preset"
kind = "policy"
scope = "mediated_call"
preset = "trunk-based"
severity = "deny"

# CLOUD-1028, and consumer #1 eating the same food again. The practice is that a
# program this project's pin provides is reached through the pin; the incident
# behind it is this repository's own, and the fact the preset reads is resolved
# for whatever project the engine is pointed at.
#
# `warn`, NOT `deny`, AND THE FIRST LANDING IS THE REASON. The pinned set here is
# 49 programs — measured, the difference between the PATH the pin composes and
# this process's own — so a `deny` would refuse every bare `jq`, `gh`, `hk` and
# `shellcheck` in the tree on the same commit that introduces the row. That is a
# far larger behavioural change than the incident asks for, and the discipline
# this repository applies to every other verdict says the promotion comes with a
# number: land it reporting, read the firing rate over a session, promote it with
# the measurement rather than with an argument (CLOUD-320).
#
# What it costs meanwhile is stated rather than hidden: at `warn` the refusal is
# advice, so an invocation this row exists to stop still runs. The class it
# catches is a false REPORT rather than a broken tree, and a session that reads
# the advice has what it needs to distrust the run.
#
# NO `sources` COLUMN, AND THE ABSENCE IS THE DESIGN. The record this preset
# reads is keyed to the pin's configuration, and the obvious spelling of that —
# naming the manifest and the lockfile here — is refused at LOAD, because
# `sources` is what a `scope = "tree"` row hands its bundle. The engine asks the
# pin which files configure it instead, so neither this row nor `crates/batten`
# carries their names (non-negotiable rule 1).
[[rule]]
id = "pinned-toolchain-preset"
kind = "policy"
scope = "mediated_call"
preset = "pinned-toolchain"
severity = "warn"

# The evaluator's IO-free pin, given a mechanism (CLOUD-831). `policy.rs`'s
# module doc admits consumer-authored code to the MEDIATED CALL on the claim that
# a module "cannot open a file, start a process, or reach the network", and cited
# a test named `no_evaluator_feature_admits_io` that did not exist — CLOUD-589's
# class, on the highest-consequence claim in the crate. That test exists now, and
# this row is its defence-in-depth half.
#
# A `command` row rather than a `forbid` over the manifest text, deliberately.
# Cargo unifies features across the graph, so `http` can re-enter the closure
# with NO edit to the `regorus` feature list — a `forbid` matches the line that
# states the pin and is blind to the failure mode that matters. Only the resolved
# graph can answer, and reading it means spawning `cargo metadata`.
#
# Tree-scoped and spawning, so it runs under `enforce` / the hk gate and never on
# the mediated path — which is the right side of the CLOUD-170 split for a gate
# whose subject is the mediated path.
#
# `glob` names the check's own file so the trigger and the mechanism are one
# object (CLOUD-614), matching `claim-not-raced` below. The gate reads
# `Cargo.lock` and `Cargo.toml`, not this file — the glob is what decides WHEN it
# is worth asking, and asking on a change to the gate itself is the case that
# must never be skipped.
[[rule]]
id = "evaluator-closure-io-free"
kind = "command"
glob = "mise-tasks/evaluator-closure-check.sh"
check = "mise run evaluator-closure-check"
severity = "deny"
scope = "tree"
no_fix_reason = "an IO crate reaching the evaluator is closed where it was enabled, not here: `cargo tree -i <crate>` names who turned it on, and the `regorus` feature list in Cargo.toml is where the pin is stated rather than where it is decided"

# The contract half of the config deprecation grammar (CLOUD-360). A key that
# leaves the published schema with no window breaks every consumer still carrying
# it, and breaks them SILENTLY: their config stops loading with an unknown-key
# error naming no successor and no date.
#
# A `command` row for `evaluator-closure-io-free`'s reason, one layer over. The
# subject is not this tree's text but the DIFFERENCE between two published
# surfaces, one of which lives at a git tag — no `forbid` over a line can see
# that, and the schema file itself is derived, so matching on it would gate the
# artifact rather than the change it records.
#
# Tree-scoped and spawning, so it runs under `enforce` and the hk gate and never
# on the mediated path. `glob` names the check's own file, matching the two rows
# above (CLOUD-614): the gate reads `schema/batten.schema.json` at a tag and the
# schema this build derives, so the glob decides WHEN the question is worth
# asking, and asking on a change to the gate itself is the case that must never
# be skipped.
#
# `deny` is earned rather than assumed. §7 required the predicate be replayed
# across history first, and it was: over all 112 release tags, zero would have
# reported a violation (85 clean, 27 exit 3 for tags predating the committed
# schema). A gate that would have refused past releases fires on work nobody can
# now fix; this one would not have.
[[rule]]
id = "no-key-leaves-the-schema-unannounced"
kind = "command"
glob = "mise-tasks/config-deprecations.sh"
check = "mise run config-deprecations"
severity = "deny"
scope = "tree"
no_fix_reason = "a removal is announced by declaring the window, not by editing the schema: add a row to `config::DEPRECATED_KEYS` naming the replacement and the expiry, and the derived artifact follows from the types"

# The first migrated gate of the bash-retirement campaign (CLOUD-843 track 2):
# `run-shape-guard`'s no-message-source family, as a consumer-authored module
# rather than a vendored preset. It names `git`, which a preset may not — a
# preset carries a PRACTICE and this carries one tool's argv, so it belongs on
# this side of the boundary (non-negotiable rule 1).
#
# `module` rather than `bundle`: one predicate, one file, and a folder would
# enable whatever later lands beside it without a row saying so.
#
# Mediated-call scoped, because every predicate in it is over a command line.
# THREE MORE LANDED WITH CLOUD-613 — `unsatisfiable-commit`, `foreground-sleep`
# and `background-timer`. The fourth family of that guard
# (`cargo-substitutes-for-a-task`) stays in bash on CLOUD-856, and because
# `shell-retirement` admits only a WHOLE-file deletion the guard keeps all four
# until that one can move: both authorities decide these three until then, which
# is CLOUD-1108's row rather than a drift nobody noticed.
#
# The short flag cluster `git commit` accepts a message source in — `-m`, `-am`,
# `-F`, `-C`, `-c` — as a shape rather than a literal (CLOUD-885).
#
# DECLARED HERE RATHER THAN IN THE MODULE, and this row is the mechanism proving
# itself on consumer #1. An expression is a consumer fact: written into
# `policy/run-shape.rego` it would be a pattern with no home, invisible to
# `config show`, and the second module wanting the same shape would re-spell it.
# The engine refuses an inline regex at load, so this row is not a convention —
# it is the only way to write the predicate at all.
#
# The anchor is the predicate. `contains` over the flag's tail cannot say
# "letters", so `-x=mfoo` carried an `m` and read as naming a message source,
# letting through a commit that still blocks on $EDITOR.
[[pattern]]
id = "short-message-flag-cluster"
regex = "^-[A-Za-z]*[mFCc]"

# CLOUD-613's half of the same predicate, and it is a DIFFERENT question from the
# row above. That one asks "does this cluster select a message source at all";
# this asks "which flag takes the operand that would make it stdin", so it is
# anchored at BOTH ends — `-F` and `--file` exactly, never `-Fmsg.txt`, which
# carries its own value and cannot be followed by a bare `-`.
[[pattern]]
id = "commit-message-file-flag"
regex = "^(-[A-Za-z]*F|--file)$"

# THE ID IS NARROWER THAN THE ROW AND STAYS THAT WAY. Three more predicates
# landed in this module with CLOUD-613, so `commit-message-obtainable` now names
# the first one to arrive rather than the set. Renaming it is a `rule-removed`
# smell to `config-lint`, whose only route is a `Weakens:` clause groomed into
# the issue BEFORE the work starts — and asserting one inside the change that
# performs it is precisely what that gate refuses. So the row keeps its name and
# this comment carries the correction; the module file is the honest label.
[[rule]]
id = "commit-message-obtainable"
kind = "policy"
scope = "mediated_call"
module = "policy/run-shape.rego"
severity = "deny"

[[rule]]
id = "privileged-lane-tests-origin"
kind = "policy"
scope = "tree"
sources = [".github/workflows/*.yml", ".github/workflows/*.yaml"]
module = "policy/privileged-lane.rego"
severity = "deny"

# CLOUD-1050. The registry's tree-facing half: `verdict::validate` decides a
# route's SHAPE at parse and this decides whether it points at anything, which is
# a question about this tree and about a task RUNNER — so it is a module rather
# than a line of Rust (non-negotiable rule 1, the same placement CLOUD-614 was
# forced into by `no_artifact_name_reaches_the_core`).
#
# It matters more here than for a `command` ROW. A row naming a missing task
# fails loudly the first time it runs; a ROUTE naming one fails when a reader has
# just been refused, has been handed the one thing to run, and runs it.
[[rule]]
id = "verdict-routes-resolve"
kind = "policy"
scope = "tree"
sources = ["batten.toml", "mise.toml"]
module = "policy/verdict-routes-resolve.rego"
severity = "deny"

# CLOUD-1050 defects A and B: a gate's remedy reaches its reader, and exactly one
# program authors it. The module's own header carries the measurement and the
# scope limit; the reasoning is not restated here.
#
# `line_sources` RATHER THAN `lines`, for the reason that column exists
# (CLOUD-850): the predicate decides over every shell gate in the tree, and
# enumerating them is a list that goes stale the next time one is added —
# silently and green, which is the failure a declaration bound exists to prevent.
# `documents` names the manifest because defect B is a predicate over parsed
# tasks, not over the manifest's text.
#
# THE FIRST CONSUMER OF `Fact::Lines`. CLOUD-846 landed the fact and no module
# read it, so this row is also the live proof that the unparsed surface reaches a
# policy at all — which is why `crates/batten/tests/remedy_authorship.rs` drives
# the binary rather than trusting the schema.
[[rule]]
id = "remedy-authorship"
kind = "policy"
scope = "tree"
line_sources = ["mise-tasks/*.sh"]
documents = ["mise.toml"]
module = "policy/remedy-authorship.rego"
severity = "deny"

# CLOUD-1059. A migration that TOUCHES an authored shell rule retires it, or it
# does not land. The module's header carries the measurement and the bounds; the
# reasoning is not restated here.
#
# `delta_sources` PLUS `base`, and the pair is the whole declaration: the fact is
# a comparison, so a glob with no rev to compare against is unanswerable rather
# than merely narrower. `base` is the column `retires_with` already reads, shared
# deliberately — two spellings of "what did this branch change" is exactly the
# second authority CLOUD-1050 is about, one layer down.
#
# `line_sources` SPANS TWO CORPORA because the predicate asks two different
# questions of them. `mise-tasks/*.sh` answers "is this changed path an authored
# shell rule", read from the file's own first bytes rather than guessed from its
# name. `crates/batten/tests/*.rs` is CLOUD-908's retirement ledger, and it is
# declared by glob for that column's own reason: enumerating which test files
# carry an arm is a list that goes stale the next time somebody adds one —
# silently and green, which is the failure a declaration bound exists to prevent.
#
# THE COST IS REAL AND IS MEASURED RATHER THAN ASSUMED. This roughly doubles the
# line corpus on the tree input against `remedy-authorship`'s 34,730 lines, so
# `perf-gate` is the sensor on whether that stays inside the budget, and the
# number is reported on the PR rather than asserted here.
[[rule]]
id = "shell-retirement"
kind = "policy"
scope = "tree"
base = "origin/main"
# THE SELECTOR IS `**` FOR THE FOURTH ARM (CLOUD-1080), and it is the same
# correction `prose-only` records one row down. What this row GOVERNS is unchanged
# — `governed_at_head` and `governed_when_deleted` still select `mise-tasks/**` and
# `tests/**/*.bats` and nothing else — but a withdrawal has to be able to see that
# its declared subject DIED, and a subject is routinely neither of those: the
# wrapper this arm was built for lived under `.claude/`. With the narrow list the
# subject never appears in `delta.deleted`, so the arm reads every honest
# withdrawal as one over a live subject and refuses it. A false refusal, in the
# direction that blocks correct work.
delta_sources = ["**"]
line_sources = ["mise-tasks/*.sh", "crates/batten/tests/*.rs"]
module = "policy/shell-retirement.rego"
severity = "deny"

# CLOUD-827, ported off `mise-tasks/prose-only-check.sh` under CLOUD-1051. A
# branch whose whole diff is comment lines buys a full required matrix that can
# confirm nothing, because there is nothing in it CI could have an opinion about.
#
# THE SELECTOR IS `**` DELIBERATELY, and it is the one place this row is wider
# than its predecessor's. The shell read `git diff --name-only`, which is every
# tracked path; a `delta_sources` list would answer the question over a subset
# and report "prose-only" about a branch that also moved something the list does
# not name — a false refusal, in the direction that blocks correct work.
#
# THE OVERRIDE IS DECLARED ON THE CLASS, not here. `[[verdict]]`'s
# `V-PROSE-ONLY-DIFF` carries an `override` route with its precondition, which is
# what `batten override request` generates its questions from (CLOUD-1051). No
# `bypass_env`: the whole point of that row is that the bare variable stops
# working.
# The first of `stop-guard`'s five rules to become a module (CLOUD-1051).
#
# `scope = "mediated_call"` and it fires only at `Stop`, because that is the one
# event projecting `final-message`. Every other event hands the module `null`
# there, Rego reads an undefined path as *does not hold*, and the predicate is
# silent — so the scope is wider than the moment and the moment is what decides.
#
# NO `bypass_env`. `stop-guard` carried `BATTEN_STOP_GUARD_BYPASS` for all five of
# its rules at once; a module is one rule, and the engine's own hatch already
# suppresses the whole mediated path. A per-rule off-switch for an advisory that
# refuses nothing would only make the channel quieter, which is the direction
# nobody can detect.
# CLOUD-514's gate, ported off `mise-tasks/filed-here-check.sh` under CLOUD-1051.
#
# `delta_sources = ["**"]` for `prose-only`'s reason: the shell read
# `git diff --name-only origin/main...HEAD`, which is every tracked path, and a
# narrower list would answer the question over a subset — a row naming a file the
# list does not cover would pass, which is a miss in the direction that lets the
# punt through.
#
# NO `line_sources`: this row reads no file's contents. Its whole subject is the
# recorder's record and the delta the engine already resolved.
#
# THE OVERRIDE IS DECLARED ON THE CLASS. `V-FILED-OVER-OWN-DIFF` carries an
# `override` route with its precondition, which is what `batten override request`
# generates its questions from. No `bypass_env`, and specifically not
# `BATTEN_FILED_HERE_OVERLAP`: the point of the admission mechanism is that the
# bare variable stops working, and this is the row that variable served.
[[rule]]
id = "filed-here"
kind = "policy"
scope = "tree"
base = "origin/main"
delta_sources = ["**"]
module = "policy/filed-here.rego"
severity = "deny"

[[rule]]
id = "stop-posture"
kind = "policy"
scope = "mediated_call"
module = "policy/stop-posture.rego"
severity = "deny"

# CLOUD-1131's write-time signal, and it is a `warn` by design rather than by
# caution.
#
# `shell-retirement` keeps the verdict; this row only makes the same doctrine
# arrive at the edit instead of at `verify`. A deny here would have to refuse the
# DELETION every retirement performs, and the mediated surface cannot read a file
# to narrow the set tightly enough to carry a refusal — the module header states
# that bound in full.
#
# NO `bypass_env`. An advisory refuses nothing, so a per-row off-switch would only
# make the channel quieter, which is the direction nobody can detect. The engine's
# own hatch already suppresses the whole mediated path.
#
# ITS PRECONDITION WAS PROBED BEFORE IT SHIPPED, which is the row's actual
# history: `PreToolUse` carried no advisory until CLOUD-1131 measured that it
# does, and a registered gate emitting into a channel nobody reads is the defect
# that issue exists inside.
[[rule]]
id = "shell-write-advisory"
kind = "policy"
scope = "mediated_call"
module = "policy/shell-write-advisory.rego"
severity = "warn"

[[rule]]
id = "prose-only"
kind = "policy"
scope = "tree"
base = "origin/main"
delta_sources = ["**"]
module = "policy/prose-only.rego"
severity = "deny"

# CLOUD-876. `opa check -s` type checks the Rego corpus at build time because
# regorus ships no static undefined-field checker; regorus evaluates it at
# runtime. Two implementations of one language, so the pins must name one release
# or a rule green under the checker can differ under the evaluator — a false
# green, in the half nobody re-runs.
#
# A POLICY ROW RATHER THAN A GATE TASK, and the first draft got that wrong: it was
# bash, inside the bundle whose whole purpose is retiring bash (CLOUD-843 measured
# "the bash grew today" as the campaign's own defect). Everything decided here
# lives in two tracked TOML files, which is CLOUD-846's structured-config bucket.
# Merged-ness is decided by patch identity, never by reachability (CLOUD-36),
# migrated off a hand-rolled source scan (CLOUD-756).
#
# THE SCAN IS DELETED IN THE SAME CHANGE. `git.rs`'s
# `no_ancestry_decides_merged_ness` is gone; a module landing beside a scan it
# does not delete is two authorities on one property.
#
# `invocations` RATHER THAN `lines`, and this session measured why: the substring
# scan fired four times on PROSE while CLOUD-914 and CLOUD-762 were being
# written, at no call site at all. Porting it onto lines would have inherited
# exactly that, obfuscated needles and all.
[[rule]]
id = "ancestry-decides-nothing"
kind = "policy"
scope = "tree"
invocation_sources = ["crates/batten/src/*.rs"]
module = "policy/ancestry-decides-nothing.rego"
severity = "deny"

# The harness wiring the launcher actually reads, which is NOT in this tree
# (CLOUD-1167, the successor shape for CLOUD-1160's `hooks-wiring-check`).
#
# `PreToolUse` is ONE entry — the engine — and CLOUD-312 measured the
# alternative at 1.247s serial per Bash call to do milliseconds of policy. That
# rule had no mechanism, because the merged wiring is assembled under the user's
# own home directory and every fact in the model until now was repo-rooted.
#
# `[[rule.external]]` IS THE BOUND. One id, one named environment variable, one
# relative path beneath it — so the module reads that file and nothing else, and
# a path no row declares is unreadable by any module. The engine expands a
# variable and has no idea what `HOME` means; that the launcher keeps its
# settings at `.claude/settings.json` is this consumer's fact, and it lives here
# rather than in `crates/batten` for non-negotiable rule 1's reason.
#
# ABSENT IS NOT CLEAN. A host with no such file — CI, a fresh container — leaves
# the id in `input.tree.missing` with cause `absent`, and the row is skipped
# rather than run against a fabricated empty document. A host that does not set
# `HOME` at all is `root-unset`, a different cause, because "this machine has no
# launcher" must not read as "this machine is wired correctly".
# The forge's verdict for the commit under judgement (CLOUD-1154, the decision
# half of `checks-green`).
#
# The engine opens NO SOCKET. House style §5 forbids an HTTP client here, so the
# fetch happens once outside — a workflow step, an agent call — and writes a
# record under the git directory that this reads back. That is `agent-sourced`'s
# own argument moved from the hook surface to the tree one, and
# `evaluator-io-check` stays the gate on it.
#
# `HEAD` rather than a literal sha: a committed sha goes stale the moment
# anything lands. Declared tokens resolve as refs first and fall back to the
# literal, so this row means "the commit under judgement" without inventing a
# second ref vocabulary.
#
# THE POLLING STAYS OUTSIDE (CLOUD-1177): only the decision moves in. `ci-wait`
# and `main-watch` keep their loop, and this row gives them the fact rather than
# a home for it.
#
# SILENT UNTIL A PRODUCER WRITES. No record for HEAD means nothing has judged
# this commit — absent from the map, not a verdict — so this row is inert on a
# checkout nobody has recorded against, which is every checkout today.
[[rule]]
id = "forge-verdict-required"
kind = "policy"
scope = "tree"
forge = ["HEAD"]
module = "policy/forge-verdict-required.rego"
severity = "deny"

# Refusals recorded this session and a turn ending anyway (CLOUD-1172, the
# successor shape for `finding-sink-check`'s question).
#
# THE TRANSCRIPT IS NEVER READ AS TEXT. `input.call.transcript` is the path and
# never a byte of the session, and the fact that carries the rest carries COUNTS
# — the extractor set is closed and every member resolves to an integer over
# typed events, so no span of session text can reach a module even if one asked.
# A transcript holds every command, every file body and every prompt this session
# touched, which is why rule 4 is decided in the fact's TYPE here rather than in
# a module's discipline.
#
# CLOUD-1029 IS NOT A PRECONDITION FOR THIS ROW, and that is a recorded argument
# rather than an oversight. That row makes the transcript tamper-EVIDENT, and it
# is a precondition for any gate whose verdict is ABOUT the record's integrity.
# This one grades neither the record nor its author: it reads a count the engine
# derived from typed fields and decides a question about THIS turn. If the
# substrate were rewritten the count would move, and the honest cost is stated —
# a consumer that later grades transcript CONTENT needs CLOUD-1029 first, and
# this declaration authorises no such consumer.
#
# COULD-NOT-LOOK IS THE COMMON CASE (CLOUD-388: transcripts die with their
# container). Four states are null — no path on the envelope, a host that keeps
# none, a file that will not parse, and nobody having declared an extractor — and
# every one is different from an extractor that ran and counted zero. The module
# refuses only on a real count, because reading null as "nothing was stranded"
# is the false green CLOUD-990 measured costing a session an hour.
[[rule]]
id = "denials-outlive-the-turn"
kind = "policy"
scope = "mediated_call"
module = "policy/denials-outlive-the-turn.rego"
severity = "deny"

[[rule.extract]]
id = "denials"
count = "hook-denials"

# A weaker spelling of a task this project already defines (CLOUD-856, the
# successor shape for `run-shape-guard`'s `cargo-substitutes-for-a-task`).
#
# THE MANIFEST IS READ ONCE, NOT PER CALL. `input.call.document` does not exist
# and must not — a document is unbounded on the mediated path, and CLOUD-834's
# `None` arm is right on its own terms. So the parse moved rather than being
# admitted: session start reads the task table and records it, keyed to the
# manifest's own bytes, and the call reads that record. A manifest that changes
# invalidates the record by construction.
#
# WHICH FILE AND WHICH NODE ARE THIS CONSUMER'S FACTS, which is why they live
# here and not in `crates/batten` (non-negotiable rule 1). The engine parses a
# declared path at a declared node and knows nothing about what either names.
#
# SILENT UNTIL THE RECEIPT EXISTS. No record, a record about a manifest that has
# moved, a schema this build does not read, or one past the size cap are all
# could-not-look — and the module allows in that state deliberately, because a
# guard comparing a call against an empty task table would refuse every command
# this project runs.
[[rule]]
id = "task-substitution"
kind = "policy"
scope = "mediated_call"
module = "policy/task-substitution.rego"
severity = "deny"

[[rule.tasks]]
manifest = "mise.toml"
node = "tasks"

# Whether the row this work serves was CLAIMED before code was written
# (CLOUD-1188, the successor shape for the ten stdin-fed board gates).
#
# THE STORE, NEVER STDIN, and three independent refusals say so. A stdin-fed fact
# declared `Surface::Check` is dropped by the surface table before projection, so
# the module silently sees nothing. A payload on stdin is a payload something
# read, which is context re-sent every turn — the channel `ready lint` and
# `claim check` were both moved off. And the step-receipt key does not include
# stdin, so two runs over different payloads on one unchanged tree hit one
# receipt and skip, which is a false green.
#
# THE REDUCTION IS DECLARED HERE, not left to the module: `token` yields a
# bounded whitespace-free scalar or nothing at all, so an issue body cannot reach
# the policy input even if a predicate asked for one. That is non-negotiable
# rule 4 decided by the declaration's shape rather than by every consumer
# remembering it.
#
# THE STORE HAS NO CLOCK, which bounds what this row may ask. Captures are keyed
# by CONTENT and carry no timestamp — that is what makes a reduction byte-stable
# — so a key read twice is two records and the reduction answers from the first
# in DIGEST order. A predicate over a mutable field would therefore report a
# state that was true when somebody read it and is not now. This row asked
# exactly that at first and `batten check` refused from a pre-claim capture; the
# fact was right and the question was wrong. `project` is asked instead, because
# filing does not un-happen under a later read.
#
# The KEY and the node are this consumer's vocabulary; the engine matches a
# string and reduces a node, and knows nothing about what either names (rule 1).
#
# SILENT UNTIL THE STORE ANSWERS. A key nothing captured is absent from the map,
# not a negative, so this row is inert on a checkout whose store holds no
# matching response.
[[rule]]
id = "claim-before-code"
kind = "policy"
scope = "tree"
module = "policy/claim-before-code.rego"
severity = "deny"

[[rule.captured]]
id = "this-row"
key = "CLOUD-1188"
node = "project"
reduce = "present"

# A third-party validator's verdict for a file it read (CLOUD-1171, the
# adjudication half of `pkl-check`, `renovate-config-validator` and
# `hook-profile-check`).
#
# THE RUN STAYS OUTSIDE and that is §9's prior-art disposition, not a workaround:
# the validator is a command on PATH and stays one. `check` is `read` and
# structurally cannot spawn, so what moves in here is the ADJUDICATION — which is
# the half that had no successor, because a module asking what a validator found
# read undefined and decided nothing.
#
# THE KEY IS A TRIPLE and each component refuses a different lie. The TOOL,
# because one validator's record is not another's. Its PINNED VERSION, because an
# answer at one version is not an answer at the next — CLOUD-646's shape, closed
# by putting the pin in the KEY rather than in a field a module must remember to
# compare. The INPUT DIGEST, so a verdict goes stale by construction the moment
# the file changes: the key moves, and the old record is not found rather than
# found and wrong.
#
# `hk.pkl` is this repository's own fact, which is why the row lives here and not
# in `crates/batten` (non-negotiable rule 1). The engine composes a key and reads
# a file; which file and which tool are the consumer's.
#
# SILENT UNTIL A PRODUCER WRITES. No record under this key means nothing has
# validated these bytes at this version — absent from the map, not a verdict — so
# this row is inert on a checkout nobody has recorded against, which is every
# checkout today.
[[rule]]
id = "validator-verdict-clean"
kind = "policy"
scope = "tree"
module = "policy/validator-verdict-clean.rego"
severity = "deny"

[[rule.tools]]
id = "config-validator"
tool = "pkl"
version = "0.29.1"
input = "hk.pkl"

# What has shipped, from a tag GLOB rather than a named ref (CLOUD-1200, the
# successor shape for the `released` family).
#
# `refs` and `ranges` resolve what a row NAMES; which tags exist is not knowable
# when the row is written, which is why `released`, `release-due`,
# `release-backfill`, `release-tracking-check` and `landed-check` had no
# successor. `[[rule.history]]` declares the PATTERN and the engine resolves the
# matching set — and a pattern no row names resolves nothing, which is the whole
# difference from a git shell.
#
# The tag's SPELLING is this repository's vocabulary — `release-plz` mints
# `v<major>.<minor>.<patch>` — so it lives in the module and in `[[pattern]]`,
# never in `crates/batten` (non-negotiable rule 1).
#
# NULL ON A SHALLOW CLONE, which is this container's own state: the family
# refuses to half-answer a history it cannot see, and the module guards for it.
[[rule]]
id = "release-tag-shape"
kind = "policy"
scope = "tree"
module = "policy/release-tag-shape.rego"
severity = "deny"

[[rule.history]]
id = "release-tags"
tags = "v*"

# The lockfile as it was STAGED (CLOUD-1203 unit A, the successor shape for
# `lock-complete`).
#
# `staged` RATHER THAN `documents`, and the difference is the gate's whole
# design. `lock-complete` judges THE COMMIT — "committed bytes only, no network,
# no write" — so a successor reading the working tree would answer a different
# question and pass over a staged-but-unsaved edit. `Fact::Tracked` walks the
# checkout and says so in its own doc; `Fact::GitStatus` carries paths and a
# count. `input.tree.staged` is the only key in the model that reads the index.
#
# The predicate is the one `lock-complete`'s own comment cites as its motivation:
# a platform entry with a checksum and no url. `mise lock` never removes or
# repairs an existing entry, so a stably wrong lockfile passes a
# regenerate-and-diff gate forever — and one did.
#
# The CURRENCY question stays out: whether upstream moved since this commit is a
# property of the world and lives on a schedule. This is a property of the
# commit.
[[rule]]
id = "lock-entry-complete"
kind = "policy"
scope = "tree"
staged = ["mise.lock"]
module = "policy/lock-entry-complete.rego"
severity = "deny"

# The `Weakens:` trailer, over a declared range (CLOUD-1187, the successor shape
# for `config-lint.sh:174`).
#
# That program reads the trailer to learn which weakenings an author DECLARED and
# compares them against what `trust::weakenings` DETECTED. It is why CLOUD-1162's
# unit 15 could not land: `input.tree["git-ranges"]` carries a sha and a subject,
# so a trailer had no surface. This module is the narrow half — a declaration
# that names nothing — and the comparison stays with the port, because it needs
# `weakenings`' output, which is not a fact.
#
# `commits` RATHER THAN `ranges`, and the two are separate columns on purpose:
# this peels a commit object per commit where `ranges` reads a subject, and range
# length is unbounded per declaration. A row wanting subjects must not pay for
# that.
#
# NO MESSAGE BODY IS REACHABLE from here. `git::CommitMeta` has no such field, so
# non-negotiable rule 4 is decided by the type rather than by the module's
# restraint — and an `attribution` predicate that needs `%B` therefore does not
# migrate and keeps its verb, which is the verdict CLOUD-1193 records.
[[rule]]
id = "weakens-declared"
kind = "policy"
scope = "tree"
commits = ["origin/main..HEAD"]
module = "policy/weakens-declared.rego"
severity = "deny"

[[rule]]
id = "harness-wiring"
kind = "policy"
scope = "tree"
module = "policy/harness-wiring.rego"
severity = "deny"

[[rule.external]]
id = "harness-settings"
root = "HOME"
path = ".claude/settings.json"

# Module layering, over the resolved `use` graph (CLOUD-359).
#
# THE LAYERINGS WERE DOCUMENTED AND GATED BY NOTHING. `module-map-check` asserts
# every module APPEARS in the map and says nothing about any edge — a membership
# check standing in for a predicate, the same substitution `tests-not-deleted`
# and `assertions-not-gutted` make. A back-edge compiled and passed every gate.
#
# `use_sources` RATHER THAN `line_sources`, and CLOUD-762 is why. A line
# predicate over this tree is wrong at four measured sites: it cannot see the two
# edges that reach `error` through a crate-root re-export, and it invents two
# more where `crate::Result` is really `anyhow`. Both surfaces cost the same
# parse; only one is right, so shipping the other would be a known false green.
#
# A GLOB RATHER THAN A LIST, for `line_sources`' own stated reason: an enumerated
# set goes stale the next time somebody adds a module, silently and green, which
# is the failure the declaration bound exists to prevent.
# CLOUD-882. `[workspace.dependencies]` fixes a version; it does not add a
# dependency. An entry no member references with `<key>.workspace = true`
# resolves to nothing, so every gate reading the RESOLVED graph is green about a
# crate that is not in the tree. Measured: `orphan-probe = "=9.9.9"` -- a crate
# that does not exist, at a version that does not exist -- passed `cargo
# metadata`, `macos-link-check` and `deny`, four greens over nothing.
#
# `sources` RATHER THAN `documents`, because only `sources` is glob-selected
# (CLOUD-850) and the member set is a glob by nature: a crate added tomorrow is
# judged without anyone editing this row, which is the property an enumerated
# list loses silently.
# CLOUD-614. A `command` row's `check` is spawned with the checked tree as its
# working directory, so `mise run <task>` resolves from THERE. A row naming a
# task the tree does not define does not fail to launch — the runner is on PATH,
# it starts, exits non-zero, and the engine reports a finding at the row's own
# severity about a tree it never inspected. Measured as a `deny` asserting
# NTIA-nonconformance over a scratch tree carrying nothing but a lockfile.
#
# THE CLAUSE LIVES HERE RATHER THAN IN `config-lint` because a task runner is a
# consumer's choice: `no_artifact_name_reaches_the_core` refuses the engine
# learning this manifest's name (non-negotiable rule 1).
[[rule]]
id = "command-task-defined"
kind = "policy"
scope = "tree"
sources = ["batten.toml", "mise.toml"]
module = "policy/command-task-defined.rego"
severity = "deny"

# CLOUD-386, ported off `tests/test-bats-parallel.bats` under CLOUD-1059. That
# suite was an authored bats file, so `shell-retirement`'s arm B refused
# maintaining it in place, and the campaign's own route — port the predicate,
# delete the file, record the successor — is what this row is.
#
# TWO SOURCE COLUMNS, AND THE SECOND IS NOT A DUPLICATE. `sources` hands the module
# the PARSED manifest — `[tasks."test:bats"].run` as the string mise will execute,
# and the workflow's `jobs.ci.steps[].with.install_args` — so no block-boundary
# scan can drift from what actually runs; the retired suite awk'd that block out of
# the manifest, which is the same question asked less reliably. `line_sources`
# hands over the same two files unparsed for the one thing a parser cannot see: a
# COMMENT, which is where both measurement dates live — the sweep's hardware and
# the job's budget.
#
# `severity = "deny"` because a silently serial suite is the failure this exists to
# make loud. Nothing else in the tree fails when `--jobs` is dropped, and
# `timeout-check`'s 3x headroom over p95 absorbs the regression without a red
# build. What it does NOT gate is the duration itself: that is a property of the
# machine, and the body reports it.
# CLOUD-1140. The `ci` job carves `test:bats` out with `HK_SKIP_STEPS` so the
# suite runs on its own runner; this refuses that carve-out coming apart in the
# direction that has no symptom. `hook-profile-check` reads `hk check --all
# --plan` and cannot see what a workflow job passes, so without this row the
# suite could be skipped in the `ci` job and run by no job at all, with every
# gate here green over a suite that never executed.
#
# THE PARSED DOCUMENT, NOT LINES, and that is a requirement rather than a
# preference: the carve-out and the job that answers it are tens of lines apart
# in different jobs, and a line-oriented reading cannot say which job either
# belongs to. `sources` hands the module the parsed workflow; there is no
# `line_sources` column because no clause here reads text.
#
# `severity = "deny"` because the failure is silent in the only direction that
# matters. The opposite mistake — a name that matches no step — runs the step in
# both jobs, which shows up in the bill and needs no gate.
[[rule]]
id = "ci-suite-lane"
kind = "policy"
scope = "tree"
sources = [".github/workflows/ci.yml"]
module = "policy/ci-suite-lane.rego"
severity = "deny"

[[rule]]
id = "bats-invocation"
kind = "policy"
scope = "tree"
sources = ["mise.toml", ".github/workflows/ci.yml"]
line_sources = ["mise.toml", ".github/workflows/ci.yml"]
module = "policy/bats-invocation.rego"
severity = "deny"

# ---------------------------------------------------------------------------
# CLOUD-1156. A suite whose `# subject:` names something no shell retirement
# deletes is unreachable by the whole campaign, and nothing reported it.
#
# `line_sources` RATHER THAN `sources`, and the reason is the header itself: a
# `# subject:` line is a COMMENT, which no parser this engine carries would
# hand back. The same reason `bats-invocation` above reads `mise.toml` twice.
#
# THE GLOB IS THE JUDGED SET, so it must reach every path `is_bats` would call
# governed — `startswith("tests/")` and `endswith(".bats")`, nested included.
# Both spellings are declared because `Selector` sets `literal_separator(true)`,
# so `tests/*.bats` does not cross a `/` and would silently drop a nested suite
# into the gap between what the campaign governs and what this rule can see.
# There are no nested suites today; the row is written for the day there is one,
# because that is the day nobody would notice.
[[rule]]
id = "suite-subject-retirable"
kind = "policy"
scope = "tree"
line_sources = ["tests/*.bats", "tests/**/*.bats"]
module = "policy/suite-subject-retirable.rego"
severity = "deny"

# CLOUD-681. `mise run fmt` is `hk fix --all`, and hk does not no-op a step that
# carries no fixer — it runs the step's CHECK. With all three hooks sharing one
# step list, a format pass therefore ran 58 steps of which 7 were fixers,
# `test:bats` and the cargo build among them. Two authorities call `fmt` the
# formatters-only subset; it was `verify`-class work under a name that reads as
# seconds.
#
# TWO SOURCE COLUMNS, AND NEITHER IS A DUPLICATE OF THE OTHER. `sources` hands
# the module the PARSED manifest, which is where both derived readings come from:
# the `fmt` description mise itself prints, and the `fmt:*` task table class three
# derives the routed-fixer set from rather than restating tool names. `line_sources`
# hands over `hk.pkl` and the rules file unparsed — `hk.pkl` is Pkl, which the
# boundary does not parse, and the rules file's clause is prose.
#
# `severity = "deny"` because both directions of this defect are SILENT. A
# check-only step under `fix` still passes, just slowly; a fixer nobody routes is
# indistinguishable from a tree that needs no fixing. Neither has any other sensor.
# The half `hk-fix-selection` structurally cannot answer, and the reason is
# measured. The predicate CLOUD-681's §2 proposed — hk's `fix` selection equals
# the gate's fixer-bearing steps — needs the config EVALUATED, not scanned, and
# evaluation is exactly where the surprise was: the derived spelling
# (`steps = fixers` filtered on `step.fix != null`) evaluates correctly under
# `pkl` while hk's own embedded evaluator reads it as EMPTY, so `hk fix --all`
# reported "no steps to run" and formatted nothing, green. Because the derivation
# is unavailable, `hk.pkl` names the subset as a LIST — and a list drifts, which
# is what this row exists to catch, in both directions.
#
# Tree-scoped and spawning, which is the right side of the CLOUD-170 split: it
# runs under `enforce` and the hk gate, never on the mediated path.
[[rule]]
id = "fix-selection-complete"
kind = "command"
glob = "hk.pkl"
check = "mise run fix-selection-check"
severity = "deny"
scope = "tree"
no_fix_reason = "add the missing step to `fixers` in hk.pkl, or remove the one that carries no fixer; which of the two a name needs is a reading of the gate that no command can make"

[[rule]]
id = "hk-fix-selection"
kind = "policy"
scope = "tree"
sources = ["mise.toml"]
line_sources = ["hk.pkl", ".claude/rules/toolchain.md"]
module = "policy/hk-fix-selection.rego"
severity = "deny"

[[rule]]
id = "workspace-dep-referenced"
kind = "policy"
scope = "tree"
sources = ["Cargo.toml", "crates/*/Cargo.toml"]
module = "policy/workspace-dep-referenced.rego"
severity = "deny"

[[rule]]
id = "module-layering"
kind = "policy"
scope = "tree"
use_sources = ["crates/batten/src/*.rs"]
module = "policy/module-layering.rego"
severity = "deny"

# CLOUD-760's consumer, and the reason the fact is a fact rather than a facility.
#
# `symbols = true` is what pays for it: this is the first `Cost::Effect` fact, so
# resolving it RUNS the analyser over the crate — seconds, where every other fact
# costs milliseconds. Declared per row means a `check` that does not enable this
# rule spends nothing, which is the whole reason the column exists.
#
# NO `sources`. The census is the fact's, resolved once at the boundary over the
# crate the analyser compiles; a glob here would select files the module does not
# read and skip the row when the glob matched nothing.
[[rule]]
id = "spawn-adapters"
kind = "policy"
scope = "tree"
symbols = true
module = "policy/spawn-adapters.rego"
severity = "deny"

# CLOUD-316's gate, ported off `mise-tasks/mise-pin-agreement.sh` under CLOUD-910
# — the wave's first gate, and the one whose end-to-end cost sizes the rest.
#
# `documents` RATHER THAN `sources`: both halves of the predicate are questions
# about PARSED structure — a server's argv array and the `[tools]` pin table — and
# the bash reached them with `jq` and a `sed` expression respectively. A line
# predicate over `mise.toml` would be that `sed` moved one layer down, which is the
# second authority this campaign exists to remove rather than relocate.
#
# `reason` is the remedy CLOUD-437 requires the refusal to name, and it is a row
# column rather than module prose because `batten check` renders `path:line rule`
# and nothing else — rule 4 IS its output contract, so a remedy written into the
# module would reach no reader.
[[rule]]
id = "mise-pin-agreement"
kind = "policy"
scope = "tree"
documents = [".mcp.json", "mise.toml"]
module = "policy/mise-pin-agreement.rego"
severity = "deny"
reason = "mise.toml owns the pin and .mcp.json's copy is a reference to it: move the version in mise.toml and repeat it in the scoped `mise exec`, never the other way round. A launch that names no tool before `--` provisions the whole toolchain and dies with any one of it (CLOUD-316)."

[[rule]]
id = "opa-tracks-regorus-compliance"
kind = "policy"
scope = "tree"
sources = ["mise.toml", "Cargo.toml"]
module = "policy/opa-compliance.rego"
severity = "deny"

# CLOUD-876's LAST clause, and its own body calls it "the acceptance test that
# separates a gate from theatre". `opa check -s` types a module against a schema;
# it has nothing whatever to say about a module that declares no schema, and that
# is exactly the module nobody checked.
#
# MEASURED SIDE BY SIDE, on one module carrying a real typo (`input.tree.trackd`)
# and no `# METADATA schemas:` block:
#
#     mise exec -- opa check -s schema/ policy/  ->  exit 0  (types as `Any`)
#     mise exec -- regal lint policy/            ->  exit 3  (refuses it)
#
# So `policy-modules-type-check` below is worth precisely as much as this row's
# coverage, and without this row a NEW module is silently exempt from it the day
# it is added.
#
# The predicate is COVERAGE, not possession: a `# METADATA schemas:` block has
# package scope and OPA refuses a redeclaration, so two modules in one package
# share one binding and a per-file rule would report the other as a false
# positive. `.regal/rules/.../every_package_binds_input.rego` carries the reasoning.
[[rule]]
id = "policy-modules-bind-input"
kind = "command"
# `glob` NAMES THE LINTER'S OWN CONFIG, not the corpus it reads (CLOUD-614), and
# this row is where that idiom stopped being a style note. Globbed at
# `policy/**/*.rego` it fired inside `cli.rs`'s two `enforce` fixtures, which copy
# the committed modules in so the config loads at all: `mise exec` there runs
# under a stubbed `HOME` with no tool cache, so the row reported the launcher
# rather than the tree and put `policy/**/*.rego policy-modules-bind-input` on
# stdout in two tests about consumer shapes. A `command` row is `Cost::Effect`, so
# only `enforce` saw it — `check` never spawns one.
#
# The file is always present in this workspace and in no fixture, so the row runs
# here and nowhere else; `hk.pkl`'s `batten-check` glob is what decides WHEN it is
# worth asking, and it carries `policy/**/*.rego` for exactly that.
glob = ".regal/config.yaml"
check = "mise exec -- regal lint policy/"
severity = "deny"
scope = "tree"
no_fix_reason = "add a `# METADATA schemas:` block binding `input` to the schema for the module's surface — `schema[\"policy-input.schema\"]` for a tree-scoped module, `schema[\"policy-call.schema\"]` for a mediated_call one. One block per PACKAGE; OPA refuses a redeclaration"

# CLOUD-876's build-time type check, and the clause the whole row exists for: a
# module reading a field the engine never emits fails the BUILD rather than
# evaluating to undefined and reporting green (CLOUD-845).
#
# `opa` is the checker and regorus is the evaluator; `opa-tracks-regorus-compliance`
# above holds them to one release so this check and the runtime cannot disagree.
#
# THE `-s` DIRECTORY IS WHAT MAKES IT BITE, AND ONLY FOR ANNOTATED MODULES.
# Measured 2026-08-22: `opa check -s schema/` over a module reading
# `input.tree.trackd` with NO `# METADATA schemas:` block exits **0** -- the path
# types as `Any` and nothing is checked. Annotated, the same typo is
# `rego_type_error: undefined ref` naming `have:` and `want (one of):`. So the
# annotation requirement is not decoration beside this row; it is the half that
# makes this row mean anything, and it is the Regal aggregate rule's job.
[[rule]]
id = "policy-modules-type-check"
kind = "command"
# The schema directory rather than the corpus, for the reason spelled out on
# `policy-modules-bind-input` above: a glob over `policy/**` matches inside the
# fixtures that copy the committed modules, and `mise exec` cannot resolve there.
glob = "schema/policy-input.schema.json"
check = "mise exec -- opa check -s schema/ policy/"
severity = "deny"
scope = "tree"
no_fix_reason = "the module names an input path the engine does not emit; fix the path or add the fact, and read the `want (one of)` list in the error for what this surface actually carries"

# CLOUD-876's second gate, independent of which schema mechanism won. A module
# reaching for `rego.metadata.*` type checks fine under upstream `opa` and does
# something else entirely under the engine that actually ships: regorus has ZERO
# support for it — no lexer token, no parser arm, no builtin. So such a rule
# behaves one way in the build-time check and another at runtime, which is the
# exact skew `opa-tracks-regorus-compliance` above exists to prevent, arriving by
# a route a version pin cannot see.
#
# A `forbid` row rather than a Regal custom rule, because the predicate really is
# a literal: `rego.metadata` is one token sequence with no legitimate spelling in
# this corpus, and a row is the narrowest thing that decides it. Anything needing
# the policy AST goes to Regal; this does not.
# The custom Regal rule above is code, and the only thing that keeps it HONEST is
# its own suite: a rule whose predicate silently matches nothing reports the whole
# corpus unbound (twice, during development) or — the direction that ships — the
# whole corpus bound, and `regal lint` exits 0 either way. The suite pairs every
# arm, so `binds_input` hard-wired to a constant fails it in one direction or the
# other. Without this row the suite would run nowhere and the rule would be a
# linter guarded by nothing.
[[rule]]
id = "policy-lint-rule-tests"
kind = "command"
glob = ".regal/rules/**/*.rego"
check = "mise exec -- regal test .regal/rules"
severity = "deny"
scope = "tree"
no_fix_reason = "a custom Regal rule's own tests failed; `mise exec -- regal test .regal/rules` names the failing case. Every arm is paired on purpose — if only the negative arm still passes, the predicate has stopped discriminating"

[[rule]]
id = "no-rego-metadata"
kind = "forbid"
glob = "policy/**/*.rego"
pattern = "rego.metadata."
severity = "deny"
scope = "tree"
no_fix_reason = "regorus implements no `rego.metadata.*` builtin, so the rule would pass `opa check` and behave differently under the shipped engine. Carry whatever the annotation held as an explicit fact on the row or in the module itself."

[[rule]]
id = "claim-not-raced"
kind = "command"
glob = "mise-tasks/claim-race-check.sh"
check = "mise run claim-race-check"
severity = "deny"
scope = "tree"
no_fix_reason = "a raced claim is resolved on the board, not in this tree: take the frontier from `mise run graph-check`, and close the competing PR if it is stale rather than racing it"

# The one legitimate reduction this ratchet has seen, taken through the hatch its
# own `no_fix_reason` names — "restore the tests, or waive the reduction
# deliberately; which of the two is the whole question." Restoring is not an
# option here: CLOUD-515 deletes `plan-hold`, so `tests/plan-hold.bats`,
# `plan-hold-check.bats` and `plan-hold-guard.bats` cover code that no longer
# exists and there is nothing left for them to assert.
#
# UNNARROWED, and not for want of trying. A ratchet finding's `path` is the glob
# PLUS THE COUNTS — `rules.rs` builds `"{glob} {base}->{working}"`, because the
# finding is about the whole matched set rather than any one file. So there is no
# per-file path a `path =` could select, and a waiver written against the literal
# would embed `1600->1552` and lapse the moment either count moved. Whole-rule is
# the honest scope, and the expiry is what bounds it.
#
# EXPECTED TO LAPSE UNUSED. `base = "origin/main"`, so the moment this lands the
# floor becomes the new count on its own and this row suppresses nothing. It
# exists to get one commit past the gate, not to stand.
# The one residual false positive `no-secrets` finds on this tree, measured
# before the rule landed rather than discovered by it: ripsecrets matches
# `${GH_PAT}` in a `git config url."https://x-access-token:${GH_PAT}@…"` line as
# a credential embedded in a URL. It is a shell expansion of an Actions secret
# injected at runtime — the shape is real, the instance is not.
#
# A `[[waiver]]` and never `severity = "allow"`: switching the rule off would
# suppress every future finding too, while this names one path, states why, and
# LAPSES. The expiry is the mechanism — when it does, someone re-reads the line
# rather than inheriting a decision nobody remembers making.
[[waiver]]
rule = "no-secrets"
path = ".github/workflows/release-plz.yml"
reason = "ripsecrets reads `${GH_PAT}` in a git-config URL as an embedded credential; it is a shell expansion of an Actions secret, so nothing is committed. Re-check against the pinned scanner's next version."
expires = "2026-11-14"

[[waiver]]
rule = "tests-not-deleted"
reason = "CLOUD-780 retires four `git.rs` primitives, the pileup predicate and the `worktree reclaim` verb, and every deleted case named a deleted symbol (1850 -> 1834): `git.rs`'s worktree-listing and snapshot cases, `worktree.rs`'s pileup and reclaim cases, and `tests/cli.rs`'s whole pileup block. Deleting them with their subject is the Ready block's own §7 obligation — weakening them instead would leave assertions about a surface that no longer exists. What must NOT fall is the coverage beside them, and it does not: `worktree status`'s four surviving categories keep every case green with no assertion change, which is what proves the drop was surgical."
expires = "2026-09-13"

[ci]
required_checks = ["final"]

# ---------------------------------------------------------------------------
# The build tree this repository defends, and the two floors it defends it with
# (CLOUD-766, re-measured under CLOUD-861, split in two under CLOUD-1030).
#
# TWO FLOORS BECAUSE THE ESCALATION CHANGES THE BUILD IT IS CLEARING SPACE FOR.
# The predecessor carried one number, `FLOOR_MB=6242 # budget: worst-lap=6242mb
# x1 measured=2026-08-22`, measured over a lap whose incremental cache survived.
# When that floor is breached the reclaim drops `target/**/incremental`, which
# GUARANTEES the next build is cold — and then re-read the free space and
# compared it against the warm number again. So the one case the escalation
# exists for is the one case the surviving floor is certified against a basis the
# reclaim has just destroyed: it passed a lap with ~6.2 GB free that then needed a
# full rebuild's worth, and the lap died as a rustc IO error inside a test run.
#
# The cold number is this tree's own cold-build footprint, measured 2026-08-29 by
# building `target/debug` from nothing and taking its size: 14914 MB. It is what a
# lap must be able to write once the cache is gone, so it is the honest floor to
# judge against the moment the cache goes.
#
# x1 ON BOTH, and the reason is the one CLOUD-861 already recorded: twice the warm
# lap already exceeds this container's writable allowance, and a floor nothing can
# satisfy refuses every lap and gets switched off. The second factor is reclaimable
# space rather than idle space, which is a better guarantee because it is checked
# at the moment it matters. That reasoning applies to the cold floor unchanged and
# more strongly, since 2x14914 exceeds the allowance outright.
#
# `measured` is required and validated as a date rather than being commentary: a
# stale measurement reads exactly like a fresh one, which is the whole of
# CLOUD-266's class. `mb` is validated to equal `worst_mb * multiplier` at LOAD,
# which is what the predecessor's regex over its own source was reaching for.
[prune]
root = "target"
keep = 2

[prune.warm]
mb = 7264
worst_mb = 7264
multiplier = 1
measured = "2026-08-30"

[prune.cold]
mb = 17357
worst_mb = 17357
multiplier = 1
measured = "2026-08-30"

# THE BASIS EACH FLOOR WAS MEASURED AGAINST (CLOUD-1158), because `measured` is a
# pointer to a basis and not the basis itself.
#
# Retained bytes after a perfectly successful prune are `keep x stems x size`.
# `keep` is 2 and `size` is stable; `stems` is not, and it does not drift by
# accident — CLOUD-843's retirement campaign owes a `crates/batten/tests/*.rs` per
# retired gate, with 147 shell suites still standing. The series: ~41 distinct
# test stems resident in `deps` on 2026-08-20 (CLOUD-766), 110 tracked test files
# on 2026-08-29 (`git ls-files`, which is what `count` below is), 128 on
# 2026-08-30. Those first two counts were taken differently — one counts what was
# BUILT, the other what EXISTS — so they are not one series, and `count` is the
# second kind.
#
# THE 2026-08-30 MOVE, and which half of it is a measurement. The fact-family
# bundle added nine suites at once and took the live count 18 past the basis,
# which is this gate working: the floor it was defending was taken against a tree
# 18 stems smaller. **`warm` is re-measured** — `du -sm target` immediately after
# a successful prune on this container, 8064 MB at 128 stems, which is 63.0 MB per
# stem against the previous basis's 56.7 and so confirms the `keep x stems x size`
# model rather than assuming it.
#
# **BOTH ARE DERIVED, and the first draft of this block got that wrong.** It set
# `warm` to 8064 from a `du -sm target` taken after a prune — but that measures
# the WHOLE tree, cross-compile and release roots included, and the floor is the
# free space a warm CARGO basis needs. The number was ~800MB too high, and a floor
# too high refuses laps that would have been fine: measured, three consecutive
# `land` laps refused 168-255MB under it, on a tree every other gate passed.
#
# So both floors scale the previous DECLARED value by the stem model this basis
# already states. Warm: 6242 at 110 stems is 56.7 per stem, and 56.7 x 128 is
# 7264. Cold: 14914 at 110 is 135.6 per stem, and 135.6 x 128 is 17357. Neither
# is an independent measurement and the difference matters — an honest one needs a
# build from an empty `target` for cold and a minimal post-prune tree for warm,
# and a reader who needs either exact should take it rather than trust this line.
# Stating the derivation is what makes that choice available; a count refreshed
# without one denies it, which is what this block already warns about one
# paragraph up.
#
# A floor taken against a smaller stem count fails in the direction that fails
# silently: the check passes, the build writes more than the basis anticipated,
# and the exhaustion arrives as a rustc IO error inside a test run.
#
# `tolerance` is 10 rather than 0 because a gate that reds on the first added test
# file is one somebody switches off, and the thing being watched is a trend. When
# it does red, move `count` and `measured` TOGETHER: a count refreshed without a
# new measurement is the same staleness wearing a newer number.
#
# The comparison runs in `batten target prune` (Surface::VerifyOnly), never at
# config load — `Prune::validate` is on the path every mediated tool call pays.

[prune.warm.basis]
glob = "crates/batten/tests/*.rs"
count = 128
tolerance = 10

[prune.cold.basis]
glob = "crates/batten/tests/*.rs"
count = 128
tolerance = 10

# THE REGROWABLE ROOTS THE ESCALATION MAY DROP (CLOUD-1157), in the order it drops
# them, and each declaring whether losing it makes the next CARGO build a full one.
#
# The escalation used to know one directory name, `incremental`, written into the
# crate. Everything else this tree regrows was therefore outside the walk entirely
# — measured on a Claude Code web container: `target/semver-checks` at 2.6 GB,
# `target/perf` at 401 MB, `target/debug/build` at 156 MB. None of them is
# superseded by anything, so no retention rule can ever reach them; dropping the
# whole directory below the floor is the only honest reclaim, which is exactly what
# `incremental` already got.
#
# `cold` IS THE EXPENSIVE HALF AND IS NOT A HEDGE. It says the next `cargo` build
# has to start from nothing, which is what the 14914 MB cold floor above is
# budgeted for. `incremental` and `build` create that demand — one is rustc's own
# state, the other is every build script's output, and a dependent crate rebuilds
# without either. `semver-checks`, `perf` and `flycheck*` do not: dropping them
# makes only their OWN next run cold and leaves the cargo build warm, so declaring
# them `cold = true` would judge a lap against a full rebuild that never arrives.
# Over-refusal is not the safe direction here — a floor nothing can satisfy is the
# failure this table's comment already names.
#
# `flycheck*` carries the one wildcard the key allows, a single trailing `*` read
# as a prefix: rust-analyzer numbers a directory per instance (`flycheck0`,
# `flycheck1`, ...), so the set is open and an enumeration of it goes stale.
# MEASURED, AND `incremental` IS NOT BASIS-MOVING AFTER ALL (CLOUD-861, four live
# laps on a Claude Code web container, 2026-08-30). This row said `cold = true` on
# the reading that dropping rustc's incremental state guarantees a full rebuild. It
# does not: cargo still reuses every `deps` artifact whose fingerprint matches, so
# what is lost is rustc's within-crate state rather than the artifact set. The laps
# immediately following an escalation that took `incremental` consumed 228MB and
# 2852MB, against the 14914MB full-rebuild floor the flag was asserting.
#
# What that flag cost while it was wrong: the closing reclaim took `incremental` to
# clear its own floor, the next lap was admitted under 14914MB with ~8.1GB free,
# and `land` was refused on every second lap — for a full rebuild nothing had asked
# for, having freed the space that created the demand.
#
# THE REAL COLD SIGNAL IS THE TREE, and it is read directly now rather than
# inferred from a removal: `basis_of` reports `Cold` when `deps` is empty or absent,
# which is the state a full rebuild actually follows from, and it is true whoever
# emptied it — this reclaim, a `cargo clean`, a fresh clone, or a human freeing
# space by hand. The `cold` flag stays in the schema because a consumer whose
# reclaim really does destroy the artifact set needs it; on THIS tree no declared
# root does.
[[prune.regrowable]]
name = "incremental"
cold = false

[[prune.regrowable]]
name = "semver-checks"
cold = false

[[prune.regrowable]]
name = "perf"
cold = false

[[prune.regrowable]]
name = "flycheck*"
cold = false

# Build-script output, and `false` for `incremental`'s reason above: losing it
# reruns the build scripts and rebuilds what depended on them, which is a fraction
# of the artifact set rather than all of it.
[[prune.regrowable]]
name = "build"
cold = false

# ---------------------------------------------------------------------------
# What a commit subject must look like here (CLOUD-701).
#
# PRs land by fast-forward, so every commit reaches `main` with its own SHA and
# message, and release-plz derives semver and the changelog from those messages.
# That is why EACH commit must be conventional rather than just the PR title —
# and why this is policy rather than a lint preference.
#
# It used to be `CONVENTIONAL_RE` in `mise.toml [env]`. That file configures how
# tools are provisioned and run; a rule about what a commit may BE belongs to the
# engine that decides it, which is the correction `[attribution]` below is the
# worked precedent for (CLOUD-274).
#
# Consumer-specific by nature (non-negotiable rule 1): the vocabulary of types is
# this repository's answer, and the crate carries only the matcher.
#
# https://www.conventionalcommits.org/en/v1.0.0/
[commit]
subject_pattern = '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)([(][a-z0-9._-]+[)])?!?: .+'

# ---------------------------------------------------------------------------
# What produced commits may carry about the tooling that made them (CLOUD-274),
# enforcing the agent-neutral attribution decision record (CLOUD-268).
#
# The record separates three surfaces. AUTHORSHIP (author/committer,
# Co-authored-by, Signed-off-by) asserts accountability, which attaches to the
# identity that directs, reviews and adopts a change and never to a model.
# DISCLOSURE (one trailer in tool-identity form) asserts what tooling assisted,
# and communities diverge from disclosure-required to AI-forbidden, so it is a
# per-repo choice. PROVENANCE RECORDS carry the full answer and are Batten's own
# observability rather than git.
#
# WHY THE VENDOR LITERALS ARE HERE. This is the answer, not the mechanism:
# `crates/batten` holds the matcher and carries no vendor string, which extends
# non-negotiable rule 1 from consumers to vendors. A grep of `crates/` for any
# pattern below returns nothing, and the crate's own test suite asserts it.
#
# WHY THIS IS A GATE AND NOT A SETTING. Measured 2026-08-09: 39 of the first 50
# commits on `main` were authored by the injected vendor identity, 18 carried a
# model-versioned co-authorship trailer, 20 a session URL. The injection is
# environment-level and the host's own suppression setting does not govern every
# path, so the invariant is only checkable on the produced commit.
[attribution]
# Authorship. Both fields are judged: a repair reaching only `author` leaves the
# vendor identity on every commit's `committer`, absent from `git log`'s default
# format and fully public regardless.
identity_deny = [
  '^Claude <',
  '@noreply\.anthropic\.com>$',
  '\bclaude-(opus|sonnet|haiku|fable)\b',
]

# Trailers, matched against the whole `Key: value` line — a co-authorship form
# lives in the key, a session URL in the value.
#
# `^Assisted-by:` is here despite being the ALLOWED shape, and that is not a
# contradiction: deny is the default and `trailer_allow` below is the carve-out,
# so this one pair expresses every posture.
trailer_deny = [
  '^Co-Authored-By:.*(Claude|[Aa]nthropic)',
  '^Claude-Session:',
  'claude\.ai/code',
  '^Assisted-by:',
]

# Attribution-as-advertising in the message body. Narrow on purpose: a phrase
# whose function is a credit line, not any mention of a tool.
body_deny = [
  '[Gg]enerated with .*(Claude|Anthropic)',
  '🤖 Generated with',
]

# The carve-out from `trailer_deny`. EMPTY, and the emptiness IS this repo's
# posture — the record's §2.2 decided silent-with-records for Button repos, so
# nothing is exempt and every disclosure trailer is refused. A consumer that
# discloses sets the tool-identity shape here instead of touching any code:
#   trailer_allow = ['^Assisted-by: [a-z0-9-]+:[a-z0-9.-]+$']
# Empty means NO exemption, never "exempt everything" — an empty regex matches
# every input, so the engine branches on emptiness rather than compiling it.
trailer_allow = []

# The accountable identity `batten attribution identity` writes into the
# repo-local git config. Consumer-specific by nature: who answers for this
# repository's commits is a property of this repository.
[attribution.identity]
name = "Alec Wenzowski"
email = "alec@wenzowski.com"

# `mise.lock` joins the surface for a reason the other four do not share
# (CLOUD-581). A receipt records the epoch at its subject commit, so whatever is
# tracked here is what a receipt can later be held to. The clause list of an
# adopted external verifier — an SBOM conformance checker's standard edition, say
# — is owned and versioned by that tool, so the *edition* a check judged against
# lives in the pin and nowhere else. Without the lockfile in this set, a receipt
# reading "check X passed for SHA Y" cannot answer "against which edition", which
# is precisely the overclaim CLOUD-132 bounds.
#
# The cost is stated rather than discovered: a pin bump now moves the epoch and
# invalidates receipts, exactly as an AGENTS.md edit already does. That is the
# intended direction — a toolchain change IS a change in what decided the check.
[epoch]
# `.mcp.json` is here for the agent-context record (CLOUD-579), which covers the
# agent config a repository governs itself with through the epoch rather than by
# naming those paths in the engine — `crates/batten` must contain no consumer's
# filenames (rule 1). Which agent config governs a repository is that
# repository's business, so this is where the answer belongs.
#
# The record's own `coverage` states the limit this does NOT close: the file
# declares what the repository asks for, while the harness injects servers at
# runtime that are written to no file at all. Tracking it binds the declaration,
# never the effective set.
tracked = [
  "batten.toml",
  "AGENTS.md",
  "hk.pkl",
  "mise.lock",
  ".mcp.json",
  ".claude/settings.json",
]

# The contract surface a running session read at start (CLOUD-461). When one of
# these moves, `batten hook` tells the session once, on the advisory channel —
# hooks and instruction files are session-start snapshots (CLOUD-187), so a
# contract that lands mid-session binds nothing until it is re-read.
#
# NOT `[epoch] tracked`, and the difference is why both tables exist. That one is
# literal paths read one file each, because a config epoch must be a function of
# a STATED set — otherwise the value moves because of what happens to exist
# beside it. This one is globs over a rules directory and a task tree, because
# here a newly added file IS the drift, which a stated set cannot see. The
# overlap between the two lists is real and deliberate: they ask different
# questions about some of the same files.
[contract]
tracked = [
  "AGENTS.md",
  ".claude/rules/**",
  ".claude/settings.json",
  "hk.pkl",
  "mise-tasks/**",
]
# The subset that is the hook wiring, so the notice can say the wiring moved
# without the engine knowing any host's file layout (CLOUD-525). Literal paths:
# a glob here would let the notice claim the wiring moved because something
# merely near it did.
wiring = [".claude/settings.json"]

# ---------------------------------------------------------------------------
# What this repository attaches to hook events (house-style §9).
#
# THE `exclusive` CAPABILITY LANDS HERE UNDECLARED, AND THAT IS THE DECISION
# (CLOUD-893). `[hook] exclusive = true` says the only hook batten may register
# natively into any harness is `batten hook`, with nothing beside it. The engine
# half is built: `HookConfig::exclusive` in `action.rs`, and `doctor.rs` reports a
# sibling COUNT unconditionally and refuses only under the flag — because whether
# a hook beside batten's is legitimate is a consumer's judgement and
# `crates/batten` may not hold one (non-negotiable rule 1).
#
# WHY CONSUMER #1 DOES NOT YET DECLARE IT. The flag is GLOBAL rather than
# per-event: `doctor.rs`'s committed-surface scan refuses any non-batten entry
# under ANY event key, in every harness file. So declaring it obliges every
# remaining shell registration to move behind the door in the same change — and a
# guard cannot go behind the door without changing how it denies, which
# `shell-retirement` refuses for a governed file that is edited rather than
# retired. Two of this repository's guards cannot be retired yet (`run-shape-guard`
# on CLOUD-856, `hooks-wiring-check` on the `$HOME` surface), so declaring the flag
# would force exactly the edits the ratchet exists to refuse.
#
# The capability is therefore shipped and unused, which is the honest state: a
# consumer with no unretired registrations can declare it today, and this one
# declares it when its last guard retires rather than by editing bash to qualify.
#
# THE FIRST HANDLER, AND IT IS A WORKED EXAMPLE (CLOUD-898). `[[hook.action]]`
# shipped with one because a plugin surface nobody uses is a surface nobody has
# tested; the same standard applies here, and this row is that test on the real
# wiring rather than in a fixture.
#
# `mcp-attach-check` was registered directly in `.claude/settings.json` beside
# `batten hook`. It is now dispatched BY `batten hook`, which changes nothing
# about what it decides and everything about what holds around it: the parent
# imposes the timeout, fail-open is central rather than re-derived in the
# script's own error paths, and its exit code and stdout are read under one
# stated contract instead of whatever each script happened to spell.
#
# WHY THIS ONE FIRST. It is the cheapest honest proof: it takes no arguments, it
# is already silent on success (CLOUD-891), and its verdict is a plain exit code
# — so a difference in behaviour after the move would be the DOOR's doing rather
# than the script's, which is what makes it a test of the door.
#
# `timeout_ms` is stated rather than defaulted, because the default exists for
# handlers nobody measured and this one IS measured: it reads MCP logs and
# returns in tens of milliseconds. A bound two orders above the measurement is
# generous without being meaningless.
#
# `owner` AND `expires` ARE WHAT MAKE THIS A DEBT RATHER THAN A DESTINATION
# (CLOUD-984). The door makes a dispatched program safe — a bound, central
# fail-open, one stated output shape — and none of that makes it POLICY. A
# predicate living behind a spawn is one a reader of the committed authority
# cannot discover, so a handler is always somebody's debt, and these two columns
# name the creditor and the date. `doctor` reports an unowned or overdue row;
# nothing switches the handler off, because a dispatched program that silently
# stopped running is the fail-open this surface exists to close.
[[hook.handler]]
id = "mcp-attach-check"
on = "user-prompt-submit"
run = ["mise-tasks/mcp-attach-check.sh"]
timeout_ms = 2000
owner = "CLOUD-312"
expires = "2027-02-28"

# CLOUD-312 row 5: `connector-allow-guard` retires THROUGH THE DOOR rather than
# into a row, and the destination is a correction to CLOUD-312's own table.
#
# THAT TABLE SAYS "config — needs a connector-grant table in `batten.toml`". The
# grant table is the easy half and it would not have been enough. What this decides
# is not only WHICH verbs are permitted — the committed permission file already
# states that — but which committed server a LIVE exposed name refers to, and it
# answers that by reading the session's injected MCP config out of `/tmp`,
# extracting an endpoint URL, percent-decoding it and comparing. That is a property
# of the WORLD, not of the commit, and no `mediated_call` row can express it:
# `RuleKind::scopes` pairs every spawning kind with `RuleScope::Tree` alone, pinned
# by `no_mediated_call_kind_spawns_a_process`.
#
# So this is row 8's shape arriving early — an external program that stays external
# BY INTENT, dispatched by `batten hook` instead of registered beside it. What the
# move buys is what the worked example above buys: the parent imposes the timeout,
# fail-open is central rather than re-derived in the script's own error paths, and
# the verdict is read under one stated contract.
#
# PER CALL, NEVER ONCE, which is why it is a hook at all. The name flip is
# bidirectional and mid-session — one session went readable -> UUID -> readable —
# so anything resolving a name once and caching it for the session is wrong for
# part of that session by construction. The predecessor was specified as a
# `SessionStart` repair and that shape cannot work.
#
# `timeout_ms` is MEASURED, not defaulted, and held to `mcp-attach-check`'s
# standard: 20 runs against a UUID-spelled tool, p50 31ms, p95 37ms, max 39ms — two
# `jq` reads and a glob, no network. 2000 is two orders above the measurement,
# which is generous without being meaningless. A bound tighter than the real path
# would turn a fail-open handler into the absence the hook exists to close.
# `matcher` IS THE NARROWING, AND WITHOUT IT THIS ROW WAS A REGRESSION. `selects`
# narrows by EVENT, which is enough for a handler on `user-prompt-submit` — it fires
# once a turn — and not for `pre-tool`, which fires on every tool call. Measured
# 2026-08-25 with the row unnarrowed: 19.6ms p50 on a `Bash` call and 19.9ms on a
# `Read`, against a `wired` path whose whole p50 is 21ms. The guard this replaces
# was registered under exactly this matcher and never saw those calls, so the door
# would have doubled the mediated path to consolidate a guard.
#
# THE PREFIX, NOT A SUFFIX, and that is the guard's own predicate rather than a
# convenience: `connector-allow-resolve` exits `silence` unless the name is
# `mcp__<server>__<verb>`, so what it needs is "any MCP call" — which a suffix
# selector structurally cannot say. It names no SERVER, which is what keeps it clear
# of CLOUD-178's trap; `Handler::validate` refuses a matcher that does name one.
#
# THE NARROWING IS MEASURED, back to back on one machine through `batten hook`:
#
#   call    unnarrowed   narrowed
#   Bash      41.5 ms     21.4 ms
#   Read      41.4 ms     21.1 ms
#
# Halved, and the half that goes is the spawn. `mcp__*` calls still pay it, which is
# the point — they are the calls this decides.
#
# THIS ROW IS DECIDING NOTHING TODAY, AND THAT IS RECORDED HERE RATHER THAN FIXED
# (measured 2026-08-26, still true on `main`). The guard writes its verdict as a
# `hookSpecificOutput` document on stdout and exits 0. Behind the door
# `handler::impersonates_host` reads that shape BEFORE the exit code, returns
# `Outcome::Broke(ImpersonatedHost)`, and every `Broke` variant ALLOWS — so the
# verdict is reported as a pointer and dropped. Its own bats suite is green
# throughout, because a suite that never drives the real dispatch cannot see it.
#
# What made the loss invisible: every deny in the committed table is also covered
# by an unrelated engine row over the same tool, so a refusal still reached the
# host — from somewhere else. Only the ALLOW half, which nothing else provides, is
# actually gone, and with it the approval prompt CLOUD-191 exists to remove.
#
# WHY IT IS NOT REPAIRED HERE. The fix is one `case` in the guard's `decide()`,
# and that is an EDIT to a governed file, which `shell-retirement` refuses unless
# the file is retired instead. It cannot be retired: it reads
# `/tmp/mcp-config-cse_*.json` per call — off-tree, per-session, unstable — which a
# Rego module may not do (`Authority::Supplied` opens no file), and a Rust port
# would carry one consumer's file layout and vocabulary into `crates/batten`
# against non-negotiable rule 1. So the repair needs a decision this PR does not
# own, and `preapproves` is left undeclared because it cannot fire while the
# document is dropped — declaring it would assert a reach this row does not have.
[[hook.handler]]
id = "connector-allow-guard"
on = "pre-tool"
run = ["mise-tasks/connector-allow-guard.sh"]
matcher = "^mcp__"
timeout_ms = 2000
owner = "CLOUD-312"
expires = "2027-02-28"

# CLOUD-312 row 8: `mcp-allow-check --session` retires THROUGH THE DOOR, beside its
# own sibling. `mcp-attach-check` above went first as the cheapest honest proof of
# the door; this is the same event and the same shape, so what is left to decide is
# only the two things that differ.
#
# NO MATCHER, DELIBERATELY. Row 5 needed one because `pre-tool` fires per tool call,
# so an unnarrowed handler doubled the mediated cost of every call it was silent on
# (measured: 41.5 ms against a 21 ms path). `user-prompt-submit` fires once per
# prompt and carries no tool, so there is nothing to narrow and a matcher here would
# be a column that reads as a restriction and expresses none. The absence is the
# statement.
#
# THE ARGUMENT IS THE WHOLE POINT OF THE ROW. This file's own scope split lives on
# `--session`: three predicates are pure functions of the committed settings, so they
# belong to the commit and run in the hk gate and CI; the fourth reads which servers
# THIS session attached, which is a property of the world. Only this registration
# passes the flag, and moving it here keeps that split declared in the one authority
# rather than spelled in a settings file the gate cannot read.
#
# ITS `exit 2` IS SAFE HERE, and that is a property of the door rather than luck.
# The script exits 2 for could-not-look — unparseable settings, or no `jq` on the
# PATH a by-path hook inherits — and 2 is the deny code. A deny at
# `user-prompt-submit` is DEMOTED TO ADVICE (`lib.rs`, "a refusal is demoted to
# advice on a moment that cannot carry one"), so an unreadable settings file reports
# and never costs the author their prompt. Registered directly, the same exit was
# whatever the host chose to make of it.
#
# `timeout_ms` is measured rather than defaulted, like its sibling: the three
# committed-settings predicates are `jq` over one file, and the session predicate
# reads the generated MCP config and the client's logs. It returns in tens of
# milliseconds warm, so 2000 is two orders of headroom.
[[hook.handler]]
id = "mcp-allow-check"
on = "user-prompt-submit"
run = ["mise-tasks/mcp-allow-check.sh", "--session"]
timeout_ms = 2000
owner = "CLOUD-312"
expires = "2027-02-28"

# ---------------------------------------------------------------------------
# THE REFUSAL VOCABULARY (CLOUD-1050).
#
# A refusal used to be a free string. `policy::Violation { rule, msg }` carried
# prose no mechanism could check, so every remedy defect CLOUD-122 and CLOUD-871
# named was expressible and none was checkable: a refusal could name no remedy,
# name a task that does not exist, offer an override with no precondition, or
# spell one concept nineteen ways, and all of it passed a `String`.
#
# Now a refusal is `{rule, verdict, subjects}` and this table is where the prose
# went. Each row declares a CLASS: a stable token, one line of gloss for the hot
# path, the class definition `batten policy explain` answers with, and a closed
# route list — at least one, and never an override alone, because "ask for it to
# be waived" is the bare no the contract exists to refuse.
#
# THREE THINGS ARE GATED HERE RATHER THAN CONVENTIONAL. Well-formedness at parse
# (`verdict::validate`); registry equality at load, in both directions, so a
# token no row declares is refused and a row nothing raises is refused; and route
# TARGET resolution by `policy/verdict-routes-resolve.rego`, which is a module
# rather than a line of Rust because whether `mise run x` names a task is a
# question about a task RUNNER and non-negotiable rule 1 keeps the core ignorant
# of one.
#
# THE VENDORED HALF IS NOT HERE. Classes the binary ships — its native refusal
# sites and the vendored presets' — are declared in `crates/batten/src/verdict.rs`
# and unioned in at load. A preset reaches a consumer who wrote no row at all, so
# holding it to this table would make an enabled preset unloadable with no fix
# available. Declaring a token this binary vendors is refused as a collision.
#
# The gloss is bounded at 120 characters and one line, and that bound is the
# mechanism behind CLOUD-1053: the hot path prints token, gloss and pointer, and
# a gloss nobody bounded is how the paragraph comes back.

[[verdict]]
id = "V-FORGE-VERDICT-NOT-GREEN"
gloss = "the forge judged this commit and its fan-in check did not pass"
class = """
`final` is the fan-in every required job feeds, and CLOUD-900 records what naming the leaves instead buys: every failure becomes manufacturable by omitting a job. A recorded verdict that is anything but `success` on that check means the forge looked and refused. This is the DECISION half only — the polling stays outside the engine per CLOUD-1177 — so the remedy is to fix what CI refused and let the producer record the next verdict, never to re-read this one.
"""

[[verdict.route]]
id = "R-READ-THE-CI-CONTRACT"
kind = "document"
target = ".claude/rules/toolchain.md"

[[verdict.route]]
id = "R-LAND-DRIVES-THE-LOOP"
kind = "command"
target = "mise run land"

[[verdict]]
id = "V-DENIALS-OUTLIVE-THE-TURN"
gloss = "this session recorded refusals and the turn is ending again anyway"
class = """
The session's own record counts hook runs that denied, and the agent is stopping a second time with that count still standing. A first stop after refusals is work concluding; a repeat one is a finding produced and then left behind, which is the question `finding-sink-check` reads a transcript to answer. The count is derived from a hook run's exit code rather than from any prose, and no span of session text reaches this decision. A session with no transcript is never this class -- that is could-not-look, and reading it as clean is the false green CLOUD-990 measured.
"""

[[verdict.route]]
id = "R-RESOLVE-THE-REFUSAL"
kind = "document"
target = "policy/denials-outlive-the-turn.rego"

[[verdict]]
id = "V-TASK-SUBSTITUTION"
gloss = "this call is a weaker spelling of a task the project already defines"
class = """
The project defines a task whose own argv leads with the same program, so this call runs the tool directly and skips whatever the task adds -- strictness flags, a pinned toolchain, a paired step. The refusal names the task because that name IS the remedy: run it instead. A task with no single-command body is never matched, so this cannot refuse a call by naming a command the task does not actually run.
"""

[[verdict.route]]
id = "R-RUN-THE-TASK-INSTEAD"
kind = "document"
target = "policy/task-substitution.rego"

[[verdict]]
id = "V-CLAIM-BEFORE-CODE"
gloss = "a declared row was captured and carries no project"
class = """
The capture store answered for this row's declared key and the payload carries no project, so the row is unfiled and no board state can be read about it. Asked rather than a status because the store has no clock: it keeps every read and answers from the first in digest order, so a predicate over a mutable field would report a state that has since moved. Absence is not this class -- a key nothing captured leaves the id out of the map entirely, which is could-not-look and never a verdict.
"""

[[verdict.route]]
id = "R-CLAIM-IT-BY-HAND"
kind = "command"
target = "mise run claim-check"

[[verdict]]
id = "V-VALIDATOR-VERDICT-UNCLEAN"
gloss = "a third-party validator judged this file and reported something"
class = """
The record exists under this row's exact key -- the declared tool, the version it was pinned at, and the digest of the bytes it read -- so a validator ran over THIS revision and did not report clean. Absence is not this class: a record under any other key is not found at all, which is what keeps a stale verdict from reading as a fresh one. The remedy is to fix what the validator named and let the producer record the next verdict, never to re-read this one.
"""

[[verdict.route]]
id = "R-VALIDATOR-DECIDES-ITS-OWN-FINDINGS"
kind = "document"
target = "policy/validator-verdict-clean.rego"

[[verdict]]
id = "V-RELEASE-TAG-SHAPE"
gloss = "a release tag does not carry the shape this repository's release tooling mints"
