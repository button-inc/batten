The regression CLOUD-316 is actually about, and the reason the pin exists at all. \
A bare `mise exec --` provisions every tool in the manifest before exec'ing \
anything, so one unrelated tool failing to install takes the server down with it. \
It also removes every version reference, which is why a version-only predicate \
would report "nothing to check" and pass the defect it was written for. Selected \
by `args[0] == "exec"` rather than by the command name, so the CLOUD-714 shim is \
