gloss = "a row this branch filed names code this branch has open"
class = """
The punt CLOUD-514 is about. A defect you found in your own diff is a defect you \
are already holding the file for, so spinning it onto the board is cheaper than \
fixing it — and the board becomes the escape hatch every other guardrail points \
at. There is deliberately NO PROSE REMEDY: the first refusal charges a Ready \
block and a Ready block is payable in typing; this one is not. It judges no \
content and reads no tracker — it intersects the tracked paths the row's body \
names with this branch's own diff, and exempts a row the PR closes, a row \
written before the branch existed, and a row whose declared source of truth \
names none of the diff.
"""

[[verdict.route]]
