# Batten's own policy configuration.
#
# Consumer #1 is Batten itself: this checked-in file is what `batten check` runs
# against this repository. It is intentionally minimal at the scaffold stage and
# grows as the rule and check engine lands.
#
# Configuration is one committed authority (this file) plus raise-only overrides
# (env vars, flags, and a git-ignored batten.local.toml that may only tighten
# policy). There is no upward directory walk and no conf.d merge surface. See the
# Batten house style, §8.

# The config schema version. This build supports version 1.
version = 1

# Minimum Batten version permitted to read this file (semver). Enforced: a binary
# older than this refuses to run rather than reporting green over rules it does
# not understand (exit 1 — a statement about the invocation, not a policy
# verdict). Equal or newer runs.
#
# Raised off 0.0.0 when this file started declaring `[epoch]` (CLOUD-32): a new
# key must be REFUSED by an older binary, never ignored. `deny_unknown_fields`
# is what actually forces that — an older build fails on the unknown key — and
# this floor states the intent so the refusal names the version rather than the
# key.
#
# Raised again for `[ci]` (CLOUD-54), to the version that introduces it. Not the
# version that will *release* it: release-plz bumps on landing, so naming the
# next tag would make this file refuse the very build that has to lint it. The
# floor is documentation-grade either way — `deny_unknown_fields` is what
# actually refuses an older binary.
#
# And again for `[attribution]` (CLOUD-274), on the same reasoning: a binary that
# predates the table cannot enforce the attribution policy, and silently ignoring
# the key would report green over a gate that does not exist in it.
#
# And again for `[commit]` (CLOUD-701): a binary that predates the table cannot
# enforce the subject convention, and silently ignoring the key would report
# green over a gate that does not exist in it.
#
# And again for `[exec]` (CLOUD-429), which is the first table whose absence
# changes what a caller SEES rather than what a gate decides: a binary that
# predates it would tee the child's whole output to a caller that declared it
# wanted a record, and the caller would pay for bytes it asked not to be sent.
min_batten_version = "0.0.82"

# The ref work must land on (CLOUD-51) — the target `batten worktree status`
# judges uncommitted, unpushed, and unlanded work against.
#
# Consumer-specific by nature, which is why it lives here and never in the crate
# (non-negotiable rule 1): which ref is the trunk is a property of the repository
# being gated. The core ships no default, so an absent key means the gate has no
# target — exit 1, never a guessed one and never a vacuous pass.
#
# `origin/main` rather than `main`: this repo is trunk-based and lands by
# fast-forward, so the question is whether work reached the remote trunk. A local
# `main` can be behind, and judging against it would call work landed that only
# this checkout has seen. Read as it is on disk — the gate fetches nothing
# (agents fetch, gates decide).
#
# Merged-ness here is decided by patch identity, never ancestry, which is what
# makes the key usable at all: landing by rebase gives every landed commit a new
# SHA, so a landed branch is never an ancestor of the trunk and `git branch
# --merged` would report this repository's own finished work as outstanding
# forever.
#
# NOT to be confused with `unlanded` below it in the schema: that is a
# path-membership set the rule engine evaluates over tree content. VCS state and
# path membership are orthogonal, and one key meaning both is the conflation
# CLOUD-37 kept `scope`/`protected`/`unlanded` apart to avoid.
must_land_on = "origin/main"

# ---------------------------------------------------------------------------
# The protected-path gate (CLOUD-96): {mutating verb} × {protected path}.
#
# This is not a `[[rule]]` row and deliberately so. The gate is the INTERSECTION
# of the two tables below, and expressing an intersection as rules would need one
# row per verb × path pair — the config restating what a set operation already
# says. `batten hook` crosses them per mediated call.
#
# The incident: an agent retracting its own managed state reached for `rm`
# instead of the surface that owns the file. Managed state has a defined mutation
# path and a raw destructive verb bypasses its bookkeeping.

# Which paths are guarded. Consumer-specific by nature, which is why they live
# here and never in the crate (non-negotiable rule 1) — the engine holds the
# matcher, this file holds the answer.
protected = [
  # Agent memory: written through the Serena tools, never by hand.
  ".serena/memories/**",
  # The policy authority itself. Deleting it is the maximal weakening — it
  # disarms every gate at once, including this one.
  "batten.toml",
  # CI's definition of green.
  ".github/workflows/**",
]

# ---------------------------------------------------------------------------
# What to run instead, per protected path class (CLOUD-280).
#
# The refusal contract (CLOUD-122) is that every deny names the fix. CLOUD-96
# put that text on the `[[verb]]` row, which is right when the VERB knows the
# remedy and wrong when the PATH does: `rm` says "restore it with `git checkout
# --`", which is true of most files and actively misleading for a workflow,
# where the point is not recovering the bytes but that CI's definition of green
# changes under review.
#
# Consulted BEFORE the verb's own `redirect`; a class named here answers for
# every verb that reaches it. Declaration order decides, first match wins.
#
# WHY `.serena/memories/**` IS DELIBERATELY ABSENT, which is the interesting
# boundary of this table rather than an omission. Its remedy is not a property
# of the path alone: a write wants `write_memory`, an in-place edit wants
# `edit_memory`, a move wants `rename_memory` (the only route that rewrites
# `mem:` referrers), a delete wants `delete_memory`. The verb rows below already
# name the right tool per action, and a row here would OVERRIDE all four with
# one weaker sentence — the opposite of what this table is for. Per-path beats
# per-verb only where the path fact dominates; where the verb fact does, the
# fallback tier is the correct answer and not a leftover.
[[redirect]]
glob = ".github/workflows/**"
mutation = "change it in a pull request — these files are CI's definition of green, so the change has to be reviewed rather than restored"

[[redirect]]
glob = "batten.toml"
mutation = "change it in a pull request — this file is the policy authority every gate reads, and `mise run config-lint` is what checks the edit before it lands"

# ---------------------------------------------------------------------------
# The transcript substrate (CLOUD-95), and what it finally switches on: CLOUD-97's
# `completion.unlanded` — declared done with work not landed, the predicate this
# whole engine's thesis names. It had never evaluated once in this repository.
#
# WHY A SYMLINK, WHICH LOOKS LIKE A WORKAROUND AND IS NOT. This key is
# committed-authority-only and deliberately unlayerable (`resolve.rs`: "a local
# file redirecting it would be choosing the evidence"), and it is resolved as
# `root.join(path)` — one file, repo-relative. The host's transcript is neither:
# it lives at `~/.claude/projects/<slug>/<session>.jsonl`, a per-session absolute
# path no committed value can name. A layered override would let a branch point
# the detector at evidence of its choosing, which is the weakening `trust.rs`
# compares committed bytes for. So the committed value stays fixed and the
# INDIRECTION moves out of the config: `mise-tasks/stop-guard.sh` refreshes this
# path from the Stop payload's own `transcript_path` at each turn end. The
# authority names one file forever; which session it is, is the host's fact.
#
# Gitignored, and that is the point rather than housekeeping — a committed
# transcript would be a session's whole prose in the tree, the exact payload
# non-negotiable 4 keeps out of every report this engine writes.
#
# ABSENT IS THE ORDINARY STATE AND IS HONEST. No symlink — a fresh checkout, a
# non-Claude host, a `state record` run by hand — resolves to
# `Capability::Absent`, which reports `transcript::ABSENT_NOTICE` and changes no
# verdict. It is NOT read as clean: an open `completion.unlanded` finding HOLDS
# through an absent transcript, because a scan that could not look has not
# observed zero.
#
# `memory_root` is omitted, so `selfwrite::DEFAULT_MEMORY_ROOT` applies.
[transcript]
path = ".claude/.transcript.jsonl"

# ---------------------------------------------------------------------------
# Pinned tools (CLOUD-90), fetched and cached out of tree.
#
# ripsecrets is the scanner the `secrets` rule kind runs (CLOUD-59). Adopted
# rather than rebuilt — a credential is the banned shape nobody can enumerate, so
# detection is prior art and only CONTAINMENT is ours. Its license row is in
# CONTRIBUTING.md's table, resolved before the pin landed.
#
# THE CHECKSUMS WERE MEASURED, NEVER COPIED: each artifact was downloaded and
# digested locally rather than read off a release page. A copied checksum attests
# to what a page said, which is the one thing a pin is not for.
#
# The per-platform table exists because a compiled tool ships one artifact per
# target, and an entry carries exactly one of this or a bare `url`/`sha256`. Keys
# are `<os>-<arch>` off `std::env::consts`, so they name what a running binary
# knows about itself. CI is `ubuntu-latest` everywhere, so `linux-x86_64` is the
# only one CI exercises; the darwin rows are for contributors, and there is no
# `linux-aarch64` row because upstream publishes no such artifact — a machine
# that needs one gets exit 1 naming the key, never a silent skip.
[[provision]]
name = "ripsecrets"
version = "0.1.11"
unpack = "tar_gz"
binary = "ripsecrets"

[provision.platforms.linux-x86_64]
url = "https://github.com/sirwart/ripsecrets/releases/download/v0.1.11/ripsecrets-0.1.11-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "9daf017dfdea242a58f672450a2526f0406211afe9e872c740adc49b42feccf5"

[provision.platforms.macos-x86_64]
url = "https://github.com/sirwart/ripsecrets/releases/download/v0.1.11/ripsecrets-0.1.11-x86_64-apple-darwin.tar.gz"
sha256 = "21253f4d25be2626779c579c12e30aef1c67d7224cbed50eb7515a8cd45db56d"

[provision.platforms.macos-aarch64]
url = "https://github.com/sirwart/ripsecrets/releases/download/v0.1.11/ripsecrets-0.1.11-aarch64-apple-darwin.tar.gz"
sha256 = "b2c822742e8cbf355ba0cb4cc690c3cd8fdc9ec1916c8148f27bd9098cb7aee4"

# Batten gates this repository with its own engine — consumer #1 in practice,
# not just in principle. Rules below whose `scope` is "tree" run under `batten
# check`; rules whose `scope` is "mediated_call" are adjudicated by `batten hook`
# against one command at a time and are never evaluated by `check` (CLOUD-48).

# ---------------------------------------------------------------------------
# The `gh` lifecycle, as config rather than Rust (CLOUD-48).
#
# These four rows were a hardcoded `match` inside `crates/batten/src/hook.rs`.
# Moving them here is the point of the change twice over: the engine stops
# carrying one consumer's task names (non-negotiable rule 1 — `git grep -Fn
# "mise run land" crates/` now finds nothing outside a test fixture), and a
# reviewer can read exactly what will be refused without reading Rust (§9).
#
# `pattern` for a shape rule is the banned command line as you would say it: the
# first word is the effective program — matched AFTER wrapper look-through, so
# `mise exec -- gh pr merge` and `env GH_PAGER= gh pr merge` both match — and the
# rest are the adjacent non-flag words that must follow it.
#
# `reason` is required on a shape rule, unlike on a file rule: a mediated deny
# reaches a model as the entire explanation, so a refusal that named only its id
# would be un-actionable (CLOUD-122). The crate appends the bypass hatch.
[[rule]]
id = "gh-pr-merge"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr merge"
reason = """
`gh pr merge` (like the merge button) rewrites commits under new SHAs, \
discarding the exact objects CI tested. Use `mise run land`, which comments \
/fast-forward so main advances to this branch's already-passed commits."""

# The one row with a second condition. Only a comment carrying the landing
# directive is the lifecycle; an ordinary `gh pr comment` is not. The directive
# lives inside a quoted `--body`, so it is not one of the words `pattern`
# matches — `contains` looks at the segment as written, which is the only reason
# this key exists.
[[rule]]
id = "gh-pr-comment-fast-forward"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr comment"
contains = "fast-forward"
reason = """
Commenting /fast-forward by hand only STARTS the merge — it does not wait for \
it, and the usual pairing with a guessed `sleep` reports before the merge \
lands. Use `mise run land` (backgrounded): it comments, then blocks until the \
PR is MERGED or the fast-forward bot refuses."""

[[rule]]
id = "gh-pr-checks"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr checks"
reason = """
Hand-watching CI is the ad-hoc shape `mise run ci-wait` replaces. It polls \
check-runs for HEAD until every one is terminal, prints their conclusions, and \
exits non-zero unless all are green — with no timeout to reintroduce the \
VM-reap gap. Background it. (`gh pr view`/`list`/`create`, `gh pr ready`, `gh \
api`, `gh run view` are NOT blocked.)"""

[[rule]]
id = "gh-run-watch"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "gh run watch"
reason = """
Hand-watching CI is the ad-hoc shape `mise run ci-wait` replaces. Background \
it rather than holding a foreground poll open."""

# The toolchain pin, given a mechanism (CLOUD-271). AGENTS.md has said "never a
# bare `cargo`" since long before anything enforced it, which non-negotiable
# rule 2 calls half a change.
#
# NOT A BAN on `cargo`, and `require_via` is what says so: the row selects the
# program and then refuses only the calls that reached it without the pin.
# `mise exec -- cargo test` and `mise run test:cargo` are the sanctioned routes
# and stay open; a bare `cargo` does not, and neither does a wrapper hiding one
# (`env RUSTFLAGS=-Awarnings cargo build`), because the mediator is read from
# the segment as written.
#
# It cannot be spelled as a program comparison. `effective_program` looks
# THROUGH `mise exec` by design — that is what makes the four `gh` rows above
# survive the sandbox's wrapper form — so `program == "cargo"` denies the
# sanctioned route too. The objection here is to the toolchain SELECTION rather
# than to the program, which is a different question and needed its own key.
#
# `cargo --version` is denied along with everything else, decided rather than
# omitted: the row's subject is the program being reached, an argument-less
# reach is still a reach, and the redirect costs one `mise exec --`. A carve-out
# for read-only queries would be a hole that looks intentional.
#
# Why it matters TODAY, when a bare `cargo` fails loudly on its own: that is a
# version inequality, not a gate. The pin (1.97) currently sits above the
# ambient toolchain (1.94), so Cargo's own `rust-version` check refuses. When
# ambient passes 1.97 the inequality reverses and the bare call goes back to
# compiling silently against the wrong compiler — measured 2026-08-09, three
# gates disagreeing with a green local run.
[[rule]]
id = "no-bare-cargo"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "cargo"
require_via = "mise"
reason = """
A bare `cargo` resolves to whatever toolchain is ambient, not the pin in \
mise.toml, so a green local run can mean nothing. Use `mise run <task>` (\
`test:cargo`, `lint`, `verify`), or `mise exec -- cargo ...` for a one-off."""

# `issue-guard`'s naming half, as config (CLOUD-446).
#
# NOT A BAN, and the `requires_key` column is what says so: the row selects on
# the command shape exactly as the four above it do, and then refuses only the
# case where the work names no tracker key. `gh pr create` on keyed work is
# allowed and always was — which is why this is a modifier on a shape row rather
# than a kind, and why its refusal reads differently from theirs.
#
# THE VOCABULARY IS THIS REPOSITORY'S, and it has to be. `CLOUD-<n>` is Button's
# tracker, not Batten's, so the crate carries no part of this expression
# (non-negotiable rule 1) — the column takes any regex, and a consumer adopting
# this row edits a pattern rather than a match arm.
#
# Named exactly rather than generically, and that is the safer direction: a
# shape like `[A-Z]{2,}-[0-9]+` also matches `UTF-8`, `SHA-256` and `RFC-3339`,
# so a commit that merely mentioned an encoding would satisfy the gate. What a
# key looks like here is known, so it is written down.
#
# `(?i)` is load-bearing, not tidiness: the tracker's own `gitBranchName`
# produces `wenzowski/cloud-446-...` in lower case, so a case-sensitive
# expression would leave the branch-name source dead for every branch anyone
# actually has. `issue-guard` matched case-insensitively (`grep -oiE`) for the
# same reason, and the port keeps it.
#
# Three evidence sources, and each one is a way real work legitimately carries
# its key: the command itself (`--body "Closes CLOUD-1"`), the branch name, and
# the commit subjects on `base..HEAD`. Any one of the three allows. `base` names
# the range rather than the crate hardcoding a trunk, for the same reason as the
# expression — and it is what keeps the trunk's own history from answering, since
# `origin/main` is full of other people's keys.
#
# WHAT THIS DROPS from the bash guard, stated rather than absorbed: `issue-guard`
# also read the existing PR's title and body over the network (`gh pr view`),
# which matters for `gh pr ready` because it carries no body of its own. A
# mediated call cannot make a network round trip against the <=100ms budget, so
# the ported half reads the checkout only. The lost case is a PR whose key
# appears ONLY in a body typed by hand — and `land` is the only readier here, on
# a branch the tracker named.
#
# The guard's OTHER half — refusing a key already claimed by a different open PR
# — is not here and cannot be: it needs `gh pr list` plus a `gh pr view` per
# competitor, and `RuleKind::scopes` pairs every spawning kind with
# `RuleScope::Tree` alone. It lands as a `tree`-scoped `command` rule under
# `batten enforce`, which is why `mise-tasks/issue-guard.sh` still exists.
[[rule]]
id = "pr-names-an-issue"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr create"
requires_key = '(?i)\bCLOUD-[0-9]+\b'
base = "origin/main"
reason = """
Search the board first (`mise run graph-check` prints the ready frontier), then \
name the issue: in the branch, in a commit on it, or in the PR body as `Closes \
CLOUD-<n>`. A PR that names no issue cannot move the board when it merges, so \
the work lands with nothing recording that it did."""

# The same predicate at the other publishing moment. Two rows rather than one
# because a shape row's `pattern` is one command line, and `create` and `ready`
# are two — the alternative would be a `patterns` list whose only user is this
# pair.
[[rule]]
id = "ready-names-an-issue"
kind = "shape"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr ready"
requires_key = '(?i)\bCLOUD-[0-9]+\b'
base = "origin/main"
reason = """
Readying publishes the work and starts CI. Name the issue in the branch or in a \
commit on it before readying — or use `mise run land`, which readies after its \
own push. A PR that names no issue cannot move the board when it merges."""

# `ready-guard`, as config (CLOUD-312, over CLOUD-203's receipt store).
#
# A `receipt` row is not a ban. It refuses a call whose PRECONDITION has not
# been proved, and the same call is allowed the moment the receipt exists —
# which is why it is a distinct kind rather than a shape row with a condition.
#
# Readying is the single event that starts CI, so it is the one precondition
# whose cost is paid in CI minutes when it is skipped. Both receipts are named
# in one row because the predicate is genuinely a conjunction: the branch must
# have verified AND still be linear on the trunk. Two rows would let one be
# deleted while the gate still looked whole.
#
# `key = "head"` is the default and is stated anyway, because it is the whole
# expiry contract: the receipt attests to THESE BYTES, so an amend, a rebase, or
# a moved `origin/main` must invalidate it rather than silently keep counting.
# The engine renders a distinct cause per verdict — missing, stale-head,
# stale-main — so the three refusals `ready-guard` wrote by hand survive the
# move without this file restating them.
[[rule]]
id = "ready-needs-receipts"
kind = "receipt"
scope = "mediated_call"
severity = "deny"
pattern = "gh pr ready"
checks = ["verify", "linear-check"]
key = "head"
reason = """
Run `mise run verify` (background it), then `mise run linear-check`, then \
retry — or just `mise run land`, which drives the whole loop. A red run on a \
freshly-readied PR means that step was skipped, and the CI minutes are already \
spent by then."""

# `claim-guard`, as config (CLOUD-444) — the other half of the pair
# `ready-needs-receipts` starts, and the one the receipt kind could not express
# until this change.
#
# TWO COLUMNS DO THE WORK, and neither is a tuning knob:
#
#   trigger = "write"  The precondition is due before the work is TOUCHED, not at
#                      some recognisable command. `issue-guard` fires at `gh pr
#                      create`, which is the END of the work; the edit this
#                      catches is the first one, whatever tool makes it. No
#                      command shape can express that, which is why every write
#                      went unjudged by anything but the protected-path gate.
#   key = "branch"     A claim attests to a decision about an ISSUE, and every
#                      commit on the branch continues to serve it. A HEAD-keyed
#                      claim would expire on every commit and amend — the
#                      false-positive rate that gets a guard bypassed, so the
#                      wrong keying here would not merely annoy, it would end
#                      enforcement.
#
# What is NOT here, deliberately: the exclusion set. Git-ignored paths, paths
# outside the repository and `.git/*` are never judged, and those are questions
# about a checkout rather than policy — so they live at the boundary
# (`receipt::judgeable`) and this file does not restate them. A detached HEAD has
# no branch to key a claim on and therefore allows, which is what keeps a rebase
# conflict resolution — the one moment the contract says a human decides —
# editable.
#
# The receipt is minted by `mise run claim-check` on its pullable path, and that
# task's write side is untouched by this row: the engine reads the file it already
# writes.
[[rule]]
id = "claim-needs-receipt"
kind = "receipt"
scope = "mediated_call"
severity = "deny"
trigger = "write"
checks = ["claim"]
key = "branch"
reason = """
Pull the issue first: search the board (`mise run graph-check` prints the ready \
frontier), then pipe the issue's `get_issue` payload to `mise run claim-check`. \
It exits non-zero if someone is already on it, and mints the receipt if not. \
Then move it Todo -> In Progress and assign yourself — the tracker automation \
will not, since it fires on the PR event. Scratch work is not gated: anything \
git-ignored, anything outside the repository, and anything under `.git` is never \
judged.

Where the payload comes from (CLOUD-990): `mise run board-payloads <id>` on a \
host with a transcript, or `batten capture show <handle> --raw` on any host — \
`batten capture list`, then `--grep '"id":"CLOUD-N"'` to find the handle. A CCR \
container writes no transcript, so the second is the only one that answers there. \
Both hand over bytes the tracker returned; do NOT re-type a payload by hand."""

# `run-shape-guard`'s three verdict shapes, as config (CLOUD-443).
#
# Every shape below FAILS GREEN — exit 0 with plausible output — which is why
# noticing them repeatedly did not stop them. The measured record: two confident
# "green" reports over a failed `verify`, a `git push` that had returned `stale
# info` at exit 1 re-run alone and reported as compliance, and a `cargo clippy`
# whose ANSI-coloured output no `^error` anchor could ever match.
#
# WHY THIS IS ITS OWN KIND rather than a `shape` row. A shape row matches a
# program and its adjacent words; these three are about the STRUCTURE the command
# sits in — what its status is handed to, what replaces it, whether it was
# detached. The engine's parser used to split on exactly those operators and throw
# them away, so no amount of word matching could see them.
#
# `&&` IS NOT DENIED, deliberately. It short-circuits, so a failure still
# propagates and there is no false green to stop; denying it would be a pure false
# positive, and a guard with false positives gets bypassed.
#
# The two tables are the consumer's, and they hang off the rule rather than the
# config root because they are what this rule is DEFINED OVER — a global table
# would be a second authority with no other reader.
# A shell program says so in its name (CLOUD-864/CLOUD-865). Measured on this
# tree: 143 tracked files begin with a shell shebang and end in neither `.sh` nor
# `.bash`, 136 of them under `mise-tasks/`.
#
# THE COST IS PAID PER TOOL, WHICH IS WHY IT IS A RULE AND NOT A PREFERENCE. hk's
# shellcheck reaches them, because its builtin selector does shebang detection —
# `hk check --all --step shellcheck -v` batches 146 files. A syntax matcher
# pointed at the directory scans nothing and exits `0` — CLOUD-310 measured that
# against this tree and owns the per-component disposition. Serena's bash LSP
# matches none of them either: `FilenameMatcher(".sh", ".bash")` is
# extension-only, and `add_extensions` is wired for two other languages alone.
# Two of three silently blind,
# independently — and hk.pkl documents the dependency as a JUSTIFICATION for the
# naming rather than as the risk it is.
#
# A PRESET RATHER THAN A LOCAL MODULE because nothing in the predicate is this
# repository's: any tree with extensionless shell pays the same toll with every
# instrument it adopts. The consumer's contribution is the glob and the excludes.
#
# `line_sources` rather than `lines`: the rule decides over 137 programs, and a
# row naming them one by one is a list that goes stale the next time somebody
# adds a task — silently, green, which is the failure the declaration bound
# exists to prevent.
[[rule]]
id = "shell-hygiene"
kind = "policy"
scope = "tree"
preset = "shell-hygiene"
severity = "deny"
#
# THE DECLARATION IS THE EXCLUSION, and nothing else is needed. Six of the 143
# extensionless shell files in this tree are FIXTURES — probes for this exact
# class, which a gate must still handle and which a rename would delete as test
# data. They sit under `tests/fixtures/` and `crates/**/fixtures/`, and no glob
# below selects them: `Selector` sets `literal_separator(true)`, so `*.sh` does
# not cross a `/` and neither of the two directory globs reaches a fixture tree.
# A row reads the paths it names and no others, which is the bound doing the work
# an exclusion list would otherwise do badly.
#
# `.bats` is deliberately absent: those carry `#!/usr/bin/env bats`, which is not
# a shell interpreter, so selecting 145 more files would buy 145 reads and zero
# findings. Whether shellcheck should read them is CLOUD-382's question, not this
# row's.
line_sources = ["mise-tasks/**", ".claude/hooks/**", "*.sh"]
#
# ONE ROW, TWO RULES, and the finding says which — `attribute()` reads the
# violation's own `rule` and falls back to this id only when a module raises none.
# The pair is not a bundle of convenience: the second rule is the FIRST one's
# aftermath. Renaming 138 programs broke 16 constructed sibling paths that no
# textual pass could see, every one of them guarded by `[ -x "$p" ]` and an
# `exit 0`, so six gates in the Stop hook ran over nothing and still reported
# clean. They were recovered by executing suites one failure at a time. A
# consumer adopting the extension rule inherits exactly that hazard, so it must
# inherit the gate for it in the same preset.
reason = """
Two properties of a shell program's NAME. It says its language — `.sh` or \
`.bash` — because a shebang is a content selector only tools that read the \
first line honour, and one that does not covers the file silently and exits 0. \
And a sibling it builds at run time (`"$(dirname -- "${BASH_SOURCE[0]}")/x"`) \
names a file the tree carries, because every caller of that shape guards it and \
exits 0, so a stale reference goes quiet rather than failing."""

# The substitution family of the same kind (CLOUD-864). Measured over one
# session's transcript: 34 of 38 Bash calls had a first-class tool that does the
# job, and `Read`/`Grep`/`Glob` were used ZERO times — 15 `head -N`, 13 `grep`,
# 12 `ls`, 5 `cat`, 5 `sed -n`, 2 `find -name`.
#
# THE ROW IS ON THIS KIND BECAUSE OF WHAT DISTINGUISHES THE TWO CASES, and there
# is no other kind that can hold it. `grep pat crates/` answers a question `Grep`
# answers better; `git ls-files | grep crates/batten` is a filter over another
# command's output that no tool replaces. Same program, same operand, opposite
# verdicts — only the POSITION separates them. A `shape` row cannot see it:
# `matching_shape_rows` iterates every segment with no index in scope, so it
# would refuse the filter too. This kind is already defined over what surrounds a
# command, which is exactly the fact in question.
#
# The list is the consumer's, like `filters` above. Another repository's `awk` may
# have no better answer available; here every one of these has one.
#
# WHAT IT DELIBERATELY DOES NOT CATCH, so nobody reads silence as coverage: a
# path reached through a shell variable (`grep "$p" "$d"` names no path the
# parser can see, and guessing would refuse work over an unnameable target); the
# native `Grep`/`Read` tools, which arrive as structured input rather than a
# command line; and anything outside the repository, which keeps the
# `>/tmp/x.log` form the row above MANDATES allowed.
[[rule]]
id = "no-tool-substitution"
kind = "pipeline"
scope = "mediated_call"
severity = "deny"
#
# `sed:-n` is QUALIFIED and the rest are not, on a distinction the corpus makes
# and a bare name cannot. `sed -n '1,40p' f` prints a range — `Read(offset,
# limit)`, and the single most-measured shape here. `sed 's/a/b/' f` transforms
# the stream, which no first-class tool does, so refusing it would tell the
# caller "a tool answers this directly" when none does. The other eight read a
# file or list paths in every mode they have, so they need no qualifier.
#
# `wc` stays unqualified deliberately: `wc -l f` has no range-read equivalent,
# but a count over a pattern answers the question that reaches for it, and the
# reason text names that capability.
substitutes = ["cat", "head", "tail", "sed:-n", "grep", "rg", "find", "ls", "wc"]
#
# THE REASON NAMES CAPABILITIES, NEVER PRODUCTS (CLOUD-998). It used to name
# `Read(offset, limit)`, `Grep`, `Glob` and Serena's symbol tools as literals.
# That is wrong wherever a session does not carry them — the structured surface
# is not guaranteed present, and a remedy naming an absent tool is unactionable
# in exactly the session that most needs one. The four questions below are what
# is invariant; which instrument answers them is whatever the session has.
reason = """
Reach for the structured surface this session offers rather than a text utility \
over a path this repository tracks: a range of one file's contents, a pattern \
across the tree, paths by glob, or what a NAME resolves to. \
`.claude/rules/scanning.md` picks between those question classes. Downstream of \
a pipe these same utilities are filters over another command's output and are \
not refused."""

[[rule]]
id = "verdict-not-discarded"
kind = "pipeline"
scope = "mediated_call"
severity = "deny"
# Pagers and filters alike: each substitutes output for status. `jq` is
# deliberately absent — it is composition rather than a verdict substitute, and
# widening to every pipe would deny ordinary work.
filters = [
  "tail",
  "head",
  "less",
  "more",
  "grep",
  "rg",
  "egrep",
  "fgrep",
  "awk",
  "sed",
  "wc",
]
reason = """
The compliant form is the command alone in the call, redirected to a file:

  mise run <task> >/tmp/<task>.log 2>&1

The tool result IS the verdict — read the log in a SEPARATE call. Pass \
run_in_background on the tool call itself for anything that can exceed ~2 \
minutes. A pager over a FILE is fine; a pager over a live task is not."""

# A task runner: `run` names a task and its exit status is that task's verdict.
# `mise exec`/`mise x` are not here — they run another program, and the engine's
# wrapper lookthrough judges the wrapped one instead.
[[rule.verdict]]
program = "mise"
subcommands = ["run"]

# The mutating VCS verbs. The read-only ones (`log`, `show`, `diff`, `status`)
# carry no verdict and compose freely, which is why this is an allow-list.
[[rule.verdict]]
program = "git"
subcommands = ["push", "fetch", "rebase"]

# A build tool has far more verdict subcommands than query ones, so this is the
# inverse reading: everything except the queries. A bare `cargo` names no action
# and is therefore not a verdict either.
[[rule.verdict]]
program = "cargo"
except = [
  "metadata",
  "tree",
  "locate-project",
  "pkgid",
  "search",
  "login",
  "logout",
  "version",
]

# The forge CLI dispatches twice, so the verdict is in the second word: `gh pr
# view` is a query, `gh pr merge` is not.
[[rule.verdict]]
program = "gh"
subcommands = ["pr"]
nested = [
  "create",
  "ready",
  "ready-for-review",
  "merge",
  "edit",
  "close",
  "reopen",
  "comment",
]

# A test runner (CLOUD-473). The argument is what makes the run a verdict: bare
# `bats`, `bats --version` and `bats --help` print usage and answer nothing.
# Added after this issue was written, and omitting it would retire a predicate:
# one suite was guarded through `mise run test:bats` and open through both
# `mise exec -- bats …` and a path-invoked runner, and a run piped to `tail`
# reported green over three failures, one of them a hang.
[[rule.verdict]]
program = "bats"
any_argument = true

# A conflict marker reaching a source file means a botched merge landed — and
# this row DELEGATES that check rather than re-implementing it (CLOUD-229).
#
# It used to be `kind = "forbid"`, `pattern = "<<<<<<< "`, which is a strictly
# worse copy of a checker hk already ships and this repo already runs. Measured
# against the pinned hk: a marker at the start of a line fails both, while the
# same seven characters inside a string literal fail only the substring match.
# That false positive is why `crates/batten/tests/cli.rs` had to assemble the
# marker at runtime — the test file would otherwise trip the gate it is testing.
# A workaround that exists to dodge your own rule is the rule telling you it is
# wrong, and AGENTS.md's scope reminder says the same thing in advance: adopt
# prior art, do not rebuild it.
#
# What the delegation states is the division of labour the config should have
# been stating all along. Batten owns **which paths are asked about, and what a
# non-zero exit means downstream** — the severity, the waiver surface, the
# receipt, the ready gate. The tool that already owns the check keeps owning it.
# Conflict markers are the right vehicle for showing that precisely because the
# check is trivial and owned elsewhere; a rule worth writing here is one no
# existing tool answers.
#
# The predicate is the EXIT CODE ALONE (CLOUD-93). hk's stdout is discarded, so
# what a finding reports is this rule's own pointer — the glob it selected, with
# no line number, since a command condemns a batch rather than a span.
#
# `{{files}}` expands in place to the matched paths, batched under the argv
# bound. THE GLOB IS A GATE BEFORE IT IS AN ARGV SOURCE: no match means no
# process is spawned at all, which is what keeps a delegating rule cheap on the
# commits it does not concern.
#
# WHY `crates/**` AND NOT `**`: the widening is deliberate and so is its bound.
# `crates/**/*.rs` was narrow because a substring grep over Rust mostly overlaps
# with what the compiler already catches — a justification that stops holding the
# moment the rule is neither a substring match nor Rust-only. `crates/**` reaches
# the files a botched merge corrupts and no compiler reads: the manifest, the
# changelog, and every fixture under tests/, including the `.toml.in` configs and
# the expected-stdout files whose bytes are the assertions. Going all the way to
# `**` is what the engine cannot honestly do yet: the walk skips only `.git`, so
# it has no gitignore, and a rule's `glob` is one pattern with no exclude form.
# Counted in this checkout, `**` selects 15326 files, 14665 of them build output
# under target/ — a delegate invoked over the compiler's own scratch space.
# Closing that is CLOUD-214 (`ignore` + `globset` behind the walk), not a wider
# glob here.
#
# `severity` (what a match does: "deny" fails the run, "warn" reports without
# failing, "allow" switches the rule off) is required on every rule — the
# default is stated here, never assumed. `scope` (where the rule looks) is a
# separate key with its own vocabulary; "tree" is the whole working tree.
# A credential in the tree (CLOUD-59). The kind runs the pinned scanner above and
# turns each match into a pointer; the engine never holds a matched byte where it
# could reach output, so this row cannot leak what it finds.
#
# `glob = "**"` because a secret can be in any file, and narrowing it would be
# choosing which files are allowed to carry one. The tree walk already excludes
# gitignored paths, so `target/` costs nothing.
#
# `enforce`, never `check`: the kind spawns, so the read-effect verb refuses the
# whole ruleset naming `batten enforce`. `mise run batten-check` already calls
# `enforce` for the same reason `no-conflict-markers` made it necessary.
[[rule]]
id = "no-secrets"
kind = "secrets"
glob = "**"
severity = "deny"
scope = "tree"
no_fix_reason = "rotate the credential and purge it from history; removing the line leaves it in every clone and every reflog, so no command can make this right"

[[rule]]
id = "no-conflict-markers"
kind = "command"
glob = "crates/**"
check = "hk util check-merge-conflict --assume-in-merge {{files}}"
severity = "deny"
scope = "tree"
no_fix_reason = "resolve the conflict by hand: choosing a side is a judgement no command can make"

# Appeal-to-authority attribution, retired from `mise-tasks/attribution-check`
# into the engine (CLOUD-881). The rule lives in
# mem:prior-art-and-issue-hygiene: once a practice is adopted it is ours, and a
# comment states the rule and the evidence rather than naming a third party.
# "As <project> does" is unevaluable by a reader and survives neither that
# project changing its mind nor being wrong.
#
# THE BASH THIS REPLACES WAS 93 LINES AND ITS SUITE 212, and the reason it is
# gone is DoR §2 rather than tidiness: extending it for a cargo manifest took
# four review rounds of regex narrowing and still could not answer the question
# (CLOUD-873, canceled). A `forbid` row expresses the prose half exactly, and
# the manifest half is the `policy` row below, which reads a parsed document.
#
# `glob = "**"` is the whole tree, which the task reached with `git ls-files`.
# Its three `:!:` path exclusions are GONE rather than translated, and each for
# a measured reason: `.serena/memories/prior-art-and-issue-hygiene.md` has zero
# uncoordinated hits (every mention in it carries a coordinate), and the other
# two were the task and its suite, which this change deletes.
#
# The lockfile arm went the same way. `^[^:]*\.lock:` matched grep's `path:line:`
# PREFIX, which a `forbid` row has no analogue for — `exclude` sees the line, not
# the path. Measured before dropping it: `Cargo.lock`, `fuzz/Cargo.lock` and
# `mise.lock` carry zero uncoordinated hits, so the arm exempted nothing.
#
# POINTER-ONLY IMPROVES HERE. The task printed grep's whole `path:line:content`
# hit, carrying the offending line into the finding; a `forbid` finding is
# `path:line` and a rule id (non-negotiable rule 4).
[[rule]]
id = "no-appeal-to-authority"
kind = "forbid"
glob = "**"
regex = "jdx|semgrep|opengrep|ast-grep"
exclude = "https?://|package://|aqua:|ubi:|npm:|pipx:|github\\.com|\\.dev|submodule|amends|uses:|@[0-9a-f]{40}|^(regex|exclude) = "
severity = "deny"
scope = "tree"
no_fix_reason = "state the rule and the evidence in this repo's terms; naming who else does it is not evaluable by a reader (mem:prior-art-and-issue-hygiene)"

# Non-negotiable rule 1 as a standing gate, not prose (CLOUD-7). "The core stays
# repo-agnostic … a grep for a specific consumer's names must return zero hits"
# was discharged once, by hand, when the crate landed (CLOUD-26) — which leaves a
# standing property carried as a comment, half a change by non-negotiable rule 2.
# These two rows re-run that grep on every gate invocation.
#
# WHY THE GLOB IS `crates/**` AND NOT `crates/**/*.rs`: rule 1 says *anywhere* in
# crates/batten. `git ls-files crates/ | grep -v '\.rs$'` names the tracked files
# a `*.rs` glob would skip — the crate manifest, the changelog, and every fixture
# under tests/. `**` spans path segments (pinned by `glob_double_star_spans_
# segments` in crates/batten/src/rules.rs), and the match is anchored at the
# first segment, so `crates/**` selects all of crates/ and nothing outside it.
#
# WHICH OF THE FOUR LITERALS CLOUD-26's ACCEPTANCE LISTED ARE ROWS, and why —
# the boundary CLOUD-73 exists to record. Membership turns on one question: does
# the literal name a CONSUMER, or is it a word this repo uses in its own right?
#
# That question used to be pre-empted by a capability limit, and the limit is
# gone. This comment said `forbid` was a case-sensitive literal substring check,
# so a literal with an English reading was "wrong in both directions at once" —
# firing on ordinary prose while missing the capitalised form — and dropped two
# of the four on that ground. CLOUD-283 gave `forbid` a `regex` alternative to
# `pattern` (plus an `exclude` column), so both directions are now expressible
# and the two exclusions are re-decided on the merits:
#
#   etaxbc      IN — an account identifier, no English reading.
#   entities/   IN — an entity path, no English reading.
#   complian…   IN, since CLOUD-73 — the predecessor consumer's repo name, which
#               is squarely what rule 1 forbids. `(?i)` catches the capitalised
#               form the old literal would have missed. It costs nothing to
#               adopt: zero lines under crates/ carry it, and this engine's
#               vocabulary is policy / gate / predicate / verdict, never this
#               word. The Apache boilerplate's "in compliance with the License"
#               is in LICENSE-APACHE, outside the glob.
#   button      OUT — a DECISION, not a gap, and the difference matters now that
#               a mechanism exists. It names the vendor rather than a consumer:
#               github.com/button-inc/batten is Batten's own home, so
#               src/store.rs's URL-canonicalization test and the changelog's
#               release links carry it legitimately. Its consumer-facing half —
#               a fixture quietly depending on THIS repository — is already
#               gated, by `no-origin-literal-in-fixtures` below.
#
# The domain modules CLOUD-73's other criterion names (entity grep, pdfium, CA
# privacy detectors, evidence and provenance semantics, the ICM design protocol)
# get no rows: none has ever been in this repository, which was scaffolded fresh
# rather than split out of the consumer's tree, so a row for `pdfium` or `icm`
# could never fire and configuration stays narrow (non-negotiable rule 6). The
# standing mechanism against one arriving is rule 1's grep over `crates/**` —
# these rows.
#
# The rule IDs deliberately do not embed the literals they ban. A finding prints
# `<path>:<line> <rule-id>`, so the id reaches the fixture test's expected-stdout
# string, which lives under crates/batten/tests/ — inside this glob. An id naming
# its own literal would make the gate fire on the test that proves it works.
#
# Naming the literals here is where they belong rather than a leak: rule 1 scopes
# its grep to crates/batten, this file sits outside the crate, and it already
# carries this repo's consumer-specific policy for exactly this reason (see the
# [epoch] comment below). House style §9 wants a rule a reviewer can read, so an
# obfuscated or hashed pattern would be the worse artifact even if the engine
# could match one. The glob excludes this file, so neither rule matches its own
# definition.
[[rule]]
id = "no-consumer-account-literal"
kind = "forbid"
glob = "crates/**"
pattern = "etaxbc"
severity = "deny"
scope = "tree"
no_fix_reason = "delete the literal; a consumer fact belongs in that consumer's own batten.toml, never in the core"

[[rule]]
id = "no-consumer-entity-path"
kind = "forbid"
glob = "crates/**"
pattern = "entities/"
severity = "deny"
scope = "tree"
no_fix_reason = "delete the literal; a consumer fact belongs in that consumer's own batten.toml, never in the core"

# `regex` rather than `pattern`, which is the whole reason this row can exist:
# the shape is the stem, so one expression covers every ending the name takes,
# and `(?i)` covers the capitalised form a literal would have to enumerate.
[[rule]]
id = "no-consumer-repo-name"
kind = "forbid"
glob = "crates/**"
regex = "(?i)complian"
severity = "deny"
scope = "tree"

# The fixture corpus must stay repo-agnostic (CLOUD-63). The corpus exists so
# coverage stops implicitly depending on *this* repository, which a fixture
# naming this repository's origin would quietly undo.
#
# The org literal rather than `batten`: `min_batten_version` and `batten.toml`
# legitimately carry the crate name, while nothing a fixture needs names where
# this repository is hosted. It lands green — the literal occurs in the
# workspace manifest, the toolchain config, a release workflow and the
# generated changelog, but nowhere under crates/batten/tests/.
[[rule]]
id = "no-origin-literal-in-fixtures"
kind = "forbid"
glob = "crates/batten/tests/**"
pattern = "button-inc"
severity = "deny"
scope = "tree"
no_fix_reason = "rewrite the fixture so it does not name where this repository is hosted"

# Never compile a third-party tool from source in this repository (CLOUD-86).
#
# A tool built here is a tool nobody attested: the build happens on whatever
# toolchain the runner had, produces a binary no checksum covers, and takes as
# long as the crate takes. Every tool this repo uses is pinned in `mise.toml` as
# a prebuilt artifact with a locked url and a per-platform checksum — that is the
# sanctioned path, and CLOUD-281 is the instance where the one tool NOT pinned
# that way was the one installed from an unverified download.
#
# TWO SHAPES, one per file that can express it, because a `forbid` pattern is a
# literal substring and the two files spell the same mistake differently:
#
#   mise.toml   a `cargo:` backend, which builds the crate on install. The
#               pattern carries the opening quote because TOML bare keys cannot
#               contain `:`, so a backend key is always quoted — and the quote is
#               what keeps the row off prose that merely says "cargo".
#   workflows   `cargo install`, the same thing spelled by hand in a step.
#
# NOT gated here, deliberately: whether a *prebuilt* artifact is attested. That is
# the `[[provision]]` manifest's question (CLOUD-90), and a row here that fired on
# `ubi:` or on an install-action step would be answering a different one. This
# rule is about compiling, and `mise.toml`'s `github:` vs `ubi:` distinction is
# CLOUD-281's.
#
# The exemption path is a `[[waiver]]` carrying a reason and an expiry
# (CLOUD-208), never `severity = "allow"`: switching the rule off records nothing
# and lapses never, which is the undesigned hatch the waiver surface replaced.
[[rule]]
id = "no-source-built-tool"
kind = "forbid"
glob = "mise.toml"
pattern = "\"cargo:"
severity = "deny"
scope = "tree"
no_fix_reason = "pin an attested binary in mise.toml instead; what to pin is a supply-chain decision, not a rewrite"

[[rule]]
id = "no-cargo-install-in-ci"
kind = "forbid"
glob = ".github/workflows/*.yml"
pattern = "cargo install"
severity = "deny"
scope = "tree"
no_fix_reason = "pin the tool in mise.toml so CI installs exactly what the lockfile names"

# Portability: the shell layer must run on a machine that is not the CI runner
# (CLOUD-282).
#
# `mise run verify` is the authorization the whole workflow contract rests on —
# "verify exhaustively before CI", "the gates ARE your authorization". On macOS
# it could not pass, for reasons no branch caused: two gates used sed's
# NUL-separated mode (GNU only, BSD exits `illegal option -- z`), two used
# `mapfile` (bash 4; macOS ships 3.2), one used xargs' short
# `--no-run-if-empty`, and three fixture repos force-created a branch that git
# refuses to force while it is checked out. An agent there either stopped on a
# red `verify` it did not break, or landed on CI's word alone — the exact
# failure the contract exists to prevent. CI runs ubuntu, so CI is
# STRUCTURALLY BLIND to every one of these: the same "verdict is a property of
# the machine" shape as CLOUD-227.
#
# These are `forbid` rows and not a 50th `mise-tasks/*-check` program, per the
# 2026-08-07 engine-first amendment: `batten check` already runs in the shared hk
# gate with no glob, so the whole construct set is config a reviewer can read
# (§9) rather than a second copy inside a shell script. That amendment exists
# because the older wording made a bash task the cheapest satisfying artifact,
# and CLOUD-202 is in flight moving the existing guards OUT of that layer.
#
# WHY THE GLOBS ARE `mise-tasks/**` AND `tests/**/*.bats`:
#
#   * two or more segments, so neither can match the root `batten.toml` and make
#     the rule fire on its own definition — the walk is `fs::read_dir` and skips
#     only `.git`.
#   * recursive, matching `no-bash4-wait-n` and `bats-tests-not-deleted` rather
#     than inventing a third depth convention. Both were narrowed to one segment
#     once, only to dodge the vendored `tests/bats` submodule the walker used to
#     descend into; since CLOUD-328 the walk stops at a nested repository, so
#     depth is free again and hk.pkl's `batten-check` glob spans it too. That
#     coupling is not cosmetic: `batten-glob-check` subsumes a required glob only
#     by verbatim match or a `P/**` prefix, so `tests/*.bats` would be uncovered
#     by hk's `tests/**/*.bats` and the step would stop running for exactly the
#     commits this rule judges.
#
# WHAT IS DELIBERATELY NOT HERE, and why it is a gap rather than an oversight:
# the `tests/**/*.bats` half of the sed and flock rows. `tests/target-ensure.bats`
# names the util-linux lock in a test title, and a `forbid` pattern is a literal
# substring with no `exclude` column, so that row cannot be written today without
# firing on the test that proves the guard works. That is exactly CLOUD-283. The
# `mise-tasks/**` half — the layer that actually could not run — lands now.
#
# The in-place spelling used to be blocked here too, by `tests/memory-guard.bats`
# carrying it five times as fixture strings. That suite retired with its guard
# (CLOUD-442) and the fixtures moved to `crates/**`, which these rows do not
# glob — so the sed half of this exclusion is now about `flock` alone.
#
# The rationale comments in the guarded files deliberately do NOT spell the
# literals they explain, for the same reason the agnosticism rules above do not
# embed theirs: a substring rule over a directory fires on its own explanation.
[[rule]]
id = "no-gnu-sed-z"
kind = "forbid"
glob = "mise-tasks/**"
pattern = "sed -zE"
severity = "deny"
scope = "tree"

# The trailing space is load-bearing: it is what distinguishes the GNU-only
# no-suffix spelling from `sed -i.bak`, which BSD accepts and which
# `tests/helpers.bash` uses.
[[rule]]
id = "no-gnu-sed-in-place"
kind = "forbid"
glob = "mise-tasks/**"
pattern = "sed -i "
severity = "deny"
scope = "tree"

[[rule]]
id = "no-bash4-mapfile"
kind = "forbid"
glob = "mise-tasks/**"
pattern = "mapfile "
severity = "deny"
scope = "tree"

[[rule]]
id = "no-gnu-xargs-r"
kind = "forbid"
glob = "mise-tasks/**"
pattern = "xargs -r"
severity = "deny"
scope = "tree"

# CLOUD-286 replaced flock(1) with a `mkdir` mutex and named this row as its own
# standing half: the refusal that fired before every other gate on a Mac was
# correct behaviour over a Linux-only primitive.
[[rule]]
id = "no-util-linux-flock"
kind = "forbid"
glob = "mise-tasks/**"
pattern = "flock "
severity = "deny"
scope = "tree"

# git refuses `branch -f` on the branch that is currently checked out. Three
# fixture setups did it anyway, and passed only because the runner's git still
# defaults to `master`, which made `main` a different branch — an accident of the
# runner's configuration, not a property of the test. It is a `setup()` failure,
# so every case in the suite errors, not one.
#
# The replacement is `git init -b <name>` plus a plain `git branch main`, NOT
# `branch -M main`: `-M` renames the current branch, and these fixtures want a
# SECOND branch marking the trunk while HEAD stays on the feature branch. That
# distinction is measured, not assumed — rewriting them to `-M` first made
# `tests/verified.bats`'s moved-main case fail, because it checks that other
# branch out.
[[rule]]
id = "no-branch-f-main"
kind = "forbid"
glob = "tests/**/*.bats"
pattern = "branch -f main"
severity = "deny"
scope = "tree"

# No tracked instruction prescribes the commit identity `identity_deny` refuses
# (CLOUD-605).
#
# A user-level stop hook outside this repository asks a session to reconfigure
# `user.email` to a vendor no-reply address and amend. `[attribution]`'s
# `identity_deny` already refuses the resulting COMMIT, and it has never failed
# to. What nothing gated is the instruction: a session that copies that remedy
# into a rules file, a task or a memory turns a one-session argument into a
# standing one, and the next reader finds the repository apparently telling them
# to do the thing the repository denies.
#
# THIS IS NOT A SECOND COPY OF `identity_deny`. That judges what a commit
# CARRIES, over commit metadata; this judges what a tracked file PRESCRIBES, over
# tree content. Different object, different pattern, one authority each — the
# prose that names the precedence still cites `identity_deny` and never restates
# its patterns.
#
# The glob is the instruction surfaces, and the bound is stated rather than
# implied: Markdown is where a remedy gets pasted, and it is also the only glob
# under which this row's own fixture can be written. A task or a workflow
# spelling the same prescription is NOT caught here — it is caught at the commit,
# by the gate this row exists to stop anyone arguing with.
[[rule]]
id = "no-denied-identity-prescribed"
kind = "forbid"
glob = "**/*.md"
pattern = "user.email noreply@anthropic.com"
severity = "deny"
scope = "tree"
no_fix_reason = "state the precedence instead of the command: `[attribution] identity_deny` is the authority, and a remedy that reproduces the denied identity cannot be corrected by rewording it"

# Which programs change the world, in the one §5 effect vocabulary, each with the
# sanctioned mutation to point at when it is refused.
#
# `>` and `>>` are not programs — a truncating redirect has no mutating program
# to classify, since in `cat x > p` the program is `cat`. The engine surfaces the
# operator as a pseudo-program (`hook::REDIRECT_VERBS`) so a consumer that wants
# truncation gated declares it here like any other verb. That token is a
# crate↔config contract: `verb = "redirect"` would get silence.
[[verb]]
verb = "rm"
effect = "destructive"
redirect = "restore it with `git checkout --`, or change it through the surface that owns it"

[[verb]]
verb = "mv"
effect = "destructive"
redirect = "copy instead of moving, or change the file in place"

[[verb]]
verb = ">"
effect = "destructive"
redirect = "append, or write through the surface that owns the file"

[[verb]]
verb = ">>"
effect = "write"
redirect = "write through the surface that owns the file"

# The write TOOLS, classified through the same table as the shell programs
# (CLOUD-312). A `Write` aimed at a protected path and an `echo x >` aimed at it
# are one predicate — {mutating verb} × {protected path} — so they are declared
# once, here, rather than as a second "which tools write" list the engine would
# have to keep in agreement with this one.
#
# Which of a host's tools are writers is the ADAPTER's fact and is not declared
# here (`hook::Harness::write_tools`); what a write MEANS for this repository is,
# and that is the redirect. Until these rows existed the whole
# `Write|Edit|MultiEdit|NotebookEdit` matcher was adjudicated by nothing: a write
# carries no command, and every path in `adjudicate` returned Allow for it.
#
# The redirect started as the one `memory-guard-check` rendered, kept verbatim so
# the refusal survived the move out of bash unchanged — which is what CLOUD-312's
# differential suite asserted. With that guard retired (CLOUD-442) this text is no
# longer a copy of anything: it is the authority, and
# `crates/batten/tests/mediated_verbs.rs` is what holds it to the corpus the guard
# used to prove. It is per-verb rather than per-path, exactly as `rm`'s is, so it
# names the general remedy and leaves the specific one to the path in the message.
# The write-shaped programs whose EVERY operand is a target, ported from
# `memory-guard-check`'s table (CLOUD-312). Its own comments were the authority
# for which those are: "every operand is a destination" for tee/sponge, and
# rm/shred/truncate grouped together.
#
# The five that could not be expressed then are declared below with CLOUD-442's
# qualifier columns, and the guard is deleted rather than left beside the engine
# as a second authority. Each column NARROWS — an absent one leaves a row meaning
# what it always meant — so the every-operand reading above is untouched and
# stays the default, because it is the one that fails toward refusing.
[[verb]]
verb = "tee"
effect = "write"
redirect = "write through the surface that owns the file — for a memory that is the Serena tool `write_memory`"

[[verb]]
verb = "sponge"
effect = "write"
redirect = "write through the surface that owns the file — for a memory that is the Serena tool `write_memory`"

[[verb]]
verb = "truncate"
effect = "destructive"
redirect = "change the file through the surface that owns it, rather than emptying it in place"

[[verb]]
verb = "shred"
effect = "destructive"
redirect = "restore it with `git checkout --`, or remove it through the surface that owns it"

# Destination-only: `operands = "last"`. The bash table's own words — "only the
# destination is a write; copying a memory OUT is a read" — are what the column
# now says, and the ALLOW is the load-bearing half: with the default every-operand
# reading, a row here would refuse `cp batten.toml /tmp/backup.toml`, and a guard
# that refuses reads is one people switch off.
#
# The stated limit, inherited from the guard this replaces rather than introduced:
# a target-directory flag (`-t <dir>`) puts the destination somewhere other than
# last, so the row does not see it. That under-denies, which is the sanctioned
# direction (house style §5).
[[verb]]
verb = "cp"
effect = "write"
operands = "last"
redirect = "write through the surface that owns the file — for a memory that is the Serena tool `write_memory`"

[[verb]]
verb = "install"
effect = "write"
operands = "last"
redirect = "write through the surface that owns the file — for a memory that is the Serena tool `write_memory`"

# Flag-qualified: the stream editor writes only in place. Every other invocation
# of it is a read, so a row without `requires_flag` would refuse every read-only
# stream edit in the repository — which is why this one waited for the column.
# The suffix form is the same switch carrying a backup suffix; the engine matches
# a declared flag's `.suffix` and `=value` forms for that reason.
[[verb]]
verb = "sed"
effect = "write"
requires_flag = ["-i", "--in-place"]
redirect = "change the file through the surface that owns it — for a memory that is the Serena tool `edit_memory`"

# Subcommand-qualified: two rows for one front-end, because they are two actions
# with two remedies. The effective program is the same word whether it mutates or
# reads, so a row keyed on the program alone would refuse `git log`.
#
# The rename is the shape worth the most, and the reason this pair is not
# cosmetic: `rename_memory` is the only thing that rewrites `mem:` referrers, so
# moving a memory with version control orphans every reference to it in one
# silent step. `memories-check` catches the damage at commit time; this catches
# it at the moment of action.
[[verb]]
verb = "git"
subcommand = "mv"
effect = "destructive"
redirect = "copy instead of moving, or change the file in place — for a memory that is the Serena tool `rename_memory`, which rewrites every `mem:` referrer a raw move orphans"

[[verb]]
verb = "git"
subcommand = "rm"
effect = "destructive"
redirect = "restore it with `git checkout --`, or remove it through the surface that owns it — for a memory that is the Serena tool `delete_memory`"

[[verb]]
verb = "Write"
effect = "write"
redirect = "change the file through the surface that owns it — for a memory that is the Serena tool `write_memory`, which enforces the size ceiling and the `mem:` reference rewrite a direct write skips"

[[verb]]
verb = "Edit"
effect = "write"
redirect = "change the file through the surface that owns it — for a memory that is the Serena tool `edit_memory`"

[[verb]]
verb = "MultiEdit"
effect = "write"
redirect = "change the file through the surface that owns it — for a memory that is the Serena tool `edit_memory`"

[[verb]]
verb = "NotebookEdit"
effect = "write"
redirect = "change the file through the surface that owns it"

# The governing config surface, hashed into `batten config epoch` (CLOUD-32).
#
# This list is consumer-specific ON PURPOSE, and it lives here rather than in
# crates/batten: which files govern a repository is that repository's business,
# and these four govern *this* one. The core ships only the default — batten.toml
# itself — so a grep of the engine for any consumer's identifiers returns
# nothing (non-negotiable rule 1). Batten is consumer #1 in practice: this is
# the worked example of the feature, in the config the feature reads.
#
# Every path must be readable. An unreadable one is exit 1 — this list is config,
# so a tracked path that cannot be read is unreadable config, which §7 routes to
# 1 and not to 3. It is never a silent skip: skipping would compute a stable
# epoch over a surface that changed, which is precisely the failure the value
# exists to prevent.
# What the always-loaded instruction set may cost (CLOUD-50).
#
# Every agent pays AGENTS.md on every turn whether or not a word of it applies,
# so its size is a per-turn tax rather than a style question. This table is the
# successor to `mise-tasks/context-budget.sh`, deleted in the same change — never
# two gates counting the same surface by different rules.
#
# `files` is consumer-specific by nature: which files are always loaded is a
# property of this repository, not of Batten (non-negotiable rule 1). It lists
# `AGENTS.md` alone. The shell task also globbed `.serena/memories/always/*.md`,
# a directory that has never existed — a dead entry contributing nothing while
# the rest counted, which is exactly the defect CLOUD-298 measured and which the
# engine now refuses outright (exit 1, per entry). Declaring a memory always-load
# means creating that directory AND adding the glob here in the same change: it
# then costs exactly what an AGENTS.md section costs, which is the point.
#
# Both thresholds carry forward the shell gate's bar unchanged. `max_lines = 199`
# is the documented 200-line CLAUDE.md target restated for a `<=` boundary — the
# shell gate failed AT 200, so 199 is the same bar, not a loosening. Raising
# either number is a visible diff in this file, pinned by a test in
# `crates/batten/tests/cli.rs`.
# How `batten exec` presents what it dispatched (CLOUD-429), on two axes adopted
# from tools this repo already pins: hk's `format` and mise's `style`. Both are
# set here rather than left implicit, because "the default" is a decision this
# repository is making about its own callers and a reader should not have to open
# the crate to learn what it was.
#
# `tee` is deliberately absent, which reads as `false`: the bytes are captured
# and addressable, so an agent asking for `mise run test` gets a record and a
# handle instead of a test log it did not budget for. `--tee` is how a human asks
# for the log, and it restores the old behaviour verbatim.
#
# `manage_process_group` is absent for the opposite reason (CLOUD-427): every
# `exec` in this repository runs UNDER `mise run`, so the marker is already set
# and Batten would decline regardless. Declaring `true` here would state an
# intent that never fires, which is worse than stating nothing.
# `jobs` and `continue_on_error` are mise's own names for a `:::` bundle's width
# and its failure policy (CLOUD-430). Both are stated at their conservative
# values rather than left implicit, for the reason above: a reader should not
# have to open the crate to learn that this repository runs a bundle one command
# at a time and stops at the first failure.
[exec]
format = "human"
style = "interleave"
jobs = 1
continue_on_error = false

[budget.instructions]
files = ["AGENTS.md"]
max_tokens = 3500
max_lines = 199

# The other half of what loads on every session, and the half `files` cannot
# reach: Serena's project file documents `initial_prompt` as content that "will
# always be given to the LLM upon activating the project (contrary to the
# memories, which are loaded on demand)". The cost is a string inside a document,
# not a document, so it is declared as an embedded entry rather than a glob
# (CLOUD-298).
#
# It is empty today, and that is the reason to gate it rather than fix it in
# passing: an empty value contributes nothing and prints no row, so this costs
# nothing now — and the first person to put text there pays for it against the
# same budget as an AGENTS.md section instead of getting it free past a green
# gate. A file the engine cannot parse is exit 1, never a silent zero.
[[budget.instructions.embedded]]
path = ".serena/project.yml"
key = "initial_prompt"

# The test suite is half of this repository's definition of green, and was the
# unguarded half (CLOUD-55). It cannot be a `protected` path — tests are edited
# every day, so a protected glob would block writing them — so the computable
# property is DIRECTION of change, the same shape `trust.rs` encodes for config.
#
# The token is consumer config, not an engine fact: `#[test]` is this
# repository's test marker, and another language's marker works with no engine
# change (non-negotiable rule 1).
#
# `base = "origin/main"`: the trunk this branch will land on, so the comparison
# is against what is already released rather than against this branch's own
# history. A legitimate reduction goes through a `[[waiver]]` with a reason and
# an expiry — never `severity = "allow"`, which switches the row off forever and
# tells nobody.
[[rule]]
id = "tests-not-deleted"
kind = "ratchet"
glob = "crates/**/*.rs"
pattern = "#[test]"
direction = "non_decreasing"
base = "origin/main"
severity = "deny"
scope = "tree"
no_fix_reason = "restore the tests, or waive the reduction deliberately; which of the two is the whole question"

# `tests/**/*.bats`, recursive — and the recursion is safe now rather than by
# this glob's care. `tests/bats` is a vendored submodule carrying 227 of its own
# `.bats` files, and the two sides of a ratchet used to disagree about
# submodules: `git ls-tree -r` at the base saw one gitlink while the
# working-tree walk saw every file inside it. Measured with this glob before the
# fix: base 637, working 1404 — a permanent +767 skew that no realistic deletion
# could pull back under, i.e. a gate that could not fail. The row was narrowed to
# `tests/*.bats` as a workaround; CLOUD-328 fixed the engine instead, so both
# halves now stop at a nested repository and select the same files. Widened back
# because the narrow glob was only correct while every bats suite sat directly in
# `tests/` — this one covers a nested one the day it is written.
[[rule]]
id = "bats-tests-not-deleted"
kind = "ratchet"
glob = "tests/**/*.bats"
pattern = "@test \""
direction = "non_decreasing"
base = "origin/main"
# CLOUD-807. Retirement is the steady-state behaviour of a repo folding its bash
# into its own engine (CLOUD-312), not an exception — so it belongs in the rule,
# not in a `[[waiver]]` that expires. The waiver this replaces was BLANKET: it
# carried only `rule` and `reason`, so every deletion of every `@test` under
# this glob passed, and a suite quietly gutted was indistinguishable from a
# retirement. Net effect of the swap is a STRONGER ratchet, not a weaker one.
#
# The subject is DECLARED, never inferred from the filename. Measured: 19 of the
# 142 suites have no same-named `mise-tasks/` program and every one is
# legitimate — `verify.bats` and `cross-check.bats` cover `mise.toml` tasks,
# `git-hook.bats` covers a hook body, and the rest are aspect suites over a
# subject the filename only hints at. A filename heuristic would block those
# retirements and admit real deletions elsewhere: `gh-guard.bats` drives
# `gh-guard-check` too, and retiring only half of that pair must not buy the
# suite's deletion.
retires_with = "# subject:"
severity = "deny"
scope = "tree"
no_fix_reason = "restore the tests, or waive the reduction deliberately; which of the two is the whole question"

# CLOUD-908. The column above conserves FILES: it asks whether the subject died
# and never whether the cases moved, so a migration can delete a 259-line suite
# and land green with nothing asserting what replaced it. Measured on the one
# retirement the campaign has completed — 22 named cases deleted, six of them
# with no successor anything in the tree could name, and one whose behaviour was
# deliberately inverted with nothing marking it.
#
# So every case inside a decrease owes exactly one arm, and the arms live in
# `crates/batten/tests/*.rs` — one block per retired suite, on its primary
# successor, which is what lets another session (or another account) read
# migration progress off the tree instead of off a chat transcript. A suite with
# no block is untouched; a block with unmapped cases is half-done.
#
# `declared_in` is this repo's Rust test tree because that is where the ledger
# for a retired bash suite belongs today: a migrated gate's evidence is a Rust
# test or a `policy test` case, and both are reachable from there. A wave that
# needs a ledger somewhere else widens this glob deliberately rather than
# scattering arms — the walk is bounded by declaration on purpose.
[rule.conserves]
case = "@test \""
close = "\""
carried = "// carried:"
subsumed = "// subsumed:"
changed = "// changed:"
declared_in = "crates/batten/tests/*.rs"

# The mirror direction: a disabled test is a deleted test that still counts, so
# the guard is on the token RISING.
#
# The pattern is newline-anchored, and that is load-bearing rather than tidy. A
# bare `#[ignore]` is a literal substring, so it also matches every prose mention
# of the attribute — including the sentence you are reading and the fixtures in
# `crates/batten/tests/ratchet.rs` that exercise this very row. Measured: the
# unanchored form counts 5 in a tree containing zero disabled tests, so the row
# would have failed on its own documentation. An attribute always begins a line;
# a mention does not. (`budget.rs` anchors its HTML-comment scan for the same
# reason.)
[[rule]]
id = "no-new-ignores"
kind = "ratchet"
glob = "crates/**/*.rs"
pattern = "\n#[ignore]"
direction = "non_increasing"
base = "origin/main"
severity = "deny"
scope = "tree"
no_fix_reason = "delete the new ignore, or waive it deliberately; an ignore is a decision, not a defect to rewrite"

# Advisory rather than blocking: assertions thinning out while the `#[test]`
# count holds is the gutting shape, and it is worth saying without blocking —
# a refactor legitimately merges assertions. `--fail-on-warning` and
# `--strictness strict` promote it when a run wants the stricter reading.
[[rule]]
id = "assertions-not-gutted"
kind = "ratchet"
glob = "crates/batten/tests/**/*.rs"
pattern = "assert"
direction = "non_decreasing"
base = "origin/main"
severity = "warn"
scope = "tree"
no_fix_reason = "restore the assertions, or waive the reduction deliberately"

# The merge contract, DERIVED from this repository's GitHub ruleset (CLOUD-54).
#
# The host is the authority; this is a projection a gate polices. `mise run
# ci-drift` pipes `gh api repos/{owner}/{repo}/rules/branches/main` into
# `batten config lint --host-rules -`, so an edit on either side that the other
# does not follow fails the build rather than drifting quietly.
#
# `required_checks` is `final` alone: the ruleset requires that one check-run,
# and `final` is the aggregating job every other CI job reports through. There
# is no `allowed_merge_methods` key because the ruleset carries no
# `pull_request` rule — the host constrains no merge method, which is a
# different claim from constraining none of them, and writing an empty list here
# would assert the second.
#
# Landing is by `/fast-forward` regardless (see AGENTS.md): the merge button is
# blocked so `main` only ever advances to a SHA that already passed CI. That is
# repository discipline, not a host constraint, and it is deliberately not
# encoded here — this table records what the HOST enforces, and recording a
# convention as a host rule would be the second authority the whole issue exists
# to prevent.
# `wait -n` IS BASH 4.3, AND ITS PID-LIST FORM IS 5.1 (CLOUD-383). macOS ships
# bash 3.2 as `/bin/bash` and `mise registry` carries no bash, so one executable
# `wait -n` under `mise-tasks/` makes that task unrunnable on a platform
# `darwin-link` treats as a required check. `land` raced two unbounded pollers
# with it and waits on a FIFO rendezvous now; this is the standing half, so the
# next race cannot reintroduce it — the shape the portability rows above already
# use.
#
# Anchored to a line start so the ban is on RUNNING it, not on naming it: the
# rendezvous is documented in comments that say what it replaced, and a rule that
# forbade the words would delete the explanation along with the construct.
[[rule]]
id = "no-bash4-wait-n"
kind = "forbid"
glob = "mise-tasks/**"
regex = "^[ \\t]*wait -n"
severity = "deny"
scope = "tree"

# SBOM conformance as an adopted verdict rather than a clause list (CLOUD-580,
# settling CLOUD-279 verdict 1). `mise run sbom-check` already asks whether the
# published inventory DESCRIBES this tree; these two ask whether it is USABLE by
# whoever receives it — the NTIA 2021 minimum elements and CISA's 2024 FSCT
# minimum expectation, which is what a procurement review actually checks.
# `mise-tasks/ntia-check.sh` carries the reasoning and the measurements; what belongs
# here is why this is TWO rows at two severities.
#
# The clause set is the tool's, named by its own `--comply` flag: no clause list
# in the engine and no crosswalk table (CLOUD-279 verdict 2). `policy_url` would
# be the natural home for the standard's URL and a `command` row does not permit
# one (`RuleKind::permits` — it is a shape-row column), so the standard travels in
# the check itself, which is also the only place that could keep it honest.
#
# ROW 1 IS THE MECHANISM, and it is `deny` because it is the half that can stop
# working silently: an unresolvable checker or an underivable document would
# otherwise make row 2 pass by never asking anything (non-negotiable rule 2, and
# `sbom-empty`'s lesson one layer up).
[[rule]]
id = "sbom-ntia-precondition"
kind = "command"
glob = "Cargo.lock"
check = "mise run ntia-check --precondition"
severity = "deny"
scope = "tree"
no_fix_reason = "install the pinned checker (`mise install pipx:ntia-conformance-checker`) or fix why `mise run sbom` cannot derive a document; neither is a change to this tree's content"

# ROW 2 IS THE VERDICT, and it is `deny` as of CLOUD-631 — promoted in the change
# that makes it pass, which is that row's own acceptance clause rather than a
# preference about when to tighten.
#
# It was `warn` by measurement, and the measurement was right at the time: on
# 2026-08-14 this tree produced 243 components with no supplier on 190 and no
# concluded license or copyright text on 243/243, because `Cargo.lock` carries no
# license and no supplier field and that is the only input syft's cargo cataloger
# reads. `deny` then would have failed `batten enforce` -> `verify` and stopped
# every landing in the repo until a change that did not exist yet — a gate
# answering a question nobody had asked it.
#
# What changed is that the document now conforms, from five sources each of which
# reads data this tree already states and invents nothing:
#
#   supplier          the lockfile's own resolution — one distinct `source`, so
#                     the distributor is stated rather than inferred (CLOUD-630)
#   licenseConcluded  `cargo metadata`, which `cargo-deny` already gates on
#                     (CLOUD-628), plus the pinned-action table (CLOUD-667)
#   copyrightText     the checksum-pinned registry cache, with `NONE` where the
#                     pinned bytes carry no holder (CLOUD-629), plus CLOUD-667
#
# and from two corrections without which none of the above would have been
# legible: the component census counted 340 entries for 290 distinct things
# (CLOUD-664), and `fsct3-min` was in the standards set while being unsatisfiable
# for every document syft can emit, so the gate was guaranteed non-zero whatever
# the SBOM said (CLOUD-666).
#
# Measured on this tree at promotion time: `mise run ntia-check` exits 0 —
# `batten.spdx.json conforms to ntia` — over 290 components, every one carrying a
# supplier and a license, 162 with a copyright holder and 119 determined to have
# none.
#
# THE FIRING RATE IS ZERO BEFORE THE `deny` BINDS, which is what makes this safe
# where a heuristic promotion would not be. The predicate has no commit series to
# replay: it is the checker's exit code on the document a tree produces, so its
# history is per-SHA. It fired on every SHA to date, and none of those firings was
# a false positive — the checker DECIDES conformance against the minimum elements
# rather than estimating it, so a false positive would be a checker defect and not
# a tuning question. Taking the rate to zero is what this change does; the `deny`
# is what keeps it there.
[[rule]]
id = "sbom-ntia-conformance"
kind = "command"
glob = "Cargo.lock"
check = "mise run ntia-check"
severity = "deny"
scope = "tree"
no_fix_reason = "the missing fields do not exist in a cargo lockfile, so no command over this tree can add them: the SBOM has to be enriched from `cargo metadata` first"

# Release provenance, adopted as `gh attestation verify` (CLOUD-583, CLOUD-279
# verdict 1 — `slsa-verifier` is redundant against the same absent provenance and
# `cosign` has no signing identity here). `mise-tasks/attestation-check.sh` carries
# the design; what belongs here is why this is ONE row and which half it runs.
#
# THE OFFLINE HALF, and that is the whole of the wiring decision. Whether a
# published release is attested changes with no diff, so it is a property of the
# WORLD and belongs on a clock — it runs weekly in `release-assets.yml`, beside
# the sibling question about the archives themselves. Putting it here instead
# would make every `batten enforce` reach api.github.com, which is precisely the
# coupling CLOUD-410 removed from `zizmor`. So the row runs `--precondition`: the
# verifier resolves and carries a credential, decided from local facts, with a
# bats case asserting it makes no API call at all.
#
# `deny` is safe BECAUSE of that split. The precondition holds today (measured
# 2026-08-14) while the platform gap is wide open — this repository's attestations
# endpoint answers 404, which is the feature being absent rather than an artifact
# being unattested, and the task reports that gap at exit 0 without calling
# anything unverified. `blockedBy CLOUD-585` was removed from the issue on that
# measurement: a public repository is what makes the verdict INTERESTING, never
# what makes this gate runnable.
# THE GLOB IS THIS ROW'S OWN MECHANISM, and both constraints that produced it were
# measured rather than reasoned. It must be a path `batten-glob-check` can prove
# covered — that gate accepts a verbatim match or a `P/**` prefix against hk.pkl's
# `batten-check` list, and `mise-tasks/**` is in it, so any path under
# `mise-tasks/` is provable while a lone `.github/workflows/release-artifacts.yml`
# is not. And it must not match inside a FIXTURE tree: a `check` spelled `mise run`
# resolves only where a mise.toml is findable, so a row matching a fixture reports
# the launcher rather than the tree. Two suites caught the two wider spellings —
# `tests/prebuilt-lint.bats` copies `mise.toml` and the workflows into its fixture,
# and `cli.rs`'s portability case writes a `mise-tasks/seed.sh` — and neither failure
# had anything to do with attestation. CLOUD-614 carries the general defect; naming
# the file the row exists to run is what makes the trigger and the mechanism the
# same object rather than a coincidence.
[[rule]]
id = "release-attestation-precondition"
kind = "command"
glob = "mise-tasks/attestation-check.sh"
check = "mise run attestation-check --precondition"
severity = "deny"
scope = "tree"
no_fix_reason = "install the pinned `gh` (`mise install aqua:cli/cli`) or supply GH_TOKEN; neither is a change to this tree's content"

# CLOUD-618. `release-plz.yml` publishes a tag; this row is what keeps the tag
# reaching Linear's `batten` pipeline rather than only the run summary.
#
# `command` AND NOT `forbid`, which is the whole reason this is a row plus a
# script rather than a declarative rule. Every other shape gate here asserts an
# ABSENCE — a token that must not appear, a path that must not be tracked — and
# absence is what a pattern over a file can express. This asserts PRESENCE: two
# action invocations, pinned, bound to one resolved tag output, over a checkout
# that is not shallow. No rule kind can address a node in a document, so there is
# nothing declarative to write. That gap is `relatedTo` CLOUD-452, and it does
# not block: `command` is the sanctioned form until a kind exists that closes it,
# at which point this row collapses into that kind and the script goes away.
#
# THE GLOB IS THE ROW'S OWN MECHANISM, the discipline
# `release-attestation-precondition` above establishes, and both halves of it
# bind here too. It must be a path `batten-glob-check` can prove covered — that
# gate accepts a verbatim match or a `P/**` prefix against hk.pkl's
# `batten-check` list, and `mise-tasks/**` is in it, while a lone
# `.github/workflows/release-plz.yml` is not provable. And it must not match
# inside a FIXTURE tree: a `check` spelled `mise run` resolves only where a
# mise.toml is findable, so a row matching a fixture reports the launcher rather
# than the tree — `tests/prebuilt-lint.bats` copies the workflows into its
# fixture, which is exactly the wider spelling that would have caught this one.
# Naming the file the row exists to run keeps the trigger and the mechanism the
# same object. The workflow it JUDGES is globbed on the hk step instead, where a
# glob is a re-run trigger rather than a rule's subject.
#
# `deny` is safe because the check is offline and local: it reads one tracked
# file, makes no network call, and needs no credential — so it cannot block on
# ambient environment the way an earlier `attestation-check` did inside fixture
# repositories. The only way it reds is the workflow actually losing its wiring.
[[rule]]
id = "release-tracking-check"
kind = "command"
glob = "mise-tasks/release-tracking-check.sh"
check = "mise run release-tracking-check"
severity = "deny"
scope = "tree"
no_fix_reason = "the missing node is in the workflow, not in this file; add the invocation, the pin, or the fetch-depth the finding names"
# `issue-guard`'s duplicate-claim half, and the change that retires that file
# (CLOUD-446). The naming half is the engine's, two rows above as
# `pr-names-an-issue`/`ready-names-an-issue`; this is what could not follow it.
#
# WHY IT IS A `tree` ROW rather than a mediated one, which is the issue's whole
# decision: the predicate needs `gh pr list` plus a `gh pr view` per competitor,
# and `RuleKind::scopes` pairs every spawning kind with `RuleScope::Tree` alone —
# pinned by `rules::tests::no_mediated_call_kind_spawns_a_process`, an invariant
# worth more than this predicate. A network round trip on every mediated tool
# call is also disqualifying against the published <=100ms budget. So it runs
# where spawning is already legal, under `verify`, which sits on every path to a
# published PR because `land` is the only readier.
#
# The cost, stated rather than absorbed: this catches the race at `verify` where
# `issue-guard` caught it at `gh pr create`. Both are later than pull time, which
# is what CLOUD-230 wanted and which no candidate restores.
#
# `glob` NAMES THE CHECK'S OWN FILE, for the reason
# `release-attestation-precondition` spells out above:
# a `mise run` check resolves only where a mise.toml is findable, so a row
# matching inside a fixture reports the launcher rather than the tree
# (CLOUD-614). Naming the program the row exists to run makes the trigger and the
# mechanism the same object, and keeps this out of every fixture that does not
# carry it.
# CONSUMER #1 EATS THE SAME FOOD (CLOUD-836). Batten ships vendored preset
# bundles compiled into the binary, and this repository enables one like any
# other consumer would — which is the only way the surface gets exercised by
# something other than its own tests.
#
# `trunk-based` rather than `commit-hygiene`, and the choice is on the merits:
# AGENTS.md's landing contract is trunk-based development, `main` is the one
# long-lived branch, and a force push there is exactly the shape the practice
# refuses. `--force-with-lease` stays admitted, which is what the preset's own
# comment argues for — banning both would push toward the bypass rather than
# toward the safer flag.
#
# `commit-hygiene` is deliberately NOT enabled here, and that is a decision
# rather than an oversight: its `no-empty-commit` predicate overlaps AGENTS.md's
# own "never push an empty commit to kick CI", which the landing loop already
# enforces where it can act on it. Enabling a second gate over the same practice
# would double a refusal without doubling the coverage, and the row that fired
# would be a question of which one a reader happened to read first.
#
# Mediated-call scoped, because the preset's predicate is over a command line.
# A tree-scoped row would hand it a document it has no predicate for and read as
# a configured gate that never fires.
[[rule]]
id = "trunk-based-preset"
kind = "policy"
scope = "mediated_call"
preset = "trunk-based"
severity = "deny"

# The evaluator's IO-free pin, given a mechanism (CLOUD-831). `policy.rs`'s
# module doc admits consumer-authored code to the MEDIATED CALL on the claim that
# a module "cannot open a file, start a process, or reach the network", and cited
# a test named `no_evaluator_feature_admits_io` that did not exist — CLOUD-589's
# class, on the highest-consequence claim in the crate. That test exists now, and
# this row is its defence-in-depth half.
#
# A `command` row rather than a `forbid` over the manifest text, deliberately.
# Cargo unifies features across the graph, so `http` can re-enter the closure
# with NO edit to the `regorus` feature list — a `forbid` matches the line that
# states the pin and is blind to the failure mode that matters. Only the resolved
# graph can answer, and reading it means spawning `cargo metadata`.
#
# Tree-scoped and spawning, so it runs under `enforce` / the hk gate and never on
# the mediated path — which is the right side of the CLOUD-170 split for a gate
# whose subject is the mediated path.
#
# `glob` names the check's own file so the trigger and the mechanism are one
# object (CLOUD-614), matching `claim-not-raced` below. The gate reads
# `Cargo.lock` and `Cargo.toml`, not this file — the glob is what decides WHEN it
# is worth asking, and asking on a change to the gate itself is the case that
# must never be skipped.
[[rule]]
id = "evaluator-closure-io-free"
kind = "command"
glob = "mise-tasks/evaluator-closure-check.sh"
check = "mise run evaluator-closure-check"
severity = "deny"
scope = "tree"
no_fix_reason = "an IO crate reaching the evaluator is closed where it was enabled, not here: `cargo tree -i <crate>` names who turned it on, and the `regorus` feature list in Cargo.toml is where the pin is stated rather than where it is decided"

# The first migrated gate of the bash-retirement campaign (CLOUD-843 track 2):
# `run-shape-guard`'s no-message-source family, as a consumer-authored module
# rather than a vendored preset. It names `git`, which a preset may not — a
# preset carries a PRACTICE and this carries one tool's argv, so it belongs on
# this side of the boundary (non-negotiable rule 1).
#
# `module` rather than `bundle`: one predicate, one file, and a folder would
# enable whatever later lands beside it without a row saying so.
#
# Mediated-call scoped, because the predicate is over a command line. The other
# four families of that guard stay in bash and its header says which and why.
# The short flag cluster `git commit` accepts a message source in — `-m`, `-am`,
# `-F`, `-C`, `-c` — as a shape rather than a literal (CLOUD-885).
#
# DECLARED HERE RATHER THAN IN THE MODULE, and this row is the mechanism proving
# itself on consumer #1. An expression is a consumer fact: written into
# `policy/run-shape.rego` it would be a pattern with no home, invisible to
# `config show`, and the second module wanting the same shape would re-spell it.
# The engine refuses an inline regex at load, so this row is not a convention —
# it is the only way to write the predicate at all.
#
# The anchor is the predicate. `contains` over the flag's tail cannot say
# "letters", so `-x=mfoo` carried an `m` and read as naming a message source,
# letting through a commit that still blocks on $EDITOR.
[[pattern]]
id = "short-message-flag-cluster"
regex = "^-[A-Za-z]*[mFCc]"

[[rule]]
id = "commit-message-obtainable"
kind = "policy"
scope = "mediated_call"
module = "policy/run-shape.rego"
severity = "deny"

[[rule]]
id = "privileged-lane-tests-origin"
kind = "policy"
scope = "tree"
sources = [".github/workflows/*.yml", ".github/workflows/*.yaml"]
module = "policy/privileged-lane.rego"
severity = "deny"

# CLOUD-876. `opa check -s` type checks the Rego corpus at build time because
# regorus ships no static undefined-field checker; regorus evaluates it at
# runtime. Two implementations of one language, so the pins must name one release
# or a rule green under the checker can differ under the evaluator — a false
# green, in the half nobody re-runs.
#
# A POLICY ROW RATHER THAN A GATE TASK, and the first draft got that wrong: it was
# bash, inside the bundle whose whole purpose is retiring bash (CLOUD-843 measured
# "the bash grew today" as the campaign's own defect). Everything decided here
# lives in two tracked TOML files, which is CLOUD-846's structured-config bucket.
[[rule]]
id = "opa-tracks-regorus-compliance"
kind = "policy"
scope = "tree"
sources = ["mise.toml", "Cargo.toml"]
module = "policy/opa-compliance.rego"
severity = "deny"

# CLOUD-876's LAST clause, and its own body calls it "the acceptance test that
# separates a gate from theatre". `opa check -s` types a module against a schema;
# it has nothing whatever to say about a module that declares no schema, and that
# is exactly the module nobody checked.
#
# MEASURED SIDE BY SIDE, on one module carrying a real typo (`input.tree.trackd`)
# and no `# METADATA schemas:` block:
#
#     mise exec -- opa check -s schema/ policy/  ->  exit 0  (types as `Any`)
#     mise exec -- regal lint policy/            ->  exit 3  (refuses it)
#
# So `policy-modules-type-check` below is worth precisely as much as this row's
# coverage, and without this row a NEW module is silently exempt from it the day
# it is added.
#
# The predicate is COVERAGE, not possession: a `# METADATA schemas:` block has
# package scope and OPA refuses a redeclaration, so two modules in one package
# share one binding and a per-file rule would report the other as a false
# positive. `.regal/rules/.../every_package_binds_input.rego` carries the reasoning.
[[rule]]
id = "policy-modules-bind-input"
kind = "command"
# `glob` NAMES THE LINTER'S OWN CONFIG, not the corpus it reads (CLOUD-614), and
# this row is where that idiom stopped being a style note. Globbed at
# `policy/**/*.rego` it fired inside `cli.rs`'s two `enforce` fixtures, which copy
# the committed modules in so the config loads at all: `mise exec` there runs
# under a stubbed `HOME` with no tool cache, so the row reported the launcher
# rather than the tree and put `policy/**/*.rego policy-modules-bind-input` on
# stdout in two tests about consumer shapes. A `command` row is `Cost::Effect`, so
# only `enforce` saw it — `check` never spawns one.
#
# The file is always present in this workspace and in no fixture, so the row runs
# here and nowhere else; `hk.pkl`'s `batten-check` glob is what decides WHEN it is
# worth asking, and it carries `policy/**/*.rego` for exactly that.
glob = ".regal/config.yaml"
check = "mise exec -- regal lint policy/"
severity = "deny"
scope = "tree"
no_fix_reason = "add a `# METADATA schemas:` block binding `input` to the schema for the module's surface — `schema[\"policy-input.schema\"]` for a tree-scoped module, `schema[\"policy-call.schema\"]` for a mediated_call one. One block per PACKAGE; OPA refuses a redeclaration"

# CLOUD-876's build-time type check, and the clause the whole row exists for: a
# module reading a field the engine never emits fails the BUILD rather than
# evaluating to undefined and reporting green (CLOUD-845).
#
# `opa` is the checker and regorus is the evaluator; `opa-tracks-regorus-compliance`
# above holds them to one release so this check and the runtime cannot disagree.
#
# THE `-s` DIRECTORY IS WHAT MAKES IT BITE, AND ONLY FOR ANNOTATED MODULES.
# Measured 2026-08-22: `opa check -s schema/` over a module reading
# `input.tree.trackd` with NO `# METADATA schemas:` block exits **0** -- the path
# types as `Any` and nothing is checked. Annotated, the same typo is
# `rego_type_error: undefined ref` naming `have:` and `want (one of):`. So the
# annotation requirement is not decoration beside this row; it is the half that
# makes this row mean anything, and it is the Regal aggregate rule's job.
[[rule]]
id = "policy-modules-type-check"
kind = "command"
# The schema directory rather than the corpus, for the reason spelled out on
# `policy-modules-bind-input` above: a glob over `policy/**` matches inside the
# fixtures that copy the committed modules, and `mise exec` cannot resolve there.
glob = "schema/policy-input.schema.json"
check = "mise exec -- opa check -s schema/ policy/"
severity = "deny"
scope = "tree"
no_fix_reason = "the module names an input path the engine does not emit; fix the path or add the fact, and read the `want (one of)` list in the error for what this surface actually carries"

# CLOUD-876's second gate, independent of which schema mechanism won. A module
# reaching for `rego.metadata.*` type checks fine under upstream `opa` and does
# something else entirely under the engine that actually ships: regorus has ZERO
# support for it — no lexer token, no parser arm, no builtin. So such a rule
# behaves one way in the build-time check and another at runtime, which is the
# exact skew `opa-tracks-regorus-compliance` above exists to prevent, arriving by
# a route a version pin cannot see.
#
# A `forbid` row rather than a Regal custom rule, because the predicate really is
# a literal: `rego.metadata` is one token sequence with no legitimate spelling in
# this corpus, and a row is the narrowest thing that decides it. Anything needing
# the policy AST goes to Regal; this does not.
# The custom Regal rule above is code, and the only thing that keeps it HONEST is
# its own suite: a rule whose predicate silently matches nothing reports the whole
# corpus unbound (twice, during development) or — the direction that ships — the
# whole corpus bound, and `regal lint` exits 0 either way. The suite pairs every
# arm, so `binds_input` hard-wired to a constant fails it in one direction or the
# other. Without this row the suite would run nowhere and the rule would be a
# linter guarded by nothing.
[[rule]]
id = "policy-lint-rule-tests"
kind = "command"
glob = ".regal/rules/**/*.rego"
check = "mise exec -- regal test .regal/rules"
severity = "deny"
scope = "tree"
no_fix_reason = "a custom Regal rule's own tests failed; `mise exec -- regal test .regal/rules` names the failing case. Every arm is paired on purpose — if only the negative arm still passes, the predicate has stopped discriminating"

[[rule]]
id = "no-rego-metadata"
kind = "forbid"
glob = "policy/**/*.rego"
pattern = "rego.metadata."
severity = "deny"
scope = "tree"
no_fix_reason = "regorus implements no `rego.metadata.*` builtin, so the rule would pass `opa check` and behave differently under the shipped engine. Carry whatever the annotation held as an explicit fact on the row or in the module itself."

[[rule]]
id = "claim-not-raced"
kind = "command"
glob = "mise-tasks/claim-race-check.sh"
check = "mise run claim-race-check"
severity = "deny"
scope = "tree"
no_fix_reason = "a raced claim is resolved on the board, not in this tree: take the frontier from `mise run graph-check`, and close the competing PR if it is stale rather than racing it"

# The one legitimate reduction this ratchet has seen, taken through the hatch its
# own `no_fix_reason` names — "restore the tests, or waive the reduction
# deliberately; which of the two is the whole question." Restoring is not an
# option here: CLOUD-515 deletes `plan-hold`, so `tests/plan-hold.bats`,
# `plan-hold-check.bats` and `plan-hold-guard.bats` cover code that no longer
# exists and there is nothing left for them to assert.
#
# UNNARROWED, and not for want of trying. A ratchet finding's `path` is the glob
# PLUS THE COUNTS — `rules.rs` builds `"{glob} {base}->{working}"`, because the
# finding is about the whole matched set rather than any one file. So there is no
# per-file path a `path =` could select, and a waiver written against the literal
# would embed `1600->1552` and lapse the moment either count moved. Whole-rule is
# the honest scope, and the expiry is what bounds it.
#
# EXPECTED TO LAPSE UNUSED. `base = "origin/main"`, so the moment this lands the
# floor becomes the new count on its own and this row suppresses nothing. It
# exists to get one commit past the gate, not to stand.
# The one residual false positive `no-secrets` finds on this tree, measured
# before the rule landed rather than discovered by it: ripsecrets matches
# `${GH_PAT}` in a `git config url."https://x-access-token:${GH_PAT}@…"` line as
# a credential embedded in a URL. It is a shell expansion of an Actions secret
# injected at runtime — the shape is real, the instance is not.
#
# A `[[waiver]]` and never `severity = "allow"`: switching the rule off would
# suppress every future finding too, while this names one path, states why, and
# LAPSES. The expiry is the mechanism — when it does, someone re-reads the line
# rather than inheriting a decision nobody remembers making.
[[waiver]]
rule = "no-secrets"
path = ".github/workflows/release-plz.yml"
reason = "ripsecrets reads `${GH_PAT}` in a git-config URL as an embedded credential; it is a shell expansion of an Actions secret, so nothing is committed. Re-check against the pinned scanner's next version."
expires = "2026-11-14"

[[waiver]]
rule = "tests-not-deleted"
reason = "CLOUD-780 retires four `git.rs` primitives, the pileup predicate and the `worktree reclaim` verb, and every deleted case named a deleted symbol (1850 -> 1834): `git.rs`'s worktree-listing and snapshot cases, `worktree.rs`'s pileup and reclaim cases, and `tests/cli.rs`'s whole pileup block. Deleting them with their subject is the Ready block's own §7 obligation — weakening them instead would leave assertions about a surface that no longer exists. What must NOT fall is the coverage beside them, and it does not: `worktree status`'s four surviving categories keep every case green with no assertion change, which is what proves the drop was surgical."
expires = "2026-09-13"

[ci]
required_checks = ["final"]

# ---------------------------------------------------------------------------
# What a commit subject must look like here (CLOUD-701).
#
# PRs land by fast-forward, so every commit reaches `main` with its own SHA and
# message, and release-plz derives semver and the changelog from those messages.
# That is why EACH commit must be conventional rather than just the PR title —
# and why this is policy rather than a lint preference.
#
# It used to be `CONVENTIONAL_RE` in `mise.toml [env]`. That file configures how
# tools are provisioned and run; a rule about what a commit may BE belongs to the
# engine that decides it, which is the correction `[attribution]` below is the
# worked precedent for (CLOUD-274).
#
# Consumer-specific by nature (non-negotiable rule 1): the vocabulary of types is
# this repository's answer, and the crate carries only the matcher.
#
# https://www.conventionalcommits.org/en/v1.0.0/
[commit]
subject_pattern = '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)([(][a-z0-9._-]+[)])?!?: .+'

# ---------------------------------------------------------------------------
# What produced commits may carry about the tooling that made them (CLOUD-274),
# enforcing the agent-neutral attribution decision record (CLOUD-268).
#
# The record separates three surfaces. AUTHORSHIP (author/committer,
# Co-authored-by, Signed-off-by) asserts accountability, which attaches to the
# identity that directs, reviews and adopts a change and never to a model.
# DISCLOSURE (one trailer in tool-identity form) asserts what tooling assisted,
# and communities diverge from disclosure-required to AI-forbidden, so it is a
# per-repo choice. PROVENANCE RECORDS carry the full answer and are Batten's own
# observability rather than git.
#
# WHY THE VENDOR LITERALS ARE HERE. This is the answer, not the mechanism:
# `crates/batten` holds the matcher and carries no vendor string, which extends
# non-negotiable rule 1 from consumers to vendors. A grep of `crates/` for any
# pattern below returns nothing, and the crate's own test suite asserts it.
#
# WHY THIS IS A GATE AND NOT A SETTING. Measured 2026-08-09: 39 of the first 50
# commits on `main` were authored by the injected vendor identity, 18 carried a
# model-versioned co-authorship trailer, 20 a session URL. The injection is
# environment-level and the host's own suppression setting does not govern every
# path, so the invariant is only checkable on the produced commit.
[attribution]
# Authorship. Both fields are judged: a repair reaching only `author` leaves the
# vendor identity on every commit's `committer`, absent from `git log`'s default
# format and fully public regardless.
identity_deny = [
  '^Claude <',
  '@noreply\.anthropic\.com>$',
  '\bclaude-(opus|sonnet|haiku|fable)\b',
]

# Trailers, matched against the whole `Key: value` line — a co-authorship form
# lives in the key, a session URL in the value.
#
# `^Assisted-by:` is here despite being the ALLOWED shape, and that is not a
# contradiction: deny is the default and `trailer_allow` below is the carve-out,
# so this one pair expresses every posture.
trailer_deny = [
  '^Co-Authored-By:.*(Claude|[Aa]nthropic)',
  '^Claude-Session:',
  'claude\.ai/code',
  '^Assisted-by:',
]

# Attribution-as-advertising in the message body. Narrow on purpose: a phrase
# whose function is a credit line, not any mention of a tool.
body_deny = [
  '[Gg]enerated with .*(Claude|Anthropic)',
  '🤖 Generated with',
]

# The carve-out from `trailer_deny`. EMPTY, and the emptiness IS this repo's
# posture — the record's §2.2 decided silent-with-records for Button repos, so
# nothing is exempt and every disclosure trailer is refused. A consumer that
# discloses sets the tool-identity shape here instead of touching any code:
#   trailer_allow = ['^Assisted-by: [a-z0-9-]+:[a-z0-9.-]+$']
# Empty means NO exemption, never "exempt everything" — an empty regex matches
# every input, so the engine branches on emptiness rather than compiling it.
trailer_allow = []

# The accountable identity `batten attribution identity` writes into the
# repo-local git config. Consumer-specific by nature: who answers for this
# repository's commits is a property of this repository.
[attribution.identity]
name = "Alec Wenzowski"
email = "alec@wenzowski.com"

# `mise.lock` joins the surface for a reason the other four do not share
# (CLOUD-581). A receipt records the epoch at its subject commit, so whatever is
# tracked here is what a receipt can later be held to. The clause list of an
# adopted external verifier — an SBOM conformance checker's standard edition, say
# — is owned and versioned by that tool, so the *edition* a check judged against
# lives in the pin and nowhere else. Without the lockfile in this set, a receipt
# reading "check X passed for SHA Y" cannot answer "against which edition", which
# is precisely the overclaim CLOUD-132 bounds.
#
# The cost is stated rather than discovered: a pin bump now moves the epoch and
# invalidates receipts, exactly as an AGENTS.md edit already does. That is the
# intended direction — a toolchain change IS a change in what decided the check.
[epoch]
# `.mcp.json` is here for the agent-context record (CLOUD-579), which covers the
# agent config a repository governs itself with through the epoch rather than by
# naming those paths in the engine — `crates/batten` must contain no consumer's
# filenames (rule 1). Which agent config governs a repository is that
# repository's business, so this is where the answer belongs.
#
# The record's own `coverage` states the limit this does NOT close: the file
# declares what the repository asks for, while the harness injects servers at
# runtime that are written to no file at all. Tracking it binds the declaration,
# never the effective set.
tracked = [
  "batten.toml",
  "AGENTS.md",
  "hk.pkl",
  "mise.lock",
  ".mcp.json",
  ".claude/settings.json",
]

# The contract surface a running session read at start (CLOUD-461). When one of
# these moves, `batten hook` tells the session once, on the advisory channel —
# hooks and instruction files are session-start snapshots (CLOUD-187), so a
# contract that lands mid-session binds nothing until it is re-read.
#
# NOT `[epoch] tracked`, and the difference is why both tables exist. That one is
# literal paths read one file each, because a config epoch must be a function of
# a STATED set — otherwise the value moves because of what happens to exist
# beside it. This one is globs over a rules directory and a task tree, because
# here a newly added file IS the drift, which a stated set cannot see. The
# overlap between the two lists is real and deliberate: they ask different
# questions about some of the same files.
[contract]
tracked = [
  "AGENTS.md",
  ".claude/rules/**",
  ".claude/settings.json",
  "hk.pkl",
  "mise-tasks/**",
]
# The subset that is the hook wiring, so the notice can say the wiring moved
# without the engine knowing any host's file layout (CLOUD-525). Literal paths:
# a glob here would let the notice claim the wiring moved because something
# merely near it did.
wiring = [".claude/settings.json"]

# ---------------------------------------------------------------------------
# What this repository attaches to hook events (house-style §9).
#
# THE FIRST HANDLER, AND IT IS A WORKED EXAMPLE (CLOUD-898). `[[hook.action]]`
# shipped with one because a plugin surface nobody uses is a surface nobody has
# tested; the same standard applies here, and this row is that test on the real
# wiring rather than in a fixture.
#
# `mcp-attach-check` was registered directly in `.claude/settings.json` beside
# `batten hook`. It is now dispatched BY `batten hook`, which changes nothing
# about what it decides and everything about what holds around it: the parent
# imposes the timeout, fail-open is central rather than re-derived in the
# script's own error paths, and its exit code and stdout are read under one
# stated contract instead of whatever each script happened to spell.
#
# WHY THIS ONE FIRST. It is the cheapest honest proof: it takes no arguments, it
# is already silent on success (CLOUD-891), and its verdict is a plain exit code
# — so a difference in behaviour after the move would be the DOOR's doing rather
# than the script's, which is what makes it a test of the door.
#
# `timeout_ms` is stated rather than defaulted, because the default exists for
# handlers nobody measured and this one IS measured: it reads MCP logs and
# returns in tens of milliseconds. A bound two orders above the measurement is
# generous without being meaningless.
[[hook.handler]]
id = "mcp-attach-check"
on = "user-prompt-submit"
run = ["mise-tasks/mcp-attach-check"]
timeout_ms = 2000
