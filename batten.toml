[[verdict]]
id = "spawn place missing"
gloss = "a module the adapter table does not place resolves the spawn type"
class = """
The adapter table says which modules own a delegated tool. A spawn outside them \
is a child process nobody placed, so route it through `exec` — the sanctioned \
boundary — or place the module beside the tool it delegates to. Resolved by NAME \
rather than by spelling: a byte scan would report `surface.rs`, which imports \
`clap::Command` and spawns nothing.
"""

[[verdict.route]]
id = "source read first"
kind = "document"
target = "crates/batten/src/exec.rs"

[[verdict.route]]
id = "module read first"
kind = "document"
target = "policy/spawn-adapters.rego"

