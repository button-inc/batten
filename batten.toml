[[verdict]]
id = "forge check red"
gloss = "the forge judged this commit and its fan-in check did not pass"
class = """
`final` is the fan-in every required job feeds, and CLOUD-900 records what naming the leaves instead buys: every failure becomes manufacturable by omitting a job. A recorded verdict that is anything but `success` on that check means the forge looked and refused. This is the DECISION half only — the polling stays outside the engine per CLOUD-1177 — so the remedy is to fix what CI refused and let the producer record the next verdict, never to re-read this one.
"""

[[verdict.route]]
id = "rule read first"
kind = "document"
target = ".claude/rules/toolchain.md"

[[verdict.route]]
id = "task run first"
kind = "command"
target = "mise run land"

[[verdict]]
id = "turn deny held"
gloss = "this session recorded refusals and the turn is ending again anyway"
class = """
The session's own record counts hook runs that denied, and the agent is stopping a second time with that count still standing. A first stop after refusals is work concluding; a repeat one is a finding produced and then left behind, which is the question `finding-sink-check` reads a transcript to answer. The count is derived from a hook run's exit code rather than from any prose, and no span of session text reaches this decision. A session with no transcript is never this class -- that is could-not-look, and reading it as clean is the false green CLOUD-990 measured.
"""

[[verdict.route]]
id = "module read first"
kind = "document"
target = "policy/denials-outlive-the-turn.rego"

[[verdict]]
id = "task run loose"
gloss = "this call is a weaker spelling of a task the project already defines"
class = """
The project defines a task whose own argv leads with the same program, so this call runs the tool directly and skips whatever the task adds -- strictness flags, a pinned toolchain, a paired step. The refusal names the task because that name IS the remedy: run it instead. A task with no single-command body is never matched, so this cannot refuse a call by naming a command the task does not actually run.
"""

[[verdict.route]]
id = "module read first"
kind = "document"
target = "policy/task-substitution.rego"

[[verdict]]
id = "memory resolve missing"
gloss = "the memory graph has no root, so it is findable only by listing the directory"
class = """
The reference model makes `mem:core` the discovery entry point, and a graph whose root is absent can be reached only by someone who already knows to list the directory. Judged only where memories exist at all: a repository carrying none is not a repository with a broken graph, and refusing there would make this rule unshippable over an ordinary tree.
"""

[[verdict.route]]
id = "prose read first"
kind = "document"
target = "AGENTS.md"

[[verdict]]
id = "memory name duplicate"
gloss = "a memory name strips to another name, so it cannot be addressed as written"
class = """
The tooling silently strips one trailing `.md`, so `foo.md.md` lists as `foo.md` and no reference can ever name the file by its own filename. The two spellings then compete for one address. Rename the file so its name survives the strip.
"""

[[verdict.route]]
id = "task run first"
kind = "command"
target = "mise run memories-check"

[[verdict]]
id = "memory name unseen"
gloss = "a memory name carries a character no reference can spell"
class = """
The reference matcher stops at the first character outside its charset, so a memory whose name carries one cannot be referenced at all -- it is in the graph and no edge can reach it. The charset is the `memory-name` registry row, which is the same grammar `mem-reference` reads, so the two cannot drift.
"""

[[verdict.route]]
id = "module read first"
kind = "document"
target = "policy/memories.rego"

[[verdict]]
id = "memory point stale"
gloss = "a `mem:` reference names a memory this tree does not carry"
class = """
A dangling edge. The reference tooling's own integrity check is advisory by construction and its rename command is the only thing that keeps referrers in sync, so a `git mv` or any direct write orphans every reference silently -- which is what this exists to make loud. Pointer-only: the referrer's `path:line`, never the surrounding prose.
"""

[[verdict.route]]
id = "prose read first"
kind = "document"
target = "AGENTS.md"

[[verdict]]
id = "memory read unread"
gloss = "a declared referrer could not be read, so its edges were never judged"
class = """
Could-not-look, and never a file with no stale references. A module iterating only the lines it received reports green over a file it never opened; this names the file instead. Distinct from a clean pass by construction, which is the whole point of the `missing` channel.
"""

[[verdict.route]]
id = "module read first"
kind = "document"
target = "policy/memories.rego"

[[verdict]]
id = "claim mint absent"
gloss = "a declared row was captured and carries no project"
class = """
The capture store answered for this row's declared key and the payload carries no project, so the row is unfiled and no board state can be read about it. Asked rather than a status because the store has no clock: it keeps every read and answers from the first in digest order, so a predicate over a mutable field would report a state that has since moved. Absence is not this class -- a key nothing captured leaves the id out of the map entirely, which is could-not-look and never a verdict.
"""

[[verdict.route]]
id = "task run first"
kind = "command"
target = "mise run claim-check"

[[verdict]]
id = "step declare missing"
gloss = "a step declaring the slow profile is not selected by the `check` hook"
class = "The false green the two-tier split can produce, and the asymmetric half: the pre-commit path still skips the step, so nothing looks wrong, while `mise run ci`, `verify` and CI have all silently stopped running it. The other direction — the tier stops being skipped at pre-commit — is loud and self-correcting, which is why this is the one with a gate."

[[verdict.route]]
id = "gate read first"
kind = "document"
target = "hk.pkl"

[[verdict]]
id = "tier list empty"
gloss = "something planned this tree and no step declares the slow profile"
class = "The tier has evaporated: every step would run at pre-commit, and every per-step assertion about the tier would pass over an empty set. Distinct from no record at all, which is could-not-look and refuses nothing."

[[verdict.route]]
id = "gate read first"
kind = "document"
target = "hk.pkl"

[[verdict]]
id = "hook declare missing"
gloss = "the git hook runs hk without `--profile '!slow'`, so every commit pays the slow tier"
class = "The economy half rather than the coverage half: the tier is still correct and CI is unaffected. Read from non-comment lines that actually run the hook, because the flag's own explanatory comment kept this green once when the flag had been deleted from the command."

[[verdict.route]]
id = "source read first"
kind = "document"
target = ".claude/hooks/git-hook.sh"

[[verdict]]
id = "tool judge dirty"
gloss = "a third-party validator judged this file and reported something"
class = """
The record exists under this row's exact key -- the declared tool, the version it was pinned at, and the digest of the bytes it read -- so a validator ran over THIS revision and did not report clean. Absence is not this class: a record under any other key is not found at all, which is what keeps a stale verdict from reading as a fresh one. The remedy is to fix what the validator named and let the producer record the next verdict, never to re-read this one.
"""

[[verdict.route]]
id = "module read first"
kind = "document"
target = "policy/validator-verdict-clean.rego"

[[verdict]]
id = "tag mint wrong"
gloss = "a release tag does not carry the shape this repository's release tooling mints"
class = """
`release-plz` mints `v<major>.<minor>.<patch>` and every downstream reading — what has shipped, what is due, what a range since the last release contains — orders and compares on that shape. A tag that does not carry it is either a hand cut nobody will find again or a prerelease the ordering will misplace. Retag it in the shape the tooling mints, or move it out of the `v*` namespace so it is not read as a release.
"""

[[verdict.route]]
id = "rule read first"
kind = "document"
target = ".claude/rules/commits.md"

[[verdict.route]]
id = "source read first"
kind = "document"
target = "release-plz.toml"

[[verdict]]
id = "lock write other"
gloss = "a lockfile platform key mise does not emit — install-time residue rather than a lock"
class = """
A key outside the set mise emits was written by an install on somebody's machine, not by a lock. The measured instance carried a checksum and no url and `lock-check` reported "complete and current" over it on every run, because regenerate-and-diff detects drift only and `mise lock` never removes an existing entry. Remove the key and regenerate; the setting that permits the write is `lock write unsafe`'s.
"""

[[verdict.route]]
id = "task run first"
kind = "command"
target = "mise run lock-check"

[[verdict]]
id = "lock reach missing"
gloss = "a platform this repository installs on has nothing to install from"
class = """
Scoped to the REQUIRED platforms deliberately: mise emits a provenance-only stub where upstream ships no artifact, and failing on every url-less block would fail this repository for a decision upstream made — the defect of the gate this replaces, one level down. A required platform with no block, or a block with no url, is the repository unable to provision itself. Regenerate the entry, or move the platform out of the required set in the module if this repository genuinely stopped installing on it.
"""

[[verdict.route]]
id = "task run first"
kind = "command"
target = "mise run lock-check"

[[verdict]]
id = "tool pin missing"
gloss = "a backend that fetches a release asset locks no platform, so it installs an unverified download"
class = """
Whether locking nothing is fine depends on the BACKEND, never on the absence: npm, pipx, cargo, go, gem and core:rust resolve through their own package manager and cannot lock a url, while a fetch-an-asset backend can. Keying it on the absence is how the one tool here installed from an unverified download passed for its whole life with a bare version and no checksum (CLOUD-281). Regenerate so the entry carries checksums, or move the tool to a backend that verifies.
"""

[[verdict.route]]
id = "config read first"
kind = "command"
target = "mise run lock-check"

[[verdict]]
id = "tool declare missing"
gloss = "a lockfile entry locks no platform and names no backend, so what it installs cannot be determined"
class = """
A different sentence from `tool pin missing` and a different remedy: that one says the tool installs something unverified, this says nothing in the committed bytes says what it installs at all. The entry is not a lock in any sense. Regenerate it, or remove it if the tool is gone.
"""

[[verdict.route]]
id = "config read first"
kind = "command"
target = "mise run lock-check"

[[verdict]]
id = "tool pin absent"
gloss = "a `[tools]` pin has no lockfile entry at all, so every CI job that installs it fails before any gate runs"
class = """
The omission every other class here is blind to, because each of them judges an entry that is PRESENT — and the one failure a local run structurally cannot see. `[settings] lockfile = false` means nothing here installs `--locked`, so the tool installs fine on this machine forever; CI passes `--locked` and dies at the INSTALL step, before a single gate runs, in every job whose install list names it. Measured on PR #272: a fully green `mise run verify`, then two required checks red for a pin neither of them owns.
"""

[[verdict.route]]
id = "config read first"
kind = "command"
target = "mise run lock-check"

[[verdict]]
id = "pin read stale"
gloss = "a `[tools]` pin names a version its lockfile entry does not"
class = """
`tool pin absent` asks whether a row is THERE; this asks whether it says the same thing as the pin, which is the only question `mise install --locked` actually answers — and the row being present is exactly what makes a stale one invisible locally. Satisfaction rather than equality: a locked version that EXTENDS the pin at a component boundary is fine, because most of this table is pinned that way. Regenerate and commit the result.
"""

[[verdict.route]]
id = "task run first"
kind = "command"
target = "mise run lock-check"

[[verdict]]
id = "lock write unsafe"
gloss = "the manifest re-enables install-time lockfile writes, so any `mise install` can write the residue this row rejects"
class = """
The other half of `lock write other` rather than a separate concern: that class is half a mechanism while any install can produce a residue key. A per-caller opt-out cannot reach a caller it does not own, which is how a sandbox's own provisioning kept dirtying the tree; `[settings] lockfile = false` denies the write to everyone. Set it false — the scheduled currency job opts back in with `MISE_LOCKFILE=true`.
"""

[[verdict.route]]
id = "task run first"
kind = "document"
target = "mise.toml"

[[verdict]]
id = "workflow run unsafe"
gloss = "a workflow installs with mise-action and sets no MISE_LOCKFILE, so it installs UNLOCKED and passes"
class = """
`lockfile = false` turns off the whole lockfile feature rather than only the write, so `mise install --locked` fails outright with "locked mode requires lockfile to be enabled" and a workflow has to set `MISE_LOCKFILE` itself. One that forgets does not fail loudly: mise-action passes `--locked` only when it detects a lockfile, so the job installs unlocked and goes green. A checksum check silently dropped, which is the class this row exists for. Add `MISE_LOCKFILE: "true"` to the workflow's env.
"""

[[verdict.route]]
id = "task run first"
kind = "document"
target = ".github/workflows/ci.yml"

[[verdict]]
id = "lock read unread"
gloss = "the manifest declares tools and the lockfile could not be read"
class = """
Could-not-look, and it is conditioned on there being a subject rather than fired wherever `batten check` runs: a manifest carrying a `[tools]` table is the repository saying it locks tools, and without one there is nothing to report. That scoping is the defect CLOUD-1164 records for `tree-clean`, avoided here rather than survived. A repository declaring tools with no lockfile in the index cannot be judged, which is not the same answer as a clean one.
"""

[[verdict.route]]
id = "task run first"
kind = "command"
target = "mise run lock-check"

[[verdict]]
id = "lock write partial"
gloss = "a staged lockfile entry carries a checksum with no url, so it reads as locked and cannot be used"
class = """
A platform entry with a checksum and no url is the partial shape a regenerate-and-diff gate structurally cannot catch: `mise lock` never removes or repairs an existing entry, so a stably wrong lockfile passes forever, and one did. Regenerate the entry with `mise run lock-complete`'s own tooling, or remove it — an absent lock is honest where a half-written one is not. Judged over the INDEX rather than the working tree, because this asks about the commit.
"""

[[verdict.route]]
id = "task run first"
kind = "command"
target = "mise run lock-complete"

[[verdict.route]]
id = "rule read first"
kind = "document"
target = ".claude/rules/toolchain.md"

[[verdict]]
id = "commit declare empty"
gloss = "a `Weakens:` trailer names no key, so it declares nothing while reading as a declaration"
class = """
`config-lint` compares the weakenings an author DECLARED in a `Weakens:` trailer against the ones `trust::weakenings` DETECTED. A trailer with nothing after the colon satisfies every "did the author declare something" reading and matches no detected weakening, so it buys the appearance of disclosure without the content. Name the key the change weakens, or drop the trailer — an absent declaration is honest where an empty one is not.
"""

[[verdict.route]]
id = "config read first"
kind = "document"
target = "batten.toml"

[[verdict.route]]
id = "rule read first"
kind = "document"
target = ".claude/rules/commits.md"

[[verdict]]
id = "hook wire duplicate"
gloss = "a registration on a merged surface outside this repository does not reach the mediator"
class = """
`PreToolUse` is ONE entry — the engine — and CLOUD-312 measured the alternative: six task-runner launches per Bash call, 1.247s serial to do milliseconds of policy, ~93% of it startup. A second decider registered beside the mediator re-introduces that cost and, worse, splits the verdict across two authorities that can disagree about one call. The wiring this judges is the launcher's own merged settings, which live outside this repository — CLOUD-1167's fact is what makes the question expressible at all, and the row that declares the file is the whole bound on what the module may read.
"""

[[verdict.route]]
id = "prose read first"
kind = "document"
target = "AGENTS.md"

[[verdict.route]]
id = "rule read first"
kind = "document"
target = ".claude/rules/toolchain.md"

# --- the rest of `hooks-wiring-check`'s consumer half (CLOUD-1160) ------------

[[verdict]]
id = "hook wire loose"
gloss = "a committed hook surface registers a command that is neither the mediator nor declared"
class = """
The engine registers ONE command per event and adjudicates every mediated call from `batten.toml`, so a second program on a committed hook surface is a second decider over the same call — the split authority CLOUD-312 exists to end. Retire the guard behind the engine, or declare it in `policy/harness-wiring.rego`'s table naming the issue that will. The finding points at the FILE and never at the command: a hook command carries this consumer's directory layout and the host's own variable prefix, which non-negotiable rule 4 keeps out of a gate's output.
"""

[[verdict.route]]
id = "config read first"
kind = "document"
target = "batten.toml"

[[verdict.route]]
id = "module read first"
kind = "document"
target = "policy/harness-wiring.rego"

[[verdict]]
id = "hook declare unnamed"
gloss = "a declared hook sibling names no issue, so it records a decision and nobody to ask"
class = """
A declaration with no owner is worse than none: it reads as a decision someone made and records nobody to ask, which is how a temporary exemption becomes permanent. Every row in the table is a registration this repository refuses and has not yet retired, so each names the issue that owns its retirement. Add the key, or delete the row and retire the command.
"""

[[verdict.route]]
id = "module read first"
kind = "document"
target = "policy/harness-wiring.rego"

[[verdict]]
id = "hook declare stale"
gloss = "a declared hook sibling matches nothing wired, so it is a licence with no subject"
class = """
The table only ever grows unless a retirement deletes its own row, and a row left behind is a licence the next command with a similar path inherits silently. Delete the row: its subject is gone. A row naming a MERGED surface is unenforced where no merged surface was read, so this is never raised on a runner that has no launcher file — an absent surface is could-not-look, not a clean one.
"""

[[verdict.route]]
id = "module read first"
kind = "document"
target = "policy/harness-wiring.rego"

# --- closing the raw path (CLOUD-1260) ---------------------------------------

[[verdict]]
id = "connector grant loose"
gloss = "a reduced tool is also granted raw, so the reduction decides nothing"
class = """
Dispatch and reduction save nothing while a cheaper-looking route to the full \
