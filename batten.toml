id = "V-BATS-NOT-PARALLEL"
gloss = "the shell suite's invocation lost the parallelism it was measured with"
class = """
A speed-up is the one kind of fix that rots silently: nothing fails when \
`--jobs` is dropped in a merge — the suite still passes, just slower — and the \
cost reappears in the lap economics where no gate is looking. `timeout-check` \
cannot see it either, since 3x headroom over p95 absorbs a return to serial \
without a red build. This class covers the flag, the backend that makes it work, \
the pin that makes the backend present, the workflow that installs it, and the \
spellings that cap the count below the machine.
"""

[[verdict.route]]
