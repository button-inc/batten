class = """
No `-m`, `-F`, `-C`, `--no-edit`, `--fixup` or `--squash`. Git opens $EDITOR and \
blocks, AFTER `pre-commit` has already spent the whole gate — measured at about \
four minutes (CLOUD-488). Write the message to a file and use \
`git commit -F <path>`, the one form that cannot rebind.
"""

[[verdict.route]]
id = "R-COMMIT-FROM-A-FILE"
kind = "command"
target = "git commit -F <path>"

# CLOUD-613. The sibling of the class above, and the distinction is worth two
# rows rather than one: that one is "git was told nothing about where the message
# comes from", this one is "git was told STDIN and nothing was put there". The
# remedy happens to be the same file, but the diagnosis a reader needs is not —
# an author who reads "name a message source" while looking at their own `-F -`
# concludes the gate is wrong.
[[verdict]]
id = "V-COMMIT-STDIN-UNBOUND"
gloss = "a `git commit -F -` has nothing redirected into the element it is written in, so it reads /dev/null"
class = """
The heredoc binds to the element that WRITES it. `git commit -F - && mise run \
land <<'EOF'` hands the message to `land` and leaves git reading the harness's \
/dev/null, so the commit is doomed at the instant it starts — and `githooks(5)` \
runs `pre-commit` BEFORE git asks for the message, so the whole gate is spent \
first and only then does git say "Aborting commit due to empty commit message". \
Measured 2026-08-12 on PR #375: about four minutes of gate on a doomed commit, \
and killing it took `kill -9` on the process group. A heredoc, `< msg.txt` or \
`<<< "$msg"` bound to git's OWN element is a message source and is allowed.
"""

[[verdict.route]]
id = "R-COMMIT-FROM-A-FILE-THAT-CANNOT-REBIND"
kind = "command"
target = "git commit -F <path>"

