gloss = "the workflow this rule judges would not parse, so nothing was decided"
class = """
A declared source that will not parse is not an absent one. Absent means the \
question does not apply to this tree; unparsed means the boundary tried to read \
the file and failed. Reporting them the same way is how a gate comes back green \
over a document it never opened, so this class is raised rather than the finding \
set being left empty.
"""

[[verdict.route]]
