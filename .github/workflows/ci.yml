name: CI

# CI minutes cost money; an agent's local execution does not. So CI runs as
# rarely as correctness allows:
#   - Only on NON-DRAFT PRs. Draft = still being verified locally; no CI.
#   - Not on push to main: main only advances by fast-forward to a commit that
#     already passed these exact checks on its PR, so re-running would be pure
#     waste.
# The jobs run the SAME `mise run` tasks an agent runs locally, so a green
# `mise run verify` locally means these will pass.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repo. Third-party actions are pinned
# to a full commit SHA (a moving tag is a supply-chain hole an attacker can move).
permissions:
  contents: read

# Make the per-job `install_args` lists below actually binding.
#
# mise auto-installs missing tools when a task runs (task.run_auto_install) or
# when `mise exec` needs one (exec_auto_install), both default true. With those
# on, narrowing the install list moves the cost instead of removing it: measured
# on run 31153705833, the `cross` job installed rust in 13s and then rebuilt the
# whole toolchain — serena's 72 Python packages, node, zig, prettier — inside
# `mise run cross-check`, which is why its work step went 21s -> 32s while the
# install step shrank by the same amount. Net zero, plus the overhead.
#
# Off, a tool a job did not ask for is a hard "command not found" instead of a
# silent re-download. That is the intended failure: `mise run ci-tools-check`
# keeps the names honest, and this keeps the lists honest.
env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  # `[settings] lockfile` is false so that no install can write the tracked
  # lockfile (CLOUD-223) — but that setting governs the whole lockfile feature,
  # not just the write, and mise-action installs with `--locked` whenever a
  # lockfile exists. Left alone, every job here dies on "locked mode requires
  # lockfile to be enabled". Turning it back on for CI is the right boundary and
  # not a concession: a locked install is exactly what a runner should do, and a
  # write here lands in a disposable checkout that is never committed from. The
  # property being protected is that a DEVELOPER's clone is never dirtied.
  # Every workflow using mise-action must set this; `mise run lock-complete`
  # fails if one does not.
  MISE_LOCKFILE: "true"

jobs:
  ci:
    name: ci
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-10
    # `actions: write` is here for one call and one only: cancelling THIS run
    # when the landing lease does not authorise this branch (CLOUD-420). A job
    # that could not cancel itself would have to fail instead, and a failed job
    # makes the run conclude `failure` rather than `cancelled` — which reds
    # `final` and makes `land` re-draft a healthy PR.
    permissions:
      contents: read
      actions: write
    steps:
      # CLOUD-420: THE LANDING LEASE, ENFORCED WHERE THE MONEY IS SPENT.
      # First step, before any checkout or toolchain install, because a run this
      # branch is not authorised to make should cost the rounding rather than a
      # matrix. The body is `mise-tasks/ci-lease-precondition` and every
      # justification lives there; it is fetched from `main` rather than from
      # this head, so a clone carrying stale rules cannot dodge the predicate by
      # carrying a stale copy of it. An unreadable body runs — fail open, which
      # is the whole posture: waving one matrix through costs one matrix, while
      # a predicate that cannot read itself would stop the fleet.
      - name: Landing lease precondition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEASE_HEAD_REF: ${{ github.head_ref }}
          # The HEAD sha, never `github.sha`: on a pull_request event that is the
          # merge commit, which carries trunk's `mise-tasks/land` whenever this
          # head did not touch it — and the staleness row reads exactly that file.
          LEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEASE_RUN_ID: ${{ github.run_id }}
        run: |
          body=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/mise-tasks/ci-lease-precondition?ref=main") || exit 0
          # `|| exit 0` on BOTH lines, and the second is the one that was missing
          # (CLOUD-420). A fetch that fails is handled; a fetch that SUCCEEDS with
          # something that is not shell was not — a truncated body, a proxy error
          # page returned 200, or a bad edit to the trunk copy makes this a syntax
          # error in the FIRST step of every job. The step reds under the runner's
          # default `bash -e {0}`, `final` fails its `needs:` assertion under
          # `always()`, and `land` re-drafts a healthy PR — fleet-wide, from one bad
          # response. The precondition's own header promises it never exits
          # non-zero; this is what makes that true at the call site too.
          bash -c "$body" || exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # tests/bats — the shell test runner. Without it `mise run test:bats`
          # has no bats to run.
          submodules: true
      # The committed `ratchet` rows count against `origin/main` (CLOUD-55), and
      # `actions/checkout` fetches only this PR's head — so that ref does not
      # exist here. An unresolvable base is exit 1 by design, never a pass, which
      # is the correct behaviour and precisely why the ref has to be supplied
      # rather than the refusal softened.
      #
      # `--depth=1` because a ratchet reads one tree, not a history: this is the
      # whole cost of the trunk comparison, and it is one commit rather than the
      # full clone `fetch-depth: 0` would pull on every run.
      - name: Fetch the ratchet base
        run: git fetch --depth=1 origin main:refs/remotes/origin/main
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          # Install only what this job's gates actually invoke, not the whole
          # 18-tool dev set. Every job used to install everything, and `zig`
          # (17.3s) finished last, so zig alone set the install wall clock in
          # all four jobs — three of which never invoke it. Measured per-tool on
          # run 31149330726: zig 17.3s, rust 13.9s, serena 6.7s, prettier 5.6s,
          # node 4.7s, everything else under 3s.
          #
          # This list IS the `gate` mapping in hk.pkl plus `deny`: hk drives the
          # steps; cargo-deny, shellcheck, shfmt, taplo, actionlint, pkl and
          # prettier (which needs node) are the step commands; rust covers
          # cargo-fmt/clippy/test and the `cargo metadata` in macos-link-check;
          # jq is used at runtime by the gh-guard program that `test:bats`
          # exercises; syft backs the sbom-check step, and jq reads its output.
          # bats itself is the tests/bats submodule, not a tool — but rush is
          # its parallel backend, and bats aborts rather than falling back when
          # the named binary is absent, so an omission here is a failed gate
          # rather than a quietly serial one.
          #
          # Kept out deliberately: zig and cargo-zigbuild (darwin-link only),
          # zizmor (its own zizmor.yml workflow), and gh, release-plz, uv and
          # serena, which back agent and release tasks that never run here.
          # `mise run ci-tools-check` fails if a name here drifts from mise.toml.
          #
          # Kept on ONE line on purpose: `mise run ci-tools-check` reads these
          # lists, and a single-line scalar is unambiguous to parse, where a
          # YAML block scalar's continuation lines are not (several tool names
          # here begin with `aqua:` and read as new keys).
          install_args: rust hk aqua:EmbarkStudios/cargo-deny aqua:koalaman/shellcheck aqua:mvdan/sh aqua:tamasfe/taplo aqua:rhysd/actionlint aqua:jqlang/jq aqua:anchore/syft aqua:shenwei356/rush pkl node npm:prettier
      # CLOUD-406. `hk.pkl:14` amends a pkl PACKAGE uri, and pkl resolves it over
      # the network on every evaluation — a second dependency beside the `hk`
      # binary `mise.lock` pins, and unpinned at runtime. Measured on run
      # 31632519615: the fetch of `hk@1.54.0.zip` failed, hk aborted with exit
      # 134 before reaching a single gate, and the `failure` grade then wedged
      # the SHA, because `land` re-fires a ready only on a head carrying no
      # graded run. An upstream blip on a release CDN became a red required
      # check on a branch that changed nothing.
      #
      # This is the only job that reaches hk — `hooks` (`hk check --all`) is a
      # dependency of `mise run ci` and of nothing else; `cross-check` and
      # `darwin-link` reach `doctor`, whose hook probe is skipped under CI, and
      # `msrv`/`semver` run neither. So one cache step covers the whole exposure
      # this repository controls.
      #
      # Keyed on `hk.pkl` itself, because the `amends` url lives in that file: a
      # version bump changes the key by construction, with no second version
      # string to keep honest (and `mise run hk-version` already gates that
      # `mise.toml` agrees with the url). Deliberately no `restore-keys` — a
      # prefix restore would hand this job a cache that is warm for the WRONG
      # version, which is a miss wearing a hit's costume.
      #
      # A miss behaves exactly as today and then populates, so the exposure
      # narrows from every run to one run per bump or eviction rather than being
      # removed. It cannot be removed here: `mise-action`'s own bootstrap fetch
      # precedes every seam this repository controls, which is why CLOUD-406
      # carries a recovery half as well as this one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pkl/cache
          key: pkl-${{ runner.os }}-${{ hashFiles('hk.pkl') }}
      # Caching is left at its default (save on), which means each PR writes and
      # restores its OWN cache. That is safe without any `save-if` guard because
      # GitHub scopes a cache to the ref that created it: a `pull_request` run
      # writes under `refs/pull/N/merge`, restorable only by re-runs of that same
      # PR — never by another PR and never by main. Cross-PR poisoning is not
      # something this workflow has to prevent; the platform already does.
      #
      # The previous `save-if: github.ref == 'refs/heads/main'` could never be
      # true, because this workflow runs on `pull_request` only (see the header:
      # main advances by fast-forward to already-tested commits, so it is
      # deliberately not a trigger). The cache was therefore never written and
      # every restore missed — the step was pure overhead while reading as though
      # caching were handled. Measured cold on 6730729: ci 74s, cross 53s,
      # darwin-link 66-75s, against ~7s for a warm local darwin link.
      #
      # What this does NOT fix: the first run of a new PR is still cold, because
      # only a cache on the base branch could warm it and nothing writes there.
      # CLOUD-176 costed that warming and decided against it — a warm job per
      # merge spends ~178s of job-time to save ~60s on one PR's first run, and
      # runs 2..N (where the volume is) already restore the PR's own cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run ci
        env:
          # `test:bats` depends on `doctor`, which by default also installs the
          # rustup cross targets — two std downloads this job never uses, since
          # cross-check and darwin-link are their own jobs. Set but empty means
          # "assert the submodule, no rust targets"; unset would take the
          # default pair.
          DOCTOR_TARGETS: ""

  cross:
    name: cross
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-10
    # `actions: write` is here for one call and one only: cancelling THIS run
    # when the landing lease does not authorise this branch (CLOUD-420). A job
    # that could not cancel itself would have to fail instead, and a failed job
    # makes the run conclude `failure` rather than `cancelled` — which reds
    # `final` and makes `land` re-draft a healthy PR.
    permissions:
      contents: read
      actions: write
    steps:
      # CLOUD-420: THE LANDING LEASE, ENFORCED WHERE THE MONEY IS SPENT.
      # First step, before any checkout or toolchain install, because a run this
      # branch is not authorised to make should cost the rounding rather than a
      # matrix. The body is `mise-tasks/ci-lease-precondition` and every
      # justification lives there; it is fetched from `main` rather than from
      # this head, so a clone carrying stale rules cannot dodge the predicate by
      # carrying a stale copy of it. An unreadable body runs — fail open, which
      # is the whole posture: waving one matrix through costs one matrix, while
      # a predicate that cannot read itself would stop the fleet.
      - name: Landing lease precondition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEASE_HEAD_REF: ${{ github.head_ref }}
          # The HEAD sha, never `github.sha`: on a pull_request event that is the
          # merge commit, which carries trunk's `mise-tasks/land` whenever this
          # head did not touch it — and the staleness row reads exactly that file.
          LEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEASE_RUN_ID: ${{ github.run_id }}
        run: |
          body=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/mise-tasks/ci-lease-precondition?ref=main") || exit 0
          # `|| exit 0` on BOTH lines, and the second is the one that was missing
          # (CLOUD-420). A fetch that fails is handled; a fetch that SUCCEEDS with
          # something that is not shell was not — a truncated body, a proxy error
          # page returned 200, or a bad edit to the trunk copy makes this a syntax
          # error in the FIRST step of every job. The step reds under the runner's
          # default `bash -e {0}`, `final` fails its `needs:` assertion under
          # `always()`, and `land` re-drafts a healthy PR — fleet-wide, from one bad
          # response. The precondition's own header promises it never exits
          # non-zero; this is what makes that true at the call site too.
          bash -c "$body" || exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # tests/bats — the shell test runner. Without it `mise run test:bats`
          # has no bats to run.
          submodules: true
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          # cross-check is `rustup target add` + `cargo check`; rust is the only
          # tool it touches. See the ci job for why these lists are narrow.
          install_args: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run cross-check
        env:
          # Only the triple cross-check type-checks. doctor's default pair would
          # additionally pull the Darwin std, which darwin-link's own job owns.
          DOCTOR_TARGETS: x86_64-pc-windows-gnu

  # The macOS gate. `cargo check` never links, so it cannot see a dependency that
  # needs an Apple SDK; this LINKS a Darwin target, which is the only check with
  # no false negatives. It runs concurrently with ci/cross, and the Darwin
  # triples were removed from cross-check so nothing is done twice.
  #
  # ONE target, not both. What this gate asserts — that nothing in the dependency
  # graph pulls in an Apple SDK or system framework — is a property of the
  # dependency graph, not of the word size, so linking aarch64 proves it. The
  # x86_64 leg was a near-duplicate job sitting on the critical path, which is
  # the same duplicate work the cross-check note above refuses. Coverage is not
  # dropped, only moved later: release-artifacts.yml builds BOTH Darwin targets
  # through zigbuild, so an x86_64-only linker problem still cannot reach a
  # shipped artifact. The matrix stays rather than collapsing to a plain job, so
  # restoring the second leg is a one-word change if the trade stops holding.
  darwin-link:
    name: darwin-link (${{ matrix.target }})
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-10
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin]
    # `actions: write` is here for one call and one only: cancelling THIS run
    # when the landing lease does not authorise this branch (CLOUD-420). A job
    # that could not cancel itself would have to fail instead, and a failed job
    # makes the run conclude `failure` rather than `cancelled` — which reds
    # `final` and makes `land` re-draft a healthy PR.
    permissions:
      contents: read
      actions: write
    steps:
      # CLOUD-420: THE LANDING LEASE, ENFORCED WHERE THE MONEY IS SPENT.
      # First step, before any checkout or toolchain install, because a run this
      # branch is not authorised to make should cost the rounding rather than a
      # matrix. The body is `mise-tasks/ci-lease-precondition` and every
      # justification lives there; it is fetched from `main` rather than from
      # this head, so a clone carrying stale rules cannot dodge the predicate by
      # carrying a stale copy of it. An unreadable body runs — fail open, which
      # is the whole posture: waving one matrix through costs one matrix, while
      # a predicate that cannot read itself would stop the fleet.
      - name: Landing lease precondition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEASE_HEAD_REF: ${{ github.head_ref }}
          # The HEAD sha, never `github.sha`: on a pull_request event that is the
          # merge commit, which carries trunk's `mise-tasks/land` whenever this
          # head did not touch it — and the staleness row reads exactly that file.
          LEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEASE_RUN_ID: ${{ github.run_id }}
        run: |
          body=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/mise-tasks/ci-lease-precondition?ref=main") || exit 0
          # `|| exit 0` on BOTH lines, and the second is the one that was missing
          # (CLOUD-420). A fetch that fails is handled; a fetch that SUCCEEDS with
          # something that is not shell was not — a truncated body, a proxy error
          # page returned 200, or a bad edit to the trunk copy makes this a syntax
          # error in the FIRST step of every job. The step reds under the runner's
          # default `bash -e {0}`, `final` fails its `needs:` assertion under
          # `always()`, and `land` re-drafts a healthy PR — fleet-wide, from one bad
          # response. The precondition's own header promises it never exits
          # non-zero; this is what makes that true at the call site too.
          bash -c "$body" || exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          # zig supplies the Darwin linker and cargo-zigbuild drives cargo
          # through it; rust is the compiler. Nothing else is invoked here —
          # and this is the ONLY job that needs zig, the 17.3s pole the other
          # jobs used to pay for nothing. See the ci job.
          install_args: rust zig github:rust-cross/cargo-zigbuild
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A per-target key: a leg's artifacts are target-specific and would
          # otherwise thrash a shared entry if the second leg is restored.
          key: ${{ matrix.target }}
      - run: mise run darwin-link ${{ matrix.target }}
        env:
          # Exactly the target being linked; doctor's default would also fetch
          # the Windows std that cross-check's own job owns.
          DOCTOR_TARGETS: ${{ matrix.target }}

  # `rust-version` is a claim this repo publishes, and the other jobs cannot
  # check it: they compile with the toolchain mise pins, which is a different
  # number that merely happens to match today. A dependency bump that raises the
  # required compiler leaves every job above green and the declared floor false.
  # Its own job rather than a step in `ci` because it drives a second toolchain
  # through rustup and would otherwise serialize behind that job's cargo chain.
  msrv:
    name: msrv
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-11
    # `actions: write` is here for one call and one only: cancelling THIS run
    # when the landing lease does not authorise this branch (CLOUD-420). A job
    # that could not cancel itself would have to fail instead, and a failed job
    # makes the run conclude `failure` rather than `cancelled` — which reds
    # `final` and makes `land` re-draft a healthy PR.
    permissions:
      contents: read
      actions: write
    steps:
      # CLOUD-420: THE LANDING LEASE, ENFORCED WHERE THE MONEY IS SPENT.
      # First step, before any checkout or toolchain install, because a run this
      # branch is not authorised to make should cost the rounding rather than a
      # matrix. The body is `mise-tasks/ci-lease-precondition` and every
      # justification lives there; it is fetched from `main` rather than from
      # this head, so a clone carrying stale rules cannot dodge the predicate by
      # carrying a stale copy of it. An unreadable body runs — fail open, which
      # is the whole posture: waving one matrix through costs one matrix, while
      # a predicate that cannot read itself would stop the fleet.
      - name: Landing lease precondition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEASE_HEAD_REF: ${{ github.head_ref }}
          # The HEAD sha, never `github.sha`: on a pull_request event that is the
          # merge commit, which carries trunk's `mise-tasks/land` whenever this
          # head did not touch it — and the staleness row reads exactly that file.
          LEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEASE_RUN_ID: ${{ github.run_id }}
        run: |
          body=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/mise-tasks/ci-lease-precondition?ref=main") || exit 0
          # `|| exit 0` on BOTH lines, and the second is the one that was missing
          # (CLOUD-420). A fetch that fails is handled; a fetch that SUCCEEDS with
          # something that is not shell was not — a truncated body, a proxy error
          # page returned 200, or a bad edit to the trunk copy makes this a syntax
          # error in the FIRST step of every job. The step reds under the runner's
          # default `bash -e {0}`, `final` fails its `needs:` assertion under
          # `always()`, and `land` re-drafts a healthy PR — fleet-wide, from one bad
          # response. The precondition's own header promises it never exits
          # non-zero; this is what makes that true at the call site too.
          bash -c "$body" || exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          # rust supplies the cargo, the rustup that fetches the declared
          # toolchain, and the compiler itself; jq reads `rust-version` out of
          # `cargo metadata`. Nothing else is invoked, and no MSRV tool is pinned
          # — see the note above `[tasks.msrv]` in mise.toml for why cargo-msrv
          # is not usable here. See the ci job for why these lists are narrow.
          install_args: rust aqua:jqlang/jq
      # A distinct key: this job's target dir is built by a different rustc than
      # every other job's, so sharing an entry would thrash it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      - run: mise run msrv

  semver:
    name: semver
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-12
    # `actions: write` is here for one call and one only: cancelling THIS run
    # when the landing lease does not authorise this branch (CLOUD-420). A job
    # that could not cancel itself would have to fail instead, and a failed job
    # makes the run conclude `failure` rather than `cancelled` — which reds
    # `final` and makes `land` re-draft a healthy PR.
    permissions:
      contents: read
      actions: write
    steps:
      # CLOUD-420: THE LANDING LEASE, ENFORCED WHERE THE MONEY IS SPENT.
      # First step, before any checkout or toolchain install, because a run this
      # branch is not authorised to make should cost the rounding rather than a
      # matrix. The body is `mise-tasks/ci-lease-precondition` and every
      # justification lives there; it is fetched from `main` rather than from
      # this head, so a clone carrying stale rules cannot dodge the predicate by
      # carrying a stale copy of it. An unreadable body runs — fail open, which
      # is the whole posture: waving one matrix through costs one matrix, while
      # a predicate that cannot read itself would stop the fleet.
      #
      # This job in particular is the one the sensor caught: `semver` landed on
      # `main` while this change was in flight, and property 7 refused the merge
      # until it carried the step too. That is the sensor working, and the reason
      # it is a gate rather than a paragraph.
      - name: Landing lease precondition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEASE_HEAD_REF: ${{ github.head_ref }}
          # The HEAD sha, never `github.sha`: on a pull_request event that is the
          # merge commit, which carries trunk's `mise-tasks/land` whenever this
          # head did not touch it — and the staleness row reads exactly that file.
          LEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEASE_RUN_ID: ${{ github.run_id }}
        run: |
          body=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/mise-tasks/ci-lease-precondition?ref=main") || exit 0
          # `|| exit 0` on BOTH lines, and the second is the one that was missing
          # (CLOUD-420). A fetch that fails is handled; a fetch that SUCCEEDS with
          # something that is not shell was not — a truncated body, a proxy error
          # page returned 200, or a bad edit to the trunk copy makes this a syntax
          # error in the FIRST step of every job. The step reds under the runner's
          # default `bash -e {0}`, `final` fails its `needs:` assertion under
          # `always()`, and `land` re-drafts a healthy PR — fleet-wide, from one bad
          # response. The precondition's own header promises it never exits
          # non-zero; this is what makes that true at the call site too.
          bash -c "$body" || exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The comparison needs the baseline commit, not just this head: the
          # task passes `--baseline-rev origin/main`, and a shallow clone has no
          # such ref to build the baseline rustdoc from.
          fetch-depth: 0
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          # cargo-semver-checks does the comparison; rust supplies the cargo and
          # the rustup that fetches the newer toolchain the tool requires — see
          # the note beside `[tools]` in mise.toml for why that is the tool's
          # constraint and not the crate's. See the ci job for why these lists
          # are narrow.
          install_args: rust github:obi1kenobi/cargo-semver-checks
      # A distinct key: this job builds rustdoc with a different rustc than every
      # other job's, so sharing an entry would thrash it — the same reason msrv
      # carries its own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: semver
      - run: mise run semver

  # The latency regression gate on the surface that reaches a person (CLOUD-172).
  #
  # WHY THIS JOB EXISTS AT ALL, since `perf-gate` is already a step in `verify`.
  # The issue's Done clause is "a PR that regresses past the threshold FAILS A
  # CHECK that names the regressed measurement", and `verify` is not a check —
  # it is what an author runs locally. `[tasks.ci]` is `depends = ["hooks",
  # "deny"]`, so nothing in CI ran `perf-gate`: the gate existed and no runner
  # ever invoked it, which is a gate that decides nothing about a pull request.
  # A regression would have reached `main` past a green required check.
  #
  # It is affordable for the reason `perf-gate`'s own header argues: the gate
  # exits clean without building anything when the diff against the merge base
  # touches no crate source, manifest or lockfile. Most of this repository's
  # traffic is task-layer, workflow and documentation changes, which pay a
  # `git diff --name-only` here and nothing more. Only a change that can have
  # moved the binary pays for two release builds.
  #
  # Deliberately NOT the recording half. `perf-record` writes the series and
  # refuses to run off `main`; it runs from `perf.yml` on a schedule, because a
  # push-to-`main` trigger is forbidden (AGENTS.md) and `main` only ever advances
  # by fast-forward to a SHA this job already judged.
  perf:
    name: perf
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20 # budget: measured=2026-08-13 two release builds plus 2x110 samples
    # `actions: write` is here for one call and one only: cancelling THIS run
    # when the landing lease does not authorise this branch (CLOUD-420). A job
    # that could not cancel itself would have to fail instead, and a failed job
    # makes the run conclude `failure` rather than `cancelled` — which reds
    # `final` and makes `land` re-draft a healthy PR.
    permissions:
      contents: read
      actions: write
    steps:
      # CLOUD-420: THE LANDING LEASE, ENFORCED WHERE THE MONEY IS SPENT. First
      # step, before any checkout or toolchain install, for the reason the `ci`
      # job states at length: a run this branch is not authorised to make should
      # cost the rounding rather than a matrix. `|| exit 0` on both lines.
      - name: Landing lease precondition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEASE_HEAD_REF: ${{ github.head_ref }}
          LEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEASE_RUN_ID: ${{ github.run_id }}
        run: |
          body=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/mise-tasks/ci-lease-precondition?ref=main") || exit 0
          bash -c "$body" || exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `perf-pair` builds BOTH arms — the merge base and this head — so the
          # baseline commit has to be in the clone. A shallow checkout has no
          # merge base, and an unresolvable base is exit 2 by design rather than
          # a pass, so this would fail loudly rather than measure nothing.
          fetch-depth: 0
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          # rust builds the two binaries under measurement, hyperfine samples
          # them, jq reads the ratio out. See the ci job for why these lists are
          # narrow.
          install_args: rust aqua:sharkdp/hyperfine aqua:jqlang/jq
      # A distinct key: this job builds `--release`, where every other cargo job
      # here builds debug, so sharing an entry would thrash it — the same reason
      # msrv and semver carry their own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: perf
      - run: mise run perf-gate

  # Single fan-in status. Point branch protection at `final` instead of
  # enumerating every leg, so adding a job never requires a ruleset change.
  #
  # It aggregates TWO kinds of verdict, and only one of them can arrive through
  # `needs:`. Our own jobs do. An external analyzer's check-run cannot: `needs:`
  # resolves to jobs in this file, and `SonarCloud Code Analysis` is posted on
  # the commit by a GitHub App, so there is no job here to name. It is read by
  # NAME in the second step instead — which is what keeps the merge contract
  # itself unchanged. The host still requires exactly `final`; what `final`
  # means got wider, and that is the property the fan-in exists to provide.
  final:
    name: final
    # `always()`, AND NOT `!cancelled()` — which was tried here and reverted,
    # because the obvious reading of what a cancelled run should do to this job
    # is the dangerous one. Both halves were checked rather than reasoned about:
    #
    #   1. An `always()` job DOES run when the run is cancelled, and then fails
    #      its `needs:` assertion. Observed on run 31566043914: `ci` cancelled,
    #      `final` executed at 05:19:37 and went red. So CLOUD-420's cancelling
    #      of an unauthorised run reds this check, which looks like a reason to
    #      skip instead.
    #   2. `!cancelled()` skips it — and GitHub documents that a job skipped by
    #      its own `if:` "will report its status as 'Success'. It will not
    #      prevent a pull request from merging, even if it is a required check."
    #      `final` is the ONLY check the host requires (see above), so that turns
    #      every lease-stopped run into a green required check over a head where
    #      nothing was compiled, tested, linted or analysed — and a maintainer's
    #      `/fast-forward`, whose stated safety property is "that exact SHA
    #      already has the required checks green", would land it.
    #
    # A false red costs a rebase. A false green lands untested code on `main`.
    # `success` is the only conclusion GitHub lets a job report as "fine", so a
    # run that was DECLINED must report something else, and red is the only
    # something else a job that ran can produce. The misleading part of that red
    # is answered where it belongs — `ci-lease-precondition` emits an `::error::`
    # annotation naming the lease and the remedy, so the run says why.
    #
    # This is also why `always()` is not merely the old value restored: it now
    # carries the reason it cannot change, so the next reader who notices that a
    # stopped run reds `final` does not re-derive the skip and ship it.
    if: ${{ always() && github.event.pull_request.draft == false }}
    needs: [ci, cross, darwin-link, msrv, semver, perf]
    runs-on: ubuntu-latest
    # `checks: read` is the whole reason this job now needs a permission at all:
    # the analyzer's verdict is a check-run on the head commit.
    permissions:
      contents: read
      checks: read
    timeout-minutes: 5 # budget: grandfathered measured=2026-08-10
    steps:
      # Asserted over `needs.*`, never over an enumeration of it. The enumerated
      # form listed three of the four dependencies — `msrv` was added to `needs:`
      # and never to the assertion — so a red `msrv` produced a green `final`,
      # which is the only check the host requires (CLOUD-351). A fan-in whose
      # assertion is a hand-written restatement of its own `needs:` has two
      # authorities for one fact, and only the restatement decides. This form has
      # one: a job added to `needs:` is gated the moment it is added, which is
      # what the fan-in design promised and did not have.
      #
      # Three conclusions rather than one `= "success"` per job: `contains`
      # cannot express "all", so the equivalent is "none of the not-success
      # ones". That set is exhaustive for a `needs` result — success, failure,
      # cancelled, skipped — so this is the same predicate, not a weaker one.
      - name: Assert all required jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          [ "${{ contains(needs.*.result, 'failure') }}" = "false" ] &&
            [ "${{ contains(needs.*.result, 'cancelled') }}" = "false" ] &&
            [ "${{ contains(needs.*.result, 'skipped') }}" = "false" ]

      # The external half. Ordered after the `needs:` assertion on purpose: a
      # red leg of ours is the cheaper, more actionable answer, and there is no
      # reason to spend a checkout and an install to add a second one to it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          # `gh` reads the check-runs; `jq` is what `gh --jq` needs. Nothing
          # else — this job compiles nothing. See the `ci` job for why these
          # lists are narrow and why auto-install is off.
          install_args: aqua:cli/cli aqua:jqlang/jq
      # A bounded RETRY, not a wall-clock wait. The analyzer grades in seconds
      # (measured on #348: 12s from push, against minutes for the matrix beside
      # it), so by the time every `needs:` job is terminal its verdict is
      # essentially always in. "Essentially always" is not always, and exit 3 —
      # `pending`, or a `skipped` awaiting its replacement — is precisely the
      # state a moment's patience resolves. Six tries is the backstop on a
      # runaway, the same shape as `LAND_MAX_LAPS`.
      #
      # An exhausted 3 FAILS. A non-answer is not a pass anywhere else in this
      # repository, and it must not become one on the single check the host
      # requires.
      - name: Assert the external analyzer's verdict
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            mise run sonar-gate && exit 0
            status=$?
            [ "$status" = 3 ] || exit "$status"
            echo "sonar-gate: attempt $attempt of 6 found no answer; retrying in 10s"
            sleep 10
          done
          echo "::error:: the analyzer never reached a verdict on $SHA. A non-answer is not a pass." >&2
          exit 1
