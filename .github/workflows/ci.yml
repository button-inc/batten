name: CI

# CI minutes cost money; an agent's local execution does not. So CI runs as
# rarely as correctness allows:
#   - Only on NON-DRAFT PRs. Draft = still being verified locally; no CI.
#   - Not on push to main: main only advances by fast-forward to a commit that
#     already passed these exact checks on its PR, so re-running would be pure
#     waste.
# The jobs run the SAME `mise run` tasks an agent runs locally, so a green
# `mise run verify` locally means these will pass.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repo. Third-party actions are pinned
# to a full commit SHA (a moving tag is a supply-chain hole an attacker can move).
permissions:
  contents: read

jobs:
  ci:
    name: ci
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # tests/bats — the shell test runner. Without it `mise run test:bats`
          # has no bats to run.
          submodules: true
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Only main writes the cache, so a PR cannot poison the cache other PRs restore.
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run ci

  cross:
    name: cross
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # tests/bats — the shell test runner. Without it `mise run test:bats`
          # has no bats to run.
          submodules: true
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run cross-check

  # The macOS gate. `cargo check` never links, so it cannot see a dependency that
  # needs an Apple SDK; this LINKS both Darwin targets, which is the only check
  # with no false negatives. One target per leg so the two run concurrently with
  # each other AND with ci/cross — it is off the critical path, not on it, and
  # the Darwin triples were removed from cross-check so nothing is done twice.
  darwin-link:
    name: darwin-link (${{ matrix.target }})
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A per-target key: the two legs build different artifacts and would
          # otherwise thrash one shared entry.
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run darwin-link ${{ matrix.target }}

  # Single fan-in status. Point branch protection at `final` instead of
  # enumerating every leg, so adding a job never requires a ruleset change.
  final:
    name: final
    if: ${{ always() && github.event.pull_request.draft == false }}
    needs: [ci, cross, darwin-link]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert all required jobs passed
        run: |
          echo "ci=${{ needs.ci.result }} cross=${{ needs.cross.result }} darwin-link=${{ needs.darwin-link.result }}"
          [ "${{ needs.ci.result }}" = "success" ] &&
            [ "${{ needs.cross.result }}" = "success" ] &&
            [ "${{ needs['darwin-link'].result }}" = "success" ]
