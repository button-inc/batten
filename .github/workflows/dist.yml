name: dist

# workflow-shell: CLOUD-2554 the release's dist job moved here verbatim, and a
# pull request's run takes the landing-lease step every pull-request job starts
# with; that lease step is the one step the count gains.

# THE ONE PATH TO PRODUCTION (CLOUD-2554). This is the release build: every
# leg's toolchain install, build, archive, packages, binary inventory and its
# check. `release-artifacts.yml` calls it with the draft's `tag` to fill it;
# `rust.yml` calls it on every pull request with none, so a release runs
# exactly the steps, install lists and runners a pull request went green on. Until this file, the release's dist job was a second definition no pull
# request ran, and v0.0.217's Windows and macOS legs met their steps for the
# first time at the cut, after `main` already pinned it.
#
# ONLY THE WRITES ARE GATED, ON THE TAG: the release guard, every `gh release
# upload` and the attestation run when a `tag` names a draft; everything that
# builds or judges the bytes runs on both paths. One input, so a caller cannot
# ask to upload with no draft to upload into.

on:
  workflow_call:
    inputs:
      sha:
        description: The commit every leg builds (the release head, or the pull request's head)
        required: true
        type: string
      tag:
        description: The draft release the upload steps fill and attest; empty on a pull request, which builds and judges without writing
        required: false
        type: string
        default: ""

# A CALLER'S `env:` DOES NOT REACH A CALLED WORKFLOW, so the binding is
# declared here (CLOUD-2553): each leg installs its list and nothing else.
env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  # Restores locked installs, which `[settings] lockfile = false` turns off
  # along with the install-time write it exists to deny (CLOUD-223). A runner
  # should install locked, and its checkout is disposable, so a write here
  # costs nothing; the clone being protected is a developer's.
  MISE_LOCKFILE: "true"

jobs:
  # CARGO-DIST BUILDS EVERY LEG (CLOUD-2297). `dist build --artifacts=local`
  # compiles through `cargo auditable`, archives under dist's own name
  # (`batten-<target>.tar.gz`, `.zip` on Windows), writes the `.sha256` beside
  # it, and prints the manifest fragment the `installers` job reads checksums
  # from. dist refuses to cross-compile to macOS from Linux (its `tasks.rs`,
  # "we cowardly refuse"), so each target builds on its own OS: Linux targets
  # on ubuntu through zigbuild, Darwin on macOS, Windows on Windows.
  #
  # THE VERSIONED NAME IS STILL PUBLISHED. Every shipped engine fetches
  # `batten-<tag>-<target>` and `SHA256SUMS` (`engine::release_asset`,
  # `engine::fetch_release`), so a release without them reads as unpublished to
  # `engine update`. The archive is uploaded under both names until no
  # supported pin's engine reads the versioned one.
  dist:
    name: dist (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45 # budget: grandfathered measured=2026-10-15
    # NO `permissions:` HERE: a called job runs under its caller's grant,
    # so the release grants its upload and attestation scopes and a pull
    # request grants only `contents: read` (CLOUD-2554).
    strategy:
      # One target's failure must not cancel the others: a partial release we can
      # top up beats no release at all.
      fail-fast: false
      matrix:
        # `build-tool` builds nothing: every leg runs `batten dist` with
        # `DIST_BUILD_TOOL: cargo-dist`, and dist chooses the linker from host
        # and target. It survives only as the label
        # `policy/release-assets.rego` reads to demand a binary SBOM from every
        # leg not on `cross`, which no leg is; retiring it with that arm is
        # CLOUD-2348's.
        include:
          # glibc wherever the host has a new enough one; dist's installer falls
          # back to musl only where it does not (CLOUD-1861's 8.7x cost).
          # `nfpm-arch` names the Linux package architecture (CLOUD-2298): a glibc
          # leg packages .deb and .rpm, a musl leg .apk for Alpine's libc.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            build-tool: cargo
            nfpm-arch: amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            build-tool: zigbuild
            nfpm-arch: arm64
          # musl gives the statically linked binary §12 asks for — it runs on any
          # Linux regardless of glibc version.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            build-tool: zigbuild
            nfpm-arch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            build-tool: zigbuild
            nfpm-arch: arm64
          # The gnu triple, kept so a shipped Windows engine finds its own target
          # in the next release (`engine::running_target`). On a Windows runner
          # it links against the runner's current mingw-w64, so CLOUD-1574's
          # `GetHostNameW` import from `cross`'s stale image cannot recur.
          - target: x86_64-pc-windows-gnu
            runner: windows-latest
            build-tool: cargo
          - target: aarch64-apple-darwin
            runner: macos-latest
            build-tool: cargo
          - target: x86_64-apple-darwin
            runner: macos-latest
            build-tool: cargo
    steps:
      # CLOUD-420: THE LANDING LEASE, ENFORCED WHERE THE MONEY IS SPENT.
      # First step, before any checkout or toolchain install, because a run this
      # branch is not authorised to make should cost the rounding rather than a
      # matrix. The body runs `batten lease guard`, installed from `main` and
      # pinned to trunk's version rather than to this head's, so a clone
      # carrying stale rules cannot dodge the predicate by carrying a stale copy
      # of it. Every justification lives on `run_lease_guard`. THREE DIFFERENT
      # FAILURES FAIL OPEN below, one `|| exit 0` each: a binary that will not
      # download, a policy that will not fetch, and a guard that will not run.
      # That is the whole posture — waving one matrix through costs one matrix,
      # while a precondition that cannot reach its own inputs would stop the
      # fleet. What keeps those three from reading as *ran and allowed* is
      # trunk's installer refusing a binary that does not carry the verb
      # (`BATTEN_REQUIRE`); until that installer IS trunk's, this step is
      # vacuous by construction rather than by accident.
      #
      # AND IT WAS VACUOUS FOR A SECOND REASON THE PARAGRAPH ABOVE HID (review of
      # #848). `$RUNNER_TEMP/batten-bin` is not on PATH, and `install.sh`'s
      # off-PATH refusal is a `die 1` that fires BEFORE the `BATTEN_REQUIRE`
      # check — so the `|| exit 0` ended the step at the install and the guard
      # never ran, at any of the sites, whatever the installer's provenance. The
      # bootstrap above is real and was not the reason; it just described the
      # same silence convincingly enough that nobody looked further.
      #
      # `BATTEN_ALLOW_OFF_PATH=1` is the opt-out for exactly this shape and the
      # binary is invoked by absolute path two lines down, so nothing here
      # resolves `batten` by name and the refusal is protecting a caller that
      # does not exist. Installing onto PATH instead would put a trunk-pinned
      # binary ahead of the checkout's own for every later step in the job.
      - name: Landing lease precondition
        # A pull request's run only: a release is no branch's to lease.
        if: ${{ inputs.tag == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEASE_HEAD_REF: ${{ github.head_ref }}
          # The HEAD sha, never `github.sha`: on a pull_request event that is the
          # merge commit, whose tree is trunk's wherever this head did not touch
          # it — and the staleness read asks about the head's own landing paths.
          LEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEASE_RUN_ID: ${{ github.run_id }}
        run: |
          # `|| exit 0` ON EVERY LINE, and the reason outlives the shell it was
          # written for (CLOUD-420). A step that reds makes the RUN's conclusion
          # `failure` rather than `cancelled`; `final` then runs under
          # `!cancelled()`, fails its `needs:` assertion, and `land` re-drafts a
          # healthy PR — fleet-wide, from one bad response. `batten lease guard`
          # promises it never exits non-zero; these are what make that true at the
          # call site too, for the cases the promise cannot cover: a binary that
          # will not download and one that will not run are different failures
          # from one that ran and decided.
          #
          # THE VERSION IS TRUNK'S, NEVER THIS HEAD'S. The installer comes from
          # trunk and resolves the version from trunk's own manifest, which is the
          # property the fetched-script design protected by reading its logic from
          # trunk — a head cannot pin an older guard for itself.
          installer=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/install.sh?ref=main") || exit 0
          printf '%s\n' "$installer" | \
            BATTEN_VERSION_FROM_REF=main BATTEN_INSTALL_DIR="$RUNNER_TEMP/batten-bin" \
            BATTEN_ALLOW_OFF_PATH=1 BATTEN_REQUIRE="lease guard" sh || exit 0
          # THE POLICY IS TRUNK'S TOO, AND IT HAD TO BE FETCHED. This step runs
          # BEFORE any checkout, so the directory the guard stands in is empty and
          # `config::load` found nothing — `[lease] landing_paths` read as *no
          # paths declared* and the staleness half failed open on every run, which
          # is the exact silence the row was written to end. Fetched from `main`
          # for the installer's own reason, one line up: a head must not pin the
          # policy it is judged by, and the only tree a checkout would offer here
          # is the pull request's own.
          mkdir -p "$RUNNER_TEMP/batten-config" || exit 0
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/batten.toml?ref=main" \
            >"$RUNNER_TEMP/batten-config/batten.toml" || exit 0
          "$RUNNER_TEMP/batten-bin/batten" --config-in "$RUNNER_TEMP/batten-config" \
            lease guard \
            "$LEASE_HEAD_SHA" "$LEASE_HEAD_REF" "$LEASE_RUN_ID" || exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build the release head, never whatever main has drifted to since
          # and never a tag, which a draft may not carry (CLOUD-2033).
          ref: ${{ inputs.sha }}
          persist-credentials: false
      # THE GNU HOST ON WINDOWS, set before mise installs the pinned toolchain.
      # regorus's `std` feature pulls `msvc_spectre_libs`, whose build script
      # gates on the HOST's `target_env` and so looks for `cl.exe` for a gnu
      # target on an msvc host, and panics. On a gnu host it is a no-op.
      - name: Use the gnu host toolchain on Windows
        if: runner.os == 'Windows'
        run: rustup set default-host x86_64-pc-windows-gnu
      # cache: false — a release build must not restore a shared cache. zizmor
      # flags cache-poisoning as high severity precisely on artifact-publishing
      # workflows: a poisoned cache entry would end up inside a signed binary,
      # and the attestation would faithfully attest to the compromised build.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # Pinned to `batten.toml`'s `[[provision]]` version (CLOUD-1672). The
          # digest above pins the ACTION; this pins the MISE it installs, which
          # is a separate resolution. Unset, every job here died at this step in
          # 11s on v0.0.152 and the release published with zero binaries.
          version: 2026.9.1
          cache: false
          # NARROWED, BECAUSE "INSTALL EVERYTHING" COST A PLATFORM BINARY
          # (CLOUD-1786). Unset, this step installs every `[tools]` entry on
          # every leg — and on v0.0.160 the aarch64-unknown-linux-gnu leg died
          # resolving `zizmor`, a GitHub Actions linter with no part in building
          # a binary, against Sigstore's TUF CDN before compilation started. The
          # release shipped without that platform. `renovate` and its 611 npm
          # packages are on the same path.
          #
          # THE UNION OF WHAT A LEG USES, not a per-leg list, because the matrix
          # mixes build tools and `install_args` is one string:
          #
          #   rust              the compiler, and the rustup that adds the target
          #   cargo-dist        builds, archives and checksums the leg
          #   cargo-auditable   every leg builds through it (dist's `cargo-auditable`)
          #   zig, cargo-zigbuild   dist's linker chain for the non-host Linux legs
          #   syft              `sbom-binary` on every leg
          #   gh                the `gh release upload` steps
          #   nfpm              the Linux legs' .deb, .rpm and .apk (CLOUD-2298)
          #
          # This does NOT unpin anything. Naming tools selects which pinned
          # versions are installed.
          install_args: rust aqua:axodotdev/cargo-dist zig github:rust-cross/cargo-zigbuild github:rust-secure-code/cargo-auditable aqua:anchore/syft aqua:cli/cli aqua:goreleaser/nfpm
      - name: Add the Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: mise run batten -- ci step --arg-env TARGET -- rustup target add
      - name: Build and archive
        id: dist
        shell: bash
        # `batten dist --build-tool cargo-dist` runs `dist build` for the leg,
        # writes its manifest fragment, and archives the binary dist built under
        # the versioned name too. It emits archive=/binary=/dist_archive=/
        # checksum=/manifest= KEY=VALUE lines, so no name is re-derived here.
        env:
          DIST_BUILD_TOOL: cargo-dist
          DIST_TARGET: ${{ matrix.target }}
        run: mise run batten -- ci step --outputs --arg-env DIST_TARGET -- mise run dist --
      # UPLOAD FIRST, ATTEST SECOND (CLOUD-258). The reverse order shipped, and
      # every release from v0.0.31 to v0.0.36 attached zero binaries: all seven
      # legs built, then died on the attestation with
      #
      #   Failed to persist attestation: Feature not available for the
      #   button-inc organization.
      #
      # — a plan-gated feature the organization did not have then. Because the step
      # failed, the upload after it never ran, so an OPTIONAL provenance claim
      # took the artifact itself down with it. Six consecutive total failures
      # went unnoticed because a `release`-triggered run reaches no PR and no
      # gate: `ci-local-parity` holds its properties over `pull_request`
      # workflows, and `land` watches a PR's checks. `release-assets-check`,
      # scheduled, is the signal that was missing.
      - name: Refuse to upload into anything but a draft of this sha
        if: inputs.tag != ''
        env:
          BATTEN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: mise run batten -- ci step --arg-env SHA --arg-env TAG -- mise run batten -- release guard --sha
      - name: Upload to the release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ARCHIVE: ${{ steps.dist.outputs.archive }}
          DIST_ARCHIVE: ${{ steps.dist.outputs.dist_archive }}
          CHECKSUM: ${{ steps.dist.outputs.checksum }}
        run: mise run batten -- ci step --arg-env TAG --arg-env ARCHIVE --arg-env DIST_ARCHIVE --arg-env CHECKSUM -- gh release upload --clobber
      # THE PACKAGE CHANNELS (CLOUD-2298). nfpm wraps the binary dist built for
      # this leg, so every package carries the release's own bytes; dist wrote
      # the Windows leg's MSI itself. Each path travels through `env:`, so no
      # matrix value is expanded into a command line.
      - name: Package the .deb
        if: endsWith(matrix.target, 'linux-gnu')
        env:
          NFPM_ARCH: ${{ matrix.nfpm-arch }}
          BATTEN_VERSION: ${{ steps.dist.outputs.version }}
          BATTEN_BINARY: ${{ steps.dist.outputs.binary }}
          PACKAGE: target/distrib/batten-${{ matrix.target }}.deb
        run: mise run batten -- ci step --arg-env PACKAGE -- mise exec -- nfpm package --config nfpm.yaml --packager deb --target
      - name: Package the .rpm
        if: endsWith(matrix.target, 'linux-gnu')
        env:
          NFPM_ARCH: ${{ matrix.nfpm-arch }}
          BATTEN_VERSION: ${{ steps.dist.outputs.version }}
          BATTEN_BINARY: ${{ steps.dist.outputs.binary }}
          PACKAGE: target/distrib/batten-${{ matrix.target }}.rpm
        run: mise run batten -- ci step --arg-env PACKAGE -- mise exec -- nfpm package --config nfpm.yaml --packager rpm --target
      - name: Package the .apk
        if: endsWith(matrix.target, 'linux-musl')
        env:
          NFPM_ARCH: ${{ matrix.nfpm-arch }}
          BATTEN_VERSION: ${{ steps.dist.outputs.version }}
          BATTEN_BINARY: ${{ steps.dist.outputs.binary }}
          PACKAGE: target/distrib/batten-${{ matrix.target }}.apk
        run: mise run batten -- ci step --arg-env PACKAGE -- mise exec -- nfpm package --config nfpm.yaml --packager apk --target
      - name: Upload the .deb and .rpm to the release
        if: inputs.tag != '' && endsWith(matrix.target, 'linux-gnu')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          DEB: target/distrib/batten-${{ matrix.target }}.deb
          RPM: target/distrib/batten-${{ matrix.target }}.rpm
        run: mise run batten -- ci step --arg-env TAG --arg-env DEB --arg-env RPM -- gh release upload --clobber
      - name: Upload the .apk to the release
        if: inputs.tag != '' && endsWith(matrix.target, 'linux-musl')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          APK: target/distrib/batten-${{ matrix.target }}.apk
        run: mise run batten -- ci step --arg-env TAG --arg-env APK -- gh release upload --clobber
      # Chocolatey's package wraps that MSI (`packaging/chocolatey/`), packed at
      # the crate version `batten dist` reported.
      - name: Pack the Chocolatey package around the MSI
        if: steps.dist.outputs.msi != ''
        env:
          VERSION: ${{ steps.dist.outputs.version }}
        run: mise run batten -- ci step --arg-env VERSION -- choco pack packaging/chocolatey/batten.nuspec --outdir target/distrib --version
      - name: Upload the MSI and the Chocolatey package to the release
        if: inputs.tag != '' && steps.dist.outputs.msi != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          MSI: ${{ steps.dist.outputs.msi }}
          NUPKG: target/distrib/batten.${{ steps.dist.outputs.version }}.nupkg
        run: mise run batten -- ci step --arg-env TAG --arg-env MSI --arg-env NUPKG -- gh release upload --clobber
      # The fragment travels to the `installers` job, which generates the
      # installers from every leg's checksum. A build artifact, not a release
      # asset: the installers are what ship.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-manifest-${{ matrix.target }}
          path: ${{ steps.dist.outputs.manifest }}
          if-no-files-found: error
          # A pull request's copy has no reader; it is kept only to prove the
          # leg wrote one.
          retention-days: ${{ inputs.tag != '' && 90 || 1 }}
      # The binary-level inventory (CLOUD-263), AFTER the upload for CLOUD-258's
      # reason: the archive is already published, so nothing this step does can
      # suppress a binary. It is a step rather than a job — a job costs a billed
      # minute and this costs none — and it runs inside the leg that built the
      # binary because that is the only place the bytes exist.
      #
      # SKIPPED ON `cross`, where `cargo auditable` composition is unmeasured
      # (CLOUD-263). No leg builds through `cross` since cargo-dist builds every
      # leg with `cargo-auditable = true`, so every leg now inventories; the
      # condition stays so a `cross` leg re-added later is not demanded an SBOM
      # it cannot produce.
      - name: Inventory the built binary
        if: matrix.build-tool != 'cross'
        id: sbom
        shell: bash
        env:
          BINARY: ${{ steps.dist.outputs.binary }}
          TARGET: ${{ matrix.target }}
        run: mise run batten -- ci step --outputs --arg-env BINARY --arg-env TARGET -- mise run sbom-binary --
      # The decision, as its own step so its finding reaches THIS log rather than
      # the `$GITHUB_OUTPUT` the step above appends to.
      - name: Refuse an inventory that catalogs nothing
        if: matrix.build-tool != 'cross'
        shell: bash
        run: mise run sbom-binary-check
      - name: Refuse to upload the SBOM into anything but a draft of this sha
        if: inputs.tag != '' && matrix.build-tool != 'cross'
        env:
          BATTEN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: mise run batten -- ci step --arg-env SHA --arg-env TAG -- mise run batten -- release guard --sha
      - name: Upload the binary SBOM to the release
        if: inputs.tag != '' && matrix.build-tool != 'cross'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SBOM: ${{ steps.sbom.outputs.sbom }}
        run: mise run batten -- ci step --arg-env TAG --arg-env SBOM -- gh release upload --clobber
      # Attest the BINARY rather than the archive: the provenance should bind to
      # the executable a user runs, so repackaging cannot launder it (§12 — a
      # trust engine must exceed the ordinary distribution bar, not match it).
      # Uploading does not consume the binary, so attesting after it binds to the
      # same bytes it did before.
      #
      # continue-on-error until the repo is public, at which point this step
      # starts succeeding on its own with no change here — the plan gate is the
      # only thing failing it. The claim is deferred, not dropped: an unattested
      # release is worse than an attested one and far better than none.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: inputs.tag != ''
        continue-on-error: true
        with:
          subject-path: ${{ steps.dist.outputs.binary }}
