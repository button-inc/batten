name: perf

# The measurement half of CLOUD-207, on a clock rather than on the landing path.
#
# WHY NOT `pull_request`. Two independent reasons, and either alone decides it:
#
#   * A p95 is only worth what the machine under it is worth. A shared runner
#     contending with other jobs produces a distribution wide enough that a
#     per-PR gate would fail on noise and be switched off within a week — which
#     is exactly what CLOUD-207's own flakiness posture warns about, and why the
#     budget this asserts is an absolute ceiling rather than a band.
#   * A release build plus 330 timed invocations is minutes of runner time per
#     push, spent to re-derive a number that a commit almost never moves. CI
#     minutes are metered; `ci-local-parity` exists to keep the landing path to
#     things a local `mise run verify` already proved.
#
# WHAT DEFENDS THE NUMBER PER-COMMIT, then, is `tests/perf-assert.bats`: the
# gate is a pure function of records on stdin, so its decision runs in the hk
# gate on every commit in milliseconds, with no build and no hyperfine. This
# workflow supplies the one thing that suite cannot — a real measurement of the
# real binary — and applies the same gate to it. The split is the repo's
# standing agents-fetch/gates-decide pattern, and the `coverage.yml` /
# `lock-currency.yml` precedent for "a property of the world runs on a clock".
#
# Not a push-to-main trigger either, for the reason stated in every other
# scheduled workflow here: `main` only ever advances by fast-forward to a commit
# a PR already tested, so a push trigger would re-run work that is by
# construction already done. The schedule is what samples `main`.
#
# UNLIKE `coverage.yml`, THIS ONE HAS A THRESHOLD AND MAY FAIL. Coverage is a
# report because a percentage rewards line-touching over assertion; latency is
# not that shape. There is one honest number, a published claim resting on it,
# and a budget with a citation — so a run that leaves the budget is a defect,
# not a datum for a human to weigh.

on:
  schedule:
    # Daily, 05:00 UTC — ahead of the Monday 06:00-07:30 cluster of weekly jobs,
    # so nothing contends with a measurement. Daily rather than weekly because
    # the series only reads as a trend at a resolution finer than the interval
    # over which a regression would land (CLOUD-172).
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: perf
  cancel-in-progress: false

permissions: {}

env:
  # Restores locked installs, which `[settings] lockfile = false` turns off
  # along with the install-time write it exists to deny (CLOUD-223). Every
  # workflow using mise-action must set this; `mise run lock-complete` fails if
  # one does not.
  MISE_LOCKFILE: "true"

jobs:
  perf:
    name: perf
    runs-on: ubuntu-latest
    # `grandfathered` rather than a derived budget, and deliberately so: this job
    # has no run history, so there is no p95 to multiply and any number written
    # here would be the asserted-instead-of-measured claim this very ticket
    # exists to delete. Locally a full `mise run perf` — cold release build,
    # three paths, 110 invocations each — measured 48.7s on four cores; the
    # runner adds checkout and install on top, and pays the full dependency
    # build whenever the cache misses. `mise run timeout-drift` is the mechanism
    # that replaces this with a measured budget once runs exist to measure.
    timeout-minutes: 20 # budget: grandfathered measured=2026-08-11
    permissions:
      # `write`, and only here (CLOUD-172): the recording step pushes the series
      # to `refs/notes/perf`. Every other scheduled workflow reads; this one
      # writes exactly one ref that no branch protection covers and no build
      # consumes — a note is not a commit, so nothing this pushes can change
      # what `main` builds.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Credentials ARE persisted here, unlike every other scheduled job,
          # because the recording step pushes. Scoped by the `contents: write`
          # above and by the single explicit refspec that push names.
          fetch-depth: 0
      # `git notes append` needs the existing note to append TO; without this
      # every run would start a fresh note and the series would be a list of
      # singletons. `|| true` because on the first run the ref does not exist,
      # and a missing ref is the empty series rather than a failure.
      - name: Fetch the existing series
        run: git fetch origin "refs/notes/perf:refs/notes/perf" || true
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # rust builds the binary under measurement, hyperfine samples it, jq
          # reads the sampler's JSON back out. Nothing else is invoked.
          # `mise run ci-tools-check` fails if a name here drifts from mise.toml.
          install_args: rust aqua:sharkdp/hyperfine aqua:jqlang/jq
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A release profile, which no other job builds, so a shared cache entry
          # would thrash.
          # The profile is part of the key too — see `ci.yml`'s `ci` job.
          shared-key: perf-${{ hashFiles('Cargo.toml') }}
      # Redirected into a file and read back, never piped into the gate. A
      # pipeline hands its exit status to the LAST stage, so `perf |
      # perf-assert` would discard exactly the measurement failure that must
      # stop this job — the false-green shape `mise run run-shape-guard` refuses
      # locally, and no less wrong in a workflow.
      - name: Measure
        run: mise run perf >"$RUNNER_TEMP/perf.txt"
      - name: Assert the budget
        run: mise run perf-assert <"$RUNNER_TEMP/perf.txt"
      # THE SEED FOR EVERY PULL REQUEST'S BASE ARM, WRITTEN HERE BECAUSE ONLY
      # `main` CAN WRITE IT (CLOUD-1342). A cache entry written from a pull
      # request is scoped to `refs/pull/N/merge` and no other pull request can
      # read it; an entry written from the default branch is readable by every
      # branch. `ci.yml`'s `perf` job therefore RESTORES this entry and never
      # saves, which is what removes ~190 MB per run of bytes nothing could
      # restore — CLOUD-840 measured 203.7 GB of them across 1,144 entries.
      #
      # NO NEW TRIGGER AND NO SECOND BUILD. This job already built `--release`
      # for the measurement above, so the seed is that closure copied aside. It
      # is staged AFTER the assertion for the same reason the series is: a
      # measurement that broke its budget is a defect to fix, and a seed carried
      # forward from it would spread the defect to every pull request.
      - name: Stage the base-arm seed
        run: |
          rm -rf target/perf/base-seed
          mkdir -p target/perf/base-seed
          cp -a target/release target/perf/base-seed/release
      # A save collision on an existing key is the ORDINARY case — the key moves
      # only when `mise.lock` or `Cargo.lock` does — and "if the provided `key`
      # matches an existing cache, a new cache is not created". That is a
      # no-op, not a failure, and it must not redden a scheduled run whose
      # measurement already passed.
      - name: Save the base-arm seed
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/perf/base-seed
          key: perf-base-${{ runner.os }}-${{ hashFiles('mise.lock', 'Cargo.lock') }}
      # The series (CLOUD-172). AFTER the assertion, deliberately: a measurement
      # that broke its budget is a defect to fix, not a datum to enshrine, and a
      # series carrying known-bad readings is one nobody can read a trend from.
      #
      # `perf-record` refuses to run off the trunk by itself, so the schedule's
      # main-only guarantee is belt and braces rather than the only guard.
      - name: Record the series
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mise run perf-record <"$RUNNER_TEMP/perf.txt"
        env:
          BENCH_RUNNER: ubuntu-latest
      # Its own step, so a push that fails is distinguishable from a measurement
      # that failed. The refspec is explicit and singular: this job may write the
      # series and nothing else.
      - name: Push the series
        run: git push origin "refs/notes/perf:refs/notes/perf"
      # Always, including on a budget violation: the records are the evidence
      # for the failure, and a run that fails without publishing what it measured
      # sends the reader to re-run it by hand.
      - name: Publish the records
        if: always()
        run: |
          {
            echo '## Invocation cost'
            echo
            # Double-quoted with escaped backticks, not single-quoted: a
            # backtick pair inside single quotes reads as legacy command
            # substitution to shellcheck (SC2016), which actionlint runs over
            # every `run:` block.
            echo "Budgets are enforced by \`mise run perf-assert\` — see README, Performance."
            echo
            echo '```'
            cat "$RUNNER_TEMP/perf.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
