name: Rust

# The four jobs whose verdict is a pure function of the Rust tree, split out of
# `ci.yml` so a diff that cannot change their answer does not pay for them
# (CLOUD-398 slice 2).
#
# THE COST THIS REMOVES. Measured on run 32395938706, per non-draft PR event:
# `windows` 22.10 billed minutes (50.6% of the run, since `windows-latest` bills
# at 2x), `darwin-link` 2.25, `semver` 1.87, `cross` 1.60 — 27.8 of 43.70, or
# 64%. Nineteen of the last fifty commits on `main` touched a path below, so
# roughly three pushes in five were buying all four verdicts over a diff that
# could not move any of them.
#
# WHY A SEPARATE FILE RATHER THAN A JOB-LEVEL `if:`, and this is the whole
# reason the split costs a file. A job skipped by a condition still mints a
# check run, with conclusion `skipped`. `CI_ANSWERED_CONCLUSIONS` (mise.toml)
# does not contain `skipped` on purpose — a skip is not an answer — so a
# required check that skips leaves `checks-green` at exit 3 and `land` polling
# forever. A `paths:` filter is workflow-level only, and a workflow that does
# not trigger creates no check run at all: ABSENT, which `CI_ABSENT_OK_CHECKS`
# is built to accept. `zizmor.yml` set this precedent and these four join it in
# that list.
#
# WHAT THE FILTER MUST COVER is every input these jobs read, not only the code
# they compile: they run `mise run` tasks, so `mise.toml` and `mise.lock` are
# inputs, and `deny.toml` is `cargo-deny`'s policy. A path missing from this
# list is a verdict silently not taken, so `mise run rust-paths-check` holds the
# list to the jobs' actual inputs and `tests/rust-paths-check.bats` shows it
# able to fail — the shape CLOUD-224 set for a glob that decides what runs.
#
# WHAT MOVED OUT OF `final`'S FAN-IN, stated because it is a real consequence
# rather than a detail. `final` aggregates its `needs:` so branch protection can
# point at one name, and these four are no longer in it. They are still required
# — `CI_REQUIRED_CHECKS` names all four and `checks-green`, which is what `land`
# actually decides on, reads that list rather than `final`. This is the same
# shape `commit-lint` and `zizmor` already have: required checks that `final`
# does not fan in over, because they live in their own workflows.

on:
  pull_request:
    # `ready_for_review` is load-bearing here for CLOUD-503's reason, the same
    # one `zizmor.yml` records: the jobs below are draft-gated, so a PR opened as
    # a draft mints a `skipped` run on `opened` and needs an event left that can
    # replace it. `land` readies before pushing and its push moves nothing when
    # HEAD is already on the remote, so this is that event.
    types: [opened, synchronize, reopened, ready_for_review]
    # Kept in agreement with the jobs' real inputs by `mise run rust-paths-check`.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - "deny.toml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  MISE_LOCKFILE: "true"

jobs:

  cross:
    name: cross
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-10
    # `actions: write` is here for one call and one only: cancelling THIS run
    # when the landing lease does not authorise this branch (CLOUD-420). A job
    # that could not cancel itself would have to fail instead, and a failed job
    # makes the run conclude `failure` rather than `cancelled` — which reds
    # `final` and makes `land` re-draft a healthy PR.
    permissions:
      contents: read
      actions: write
    steps:
      # CLOUD-420: THE LANDING LEASE, ENFORCED WHERE THE MONEY IS SPENT.
      # First step, before any checkout or toolchain install, because a run this
      # branch is not authorised to make should cost the rounding rather than a
      # matrix. The body is `mise-tasks/ci-lease-precondition` and every
      # justification lives there; it is fetched from `main` rather than from
      # this head, so a clone carrying stale rules cannot dodge the predicate by
      # carrying a stale copy of it. An unreadable body runs — fail open, which
      # is the whole posture: waving one matrix through costs one matrix, while
      # a predicate that cannot read itself would stop the fleet.
      - name: Landing lease precondition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEASE_HEAD_REF: ${{ github.head_ref }}
          # The HEAD sha, never `github.sha`: on a pull_request event that is the
          # merge commit, which carries trunk's `mise-tasks/land` whenever this
          # head did not touch it — and the staleness row reads exactly that file.
          LEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEASE_RUN_ID: ${{ github.run_id }}
        run: |
          body=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/mise-tasks/ci-lease-precondition?ref=main") || exit 0
          # `|| exit 0` on BOTH lines, and the second is the one that was missing
          # (CLOUD-420). A fetch that fails is handled; a fetch that SUCCEEDS with
          # something that is not shell was not — a truncated body, a proxy error
          # page returned 200, or a bad edit to the trunk copy makes this a syntax
          # error in the FIRST step of every job. The step reds under the runner's
          # default `bash -e {0}`, `final` fails its `needs:` assertion under
          # `always()`, and `land` re-drafts a healthy PR — fleet-wide, from one bad
          # response. The precondition's own header promises it never exits
          # non-zero; this is what makes that true at the call site too.
          bash -c "$body" || exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # tests/bats — the shell test runner. Without it `mise run test:bats`
          # has no bats to run.
          submodules: true
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          # cross-check is `rustup target add` + `cargo check`; rust is the only
          # tool it touches. See the ci job for why these lists are narrow.
          install_args: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run cross-check
        env:
          # Only the triple cross-check type-checks. doctor's default pair would
          # additionally pull the Darwin std, which darwin-link's own job owns.
          DOCTOR_TARGETS: x86_64-pc-windows-gnu

  # The macOS gate. `cargo check` never links, so it cannot see a dependency that
  # needs an Apple SDK; this LINKS a Darwin target, which is the only check with
  # no false negatives. It runs concurrently with ci/cross, and the Darwin
  # triples were removed from cross-check so nothing is done twice.
  #
  # ONE target, not both. What this gate asserts — that nothing in the dependency
  # graph pulls in an Apple SDK or system framework — is a property of the
  # dependency graph, not of the word size, so linking aarch64 proves it. The
  # x86_64 leg was a near-duplicate job sitting on the critical path, which is
  # the same duplicate work the cross-check note above refuses. Coverage is not
  # dropped, only moved later: release-artifacts.yml builds BOTH Darwin targets
  # through zigbuild, so an x86_64-only linker problem still cannot reach a
  # shipped artifact. The matrix stays rather than collapsing to a plain job, so
  # restoring the second leg is a one-word change if the trade stops holding.
  darwin-link:
    name: darwin-link (${{ matrix.target }})
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-10
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin]
    # `actions: write` is here for one call and one only: cancelling THIS run
    # when the landing lease does not authorise this branch (CLOUD-420). A job
    # that could not cancel itself would have to fail instead, and a failed job
    # makes the run conclude `failure` rather than `cancelled` — which reds
    # `final` and makes `land` re-draft a healthy PR.
    permissions:
      contents: read
      actions: write
    steps:
      # CLOUD-420: THE LANDING LEASE, ENFORCED WHERE THE MONEY IS SPENT.
      # First step, before any checkout or toolchain install, because a run this
      # branch is not authorised to make should cost the rounding rather than a
      # matrix. The body is `mise-tasks/ci-lease-precondition` and every
      # justification lives there; it is fetched from `main` rather than from
      # this head, so a clone carrying stale rules cannot dodge the predicate by
      # carrying a stale copy of it. An unreadable body runs — fail open, which
      # is the whole posture: waving one matrix through costs one matrix, while
      # a predicate that cannot read itself would stop the fleet.
      - name: Landing lease precondition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEASE_HEAD_REF: ${{ github.head_ref }}
          # The HEAD sha, never `github.sha`: on a pull_request event that is the
          # merge commit, which carries trunk's `mise-tasks/land` whenever this
          # head did not touch it — and the staleness row reads exactly that file.
          LEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEASE_RUN_ID: ${{ github.run_id }}
        run: |
          body=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/mise-tasks/ci-lease-precondition?ref=main") || exit 0
          # `|| exit 0` on BOTH lines, and the second is the one that was missing
          # (CLOUD-420). A fetch that fails is handled; a fetch that SUCCEEDS with
          # something that is not shell was not — a truncated body, a proxy error
          # page returned 200, or a bad edit to the trunk copy makes this a syntax
          # error in the FIRST step of every job. The step reds under the runner's
          # default `bash -e {0}`, `final` fails its `needs:` assertion under
          # `always()`, and `land` re-drafts a healthy PR — fleet-wide, from one bad
          # response. The precondition's own header promises it never exits
          # non-zero; this is what makes that true at the call site too.
          bash -c "$body" || exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          # zig supplies the Darwin linker and cargo-zigbuild drives cargo
          # through it; rust is the compiler. Nothing else is invoked here —
          # and this is the ONLY job that needs zig, the 17.3s pole the other
          # jobs used to pay for nothing. See the ci job.
          install_args: rust zig github:rust-cross/cargo-zigbuild
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A per-target key: a leg's artifacts are target-specific and would
          # otherwise thrash a shared entry if the second leg is restored.
          key: ${{ matrix.target }}
      - run: mise run darwin-link ${{ matrix.target }}
        env:
          # Exactly the target being linked; doctor's default would also fetch
          # the Windows std that cross-check's own job owns.
          DOCTOR_TARGETS: ${{ matrix.target }}

  semver:
    name: semver
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-12
    # `actions: write` is here for one call and one only: cancelling THIS run
    # when the landing lease does not authorise this branch (CLOUD-420). A job
    # that could not cancel itself would have to fail instead, and a failed job
    # makes the run conclude `failure` rather than `cancelled` — which reds
    # `final` and makes `land` re-draft a healthy PR.
    permissions:
      contents: read
      actions: write
    steps:
      # CLOUD-420: THE LANDING LEASE, ENFORCED WHERE THE MONEY IS SPENT.
      # First step, before any checkout or toolchain install, because a run this
      # branch is not authorised to make should cost the rounding rather than a
      # matrix. The body is `mise-tasks/ci-lease-precondition` and every
      # justification lives there; it is fetched from `main` rather than from
      # this head, so a clone carrying stale rules cannot dodge the predicate by
      # carrying a stale copy of it. An unreadable body runs — fail open, which
      # is the whole posture: waving one matrix through costs one matrix, while
      # a predicate that cannot read itself would stop the fleet.
      #
      # This job in particular is the one the sensor caught: `semver` landed on
      # `main` while this change was in flight, and property 7 refused the merge
      # until it carried the step too. That is the sensor working, and the reason
      # it is a gate rather than a paragraph.
      - name: Landing lease precondition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEASE_HEAD_REF: ${{ github.head_ref }}
          # The HEAD sha, never `github.sha`: on a pull_request event that is the
          # merge commit, which carries trunk's `mise-tasks/land` whenever this
          # head did not touch it — and the staleness row reads exactly that file.
          LEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEASE_RUN_ID: ${{ github.run_id }}
        run: |
          body=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/mise-tasks/ci-lease-precondition?ref=main") || exit 0
          # `|| exit 0` on BOTH lines, and the second is the one that was missing
          # (CLOUD-420). A fetch that fails is handled; a fetch that SUCCEEDS with
          # something that is not shell was not — a truncated body, a proxy error
          # page returned 200, or a bad edit to the trunk copy makes this a syntax
          # error in the FIRST step of every job. The step reds under the runner's
          # default `bash -e {0}`, `final` fails its `needs:` assertion under
          # `always()`, and `land` re-drafts a healthy PR — fleet-wide, from one bad
          # response. The precondition's own header promises it never exits
          # non-zero; this is what makes that true at the call site too.
          bash -c "$body" || exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The comparison needs the baseline commit, not just this head: the
          # task passes `--baseline-rev origin/main`, and a shallow clone has no
          # such ref to build the baseline rustdoc from.
          fetch-depth: 0
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          # cargo-semver-checks does the comparison; rust supplies the cargo and
          # the rustup that fetches the newer toolchain the tool requires — see
          # the note beside `[tools]` in mise.toml for why that is the tool's
          # constraint and not the crate's. See the ci job for why these lists
          # are narrow.
          install_args: rust github:obi1kenobi/cargo-semver-checks
      # A distinct key: this job builds rustdoc with a different rustc than every
      # other job's, so sharing an entry would thrash it — the same reason
      # carries its own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: semver
      - run: mise run semver

  # THE OS MATRIX, and the only job here that EXECUTES rather than type-checks
  # on a foreign platform (CLOUD-113). `cross` runs `cargo check` against
  # `x86_64-pc-windows-gnu` and has never run a single test there; CLOUD-23 put
  # Windows in v0 scope with a genuinely divergent state-path rule
  # (`%APPDATA%`/`%LOCALAPPDATA%` against XDG on Linux and macOS), so the
  # behaviour this asserts is real and shipped rather than hypothetical.
  #
  # NO macOS LEG, on CLOUD-113's own condition ("plus macOS if state-path
  # behavior diverges"). CLOUD-23's rule is XDG-style on Linux *and* macOS, so
  # macOS diverges from Linux in nothing this suite asserts, and `darwin-link`
  # already covers the one Darwin-specific risk.
  #
  # `test:cargo`, NOT `test`. The bats suites need bash, shellcheck and the
  # tests/bats submodule; shell-task behaviour is not what this leg is for.
  #
  # A PLAIN JOB, not a one-entry `strategy.matrix`. `darwin-link` carries one so
  # a dropped second leg is a one-word restore; there is no dropped leg here,
  # and a matrix would put a suffix in the check-run name that
  # `CI_REQUIRED_CHECKS` would then have to carry.
  #
  # This job is exempt from `ci-local-parity` property 3 — "every task CI runs
  # is one `verify` runs" — because its `runs-on` is a known-foreign label
  # (CLOUD-394). That is not a loophole: the property buys "CI confirms what you
  # already proved locally", and there is no local Windows to have proved it on.
  # Which is also why the first run of this job is a MEASUREMENT rather than a
  # confirmation, and why a failure here is the job working.
  windows:
    name: windows
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: windows-latest
    # MEASURED, and re-derived one run later — which is the part worth reading.
    #
    # This shipped `grandfathered` because no run had ever finished the suite:
    # cargo stops at the first failing target, so the 279s and 377s the early
    # runs reported are durations of a TRUNCATED suite, and a budget derived from
    # one would have pinned the ceiling to how far the job got before it broke.
    #
    # The first two runs to complete it, twenty minutes apart:
    #
    #   32096486179   03:43:25 -> 03:51:21   476s
    #   32097723968   04:03:38 -> 04:12:03   505s
    #
    # The first landed here as `p95=476s x3` — 24 minutes — and the very next
    # run exceeded the sample it was derived from by 6%. At 505s the repo's own
    # x3 headroom rule demands 26, so a budget taken from n=1 was already below
    # policy before anything changed about the job. That is the failure mode a
    # timeout budget exists to prevent, inverted: a ceiling that fails a job for
    # being SLOW rather than for being broken.
    #
    # So the number is the max of the completed runs, not the first of them. Two
    # samples is still not a distribution and the estimate is still conservative
    # by construction; re-derive from a real quantile once the series is long
    # enough to have one.
    timeout-minutes: 26 # budget: p95=505s x3 measured=2026-08-18
    # `actions: write` is here for one call and one only: cancelling THIS run
    # when the landing lease does not authorise this branch (CLOUD-420). A job
    # that could not cancel itself would have to fail instead, and a failed job
    # makes the run conclude `failure` rather than `cancelled` — which reds
    # `final` and makes `land` re-draft a healthy PR.
    permissions:
      contents: read
      actions: write
    env:
      # mise runs an inline task body through its own shell, which is NOT the
      # step's. Read from the pinned binary rather than assumed:
      # `windows_default_inline_shell_args` is "cmd /c", against
      # "sh -c -o errexit" on unix. `[tasks."test:cargo"]` declares no `shell`
      # and its body is bash — `if ./mise-tasks/step-receipt check …; then`
      # — so under cmd the task dies before cargo is ever reached.
      #
      # Set here rather than in mise.toml because this is the only job in the
      # repository that runs a mise task on Windows, so the narrower placement
      # covers the whole exposure. The one-authority alternative, if a second
      # Windows caller ever appears, is `shell = "bash -c"` on the task itself.
      MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: bash -c
      # And the FILE-task shell, which is a separate setting with the same
      # `cmd /c` default. `batten.toml`'s command rules spawn `mise run
      # ntia-check` and three siblings, every one of them a bash program under
      # `mise-tasks/`, so a job that set only the inline shell would still hand
      # those to cmd.
      MISE_WINDOWS_DEFAULT_FILE_SHELL_ARGS: bash -c
    steps:
      # CLOUD-420: THE LANDING LEASE, ENFORCED WHERE THE MONEY IS SPENT.
      # First step, before any checkout or toolchain install, because a run this
      # branch is not authorised to make should cost the rounding rather than a
      # matrix. Body fetched from `main`, never from this head, and `|| exit 0`
      # on both lines so a body that will not parse cannot red the first step of
      # every job. Every justification lives in `mise-tasks/ci-lease-precondition`.
      - name: Landing lease precondition
        # EXPLICIT, for the reason test.yml states at its own Windows legs: a
        # `run:` step with no `shell:` takes the runner's default, which is
        # PowerShell here — so this bash body would be handed to `pwsh`, which
        # reports `body=$(gh api …)` is not a cmdlet and exits 1 in the FIRST
        # step of the job. Every ubuntu-only caller of this block never had to
        # say so.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEASE_HEAD_REF: ${{ github.head_ref }}
          # The HEAD sha, never `github.sha`: on a pull_request event that is the
          # merge commit, which carries trunk's `mise-tasks/land` whenever this
          # head did not touch it — and the staleness row reads exactly that file.
          LEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEASE_RUN_ID: ${{ github.run_id }}
        run: |
          body=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/mise-tasks/ci-lease-precondition?ref=main") || exit 0
          bash -c "$body" || exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The `ci` job runs this same task with the submodule present, and the
          # whole point of this leg is that the OS is the only variable. A
          # missing tests/bats would be a second one — `crates/batten/tests`
          # carries a suite about that path — and it would read as a Windows
          # finding, which is the misattribution this job exists to avoid.
          submodules: true
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          # NOT rust alone, which is what this job shipped with and what the
          # sixth Windows run disproved. `cargo test` is the command, but the
          # suite SPAWNS: `tests/cli.rs` materializes fixtures carrying this
          # repository's own `batten.toml`, whose `no-conflict-markers` rule is
          # `hk util check-merge-conflict`. A fixture loading that config cannot
          # evaluate ANY rule without hk — so five cases reported an exit code
          # about a missing tool while naming the rule they meant to test, and
          # `jq` is read at runtime by the mise tasks three more command rules
          # invoke.
          #
          # `ci-tools-check` keeps these names honest against mise.toml but
          # cannot know which a job needs; that is what this comment and the
          # `windows` job's own red run are for. See the ci job for the rest.
          install_args: rust hk aqua:jqlang/jq
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A distinct key: this job's target dir is built by a different host
          # toolchain than every other job's, so sharing an entry would thrash
          # it — the same reason semver and perf carry their own.
          key: windows
      # A JOB THAT DECLARES A TOOL MUST BE ABLE TO REACH IT, asserted before the
      # suite rather than discovered inside it. `ci-tools-check` holds these
      # names against `mise.toml`, which is a different question: it cannot know
      # whether the runner actually resolves one.
      #
      # This exists because the alternative was measured and is expensive. The
      # committed `batten.toml` delegates to `hk`, so a fixture that loads it
      # reports `cannot run hk` as an exit code deep inside `tests/cli.rs` —
      # three cases, none of them about hk, each costing a CI round trip to
      # attribute. `hk.exe` is at the root of the pinned zip and mise puts its
      # install directory on PATH, so the interesting case is the one where both
      # are true and the spawn still fails; this names which half is missing.
      - name: Assert the declared tools resolve
        shell: bash
        run: |
          set -euo pipefail
          echo "PATH=$PATH"
          for tool in hk jq cargo; do
            if ! resolved=$(command -v "$tool"); then
              echo "::error::$tool is declared in install_args but does not resolve on PATH" >&2
              exit 1
            fi
            echo "$tool -> $resolved"
          done
          hk --version

      # `mise exec`, NOT `mise run test:cargo`, and the difference is the whole
      # of why the last four runs were red.
      #
      # `[tasks."test:cargo"]`'s body is bash, so running it here needs mise's
      # Windows task shell pointed at bash — which puts Git Bash in the chain
      # pwsh -> mise -> bash -> cargo -> the test -> batten. MSYS rewrites PATH
      # into POSIX form crossing that boundary and back again on the way out,
      # and mise's install directories did not survive the round trip: the
      # preflight above resolves `hk` and prints its version, `where.exe` finds
      # `…\installs\hk\1.54.0\hk.exe`, and batten three processes down still
      # reports `cannot run hk: not found on PATH`.
      #
      # `mise exec` activates the same pinned toolchain and runs cargo directly,
      # so there is no shell translating the environment on the way through. The
      # task's own body buys nothing here anyway: its receipt short-circuit is
      # disabled under CI by construction, leaving `cargo test --workspace`.
      #
      # Property 3 of `ci-local-parity` does not object — this job's runner is
      # known-foreign and exempt (CLOUD-394) — but the parity it gives up is
      # real and is the reason this comment is long: the command here is no
      # longer literally the one `verify` runs. What it runs is that task's only
      # effective statement, and the alternative was a green job nobody could
      # trust or a red one nobody could land.
      - run: mise exec -- cargo test --workspace
