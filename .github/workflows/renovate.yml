name: renovate
#MUTANT-SUITE crates/batten/tests/it/renovate_carry.rs
#MUTANT renovate-guard-dropped|s@^        if: env\.RELEASE_PLZ_TOKEN_SET != 'true'$@        if: false@|renovate_authenticates_with_the_release_token_and_fails_by_name_without_it
#MUTANT renovate-other-token|s@^          token: .* secrets\.RELEASE_PLZ_TOKEN .*$@          token: ${{ github.token }}@|renovate_authenticates_with_the_release_token_and_fails_by_name_without_it

# Renovate, run here rather than by Mend's hosted app (CLOUD-2300).
#
# WHY SELF-HOSTED: the one hook Renovate offers for a file a bump must change
# beside the pin is `postUpgradeTasks`, and a command runs only if it matches
# `allowedCommands`, a global option the operator of the Renovate run sets. On
# Mend's Community (Free) plan — this repository's, read off its dashboard
# 2026-10-15 — "Free users cannot modify nor request arbitrary commands"
# (docs.renovatebot.com/mend-hosted/faq). `sbom-check` keys every pinned action's
# licence to `repo@sha`, so every action bump needs a licence row for its new
# commit, and with no hook that row came from a daily workflow opening a second
# PR per gap — 41 of them, none landable. Here the row is written by Renovate,
# on Renovate's own branch, in the bump's own PR (`renovate.json5`,
# `postUpgradeTasks`).
#
# CLOUD-655 chose the hosted app over this in 2026-08 as "the cleaner of the two",
# before any bump needed a derived file; nothing revisited it until now.
#
# THE ALLOWLIST IS ONE ANCHORED PATTERN PER COMMAND, matched after templating:
# `node .github/renovate/sbom-carry.mjs <depName> <old> <new>`, and the
# argument-free `node .github/renovate/fuzz-lock-carry.mjs` (CLOUD-2538). Never
# a wildcard — a broad pattern lets any config this run reads execute anything.
#
# Mend's app must be removed from this repository when this goes live, or two
# Renovates race over the same `renovate/*` branches.

on:
  # Renovate polls registries; nothing upstream pushes to us, so this is the one
  # trigger that can notice a release. Hourly at :23 — `auto-release-land` owns
  # :00, `auto-bot-land` :05, `release-guard` :17, and `ci-local-parity` refuses
  # two workflows sharing a cron expression.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30 # budget: grandfathered measured=2026-10-15
    env:
      # A BOOLEAN, NEVER THE SECRET: a step's `if:` cannot read `secrets`, so the
      # guard reads whether it is set through this (`release-plz.yml`'s pattern).
      RELEASE_PLZ_TOKEN_SET: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
    steps:
      # THE RELEASE TOKEN, NOT AN APP (CLOUD-2580). A PR opened with the job's own
      # GITHUB_TOKEN triggers no workflow, so CI would never run on Renovate's PRs.
      # This ran as its own GitHub App until every one of 529 runs stopped here:
      # the App ID was never visible to this repository's Actions (run
      # 42304429299 read `vars.RENOVATE_APP_ID || secrets.RENOVATE_APP_ID` as
      # empty). `RELEASE_PLZ_TOKEN` is the fine-grained PAT release-plz already
      # opens CI-triggering PRs with (`release-plz.yml:26-35`).
      #
      # WHAT IT COSTS, STATED: Renovate's PRs are authored by the token's owner, not
      # a bot, so `auto-bot-land`'s bot lanes do not admit them (CLOUD-2357). And
      # an actions-pin bump edits `.github/workflows/*`, which needs the token's
      # Workflows permission; release-plz never needed it.
      #
      # A missing secret fails here, by name, rather than as an auth error below.
      - name: RELEASE_PLZ_TOKEN is empty, so Renovate has no credential whose pull requests trigger CI (CLOUD-2580) - set the secret, do not remove this guard
        if: env.RELEASE_PLZ_TOKEN_SET != 'true'
        run: exit 1
      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_ALLOWED_COMMANDS: '["^node \\.github/renovate/sbom-carry\\.mjs [A-Za-z0-9._/-]+ ?[0-9a-f]{0,40} ?[0-9a-f]{0,40}$", "^node \\.github/renovate/fuzz-lock-carry\\.mjs$"]'
          # Renovate filters a post-upgrade command's environment, so the carry's
          # two tree reads would go out unauthenticated and share a runner IP's
          # 60-an-hour anonymous limit. `customEnvVariables` is the declared way
          # to hand a child process a variable; the carry reads GITHUB_TOKEN.
          RENOVATE_CUSTOM_ENV_VARIABLES: ${{ format('{{"GITHUB_TOKEN":"{0}"}}', secrets.RELEASE_PLZ_TOKEN) }}
