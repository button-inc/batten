name: release-assets

# "Does the latest release actually carry its binaries?" — a question about the
# world, not about any branch, so it runs on a clock rather than on the landing
# path. Same split as lock-currency.yml.
#
# It exists because the answer was NO for six consecutive releases and nothing
# said so (CLOUD-258). `release-artifacts.yml` failed every run from v0.0.31 to
# v0.0.36: each dist leg built, then died on the plan-gated attestation step, and
# the upload after it never ran. A `release`-triggered run reaches no PR and no
# gate — `ci-local-parity` holds its properties over `pull_request` workflows and
# `land` watches a PR's check-runs — so a workflow failing on 100% of its
# invocations was indistinguishable from one that had never fired.
#
# Failure here is actionable, not informational: re-run release-artifacts.yml
# via workflow_dispatch against the named tag. Uploads are --clobber idempotent,
# so topping up a partial release is safe.

on:
  # ONCE PER RELEASE, ON A TRIGGER THIS FAILURE CANNOT SILENCE (CLOUD-1777).
  #
  # CLOUD-258 moved this gate off the `release` event for the reason in the
  # header, and that reasoning stands. What it got wrong was the PERIOD: the
  # clock below samples weekly against a cadence measured at ~4 releases/day
  # (v0.0.151 through v0.0.159 published inside ~48 hours), so it inspects
  # roughly one release in thirty, and only whichever is latest on a Monday.
  # v0.0.159 shipped 1 asset of 18 and nothing would have said so for four days.
  #
  # `release-plz` is `on: push` to `main`, WHICH IS THE WHOLE POINT. A push
  # event is not suppressed by the recursion guard that stops a release created
  # with `GITHUB_TOKEN` from firing `release-artifacts.yml` — the guard that let
  # v0.0.159 ship with no run at all to notice, as against a failed one. A gate
  # reached through the `release` event therefore shares a trigger with the
  # failure it watches, and goes silent in exactly the case it exists to catch.
  # This trigger does not.
  #
  # zizmor flags workflow_run as dangerous because it runs privileged and is
  # usually paired with checking out and executing content the triggering run
  # controlled. NOTHING FROM THE EVENT REACHES THIS JOB: the checkout below
  # names no ref, so it takes the repository's default and the code that
  # executes is `main`'s; no step reads `github.event.workflow_run.*` at all, so
  # there is no ref to poison and nothing to interpolate into a run script. An
  # earlier draft did check out the event's head SHA and run `mise` tasks from
  # it, and this audit refused it — correctly, and that refusal is why the
  # arm has this shape.
  #
  # `release-plz` is `on: push: branches: [main]`, so only a write-access push
  # can fire this at all — a fork cannot reach it, which is the safe subset of
  # `workflow_run` rather than the `pull_request`-fed shape the audit is about.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [release-plz]
    types: [completed]
  schedule:
    # Mondays, 06:30 UTC — after lock-currency, same weekly slot. A BACKSTOP
    # now rather than the primary ask: it covers a quiet period with no pushes,
    # and a release whose own `workflow_run` run was lost.
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check (defaults to the latest release)
        required: false
        type: string

concurrency:
  group: release-assets
  cancel-in-progress: false

permissions: {}

env:
  # Restores locked installs, which `[settings] lockfile = false` turns off
  # along with the install-time write it exists to deny (CLOUD-223). A runner
  # should install locked, and its checkout is disposable, so a write here
  # costs nothing; the clone being protected is a developer's.
  MISE_LOCKFILE: "true"

jobs:
  release-assets:
    name: release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-10
    permissions:
      contents: read # read the release's asset list
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # Pinned to `batten.toml`'s `[[provision]]` version (CLOUD-1672). The
          # digest above pins the ACTION; this pins the MISE it installs, which
          # is a separate resolution the digest does not reach.
          version: 2026.9.1
      # TAG goes through env, never interpolated into the run block: a `${{ }}`
      # expansion is textual substitution into the shell script, so a tag naming
      # shell metacharacters would execute. Same posture as every other run block
      # in this repo, and zizmor gates it at high severity.
      # NO TAG ON THE `workflow_run` ARM, DELIBERATELY. An empty `TAG` means
      # "the latest release", and after release-plz publishes, the latest
      # release IS the one it just shipped — so the per-release trigger needs no
      # argument and, more to the point, no edit to the task. `shell-retirement`
      # refuses an edited shell gate (CLOUD-843 replaces them rather than
      # maintaining them, and this one cannot be ported: rego downloads no
      # assets and hashes no bytes), so the trigger had to be expressible here
      # alone. It is.
      #
      # THE COST, STATED: release-plz runs on every push to `main`, so a merge
      # that shipped no release re-checks whichever release is latest — correct,
      # and redundant. Suppressing that needs the tag at the triggering commit,
      # which is exactly the task edit this shape exists to avoid. CLOUD-1777
      # carries the follow-up.
      - name: Check the release carries one archive per matrix target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: mise run release-assets-check "$TAG"
      # The provenance half of the same question (CLOUD-583), on this clock for
      # the same reason the step above is: whether a published release is attested
      # changes with no diff, so it is a property of the WORLD and belongs nowhere
      # near the landing path. The landing path runs the OFFLINE half instead —
      # `release-attestation-precondition` in batten.toml.
      #
      # Green today by reporting a gap rather than by verifying anything: this
      # repository's attestations endpoint answers 404, which is the platform not
      # offering the feature at all, and the task exits 0 having judged no
      # artifact. It starts verifying on its own the moment CLOUD-585 makes the
      # repository public, with no edit here.
      - name: Check the release's binaries carry build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: mise run attestation-check "$TAG"
