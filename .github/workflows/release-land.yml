name: release-land

# TITLED BY ITS TAG (CLOUD-2033), as `release-artifacts` is: `release in-flight`
# reads both workflows' runs, so a land queued here holds the next cut, and finds
# a failed `land` job by `display_title`.
run-name: "release-land ${{ inputs.tag }}"

# workflow-shell: CLOUD-2287 the land job moved here from release-artifacts.yml
# unchanged but for its publish target, so the step count it adds is the count
# that file lost, plus the bake job that took its place there.

# Publish a built release and fast-forward `main` to it (CLOUD-2287).
#
# MOVED OUT OF `release-artifacts.yml`, and the move is the mechanism. A
# release now bakes `install.lock` onto its head as one commit B, and B must
# pass CI as any release head does before `main` can fast-forward to it — so
# the land cannot be the build workflow's last job, which would run before B
# had a check. The cut (`auto-release-land.yml`, `release cut
# --land-workflow`) dispatches this workflow once B's CI is green, with the tag
# and B; a head that is not the open draft's bake is cut again instead.
#
# RECOVERY. A failed `land` is re-run with "Re-run failed jobs": its first step
# is idempotent, and a published tag at B resumes at (d).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.0.15)
        required: true
        type: string
      sha:
        description: The baked release head B, a child of the draft's target (full SHA)
        required: true
        type: string

permissions:
  contents: read

env:
  # Restores locked installs, which `[settings] lockfile = false` turns off
  # along with the install-time write it exists to deny (CLOUD-223).
  MISE_LOCKFILE: "true"
  # Make the `install_args` list binding (`tool pin loose`, CLOUD-2556).
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  # THE ONE JOB THAT PUBLISHES, AND THE ONE THAT MOVES `main` (CLOUD-2033 P3.4).
  #
  # It checks out `main`, never `inputs.sha`, so every predicate it runs is
  # `main`'s own code; the release head is fetched beside it for `git show` and
  # `merge-base`. `inputs.sha` is the BAKED head B (CLOUD-2287), a child of the
  # draft's target A that adds only `install.lock` and `install.sh`. It runs in `main-writer`, so no lander moves `main` under it.
  # Its branch is one tested verb, `release land-state`, whose line each step
  # below conditions on. A could-not-look (exit 3) anywhere discards nothing;
  # only a refusal (exit 1) in (a) or (b) does.
  land:
    name: land
    runs-on: ubuntu-latest
    timeout-minutes: 45 # budget: p95=900s x3 measured=2026-10-12
    concurrency:
      group: main-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # publish the release and mark it latest
      statuses: write # post release-path on the release head
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ inputs.sha }}
      BATTEN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          version: 2026.9.1
          cache: false
          install_args: rust aqua:cli/cli
      - name: Fetch the release head beside main
        run: mise run batten -- ci step --arg-env SHA -- git fetch origin
      - name: (a) Which branch of land is this release on?
        id: state
        run: mise run batten -- ci step --capture state --arg-env SHA --arg-env TAG -- mise run batten -- release land-state --sha
      - name: (a) A draft that fails an assertion is discarded
        if: startsWith(steps.state.outputs.state, 'draft-bad')
        run: mise run batten -- ci step --arg-env TAG -- mise run batten -- release discard
      - name: (a) The draft failed an assertion of land's first step and was discarded
        if: startsWith(steps.state.outputs.state, 'draft-bad')
        run: exit 1
      - name: (a) Nothing here can land - the release is absent, or burned
        if: steps.state.outputs.state == 'absent' || steps.state.outputs.state == 'burned'
        run: exit 1
      # (b) A REFUSAL DISCARDS AND A COULD-NOT-LOOK DOES NOT: exit 2, the
      # verb's `Violation`, is mapped to `refused`, and exit 3 stays the step's
      # own failure (CLOUD-2392).
      - name: (b) Verify the draft
        if: steps.state.outputs.state == 'draft-ok'
        id: verify
        run: mise run batten -- ci step --verdict verify --on 0=ok --on 2=refused --arg-env TAG -- mise run batten -- release verify --draft
      - name: (b) Discard the draft the verify refused
        if: steps.verify.outputs.verify == 'refused'
        run: mise run batten -- ci step --arg-env TAG -- mise run batten -- release discard
      - name: (b) The draft did not verify and was discarded
        if: steps.verify.outputs.verify == 'refused'
        run: exit 1
      # (c) PUBLISHING CREATES THE TAG AT B AND MAKES THE RELEASE IMMUTABLE
      # (CLOUD-2287: `--target` moves it from A to its bake, so the tag, the
      # release-path status and `main` all name the commit carrying the lock).
      # Published as a non-latest pre-release: nothing pins it yet, and
      # `latest` moves only in (f), after `main` does.
      - name: (c) Publish at the baked head as a non-latest pre-release
        if: steps.verify.outputs.verify == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: --target=${{ inputs.sha }}
        run: mise run batten -- ci step --arg-env TAG --arg-env TARGET -- gh release edit --draft=false --prerelease --latest=false
      - name: (c) Verify it published, immutable and tagged at its head
        if: steps.verify.outputs.verify == 'ok'
        run: mise run batten -- ci step --arg-env TAG -- mise run batten -- release verify
      - name: (d) Post release-path on the release head
        if: steps.verify.outputs.verify == 'ok' || steps.state.outputs.state == 'resume-at-d'
        run: mise run batten -- ci step --arg-env SHA -- mise run batten -- release path --post
      # (e) `force=false` IS THE FAST-FORWARD ASSERTION, made by the server
      # atomically with the write, with RELEASE_PLZ_TOKEN because a ref moved by
      # the job token fires no workflow. A refusal is a stale status or a race
      # with a `ci` re-run while `main` is still behind the head: (d) is
      # re-posted and the write retried, three attempts in all. A `main` that
      # moved past the head refuses all three, and the release stays a
      # non-latest pre-release nothing pins.
      - name: (e) Fast-forward main to the release head
        if: steps.verify.outputs.verify == 'ok' || steps.state.outputs.state == 'resume-at-d'
        id: first
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          FIELD: sha=${{ inputs.sha }}
          ROUTE: repos/${{ github.repository }}/git/refs/heads/main
        run: mise run batten -- ci step --verdict moved --on 0=yes --on 1=no --arg-env FIELD --arg-env ROUTE -- gh api -X PATCH -F force=false -f
      - name: (e) Re-post release-path after a refused write
        if: steps.first.outputs.moved == 'no'
        run: mise run batten -- ci step --arg-env SHA -- mise run batten -- release path --post
      - name: (e) Fast-forward main to the release head, second attempt
        if: steps.first.outputs.moved == 'no'
        id: second
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          FIELD: sha=${{ inputs.sha }}
          ROUTE: repos/${{ github.repository }}/git/refs/heads/main
        run: mise run batten -- ci step --verdict moved --on 0=yes --on 1=no --arg-env FIELD --arg-env ROUTE -- gh api -X PATCH -F force=false -f
      - name: (e) Re-post release-path after a second refused write
        if: steps.second.outputs.moved == 'no'
        run: mise run batten -- ci step --arg-env SHA -- mise run batten -- release path --post
      - name: (e) Fast-forward main to the release head, last attempt
        if: steps.second.outputs.moved == 'no'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          FIELD: sha=${{ inputs.sha }}
          ROUTE: repos/${{ github.repository }}/git/refs/heads/main
        run: mise run batten -- ci step --arg-env FIELD --arg-env ROUTE -- gh api -X PATCH -F force=false -f
      - name: (f) Mark it the latest release
        if: steps.verify.outputs.verify == 'ok' || steps.state.outputs.state == 'resume-at-d' || steps.state.outputs.state == 'skip-to-f'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run batten -- ci step --arg-env TAG -- gh release edit --prerelease=false --latest
      # THE RELEASE IS RECORDED WHERE IT IS MADE (CLOUD-2033, moved from
      # release-plz.yml). The tag exists from (c) on, so it is fetched before the
      # tracking reads its range.
      - name: Fetch the release tag (f) left on main
        run: git fetch --force --tags origin
      # An empty secret must FAIL a release, never skip tracking quietly: the
      # job stays green, and nothing anywhere says the release was never
      # recorded. `LINEAR_ACCESS_KEY` is asserted to exist; nothing in this tree
      # can confirm it, so this step is where a wrong assertion surfaces.
      - name: Release tracking requires its credential
        env:
          LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}
        run: mise run batten -- ci step --require-env LINEAR_ACCESS_KEY -- true
      # TWO INVOCATIONS, AND THE SECOND IS NOT OPTIONAL. `sync` records the
      # release object and attaches the `CLOUD-*` issues in the tag's range; the
      # pipeline is `type: scheduled`, so `complete` is what marks it Released.
      - name: Record the release in Linear
        uses: linear/linear-release-action@0a25abab892a91062ebf42260dbb2ce6277aa205 # v0.16.0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ inputs.tag }}
      - name: Complete the Linear release
        uses: linear/linear-release-action@0a25abab892a91062ebf42260dbb2ce6277aa205 # v0.16.0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ inputs.tag }}
      # CLOUD-174: `Done` means released, and no integration supplies that
      # transition, so the list of issues this release finished is printed into
      # the run summary. `--stdin /dev/null` is the refs-only arm: it reports
      # and decides nothing.
      - name: Report which issues this release shipped
        run: mise run batten -- ci step --summary "Issues this release tag shipped - move any still In Review to Done, the only transition that sets Done, which done-check refuses early" --stdin /dev/null --arg-env TAG -- mise run released
