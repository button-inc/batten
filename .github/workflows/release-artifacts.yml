name: release-artifacts

# TITLED BY ITS TAG (CLOUD-2033). `release in-flight` finds the build of a tag,
# and the `land` job that failed on it, by `display_title`; the run object
# carries no other field naming the inputs it was dispatched with.
run-name: "release-artifacts ${{ inputs.tag }}"

# workflow-shell: CLOUD-843 the step count rises because multi-line shell bodies
# became one-command steps (argv, `ci step`, or an expression-gated `exit 1`);
# the shell LINES fell, which `batten census shell` measures. The increase is
# the retirement's shape, owned here as `workflow add other`'s permit asks.

# Build the distributable binaries and attach them to the GitHub release.
#
# Until this existed, every release shipped ZERO assets: `mise run release` is
# `release-plz release`, which tags and creates the release entry but never
# builds. `cross-check` runs `cargo check` for the non-Linux targets — codegen to
# metadata, no linking — so it proves the code compiles but produces nothing
# runnable. This workflow is what makes a release installable, which is what
# dogfooding Batten as consumer #1 requires (house-style §12).
#
# EVERY LEG RUNS ON ubuntu-latest, macOS included, AND THAT IS INHERITED RATHER
# THAN CHOSEN. It was priced against runner billing, which is an account setting
# this file does not own and must not restate: the previous version of this
# comment quoted a per-OS multiplier and a repository visibility, and both were
# wrong by the time anyone read them — which is how a reader ends up told a price
# that expired. Runner cost and width live in GitHub's published table plus the
# account's tier, and this repository already caches that ONCE, dated, at
# `ci.yml`'s arm64 paragraph. Point there; a second copy is what went stale.
#
# What this file CAN say durably is which decisions rest on that price, so they
# are re-decidable rather than mistaken for capability limits: the SDK question
# below, `macos-link-check`'s rule 1, and whether the Darwin artifacts can be
# executed on Darwin at all (CLOUD-364). CLOUD-737 owns re-deciding each.
#
# The general form, worth carrying past this file: a comment stating a fact that
# lives in another system is a cache with no invalidation. State the DEPENDENCY
# ("this is priced by runner billing"), never the VALUE.
#
# `rustup target add` installs only the standard library, so each
# non-native target needs a LINKER supplied, which is what the two wrappers do:
#
#   cross     builds inside a per-target container carrying that target's
#             linker and sysroot (the other Linux targets, and Windows).
#   zigbuild  uses zig as the linker. zig carries Darwin linker support, so a
#             Linux host emits a real Mach-O with no Apple SDK involved — and
#             writes the ad-hoc code signature Apple Silicon requires before it
#             will exec an arm64 binary at all.
#
# Verified on this repo before adopting: both Darwin targets link from Linux and
# produce `Mach-O 64-bit arm64/x86_64 executable` carrying LC_CODE_SIGNATURE.
# The caveat to watch is dependency drift — a crate that links a system framework
# (CoreFoundation, Security) would need SDKROOT and a real macOS SDK, which is
# where the Apple licensing question returns. Nothing in the tree does today.
#
# The legs are `dist.yml`'s (CLOUD-2554), the one definition every pull request
# also runs: each builds through the SAME task a maintainer runs locally, so the
# archive CI uploads is the archive you can reproduce.
#
# TRIGGER: DISPATCHED, NEVER A RELEASE EVENT (CLOUD-2121). The release is a
# DRAFT until `release-land.yml` publishes it, and GitHub triggers no
# workflow on `created` for a draft. The cut (`auto-release-land.yml`) is the
# ONE dispatcher (CLOUD-2033): it creates the draft at the release head `sha`
# and sends it here with that tag and that sha.
#
# THE RELEASE PATH (CLOUD-2033, `rules/commits.md`). Every build leg checks out
# `inputs.sha` — the release head, never a tag (a draft may carry none) and
# never whatever `main` has drifted to — and every `--clobber` upload first runs
# `batten release guard`, which refuses a release that is not a draft of that
# sha: a build of one commit never fills a draft for another, and a published
# release's assets are never replaced. Nothing here publishes: the last job,
# `bake`, commits `install.lock` onto the release head (CLOUD-2287), and the
# publish and the move of `main` are `release-land.yml`'s, dispatched by the
# cut once that bake is green. `cleanup` discards the draft when a BUILD job
# failed or was cancelled — never on a `bake` failure, so "Re-run failed jobs"
# always finds its draft.
#
# RECOVERY. A failed `bake` is re-run with "Re-run failed jobs": the build jobs
# already succeeded, and the bake's commit is fast-forward only. A manual
# dispatch with a draft's `tag` and `sha` rebuilds it; against a published
# release the guard refuses every upload, so nothing changes.

on:
  # The only trigger. Publishing is this workflow's last job, once every asset is
  # uploaded, so a release is never visible without its binaries. Re-running it
  # against an existing tag is idempotent — `gh release upload --clobber`
  # replaces, and publishing a published release changes nothing.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v0.0.15)
        required: true
        type: string
      sha:
        description: The release head the draft targets, built by every leg (full SHA)
        required: true
        type: string

concurrency:
  # Keyed by tag, so two releases never race to upload to the same one; not
  # cancel-in-progress, because a half-uploaded release is worse than a slow one.
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # EACH JOB INSTALLS ITS OWN LIST AND NOTHING ELSE (CLOUD-2553), `ci.yml`'s
  # binding. Unbound, `mise run` auto-installed the whole manifest on every leg,
  # and v0.0.217's macOS legs died building the agent toolchain's `tiktoken`
  # for a tool no step here runs. `ci-tools` holds every use to a list now.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  # Restores locked installs, which `[settings] lockfile = false` turns off
  # along with the install-time write it exists to deny (CLOUD-223). A runner
  # should install locked, and its checkout is disposable, so a write here
  # costs nothing; the clone being protected is a developer's.
  MISE_LOCKFILE: "true"

jobs:
  # THE BUILD IS `dist.yml`'s (CLOUD-2554), the same file every pull request
  # runs with no `tag`, so this release builds exactly what the pull request
  # was green on; the tag is what turns its uploads on. The grant is the
  # uploads' and the attestation's.
  dist:
    permissions:
      contents: write # upload assets to the release
      id-token: write # sign the provenance statement
      attestations: write # record the attestation
    uses: ./.github/workflows/dist.yml
    with:
      sha: ${{ inputs.sha }}
      tag: ${{ inputs.tag }}

  # THE INSTALLERS, GENERATED BY CARGO-DIST (CLOUD-2297), never hand-rolled.
  # `dist build --artifacts=global` reads every leg's manifest fragment and
  # writes `batten-installer.sh`, `batten-installer.ps1` and `sha256.sum`, each
  # installer carrying every archive's sha256 and refusing a download that does
  # not match. It needs every leg, so it runs after the matrix.
  installers:
    name: installers
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-10-15
    permissions:
      contents: write # upload the installers to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          version: 2026.9.1
          cache: false
          install_args: rust aqua:axodotdev/cargo-dist aqua:cli/cli
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-manifest-*
          path: target/distrib
          merge-multiple: true
      # dist refuses a missing or stale MSI template, which is its own output
      # and never committed (`.gitignore`); `batten dist` writes it on each leg,
      # and this job's fresh checkout needs its own.
      - name: Generate the MSI template
        run: mise exec -- dist generate --mode msi
      - name: Generate the installers from every leg's manifest
        env:
          TAG: ${{ inputs.tag }}
        run: mise run batten -- ci step --arg-env TAG -- dist build --artifacts=global --tag
      - name: Refuse to upload into anything but a draft of this sha
        env:
          BATTEN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: mise run batten -- ci step --arg-env SHA --arg-env TAG -- mise run batten -- release guard --sha
      - name: Upload the installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHELL_INSTALLER: target/distrib/batten-installer.sh
          POWERSHELL_INSTALLER: target/distrib/batten-installer.ps1
          DIST_SUMS: target/distrib/sha256.sum
          # The Homebrew formula and the npm package (CLOUD-2298), from the
          # same global step and the same per-leg checksums.
          HOMEBREW_FORMULA: target/distrib/batten.rb
          NPM_PACKAGE: target/distrib/batten-npm-package.tar.gz
        run: mise run batten -- ci step --arg-env TAG --arg-env SHELL_INSTALLER --arg-env POWERSHELL_INSTALLER --arg-env DIST_SUMS --arg-env HOMEBREW_FORMULA --arg-env NPM_PACKAGE -- gh release upload --clobber

  # The JSON Schemas for the two config surfaces (CLOUD-33), published as release
  # assets.
  #
  # A schema that only sits in the tree is a build artifact; one a validator can
  # reach is published. This is what makes the consumer-side `.taplo.toml` rules
  # possible — a consumer binds each file to the surface that describes it:
  #   batten.toml       → .../releases/latest/download/batten.schema.json
  #   batten.local.toml → .../releases/latest/download/batten.local.schema.json
  # and their config is validated in the editor, not first at `batten check`.
  #
  # BOTH, because CLOUD-239 split the override layer into its own Rust type and
  # its own derived schema and this job kept publishing one of them. The
  # committed-but-unpublished half is the build artifact the paragraph above
  # rules out: a consumer had no URL to bind `batten.local.toml` to, so the
  # surface where a silently-dropped override key does the most damage was the
  # surface no editor could check.
  #
  # Its own job rather than a step in the matrix: the schema is platform
  # independent, so uploading it seven times would race seven writers onto one
  # asset name for no gain. Regenerated from the tagged source rather than read
  # from the tree, so the published bytes are derived from the release's own
  # config types — `schema-check` already gates that those match the committed
  # copy, but deriving here means a release can never publish a stale artifact
  # even if that gate were bypassed.
  schema:
    name: schema
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-10
    permissions:
      contents: write # upload the asset to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # Pinned to `batten.toml`'s `[[provision]]` version (CLOUD-1672). The
          # digest above pins the ACTION; this pins the MISE it installs, which
          # is a separate resolution. Unset, every job here died at this step in
          # 11s on v0.0.152 and the release published with zero binaries.
          version: 2026.9.1
          cache: false
          # `batten sbom` spawns syft; `gh` uploads.
          install_args: rust aqua:anchore/syft aqua:cli/cli
      - name: Derive both schemas from the tagged config types
        run: mise run schema
      # The SBOM rides this job rather than a new one (CLOUD-262). GitHub rounds
      # each job up to the nearest minute, and this job already checks out the tag,
      # already runs mise, already holds `contents: write` and already uploads
      # exactly this shape of asset — one platform-independent file. A ~2s step
      # here costs no additional billed minutes; a new job costs one.
      #
      # Being outside the `dist` matrix also means an SBOM failure cannot suppress
      # the binaries — the ordering CLOUD-258 paid six silent releases to learn.
      #
      # `sbom` emits spdx=/cdx= KEY=VALUE lines, so the asset paths are decided in
      # that one file and never re-derived in YAML.
      - name: Derive the SBOM from the tagged source
        id: sbom
        shell: bash
        run: mise run batten -- ci step --outputs -- mise run sbom
      # The CLI reference rides this job for the reason the SBOM does (CLOUD-171):
      # one platform-independent file, and this job already checks out the tag,
      # runs mise, holds `contents: write` and uploads exactly this shape of
      # asset. It is also the ONLY place the reference is ever produced — it is
      # not committed, so a release rendering it from the tagged source is what
      # makes it current by construction rather than by a drift gate.
      #
      # `render:cli` emits a reference= KEY=VALUE line, so the asset path is
      # decided in that one file and never re-derived in YAML.
      - name: Render the CLI reference from the tagged surface
        id: reference
        shell: bash
        run: mise run batten -- ci step --outputs -- mise run render:cli
      - name: Refuse to upload into anything but a draft of this sha
        env:
          BATTEN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: mise run batten -- ci step --arg-env SHA --arg-env TAG -- mise run batten -- release guard --sha
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SPDX: ${{ steps.sbom.outputs.spdx }}
          CDX: ${{ steps.sbom.outputs.cdx }}
          REFERENCE: ${{ steps.reference.outputs.reference }}
          # Literal paths travel beside the derived ones because `--arg-env`
          # appends in order and the tag must be the first positional.
          SCHEMA: schema/batten.schema.json
          LOCAL_SCHEMA: schema/batten.local.schema.json
        run: mise run batten -- ci step --arg-env TAG --arg-env SCHEMA --arg-env LOCAL_SCHEMA --arg-env SPDX --arg-env CDX --arg-env REFERENCE -- gh release upload --clobber

  # The checksum manifest (CLOUD-278), the value every packaging channel consumes:
  # a Homebrew formula pins it, an aqua/mise registry entry carries it, and
  # `cargo binstall` resolves assets whose integrity nobody could check before.
  #
  # ITS OWN JOB, AND IT RUNS LAST. `mise run checksums` hashes the release's own
  # assets read back after upload, so it can only run once everything that
  # publishes one has finished — hence `needs`. The seven dist legs are
  # independent and `fail-fast: false`, so no leg can see the whole release, and a
  # manifest assembled from a list restated here would be a second authority that
  # goes stale the first time a job starts uploading something new.
  #
  # Being strictly downstream is also what keeps CLOUD-258's ordering hazard away:
  # this job cannot suppress an artifact, because every artifact is already
  # uploaded before it starts.
  #
  # No `if: always()`. A manifest cut over a knowingly-partial release is a claim
  # about an incomplete set; `release-assets-check` already fails that release on
  # the missing target, and the recovery is unchanged — a workflow_dispatch re-run
  # rebuilds every asset and this manifest with them.
  checksums:
    name: checksums
    needs: [dist, installers, schema]
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-11
    permissions:
      contents: write # upload the manifest to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # Pinned to `batten.toml`'s `[[provision]]` version (CLOUD-1672). The
          # digest above pins the ACTION; this pins the MISE it installs, which
          # is a separate resolution. Unset, every job here died at this step in
          # 11s on v0.0.152 and the release published with zero binaries.
          version: 2026.9.1
          cache: false
          install_args: rust aqua:cli/cli
      # `checksums` emits a sums= KEY=VALUE line, so the asset path is decided in
      # that one file and never re-derived in YAML.
      - name: Derive the manifest from the release's own assets
        id: checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `batten release sums` reads the credential through `[forge]
          # credential_names` (CLOUD-843), which names no conventional variable.
          BATTEN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: mise run batten -- ci step --outputs --arg-env TAG -- mise run checksums --
      - name: Refuse to upload into anything but a draft of this sha
        env:
          BATTEN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: mise run batten -- ci step --arg-env SHA --arg-env TAG -- mise run batten -- release guard --sha
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SUMS: ${{ steps.checksums.outputs.sums }}
        run: mise run batten -- ci step --arg-env TAG --arg-env SUMS -- gh release upload --clobber

  # DISCARD ON A BUILD FAILURE, AND ONLY THEN (CLOUD-2033 P3.3). A build job that
  # failed or was cancelled leaves a draft nothing will finish, so it is deleted
  # with any tag it carried and the next cut reuses the version. `bake` is not
  # in `needs:`, and `land` is another workflow, so neither failure reaches
  # here: recovery by re-running either always finds its draft.
  cleanup:
    name: cleanup
    needs: [dist, installers, schema, checksums]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30 # budget: p95=600s x3 measured=2026-10-12
    permissions:
      contents: write # delete the draft and its tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          version: 2026.9.1
          cache: false
          install_args: rust
      - name: Discard the draft a failed build left
        env:
          BATTEN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: mise run batten -- ci step --arg-env TAG -- mise run batten -- release discard

  # THE BAKE (CLOUD-2287), the job that used to be `land`'s place. The draft's
  # archives and `SHA256SUMS` exist now, so `install.lock` — the tag and each
  # bootstrap archive's line — is written and `install.sh` regenerated from it,
  # and both are committed onto the release head A as one commit B, pushed to
  # the release PR's branch through the forge with RELEASE_PLZ_TOKEN: a branch
  # moved by the job token fires no workflow, and B's CI is what brings
  # `auto-release-land`'s cut back to land it (`release cut --land-workflow`).
  # It checks out A, never `main`: B's own `install_script.rs` gate renders the
  # script from B's template, so the bake must render from the same one. It
  # runs no PR content beyond what A already is — release-plz's version bump
  # over `main`.
  bake:
    name: bake
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 30 # budget: p95=600s x3 measured=2026-10-12
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          version: 2026.9.1
          cache: false
          install_args: rust
      - name: Bake install.lock onto the release head
        env:
          BATTEN_GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: mise run batten -- ci step --arg-env SHA --arg-env TAG -- mise run batten -- release bake --sha
