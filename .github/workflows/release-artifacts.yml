name: release-artifacts

# Build the distributable binaries and attach them to the GitHub release.
#
# Until this existed, every release shipped ZERO assets: `mise run release` is
# `release-plz release`, which tags and creates the release entry but never
# builds. `cross-check` runs `cargo check` for the non-Linux targets — codegen to
# metadata, no linking — so it proves the code compiles but produces nothing
# runnable. This workflow is what makes a release installable, which is what
# dogfooding Batten as consumer #1 requires (house-style §12).
#
# EVERY LEG RUNS ON ubuntu-latest, deliberately — macOS included. GitHub bills
# macOS runners at 10x and Windows at 2x on a private repo; this workflow uses
# neither. `rustup target add` installs only the standard library, so each
# non-native target needs a LINKER supplied, which is what the two wrappers do:
#
#   cross     builds inside a per-target container carrying that target's
#             linker and sysroot (the other Linux targets, and Windows).
#   zigbuild  uses zig as the linker. zig carries Darwin linker support, so a
#             Linux host emits a real Mach-O with no Apple SDK involved — and
#             writes the ad-hoc code signature Apple Silicon requires before it
#             will exec an arm64 binary at all.
#
# Verified on this repo before adopting: both Darwin targets link from Linux and
# produce `Mach-O 64-bit arm64/x86_64 executable` carrying LC_CODE_SIGNATURE.
# The caveat to watch is dependency drift — a crate that links a system framework
# (CoreFoundation, Security) would need SDKROOT and a real macOS SDK, which is
# where the Apple licensing question returns. Nothing in the tree does today.
#
# Each job runs `mise run dist <target>`, the SAME command a maintainer runs
# locally, so the archive CI uploads is the archive you can reproduce.
#
# TRIGGER: `release: published` fires because release-plz authenticates with
# RELEASE_PLZ_TOKEN (a PAT), not the default GITHUB_TOKEN — releases created by
# GITHUB_TOKEN deliberately do not trigger other workflows. If that secret is
# ever removed, this workflow stops firing silently; use the workflow_dispatch
# below to recover, and see the same note in release-plz.yml.

on:
  release:
    types: [published]
  # Recovery: re-run against an existing tag (a dropped trigger, a failed matrix
  # leg). Uploading is idempotent — `gh release upload --clobber` replaces.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v0.0.15)
        required: true
        type: string

concurrency:
  # Keyed by tag, so two releases never race to upload to the same one; not
  # cancel-in-progress, because a half-uploaded release is worse than a slow one.
  group: release-artifacts-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Restores locked installs, which `[settings] lockfile = false` turns off
  # along with the install-time write it exists to deny (CLOUD-223). A runner
  # should install locked, and its checkout is disposable, so a write here
  # costs nothing; the clone being protected is a developer's.
  MISE_LOCKFILE: "true"

jobs:
  dist:
    name: dist (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30 # budget: grandfathered measured=2026-08-10
    permissions:
      contents: write # upload assets to the release
      id-token: write # sign the provenance statement
      attestations: write # record the attestation
    strategy:
      # One target's failure must not cancel the others: a partial release we can
      # top up beats no release at all.
      fail-fast: false
      matrix:
        include:
          # The host target: no container needed, so no cross.
          - target: x86_64-unknown-linux-gnu
            build-tool: cargo
          - target: aarch64-unknown-linux-gnu
            build-tool: cross
          # musl gives the statically linked binary §12 asks for — it runs on any
          # Linux regardless of glibc version, which is what makes a single
          # downloadable binary actually portable.
          - target: x86_64-unknown-linux-musl
            build-tool: cross
          - target: aarch64-unknown-linux-musl
            build-tool: cross
          # The gnu triple, not msvc: gnu is what a Linux host can link (and what
          # `cross-check` already type-checks), so Windows costs no 2x-billed
          # runner. msvc would be the more native choice for Windows users, but
          # it can only be linked on Windows — revisit if that trade stops paying.
          - target: x86_64-pc-windows-gnu
            build-tool: cross
          # Darwin via zig. No macOS runner, no Apple SDK.
          - target: aarch64-apple-darwin
            build-tool: zigbuild
          - target: x86_64-apple-darwin
            build-tool: zigbuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build the tagged commit, never whatever main has drifted to since.
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      # cache: false — a release build must not restore a shared cache. zizmor
      # flags cache-poisoning as high severity precisely on artifact-publishing
      # workflows: a poisoned cache entry would end up inside a signed binary,
      # and the attestation would faithfully attest to the compromised build.
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          cache: false
      - name: Install cross
        if: matrix.build-tool == 'cross'
        uses: taiki-e/install-action@51cd0b8c0499559d9a4d75c0f5c67bec3a894ec8 # v2
        with:
          tool: cross
      # NO install step for zig or cargo-zigbuild: mise pins both in [tools], the
      # mise-action step above passes no `install_args` and so installs every
      # pinned tool, and `mise run dist` below puts them on PATH. That is also
      # the versions `darwin-link` links against, so the release and the gate that
      # proved it use one pin, written down once.
      #
      # There WAS an install-action step here — a second provisioning path for a
      # mise-pinned tool — and it stopped working (CLOUD-259): upstream dropped
      # zig, falls back to cargo-binstall (no prebuilt), then to a from-source
      # crate build (zig is not a crate). Both fallbacks are dead ends, so the step
      # could only fail, and both Darwin legs died before reaching the build. The
      # source-build fallback is spelled in prose rather than as the literal
      # command because `no-cargo-install-in-ci` bans that literal in this file —
      # a gate that fired on its own documentation is a gate people delete.
      # cargo-zigbuild
      # was already resolving out of mise's install dir on those runs — the step
      # re-found what mise had installed and contributed only a way to fail.
      #
      # `cross` is NOT in mise.toml, so its step above is a different case.
      #
      # cross supplies its target's std inside the container; the other two link
      # against a rustup-installed one on the host.
      - name: Add the Rust target
        if: matrix.build-tool != 'cross'
        run: rustup target add ${{ matrix.target }}
      - name: Build and archive
        id: dist
        shell: bash
        # `dist` emits archive=/binary= KEY=VALUE lines, so the per-target
        # binary suffix is decided in one place and never re-derived here.
        env:
          DIST_BUILD_TOOL: ${{ matrix.build-tool }}
        run: mise run dist "${{ matrix.target }}" >>"$GITHUB_OUTPUT"
      # UPLOAD FIRST, ATTEST SECOND (CLOUD-258). The reverse order shipped, and
      # every release from v0.0.31 to v0.0.36 attached zero binaries: all seven
      # legs built, then died on the attestation with
      #
      #   Failed to persist attestation: Feature not available for the
      #   button-inc organization.
      #
      # — a plan-gated feature this private repo does not have. Because the step
      # failed, the upload after it never ran, so an OPTIONAL provenance claim
      # took the artifact itself down with it. Six consecutive total failures
      # went unnoticed because a `release`-triggered run reaches no PR and no
      # gate: `ci-local-parity` holds its properties over `pull_request`
      # workflows, and `land` watches a PR's checks. `release-assets-check`,
      # scheduled, is the signal that was missing.
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" "${{ steps.dist.outputs.archive }}" --clobber
      # Attest the BINARY rather than the archive: the provenance should bind to
      # the executable a user runs, so repackaging cannot launder it (§12 — a
      # trust engine must exceed the ordinary distribution bar, not match it).
      # Uploading does not consume the binary, so attesting after it binds to the
      # same bytes it did before.
      #
      # continue-on-error until the repo is public, at which point this step
      # starts succeeding on its own with no change here — the plan gate is the
      # only thing failing it. The claim is deferred, not dropped: an unattested
      # release is worse than an attested one and far better than none.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: ${{ steps.dist.outputs.binary }}

  # The JSON Schema for `batten.toml` (CLOUD-33), published as a release asset.
  #
  # A schema that only sits in the tree is a build artifact; one a validator can
  # reach is published. This is what makes the consumer-side `.taplo.toml` rule
  # possible — a consumer binds `batten.toml` to
  #   https://github.com/button-inc/batten/releases/latest/download/batten.schema.json
  # and their config is validated in the editor, not first at `batten check`.
  #
  # Its own job rather than a step in the matrix: the schema is platform
  # independent, so uploading it seven times would race seven writers onto one
  # asset name for no gain. Regenerated from the tagged source rather than read
  # from the tree, so the published bytes are derived from the release's own
  # config types — `schema-check` already gates that those match the committed
  # copy, but deriving here means a release can never publish a stale artifact
  # even if that gate were bypassed.
  schema:
    name: schema
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-10
    permissions:
      contents: write # upload the asset to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          cache: false
      - name: Derive the schema from the tagged config types
        run: mise run schema
      # The SBOM rides this job rather than a new one (CLOUD-262). GitHub rounds
      # each job up to the nearest minute, and this job already checks out the tag,
      # already runs mise, already holds `contents: write` and already uploads
      # exactly this shape of asset — one platform-independent file. A ~2s step
      # here costs no additional billed minutes; a new job costs one.
      #
      # Being outside the `dist` matrix also means an SBOM failure cannot suppress
      # the binaries — the ordering CLOUD-258 paid six silent releases to learn.
      #
      # `sbom` emits spdx=/cdx= KEY=VALUE lines, so the asset paths are decided in
      # that one file and never re-derived in YAML.
      - name: Derive the SBOM from the tagged source
        id: sbom
        shell: bash
        run: mise run sbom >>"$GITHUB_OUTPUT"
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          SPDX: ${{ steps.sbom.outputs.spdx }}
          CDX: ${{ steps.sbom.outputs.cdx }}
        run: gh release upload "$TAG" schema/batten.schema.json "$SPDX" "$CDX" --clobber

  # The checksum manifest (CLOUD-278), the value every packaging channel consumes:
  # a Homebrew formula pins it, an aqua/mise registry entry carries it, and
  # `cargo binstall` resolves assets whose integrity nobody could check before.
  #
  # ITS OWN JOB, AND IT RUNS LAST. `mise run checksums` hashes the release's own
  # assets read back after upload, so it can only run once everything that
  # publishes one has finished — hence `needs`. The seven dist legs are
  # independent and `fail-fast: false`, so no leg can see the whole release, and a
  # manifest assembled from a list restated here would be a second authority that
  # goes stale the first time a job starts uploading something new.
  #
  # Being strictly downstream is also what keeps CLOUD-258's ordering hazard away:
  # this job cannot suppress an artifact, because every artifact is already
  # uploaded before it starts.
  #
  # No `if: always()`. A manifest cut over a knowingly-partial release is a claim
  # about an incomplete set; `release-assets-check` already fails that release on
  # the missing target, and the recovery is unchanged — a workflow_dispatch re-run
  # rebuilds every asset and this manifest with them.
  checksums:
    name: checksums
    needs: [dist, schema]
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-11
    permissions:
      contents: write # upload the manifest to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          cache: false
      # `checksums` emits a sums= KEY=VALUE line, so the asset path is decided in
      # that one file and never re-derived in YAML.
      - name: Derive the manifest from the release's own assets
        id: checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: mise run checksums "$TAG" >>"$GITHUB_OUTPUT"
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          SUMS: ${{ steps.checksums.outputs.sums }}
        run: gh release upload "$TAG" "$SUMS" --clobber
