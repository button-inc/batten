name: fast-forward

# THE RUN CARRIES THE PR IT ANSWERS FOR (CLOUD-409, CLOUD-456). An
# `issue_comment` run attaches to the default-branch tip, so `head_branch` and
# `head_sha` name `main` for every one of these — there is no field on the run
# object that says which PR asked. `land` therefore had only the timestamp to
# filter on, and at the measured cadence (400 runs in 30 minutes, 243 of them
# refusals) its ~90s window was 243 strangers' refusals, any of which it would
# read as its own verdict. `run-name` surfaces as `display_title` on the run,
# which gives the filter an exact key.
#
# Both interpolations are integers from the event payload. NOT
# `github.event.comment.body`, which is attacker-controlled and is the template
# injection zizmor exists to refuse. The comment id is the stronger of the two on
# its own: it names THIS lap's request on THIS head, so it also subsumes the
# `SINCE` fence against an earlier lap of the same PR.
# QUOTED, and the quotes are load-bearing (CLOUD-507). YAML opens a comment at an
# unquoted ` #`, so the unquoted form of this line parsed to the bare string
# `fast-forward` and both interpolations were discarded before GitHub ever saw
# them — measured across 30 consecutive runs, every one reporting a
# `display_title` equal to the workflow name, for a day after the key landed.
# `ci-local-parity` now refuses the unquoted shape.
run-name: "fast-forward #${{ github.event.issue.number }} @${{ github.event.comment.id }}"

# GitHub's merge button cannot fast-forward: "Rebase and merge" rewrites every
# commit under a new SHA, and "Merge" adds a merge commit. Both discard the exact
# objects CI tested. This workflow lands a PR by *true* fast-forward instead —
# main is moved to the PR's existing head commit, unchanged — when a maintainer
# comments `/fast-forward` on the PR.
#
# It is safe under the branch ruleset: the push only succeeds if the PR head is a
# fast-forward of main (linear, no rewrite) AND that exact SHA already has the
# required checks green. Nothing weakens the gate; this is just the honest merge
# GitHub declines to offer.

on:
  issue_comment:
    types: [created]

# Keyed by ISSUE, not by `github.ref`, and that is the whole decision: an
# `issue_comment` run attaches to the default-branch tip, so every landing
# attempt in the repository shares one ref — a ref-keyed group would put them
# all in one bucket, and a PR's `/fast-forward` would cancel an unrelated PR's
# merge already in flight. Per-issue serialises the thing that actually races
# (two attempts to advance `main` from one PR) and leaves distinct PRs
# independent.
#
# `cancel-in-progress: false` for the same reason release-artifacts uses it: a
# half-completed fast-forward is worse than a slow one, and the attempt in
# flight is the one holding the landing lease.
concurrency:
  group: fast-forward-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fast-forward:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/fast-forward') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5 # budget: grandfathered measured=2026-08-10
    steps:
      # `# v1.0.0`, NOT `# v1`, and the difference is load-bearing rather than
      # pedantic (CLOUD-676). Upstream publishes exactly one tag — `v1.0.0` —
      # with no floating major, unlike `actions/checkout` and
      # `taiki-e/install-action` elsewhere in this tree. Renovate's `github-tags`
      # datasource reads the version from this comment, so `# v1` named nothing
      # it could resolve: "Could not determine new digest for update". The pin
      # was correct throughout; the comment was what made it INVISIBLE to the
      # update lane, permanently, on the one action that lands every PR here.
      - uses: sequoia-pgp/fast-forward@ea7628bedcb0b0b96e94383ada458d812fca4979 # v1.0.0
        with:
          merge: true
          # Push main with the PAT, not GITHUB_TOKEN: a push made with
          # GITHUB_TOKEN does not trigger other workflows, so release-plz (on:
          # push to main) would never run after a landing and no release would
          # ever be cut. The PAT is a real identity, so the push triggers it.
          # Falls back to GITHUB_TOKEN when the secret is absent (fast-forward
          # still lands; only the release trigger is lost).
          github_token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          # Comment back on the PR only when the fast-forward is not possible
          # (e.g. main moved and the branch needs updating first).
          comment: on-error
