name: zizmor

# Static analysis of the GitHub Actions workflows themselves: zizmor flags
# unpinned actions, over-broad `permissions`, dangerous triggers, and
# template-injection sinks. A policy/trust engine should hold its own CI to the
# standard it exists to enforce. Runs only when a workflow file changes, so it
# costs nothing on ordinary PRs.
#
# Dispatched through mise (`mise run zizmor`) so it is the exact task — and pinned
# zizmor version — an agent runs locally in `mise run verify`; the two cannot
# drift. Kept as its own job so it runs on a separate runner, in parallel with ci
# and cross.

on:
  pull_request:
    # CLOUD-503. WITHOUT THIS THE CHECK CAN NEVER BE SUPERSEDED. Omitting `types`
    # defaults to `[opened, synchronize, reopened]`, and the job below is
    # draft-gated — so a PR created as a draft mints a `skipped` run on `opened`
    # and then has no event left that could replace it. `land` readies before
    # pushing, and its push moves nothing whenever HEAD is already on the remote,
    # so `ready_for_review` is the only event left; `checks-green` correctly
    # refuses to read a skip as an answer, and the poll never terminates.
    # Measured as a deadlock across #382 and #385 simultaneously, both fully
    # green but for this name, with `main` frozen so neither could rebase out.
    # It costs no runner: the draft guard still skips every draft event.
    types: [opened, synchronize, reopened, ready_for_review]
    # `action.yml` too: `mise run zizmor` audits the shipped Action alongside the
    # workflows (CLOUD-68), and a filter that named only the workflows would let
    # a PR touching just the Action skip the audit that now covers it.
    paths: [".github/workflows/**", "action.yml"]

# Supersede, don't accumulate. Without this a push that rebases the branch left
# the previous SHA's run to completion for a verdict nobody would read — the
# same waste `ci.yml` already refuses, and the reason `land` can cancel a doomed
# run simply by pushing the next one.
concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # Restores locked installs, which `[settings] lockfile = false` turns off
  # along with the install-time write it exists to deny (CLOUD-223). A runner
  # should install locked, and its checkout is disposable, so a write here
  # costs nothing; the clone being protected is a developer's.
  MISE_LOCKFILE: "true"
  # What makes the `install_args` list below BINDING rather than decorative
  # (CLOUD-812). mise auto-installs a missing tool when a task runs or when
  # `mise exec` needs one, both default true — so with these on, a narrowed list
  # moves the cost into the work step instead of removing it. CLOUD-180 measured
  # exactly that in `ci.yml`'s `cross` job: rust installed in 13s, then serena's
  # 72 Python packages, node, zig and prettier rebuilt inside the work step,
  # "invisible in the step being optimised, because that step does get faster."
  # That fix stopped at `ci.yml`; this workflow was never in its scope.
  #
  # Off, a tool this job did not ask for is a hard "command not found" rather
  # than a silent re-download. `mise run ci-tools-check` is what keeps the pair
  # honest in both directions: the names resolve, and a PR workflow cannot run
  # `mise-action` with no list at all.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  zizmor:
    name: zizmor
    # Draft = still being verified locally; no CI. Every other PR-triggered job
    # carries this and this one did not, so a draft that touched a workflow
    # still spent a runner on every push — and re-drafting a red PR, the whole
    # point of which is to close the tap, left this workflow still running.
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # budget: grandfathered measured=2026-08-10
    permissions:
      contents: read
      # One call, one reason: cancelling THIS run when the landing
      # lease does not authorise this branch (CLOUD-420). Failing
      # instead would conclude the run `failure` rather than
      # `cancelled`, which reds `final` and re-drafts a healthy PR.
      actions: write
    steps:
      # CLOUD-420: THE LANDING LEASE, ENFORCED WHERE THE MONEY IS SPENT.
      # First step, before any checkout or toolchain install, because a run this
      # branch is not authorised to make should cost the rounding rather than a
      # matrix. The body is `mise-tasks/ci-lease-precondition` and every
      # justification lives there; it is fetched from `main` rather than from
      # this head, so a clone carrying stale rules cannot dodge the predicate by
      # carrying a stale copy of it. An unreadable body runs — fail open, which
      # is the whole posture: waving one matrix through costs one matrix, while
      # a predicate that cannot read itself would stop the fleet.
      - name: Landing lease precondition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEASE_HEAD_REF: ${{ github.head_ref }}
          # The HEAD sha, never `github.sha`: on a pull_request event that is the
          # merge commit, which carries trunk's `mise-tasks/land` whenever this
          # head did not touch it — and the staleness row reads exactly that file.
          LEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEASE_RUN_ID: ${{ github.run_id }}
        run: |
          body=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/mise-tasks/ci-lease-precondition?ref=main") || exit 0
          # `|| exit 0` on BOTH lines, and the second is the one that was missing
          # (CLOUD-420). A fetch that fails is handled; a fetch that SUCCEEDS with
          # something that is not shell was not — a truncated body, a proxy error
          # page returned 200, or a bad edit to the trunk copy makes this a syntax
          # error in the FIRST step of every job. The step reds under the runner's
          # default `bash -e {0}`, `final` fails its `needs:` assertion under
          # `always()`, and `land` re-drafts a healthy PR — fleet-wide, from one bad
          # response. The precondition's own header promises it never exits
          # non-zero; this is what makes that true at the call site too.
          bash -c "$body" || exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        with:
          # The analyzer, plus the `jq` its receipt check needs: the task body is
          # `step-receipt check zizmor` first, and `step-receipt` reads
          # `mise tasks info --json` through `jq` before it decides whether to run
          # `zizmor --offline` at all. Nothing else — this job compiles nothing.
          install_args: zizmor aqua:jqlang/jq
      - run: mise run zizmor
