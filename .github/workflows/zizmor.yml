name: zizmor

# Static analysis of the GitHub Actions workflows themselves: zizmor flags
# unpinned actions, over-broad `permissions`, and template-injection sinks. A
# policy/trust engine should hold its own CI to the standard it exists to enforce.
# Runs only when a workflow file changes, so it costs nothing on ordinary PRs.

on:
  pull_request:
    paths: [".github/workflows/**"]

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          min-severity: high
