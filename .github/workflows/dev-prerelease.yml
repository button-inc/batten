name: dev-prerelease
#MUTANT-SUITE crates/batten/tests/it/dist.rs
#MUTANT dev-prerelease-unnamespaced|s@^          tag="dev/v.*$@          tag="v${version}"@|a_dev_prerelease_is_published_under_the_dev_namespace
#MUTANT dev-prerelease-draft-unchecked|s@^              if \[ "$have" != "$want" \]; then$@              if false; then@|a_cancelled_runs_draft_is_published_not_stranded

# workflow-shell: CLOUD-2903 naming the archive by the build's own identity and
# publishing it are two bodies no verb owns yet; each reads `batten --version`
# off the binary it built, so no name is re-derived from the manifest.

# A DEV PRE-RELEASE OF EVERY PULL REQUEST'S HEAD (CLOUD-2903). A branch whose
# config only its own engine can read runs on a source pin, and
# `engine-pin-check` refuses a source pin at land; no release can read that
# config until one contains its engine. This publishes the head's engine as a
# pre-release whose tag is the build's identity, so the branch can pin it as a
# RELEASE (`engine = { release = "v<identity>" }`) and land.
#
# DRAFTS INCLUDED, ON PURPOSE: `land` readies a pull request only once its own
# `verify` passes, and `verify` runs `engine-pin-check`, so a pull request that
# needs a dev pre-release needs it while it is still a draft. The two x86_64
# Linux legs only — the hook engine's platforms (musl, and the gnu twin a musl
# engine prefers) — so a push costs two builds, never the release's seven.
#
# THE `dev/` TAG NAMESPACE: the tag is `dev/v<identity less its build
# metadata>` (`engine::forge_tag`), outside `v*`, so no release reader —
# `git::newest_version_tag`, the `release-tags` glob, the release guard's tag
# ruleset, release-plz's `git_only` baseline — ever reads one as a release.
# The release is created as a DRAFT and published as a non-latest PRE-RELEASE,
# the shape `release ship other` holds every publish to.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

# A CALLER'S `env:` DOES NOT REACH A CALLED WORKFLOW, and this one calls none;
# the binding is the same as `dist.yml`'s so each job installs its list only.
env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"

# One publication per pull request at a time: a newer push supersedes an older
# one's build, and each head's identity is its own tag, so nothing is lost.
concurrency:
  group: dev-prerelease-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: dev build (${{ matrix.target }})
    # A fork's head is never published: its token cannot write here, and its
    # code is not this repository's to ship.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 53 # budget: p95=1045s x3 measured=2026-11-24
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The HEAD, as `dist.yml`'s pull-request legs build it: the engine a
          # pull request publishes is its head's, never GitHub's merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # cache: false, as `dist.yml`: a published build must not restore a
      # shared cache.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        env:
          MISE_LOCKFILE: "true"
        with:
          version: 2026.9.1
          cache: false
          install_args: rust aqua:axodotdev/cargo-dist zig github:rust-cross/cargo-zigbuild github:rust-secure-code/cargo-auditable
      - name: Add the Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: mise run batten -- ci step --arg-env TARGET -- rustup target add
      # `GITHUB_REF` is `refs/pull/<N>/merge` on this event, so `build.rs`
      # stamps a `pr<N>` identity; the release marker is unset, so it is
      # never the release's.
      - name: Build and archive
        id: dist
        shell: bash
        env:
          DIST_BUILD_TOOL: cargo-dist
          DIST_TARGET: ${{ matrix.target }}
        run: mise run batten -- ci step --outputs --arg-env DIST_TARGET -- mise run dist --
      - name: Name the archive by the build's identity
        shell: bash
        env:
          ARCHIVE: ${{ steps.dist.outputs.archive }}
          BINARY: ${{ steps.dist.outputs.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          identity=$("$BINARY" --version)
          identity=${identity#batten }
          version=${identity%%+*}
          mkdir -p dev
          cp "$ARCHIVE" "dev/batten-v${version}-${TARGET}.tar.gz"
          printf '%s\n' "$identity" >"dev/identity-${TARGET}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-${{ matrix.target }}
          path: dev/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2 # budget: p95=21s x3 measured=2026-11-24
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dev-*
          path: dev
          merge-multiple: true
      - name: Publish the dev pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd dev
          # Every leg built the same commit under the same ref, so they agree;
          # a disagreement is two engines under one tag, and nothing ships.
          identity=$(sort -u identity-* | tr -d '\n')
          [ "$(sort -u identity-* | wc -l)" -eq 1 ]
          version=${identity%%+*}
          tag="dev/v${version}"
          sha256sum batten-v*.tar.gz >SHA256SUMS
          # One identity is one commit, so a release already under this tag is
          # this head's. PUBLISHED, it is done. A DRAFT is an earlier run that
          # `cancel-in-progress` stopped between create and publish: `gh release
          # create` uploads every asset before it returns, so a draft carrying
          # this run's asset names is complete and is published here, and a
          # cancelled run never strands the tag as a draft
          # `releases/download/dev/…` 404s on. One missing an asset is refused
          # by name, never overwritten (`release ship other`: no `--clobber`
          # outside the release guard).
          state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || echo absent)
          case "$state" in
            false)
              exit 0
              ;;
            true)
              have=$(gh release view "$tag" --json assets --jq '[.assets[].name] | sort | join(" ")')
              want=$(printf '%s\n' batten-v*.tar.gz SHA256SUMS | sort | paste -sd ' ')
              if [ "$have" != "$want" ]; then
                echo "::error:: the draft $tag is incomplete ($have); discard it with \`batten release discard --tag $tag\` and re-run" >&2
                exit 1
              fi
              ;;
            *)
              gh release create "$tag" --draft --prerelease --target "$SHA" \
                --title "batten v${identity} (dev)" \
                --notes "Pin: engine = { release = \"v${identity}\" }" \
                batten-v*.tar.gz SHA256SUMS
              ;;
          esac
          gh release edit "$tag" --draft=false --prerelease --latest=false
