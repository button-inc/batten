name: auto-bot-land

# Land the bot's pull requests with no human in the loop — the whole lane, from a
# draft nobody has looked at to a fast-forward on `main`.
#
# THAT CLAIM IS BOUNDED, AND THE BOUND IS STATED HERE RATHER THAN DISCOVERED ON A
# RED PR (CLOUD-1207). Two committed gates need a change to the REPOSITORY that no
# bump can carry: `sbom-check` maps each pinned action's licence by repo AND sha,
# so a `github-actions` bump orphans every row until a person runs `mise run sbom`
# and commits the table, and `mise-action-floor` reds a pin it denies. So the lane
# is unattended for `cargo` and `mise` bumps and attended for some
# `github-actions` ones. What this workflow owes in that case is not a landing —
# it cannot produce one — but a stop: the freeze arm below drafts the head, halts
# the rebases, and says once what failed and what to run. CLOUD-1213 carries
# whether that class should need a person at all.
#
# This file is `auto-dependabot-land.yml` repointed, not a second lander beside it
# (CLOUD-660). That workflow is deleted in the same commit, along with
# `.github/dependabot.yml`: Dependabot version updates moved to Renovate one
# ecosystem at a time (CLOUD-655/657/658), and its security lane is off at the
# repository setting — `GET /repos/button-inc/batten/automated-security-fixes`
# answered `{"enabled": false, "paused": false}` on 2026-08-19, with zero open
# alerts and `vulnerability-alerts` returning 204. So the bot it watched proposes
# nothing, and Renovate's `vulnerabilityAlerts` block now reads the same advisory
# stream. One bot, one lander; `ci-local-parity`'s property 15 refuses a tree
# where a live bot's branch prefix has no workflow scoped to it.
#
# WHY THIS IS MORE THAN THE SIBLING IT REPLACES. Dependabot's heads opened Ready,
# so "wait for green, then move the ref" was the whole lane. Renovate's open as
# drafts (`draftPR: true`, CLOUD-596's economy), and a draft grades no checks —
# every `ci.yml` job gates on `draft == false`. Nothing readied them and nothing
# rebased them, so #493 needed a human and #503 sat BEHIND `main` holding the
# single `prConcurrentLimit` slot against seven queued updates (CLOUD-692). The
# two extra states this carries — ready the fresh draft, nudge the stale one —
# are what that gap costs to close, and both are cheap because the draft is free.
#
# THE THREE COSTS THIS LANE PAYS, and they are the design rather than a summary:
#
#   a draft accumulating   zero. No job runs on it, however often Renovate
#                          force-pushes a rebase onto it.
#   one ready              one matrix, spent on the SHA that is about to land.
#   a rebase mid-matrix    one cancellation. `ci.yml`'s `cancel-in-progress`
#                          discards the superseded run; the next one grades a
#                          head that can actually fast-forward.
#
# THE GREEN PREDICATE IS `checks-green`, NOT A COPY OF IT (CLOUD-391). This job
# decided green with a hand-rolled `select(.conclusion != "skipped")`, which counts
# a wholly skipped set as zero outstanding — i.e. green — and #261 landed on
# precisely that set. The predicate has one home, `mise-tasks/checks-green.sh`, scoped
# to $CI_REQUIRED_CHECKS rather than to "every check-run on the SHA", so a third
# party's check gets neither a vote nor a veto. Dispatching it through `mise run`
# is why this job checks out and installs the toolchain at all.
#
# AND THE BOARD MOVES WITH THE WORK (CLOUD-693). A bot proposes with no issue and
# no session, so every lifecycle gate refuses it by construction and a merge moves
# nothing. `batten pr ensure` is the missing step: it derives an issue
# from the manifest diff, files it, and writes `Closes CLOUD-<n>` into the PR body
# so the merge moves the row like any other landing. It runs on every tick, before
# anything is readied, so the row exists while the PR is still a draft.
#
# THE REF IS MOVED THROUGH THE API, NOT BY A LOCAL PUSH, and that is a deliberate
# reading of "assert the fast-forward before pushing". `PATCH git/refs/heads/main`
# with `force=false` IS the assertion, made server-side and atomically with the
# update — a local `git merge-base --is-ancestor` can go stale between the check and
# the push, this cannot. It also means the head SHA is never fetched, checked out or
# executed here, which is what keeps the `dangerous-triggers` ignore below honest,
# and it needs no push credential persisted into the checkout.
#
# NOR DOES THIS WORKFLOW REBASE. It asks the bot to, by ticking the rebase checkbox
# in the PR body — Renovate's spelling of the `@dependabot rebase` comment the
# sibling posted. Doing the rebase here would mean checking out a bot-authored head
# under a write token, which is the one thing every lander in this repo is built to
# avoid; asking costs one API call and the bot owns its own branch.
#
# Token split: check status is read with the Actions GITHUB_TOKEN (which carries
# checks:read — a fine-grained PAT does not), but the ref update, the ready and the
# body edits are made with RELEASE_PLZ_TOKEN, a real identity. A ref moved by
# GITHUB_TOKEN triggers no further workflows, so release-plz (on: push to main)
# would never fire; a `ready_for_review` from it fires no workflow either, so CI
# would never run and the landing would wait forever on checks nothing creates.

on:
  # workflow_run runs privileged; zizmor flags it as dangerous because it is
  # usually paired with checking out and executing PR-controlled content. This
  # workflow does neither. It checks out a fixed ref — the default branch, never
  # the PR head — to get the predicates committed to trunk, and it reaches the
  # head SHA only as an opaque argument to API calls: nothing from that head is
  # fetched, written to disk, sourced or run. head_sha/head_branch are used only in
  # API queries and a startsWith filter, never interpolated into a run script, so
  # the injection/exfiltration this audit guards against cannot occur here.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, commit-lint]
    types: [completed]
    # The branch scope, at the trigger rather than only in the job's `if:`. A job
    # condition is evaluated after the run already exists, so without this every
    # CI and commit-lint completion in the repository created a run here that
    # immediately skipped: 1131 runs in 25 hours, 1131 of them skipped
    # (CLOUD-493). That costs no runner minutes, which is why it survived — but it
    # was 46% of all workflow runs, and at ~3100 inserted runs a day the global run
    # list shifts page boundaries mid-walk, so paginating it is not stable. The
    # `if:` below stays as defence in depth; the two answer different failure modes.
    branches: ["renovate/**"]
  # THE ONLY TRIGGER THAT CAN START THE LANE, and the reason this workflow has a
  # clock at all. A draft PR completes no workflow, so `workflow_run` never fires
  # for one — the `workflow_run` path above is the free ride that lands a head
  # already readied by an earlier tick. Everything before that (file the row, nudge
  # a stale head, ready a fresh one) has to be asked for.
  #
  # HOURLY, at :05, and the halving is a recorded decision (CLOUD-812). This was
  # `5,35` — 48 ticks/day — and `auto-release-land` ran `*/30` for another 48. The
  # arithmetic neither comment carried is that GitHub bills every job rounded UP
  # to the whole minute, so 96 idle ticks/day floor at ~2,900 billed min/month for
  # work that resolves nothing. This lane is `workflow_run`-driven first; the cron
  # is the backstop for when nothing pushes, and this comment already accepted the
  # latency trade in its own words — a bump landing an hour later is worth less
  # than a tighter poll's billed minutes. At hourly that bound is two hours in the
  # worst case, and the primary path is unaffected.
  #
  # :05 rather than :00: `auto-release-land` owns :00, and `ci-local-parity`'s
  # property 9 refuses two schedules sharing a literal cron expression.
  schedule:
    - cron: "5 * * * *"
  # AND THE LANE CAN BE ASKED, not only waited for. Measured on its first day:
  # the `:05` tick fired at 00:22, `:35` at 00:55, and `:05` again not by 01:24 —
  # GitHub schedules a cron on a best-effort queue and runs it 15-20 minutes late
  # under load, sometimes dropping one. That is fine for the lane's ordinary work,
  # where the cost of lateness is a bump landing an hour later, and useless for the
  # two cases that need an answer NOW: confirming a change to the lane actually
  # works, and draining the queue after a credential or a config is repaired.
  #
  # Without this, the only way to exercise the lane is to wait for a scheduler
  # nobody controls, which makes every fix to it unverifiable for up to an hour —
  # so a lander with no manual trigger is a lander that gets changed blind. It adds
  # no capability an operator does not already have (the trigger requires write
  # access, and the job does exactly what a tick does).
  workflow_dispatch:

permissions:
  contents: write
  checks: read
  pull-requests: write
  # The mirror issue the row is filed as (CLOUD-750). Added after the lane's first
  # credential-free run failed on BOTH the list and the create with `gh exit 1`:
  # the same two calls run clean from a clone, so the query was never the problem
  # and the token was. `RELEASE_PLZ_TOKEN` is fine-grained — the header below
  # already records that it cannot carry `checks:read` — and it carries no Issues
  # permission either. This grant is what the ambient token needs instead.
  issues: write

# One constant group, not a per-SHA key. A cron tick and a `workflow_run` tick can
# reach the same PR at the same moment, and a per-SHA group would let both ready it
# or both move the ref. `cancel-in-progress: false`: a tick that is already
# deciding should finish.
concurrency:
  group: auto-bot-land
  cancel-in-progress: false

env:
  # Restores locked installs, which `[settings] lockfile = false` turns off
  # along with the install-time write it exists to deny (CLOUD-223). A runner
  # should install locked, and its checkout is disposable, so a write here
  # costs nothing; the clone being protected is a developer's.
  MISE_LOCKFILE: "true"

jobs:
  fast-forward-bot-pr:
    # EVERY DECLARED TRIGGER IS ADMITTED HERE, and `workflow_dispatch` was not
    # when it was added — the workflow ran and the job skipped, so the manual
    # trigger existed and did nothing. A trigger a condition cannot admit is a
    # rule shipped without its mechanism; `ci-local-parity`'s property 16 now
    # refuses one, which is the half that keeps this from happening again.
    #
    # The scheduled and manual paths are the same work asked for two ways: one on
    # a clock, one by a person who needs the answer now. Only the `workflow_run`
    # arm carries conditions, because that trigger fires on runs this lane has no
    # interest in — a red CI, or a completion on a head it does not land.
    #
    # THE ORIGIN TEST IS NOT THE BRANCH NAME (CLOUD-867). `head_branch` is a
    # string the PR author chooses, so a prefix match admits anyone who names a
    # branch `renovate/…`. That was invisible while the repository was private —
    # only trusted actors could open a PR at all — and becomes remote code on
    # `main` the day CLOUD-585 flips it, because this job holds `contents: write`
    # and a PAT. `head_repository.full_name` is the half a fork cannot forge.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/'))
    runs-on: ubuntu-latest
    timeout-minutes: 3 # budget: p95=52s x3 measured=2026-08-19
    env:
      REPO: ${{ github.repository }}
      # The author half of the same test, applied in the resolve step below where
      # the PR object is in hand. Named here so both arms read one constant.
      BOT_LOGIN: renovate[bot]
      # The freeze `renovate.json5` declares as `stopUpdatingLabel` (CLOUD-1207).
      # The two must agree by string or the freeze is a label nothing reads, so
      # this is the one place either is spelled in a workflow.
      FREEZE_LABEL: renovate-frozen
    steps:
      # One resolution step for both triggers, so everything after it is written
      # once. `workflow_run` arrives holding the SHA and looks up its PR; the cron
      # arrives holding nothing and finds the open `renovate/*` PR, which is the
      # same object approached from the other end. A tick with no bot PR open stops
      # here, before the checkout, so an idle tick is a few seconds of runner and
      # nothing else.
      #
      # `prConcurrentLimit: 1` is what makes `.[0]` a complete answer rather than a
      # sample: the lane holds one open head at a time by construction, and if that
      # bound is ever raised the next tick simply takes the next one.
      - name: Resolve the bot PR and the SHA to judge
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # `workflow_dispatch` resolves like the cron does: neither arrives
          # holding a SHA, so both find the open head from the other end.
          # `$repo` and `$bot` below are jq variables bound by `--arg`, not shell
          # expansions, so the jq programs are single-quoted on purpose.
          # shellcheck disable=SC2016
          # BOTH ARMS FILTER ON ORIGIN AND AUTHOR, never on the branch name alone
          # (CLOUD-867). The cron arm never saw the `if:` origin test at all — it
          # arrives holding nothing and finds the head from the other end — so
          # for that arm this is the ONLY gate, not a second opinion on one.
          # Piped into a real `jq` rather than `gh --jq`, because the filter needs
          # `--arg` to carry the repository and bot names in as DATA. `gh --jq`
          # takes one expression string and no argument bindings, so the
          # alternative is interpolating a shell variable into the filter body —
          # which is how a value ends up parsed as jq syntax. `pipefail` is set
          # above, so a failing `gh` still fails the step.
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            pr=$(gh api "repos/$REPO/pulls?state=open&per_page=100" |
              jq -c --arg repo "$REPO" --arg bot "$BOT_LOGIN" \
              '[.[] | select(.head.repo.full_name == $repo)
                    | select(.user.login == $bot)
                    | select(.head.ref | startswith("renovate/"))] | .[0] // {}')
            [ -n "$(jq -r '.number // empty' <<<"$pr")" ] || echo "no open renovate PR; nothing to land"
          else
            pr=$(gh api "repos/$REPO/commits/$RUN_SHA/pulls" |
              jq -c --arg repo "$REPO" --arg bot "$BOT_LOGIN" \
              'map(select(.state == "open")
                 | select(.head.repo.full_name == $repo)
                 | select(.user.login == $bot)) | .[0] // {}')
            [ -n "$(jq -r '.number // empty' <<<"$pr")" ] || echo "no open PR for $RUN_SHA; skipping"
          fi
          num=$(jq -r '.number // empty' <<<"$pr")
          sha=$(jq -r '.head.sha // empty' <<<"$pr")
          draft=$(jq -r 'if .draft == true then "true" else "false" end' <<<"$pr")
          {
            echo "num=$num"
            echo "sha=$sha"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"
      # The default ref, never the PR head — the predicates must be the ones
      # committed to trunk, and no credential outlives the step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.target.outputs.num != ''
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        if: steps.target.outputs.num != ''
      # THE LANE NEEDS THE ENGINE NOW, AND NOTHING WAS PROVIDING IT (CLOUD-1143's
      # consequence). `checks-green` was retired onto the engine, so `mise.toml`'s
      # task body pipes the check-run list into `batten checks green`. This job is
      # a shallow checkout plus mise and nothing else, and `batten` is this
      # repository's own crate rather than a mise tool — so it was never on PATH
      # and the green step exited 2, "could not look", on every tick that reached
      # it. Measured: `bash: line 25: batten: command not found`, first at
      # 2026-08-30T17:11:11Z and unchanged at 2026-08-31T04:14:46Z, with the
      # release PR green and unlandable in between. This lane calls the same
      # task at its own green step, so bot PRs stopped landing for the same
      # reason and on the same tick.
      #
      # IT WAS INVISIBLE LOCALLY, which is why it landed. `session-start.sh` runs
      # `mise run install:local`, so an agent's own `land` -> `checks-green` call
      # resolves the binary and only the runner ever saw the gap.
      #
      # `install.sh` RATHER THAN A BUILD, because this lane's whole economy is
      # that a tick is seconds: the job carries a 5-minute budget, and
      # `mise run install:local` is a full release build of the workspace. The
      # committed script is POSIX sh, needs no toolchain, and verifies every asset
      # against the SHA-256 digest the release API reports — a mismatch is a
      # failure with no skip flag. Run from the checkout rather than piped from
      # the network, so `install-check` still governs what this executes.
      #
      # NO `$GITHUB_PATH` WRITE, AND THAT IS ZIZMOR'S FINDING RATHER THAN A STYLE
      # CHOICE. The first version installed to `$RUNNER_TEMP/bin` and appended it
      # to `$GITHUB_PATH`; `github-env` reds that at HIGH — "write to GITHUB_PATH
      # may allow code execution" — on both lanes. The value here was a runner
      # constant rather than anything an author controls, so the finding was a
      # false positive in substance, and suppressing it would still have been the
      # wrong repair: the destination `install.sh` already defaults to
      # (`$XDG_BIN_HOME`, else `$HOME/.local/bin`) is on PATH on `ubuntu-latest`,
      # so there is nothing to append and the audit has nothing to flag.
      #
      # `install.sh` ENFORCES THE INVARIANT ITSELF, which is what makes leaving
      # the destination implicit safe rather than lucky: it refuses to install to
      # a directory that is not on PATH, because a `batten` that does not resolve
      # by name is exactly the defect this step exists to fix. If a runner image
      # ever drops that directory, this step fails loudly and says so, rather than
      # installing somewhere the green step below cannot see.
      #
      # THE SEAM THIS OPENS, AND IT IS SHARPER THAN IT LOOKS. The lane judges with
      # the LATEST RELEASED `batten` while `verify` judges with the tree's, so a
      # change to `checks green`'s interface does not reach this lane until it
      # ships. That is not a rounding error: an earlier draft of this comment
      # called the skew "tolerable", and testing it disproved that before it
      # landed. Measured against `v0.0.134`, the newest release at the time:
      #
      #   error: unrecognized subcommand 'checks'
      #   tip: a similar subcommand exists: 'check'
      #
      # The verb ships in `v0.0.135`, which only this lane could cut, which needed
      # the verb — a deadlock broken once by landing that release PR by hand. So
      # the precondition is not "a release exists" but "a release carrying the
      # verb this task calls exists", and the failure mode when it does not is
      # exit 2 from the step below, which reads as could-not-look rather than as
      # a version floor. A future rename or signature change to `checks green`
      # reopens exactly this, and the tree's own suite will not catch it, because
      # the tree always has the new binary.
      #
      # Placed here rather than beside the green step so any later task that spawns
      # the engine is served too. It costs an idle tick nothing: the guard is the
      # one the checkout above already carries, so a tick that found no PR stops
      # before this.
      - name: Install the released batten, which `checks-green` now shells out to
        if: steps.target.outputs.num != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./install.sh
      # THE BOARD ROW, BEFORE ANYTHING IS SPENT (CLOUD-693). Idempotent and keyed
      # on the PR: a body already naming a tracker key is a no-op, so a tick that
      # runs every half hour files exactly one issue per PR. It is deliberately not
      # gated on the landing state — the row belongs on the board while the PR is
      # still a draft accumulating, which is the whole point of the board being the
      # observability surface.
      #
      # Exit 1 is "this PR is not one of ours" (its diff touches no manifest the
      # lane owns) and must not fail the run or block the landing: the issue is
      # what makes the merge move a row, not what makes the merge safe. Only exit
      # 2, "could not look", is a failure — GitHub refusing to answer is a defect
      # to see, not to route around.
      #
      # NO TRACKER CREDENTIAL REACHES THIS STEP, and that is the design rather
      # than an omission (CLOUD-750). The row is filed as a GitHub ISSUE with the
      # token this job already carries, and Linear's GitHub Issues sync mirrors it
      # into a `CLOUD-*` row — measured at ~2 seconds on #558 -> CLOUD-764. The
      # key comes back on a `linear-code[bot]` linkback comment, so the lane
      # learns its own row's name without ever authenticating to the tracker.
      #
      # THE AMBIENT TOKEN, NOT THE PAT, and the split is the same one this workflow
      # already makes for check status: each call gets the token that can actually
      # make it. The PAT exists here for the two writes that must fire further
      # workflows — a ready and a ref move — and it is fine-grained, so it carries
      # neither `checks:read` nor Issues. Filing an issue has to fire nothing, so
      # the ambient token with the `issues: write` grant above is both sufficient
      # and narrower.
      - name: File the issue this bump lands under, and link it
        if: steps.target.outputs.num != ''
        id: row
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.target.outputs.num }}
        run: |
          set +e
          batten pr ensure "$PR_NUM"
          verdict=$?
          # THE ENGINE'S EXIT TABLE, which is not the retired program's
          # (CLOUD-1295). `bot-issue` used 1 for "refused, not this lane's" and 2
          # for "could not look"; under house style section 7 a refusal is 2 and a
          # could-not-look is 3, with 1 reserved for a usage error. A pull request
          # this lane declines to file for is still an ordinary outcome and passes;
          # everything else fails the run.
          case "$verdict" in
            0 | 2) exit 0 ;;
            *) exit "$verdict" ;;
          esac
      # IS THIS HEAD LANDABLE AT ALL? `compare/main...SHA` answers in one read:
      # `ahead` means `main` is an ancestor and the fast-forward is available;
      # `identical` means it already landed; `behind` or `diverged` means the base
      # moved under it and nothing but a rebase will make it landable.
      #
      # Asked BEFORE the checks rather than after them, which is where this
      # departs from the sibling and why: Dependabot's heads were Ready, so their
      # checks existed and were worth reading first. A Renovate draft has no checks
      # at all, and readying a head that is already BEHIND would spend a matrix on
      # a SHA that cannot land whatever it grades.
      - name: Is this head a fast-forward of main?
        if: steps.target.outputs.num != ''
        id: linear
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq '.status // "unknown"')
          echo "compare main...$SHA is $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      # ASK THE BOT TO REBASE, rather than rebasing here. Renovate reads a ticked
      # `rebase-check` box in its own PR body as the instruction to rebase the
      # branch, which is the same shape as the `@dependabot rebase` comment this
      # workflow used to post. `rebaseWhen: "behind-base-branch"` already rebases
      # on its own schedule; this closes the gap between Mend's runs, which is what
      # decides whether a head is landable on THIS tick.
      #
      # An already-ticked box is left alone: re-writing the same body would be a
      # no-op edit per tick, and the box is unticked by Renovate itself when it
      # acts. `identical` is excluded because that SHA is already on `main`.
      - name: Ask the bot to rebase a head that can no longer land
        if: >-
          steps.target.outputs.num != '' &&
          steps.linear.outputs.status != 'ahead' &&
          steps.linear.outputs.status != 'identical'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target.outputs.num }}
        run: |
          set -euo pipefail
          body=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.body // ""')
          if grep -qF '[x] <!-- rebase-check -->' <<<"$body"; then
            echo "#$PR_NUM already carries a ticked rebase box; waiting for the bot"
            exit 0
          fi
          if ! grep -qF '[ ] <!-- rebase-check -->' <<<"$body"; then
            echo "#$PR_NUM has no rebase checkbox; the scheduled rebase is the remaining path"
            exit 0
          fi
          printf '%s' "${body//\[ \] <!-- rebase-check -->/[x] <!-- rebase-check -->}" > "$RUNNER_TEMP/pr-body"
          gh api -X PATCH "repos/$REPO/pulls/$PR_NUM" -F body=@"$RUNNER_TEMP/pr-body" >/dev/null
          echo "ticked the rebase box on #$PR_NUM"
      # A STALE HEAD THAT IS READY GOES BACK TO DRAFT. Every push the rebase makes
      # would otherwise be a `synchronize` on a Ready PR — a matrix per rebase, on
      # a head that was not landable when it was readied. This is `land`'s own
      # re-draft on a red run, for the same reason: CI skips drafts, so drafting is
      # the only thing that closes the tap while the head is being repaired.
      - name: Re-draft a stale head so its rebase buys no matrix
        if: >-
          steps.target.outputs.num != '' &&
          steps.target.outputs.draft == 'false' &&
          steps.linear.outputs.status != 'ahead' &&
          steps.linear.outputs.status != 'identical'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target.outputs.num }}
        run: gh pr ready "$PR_NUM" --repo "$REPO" --undo
      # The same predicate `ci-wait` blocks on, asked once: at least one required
      # check graded, none skipped, none pending, each name judged by its latest
      # run. Exit 3 "no answer yet" and exit 1 "red" are both ordinary here and must
      # not fail the run — the matrix this tick just started has graded nothing yet,
      # and a red head waits for its next push. Only exit 2, "could not look", is a
      # failure. Read with GITHUB_TOKEN: it carries checks:read and the PAT does not.
      #
      # ASKED BEFORE THE READY, AND OF A DRAFT TOO (CLOUD-1207). It ran after it,
      # and only for a Ready head, which left this tick's own question — is this
      # draft worth readying at all — unasked. A draft's required checks are
      # skipped or absent, so `checks-green` answers exit 3 for a fresh head, and
      # that reading is what keeps the ready arm below the default rather than a
      # new gate on the lane.
      #
      # AND THE THREE VERDICTS ARE THREE OUTPUTS, where exit 1 and exit 3 were one
      # `green=false`. Collapsing them made a head that FAILED indistinguishable
      # from one nothing has graded yet, and the two want opposite treatment:
      # `pending` waits, `red` stops the lane. Neither fails this run.
      - name: What is the verdict on the head SHA?
        if: >-
          steps.target.outputs.num != '' &&
          steps.linear.outputs.status == 'ahead'
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          # `set +e` on purpose: the default shell is `bash -e`, under which a
          # non-green verdict would abort the step before its exit code could be
          # read as a verdict at all.
          set +e
          mise run checks-green
          verdict=$?
          case "$verdict" in
            0) echo "verdict=green" >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=red" >> "$GITHUB_OUTPUT" ;;
            3) echo "verdict=pending" >> "$GITHUB_OUTPUT" ;;
            *) exit "$verdict" ;;
          esac
      # A RED HEAD IS DRAFTED **AND FROZEN**, AND THE SECOND HALF IS THE ONE THAT
      # TERMINATES (CLOUD-1207). Drafting alone does not, and reasoning that it
      # does is the trap this comment exists to disarm: it stops CI on THIS sha,
      # then `rebaseWhen: "behind-base-branch"` mints a new one on the next `main`
      # advance, that head is a draft nothing has graded, and the ready arm below
      # correctly readies it — one full matrix per `main` advance, exactly the bill
      # the lane was already paying. A verdict keyed to a sha cannot bound a loop
      # whose every lap mints a fresh sha.
      #
      # So the freeze is what stops the REBASES, and it is keyed to the pull
      # request instead: Renovate leaves a head carrying `stopUpdatingLabel` alone,
      # so no new sha is minted and no matrix is spent, until a person takes the
      # label off. `renovate.json5` declares that label and carries the economy
      # this reverses.
      #
      # MEASURED, AND THIS IS WHY IT IS A FREEZE RATHER THAN A RETRY BUDGET. #676
      # was red on `commit-lint` (a claim no bump can make, fixed in the same
      # change as this) and on `sbom-check`, whose licence table only a human
      # regenerates (CLOUD-1213). Neither is transient, and 372 workflow runs in
      # seven days is what "wait for the next push" costs when the next push
      # cannot help. Such a head needs a person; the lane's job is to stop paying
      # while it waits for one, and to say so exactly once.
      #
      # THE LABEL IS ALSO THE ONCE, guarding the comment rather than a marker of
      # its own: a tick that finds it set does nothing at all. Pointer-only per
      # non-negotiable rule 4 — the failing check NAMES, never their output.
      - name: Draft and freeze a red head, and say once why
        if: >-
          steps.target.outputs.num != '' &&
          steps.checks.outputs.verdict == 'red'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target.outputs.num }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR_NUM" --repo "$REPO" --json labels --jq '.labels[].name')
          if grep -qxF "$FREEZE_LABEL" <<<"$labels"; then
            echo "#$PR_NUM is already frozen; this tick spends nothing"
            exit 0
          fi
          # `--force` is idempotent creation: the label need not already exist in
          # the repository, and a second run neither fails nor rewrites anything.
          gh label create "$FREEZE_LABEL" --repo "$REPO" --force \
            --color B60205 \
            --description "Red on a check no bump can fix; Renovate is not rebasing it" >/dev/null
          gh pr ready "$PR_NUM" --repo "$REPO" --undo
          gh pr edit "$PR_NUM" --repo "$REPO" --add-label "$FREEZE_LABEL" >/dev/null
          failing=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.conclusion == "failure") | .name] | unique | join(", ")')
          {
            echo "This head is red on: ${failing:-a required check}."
            echo
            echo "The lane has returned it to draft and added \`$FREEZE_LABEL\`, so"
            echo "Renovate will stop rebasing it and this pull request stops spending"
            echo "CI minutes it cannot convert into a landing. Nothing here retries on"
            echo "its own: a dependency bump cannot fix a check that needs a change to"
            echo "the repository."
            echo
            echo "To resume, land the fix on \`main\` and remove the label. The next"
            echo "rebase mints a fresh head, the lane readies it once, and it lands if"
            echo "it is green."
          } > "$RUNNER_TEMP/freeze-comment.md"
          gh pr comment "$PR_NUM" --repo "$REPO" --body-file "$RUNNER_TEMP/freeze-comment.md" >/dev/null
          echo "drafted and froze #$PR_NUM"
      # THE ONE EVENT THAT STARTS CI, and it starts it on the SHA that is about to
      # land. Readying with the PAT, not GITHUB_TOKEN: a `ready_for_review` from
      # the Actions token fires no workflow, so CI would never run and the landing
      # would wait forever on checks nothing creates.
      #
      # `verdict != 'red'` is the narrower of the two guards rather than the
      # load-bearing one: it stops THIS tick from re-readying the very head the
      # step above just drafted, which would make the freeze an hourly
      # oscillation. What stops the next head arriving at all is the freeze.
      - name: Ready a landable draft so CI runs on the SHA that will land
        if: >-
          steps.target.outputs.num != '' &&
          steps.target.outputs.draft == 'true' &&
          steps.linear.outputs.status == 'ahead' &&
          steps.checks.outputs.verdict != 'red'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target.outputs.num }}
        run: gh pr ready "$PR_NUM" --repo "$REPO"
      # `force=false` is the fast-forward assertion: the API refuses the update
      # unless `main` is an ancestor of this SHA, and branch protection independently
      # refuses it unless `final` is green on it. So the two things that must hold are
      # both enforced by the server, atomically with the write. The compare above is
      # not a second opinion on that — it is what routes a stale head to a rebase
      # rather than to a refusal nothing acts on.
      #
      # A REFUSAL IS AN ORDINARY OUTCOME, NOT A RED RUN. `main` moving between the
      # compare and this update is the landing loop working, not a fault — the next
      # tick reads the new answer and asks for the rebase. Retrying in-job would only
      # race the same window again, so it logs and stops.
      # DOES THE BODY STILL CLOSE THE ROW? Asked here, one step before the ref
      # moves, because the answer expires: Renovate rewrites its own PR body on
      # every rebase and the `Closes CLOUD-<n>` the row step appended goes with it
      # (CLOUD-768, measured on #503). The row step running first makes the window
      # small; it does not close it, and a landing inside it is silent — `main`
      # advances, the bump ships, and the row never leaves Backlog.
      #
      # Exit 2 "closes nothing" is an ORDINARY outcome, like the `main`-moved
      # refusal below: the next tick re-runs `ensure`, the key comes back, and it
      # lands then. Only exit 3, "could not look", fails the run.
      - name: Does the body still close its row?
        if: steps.checks.outputs.verdict == 'green'
        id: closes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.target.outputs.num }}
        run: |
          set +e
          batten pr closes "$PR_NUM"
          verdict=$?
          # The engine's table, as one step up: 2 is the refusal and 3 is the
          # could-not-look that must fail the run rather than read as "closes
          # nothing" and hold a landable head forever.
          case "$verdict" in
            0) echo "linked=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "linked=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$verdict" ;;
          esac
      - name: Fast-forward main to the tested SHA
        if: steps.closes.outputs.linked == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target.outputs.num }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -uo pipefail
          err=$(mktemp)
          if gh api -X PATCH "repos/$REPO/git/refs/heads/main" \
            -f sha="$SHA" -F force=false >/dev/null 2>"$err"; then
            echo "landed #$PR_NUM: main is now $SHA"
          else
            echo "could not fast-forward main to $SHA for #$PR_NUM: $(tr '\n' ' ' <"$err")"
            echo "main moved, or the ruleset refused this SHA; #$PR_NUM waits for the next tick"
          fi
          rm -f "$err"
