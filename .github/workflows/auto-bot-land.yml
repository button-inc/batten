name: auto-bot-land

# Land the bot's pull requests with no human in the loop — the whole lane, from a
# draft nobody has looked at to a fast-forward on `main`.
#
# This file is `auto-dependabot-land.yml` repointed, not a second lander beside it
# (CLOUD-660). That workflow is deleted in the same commit, along with
# `.github/dependabot.yml`: Dependabot version updates moved to Renovate one
# ecosystem at a time (CLOUD-655/657/658), and its security lane is off at the
# repository setting — `GET /repos/button-inc/batten/automated-security-fixes`
# answered `{"enabled": false, "paused": false}` on 2026-08-19, with zero open
# alerts and `vulnerability-alerts` returning 204. So the bot it watched proposes
# nothing, and Renovate's `vulnerabilityAlerts` block now reads the same advisory
# stream. One bot, one lander; `ci-local-parity`'s property 15 refuses a tree
# where a live bot's branch prefix has no workflow scoped to it.
#
# WHY THIS IS MORE THAN THE SIBLING IT REPLACES. Dependabot's heads opened Ready,
# so "wait for green, then move the ref" was the whole lane. Renovate's open as
# drafts (`draftPR: true`, CLOUD-596's economy), and a draft grades no checks —
# every `ci.yml` job gates on `draft == false`. Nothing readied them and nothing
# rebased them, so #493 needed a human and #503 sat BEHIND `main` holding the
# single `prConcurrentLimit` slot against seven queued updates (CLOUD-692). The
# two extra states this carries — ready the fresh draft, nudge the stale one —
# are what that gap costs to close, and both are cheap because the draft is free.
#
# THE THREE COSTS THIS LANE PAYS, and they are the design rather than a summary:
#
#   a draft accumulating   zero. No job runs on it, however often Renovate
#                          force-pushes a rebase onto it.
#   one ready              one matrix, spent on the SHA that is about to land.
#   a rebase mid-matrix    one cancellation. `ci.yml`'s `cancel-in-progress`
#                          discards the superseded run; the next one grades a
#                          head that can actually fast-forward.
#
# THE GREEN PREDICATE IS `checks-green`, NOT A COPY OF IT (CLOUD-391). This job
# decided green with a hand-rolled `select(.conclusion != "skipped")`, which counts
# a wholly skipped set as zero outstanding — i.e. green — and #261 landed on
# precisely that set. The predicate has one home, `mise-tasks/checks-green`, scoped
# to $CI_REQUIRED_CHECKS rather than to "every check-run on the SHA", so a third
# party's check gets neither a vote nor a veto. Dispatching it through `mise run`
# is why this job checks out and installs the toolchain at all.
#
# AND THE BOARD MOVES WITH THE WORK (CLOUD-693). A bot proposes with no issue and
# no session, so every lifecycle gate refuses it by construction and a merge moves
# nothing. `mise run bot-issue ensure` is the missing step: it derives an issue
# from the manifest diff, files it, and writes `Closes CLOUD-<n>` into the PR body
# so the merge moves the row like any other landing. It runs on every tick, before
# anything is readied, so the row exists while the PR is still a draft.
#
# THE REF IS MOVED THROUGH THE API, NOT BY A LOCAL PUSH, and that is a deliberate
# reading of "assert the fast-forward before pushing". `PATCH git/refs/heads/main`
# with `force=false` IS the assertion, made server-side and atomically with the
# update — a local `git merge-base --is-ancestor` can go stale between the check and
# the push, this cannot. It also means the head SHA is never fetched, checked out or
# executed here, which is what keeps the `dangerous-triggers` ignore below honest,
# and it needs no push credential persisted into the checkout.
#
# NOR DOES THIS WORKFLOW REBASE. It asks the bot to, by ticking the rebase checkbox
# in the PR body — Renovate's spelling of the `@dependabot rebase` comment the
# sibling posted. Doing the rebase here would mean checking out a bot-authored head
# under a write token, which is the one thing every lander in this repo is built to
# avoid; asking costs one API call and the bot owns its own branch.
#
# Token split: check status is read with the Actions GITHUB_TOKEN (which carries
# checks:read — a fine-grained PAT does not), but the ref update, the ready and the
# body edits are made with RELEASE_PLZ_TOKEN, a real identity. A ref moved by
# GITHUB_TOKEN triggers no further workflows, so release-plz (on: push to main)
# would never fire; a `ready_for_review` from it fires no workflow either, so CI
# would never run and the landing would wait forever on checks nothing creates.

on:
  # workflow_run runs privileged; zizmor flags it as dangerous because it is
  # usually paired with checking out and executing PR-controlled content. This
  # workflow does neither. It checks out a fixed ref — the default branch, never
  # the PR head — to get the predicates committed to trunk, and it reaches the
  # head SHA only as an opaque argument to API calls: nothing from that head is
  # fetched, written to disk, sourced or run. head_sha/head_branch are used only in
  # API queries and a startsWith filter, never interpolated into a run script, so
  # the injection/exfiltration this audit guards against cannot occur here.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, commit-lint]
    types: [completed]
    # The branch scope, at the trigger rather than only in the job's `if:`. A job
    # condition is evaluated after the run already exists, so without this every
    # CI and commit-lint completion in the repository created a run here that
    # immediately skipped: 1131 runs in 25 hours, 1131 of them skipped
    # (CLOUD-493). That costs no runner minutes, which is why it survived — but it
    # was 46% of all workflow runs, and at ~3100 inserted runs a day the global run
    # list shifts page boundaries mid-walk, so paginating it is not stable. The
    # `if:` below stays as defence in depth; the two answer different failure modes.
    branches: ["renovate/**"]
  # THE ONLY TRIGGER THAT CAN START THE LANE, and the reason this workflow has a
  # clock at all. A draft PR completes no workflow, so `workflow_run` never fires
  # for one — the `workflow_run` path above is the free ride that lands a head
  # already readied by an earlier tick. Everything before that (file the row, nudge
  # a stale head, ready a fresh one) has to be asked for.
  #
  # :05 and :35 rather than `*/30`: `auto-release-land` owns :00 and :30, and
  # `ci-local-parity`'s property 9 refuses two schedules on the same minute. The
  # cadence is coarse on purpose — a tick that finds a draft costs a checkout, an
  # install and a few reads, and the latency it buys (a bump lands within an hour
  # of becoming landable) is worth less than a tighter poll's billed minutes.
  schedule:
    - cron: "5,35 * * * *"
  # AND THE LANE CAN BE ASKED, not only waited for. Measured on its first day:
  # the `:05` tick fired at 00:22, `:35` at 00:55, and `:05` again not by 01:24 —
  # GitHub schedules a cron on a best-effort queue and runs it 15-20 minutes late
  # under load, sometimes dropping one. That is fine for the lane's ordinary work,
  # where the cost of lateness is a bump landing an hour later, and useless for the
  # two cases that need an answer NOW: confirming a change to the lane actually
  # works, and draining the queue after a credential or a config is repaired.
  #
  # Without this, the only way to exercise the lane is to wait for a scheduler
  # nobody controls, which makes every fix to it unverifiable for up to an hour —
  # so a lander with no manual trigger is a lander that gets changed blind. It adds
  # no capability an operator does not already have (the trigger requires write
  # access, and the job does exactly what a tick does).
  workflow_dispatch:

permissions:
  contents: write
  checks: read
  pull-requests: write

# One constant group, not a per-SHA key. A cron tick and a `workflow_run` tick can
# reach the same PR at the same moment, and a per-SHA group would let both ready it
# or both move the ref. `cancel-in-progress: false`: a tick that is already
# deciding should finish.
concurrency:
  group: auto-bot-land
  cancel-in-progress: false

env:
  # Restores locked installs, which `[settings] lockfile = false` turns off
  # along with the install-time write it exists to deny (CLOUD-223). A runner
  # should install locked, and its checkout is disposable, so a write here
  # costs nothing; the clone being protected is a developer's.
  MISE_LOCKFILE: "true"

jobs:
  fast-forward-bot-pr:
    if: >-
      github.event_name == 'schedule' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/'))
    runs-on: ubuntu-latest
    timeout-minutes: 3 # budget: p95=52s x3 measured=2026-08-19
    env:
      REPO: ${{ github.repository }}
    steps:
      # One resolution step for both triggers, so everything after it is written
      # once. `workflow_run` arrives holding the SHA and looks up its PR; the cron
      # arrives holding nothing and finds the open `renovate/*` PR, which is the
      # same object approached from the other end. A tick with no bot PR open stops
      # here, before the checkout, so an idle tick is a few seconds of runner and
      # nothing else.
      #
      # `prConcurrentLimit: 1` is what makes `.[0]` a complete answer rather than a
      # sample: the lane holds one open head at a time by construction, and if that
      # bound is ever raised the next tick simply takes the next one.
      - name: Resolve the bot PR and the SHA to judge
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            pr=$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
              --jq '[.[] | select(.head.ref | startswith("renovate/"))] | .[0] // {}')
            [ -n "$(jq -r '.number // empty' <<<"$pr")" ] || echo "no open renovate PR; nothing to land"
          else
            pr=$(gh api "repos/$REPO/commits/$RUN_SHA/pulls" \
              --jq 'map(select(.state == "open")) | .[0] // {}')
            [ -n "$(jq -r '.number // empty' <<<"$pr")" ] || echo "no open PR for $RUN_SHA; skipping"
          fi
          num=$(jq -r '.number // empty' <<<"$pr")
          sha=$(jq -r '.head.sha // empty' <<<"$pr")
          draft=$(jq -r 'if .draft == true then "true" else "false" end' <<<"$pr")
          {
            echo "num=$num"
            echo "sha=$sha"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"
      # The default ref, never the PR head — the predicates must be the ones
      # committed to trunk, and no credential outlives the step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.target.outputs.num != ''
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        if: steps.target.outputs.num != ''
      # THE BOARD ROW, BEFORE ANYTHING IS SPENT (CLOUD-693). Idempotent and keyed
      # on the PR: a body already naming a tracker key is a no-op, so a tick that
      # runs every half hour files exactly one issue per PR. It is deliberately not
      # gated on the landing state — the row belongs on the board while the PR is
      # still a draft accumulating, which is the whole point of the board being the
      # observability surface.
      #
      # Exit 1 is "this PR is not one of ours" (its diff touches no manifest the
      # lane owns) and must not fail the run or block the landing: the issue is
      # what makes the merge move a row, not what makes the merge safe. Only exit
      # 2, "could not look", is a failure — a credential that cannot reach the
      # tracker is a defect to see, not to route around.
      - name: File the issue this bump lands under, and link it
        if: steps.target.outputs.num != ''
        id: row
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}
          PR_NUM: ${{ steps.target.outputs.num }}
        run: |
          set +e
          mise run bot-issue ensure "$PR_NUM"
          verdict=$?
          case "$verdict" in
            0 | 1) exit 0 ;;
            *) exit "$verdict" ;;
          esac
      # IS THIS HEAD LANDABLE AT ALL? `compare/main...SHA` answers in one read:
      # `ahead` means `main` is an ancestor and the fast-forward is available;
      # `identical` means it already landed; `behind` or `diverged` means the base
      # moved under it and nothing but a rebase will make it landable.
      #
      # Asked BEFORE the checks rather than after them, which is where this
      # departs from the sibling and why: Dependabot's heads were Ready, so their
      # checks existed and were worth reading first. A Renovate draft has no checks
      # at all, and readying a head that is already BEHIND would spend a matrix on
      # a SHA that cannot land whatever it grades.
      - name: Is this head a fast-forward of main?
        if: steps.target.outputs.num != ''
        id: linear
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq '.status // "unknown"')
          echo "compare main...$SHA is $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      # ASK THE BOT TO REBASE, rather than rebasing here. Renovate reads a ticked
      # `rebase-check` box in its own PR body as the instruction to rebase the
      # branch, which is the same shape as the `@dependabot rebase` comment this
      # workflow used to post. `rebaseWhen: "behind-base-branch"` already rebases
      # on its own schedule; this closes the gap between Mend's runs, which is what
      # decides whether a head is landable on THIS tick.
      #
      # An already-ticked box is left alone: re-writing the same body would be a
      # no-op edit per tick, and the box is unticked by Renovate itself when it
      # acts. `identical` is excluded because that SHA is already on `main`.
      - name: Ask the bot to rebase a head that can no longer land
        if: >-
          steps.target.outputs.num != '' &&
          steps.linear.outputs.status != 'ahead' &&
          steps.linear.outputs.status != 'identical'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target.outputs.num }}
        run: |
          set -euo pipefail
          body=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.body // ""')
          if grep -qF '[x] <!-- rebase-check -->' <<<"$body"; then
            echo "#$PR_NUM already carries a ticked rebase box; waiting for the bot"
            exit 0
          fi
          if ! grep -qF '[ ] <!-- rebase-check -->' <<<"$body"; then
            echo "#$PR_NUM has no rebase checkbox; the scheduled rebase is the remaining path"
            exit 0
          fi
          printf '%s' "${body//\[ \] <!-- rebase-check -->/[x] <!-- rebase-check -->}" > "$RUNNER_TEMP/pr-body"
          gh api -X PATCH "repos/$REPO/pulls/$PR_NUM" -F body=@"$RUNNER_TEMP/pr-body" >/dev/null
          echo "ticked the rebase box on #$PR_NUM"
      # A STALE HEAD THAT IS READY GOES BACK TO DRAFT. Every push the rebase makes
      # would otherwise be a `synchronize` on a Ready PR — a matrix per rebase, on
      # a head that was not landable when it was readied. This is `land`'s own
      # re-draft on a red run, for the same reason: CI skips drafts, so drafting is
      # the only thing that closes the tap while the head is being repaired.
      - name: Re-draft a stale head so its rebase buys no matrix
        if: >-
          steps.target.outputs.num != '' &&
          steps.target.outputs.draft == 'false' &&
          steps.linear.outputs.status != 'ahead' &&
          steps.linear.outputs.status != 'identical'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target.outputs.num }}
        run: gh pr ready "$PR_NUM" --repo "$REPO" --undo
      # THE ONE EVENT THAT STARTS CI, and it starts it on the SHA that is about to
      # land. Readying with the PAT, not GITHUB_TOKEN: a `ready_for_review` from
      # the Actions token fires no workflow, so CI would never run and the landing
      # would wait forever on checks nothing creates.
      - name: Ready a landable draft so CI runs on the SHA that will land
        if: >-
          steps.target.outputs.num != '' &&
          steps.target.outputs.draft == 'true' &&
          steps.linear.outputs.status == 'ahead'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target.outputs.num }}
        run: gh pr ready "$PR_NUM" --repo "$REPO"
      # The same predicate `ci-wait` blocks on, asked once: at least one required
      # check graded, none skipped, none pending, each name judged by its latest
      # run. Exit 3 "no answer yet" and exit 1 "red" are both ordinary here and must
      # not fail the run — the matrix this tick just started has graded nothing yet,
      # and a red head waits for its next push. Only exit 2, "could not look", is a
      # failure. Read with GITHUB_TOKEN: it carries checks:read and the PAT does not.
      - name: Is every required check green on the head SHA?
        if: >-
          steps.target.outputs.num != '' &&
          steps.target.outputs.draft == 'false' &&
          steps.linear.outputs.status == 'ahead'
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          # `set +e` on purpose: the default shell is `bash -e`, under which a
          # non-green verdict would abort the step before its exit code could be
          # read as a verdict at all.
          set +e
          mise run checks-green
          verdict=$?
          case "$verdict" in
            0) echo "green=true" >> "$GITHUB_OUTPUT" ;;
            1 | 3) echo "green=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$verdict" ;;
          esac
      # `force=false` is the fast-forward assertion: the API refuses the update
      # unless `main` is an ancestor of this SHA, and branch protection independently
      # refuses it unless `final` is green on it. So the two things that must hold are
      # both enforced by the server, atomically with the write. The compare above is
      # not a second opinion on that — it is what routes a stale head to a rebase
      # rather than to a refusal nothing acts on.
      #
      # A REFUSAL IS AN ORDINARY OUTCOME, NOT A RED RUN. `main` moving between the
      # compare and this update is the landing loop working, not a fault — the next
      # tick reads the new answer and asks for the rebase. Retrying in-job would only
      # race the same window again, so it logs and stops.
      - name: Fast-forward main to the tested SHA
        if: steps.checks.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target.outputs.num }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -uo pipefail
          err=$(mktemp)
          if gh api -X PATCH "repos/$REPO/git/refs/heads/main" \
            -f sha="$SHA" -F force=false >/dev/null 2>"$err"; then
            echo "landed #$PR_NUM: main is now $SHA"
          else
            echo "could not fast-forward main to $SHA for #$PR_NUM: $(tr '\n' ' ' <"$err")"
            echo "main moved, or the ruleset refused this SHA; #$PR_NUM waits for the next tick"
          fi
          rm -f "$err"
