name: release-guard
# workflow-shell: CLOUD-2033 a new workflow of five steps (post `release-path`,
# read the settings, resolve, verify and mark the pinned release), each one
# `batten` verb or one `gh` call.

# G4 (CLOUD-2033): the server gate the release path rests on, measured rather
# than assumed, hourly.
#
# `settings` reads the rulesets and release settings and names every item still
# owed; `release_guard::owed` is the list, and its module doc says why no
# `release-path` ruleset is on it.
#
# `pinned` verifies the release the trunk's pin names with G1 in published mode
# and re-marks it latest when `land`'s step (f) did not.
#
# A read either job cannot make is exit 3, which is red, never green. The hourly
# run catches a release changed or deleted with no push.
#
# THE ENGINE IS THE TREE'S. The verbs these jobs call ship in the tree before
# they ship in a release, so `mise run batten --` builds them from the trunk's
# own source rather than installing the pinned release.

# NO `push` TRIGGER (CLOUD-2319). Both jobs ask about the world — the release
# the pin names, the repository's settings — not about a commit, and AGENTS.md
# forbids a verdict job on push to the trunk. The hourly run answers both.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-guard
  cancel-in-progress: false

env:
  # Each job installs its own list and nothing else (CLOUD-2553), as in
  # `release-artifacts.yml`.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  # Restores locked installs, which `[settings] lockfile = false` turns off
  # along with the install-time write it exists to deny (CLOUD-223).
  MISE_LOCKFILE: "true"

jobs:
  settings:
    name: settings
    runs-on: ubuntu-latest
    timeout-minutes: 30 # budget: p95=600s x3 measured=2026-10-12
    permissions:
      contents: read
      statuses: write # the one-time seeding post of release-path on the trunk's head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          version: 2026.9.1
          install_args: rust
      # THE SEEDING POST, G4's single permitted posting of `release-path`. The
      # trunk's pin is inherited from itself, so the verdict on its head is
      # success.
      - name: Grade the trunk's head with the predicate and post release-path
        env:
          BATTEN_GITHUB_TOKEN: ${{ github.token }}
        run: mise run batten -- ci step --arg-env GITHUB_SHA -- mise run batten -- release path --post
      # Administration: read is what `bypass_actors` and `immutable-releases`
      # need, which the job token never carries.
      - name: Is every server-side item in place?
        env:
          BATTEN_GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: mise run batten -- release settings

  pinned:
    name: pinned
    runs-on: ubuntu-latest
    timeout-minutes: 30 # budget: p95=600s x3 measured=2026-10-12
    permissions:
      contents: write # re-mark the pinned release latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          version: 2026.9.1
          install_args: rust aqua:cli/cli
      - name: Resolve the trunk's pin
        id: pin
        run: mise run batten -- ci step --capture pin -- mise run batten -- release pin
      - name: Verify the pinned release in published mode
        env:
          BATTEN_GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PIN: ${{ steps.pin.outputs.pin }}
        run: mise run batten -- ci step --arg-env PIN -- mise run batten -- release verify
      # Re-applied every run: `land`'s step (f) is the first writer, and a run
      # that died between (e) and (f) leaves the pinned release not latest.
      - name: Mark the pinned release latest
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ steps.pin.outputs.pin }}
        run: mise run batten -- ci step --arg-env PIN -- gh release edit --prerelease=false --latest
