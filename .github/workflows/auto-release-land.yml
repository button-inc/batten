name: auto-release-land

# Land release-plz's version-bump PR with no human in the loop. release-plz opens
# a `release-plz-*` PR (version + CHANGELOG bump); once its CI is green this posts
# `/fast-forward` on that PR so the existing fast-forward workflow lands it — a
# true fast-forward, the PR's exact tested SHA preserved, under the same
# green-and-linear gate a maintainer's manual comment uses. The push to main then
# triggers release-plz's `release` job (tag + GitHub release).
#
# Triggered by `workflow_run` on the PR-gating workflows completing — NOT
# `check_suite`, which GitHub does not fire for its own Actions-created suites.
# Both gating workflows are listed so whichever finishes last re-checks and lands;
# the step below re-verifies that *every* check on the SHA is green, so an
# early-finishing workflow can't land ahead of a still-running one. Scoped to
# `release-plz-*` branches, so ordinary PRs still land on an explicit human
# `/fast-forward`.
#
# AND IT NO LONGER LANDS ON SIGHT (CLOUD-319). Green was the only condition, so
# every crate-touching commit shipped its own tag — 57 of them, most one or two
# commits apart, each paying a `fast-forward` run, a `release-plz` run and a
# seven-leg `release-artifacts` matrix. `mise run release-due` is the debounce:
# land once `main` has been quiet for 30 minutes, or once the last release is 24h
# old, whichever comes first. Holding is not a failure — the release PR stays open
# and release-plz keeps accumulating into it, so a hold costs nothing and the
# eventual tag covers the whole batch. Its header carries the reasoning.
#
# AND THE DEBOUNCE NOW DECIDES BEFORE THE MINUTES ARE SPENT (CLOUD-346). It was
# the last gate here, behind the green check — so by the time it said "hold", the
# CI for that refresh was already paid for. It was throttling the TAG and nothing
# about CI: release-plz rewrites the release branch on every push to `main`, and
# a non-draft PR turns each rewrite into a full matrix (measured: 5 of 30 `ci.yml`
# runs in one 37-minute window, four discarded by the next refresh). The PR is now
# opened as a draft (`pr_draft` in release-plz.toml), CI skips drafts by the guard
# it already had, and this job readies the PR only once `release-due` says a
# release is due — so exactly one matrix is spent, on the SHA that lands.
#
# QUIET IS THE ABSENCE OF EVENTS, so something has to ask: the `schedule` trigger
# below is that asker, and the only reason this workflow has a clock at all. It is
# deliberately coarse — one tick per half hour, a job that shallow-checks-out,
# reads two endpoints and stops — because the lag it buys (a release goes out
# 30–60 minutes after `main` settles) is worth less than the runner minutes a
# tighter poll would spend. The `workflow_run` path is the free ride: it fires on
# an event already paid for, and lands immediately whenever the max-wait has
# already elapsed.
#
# AND IT LANDS ITSELF RATHER THAN ASKING (CLOUD-391). This used to post
# `/fast-forward`, which scheduled fast-forward.yml on `issue_comment` — a second
# webhook hop and a second runner acquisition (~35–75s) to reach a push this job
# could make itself. That hop is load-bearing for a HUMAN lap, where the comment is
# a person with write access typing a string on one PR at one moment and
# fast-forward.yml's `author_association` gate is what reads that intent. There is
# no human intent on this path. fast-forward.yml is untouched and remains the human
# route; `mise run land` still comments.
#
# THE REF IS MOVED THROUGH THE API, NOT BY A LOCAL PUSH, and that is a deliberate
# reading of "assert the fast-forward before pushing". `PATCH git/refs/heads/main`
# with `force=false` IS the assertion, made server-side and atomically with the
# update — a local `git merge-base --is-ancestor` can go stale between the check and
# the push, this cannot. It also needs no push credential persisted into the
# checkout, which is what lets the checkout below stay `persist-credentials: false`.
#
# Token split: check status is read with the Actions GITHUB_TOKEN (which carries
# checks:read — a fine-grained PAT does not), but the ref update is made with
# RELEASE_PLZ_TOKEN, a real identity: a ref moved by GITHUB_TOKEN triggers no
# further workflows, so release-plz's own `release` job (on: push to main) would
# never fire and no tag would be cut. Readying the PR uses it for the sibling
# reason, stated at the four-state table below.

on:
  # zizmor flags workflow_run as dangerous because it runs privileged and is
  # usually paired with checking out and executing PR-controlled content. This
  # workflow checks out the repo at a fixed ref — `main`, never the PR head — to
  # get the `release-due` task, and runs no PR content; the head SHA reaches it
  # only as an opaque argument to API calls, never as objects fetched or executed.
  # head_sha/head_branch are used only in API queries and a startsWith filter,
  # never interpolated into a run script, so the injection/exfiltration this audit
  # guards against cannot occur here.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, commit-lint]
    types: [completed]
    # Scoped at the trigger, not only in the job's `if:` — a job condition is
    # evaluated after the run exists, so this arm created a run on every CI and
    # commit-lint completion in the repository and skipped 1098 of 1172. The
    # `schedule:` arm below is deliberately untouched: it is the debounce's
    # trailing edge and has no head branch to filter on, which is why the job's
    # `if:` still has to admit `github.event_name == 'schedule'` separately.
    branches: ["release-plz-**"]
  # The debounce's trailing edge. Nothing fires when `main` goes quiet, so this
  # asks. HOURLY, and the halving from `*/30` is a recorded decision (CLOUD-812):
  # the same reasoning this comment already made against a tighter cron runs the
  # other way too. GitHub bills every job rounded UP to the whole minute, so the
  # 48 ticks/day here plus 48 in `auto-bot-land` floored at ~2,900 billed
  # min/month between releases, when the ordinary case is no release PR open at
  # all and the tick stops at the resolve step. `workflow_run` remains the primary
  # path; what lengthens is only the tail on an already-batched release.
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  checks: read
  pull-requests: write

# One constant group, not the per-SHA key this used to carry. With two triggers a
# cron tick and a `workflow_run` tick can now reach the same release PR at the
# same moment, and a per-SHA group would let both post `/fast-forward`. Still
# `cancel-in-progress: false`: a tick that is already deciding should finish.
concurrency:
  group: auto-release-land
  cancel-in-progress: false

env:
  # Restores locked installs, which `[settings] lockfile = false` turns off
  # along with the install-time write it exists to deny (CLOUD-223). A runner
  # should install locked, and its checkout is disposable, so a write here
  # costs nothing; the clone being protected is a developer's.
  MISE_LOCKFILE: "true"

jobs:
  fast-forward-release-pr:
    if: >-
      github.event_name == 'schedule' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'release-plz-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5 # budget: grandfathered measured=2026-08-10
    env:
      REPO: ${{ github.repository }}
    steps:
      # One resolution step for both triggers, so everything after it is written
      # once. `workflow_run` arrives holding the SHA and looks up its PR; the cron
      # arrives holding nothing and finds the open `release-plz-*` PR, which is
      # the same object approached from the other end. A cron tick with no release
      # PR open — the ordinary case between releases — stops here, before the
      # checkout, so an idle tick is a few seconds of runner and nothing else.
      - name: Resolve the release PR and the SHA to judge
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            pr=$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
              --jq '[.[] | select(.head.ref | startswith("release-plz-"))] | .[0] // {}')
            [ -n "$(jq -r '.number // empty' <<<"$pr")" ] || echo "no open release-plz PR; nothing to land"
          else
            pr=$(gh api "repos/$REPO/commits/$RUN_SHA/pulls" \
              --jq 'map(select(.state == "open")) | .[0] // {}')
            [ -n "$(jq -r '.number // empty' <<<"$pr")" ] || echo "no open PR for $RUN_SHA; skipping"
          fi
          num=$(jq -r '.number // empty' <<<"$pr")
          sha=$(jq -r '.head.sha // empty' <<<"$pr")
          # The draft flag is read from the PR itself rather than inferred from
          # the event: it is what the whole debounce now turns on, and the two
          # triggers reach the same PR from opposite ends.
          draft=$(jq -r 'if .draft == true then "true" else "false" end' <<<"$pr")
          {
            echo "num=$num"
            echo "sha=$sha"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"
      # `main`, not the PR head — the default ref for both of this workflow's
      # triggers. The debounce must be the one committed to trunk, never a copy a
      # release branch could carry, and no credential outlives the step.
      #
      # This used to sit behind the green check, which is what made the debounce
      # decide too late to save anything (CLOUD-346). It now runs on any tick that
      # found a release PR — a checkout and a mise install, a few tens of seconds,
      # against the full matrix that ordering was costing on every push to `main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.target.outputs.num != ''
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9dda3952d607125725deac9ec10a5f0e245d266b # v4.2.4+9dda395 retry fix, pre-release (CLOUD-404)
        if: steps.target.outputs.num != ''
      # THE DEBOUNCE, AND NOW THE FIRST GATE RATHER THAN THE LAST. Exit 1 is a
      # hold, which is the ordinary outcome and must not fail the run — only exit
      # 2, "could not look", is allowed to. Dispatched through mise so CI runs the
      # exact task an agent runs locally, per the workflow contract; the reasoning
      # lives in the task's header, not here.
      - name: Is the release due, or is it still being debounced?
        if: steps.target.outputs.num != ''
        id: debounce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `set +e` on purpose: the default shell is `bash -e`, under which a
          # hold would abort the step before its exit code could be read as a
          # verdict at all.
          set +e
          mise run release-due
          verdict=$?
          case "$verdict" in
            0) echo "due=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "due=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$verdict" ;;
          esac
      # The four states this job can be in, and there is nothing else to decide:
      #
      #   draft + hold  nothing. The cheap tick, and the ordinary one — the PR
      #                 keeps accumulating and no CI is spent on it at all.
      #   draft + due   ready it. That is the one event that starts CI, and it
      #                 starts it on the SHA that is about to land.
      #   ready + hold  re-draft it. `main` moved after the ready, so the window
      #                 reopened; leaving it ready would buy a matrix on every
      #                 further refresh, which is the whole defect (CLOUD-346).
      #   ready + due   judge the checks, and land if they are green.
      #
      # Readying with the PAT, not GITHUB_TOKEN: a `ready_for_review` from the
      # Actions token fires no workflow, so CI would never run and the landing
      # would wait forever on checks nothing creates.
      - name: Ready the release PR so CI runs on the SHA that will land
        if: steps.debounce.outputs.due == 'true' && steps.target.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target.outputs.num }}
        run: gh pr ready "$PR_NUM" --repo "$REPO"
      - name: Re-draft the release PR while the debounce is holding
        if: steps.debounce.outputs.due == 'false' && steps.target.outputs.draft == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target.outputs.num }}
        run: gh pr ready "$PR_NUM" --repo "$REPO" --undo
      # The same predicate `ci-wait` blocks on, asked once: at least one required
      # check graded, none skipped, none pending. The inline jq this replaces
      # filtered `skipped` out before counting, so a wholly skipped set — every
      # draft-era refresh, now the normal state — read as zero outstanding, i.e.
      # green (CLOUD-327's false green, second author). Exit 3 "no answer yet" and
      # exit 1 "red" are both ordinary here and must not fail the run; only exit 2
      # is. Read with GITHUB_TOKEN — it carries checks:read; the release PAT does
      # not.
      - name: Is every required check green on the head SHA?
        if: steps.debounce.outputs.due == 'true' && steps.target.outputs.draft == 'false'
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set +e
          mise run checks-green
          verdict=$?
          case "$verdict" in
            0) echo "green=true" >> "$GITHUB_OUTPUT" ;;
            1 | 3) echo "green=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$verdict" ;;
          esac
      # `force=false` is the fast-forward assertion: the API refuses the update
      # unless `main` is an ancestor of this SHA, and branch protection independently
      # refuses it unless `final` is green on it. Both things that must hold are
      # enforced by the server, atomically with the write.
      #
      # A REFUSAL IS AN ORDINARY OUTCOME, NOT A RED RUN. `main` moving between the
      # green read and this update is the landing loop working, not a fault —
      # release-plz rewrites the branch on the next push and the debounce readies it
      # again. Retrying in-job would only race the same window, so it logs and stops.
      - name: Fast-forward main to the tested SHA
        if: steps.checks.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.target.outputs.num }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -uo pipefail
          err=$(mktemp)
          if gh api -X PATCH "repos/$REPO/git/refs/heads/main" \
            -f sha="$SHA" -F force=false >/dev/null 2>"$err"; then
            echo "landed #$PR_NUM: main is now $SHA"
          else
            echo "could not fast-forward main to $SHA for #$PR_NUM: $(tr '\n' ' ' <"$err")"
            echo "main moved, or the ruleset refused this SHA; #$PR_NUM waits for its next refresh"
          fi
          rm -f "$err"
