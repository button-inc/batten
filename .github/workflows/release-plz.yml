name: release-plz

# Automatic semver from Conventional Commits, via release-plz
# (https://release-plz.dev), installed and pinned by mise like every other tool.
# On each push to main it publishes any pending release (tag + GitHub release for
# a changed version) and refreshes the "release" PR that bumps the version and
# CHANGELOG.md from the commits since the last release (feat -> minor,
# fix -> patch, `!`/BREAKING CHANGE -> major).
#
# NOTE: PRs opened with the default GITHUB_TOKEN do not trigger other workflows,
# so required checks would never run on the release PR. Add a repo secret
# RELEASE_PLZ_TOKEN (fine-grained PAT or GitHub App token, contents:write +
# pull-requests:write) so the release PR triggers CI and can satisfy the ruleset.

on:
  push:
    branches: [main]
  # Manual re-run for recovery (e.g. re-open/refresh a stuck release PR). The
  # release/release-pr tasks are idempotent, so a dispatch is safe to repeat.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-plz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - run: mise run release
      - run: mise run release-pr
