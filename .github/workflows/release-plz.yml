name: release-plz
#MUTANT-SUITE crates/batten/tests/it/release_settings_gate.rs
#MUTANT settings-gate-maps-usage|s@--on 2=false -- mise run batten -- release settings@--on 1=false -- mise run batten -- release settings@|the_release_settings_gate_maps_its_violation_exit

# workflow-shell: CLOUD-2063 the step count rises by the seven single-command
# steps that move the engine pin onto the release PR; each is plain argv, and
# none carries a shell body.

# Automatic semver from Conventional Commits, via release-plz
# (https://release-plz.dev), installed and pinned by mise like every other tool.
# On each push to main it publishes any pending release (tag + GitHub release for
# a changed version) and refreshes the "release" PR that bumps the version and
# CHANGELOG.md from the commits since the last release (feat -> minor,
# fix -> patch, `!`/BREAKING CHANGE -> major).
#
# NOTE: PRs opened with the default GITHUB_TOKEN do not trigger other workflows,
# so required checks would never run on the release PR. Add a repo secret
# RELEASE_PLZ_TOKEN (fine-grained PAT or GitHub App token, contents:write +
# pull-requests:write) so the release PR triggers CI and can satisfy the ruleset.
#
# TWO CREDENTIALS, TWO ISSUES, AND THEY ARE NOT THE SAME ONE.
#
#   RELEASE_PLZ_TOKEN is the GitHub credential above, currently a fine-grained
#   PAT under a personal account with an expiry — bus-factor 1 on release-critical
#   CI. Its replacement is an ORG-OWNED GITHUB APP minting an installation token
#   at run time (CLOUD-94), which needs an App installed on the org plus APP_ID /
#   APP_PRIVATE_KEY secrets. Nothing in this file changes until those exist.
#
#   A CARGO REGISTRY credential is the other one, and this repository has none:
#   `release-plz.toml` sets `publish = false`, so `mise run release` never
#   contacts a registry (CLOUD-205 keeps the crate unpublished). `id-token: write`
#   is deliberately NOT declared here — a permission no step uses is a finding for
#   zizmor's excessive-permissions audit, not a security posture.
#
# crates.io OIDC trusted publishing solves the SECOND and does nothing for the
# first; do not close CLOUD-94 on the strength of it. `mise run
# publish-credential-check` (in the hk gate) is what holds the line: it refuses a
# registry token in any workflow, and refuses `publish = true` unless the job
# carries `id-token: write` in the same commit. Turning publishing on is
# therefore a change that cannot skip OIDC.

on:
  push:
    branches: [main]
  # Manual re-run for recovery (e.g. re-open/refresh a stuck release PR). The
  # release/release-pr tasks are idempotent, so a dispatch is safe to repeat.
  workflow_dispatch:

# Declared PER JOB rather than here, since CLOUD-840 added a second one. With a
# single job a workflow-level grant was the job's grant and the distinction was
# academic; with two, `contents: write` and `pull-requests: write` would also be
# handed to a job that compiles into a cache and pushes nothing. zizmor's
# `excessive-permissions` audit is what caught it, on the workflow-level block
# rather than on the new job — the grant is where the defect is.
permissions: {}

concurrency:
  group: release-plz
  cancel-in-progress: false

env:
  # WHAT MAKES THE CACHE-WARM JOB'S `install_args` BIND, and it is worth 163
  # seconds (CLOUD-840). mise auto-installs a missing tool when a task runs or
  # when `mise exec` needs one, both default true — so every `cargo`/`rustc`
  # call through mise's shims can enter the install/verify path. `rust-cache`
  # makes several of those composing its key, before it emits a single line.
  #
  # Measured on the second warm cycle, from the step's own log: the step ran
  # 15:52:07 -> 15:54:58, and "Cache Configuration" did not print until
  # 15:54:50. The cache work inside that is 2.7s of download for 182MB and 3.6s
  # of extract — about 8 seconds. The other 163 are pre-flight. `rust.yml`'s
  # `windows` job restores the same entry in 12s, and the only difference
  # between them is these two lines.
  #
  # CLOUD-812 set them in `ci.yml`, `commit-lint.yml` and `zizmor.yml` and
  # correctly stopped there: this workflow had no job that ran cargo. Adding one
  # without them is what re-opened it. `ci-tools-check` cannot catch that — its
  # absence direction is scoped to `pull_request` workflows, and this one is
  # push-triggered.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  # Restores locked installs, which `[settings] lockfile = false` turns off
  # along with the install-time write it exists to deny (CLOUD-223). A runner
  # should install locked, and its checkout is disposable, so a write here
  # costs nothing; the clone being protected is a developer's.
  MISE_LOCKFILE: "true"

jobs:
  # THE BASE-BRANCH CACHE, AND WHY IT IS PARKED IN THE RELEASE WORKFLOW
  # (CLOUD-840). Measured 2026-08-21: the `windows` job restores its rust-cache
  # in 7s — a miss — compiles cold for ~8m20s, then spends 70s writing 182MB
  # that nothing will ever read. The key is stable and identical across pull
  # requests; it just lives on `refs/pull/N/merge` every time, and GitHub scopes
  # a cache read to the run's own ref plus the BASE branch. No pull request can
  # read another's, and `rust.yml` triggers on `pull_request` only, so none has
  # ever existed on `main` to inherit.
  #
  # This job is here rather than in a workflow of its own because AGENTS.md
  # forbids adding a push-to-`main` trigger, and `release-plz.yml` already has
  # one. That rule exists so CI does not re-run on a SHA it already judged; this
  # job judges nothing — it compiles to fill a cache — so it is not the thing the
  # rule forbids. CLOUD-176 identified the same attachment point.
  #
  # `continue-on-error` because a warm job must never be able to red the release
  # lane. Neither `workflow_run` consumer watches this workflow (both key off
  # `[CI, commit-lint]`), so the blast radius is already small; this makes it
  # zero.
  #
  # `--no-run` builds every test binary and executes none. The artifacts are what
  # the cache is for, and running the suite here would be a second verdict on a
  # SHA `main` already carries — which IS what the trigger rule forbids.
  #
  # WHETHER THIS PAYS WAS THE POINT OF LANDING IT, AND THE NUMBERS ARE IN.
  # Within-PR caching already covers runs 2..N (CLOUD-176), so warming only ever
  # helps run 1, and merges roughly equal pull requests. Measured 2026-08-21 on
  # the `windows` job's own runs: the one cache MISS (run 32496183419, restore
  # 6s) spent 681s in `cargo nextest run --workspace`, against a 419s mean over
  # twelve cache hits. So an avoided miss is worth ~262s of wall clock, ~8.7
  # billed minutes at 2x, on the longest job in the matrix.
  #
  # The cost side was 6.4 billed minutes on EVERY merge, which lost. The guard on
  # the compile step below is what fixes that, and its evidence is recorded
  # there: the cache key moves only when the toolchain or the dependency set
  # does, so almost every cycle was paying a full compile to write nothing.
  # THE LINUX HALF, AND WHY IT COMES SECOND (CLOUD-840). `windows` was warmed
  # first because it was 50.6% of the bill at a 2x multiplier. The `ci` job is
  # the next-largest item and had the identical pathology, unnoticed for a day:
  # measured 2026-08-21, its entries were SIX copies of one key
  # `v0-rust-ci-Linux-x64-a263e760-97231082`, every one on a `refs/pull/N/merge`
  # ref and none on `refs/heads/main`, so every pull request restored in 1s — a
  # miss — and compiled cold. A miss run spent 1021s in `mise run ci` against
  # 741s for the one hit in the last four.
  #
  # `ubuntu-latest`, so this bills at 1x rather than 2x: roughly a minute per
  # merge against ~4.7 billed minutes saved on a first run that would otherwise
  # miss. CLOUD-176 costed the Linux legs as net-negative and was right about
  # the job it costed — a warm job that compiles cold every time. The guard on
  # the compile step is what changes that, exactly as it did for `windows`.
  #
  # `cargo nextest run --no-run --workspace` and not `mise run ci`: this job
  # fills a cache and judges nothing. Running the gate here would be a second
  # verdict on a SHA `main` already carries, which is what the trigger rule in
  # AGENTS.md actually forbids.
  cache-warm-linux:
    name: cache-warm-linux
    # ARM64, AND THIS IS THE JOB THAT MAKES THE OTHERS' MOVE SAFE (CLOUD-1416).
    # `runnerOS-runnerArch` lands at `config.ts:93`, INSIDE the prefix assigned to
    # `restoreKey` at `:133`, so the `ci-` family's readers and its one writer are
    # a single set: move any of them alone and the readers restore nothing. The
    # readers are `ci` (ci.yml) and `commit-lint` (commit-lint.yml),
    # all now `ubuntu-24.04-arm`.
    #
    # `cache-warm-windows` below is a DIFFERENT family and stays where it is.
    runs-on: ubuntu-24.04-arm
    # No measured p95 exists for a job that has never run. Written
    # `grandfathered` deliberately rather than guessing a number this file would
    # then present as measured; CLOUD-352 owns replacing it once the runs exist.
    timeout-minutes: 30 # budget: grandfathered measured=2026-08-21
    # A warm job must never be able to red the release lane. Neither
    # `workflow_run` consumer watches this workflow, so the blast radius is
    # already small; this makes it zero.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # Pinned to `batten.toml`'s `[[provision]]` version (CLOUD-1672). The
          # digest above pins the ACTION; this pins the MISE it installs, which
          # is a separate resolution the digest does not reach.
          version: 2026.9.1
          # Exactly what the `ci` job needs to compile the workspace, minus the
          # tools only its assertions use: the cache being filled is a cargo
          # target dir.
          install_args: rust github:nextest-rs/nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Read by the compile step below; `ci-local-parity` property 17 holds the
        # `id` and the guard together.
        id: rust-cache
        with:
          # Must match `ci.yml`'s job exactly or this writes an entry that job
          # cannot read. One spelling now, not two: `key` is an if/else
          # fallback rust-cache ignores whenever `shared-key` is set, so the
          # pair could drift while looking deliberate.
          shared-key: ci-
      # Compile only when there is nothing to restore. The evidence and the
      # failure directions are recorded on the Windows job below; the same
      # reasoning applies unchanged, and the same property refuses an unguarded
      # version of this step.
      - run: mise exec -- cargo nextest run --no-run --workspace
        if: steps.rust-cache.outputs.cache-hit != 'true'

  # THE X64 HALF OF THE `ci-` FAMILY (CLOUD-1477).
  #
  # WHY ONE `shared-key` NEEDS TWO WRITERS. `runnerOS-runnerArch` lands at
  # rust-cache's `config.ts:93`, INSIDE the prefix assigned to `restoreKey` at
  # `:133`, so `ci-` on arm64 and `ci-` on x64 are two entries that cannot
  # contend, cannot overwrite one another, and cannot hand a reader the other's
  # tree. `cache-warm-linux` above writes the arm64 one, read by `ci` (ci.yml)
  # and `commit-lint` (commit-lint.yml). THIS writes the x64 one, and
  # `batten-check` is its only reader — the one job of the family that cannot
  # move to arm64, because `batten enforce` carries `no-secrets` and no
  # ripsecrets release has ever published a linux-aarch64 artifact. CLOUD-1431
  # closed that row by GATING the release-target/provision-platform pairing, not
  # by finding an arm64 scanner, so the constraint stands.
  #
  # THE TRADE THIS RE-PRICES, because `ci.yml` declined it on a premise that has
  # since been falsified. A second writer doubles this family's entries, and that
  # was refused against a store measured at 10.72 GiB over a 10 GiB ceiling.
  # `cache-sweep.yml` (CLOUD-1453, released v0.0.142) took the store to 3.16 GiB
  # by evicting entries belonging to merged pull requests, so the ceiling the
  # refusal rested on is no longer the binding constraint. What eviction did NOT
  # buy was a hit: measured on jobs 100903936005 and 101280975479,
  # `batten-check` went 683s to 600s under the swept store — 12%, which is
  # eviction pressure lifting rather than a restore landing. A cold build is
  # still a cold build, and this job is what removes it.
  #
  # `ubuntu-latest` MUST MATCH `batten-check`'s LABEL ARCHITECTURE rather than
  # merely being "some x64 runner": `ci-cache-declared`'s
  # `read-family-has-a-warm-writer` compares the two by the arch their labels
  # resolve to, so moving either without the other is now a finding rather than a
  # silent cold build.
  cache-warm-linux-x64:
    name: cache-warm-linux-x64
    runs-on: ubuntu-latest
    # Grandfathered for `cache-warm-linux`'s reason: no measured p95 exists for a
    # job that has never run, and a guessed number would read as measured.
    # CLOUD-352 owns replacing it once the runs exist.
    timeout-minutes: 30 # budget: grandfathered measured=2026-09-08
    # A warm job must never be able to red the release lane, exactly as above.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # Pinned to `batten.toml`'s `[[provision]]` version (CLOUD-1672). The
          # digest above pins the ACTION; this pins the MISE it installs, which
          # is a separate resolution the digest does not reach.
          version: 2026.9.1
          # The same list `cache-warm-linux` installs, and for its reason rather
          # than by copying: what this fills is a cargo target dir, and
          # `batten-check` reaches it through the same workspace build.
          install_args: rust github:nextest-rs/nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Read by the compile step below; `ci-local-parity` property 17 holds the
        # `id` and the guard together.
        id: rust-cache
        with:
          # Must match `ci.yml`'s `batten-check` job exactly or this writes an
          # entry that job cannot read.
          shared-key: ci-
      # Compile only when there is nothing to restore. The evidence and the
      # failure directions are recorded on the Windows job below; the same
      # reasoning applies unchanged, and the same property refuses an unguarded
      # version of this step.
      - run: mise exec -- cargo nextest run --no-run --workspace
        if: steps.rust-cache.outputs.cache-hit != 'true'

  # THE TWO ORPHANED FAMILIES ON THE PULL-REQUEST PATH (CLOUD-1477's siblings).
  #
  # `ci-` has had warm writers since CLOUD-1416/1477 and `windows-` since the job
  # below. `cross-` and `semver-` had none, and both are REQUIRED checks — so every
  # pull request cold-built them AND uploaded a multi-hundred-MB entry scoped to
  # `refs/pull/N/merge` that no other pull request can read. That write is the
  # store pressure `cache-sweep.yml` exists to reclaim rather than a saving:
  # CLOUD-1453 measured 10.77 GiB against a 10 GiB ceiling with 81% of it four
  # already-merged PRs. Their readers now carry `save-if: false`, so these two jobs
  # are what makes the families readable at all.
  #
  # ONE JOB PER FAMILY, NOT A SHARED ENTRY, and `rust.yml`'s matrix block already
  # records why: a second leg restoring a shared entry thrashes it. `cross` builds
  # a windows-gnu target and `semver` a base-revision closure; neither is the `ci-`
  # host artifact set, so pointing them at `ci-` would trade a cold build for a
  # thrashed one.
  #
  # x64 FOR THE READERS' REASON, NOT BY DEFAULT. rust-cache puts
  # `runnerOS-runnerArch` inside the restore prefix (`config.ts:93`, before `:133`),
  # so a writer on another arch writes an entry its reader cannot see — the exact
  # trap CLOUD-1416 sprang on `batten-check`. Both readers are `ubuntu-latest`
  # (`rust.yml:75`, `:319`); these must move only with them.
  cache-warm-cross:
    name: cache-warm-cross
    runs-on: ubuntu-latest
    # Grandfathered for `cache-warm-linux`'s reason: no measured p95 exists for a
    # job that has never run, and a guessed number would read as measured.
    timeout-minutes: 30 # budget: grandfathered measured=2026-09-09
    # A warm job must never be able to red the release lane, exactly as above.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # Pinned to `batten.toml`'s `[[provision]]` version (CLOUD-1672). The
          # digest above pins the ACTION; this pins the MISE it installs, which
          # is a separate resolution the digest does not reach.
          version: 2026.9.1
          # What the `cross` job installs, for its stated reason: cross-check is
          # `rustup target add` + `cargo check`, and rust is the only tool it
          # touches.
          install_args: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Read by the compile step below; `ci-local-parity` property 17 holds the
        # `id` and the guard together.
        id: rust-cache
        with:
          # Must match `rust.yml`'s `cross` job exactly or this writes an entry
          # that job cannot read.
          shared-key: cross-
      # Compile only when there is nothing to restore, as every warm job here
      # does. `DOCTOR_TARGETS` must match the reader's or this fills a different
      # target's artifacts.
      - run: mise run cross-check
        if: steps.rust-cache.outputs.cache-hit != 'true'
        env:
          DOCTOR_TARGETS: x86_64-pc-windows-gnu

  # The `musl-` family's one writer, for `cache-warm-cross`'s reason rather than
  # by analogy: `rust.yml`'s `musl` job reads that family `save-if: false`, so
  # without a trunk-side writer the entry is never filled and every pull request
  # pays a cold build of the workspace against a second target. `mise run
  # test:musl` is exactly what the reader runs, which is the condition the
  # `semver-` note below says a warm job must meet before it is worth having.
  cache-warm-musl:
    name: cache-warm-musl
    runs-on: ubuntu-latest
    # Grandfathered for `cache-warm-linux`'s reason: no measured p95 exists for a
    # job that has never run, and a guessed number would read as measured.
    timeout-minutes: 30 # budget: grandfathered measured=2026-09-17
    # A warm job must never be able to red the release lane, exactly as above.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # Pinned to `batten.toml`'s `[[provision]]` version (CLOUD-1672). The
          # digest above pins the ACTION; this pins the MISE it installs, which
          # is a separate resolution the digest does not reach.
          version: 2026.9.1
          # What the `musl` job installs, for its stated reason: `tests/cli.rs`
          # materializes fixtures carrying this repository's `batten.toml`, whose
          # rules spawn hk and jq; opa for `lint_rego.rs`, which judges the
          # corpus with the pinned formatter and fails where it is absent.
          install_args: rust hk aqua:jqlang/jq github:nextest-rs/nextest aqua:open-policy-agent/opa pkl aqua:axodotdev/cargo-dist node
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Read by the compile step below; `ci-local-parity` property 17 holds the
        # `id` and the guard together.
        id: rust-cache
        with:
          # Must match `rust.yml`'s `musl` job exactly or this writes an entry
          # that job cannot read.
          shared-key: musl-
      # Compile only when there is nothing to restore, as every warm job here
      # does.
      - run: mise run test:musl
        if: steps.rust-cache.outputs.cache-hit != 'true'

  cache-warm-darwin-link:
    name: cache-warm-darwin-link
    runs-on: ubuntu-latest
    # THE MATRIX MIRRORS THE READER'S, AND THAT IS NOT DECORATION.
    # `ci-cache-declared` resolves a family from the `shared-key` AS WRITTEN in
    # the workflow, so a writer spelling the expansion (`aarch64-apple-darwin`)
    # while the reader spells `${{ matrix.target }}` is two families to the gate
    # and one to GitHub — measured: `read-family-has-a-warm-writer` fired on
    # `rust.yml`'s `darwin-link` with this job already present. Carrying the same
    # single-leg matrix makes the two keys identical as text, and keeps the
    # reader's own promise that restoring a second leg is a one-word change —
    # it is now one word on each side.
    strategy:
      fail-fast: false
      matrix:
        # BOTH LEGS, because the reader now has both. `rust.yml`'s `darwin-link`
        # gained `x86_64-apple-darwin` (CLOUD-364) and this matrix did not follow
        # it — `read-family-has-a-warm-writer` reported the orphan against
        # `rust.yml:206` on the very next run, which is the gate doing exactly
        # what the note above describes and the reason a family is resolved from
        # the `shared-key` text rather than from its expansion.
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    # Grandfathered for `cache-warm-linux`'s reason: no measured p95 exists for a
    # job that has never run, and a guessed number would read as measured.
    timeout-minutes: 30 # budget: grandfathered measured=2026-09-09
    # A warm job must never be able to red the release lane, exactly as above.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # Pinned to `batten.toml`'s `[[provision]]` version (CLOUD-1672). The
          # digest above pins the ACTION; this pins the MISE it installs, which
          # is a separate resolution the digest does not reach.
          version: 2026.9.1
          # What the `darwin-link` job installs, for its stated reason: zig
          # supplies the Darwin linker, cargo-zigbuild drives cargo through it,
          # and rust is the compiler.
          install_args: rust zig github:rust-cross/cargo-zigbuild
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Read by the compile step below; `ci-local-parity` property 17 holds the
        # `id` and the guard together.
        id: rust-cache
        with:
          # SPELLED EXACTLY AS THE READER SPELLS IT — see the matrix note on
          # this job. rust-cache sees the expansion either way; the gate sees
          # the text, and only this spelling makes the two one family.
          shared-key: ${{ matrix.target }}
      # Compile only when there is nothing to restore, as every warm job here
      # does. `DOCTOR_TARGETS` must match the reader's or this fills a different
      # target's artifacts.
      - run: mise run batten -- ci step --arg-env DOCTOR_TARGETS -- mise run darwin-link --
        if: steps.rust-cache.outputs.cache-hit != 'true'
        env:
          DOCTOR_TARGETS: ${{ matrix.target }}

  # `semver-` IS DELIBERATELY NOT WARMED HERE, and the reason is worth recording
  # so the next reader does not "finish the job". `rust.yml`'s semver block states
  # that it builds RUSTDOC with a different rustc than every other job, which is
  # why it holds its own key at all. A warm job running `cargo build --workspace`
  # would fill that family with host artifacts the reader does not want and still
  # leave the rustdoc build cold — occupying the slot with the wrong content,
  # which is worse than the cold build it replaces. Warming it means running what
  # the reader runs, and `mise run semver` is a COMPARISON against a base rather
  # than a build, so a trunk-side warmer is a different design question.
  # `cross-` has no such split: `mise run cross-check` is exactly what its reader
  # runs, which is why only that one is warmed above.

  cache-warm-windows:
    name: cache-warm-windows
    runs-on: windows-latest
    timeout-minutes: 30 # budget: grandfathered measured=2026-08-21
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # Pinned to `batten.toml`'s `[[provision]]` version (CLOUD-1672). The
          # digest above pins the ACTION; this pins the MISE it installs, which
          # is a separate resolution the digest does not reach.
          version: 2026.9.1
          # Exactly what the `windows` job installs, minus the tools only its
          # assertions need: the cache being filled is a cargo target dir.
          install_args: rust github:nextest-rs/nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # The `id` is load-bearing, not decoration: the compile step below reads
        # this step's `cache-hit` output to decide whether there is anything to
        # warm. `ci-local-parity` property 17 holds the pair together.
        id: rust-cache
        with:
          # Must match `rust.yml`'s `windows` job exactly or this writes an
          # entry that job cannot read. One spelling now, not two — and that
          # job carried `key` where this one carried both, an asymmetry that
          # happened to match and could not be explained from the source.
          shared-key: windows-
      # COMPILE ONLY WHEN THERE IS NOTHING TO RESTORE, and the evidence for this
      # is that every warm cycle after the first was pure waste (CLOUD-840).
      #
      # Read off the cache API on 2026-08-21: the repository held exactly two
      # `v0-rust-windows-…` entries, both the SAME key
      # `v0-rust-windows-Windows_NT-x64-d44ea756-97231082`, created 15:19 on
      # `refs/heads/main` and 15:24 on `refs/pull/572/merge`. Five merges landed
      # between 15:19 and 18:28, several of them touching `crates/**`, and the
      # key never moved. It does not depend on workspace source — only on the
      # toolchain and the dependency set — and `rust-cache` skips saving when the
      # key already exists. So each of those cycles restored 182MB, recompiled
      # `batten` for ~145s, wrote nothing, and cost ~6.4 billed minutes at the 2x
      # Windows multiplier.
      #
      # The recompile is doubly wasted: `rust-cache` runs with
      # `cache-workspace-crates: false`, so the workspace crate's artifacts were
      # never going into the cache this job exists to fill.
      #
      # `cache-hit` is true only on an EXACT key match, which is precisely the
      # case where the post-run save would be a no-op. Guarding on it means the
      # job pays the full compile when the key moves — a dependency bump or a
      # toolchain change, which is what makes a pull request miss — and pays only
      # a runner boot and a restore otherwise.
      #
      # The failure direction is safe by construction: if the action ever stops
      # emitting `cache-hit`, the expression is empty, `!= 'true'` holds, and the
      # compile runs exactly as it does today. The rot that would be silent is
      # the opposite one — the `id` disappearing while the `if` keeps referring to
      # it — and that is what property 17 refuses.
      - run: mise exec -- cargo nextest run --no-run --workspace
        if: steps.rust-cache.outputs.cache-hit != 'true'

  # The warm side of `rust.yml`'s `macos` leg. It exists because that job reads
  # with `save-if: false`, and a read-only family with no writer on the trunk is
  # an entry nothing ever fills — `ci-cache-declared` calls that orphaned, and it
  # is right to: every pull request would pay a cold build of the whole
  # dependency set forever.
  cache-warm-macos:
    name: cache-warm-macos
    runs-on: macos-latest
    # Grandfathered for the `macos` leg's own reason: no run of this job exists
    # to derive a quantile from. `cache-warm-windows` above carries the same
    # marker for the same reason.
    timeout-minutes: 30 # budget: grandfathered measured=2026-09-09
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # Pinned to `batten.toml`'s `[[provision]]` version (CLOUD-1672). The
          # digest above pins the ACTION; this pins the MISE it installs, which
          # is a separate resolution the digest does not reach.
          version: 2026.9.1
          # Exactly what the `macos` job installs, minus the tools only its
          # assertions need: the cache being filled is a cargo target dir.
          install_args: rust github:nextest-rs/nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # The `id` is load-bearing, not decoration: the compile step below reads
        # this step's `cache-hit` output to decide whether there is anything to
        # warm. `ci-local-parity` property 17 holds the pair together.
        id: rust-cache
        with:
          # Must match `rust.yml`'s `macos` job exactly or this writes an entry
          # that job cannot read.
          shared-key: macos-
      # COMPILE ONLY WHEN THERE IS NOTHING TO RESTORE. `cache-hit` is true only
      # on an EXACT key match, which is precisely the case where the post-run
      # save would be a no-op — so this pays the full compile when the key moves
      # (a dependency bump or a toolchain change, which is what makes a pull
      # request miss) and only a runner boot and a restore otherwise. CLOUD-840
      # measured the ungated version: every warm cycle after the first restored,
      # recompiled and wrote nothing.
      #
      # The failure direction is safe by construction: if the action ever stops
      # emitting `cache-hit` the expression is empty, `!= 'true'` holds, and the
      # compile runs as it does today. The silent rot is the opposite one — the
      # `id` disappearing while the `if` still names it — and property 17
      # refuses that.
      #
      # `--no-run` builds without executing: this job fills a cache and is not a
      # test leg, and `foreign-cargo-is-the-declared-spelling` excludes a
      # `--no-run` line from its drift comparison for exactly that reason.
      - run: mise exec -- cargo nextest run --no-run --workspace
        if: steps.rust-cache.outputs.cache-hit != 'true'

  release-plz:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: grandfathered measured=2026-08-10
    # What this job actually does: opens and updates the release PR, and pushes
    # the release commit and its tag.
    permissions:
      contents: write
      pull-requests: write
      actions: read # the release guard's last settings run (CLOUD-2033)
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      # A BOOLEAN, NEVER THE SECRET: a step's `if:` cannot read `secrets`, so the
      # guard below reads whether one is set through this, and the value itself
      # never leaves the secrets context.
      RELEASE_PLZ_TOKEN_SET: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
    steps:
      # THE `||` IS A SILENT DOWNGRADE, AND THIS IS WHERE IT STOPS BEING ONE
      # (CLOUD-94). `${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}`
      # appears three times below and three more in `auto-release-land.yml`. With
      # the secret absent, every one of them silently becomes the default job
      # token and the run reports green — indistinguishable from a correct
      # release, and less capable in the one way that matters: GitHub fires NO
      # workflow events for the default token, so a tag cut under it reaches no
      # `release-artifacts` run and publishes with no binaries. That is exactly
      # how v0.0.159, v0.0.160 and v0.0.161 shipped (CLOUD-1789).
      #
      # THE FALLBACK IS KEPT, because on a fork or a secretless checkout it is
      # correct — there the default token is the only credential there is, and
      # refusing would remove a capability rather than protect anything. What is
      # refused is the fallback being taken SILENTLY on the canonical repository,
      # which is the only place a release is actually cut.
      #
      # The same shape as "Release tracking requires its credential" below, and
      # for its reason stated there: the secret is asserted to exist, nothing in
      # this tree can confirm it, so a step is where a wrong assertion surfaces.
      # FIRST, before anything consumes the credential — a guard after the
      # checkout it guards would be reporting on work already done.
      #
      # `github.event.repository.fork` rather than a repository name: a literal
      # here would go stale on a rename and says nothing a fork check does not.
      # The App migration does not retire this guard — a missing
      # APP_ID/APP_PRIVATE_KEY lands in the identical `||`.
      #
      # The predicate is the step's `if:`, so the body is only the failure: it
      # runs, and fails, exactly when the secret is empty on the canonical
      # repository (CLOUD-843). The name is the message a failed run shows.
      - name: RELEASE_PLZ_TOKEN is empty, so every credential below would fall back to the default job token and the tag would publish with no binaries (CLOUD-1789) - set the secret, do not remove this guard
        if: github.event.repository.fork != true && env.RELEASE_PLZ_TOKEN_SET != 'true'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5 (CLOUD-404 retry fix, now a release)
        with:
          # Pinned to `batten.toml`'s `[[provision]]` version (CLOUD-1672), like
          # the three cache-warm steps above. This is the step that cuts the
          # release, so leaving it resolving latest is what published v0.0.152
          # with no binaries.
          version: 2026.9.1
          # The engine, `release-plz release-pr`, and `gh pr list` (CLOUD-2553).
          install_args: rust aqua:release-plz/release-plz aqua:cli/cli
      # release-plz clones the repo into a temp dir; `git fetch origin main` there
      # has no credentials (actions/checkout's auth lives only on the main clone),
      # so it cannot rebase the release branch onto main — the PR is then re-opened
      # on a stale base and can never fast-forward. An insteadOf carrying the
      # token gives every github.com git operation (including that temp clone) a
      # credential. It travels as `GIT_CONFIG_*` environment on the two steps
      # that clone, which git reads as configuration, so no step writes a global
      # config and no later step inherits the credential.
      # THIS JOB NO LONGER TAGS, PUBLISHES, DISPATCHES OR TRACKS (CLOUD-2033).
      # `mise run release` tagged `HEAD` and created a draft on every push to
      # `main`, so `main` pinned an unpublished tag from the push until the build
      # published it — on every one of the 13 pin moves in 30 days. The release
      # is cut now from the release PR's head BEFORE it lands
      # (`auto-release-land.yml`'s cut), built and published by
      # `release-artifacts.yml`, whose `land` job moves `main`, marks it latest
      # and records it in Linear. `release-plz.toml` turns off its tag and its
      # GitHub release.
      #
      # NOTHING IS OPENED OR REFRESHED BEFORE B2: the release PR is gated on the
      # release guard's `settings` job being green on `main`, built from the
      # tree because the verb ships there first.
      - name: Is the release guard's settings job green on main?
        id: settings
        env:
          BATTEN_GITHUB_TOKEN: ${{ github.token }}
        run: mise run batten -- ci step --verdict green --on 0=true --on 2=false -- mise run batten -- release settings --last-run release-guard.yml
      - run: mise run release-pr
        if: steps.settings.outputs.green == 'true'
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/

      # THE ENGINE PIN MOVES WITH THE VERSION, IN THE RELEASE PR ITSELF (CLOUD-2063).
      # `batten.toml` pins `engine = { release = "v<X>" }`, and every build checks
      # the pin against its own version before the config is parsed — so a release
      # PR that bumps `Cargo.toml` to the next version without moving the pin would
      # refuse its own config in CI. release-plz writes that PR and knows nothing
      # of the pin, so the pin is moved here, onto the PR's head, after it.
      #
      # LAST IN THE JOB, because the steps above read `HEAD` as the commit this
      # push shipped and these check out another one.
      #
      # THE PIN MOVES BEFORE ANY OTHER VERB RUNS ON THAT TREE. Until it does, the
      # tree pins the previous release, and a non-`engine` verb would update itself
      # to it (CLOUD-2062); `engine pin` is an `engine` verb and never does.
      - name: Find the open release PR's branch
        id: release-branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        # `head:` matches a branch PREFIX. A fork's PR whose branch shares it names
        # a branch origin does not have, so the fetch below refuses and nothing is
        # pushed; no filter here needs a shell to spell.
        run: mise run batten -- ci step --capture branch -- gh pr list --state open --search head:release-plz- --json headRefName --jq '.[0].headRefName // empty'
      - name: Fetch the release PR's head
        if: steps.release-branch.outputs.branch != ''
        env:
          BRANCH: ${{ steps.release-branch.outputs.branch }}
        run: mise run batten -- ci step --arg-env BRANCH -- git fetch origin
      - name: Check out the release PR's head
        if: steps.release-branch.outputs.branch != ''
        run: git checkout --detach FETCH_HEAD
      - name: Move the engine pin to the release PR's version
        if: steps.release-branch.outputs.branch != ''
        run: mise run batten -- engine pin version
      - name: Did the pin move?
        id: pin
        if: steps.release-branch.outputs.branch != ''
        run: mise run batten -- ci step --verdict moved --on 0=false --on 1=true -- git diff --quiet -- batten.toml
      - name: Commit the moved pin
        if: steps.pin.outputs.moved == 'true'
        run: 'git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore: move the engine pin to the release version" -- batten.toml'
      - name: Push the moved pin onto the release PR
        if: steps.pin.outputs.moved == 'true'
        env:
          REFSPEC: HEAD:refs/heads/${{ steps.release-branch.outputs.branch }}
        run: mise run batten -- ci step --arg-env REFSPEC -- git push origin
