version: 2

# THIS FILE IS A SHIM NOW, AND IT HAS EXACTLY ONE JOB (CLOUD-658): give a
# Dependabot SECURITY pull request a subject `commit-lint` will accept. Every
# version-update lane it used to run has been handed to Renovate — `mise.toml`,
# which Dependabot has no `package-ecosystem` for at any setting (CLOUD-655);
# `github-actions` (CLOUD-657); and `cargo`, in this commit. What remains is one
# entry at `open-pull-requests-limit: 0`, which is GitHub's documented shape for
# "security updates only".
#
# WHY THE FILE SURVIVES AT ALL, since it now proposes no version bump. Dependabot
# security updates are a REPOSITORY SETTING and keep running whether or not this
# file exists. Without it they revert to the default `Bump X from A to B`
# subject, which carries no type prefix, fails the commit-lint gate
# (`[commit].subject_pattern` in batten.toml), and could therefore never land — every commit
# here lands by fast-forward through that gate. `commit-message.prefix` is the
# whole remaining mechanism.
#
# Deleting it is a different and more dangerous act than emptying it, which is
# why it is a different issue: CLOUD-659 proves Renovate's vulnerability lane
# actually opens a PR that lands, and only then does CLOUD-660 switch Dependabot
# off and delete this file.
#
# `ci-local-parity`'s property 14 is what keeps the shim a shim. It reads an
# entry with a non-zero limit as a VERSION-UPDATE lane, so raising the number
# below puts `cargo` under two bots at once and reds the gate — the shim cannot
# quietly become a second updater.
updates:
  - package-ecosystem: cargo
    directory: "/"
    # Zero is the whole shim: no version-update PR is ever opened, and security
    # PRs are unaffected because they do not come from this file.
    open-pull-requests-limit: 0
    # Kept although nothing here proposes a version any more. `rebase-strategy`
    # governs any PR on a `dependabot/*` head, security ones included, and the
    # default force-pushes a rebase on every base move — which on a Ready head is
    # a `synchronize` and another full matrix (CLOUD-596). A security PR is
    # exactly the head we least want re-proposed while someone reviews it.
    rebase-strategy: disabled
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    # No `ignore:` entries, and their absence is gated rather than incidental.
    # Two crates were listed here to mirror MSRV caps in Cargo.toml — the bot
    # cannot read a cap, so proposing them asked a question the manifest had
    # already answered, and one unbuildable member reddened the whole grouped
    # batch (CLOUD-344). CLOUD-593 removed both caps by raising the floor to the
    # toolchain pin, so both entries went with them. `cap-drift` holds the two
    # files equal in BOTH directions, which is the half-lift this pair could
    # otherwise land silently: lifting the manifest cap alone leaves the bot
    # withholding a crate the manifest now admits, and nothing goes red.

# WHAT THE MOVED LANES TOOK WITH THEM, so nothing reads as dropped. Grouping
# (`groups: cargo/actions: patterns: ["*"]`) is `groupName` in
# `renovate.json5`'s `packageRules`; the 7-day cooldown is `minimumReleaseAge`;
# `open-pull-requests-limit: 1` is `prConcurrentLimit`; `rebase-strategy:
# disabled` is `rebaseWhen: "never"`. And one thing arrives that could not be
# bought here at any price: `draftPR`. Dependabot's schema has no draft knob, so
# every head it proposed opened Ready and bought a full matrix on arrival —
# measured over `dependabot/*` since 2026-08-06 at 13 `ci.yml` runs, 13
# `commit-lint`, 3 `zizmor`, and not one skip among them (CLOUD-596). Every
# `pull_request` workflow here gates on `draft == false`, so that floor is now
# zero.
