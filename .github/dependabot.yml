version: 2

# Grouped, unhurried dependency updates. A 7-day cooldown lets churny releases
# settle before a PR opens. The github-actions ecosystem is what keeps the
# SHA-pinned action references (see the workflows) current: pin, then let the bot
# raise the bumps. Keep updates MSRV-compatible rather than forcing an MSRV bump.
#
# Every commit in this repo must be Conventional Commits (the commit-lint gate,
# CONVENTIONAL_RE in mise.toml) because PRs land by fast-forward. Dependabot's
# default "Bump X from A to B" subject has no type prefix and would fail that
# gate — so a bot PR could never land. The commit-message.prefix settings below
# make Dependabot emit "ci(deps): ..." / "build(deps): ..." so its PRs pass
# commit-lint and are fast-forwardable like any other.
#
# AND NOTHING HERE CAN OPEN A DRAFT, WHICH IS WHY THE TWO KEYS BELOW EXIST
# (CLOUD-596). Every `pull_request` workflow gates on `draft == false`, so every
# other lane iterates free until it is deliberately readied; release-plz has
# `pr_draft` and `ci-local-parity` property 4 senses it. Dependabot's schema has no
# equivalent, so every head it proposes opens Ready and buys a full matrix on
# arrival — measured over `dependabot/*` since 2026-08-06: 13 `ci.yml` runs, 13
# `commit-lint`, 3 `zizmor`, and not one skip among them.
#
# The cost is the churn, not the schedule. On this weekly interval the cargo group
# PR was superseded five times in seventeen hours — each recreation a fresh Ready
# head buying a fresh full matrix, each earlier one closed unlanded, and one of
# them taking three `ci.yml` runs by itself. `rebase-strategy: disabled` is the
# lever: the default force-pushes a rebase whenever the base moves, and on a Ready
# PR each force-push is a `synchronize` and another matrix. With rebasing off a
# stale PR could instead be joined by a sibling proposing the same group, doubling
# the floor, so `open-pull-requests-limit: 1` bounds the lane to one open PR per
# ecosystem. `auto-dependabot-land.yml` asks for the one rebase deliberately, when
# a green head is no longer a fast-forward.
#
# What this does NOT buy: the floor is one full matrix per SHA Dependabot proposes.
# It removes the repeated ones, not the first.
updates:
  - package-ecosystem: cargo
    directory: "/"
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    # No `ignore:` entries, and their absence is now gated rather than incidental.
    # Two crates were listed here to mirror MSRV caps in Cargo.toml — the bot
    # cannot read a cap, so proposing them asked a question the manifest had
    # already answered, and one unbuildable member reddened the whole grouped
    # batch (CLOUD-344). CLOUD-593 removed both caps by raising the floor to the
    # toolchain pin, so both entries went with them. `cap-drift` holds the two
    # files equal in BOTH directions, which is the half-lift this pair could
    # otherwise land silently: lifting the manifest cap alone leaves the bot
    # withholding a crate the manifest now admits, and nothing goes red.
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
